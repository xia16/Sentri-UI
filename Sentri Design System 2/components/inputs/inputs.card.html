<body style="padding:20px 24px;background:var(--paper)"><div id="root"></div>
<script type="text/babel">
const {Input,Select,Stepper}=window.SentriDesignSystem_44ba05;
function InputsDemo(){
  const [q,setQ]=React.useState('');
  const [r,setR]=React.useState('');
  const [n,setN]=React.useState(12);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}}>
    <Input label="Ear tag" icon="search" placeholder="Scan or type ID" value={q} onChange={setQ}/>
    <Select label="Result" placeholder="Choose result" options={['Pregnant','Not pregnant','Recheck']} value={r} onChange={setR}/>
    <Input label="Feed amount" suffix="kg" value="4.5" error="Above curve maximum"/>
    <Stepper label="Born alive" value={n} onChange={setN} max={30}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<InputsDemo/>);
