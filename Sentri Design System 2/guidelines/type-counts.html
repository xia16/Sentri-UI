<!-- @dsCard group="Type" viewport="700x160" name="Counts" subtitle="Glanceable workload numbers — always with a denominator" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head><body style="padding:20px 24px;display:flex;gap:48px;align-items:flex-end;background:var(--paper)">
<div><div style="font:var(--text-count)">31</div><div style="font:var(--text-caption);color:var(--ink-3);text-transform:uppercase;letter-spacing:var(--ls-label);font-weight:600">Due now</div></div>
<div><div style="font:var(--text-count);color:var(--status-overdue)">6</div><div style="font:var(--text-caption);color:var(--ink-3);text-transform:uppercase;letter-spacing:var(--ls-label);font-weight:600">Overdue</div></div>
<div><div style="font:var(--text-count);color:var(--ink-3)">18<span style="font:var(--text-title);color:var(--ink-3)"> of 31</span></div><div style="font:var(--text-caption);color:var(--ink-3);text-transform:uppercase;letter-spacing:var(--ls-label);font-weight:600">Recorded</div></div>
<div style="font:var(--text-caption);color:var(--ink-3);max-width:200px;padding-bottom:6px">--text-count 40/800. Never a bare % — always “x of y”.</div>
</body></html>
