<body>
<header class="board-header"><h1>Treatment: style variants</h1><p>Same two screens in four styles. Pick a direction; it then rolls out to the other Action pages.</p></header>
<main class="board" id="board"></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Full-size treatment screen"><div class="overlay-toolbar"><span id="overlay-title"></span><div><button id="previous" aria-label="Previous screen">←</button><button id="next" aria-label="Next screen">→</button><button id="close" aria-label="Close full-size screen">✕</button></div></div><div class="overlay-stage" id="overlay-stage"></div></div>

{id:'C',name:'Dense operations',font:'IBM Plex Sans',text:13,control:32,pad:16,radius:'.25rem',grey:'#f1f5f9',primary:'#0f172a',foreground:'#0f172a',muted:'#475569',border:'#dbe2ea',input:'#cbd5e1',shadow:'none',edge:'1px solid var(--border)',layout:'paired',spec:['IBM Plex Sans · 13 px','32 px controls & rows · 16 px padding','0.25rem','1 px border · no shadow','Blue-slate · #f1f5f9','Slate-900 · #0f172a','Sections · paired fields']},

function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${name==='info'?'<circle cx="12" cy="12" r="9"/>':''}${name==='people'?'<circle cx="9" cy="7" r="4"/>':''}<path d="${paths[name]||paths.plus}"/></svg>`}
function btn(text,variant='outline',ic='',extra=''){return `<button type="button" class="button ${variant} ${extra}"${!text?` aria-label="${({plus:'Add attachment',mic:'Microphone',arrow:'Send message'})[ic]||ic}"`:''}>${ic?icon(ic):''}${text}</button>`}
function select(value,label){return `<button type="button" class="select-trigger" aria-label="${label}: ${value}" aria-haspopup="listbox" aria-expanded="false"><span>${value}</span>${icon('down')}</button>`}
function number(value,label,min=0){return `<input class="input" type="number" aria-label="${label}" value="${value}" min="${min}" step="${min===.5?.5:1}">`}
function field(label,content,optional=false){return `<div class="field"><div class="label">${label}${optional?'<span class="optional">optional</span>':''}</div>${content}</div>`}
function section(title,help,content,action=''){return `<section class="form-section"><div class="section-heading"><div><h2>${title}</h2><p class="section-help">${help}</p></div>${action}</div><div class="section-fields">${content}</div></section>`}
function newTreatment(v){return `<div class="context-strip">${icon('map')}<span class="context-copy">4 sows from the farm view · Batch 32 ·</span>${['B15','B20','D40','D41'].map(x=>`<button class="badge outline" aria-label="Remove ${x}">${x}${icon('close')}</button>`).join('')}${btn('Back to the farm','ghost','','back')}</div><div class="page-scroll"><div class="form-body"><h1>New treatment</h1>${section('Why','What it is for',field('Diseases and symptoms',`<div class="tag-input"><span class="badge secondary">Lameness</span><span class="badge secondary">Fever</span><input class="input" aria-label="Add a disease or symptom" placeholder="Add a disease or symptom"></div>`,true))}${section('Prescription','What is given and how often',`<div class="field-grid">${field('Medicine',select('Veterinary drug › Amoxicillin 15% LA','Medicine'))}${field('Brand or form',select('Injectable suspension · 100 mL bottle','Brand or form'))}${field('Method',select('Intramuscular','Method'))}${field('Dose',`<div class="joined">${number(15,'Dose',.5)}${select('mL','Dose unit')}</div>`)}${field('Start',`<div class="date-field"><input class="input" type="date" aria-label="Start date" value="2026-11-05"><span>Thu 5 Nov</span></div>`)}<div class="field"><div class="label">&nbsp;</div><div class="switch-line"><button type="button" class="switch" role="switch" aria-checked="true" aria-label="Several doses"></button><span class="label">Several doses</span></div></div>${field('Doses',number(3,'Doses',2))}${field('Every',`<div class="joined">${number(24,'Interval',1)}${select('hours','Interval unit')}</div>`)}</div><div class="medicine-foot"><p>${icon('info')}Withdrawal 14 days, from the medicine record</p><button type="button" class="button ghost icon-button" disabled aria-label="Delete medicine">${icon('trash')}</button></div><div class="separator"></div>${btn('Add medicine','ghost','plus','add-medicine')}`,btn('From an earlier prescription','outline','history','compact'))}${section('Notes','For the team',`<textarea class="textarea" aria-label="Notes" placeholder="Anything the team should know"></textarea>`)}</div></div><footer class="save-bar"><div class="save-summary">4 sows · Amoxicillin · 3 doses, every 24 hours<p>Tasks go to the phones once issued.</p></div><div class="save-buttons">${btn('Cancel')}${btn('Issue treatment','default')}</div></footer>`}
const doseData=[{label:'Dose 1 · Thu 5 Nov',done:3,skipped:1,removed:0,pending:0,state:'Given'},{label:'Dose 2 · Fri 6 Nov',done:2,skipped:0,removed:0,pending:2,state:'Now'},{label:'Dose 3 · Sat 7 Nov',done:0,skipped:0,removed:0,pending:4,state:'Waiting'}];
function chart(){return `<svg class="dose-chart" viewBox="0 0 560 144" role="img" aria-label="Dose 1: 3 done, 1 skipped. Dose 2: 2 done, 2 pending. Dose 3: 4 pending.">${doseData.map((d,i)=>{const y=10+i*48;let x=172;return `<text x="0" y="${y+17}">${d.label}</text>${['done','skipped','removed','pending'].map(s=>{const n=d[s];if(!n)return '';const w=n*64;const start=x;x+=w;return `<rect x="${start}" y="${y+3}" width="${w-3}" height="20" rx="3" fill="${s==='pending'?'white':`var(--${s})`}" stroke="${s==='pending'?'var(--pending)':'none'}"/><text x="${start+(w-3)/2}" y="${y+17}" text-anchor="middle" style="fill:${s==='pending'?'var(--muted-foreground)':'white'}">${n}</text>`}).join('')}<rect x="453" y="${y}" width="102" height="27" rx="5" fill="${i===0?'var(--done-fill)':i===1?'#f4f4f5':'transparent'}" stroke="${i===2?'var(--input)':'none'}"/><text class="state-text" x="504" y="${y+18}" text-anchor="middle" style="fill:${i===0?'var(--done)':'var(--muted-foreground)'}">${d.state}</text>`}).join('')}</svg><div class="legend"><span><i></i>Done</span><span><i class="skipped"></i>Skipped</span><span><i class="removed"></i>Removed</span><span><i class="pending"></i>Pending</span></div>`}
function card(title,body,footer=''){return `<section class="card"><div class="card-header"><h2 class="card-title">${title}</h2></div><div class="card-content">${body}</div>${footer?`<div class="card-footer">${footer}</div>`:''}</section>`}
function mark(status){return `<span class="status-mark ${status}" role="img" aria-label="${status}">${{done:'✓',skipped:'⏭',pending:'○',waiting:'—'}[status]}</span>`}
function runningTreatment(v){return `<div class="page-scroll running-scroll"><div class="running-body"><header class="running-header"><div class="running-title"><h1>Treatment RX-25G009</h1><span class="badge running">Running</span></div><p class="muted">4 sows · Gestation 2 · Batch 32 · issued Thu 5 Nov 08:30 by Li Wei</p><div class="disease-chips"><span class="badge outline">Lameness</span><span class="badge outline">Fever</span></div></header><div class="stats"><section class="card stat"><div class="card-header"><h2 class="card-title">Current dose</h2></div><div class="card-content"><strong>2 of 3</strong><p class="small muted">since Fri 6 Nov 08:30</p></div></section><section class="card stat"><div class="card-header"><h2 class="card-title">Dose 2 given</h2></div><div class="card-content"><strong>2 of 4 sows</strong><div class="progress" role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="4" aria-label="Dose 2 given"><span></span></div></div></section><section class="card stat next"><div class="card-header"><h2 class="card-title">Next dose</h2></div><div class="card-content"><strong>Sat 7 Nov 08:30</strong><p class="small muted">every 24 hours</p></div></section></div>${card('Doses',chart())}${card('Sows',`<table class="table"><thead><tr>${['Sow','Pen','Dose 1','Dose 2','Dose 3'].map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${[['B15','14','done','done'],['B20','14','done','done'],['D40','22','done','pending'],['D41','22','skipped','pending']].map(r=>`<tr><td>${r[0]}</td><td>Pen ${r[1]}</td><td>${mark(r[2])}</td><td>${mark(r[3])}</td><td>${mark('waiting')}</td></tr>`).join('')}</tbody></table>`,`<p class="reason">D41 · dose 1 skipped: could not stand (Wang Fang, Thu 5 Nov 08:52)</p>`)}${card('Prescription',`<div class="prescription-detail"><strong>Amoxicillin 15% LA</strong><p>Injectable suspension · Intramuscular · 15 mL a sow</p><p>3 doses, every 24 hours</p><p class="muted">Withdrawal 14 days (from the medicine record)</p><div class="separator"></div><p><span class="notes">Notes:</span> Keep D40 and D41 on straw</p></div>`)}</div></div>`}
function message(text,time){return `<div class="chat-message"><div class="avatar">VT</div><div class="message-body"><div class="message-meta"><strong>Vet</strong><time>${time}</time></div><p>${text}</p></div></div>`}
function shell(v,screen){const styles={'--font':`'${v.font}'`,'--text':v.text+'px','--control-h':v.control+'px','--pad':v.pad+'px','--radius':v.radius,'--page-grey':v.grey,'--primary':v.primary,'--foreground':v.foreground,'--muted-foreground':v.muted,'--muted':v.grey,'--border':v.border,'--input':v.input,'--card-shadow':v.shadow,'--card-border':v.edge};return `<article class="frame layout-${v.layout}" data-frame="${v.id}${screen}" style="${Object.entries(styles).map(([k,val])=>`${k}:${val}`).join(';')}" aria-label="${v.id} · ${v.name} · ${screen==='a'?'New treatment':'Running treatment'}"><nav class="rail" aria-label="Team"><div class="logo">${icon('leaf')}</div><div class="separator"></div>${['GM','PR','VT','BS','EQ'].map(x=>`<div class="agent ${x==='VT'?'selected':''}"><div class="avatar">${x}</div></div>`).join('')}<div class="separator"></div><div class="agent">${icon('people')}</div><div class="agent">${icon('people')}</div><div class="avatar rail-bottom">A</div></nav><aside class="panel chat"><header class="chat-header"><div class="avatar">VT</div><div><strong>Vet</strong><p>Health, vaccinations, treatments · reports to General Manager</p></div></header><div class="chat-feed"><div class="user-bubble">Treat the four lame sows I picked</div>${message('B15, B20, D40 and D41 are lame on the hind legs; D40 and D41 were 39.8 °C this morning. I filled in the treatment page: Amoxicillin 15% LA, 15 mL into the neck muscle, 3 doses a day apart. Check it and issue it.','08:41')}${screen==='b'?`<div class="day-divider">2 days on</div>${message('Dose 2 is half done: D40 and D41 are still waiting. D41 was skipped on dose 1, could not stand.','08:41')}`:''}</div><div class="chat-bottom"><div class="composer"><span class="badge secondary">${icon('clipboard')}Looking at Treatment</span><div class="composer-placeholder">Ask Vet anything</div><div class="composer-tools">${btn('','outline','plus','icon-button')}${btn('/ Actions','secondary','','compact')}<span class="spacer"></span>${btn('','ghost','mic','icon-button')}${btn('','secondary','arrow','icon-button')}</div></div><p class="chat-disclaimer">Your team can open and fill in pages. Nothing is sent or saved without your OK.</p></div></aside><section class="panel right-pane"><nav class="tab-bar" aria-label="Open pages"><span class="tab">${icon('home')}Home <span class="count">8</span></span><span class="tab">${icon('map')}Farm layout <span class="close">×</span></span><span class="tab active">${icon('clipboard')}Treatment <span class="close">×</span></span><button class="button outline icon-button" aria-label="Expand pane">${icon('expand')}</button></nav>${screen==='a'?newTreatment(v):runningTreatment(v)}</section></article>`}
const allFrames=variants.flatMap(v=>['a','b'].map(screen=>({id:v.id+screen,v,screen})));
const query=new URLSearchParams(location.search).get('frame');
let openIndex=-1,returnFocus=null;
const overlay=document.getElementById('overlay');
function openFrame(index){openIndex=(index+allFrames.length)%allFrames.length;const f=allFrames[openIndex];document.getElementById('overlay-stage').innerHTML=shell(f.v,f.screen);document.getElementById('overlay-title').textContent=`${f.id} · ${f.v.name} · ${f.screen==='a'?'New treatment':'Running treatment'} · 1440 × 900`;overlay.classList.add('open');overlay.scrollTop=0;overlay.scrollLeft=0;document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closeFrame(){overlay.classList.remove('open');document.body.style.overflow='';openIndex=-1;if(returnFocus)returnFocus.focus()}
if(query&&allFrames.some(f=>f.id===query)){const f=allFrames.find(f=>f.id===query);document.body.classList.add('solo');document.body.insertAdjacentHTML('afterbegin',shell(f.v,f.screen));document.title=`${f.id} · ${f.v.name} · Treatment`}else{document.getElementById('board').innerHTML=variants.map(v=>`<section class="variant-row"><aside class="variant-info"><span class="variant-letter">${v.id}</span><h2>${v.name}</h2><dl class="specs">${['Type','Density','Radius','Edges','Grey','Primary','Form layout'].map((x,i)=>`<dt>${x}</dt><dd>${v.spec[i]}</dd>`).join('')}</dl></aside>${['a','b'].map(screen=>`<figure class="preview"><div class="preview-window" tabindex="0" role="button" aria-label="Open ${v.id}${screen} at full size" data-open="${v.id}${screen}">${shell(v,screen)}</div><figcaption>${screen==='a'?'New treatment':'Running treatment'}<span>${v.id}${screen} · 1440 × 900 ↗</span></figcaption></figure>`).join('')}</section>`).join('');const resize=()=>document.querySelectorAll('.preview-window').forEach(el=>{const scale=el.clientWidth/1440;el.style.height=900*scale+'px';el.firstElementChild.style.transform=`scale(${scale})`});new ResizeObserver(resize).observe(document.getElementById('board'));resize();document.querySelectorAll('[data-open]').forEach(el=>{const open=()=>{returnFocus=el;openFrame(allFrames.findIndex(f=>f.id===el.dataset.open))};el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
document.getElementById('close').onclick=closeFrame;document.getElementById('previous').onclick=()=>openFrame(openIndex-1);document.getElementById('next').onclick=()=>openFrame(openIndex+1);overlay.addEventListener('click',e=>{if(e.target===overlay)closeFrame()});document.addEventListener('keydown',e=>{if(openIndex<0)return;if(e.key==='Escape')closeFrame();if(e.key==='ArrowLeft'){e.preventDefault();openFrame(openIndex-1)}if(e.key==='ArrowRight'){e.preventDefault();openFrame(openIndex+1)}if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input,textarea,[tabindex]')].filter(el=>!el.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
</script>
</body>
</html>
