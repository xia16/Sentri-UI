<body>
<header class="board-header"><h1>Treatment · style B</h1><p>Pick the pigs, fill the prescription, issue. Vet can fill it in and comment on a field; you issue.</p><div class="view-toggle" role="group" aria-label="Board view"><button type="button" data-view="page" aria-pressed="true">Page only</button><button type="button" data-view="console" aria-pressed="false">Whole console</button></div></header>
<main class="board" id="board"></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Full-size treatment screen"><div class="overlay-toolbar"><span id="overlay-title"></span><div><button id="previous" aria-label="Previous screen">←</button><button id="next" aria-label="Next screen">→</button><button id="close" aria-label="Close full-size screen">✕</button></div></div><div class="overlay-stage" id="overlay-stage"></div></div>
<template id="pig-list-rule"><section class="rule">
<h2>Pig list: the rule (console)</h2>
<p>One component lists pigs everywhere in the console. A page or an agent configures it; nobody builds a new pig table. Style B tokens apply (Inter 14, 40 px controls, 0.75rem radius, warm stone grey, Sentri green).</p>
<h3>Uses (one component, three modes)</h3>
<table class="table"><thead><tr><th scope="col">Mode</th><th scope="col">Opened by</th><th scope="col">Checkbox</th><th scope="col">Bottom bar</th></tr></thead><tbody><tr><td>Browse</td><td>the Pigs page</td><td>none</td><td>none</td></tr><tr><td>Pick</td><td>an Action (&quot;Pick pigs&quot; for Treatment, Vaccination, Culling…)</td><td>yes</td><td>&quot;N of M picked&quot; · Cancel · <strong>Continue with N sows</strong></td></tr><tr><td>Act</td><td>an agent&#x27;s answer or a saved view</td><td>yes</td><td>&quot;N picked&quot; · <strong>Actions ▾</strong> (opens an Action with them filled in)</td></tr></tbody></table>
<p>The farm view is the other way in: &quot;Pick in the farm view&quot; sits beside the title in Pick mode.</p>
<h3>Base (always there)</h3>
<ul><li>Columns <strong>Pig</strong> (tag, 600) and <strong>Pen</strong>, first and fixed; the checkbox before them in Pick and Act.</li><li>A <strong>filter row</strong>: the page&#x27;s default filters, then <strong>+ Filter</strong>, then <strong>Reset</strong> at the right end.</li><li><strong>Search</strong> under the filter row: &quot;Find a pig in these results&quot;. It narrows only inside the current results; a pig ID alone never lists pigs.</li><li>No unfiltered list: with no filter set, the table is replaced by &quot;Choose a room, batch or finding to see pigs.&quot;</li></ul>
<h3>Defaults per opener (example: Treatment)</h3>
<p>The page that opens the list sets its default filters and columns. Treatment: filters <strong>Room or pen</strong>, <strong>Disease or symptom</strong>, <strong>Status</strong> (triage: Urgent, Priority, Watch); columns <strong>Finding</strong>, <strong>Status</strong>. (Vaccination, Culling and the rest get their own defaults when they are designed.)</p>
<h3>Custom fields</h3>
<ul><li><strong>+ Filter</strong> adds any filter from the filter catalogue (batch, stage, parity, days in stage, last finding, temperature, return-to-heat count…).</li><li><strong>Columns</strong> (a ghost button at the right end of the search row) adds or removes columns from the column catalogue. Pig and Pen cannot be removed.</li><li>Agents use the same two catalogues. An agent&#x27;s search arrives as <strong>one query chip</strong> in the filter row, in plain words with the agent&#x27;s avatar (&quot;Vet · lame in Gestation 2, fever this week&quot;); opening it shows the normal filters it stands for; ✕ removes it. Columns an agent adds look exactly like any other column.</li><li>Every value comes from the data. An agent never writes a value into a cell. A figure that does not exist yet becomes a named metric in the catalogue, with its definition on the column header.</li></ul>
<h3>How values look (one renderer per type)</h3>
<table class="table"><thead><tr><th scope="col">Type</th><th scope="col">Look</th></tr></thead><tbody><tr><td>Number</td><td>right-aligned, tabular figures, unit in the header (&quot;Temp °C&quot;); outside its normal range = red text, nothing else</td></tr><tr><td>Status</td><td>the status badge, one hue per status</td></tr><tr><td>Tags</td><td>up to two quiet tags, then &quot;+N&quot;</td></tr><tr><td>Date</td><td>&quot;Thu 5 Nov&quot;, or &quot;since Wed&quot; for durations</td></tr><tr><td>Short text</td><td>one line, muted; a value that needs more is a detail, not a cell</td></tr></tbody></table>
<ul><li>Any number column sorts; the active sort shows an arrow in its header. Agents may set the sort.</li><li>About six columns fit the 680 px pane. Past that the table scrolls sideways inside itself with checkbox, Pig and Pen pinned, or the pane expands.</li></ul>
<h3>Asking for more</h3>
<p>Complex searches belong in chat. The page says so only where someone is looking for them:</p>
<ul><li>at the bottom of the <strong>+ Filter</strong> menu, below a separator, a quiet line with the agent&#x27;s avatar: &quot;Need something else? Ask Vet in chat.&quot; (the agent is the one this chat is with); clicking it puts the cursor in the chat composer.</li><li>in the empty result: &quot;No pigs match these filters.&quot; + the same line.</li></ul>
<p>No banners, no tooltips, no permanent hint on the page.</p>
<h3>Comments</h3>
<p>An agent may comment on a row, like a field comment on a form: a small avatar marker at the row&#x27;s end; the comment opens under the row with its fix (for example &quot;Untick C12&quot;) and Dismiss.</p>
</section></template>

function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${name==='info'?'<circle cx="12" cy="12" r="9"/>':''}${name==='people'?'<circle cx="9" cy="7" r="4"/>':''}<path d="${paths[name]||paths.plus}"/></svg>`}

function pigSelection(tags=defaultPicked){return `<p class="muted pig-source">${tags.length} ${tags.length===1?'sow':'sows'} · Gestation 2</p><div class="pig-selection"><div class="pig-chips">${tags.map(x=>`<button class="badge outline" aria-label="Remove ${x}">${x}${icon('close')}</button>`).join('')}</div>${btn('Change pigs','ghost','','change-pigs')}</div>`}

function pigPicker(screen='pick'){const agent=screen==='pick-agent',empty=screen==='pick-none',rows=empty?[]:agent?[['D40','22','Lame','Urgent',39.8],['D41','22','Lame, off feed','Urgent',39.8],['B20','14','Lame, hind legs','Priority',39.6]]:pigs;return `<div class="page-scroll"><div class="picker-body">${btn('New treatment','ghost','chevron','picker-back')}<div class="picker-head"><h1>Pick pigs</h1>${btn('Pick in the farm view','outline','map','compact picker-farm')}</div><div class="filters">${agent?`<div class="query-anchor"><span class="badge secondary query-chip"><button type="button" class="query-details" aria-expanded="false"><span class="avatar">VT</span>Vet · lame in Gestation 2, fever this week</button><button type="button" class="remove-query" aria-label="Remove Vet's search">${icon('close')}</button></span><div class="query-filters" hidden>Room: Gestation 2 · Finding: Lameness · Temperature: Fever · Date: This week</div></div>`:`${select('Gestation 2','Room or pen')}${select(empty?'Fever':'Lameness','Disease or symptom')}${select(empty?'Watch':'All statuses','Status')}`}${filterMenu(screen==='pick-filters')}${btn('Reset','ghost','','reset-filters')}</div><div class="search-row"><div class="search-field">${icon('search')}<input class="input" aria-label="Find a pig in these results" placeholder="Find a pig in these results"></div>${btn('Columns','ghost','columns-3','columns-button')}</div>${empty?`<div class="empty-pigs"><p>No pigs match these filters.</p>${askChat()}</div>`:`<table class="table picker-table ${agent?'agent-table':''}" aria-label="Pigs"><thead><tr><th scope="col"><input type="checkbox" class="pick-all" aria-label="Pick all pigs"></th>${['Pig','Pen','Finding',...(agent?['Temp °C']:[]),'Status'].map(x=>`<th scope="col" ${x==='Temp °C'?'class="number" aria-sort="descending"':''}>${x}${x==='Temp °C'?icon('sort-down'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(([tag,pen,finding,status,temp],i)=>`<tr><td><input type="checkbox" data-pig="$ function card(title,body,footer=''){return `<section class="card"><div class="card-header"><h2 class="card-title">${title}</h2></div><div class="card-content">${body}</div>${footer?`<div class="card-footer">${footer}</div>`:''}</section>`}
function mark(status){return `<span class="status-mark ${status}" role="img" aria-label="${status}">${{done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',skipped:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m5 5 10 7-10 7Z"/><path d="M19 5v14" fill="none" stroke-linecap="round" stroke-width="2.5"/></svg>',pending:'',waiting:'—'}[status]}</span>`}
function runningTreatment(v){return `<div class="page-scroll running-scroll"><div class="running-body"><header class="running-header"><div class="running-title"><h1>Treatment RX-25G009</h1><span class="badge running">Running</span></div><p class="muted">4 sows · Gestation 2 · Batch 32 · issued Thu 5 Nov 08:30 by Li Wei</p><div class="disease-chips"><span class="badge outline">Lameness</span><span class="badge outline">Fever</span></div></header><div class="stats"><section class="card stat"><div class="card-header"><h2 class="card-title">Current dose</h2></div><div class="card-content"><strong>2 of 3</strong><p class="small muted">since Fri 6 Nov 08:30</p></div></section><section class="card stat"><div class="card-header"><h2 class="card-title">Dose 2 given</h2></div><div class="card-content"><strong>2 of 4 sows</strong><div class="progress" role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="4" aria-label="Dose 2 given"><span></span></div></div></section><section class="card stat next"><div class="card-header"><h2 class="card-title">Next dose</h2></div><div class="card-content"><strong>Sat 7 Nov 08:30</strong><p class="small muted">every 24 hours</p></div></section></div>${card('Doses',chart())}${card('Sows',`<table class="table"><thead><tr>${['Sow','Pen','Dose 1','Dose 2','Dose 3'].map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${[['B15','14','done','done'],['B20','14','done','done'],['D40','22','done','pending'],['D41','22','skipped','pending']].map(r=>`<tr><td>${r[0]}</td><td>Pen ${r[1]}</td><td>${mark(r[2])}</td><td>${mark(r[3])}</td><td>${mark('waiting')}</td></tr>`).join('')}</tbody></table>`,`<p class="reason">D41 · dose 1 skipped: could not stand (Wang Fang, Thu 5 Nov 08:52)</p>`)}${card('Prescription',`<div class="prescription-detail"><strong>Amoxicillin 15% LA</strong><p>Injectable suspension · Intramuscular · 15 mL a sow</p><p>3 doses, every 24 hours</p><p class="muted">Withdrawal 14 days (from the medicine record)</p><div class="separator"></div><p><span class="notes">Notes:</span> Keep D40 and D41 on straw</p></div>`)}</div></div>`}
function message(text,time){return `<div class="chat-message"><div class="avatar">VT</div><div class="message-body"><div class="message-meta"><strong>Vet</strong><time>${time}</time></div><p>${text}</p></div></div>`}
function shell(v,screen){const styles={'--font':`'${v.font}'`,'--text':v.text+'px','--control-h':v.control+'px','--pad':v.pad+'px','--radius':v.radius,'--page-grey':v.grey,'--primary':v.primary,'--foreground':v.foreground,'--muted-foreground':v.muted,'--muted':v.grey,'--border':v.border,'--input':v.input,'--card-shadow':v.shadow,'--card-border':v.edge,'--t-xs':v.xs+'px','--t-sm':v.sm+'px','--t-ctl':v.ctl+'px','--t-base':v.base+'px','--t-h1':v.h1+'px','--t-h2':v.h2+'px','--t-stat':v.stat+'px','--gap':v.gap+'px','--gap-lg':v.gapLg+'px','--row-h':v.row+'px','--h1-track':v.track};return `<article class="frame layout-${v.layout}" data-frame="${screen}" style="${Object.entries(styles).map(([k,val])=>`${k}:${val}`).join(';')}" aria-label="${v.id} · ${v.name} · ${screen.startsWith('pick')?'Pick pigs':screen==='running'?'Running treatment':'New treatment'}"><nav class="rail" aria-label="Team"><div class="logo">${icon('leaf')}</div><div class="separator"></div>${['GM','PR','VT','BS','EQ'].map(x=>`<div class="agent ${x==='VT'?'selected':''}"><div class="avatar">${x}</div></div>`).join('')}<div class="separator"></div><div class="agent">${icon('people')}</div><div class="agent">${icon('people')}</div><div class="avatar rail-bottom">A</div></nav><aside class="panel chat"><header class="chat-header"><div class="avatar">VT</div><div><strong>Vet</strong><p>Health, vaccinations, treatments · reports to General Manager</p></div></header><div class="chat-feed">${screen==='pick-agent'?`<div class="user-bubble">Show me the lame sows in Gestation 2 that had a fever this week</div>${message('Three sows. They are in the picker, highest temperature first.','09:02')}`:(screen.startsWith('pick')||screen==='form')?message('Six sows in Gestation 2 have new lameness findings since Monday.','07:30'):screen==='filled'?`<div class="user-bubble">Treat the four lame sows I picked</div>${message('I filled in the treatment page: Amoxicillin 15% LA, 15 mL into the neck muscle, 3 doses a day apart. Check it and issue it.','08:41')}`:`<div class="user-bubble">Treat the four lame sows I picked</div>${message('B15, B20, D40 and D41 are lame on the hind legs; D40 and D41 were 39.8 °C this morning. I filled in the treatment page: Amoxicillin 15% LA, 15 mL into the neck muscle, 3 doses a day apart. Check it and issue it.','08:41')}${screen==='running'?`<div class="day-divider">2 days on</div>${message('Dose 2 is half done: D40 and D41 are still waiting. D41 was skipped on dose 1, could not stand.','Sat 08:12')}`:''}` }</div><div class="chat-bottom"><div class="composer"><span class="badge secondary">${icon('clipboard')}Looking at ${screen==='pick-agent'?'Pick pigs':'Treatment'}</span><div class="composer-placeholder" role="textbox" aria-label="Ask Vet anything" contenteditable="true" tabindex="0">Ask Vet anything</div><div class="composer-tools">${btn('','outline','plus','icon-button')}${btn('/ Actions','secondary','','compact')}<span class="spacer"></span>${btn('','ghost','mic','icon-button')}${btn('','secondary','arrow','icon-button')}</div></div><p class="chat-disclaimer">Your team can open and fill in pages. Nothing is sent or saved without your OK.</p></div></aside><section class="panel right-pane"><nav class="tab-bar" aria-label="Open pages"><span class="tab">${icon('home')}Home <span class="count">8</span></span>${screen==='filled'||screen==='running'?`<span class="tab">${icon('map')}Farm layout <span class="close">×</span></span>`:''}<span class="tab active">${icon('clipboard')}Treatment <span class="close">×</span></span><button class="button outline icon-button" aria-label="Expand pane">${icon('expand')}</button></nav>${screen.startsWith('pick')?pigPicker(screen):screen==='running'?runningTreatment(v):newTreatment(v,screen)}</section></article>`}
const titles={pick:'1 · Pick pigs',form:'2 · New treatment, after picking',filled:'3 · Filled in by Vet, with a comment',running:'4 · Running treatment','pick-filters':'5 · Add a filter','pick-agent':"6 · Vet’s search",'pick-none':'7 · No matching pigs'};
const allFrames=['pick','form','filled','running','pick-filters','pick-agent','pick-none'].map(screen=>({id:screen,v:variants[0],screen}));
const query=new URLSearchParams(location.search).get('frame');
let openIndex=-1,returnFocus=null;
const overlay=document.getElementById('overlay');
function openFrame(index){openIndex=(index+allFrames.length)%allFrames.length;const f=allFrames[openIndex];document.getElementById('overlay-stage').innerHTML=shell(f.v,f.screen);document.getElementById('overlay-title').textContent=`${titles[f.id]} · 1440 × 900`;overlay.classList.add('open');overlay.scrollTop=0;overlay.scrollLeft=0;document.body.style.overflow='hidden';document.getElementById('close').focus();initializePicked(document.getElementById('overlay-stage'))}
function closeFrame(){overlay.classList.remove('open');document.body.style.overflow='';openIndex=-1;if(returnFocus)returnFocus.focus()}
if(query&&allFrames.some(f=>f.id===query)){const f=allFrames.find(f=>f.id===query);document.body.classList.add('solo');document.body.insertAdjacentHTML('afterbegin',shell(f.v,f.screen));document.title=`${f.id} · ${f.v.name} · Treatment`}else{document.getElementById('board').innerHTML=`${[ ['Treatment',allFrames.slice(0,4)], ['Pig list',allFrames.slice(4)] ].map(([heading,frames])=>`<section class="board-group"><h2>${heading}</h2><div class="screens">${frames.map(({id,v,screen})=>`<figure class="preview"><div class="preview-window" tabindex="0" role="button" aria-label="Open ${titles[id]} at full size" data-open="${id}"><div inert>${shell(v,screen)}</div></div><figcaption>${titles[id]}<span>1440 × 900 ↗</span></figcaption></figure>`).join('')}</div></section>`).join('')}${document.getElementById('pig-list-rule').innerHTML}`;let view='page';const resize=()=>document.querySelectorAll('.preview-window').forEach(el=>{const w=view==='page'?688:1440,x=view==='page'?748:0;const scale=el.clientWidth/w;el.style.height=900*scale+'px';el.querySelector('.frame').style.transform=`scale(${scale}) translateX(-${x}px)`});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));resize()}));new ResizeObserver(resize).observe(document.getElementById('board'));resize();document.querySelectorAll('[data-open]').forEach(el=>{const open=()=>{returnFocus=el;openFrame(allFrames.findIndex(f=>f.id===el.dataset.open))};el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
document.getElementById('close').onclick=closeFrame;document.getElementById('previous').onclick=()=>openFrame(openIndex-1);document.getElementById('next').onclick=()=>openFrame(openIndex+1);overlay.addEventListener('click',e=>{if(e.target===overlay)closeFrame()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){const menu=document.querySelector('.solo .filter-menu:not([hidden]),#overlay-stage .filter-menu:not([hidden])');if(menu){menu.hidden=true;const trigger=menu.previousElementSibling;trigger.setAttribute('aria-expanded','false');trigger.focus();return}}if(e.target.isContentEditable||e.target.matches('input,textarea'))return;if(openIndex<0)return;if(e.key==='Escape')closeFrame();if(e.key==='ArrowLeft'){e.preventDefault();openFrame(openIndex-1)}if(e.key==='ArrowRight'){e.preventDefault();openFrame(openIndex+1)}if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input,textarea,[tabindex]')].filter(el=>!el.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
// Keep the originating form node so returning from the picker preserves its draft.
const pickerOrigins=new WeakMap();
function initializePicked(root){root.querySelectorAll('[data-frame^="pick"]').forEach(updatePicked)}
function pickedTags(frame){return [...frame.querySelectorAll('[data-pig]:checked')].map(c=>c.dataset.pig)}
function updatePicked(frame){const total=frame.querySelectorAll('[data-pig]').length,n=pickedTags(frame).length,all=frame.querySelector('.pick-all'),button=frame.querySelector('.continue-pigs');if(all){all.checked=n===total;all.indeterminate=n>0&&n<total}frame.querySelector('.picked-count').textContent=total?`${n} of ${total} picked`:'0 picked';button.disabled=n===0;button.textContent=n?`Continue with ${n} ${n===1?'sow':'sows'}`:'Pick at least one pig'}
function createFrame(screen){const template=document.createElement('template');template.innerHTML=shell(variants[0],screen);return template.content.firstElementChild}
function switchFrame(frame,next){frame.replaceWith(next);if(document.body.classList.contains('solo')){history.replaceState(null,'',`?frame=${next.dataset.frame}`);document.title=`${next.dataset.frame} · ${variants[0].name} · Treatment`}else{openIndex=allFrames.findIndex(f=>f.id===next.dataset.frame);document.getElementById('overlay-title').textContent=`${titles[next.dataset.frame]} · 1440 × 900`}next.querySelector('.right-pane button')?.focus()}
function returnToForm(frame,apply){const origin=pickerOrigins.get(frame),next=origin||createFrame('form');if(apply){const tags=pickedTags(frame);next.dataset.picked=tags.join(',');next.querySelector('.form-section .section-fields').innerHTML=pigSelection(tags);const summary=next.querySelector('.save-picked');if(summary)summary.textContent=`${tags.length} ${tags.length===1?'sow':'sows'} picked`}switchFrame(frame,next)}
initializePicked(document);
document.addEventListener('change',e=>{const frame=e.target.closest('.frame');if(!frame||frame.closest('.preview-window'))return;if(e.target.matches('.pick-all'))frame.querySelectorAll('[data-pig]').forEach(c=>c.checked=e.target.checked);if(e.target.matches('[data-pig],.pick-all'))updatePicked(frame)});
document.addEventListener('click',e=>{const frame=e.target.closest('.frame');if(!frame||frame.closest('.preview-window'))return;const row=e.target.closest('.picker-table tbody tr');if(row&&!e.target.matches('input')){const checkbox=row.querySelector('input');checkbox.checked=!checkbox.checked;updatePicked(frame);return}const button=e.target.closest('button');if(!button)return;
if(button.matches('.add-filter')){const menu=button.nextElementSibling;menu.hidden=!menu.hidden;button.setAttribute('aria-expanded',String(!menu.hidden))}
if(button.matches('.ask-chat')){const menu=frame.querySelector('.filter-menu');menu.hidden=true;frame.querySelector('.add-filter').setAttribute('aria-expanded','false');frame.querySelector('.composer-placeholder').focus()}
if(button.matches('.query-details')){const detail=frame.querySelector('.query-filters');detail.hidden=!detail.hidden;button.setAttribute('aria-expanded',String(!detail.hidden))}
if(button.matches('.remove-query,.reset-filters')){const pane=frame.querySelector('.right-pane');pane.querySelector('.page-scroll').remove();pane.querySelector('.save-bar').remove();pane.insertAdjacentHTML('beforeend',`<div class="page-scroll"><div class="picker-body"><div class="picker-head"><h1>Pick pigs</h1></div><div class="filters">${filterMenu(false)}</div><div class="search-row"><div class="search-field">${icon('search')}<input class="input" placeholder="Find a pig in these results" aria-label="Find a pig in these results"></div>${btn('Columns','ghost','columns-3')}</div><div class="empty-pigs"><p>Choose a room, batch or finding to see pigs.</p></div></div></div><footer class="save-bar"><span>0 picked</span>${btn('Cancel','outline','','picker-cancel')}<button class="button default" disabled>Pick at least one pig</button></footer>`)}
if(button.matches('.change-pigs')){const next=createFrame('pick'),tags=frame.dataset.picked?.split(',')||defaultPicked;next.querySelectorAll('[data-pig]').forEach(c=>c.checked=tags.includes(c.dataset.pig));pickerOrigins.set(next,frame);updatePicked(next);switchFrame(frame,next)}
if(button.matches('.continue-pigs'))returnToForm(frame,true);
if(button.matches('.picker-back,.picker-cancel'))returnToForm(frame,false);
if(button.matches('.apply-method,.dismiss-comment')){const method=frame.querySelector('.method-control');if(button.matches('.apply-method')){method.querySelector('span').textContent='Intramuscular';method.querySelector('button').setAttribute('aria-label','Method: Intramuscular')}method.classList.remove('has-comment');frame.querySelector('.agent-comment').remove()}if(button.matches('.reply-comment')){frame.querySelector('.composer-placeholder').textContent='Reply to Vet about Method…'}});
</script>
</body>
</html>
