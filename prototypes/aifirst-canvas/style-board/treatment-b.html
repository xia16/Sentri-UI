<body>
<header class="board-header"><h1>Treatment · style B</h1><p>Pick the pigs, fill the prescription, issue. Vet can fill it in and comment on a field; you issue.</p><div class="view-toggle" role="group" aria-label="Board view"><button type="button" data-view="page" aria-pressed="true">Page only</button><button type="button" data-view="console" aria-pressed="false">Whole console</button></div></header>
<main class="board" id="board"></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Full-size treatment screen"><div class="overlay-toolbar"><span id="overlay-title"></span><div><button id="previous" aria-label="Previous screen">←</button><button id="next" aria-label="Next screen">→</button><button id="close" aria-label="Close full-size screen">✕</button></div></div><div class="overlay-stage" id="overlay-stage"></div></div>
<script>
// Keep the font link dormant offline; every layout also supports system fonts.
if(navigator.onLine){const fonts=document.getElementById("google-fonts");fonts.href=fonts.dataset.href;}
const variants=[{id:'B',xs:12,sm:13,ctl:14,base:14,h1:26,h2:17,stat:24,gap:18,gapLg:26,row:44,track:'-.7px',name:'Sentri green, sectioned',font:'Inter',text:14,control:40,pad:24,radius:'.75rem',grey:'#f5f5f4',primary:'#276640',foreground:'#1c1917',muted:'#57534e',border:'#e7e5e4',input:'#d6d3d1',shadow:'0 1px 3px #1c19170f,0 1px 2px #1c19170a',edge:'0px solid transparent',layout:'sectioned',spec:['Inter · 14 px','40 px controls · 24 px padding','0.75rem','No border · shadow-sm','Warm stone · #f5f5f4','Sentri green · #276640','240 px section label + fields']}];
const paths={search:'m21 21-4.3-4.3M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16',quote:'M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4ZM8 8v4h3V8ZM14 8v4h3V8M8 12l-1 2M14 12l-1 2',chevron:'m9 18 6-6-6-6',down:'m6 9 6 6 6-6',close:'m18 6-12 12M6 6l12 12',plus:'M12 5v14M5 12h14',map:'m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3ZM9 3v15M15 6v15',home:'m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',clipboard:'M9 4H5v17h14V4h-4M9 2h6v4H9ZM8 11h8M8 15h5',history:'M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7v5l3 2',info:'M12 8h.01M12 11v5',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7',expand:'M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0ZM5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8',arrow:'M12 19V5m-7 7 7-7 7 7',people:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M17 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87',leaf:'M12 21v-9M12 15C3 15 3 6 3 6s9-1 9 7c0-10 9-10 9-10s1 11-9 12'};
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${name==='info'?'<circle cx="12" cy="12" r="9"/>':''}${name==='people'?'<circle cx="9" cy="7" r="4"/>':''}<path d="${paths[name]||paths.plus}"/></svg>`}
function btn(text,variant='outline',ic='',extra=''){return `<button type="button" class="button ${variant} ${extra}"${!text?` aria-label="${({plus:'Add attachment',mic:'Microphone',arrow:'Send message'})[ic]||ic}"`:''}>${ic?icon(ic):''}${text}</button>`}
function select(value,label){return `<button type="button" class="select-trigger" aria-label="${label}: ${value}" aria-haspopup="listbox" aria-expanded="false"><span>${value}</span>${icon('down')}</button>`}
function number(value,label,min=0){return `<input class="input" type="number" aria-label="${label}" value="${value}" min="${min}" step="${min===.5?.5:1}">`}
function field(label,content,optional=false){return `<div class="field"><div class="label">${label}${optional?'<span class="optional">optional</span>':''}</div>${content}</div>`}
function section(title,help,content,action=''){return `<section class="form-section"><div class="section-heading"><div><h2>${title}</h2><p class="section-help">${help}</p></div>${action}</div><div class="section-fields">${content}</div></section>`}
const pigs=[['B15','14','Lame, hind legs · since Wed','Priority'],['B20','14','Lame, hind legs · since Thu','Priority'],['D40','22','Lame · 39.8 °C this morning','Urgent'],['D41','22','Lame, off feed · 39.8 °C','Urgent'],['C07','18','Lame, front left · since Mon','Watch'],['C12','18','Stiff gait · since Tue','Watch']];
function pigPicker(){return `<div class="filters">${select('Gestation 2','Room or pen').replace('Room or pen: Gestation 2','Room or pen')}${select('Lameness','Disease or symptom').replace('Disease or symptom: Lameness','Disease or symptom')}${select('All statuses','Status').replace('Status: All statuses','Status')}</div><div class="search-row"><div class="search-field">${icon('search')}<input class="input" aria-label="Find a pig in these results" placeholder="Find a pig in these results"></div>${btn('Reset','ghost')}</div><div class="pig-list">${pigs.map(([tag,pen,finding,status],i)=>`<label class="pig-row"><input type="checkbox" data-pig="${tag}" aria-label="Pick ${tag}" ${i<4?'checked':''}><span class="pig-copy"><span><strong>${tag}</strong> · Pen ${pen}</span><span class="muted">${finding}</span></span><span class="badge ${status.toLowerCase()}">${status}</span></label>`).join('')}</div><div class="picked-foot"><span class="muted picked-count">4 of 6 picked</span>${btn('Pick all','ghost','','pick-all')}${btn('Clear','ghost','','clear-pigs')}</div>`}
function agentComment(){return `<aside class="agent-comment" aria-label="Vet comment on Method"><div class="comment-meta"><span class="avatar">VT</span><strong>Vet</strong><time class="muted">08:44</time></div><p>Not recommended for these sows. D41 has been off feed since Wednesday, so in feed will not reach her. Intramuscular reaches all four.</p><div class="comment-actions">${btn('Use intramuscular','outline','','compact apply-method')}${btn('Dismiss','ghost','','compact dismiss-comment')}<button type="button" class="button ghost icon-button reply-comment" aria-label="Reply in chat">${icon('quote')}</button></div></aside>`}
function newTreatment(v,screen){const filled=screen==='filled';return `<div class="page-scroll"><div class="form-body ${filled?'filled-form':''}"><h1>New treatment</h1>${filled?'<p class="vet-credit muted"><span class="avatar">VT</span>Vet filled this in at 08:41. Check it before you issue.</p>':''}${section('Pigs','Who gets it',filled?`<p class="muted pig-source">4 sows from the farm view · Batch 32 · Gestation 2</p><div class="pig-selection"><div class="pig-chips">${['B15','B20','D40','D41'].map(x=>`<button class="badge outline" aria-label="Remove ${x}">${x}${icon('close')}</button>`).join('')}</div>${btn('Change pigs','ghost','','change-pigs')}</div>`:pigPicker())}${section('Why','What it is for',field('Diseases and symptoms',`<div class="tag-input"><span class="badge secondary">Lameness</span>${filled?'<span class="badge secondary">Fever</span>':''}<input class="input" aria-label="Add a disease or symptom" placeholder="${filled?'':'Add a disease or symptom'}"></div>`,true))}${section('Prescription','What is given and how often',`<div class="field-grid">${field('Medicine',select(filled?'Veterinary drug › Amoxicillin 15% LA':'Choose a medicine','Medicine'))}${field('Brand or form',select(filled?'Injectable suspension · 100 mL bottle':'Choose','Brand or form'))}${field('Method',`<div class="method-control ${filled?'has-comment':''}">${select(filled?'In feed':'Choose a method','Method')}</div>${filled?agentComment():''}`)}${field('Dose',`<div class="joined">${number(filled?15:'','Dose',.5)}${select('mL','Dose unit')}</div>`)}${field('Start',`<div class="date-field"><input class="input" type="date" aria-label="Start date" value="2026-11-05"><span>${filled?'Thu 5 Nov':'Today, Thu 5 Nov'}</span></div>`)}<div class="field"><div class="switch-line"><button type="button" class="switch" role="switch" aria-checked="${filled}" aria-label="Several doses"></button><span class="label">Several doses</span></div></div>${filled?`${field('Doses',number(3,'Doses',2))}${field('Every',`<div class="joined">${number(24,'Interval',1)}${select('hours','Interval unit')}</div>`)}`:''}</div><div class="medicine-foot">${filled?`<p>${icon('info')}Withdrawal 14 days, from the medicine record</p>`:'<span class="spacer"></span>'}<button type="button" class="button ghost icon-button" disabled aria-label="Delete medicine">${icon('trash')}</button></div><div class="separator"></div>${btn('Add medicine','ghost','plus','add-medicine')}`,btn('From an earlier prescription','outline','history','compact'))}${section('Notes','For the team',`<textarea class="textarea" aria-label="Notes" placeholder="Anything the team should know"></textarea>`)}</div></div><footer class="save-bar"><div class="save-summary">${filled?'4 sows · Amoxicillin · 3 doses, every 24 hours<p>Tasks go to the phones once issued.</p>':'<span class="save-picked">4 sows picked</span><p>Add a medicine to issue.</p>'}</div><div class="save-buttons">${btn('Cancel')}${filled?btn('Issue treatment','default'):'<button type="button" class="button default" disabled>Issue treatment</button>'}</div></footer>`}
const doseData=[{label:'Dose 1 · Thu 5 Nov',done:3,skipped:1,removed:0,pending:0,state:'Given'},{label:'Dose 2 · Fri 6 Nov',done:2,skipped:0,removed:0,pending:2,state:'Now'},{label:'Dose 3 · Sat 7 Nov',done:0,skipped:0,removed:0,pending:4,state:'Waiting'}];
function chart(){return `<div class="dose-rows" role="img" aria-label="Dose 1: 3 done, 1 skipped. Dose 2: 2 done, 2 pending. Dose 3: 4 pending.">${doseData.map((d,i)=>`<div class="dose-row"><span class="dose-label">${d.label}</span><div class="dose-bar">${['done','skipped','removed','pending'].filter(k=>d[k]).map(k=>`<span class="${k}" style="flex:${d[k]}">${d[k]}</span>`).join('')}</div><span class="badge ${['given','now','waiting'][i]}">${d.state}</span></div>`).join('')}</div><div class="legend"><span><i></i>Done</span><span><i class="skipped"></i>Skipped</span><span><i class="removed"></i>Removed</span><span><i class="pending"></i>Pending</span></div>`}
function card(title,body,footer=''){return `<section class="card"><div class="card-header"><h2 class="card-title">${title}</h2></div><div class="card-content">${body}</div>${footer?`<div class="card-footer">${footer}</div>`:''}</section>`}
function mark(status){return `<span class="status-mark ${status}" role="img" aria-label="${status}">${{done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',skipped:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m5 5 10 7-10 7Z"/><path d="M19 5v14" fill="none" stroke-linecap="round" stroke-width="2.5"/></svg>',pending:'',waiting:'—'}[status]}</span>`}
function runningTreatment(v){return `<div class="page-scroll running-scroll"><div class="running-body"><header class="running-header"><div class="running-title"><h1>Treatment RX-25G009</h1><span class="badge running">Running</span></div><p class="muted">4 sows · Gestation 2 · Batch 32 · issued Thu 5 Nov 08:30 by Li Wei</p><div class="disease-chips"><span class="badge outline">Lameness</span><span class="badge outline">Fever</span></div></header><div class="stats"><section class="card stat"><div class="card-header"><h2 class="card-title">Current dose</h2></div><div class="card-content"><strong>2 of 3</strong><p class="small muted">since Fri 6 Nov 08:30</p></div></section><section class="card stat"><div class="card-header"><h2 class="card-title">Dose 2 given</h2></div><div class="card-content"><strong>2 of 4 sows</strong><div class="progress" role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="4" aria-label="Dose 2 given"><span></span></div></div></section><section class="card stat next"><div class="card-header"><h2 class="card-title">Next dose</h2></div><div class="card-content"><strong>Sat 7 Nov 08:30</strong><p class="small muted">every 24 hours</p></div></section></div>${card('Doses',chart())}${card('Sows',`<table class="table"><thead><tr>${['Sow','Pen','Dose 1','Dose 2','Dose 3'].map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${[['B15','14','done','done'],['B20','14','done','done'],['D40','22','done','pending'],['D41','22','skipped','pending']].map(r=>`<tr><td>${r[0]}</td><td>Pen ${r[1]}</td><td>${mark(r[2])}</td><td>${mark(r[3])}</td><td>${mark('waiting')}</td></tr>`).join('')}</tbody></table>`,`<p class="reason">D41 · dose 1 skipped: could not stand (Wang Fang, Thu 5 Nov 08:52)</p>`)}${card('Prescription',`<div class="prescription-detail"><strong>Amoxicillin 15% LA</strong><p>Injectable suspension · Intramuscular · 15 mL a sow</p><p>3 doses, every 24 hours</p><p class="muted">Withdrawal 14 days (from the medicine record)</p><div class="separator"></div><p><span class="notes">Notes:</span> Keep D40 and D41 on straw</p></div>`)}</div></div>`}
function message(text,time){return `<div class="chat-message"><div class="avatar">VT</div><div class="message-body"><div class="message-meta"><strong>Vet</strong><time>${time}</time></div><p>${text}</p></div></div>`}
function shell(v,screen){const styles={'--font':`'${v.font}'`,'--text':v.text+'px','--control-h':v.control+'px','--pad':v.pad+'px','--radius':v.radius,'--page-grey':v.grey,'--primary':v.primary,'--foreground':v.foreground,'--muted-foreground':v.muted,'--muted':v.grey,'--border':v.border,'--input':v.input,'--card-shadow':v.shadow,'--card-border':v.edge,'--t-xs':v.xs+'px','--t-sm':v.sm+'px','--t-ctl':v.ctl+'px','--t-base':v.base+'px','--t-h1':v.h1+'px','--t-h2':v.h2+'px','--t-stat':v.stat+'px','--gap':v.gap+'px','--gap-lg':v.gapLg+'px','--row-h':v.row+'px','--h1-track':v.track};return `<article class="frame layout-${v.layout}" data-frame="${screen}" style="${Object.entries(styles).map(([k,val])=>`${k}:${val}`).join(';')}" aria-label="${v.id} · ${v.name} · ${screen==='running'?'Running treatment':'New treatment'}"><nav class="rail" aria-label="Team"><div class="logo">${icon('leaf')}</div><div class="separator"></div>${['GM','PR','VT','BS','EQ'].map(x=>`<div class="agent ${x==='VT'?'selected':''}"><div class="avatar">${x}</div></div>`).join('')}<div class="separator"></div><div class="agent">${icon('people')}</div><div class="agent">${icon('people')}</div><div class="avatar rail-bottom">A</div></nav><aside class="panel chat"><header class="chat-header"><div class="avatar">VT</div><div><strong>Vet</strong><p>Health, vaccinations, treatments · reports to General Manager</p></div></header><div class="chat-feed">${screen==='pick'?message('Six sows in Gestation 2 have new lameness findings since Monday.','07:30'):screen==='filled'?`<div class="user-bubble">Treat the four lame sows I picked</div>${message('I filled in the treatment page: Amoxicillin 15% LA, 15 mL into the neck muscle, 3 doses a day apart. Check it and issue it.','08:41')}`:`<div class="user-bubble">Treat the four lame sows I picked</div>${message('B15, B20, D40 and D41 are lame on the hind legs; D40 and D41 were 39.8 °C this morning. I filled in the treatment page: Amoxicillin 15% LA, 15 mL into the neck muscle, 3 doses a day apart. Check it and issue it.','08:41')}${screen==='running'?`<div class="day-divider">2 days on</div>${message('Dose 2 is half done: D40 and D41 are still waiting. D41 was skipped on dose 1, could not stand.','Sat 08:12')}`:''}` }</div><div class="chat-bottom"><div class="composer"><span class="badge secondary">${icon('clipboard')}Looking at Treatment</span><div class="composer-placeholder">Ask Vet anything</div><div class="composer-tools">${btn('','outline','plus','icon-button')}${btn('/ Actions','secondary','','compact')}<span class="spacer"></span>${btn('','ghost','mic','icon-button')}${btn('','secondary','arrow','icon-button')}</div></div><p class="chat-disclaimer">Your team can open and fill in pages. Nothing is sent or saved without your OK.</p></div></aside><section class="panel right-pane"><nav class="tab-bar" aria-label="Open pages"><span class="tab">${icon('home')}Home <span class="count">8</span></span>${screen!=='pick'?`<span class="tab">${icon('map')}Farm layout <span class="close">×</span></span>`:''}<span class="tab active">${icon('clipboard')}Treatment <span class="close">×</span></span><button class="button outline icon-button" aria-label="Expand pane">${icon('expand')}</button></nav>${screen==='running'?runningTreatment(v):newTreatment(v,screen)}</section></article>`}
const titles={pick:'1 · Pick pigs',filled:'2 · Filled in by Vet, with a comment',running:'3 · Running treatment'};
const allFrames=['pick','filled','running'].map(screen=>({id:screen,v:variants[0],screen}));
const query=new URLSearchParams(location.search).get('frame');
let openIndex=-1,returnFocus=null;
const overlay=document.getElementById('overlay');
function openFrame(index){openIndex=(index+allFrames.length)%allFrames.length;const f=allFrames[openIndex];document.getElementById('overlay-stage').innerHTML=shell(f.v,f.screen);document.getElementById('overlay-title').textContent=`${titles[f.id]} · 1440 × 900`;overlay.classList.add('open');overlay.scrollTop=0;overlay.scrollLeft=0;document.body.style.overflow='hidden';document.getElementById('close').focus()}
function closeFrame(){overlay.classList.remove('open');document.body.style.overflow='';openIndex=-1;if(returnFocus)returnFocus.focus()}
if(query&&allFrames.some(f=>f.id===query)){const f=allFrames.find(f=>f.id===query);document.body.classList.add('solo');document.body.insertAdjacentHTML('afterbegin',shell(f.v,f.screen));document.title=`${f.id} · ${f.v.name} · Treatment`}else{document.getElementById('board').innerHTML=`<section class="screens">${allFrames.map(({id,v,screen})=>`<figure class="preview"><div class="preview-window" tabindex="0" role="button" aria-label="Open ${titles[id]} at full size" data-open="${id}"><div inert>${shell(v,screen)}</div></div><figcaption>${titles[id]}<span>1440 × 900 ↗</span></figcaption></figure>`).join('')}</section>`;let view='page';const resize=()=>document.querySelectorAll('.preview-window').forEach(el=>{const w=view==='page'?688:1440,x=view==='page'?748:0;const scale=el.clientWidth/w;el.style.height=900*scale+'px';el.querySelector('.frame').style.transform=`scale(${scale}) translateX(-${x}px)`});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));resize()}));new ResizeObserver(resize).observe(document.getElementById('board'));resize();document.querySelectorAll('[data-open]').forEach(el=>{const open=()=>{returnFocus=el;openFrame(allFrames.findIndex(f=>f.id===el.dataset.open))};el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
document.getElementById('close').onclick=closeFrame;document.getElementById('previous').onclick=()=>openFrame(openIndex-1);document.getElementById('next').onclick=()=>openFrame(openIndex+1);overlay.addEventListener('click',e=>{if(e.target===overlay)closeFrame()});document.addEventListener('keydown',e=>{if(openIndex<0)return;if(e.key==='Escape')closeFrame();if(e.key==='ArrowLeft'){e.preventDefault();openFrame(openIndex-1)}if(e.key==='ArrowRight'){e.preventDefault();openFrame(openIndex+1)}if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input,textarea,[tabindex]')].filter(el=>!el.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-pig]'))updatePicked(e.target.closest('.frame'))});
function updatePicked(frame){const n=frame.querySelectorAll('[data-pig]:checked').length;frame.querySelector('.picked-count').textContent=`${n} of 6 picked`;frame.querySelector('.save-picked').textContent=`${n} ${n===1?'sow':'sows'} picked`}
document.addEventListener('click',e=>{const button=e.target.closest('button'),frame=button?.closest('.frame');if(!frame||frame.closest('.preview-window'))return;if(button.matches('.pick-all,.clear-pigs')){frame.querySelectorAll('[data-pig]').forEach(c=>c.checked=button.matches('.pick-all'));updatePicked(frame)}if(button.matches('.apply-method,.dismiss-comment')){const method=frame.querySelector('.method-control');if(button.matches('.apply-method')){method.querySelector('span').textContent='Intramuscular';method.querySelector('button').setAttribute('aria-label','Method: Intramuscular')}method.classList.remove('has-comment');frame.querySelector('.agent-comment').remove()}if(button.matches('.reply-comment')){frame.querySelector('.composer-placeholder').textContent='Reply to Vet about Method…'}});
</script>
</body>
</html>
