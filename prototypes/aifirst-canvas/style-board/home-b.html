/* Timeline (rebuild): one label per row, one bar per run of days */
.calendar-page{--label:196px}
.days,.task-row{grid-template-columns:var(--label) repeat(7,minmax(0,1fr)) 28px}
.days{height:40px;border-bottom:1px solid var(--border)}
.day span{display:inline-block;font-size:12px;color:var(--muted-foreground);font-weight:500;padding:3px 8px;border-radius:999px;white-space:nowrap}
.day.past span{color:#a8a29e}
.day.today span{background:#28734F;color:#fff;font-weight:600}
.today-band{left:calc(var(--label) + (100% - var(--label) - 28px)*3/7);width:calc((100% - var(--label) - 28px)/7);background:#f6f9f6;top:40px}
.section-band{height:auto;border-top:0;padding:18px 0 4px 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.days+.section-band{padding-top:12px}
.task-row{height:44px;border-radius:8px}
.task-row:hover,.task-row.forced-hover{background:#f7f7f5}
.row-label{display:flex;align-items:baseline;gap:6px;overflow:visible;padding-left:8px;font-weight:400}
.row-label .task-name{font-size:14px;font-weight:500;color:var(--foreground)}
.row-label .task-batch{font-size:13px;color:var(--muted-foreground)}
.cell-slot{padding:0 1.5px}
.week-cell{height:26px;border:0;border-radius:3px;font-size:12px;font-weight:600;background:#F1F3EE;color:#20291F;box-shadow:none}
.week-cell.first{border-top-left-radius:9px;border-bottom-left-radius:9px}
.week-cell.last{border-top-right-radius:9px;border-bottom-right-radius:9px}
.week-cell.continues{border-top-right-radius:3px;border-bottom-right-radius:3px}
.week-cell.continues:after{content:none}
.week-cell.d,.week-cell.w{background:#E3F0E8;color:#28734F}
.week-cell.o,.week-cell.v,.week-cell.u{background:#EAF1FC;color:#3972B7;box-shadow:inset 0 0 0 1.5px #3972B7}
.week-cell.p{background:#F1F3EE;color:#20291F;border:0}
.week-cell.e{background:transparent;color:#657060;border:1px dashed #9CA59D}
.week-cell.w,.week-cell.v{color:#B34B43;border-left:0}
.week-cell:hover{filter:brightness(.97)}
.new-task{color:var(--muted-foreground)}
/* The farm view's own panel language (ActLayout3JS: OVH) */
.farm-panel.fv{right:16px;top:16px;bottom:auto;max-height:calc(100% - 32px);width:380px;padding:16px 16px 20px;border-radius:22px;background:#F6F7F1;box-shadow:0 2px 6px rgba(17,21,17,.05),0 16px 36px rgba(17,21,17,.12);font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#20291F;font-size:14px;line-height:20px}
.fv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fv-head{display:flex;align-items:center;gap:12px;min-height:44px;padding-right:4px}
.fv-back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:14px;background:#fff;border:1px solid #DFE4D8;color:#20291F;padding:0}
.fv-x{display:flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;margin-right:-4px;color:#657060;background:transparent;border:0;padding:0}
.fv-title{flex:1;display:flex;flex-direction:column;min-width:0}
.fv-title b{font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.fv-title span{font-size:13px;line-height:18px;color:#657060}
.fv-sec{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 8px}
.fv-sec b{font-size:15px;line-height:20px;font-weight:600}
.fv-mu{font-size:13px;color:#657060;white-space:nowrap}
.fv-mu em{font-style:normal;color:#946015}
.fv-badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.fv-badge.blue{background:#EAF1FC;color:#3972B7}
.fv-card{padding:16px;border-radius:16px;background:#fff;border:1px solid #DFE4D8}
.fv-progress{display:flex;align-items:center;gap:20px}
.fv-ring{position:relative;width:132px;height:76px;flex:none}
.fv .fv-ring-svg{position:absolute;inset:0;width:132px;height:76px}
.fv-centre{position:absolute;left:0;right:0;top:30px;display:flex;flex-direction:column;align-items:center}
.fv-centre b{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.03em}
.fv-centre span{font-size:12px;line-height:16px;color:#657060}
.fv-legend{flex:1;display:flex;flex-direction:column}
.fv-legend>span{display:flex;align-items:center;gap:10px;height:36px;font-size:14px}
.fv-legend>span+span{border-top:1px solid #DFE4D8}
.fv-legend i{width:8px;height:8px;border-radius:999px;flex:none}
.fv-legend b{margin-left:auto;font-weight:600}
.fv-rows{padding:0 16px}
.fv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.fv-row+.fv-row{border-top:1px solid #DFE4D8}
.fv-row>span:first-child{display:flex;align-items:baseline;gap:10px}
.fv-row b{font-weight:500}
.fv-wbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;margin-top:20px;border-radius:999px;background:#fff;color:#20291F;border:1px solid #DFE4D8;font:500 14px 'Geist',system-ui,sans-serif}

/* Label column: task left, batch as an aligned tag right */
.row-label{justify-content:space-between;align-items:center;padding:0 14px 0 8px}
.row-label .task-name{font-size:14px;font-weight:500}
.row-label .task-batch{font-size:12px;font-weight:600;color:#44403c;background:#F1F3EE;border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums;letter-spacing:0}
.section-band{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted-foreground);padding:20px 0 4px 8px}

/* Grey page, the whole calendar in one white card (Workable / Wix pattern) */
.schedule-scroll{background:var(--page-grey)}
.calendar-page{padding:24px}

.cal-card{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);border:var(--card-border);overflow:hidden}
.cal-toolbar{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid #efeeec}

.cal-toolbar .cal-nav{min-height:32px;width:32px;padding:0;font-size:16px}
.cal-range{font-size:14px;font-weight:600;margin-left:6px;margin-right:auto;white-space:nowrap}
.calendar-page{--label:200px}
.calendar-grid{margin:0}
.days{height:52px;border-bottom:1px solid #efeeec}
.days>div,.task-row>.cell-slot{border-left:1px solid #f1f0ee;align-self:stretch;display:flex;align-items:center;justify-content:center}

.day.past b{color:#a8a29e}
.day.today b{color:#28734F;outline:0}

.today-band{top:52px;background:#f5f9f5}
.section-band{padding:0 0 0 14px!important;height:30px;display:flex;align-items:center;background:#fafaf9;border-bottom:1px solid #efeeec;font-size:12px!important;font-weight:600;color:var(--muted-foreground)}
.days+.section-band{padding-top:0!important}
.task-row{height:44px;border-radius:0;border-bottom:1px solid #f1f0ee}

.row-label{padding:0 12px 0 14px;border-right:1px solid #efeeec;align-self:stretch}
.task-row>.cell-slot{padding:0 2px}
.task-row:hover,.task-row.forced-hover{background:#fafaf9}

.task-batch.rooms{display:inline-flex;align-items:center;gap:4px;position:relative;cursor:default}

.inbox-title{font-size:14px;font-weight:500;line-height:20px;white-space:nowrap}
.inbox-sub{font-size:13px;color:var(--muted-foreground);line-height:17px;margin-top:2px}
.review-action{display:flex;align-items:center;gap:5px;flex:none}
.frame .inbox-row .button{min-height:28px;padding:2px 8px;font-size:12px}
.review-action>svg{width:14px;height:14px;color:var(--muted-foreground)}
.answer-options{display:flex;flex-direction:column;gap:4px;flex:none}
.frame .answer-options .button{min-height:24px;padding:1px 7px;font-size:11px}
.inbox-row input{width:17px;height:17px;margin:0 7px 0 0;accent-color:var(--primary);flex:none;cursor:pointer}
.inbox-row.completed .inbox-title{text-decoration:line-through;color:var(--muted-foreground)}
.inbox-row.answered{height:40px;color:var(--muted-foreground);font-size:13px;padding-left:64px;cursor:default}
.due{font-size:13px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px;flex:none}
.overdue{color:var(--destructive)}
.home-page .task-batch{font-size:12px;font-weight:600;color:#44403c;background:#F1F3EE;border-radius:6px;padding:2px 7px;line-height:18px}
.today-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 140px;height:56px;cursor:pointer;border-bottom:1px solid #f1f0ee;align-items:center}
.today-row:last-child{border-bottom:0}
.today-row:hover{background:#fafaf9}
.today-row .row-label{border:0;min-width:0;gap:12px}
.today-row .day-slot{padding:0 8px;display:flex;align-items:center;align-self:stretch;background:#f5f9f5;border-left:1px solid #f1f0ee;border-right:1px solid #f1f0ee}
.today-row .week-cell{display:grid;place-items:center}
.today-status{font-size:13px;color:var(--muted-foreground);padding:0 12px;white-space:nowrap}
.bundle-card{width:100%;max-width:560px;align-self:flex-end;border:1px solid var(--border);background:white;border-radius:var(--radius);padding:16px;font-size:13px}
.bundle-heading{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bundle-heading strong{font-size:15px;font-weight:600}
.bundle-heading .muted{font-size:12px}
.bundle-row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border)}
.bundle-plan{flex:1;min-width:0}
.bundle-plan strong{font-size:14px;font-weight:500}
.bundle-plan p{font-size:12px;color:var(--muted-foreground);line-height:18px}
.frame .bundle-row .button{min-height:28px;padding:0 4px;font-size:12px}
.comment-marker{display:flex;align-items:center;gap:4px;font-size:11px;color:#946015;white-space:nowrap}
.frame .comment-marker .avatar{width:12px;height:12px;border-radius:3px;background:#fff0d4;color:#946015;font-size:7px}
.bundle-footer{padding-top:12px}
.bundle-footer p{font-size:12px;color:var(--muted-foreground);line-height:18px}
.bundle-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.frame .bundle-buttons .button{min-height:34px;font-size:13px}
.bundle-saved{display:flex;align-items:center;gap:4px;color:var(--done);font-size:12px}
.bundle-saved svg{width:14px;height:14px}
.chat-feed{min-height:0;overflow-y:auto;gap:20px}
.home-preview .preview-facts{margin:10px 0 0;font-size:12px;color:var(--foreground)}
.home-preview .preview-facts p{color:inherit}

/* Review pass (Claude): calmer Answer and Today rows */
.answer-options{flex-direction:row;gap:6px}
.frame .answer-options .button{min-height:30px;padding:0 10px;font-size:13px}
.review-action>svg{display:none}
.today-row{grid-template-columns:minmax(0,1fr) auto 128px;padding-right:8px}
.today-row .row-label{padding-right:12px}
.today-row .day-slot{background:none;border:0;padding:0 10px}
.today-row .week-cell{min-width:44px;height:30px;padding:0 10px;font-size:13px}
.today-status{padding:0 8px 0 4px}

/* Warm Home (owner 5 Nov: grey + white everywhere was dull). Home keeps the original

.home-search svg{width:16px;height:16px}
.home-head{margin-top:4px}

.home-page .section-band{background:#fff;gap:8px;color:#44403c}
.home-page .section-band i{width:8px;height:8px;border-radius:999px;display:inline-block}
.kind-approve i{background:#28734F}.kind-answer i{background:#3972B7}.kind-todo i{background:#a8a29e}
.frame .home-page .avatar{font-weight:700;border-radius:10px}
.ag-GM{background:#20291F!important;color:#fff!important}
.ag-PR{background:#FCEFD6!important;color:#8A5A12!important}
.ag-VT{background:#DDF1EF!important;color:#1F6F68!important}
.ag-BS{background:#ECE8FB!important;color:#5B4AB3!important}
.ag-EQ{background:#FBE5E3!important;color:#A23B33!important}
.cat-tile{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;flex:none;margin-right:2px}

.cat-p{background:#FCEFD6;color:#8A5A12}.cat-h{background:#DDF1EF;color:#1F6F68}
.today-row .row-label{align-items:center}

function updateCount(frame){const n=6-frame.querySelectorAll('.inbox-row.answered,.inbox-row.completed').length;frame.querySelector('.open-count').textContent=n+' open';frame.querySelector('.count').textContent=n}
document.addEventListener('mouseover',e=>{const row=e.target.closest('[data-inbox="0"]');if(row&&interactive(row))showPreview(row)});
document.addEventListener('focusin',e=>{const row=e.target.closest('[data-inbox="0"]');if(row&&interactive(row))showPreview(row)});
document.addEventListener('mouseout',e=>{const row=e.target.closest('[data-inbox="0"]');if(row&&interactive(row)&&!row.contains(e.relatedTarget))hidePreview(row.closest('.frame'))});
document.addEventListener('change',e=>{if(!e.target.matches('.inbox-row input')||!interactive(e.target))return;const row=e.target.closest('.inbox-row');row.classList.toggle('completed',e.target.checked);updateCount(row.closest('.frame'))});
document.addEventListener('click',e=>{if(!interactive(e.target))return;const frame=e.target.closest('.frame'),answer=e.target.closest('[data-answer]'),row=e.target.closest('.inbox-row');
 if(answer){row.classList.add('answered');row.innerHTML='Answered: '+answer.dataset.answer;row.removeAttribute('tabindex');updateCount(frame);return}
 if(e.target.closest('[data-approve]')){frame.dataset.frame='bundle-done';frame.querySelector('.bundle-card').outerHTML=bundleCard(true);frame.querySelector('.chat-feed').insertAdjacentHTML('beforeend',message("Saved Batches 34 and 35. They're on the Schedule from Fri 13 Nov.",'09:15',true));if(document.body.classList.contains('solo'))history.replaceState(null,'','?frame=bundle-done');else{openIndex=3;document.getElementById('overlay-title').textContent=titles['bundle-done']+' · 1440 × 900 · 100%'}return}
 const task=e.target.closest('.today-row');if(task){dispatch(frame,'open-task',{taskType:task.dataset.task,batch:task.dataset.batch,day:3});return}
 if(row&&!row.classList.contains('answered')){if(row.querySelector('input')){if(!e.target.closest('input,.task-batch'))row.querySelector('input').click()}else if(row.dataset.inbox!=='2')dispatch(frame,'open-inbox',{id:+row.dataset.inbox,title:inbox[+row.dataset.inbox][2]});return}
 const plan=e.target.closest('[data-open-plan]');if(plan)dispatch(frame,'open-plan',{batch:Number(plan.dataset.openPlan)});
 if(e.target.closest('[data-done]'))dispatch(frame,'open-inbox-done',{});
 if(e.target.closest('[data-schedule]'))dispatch(frame,'open-schedule',{});
 if(e.target.closest('[data-not-now]'))dispatch(frame,'defer-bundle',{batches:[34,35,36]});
});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')||e.target.isContentEditable)return;const target=e.target.closest('.today-row,.inbox-row[tabindex]');if(target&&e.target===target&&['Enter',' '].includes(e.key)){e.preventDefault();target.click();return}if(openIndex<0)return;if(e.key==='Escape')closeFrame();if(e.key==='ArrowRight'){e.preventDefault();openFrame(openIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();openFrame(openIndex-1)}if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input,[tabindex]')].filter(el=>el.getClientRects().length&&!el.disabled),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
</script><script>
// Agent identity colours everywhere an agent appears (rail, chat, Inbox): colour that means who.
(function(){const tint=()=>document.querySelectorAll('.avatar').forEach(a=>{const t=a.textContent.trim();if(/^(GM|PR|VT|BS|EQ)$/.test(t)&&!a.classList.contains('ag-'+t))a.classList.add('ag-'+t)});tint();new MutationObserver(tint).observe(document.body,{childList:true,subtree:true});})();
</script>
</body></html>
