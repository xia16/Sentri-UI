/* Timeline (rebuild): one label per row, one bar per run of days */
.calendar-page{--label:196px}
.days,.task-row{grid-template-columns:var(--label) repeat(7,minmax(0,1fr)) 28px}
.days{height:40px;border-bottom:1px solid var(--border)}

.day.today span{background:#28734F;color:#fff;font-weight:600}
.today-band{left:calc(var(--label) + (100% - var(--label) - 28px)*3/7);width:calc((100% - var(--label) - 28px)/7);background:#f6f9f6;top:40px}

.cell-slot{padding:0 1.5px}

function openFrame(i){openIndex=(i+frames.length)%frames.length;const s=frames[openIndex],stage=document.getElementById('overlay-stage');stage.replaceChildren(make(s));document.getElementById('overlay-title').textContent=titles[s]+' · 1440 × 900 · 100%';overlay.classList.add('open');document.body.style.overflow='hidden';hydrate(stage);document.getElementById('close').focus()}

function showPreview(cell){if(!cell)return;const frame=cell.closest('.frame'),type=cell.dataset.cell,i=+cell.dataset.day;hidePreview(frame);if(!['Fostering checks','Treatment'].includes(type))return;const fostering=type==='Fostering checks',n=Number(cell.textContent.replace(/\D/g,'')),total=fostering?8:4;cell.closest('.task-row').classList.add('forced-hover');const card=document.createElement('div');card.className='hover-card';card.setAttribute('role','tooltip');const done=cell.classList.contains('d')||cell.classList.contains('w')?n:0;card.innerHTML=`<strong>${fostering?'Fostering checks · B32':'Treatment · Amox'}</strong><p>${days[i]} ${i+2} Nov · ${fostering?'Farrowing 2':'Gestation 2'} · Li Wei</p><div class="preview-progress"><div class="dose-bar">${done?`<span class="done" style="flex:${done}"></span>`:''}${total-done?`<span class="pending" style="flex:${total-done}"></span>`:''}</div><span>${done} of ${total}</span></div><p>${fostering&&i===2?'2 not reported: A5, B10':fostering?`${total-done} not reported`:'RX-25G009 · Running'}</p><p class="click-hint">Click to open</p>`;frame.querySelector('.right-pane').append(card);const r=cell.getBoundingClientRect(),p=frame.querySelector('.right-pane').getBoundingClientRect(),scale=frame.getBoundingClientRect().width/1440;card.style.left=Math.min(Math.max((r.left-p.left)/scale-16,8),388)+'px';card.style.top=(r.bottom-p.top)/scale+8+'px';}

document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea')||e.target.isContentEditable)return;if(openIndex>=0){if(e.key==='Escape')closeFrame();if(e.key==='ArrowRight'){e.preventDefault();openFrame(openIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();openFrame(openIndex-1)}}const tab=e.target.closest('[data-filter]');if(tab&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();const tabs=[...tab.parentElement.children];tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:3))%4].click();tab.closest('.frame').querySelector('[aria-selected="true"][data-filter]')?.focus()}});
function interactive(el){return el.closest('.frame')&&!el.closest('.preview-window')}
document.addEventListener('mouseover',e=>{const c=e.target.closest('[data-cell]');if(c&&interactive(c))showPreview(c)});
document.addEventListener('focusin',e=>{const c=e.target.closest('[data-cell]');if(c&&interactive(c))showPreview(c)});
document.addEventListener('mouseout',e=>{const row=e.target.closest('.task-row');if(row&&interactive(row)&&!row.contains(e.relatedTarget)&&!e.relatedTarget?.closest('.hover-card'))hidePreview(row.closest('.frame'))});
document.addEventListener('click',e=>{const f=e.target.closest('.frame');if(!f||!interactive(e.target))return;const go=e.target.closest('[data-go]');if(go){switchFrame(f,go.dataset.go);return}if(e.target.closest('[data-dismiss-panel]')){f.querySelector('.farm-panel').remove();return}const filter=e.target.closest('[data-filter]');if(filter){hidePreview(f);const content=f.querySelector('.schedule-scroll');const t=document.createElement('template');t.innerHTML=calendar('week',filter.dataset.filter);content.replaceWith(t.content.firstElementChild);return}const cell=e.target.closest('[data-cell="Treatment"]');if(cell){switchFrame(f,'record');return}const row=e.target.closest('.task-row');if(row&&!e.target.closest('.new-task')){if(row.dataset.task==='Treatment')switchFrame(f,'record');else openTaskRecord(f,row.dataset.task,+(e.target.closest('[data-day]')?.dataset.day??3));return}const action=e.target.closest('.new-task');if(action){f.dispatchEvent(new CustomEvent('open-action',{bubbles:true,detail:{taskType:action.dataset.action,batch:action.dataset.batch}}));f.querySelector('.composer-placeholder').textContent=`New ${action.dataset.action} for ${action.dataset.batch}`;f.querySelector('.composer-placeholder').focus()}});

// Other calendar cells open the same task and day their preview describes.
function openTaskRecord(frame,type,day){const row=groups.flatMap(g=>g.rows).find(r=>r[0]===type),code=row[3][day],count=code.replace(/[^0-9]/g,'');const next=make('record');next.querySelector('.tab.active').innerHTML=type+' <span class="close">×</span>';const detail=type==='Fostering checks'&&day===2?'<div class="preview-progress"><div class="dose-bar"><span class="done" style="flex:6"></span><span class="pending" style="flex:2"></span></div><span>6 of 8</span></div><p class="muted">2 not reported: A5, B10</p>':`<p>${code[0]==='d'?count+' done':code[0]==='o'?count+' today':code[0]==='p'?count+' planned':code[0]==='e'?'~'+count+' estimated':code[0]==='u'?'Waiting on today':'Nothing due'}</p>`;next.querySelector('.page-scroll').innerHTML=`<div class="running-body"><button class="button ghost schedule-back" data-go="week">‹ Schedule</button><header class="running-header"><h1>${type} · ${row[1]}</h1><p class="muted">${row[2]}</p></header>${card(days[day]+' '+(day+2)+' Nov',`<p class="muted">${row[2]} · Li Wei</p>${detail}`)}</div>`;switchFrame(frame,next)}
</script></body></html>
