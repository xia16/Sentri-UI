<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home G pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.hf-btn{border:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;background:none;padding:0}.hf-card:hover{box-shadow:0 0 0 1px #D5DAD0,0 2px 8px rgba(17,21,17,.07)}.hf-row:hover{background:#F6F7F3}.hf-nav:hover{background:#EEF0EA}.hf-dk:hover{background:rgba(255,255,255,.07)}.hf-num{font-variant-numeric:tabular-nums}@keyframes hfSlide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}@keyframes hfTimer{from{width:0}to{width:100%}}@keyframes upA{from{transform:translateY(100%)}to{transform:none}}@keyframes upB{from{transform:translateY(100%)}to{transform:none}}.hf-ct{opacity:0}.hf-col:hover .hf-ct{opacity:1}.hf-tip{opacity:0;pointer-events:none;transition:opacity .12s}.hf-stop:hover .hf-tip{opacity:1}@keyframes hfIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; overflow-y: auto; scrollbar-width: none; background: #F6F7F1; font-family: 'Geist', system-ui, sans-serif; color: #1B211C; -webkit-font-smoothing: antialiased">
  <sc-for list="{{panes}}" as="pn" hint-placeholder-count="1">
            <div style="padding: 12px 16px 12px">

              <!-- Decide: ticker band, title inside -->
              <div style="display: flex; flex-direction: column; box-sizing: border-box; height: 80px; padding: 8px 10px 0; border-radius: 14px; background: #1E2A22; color: #FFFFFF">
                <span style="display: flex; align-items: stretch; gap: 8px; flex: 1">
                  <button type="button" class="hf-btn hf-dk" onClick="{{listGo}}" aria-label="Open For you: 17 decisions, 6 today" style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; flex: none; padding: 0 12px 0 4px; border-radius: 9px; color: #FFFFFF; border-right: 1px solid rgba(255,255,255,.14); border-top-right-radius: 0; border-bottom-right-radius: 0"><span style="font-size: 12.5px; font-weight: 600; line-height: 16px; color: #DCE6DE">Decide</span><span style="display: flex; align-items: baseline; gap: 5px"><span class="hf-num" style="font-size: 24px; font-weight: 600; line-height: 28px">17</span><span style="font-size: 11.5px; color: #F2C77F; font-weight: 600">6 today</span></span></button>
                  <button type="button" class="hf-btn hf-dk" onClick="{{decideGo}}" aria-label="Open {{tk.title}}" style="position: relative; flex: 1; min-width: 0; height: 44px; align-self: center; overflow: hidden; border-radius: 9px; color: #FFFFFF; padding: 0 6px">
                    <span style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; animation: {{tkAnim}} .45s cubic-bezier(.2,.8,.2,1)">
                      <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #AFC2B5"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{tk.dot}}"></span>{{tk.agent}}<span style="margin-left: auto; font-weight: 600; color: {{tk.dueDark}}">{{tk.when}}</span></span>
                      <span style="font-size: 14.5px; font-weight: 600; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tk.title}}</span>
                    </span>
                  </button>
                </span>
                <span role="tablist" aria-label="Decisions" style="display: flex; gap: 3px; height: 16px"><sc-for list="{{tsegs}}" as="s" hint-placeholder-count="7"><button type="button" role="tab" aria-selected="{{s.on}}" aria-label="{{s.label}}" onClick="{{s.pick}}" class="hf-btn" style="flex: 1; height: 16px; display: flex; align-items: center; padding: 0"><span style="display: block; width: 100%; height: {{s.h}}; border-radius: 2px; background: {{s.c}}"></span></button></sc-for></span>
              </div>
              <!-- doors: Day plan leads -->
              <div style="display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; margin-top: 12px">
                <button type="button" class="hf-btn hf-card" onClick="{{dayGo}}" style="display: flex; flex-direction: column; padding: 12px 14px 13px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E9E2, 0 1px 2px rgba(17,21,17,.04)">
                  <span style="display: flex; align-items: center; gap: 6px; width: 100%; font-size: 13.5px; font-weight: 600"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; fill: none; stroke: #28734F; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{ic.day}}"></path></svg>Day plan<span style="margin-left: auto; font-weight: 400; font-size: 12px; color: #8A938C">Mon 9 Nov</span></span>
                  <span style="display: flex; align-items: baseline; gap: 5px; margin-top: 8px"><span class="hf-num" style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 28px">23</span><span style="font-size: 12.5px; color: #5D665F">jobs · 7 people</span></span>
                  <span style="display: flex; margin-top: 9px"><sc-for list="{{faces}}" as="x" hint-placeholder-count="7"><span style="width: 26px; height: 26px; margin-right: -4px; flex: none; position: relative; display: grid; place-items: center; border-radius: 50%; overflow: hidden; background: {{x.bg}}; color: #1B211C; font-size: 11px; font-weight: 600; box-shadow: 0 0 0 2px #FFFFFF"><sc-for list="{{x.photo}}" as="ph" hint-placeholder-count="0"><svg viewBox="0 0 32 32" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%"><rect width="32" height="32" style="fill: {{ph.bg}}"></rect><path d="M4 34c1-7 6-10 12-10s11 3 12 10Z" style="fill: {{ph.shirt}}"></path><ellipse cx="16" cy="14.5" rx="6" ry="7" style="fill: {{ph.skin}}"></ellipse><path d="{{ph.hair}}" style="fill: {{ph.hairCol}}"></path></svg></sc-for><sc-for list="{{x.init}}" as="t" hint-placeholder-count="1">{{t}}</sc-for></span></sc-for></span>
                </button>
                <span style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{doorsSmall}}" as="t" hint-placeholder-count="2">
                    <button type="button" class="hf-btn hf-card" onClick="{{t.go}}" style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E9E2, 0 1px 2px rgba(17,21,17,.04)">
                      <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; flex: none; fill: none; stroke: #28734F; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.icon}}"></path></svg>
                      <span style="flex: 1; font-size: 13.5px; font-weight: 600; white-space: nowrap">{{t.name}}</span>
                      <span class="hf-num" style="font-size: 16px; font-weight: 600">{{t.n}}</span>
                    </button>
                  </sc-for>
                </span>
              </div>

              <!-- the area switch: icon tabs -->
              <div role="tablist" aria-label="Areas" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px">
                <sc-for list="{{pn.segs}}" as="g" hint-placeholder-count="3">
                  <button type="button" role="tab" aria-selected="{{g.on}}" class="hf-btn" onClick="{{g.pick}}" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; background: {{g.bg}}; box-shadow: {{g.sh}}; color: {{g.ink}}">
                    <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="{{g.icon}}"></path></svg>
                    <span style="font-size: 13px; font-weight: {{g.w}}">{{g.label}}</span>
                  </button>
                </sc-for>
              </div>

              <!-- one dashboard card for the area: quiet; labels, goals and weeks live in hover -->
              <sc-for list="{{pn.dash}}" as="db" hint-placeholder-count="1">
                <div class="hf-card" style="display: flex; flex-direction: column; width: 100%; box-sizing: border-box; margin-top: 8px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 0 0 1px #E6E9E2, 0 1px 2px rgba(17,21,17,.04); animation: hfIn .25s ease-out">
                  <span style="display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 10px 10px 0 14px">
                    <sc-for list="{{db.lineBox}}" as="lbx" hint-placeholder-count="0"><span style="position: relative">
                      <button type="button" class="hf-btn hf-nav" aria-haspopup="menu" aria-expanded="{{lbx.open}}" onClick="{{lbx.toggle}}" style="display: flex; align-items: center; gap: 5px; height: 30px; margin-left: -8px; padding: 0 8px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #1B211C">{{lbx.label}}<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; fill: none; stroke: #5D665F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m6 9 6 6 6-6"></path></svg></button>
                      <sc-for list="{{lbx.menu}}" as="mn" hint-placeholder-count="0"><span role="menu" aria-label="Production lines" style="position: absolute; top: calc(100% + 4px); left: -8px; z-index: 8; width: 230px; display: flex; flex-direction: column; padding: 4px; box-sizing: border-box; border-radius: 10px; border: 1px solid #E6E9E2; background: #FFFFFF; box-shadow: 0 20px 25px -5px rgba(17,21,17,.10), 0 8px 10px -6px rgba(17,21,17,.10)">
                        <sc-for list="{{db.lines}}" as="ln" hint-placeholder-count="4"><button type="button" role="menuitemradio" aria-checked="{{ln.on}}" class="hf-btn hf-nav" onClick="{{ln.pick}}" style="display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; margin-bottom: {{ln.gap}}; box-shadow: {{ln.sep}}"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; visibility: {{ln.vis}}; fill: none; stroke: #1B211C; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M20 6 9 17l-5-5"></path></svg><span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500; line-height: 18px">{{ln.label}}</span><span style="font-size: 12px; line-height: 16px; color: #5D665F">{{ln.type}}</span></span></button></sc-for>
                      </span></sc-for>
                    </span></sc-for>
                    <sc-for list="{{db.period}}" as="pd" hint-placeholder-count="0"><span style="font-size: 12.5px; color: #5D665F">{{pd}}</span></sc-for>
                    <button type="button" class="hf-btn hf-nav" aria-label="Open {{db.name}}" onClick="{{db.go}}" style="margin-left: auto; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; fill: none; stroke: #3B4540; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="m9 18 6-6-6-6"></path></svg></button>
                  </span>
                  <span style="display: flex; flex-direction: column; width: 100%; box-sizing: border-box; padding: 8px 14px 14px">
                    <sc-for list="{{db.big}}" as="bg" hint-placeholder-count="1">
                      <span class="hf-stop" data-big="1" style="position: relative; align-self: flex-start; display: flex; align-items: baseline; gap: 6px; cursor: default"><span class="hf-num" style="font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 34px; color: {{bg.ink}}">{{bg.v}}</span><span style="font-size: 13px; color: #5D665F">{{bg.unit}}</span><span class="hf-tip" style="position: absolute; top: calc(100% + 4px); left: 0; z-index: 6; white-space: nowrap; display: flex; flex-direction: column; gap: 6px; min-width: 128px; box-sizing: border-box; padding: 7px 10px 8px; border-radius: 8px; border: 1px solid #E6E9E2; background: #FFFFFF; color: #1B211C; box-shadow: 0 20px 25px -5px rgba(17,21,17,.10), 0 8px 10px -6px rgba(17,21,17,.10); text-align: left; font-weight: 400"><span style="font-size: 12px; font-weight: 500; line-height: 16px; color: #1B211C">{{bg.title}}</span><sc-for list="{{bg.rows}}" as="tr" hint-placeholder-count="2"><span style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px"><sc-for list="{{tr.dot}}" as="dc" hint-placeholder-count="0"><span style="width: 10px; height: 10px; flex: none; border-radius: 2px; background: {{dc}}"></span></sc-for><span style="color: #5D665F">{{tr.a}}</span><span style="margin-left: auto; padding-left: 16px; font-variant-numeric: tabular-nums; font-weight: 500; color: #1B211C">{{tr.b}}</span></span></sc-for><sc-for list="{{bg.warn}}" as="tw" hint-placeholder-count="0"><span style="padding-top: 6px; border-top: 1px solid #F0F1EC; font-size: 12px; font-weight: 500; line-height: 16px; color: #8A5A12">{{tw}}</span></sc-for></span></span>
                    </sc-for>
                    <sc-for list="{{db.hero}}" as="hc" hint-placeholder-count="0">
                      <span style="position: relative; display: block; width: 100%; box-sizing: border-box; padding-right: 30px; margin-top: 10px">
                        <svg viewBox="0 0 400 84" aria-hidden="true" style="display: block; width: 100%; height: auto; overflow: visible">
                          <defs><linearGradient id="hfArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E8A63" stop-opacity=".2"></stop><stop offset="1" stop-color="#3E8A63" stop-opacity="0"></stop></linearGradient></defs>
                          <line x1="0" x2="400" y1="{{hc.tY}}" y2="{{hc.tY}}" style="stroke: #9AA39C; stroke-width: 1.2; stroke-dasharray: 4 4"></line>
                          <polygon points="{{hc.area}}" style="fill: url(#hfArea)"></polygon>
                          <polyline points="{{hc.pts}}" style="fill: none; stroke: #1F5C3F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></polyline>
                          <circle cx="{{hc.lastX}}" cy="{{hc.lastY}}" r="4.5" style="fill: #1F5C3F; stroke: #FFFFFF; stroke-width: 2"></circle>
                        </svg>
                        <span class="hf-num" style="position: absolute; right: 0; top: {{hc.tLabTop}}; width: 26px; font-size: 11px; color: #8A938C; text-align: right">{{hc.tLab}}</span>
                        <span style="position: absolute; top: 0; bottom: 0; left: 0; right: 30px; display: flex">
                          <sc-for list="{{hc.cols}}" as="cl" hint-placeholder-count="26">
                            <span class="hf-col" style="position: relative; flex: 1; cursor: default">
                              <span class="hf-ct" style="position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #C9CFC5"></span>
                              <span class="hf-ct hf-num" style="position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX({{cl.tx}}); white-space: nowrap; font-size: 11.5px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: 6px; background: #1E2A22; color: #FFFFFF">{{cl.t}}</span>
                            </span>
                          </sc-for>
                        </span>
                      </span>
                    </sc-for>
                    <sc-for list="{{db.budget}}" as="bu" hint-placeholder-count="0">
                      <span class="hf-stop" data-budget="1" style="position: relative; display: flex; flex-direction: column; margin-top: 14px; cursor: default">
                        <span style="position: relative; display: flex; gap: 2px; height: 12px; border-radius: 4px; background: #EEF0EA">
                          <sc-for list="{{bu.parts}}" as="bp" hint-placeholder-count="4"><span style="width: {{bp.w}}; border-radius: 3px; background: {{bp.col}}"></span></sc-for>
                          <span style="position: absolute; left: {{bu.pace}}; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: #1B211C"></span>
                        </span>
                        <span style="display: flex; gap: 12px; margin-top: 8px; font-size: 11.5px; color: #5D665F"><sc-for list="{{bu.parts}}" as="bp" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 2px; background: {{bp.col}}"></span>{{bp.name}}</span></sc-for><span style="margin-left: auto; display: flex; align-items: center; gap: 5px"><span style="width: 2px; height: 10px; border-radius: 1px; background: #1B211C"></span>pace</span></span>
                        <span class="hf-tip" style="position: absolute; top: calc(100% + 6px); left: 0; z-index: 6; white-space: nowrap; display: flex; flex-direction: column; gap: 6px; min-width: 128px; box-sizing: border-box; padding: 7px 10px 8px; border-radius: 8px; border: 1px solid #E6E9E2; background: #FFFFFF; color: #1B211C; box-shadow: 0 20px 25px -5px rgba(17,21,17,.10), 0 8px 10px -6px rgba(17,21,17,.10); text-align: left; font-weight: 400"><span style="font-size: 12px; font-weight: 500; line-height: 16px; color: #1B211C">{{bu.title}}</span><sc-for list="{{bu.rows}}" as="tr" hint-placeholder-count="2"><span style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px"><sc-for list="{{tr.dot}}" as="dc" hint-placeholder-count="0"><span style="width: 10px; height: 10px; flex: none; border-radius: 2px; background: {{dc}}"></span></sc-for><span style="color: #5D665F">{{tr.a}}</span><span style="margin-left: auto; padding-left: 16px; font-variant-numeric: tabular-nums; font-weight: 500; color: #1B211C">{{tr.b}}</span></span></sc-for><sc-for list="{{bu.warn}}" as="tw" hint-placeholder-count="0"><span style="padding-top: 6px; border-top: 1px solid #F0F1EC; font-size: 12px; font-weight: 500; line-height: 16px; color: #8A5A12">{{tw}}</span></sc-for></span>
                      </span>
                    </sc-for>
                    <sc-for list="{{db.figs}}" as="fg" hint-placeholder-count="0">
                      <span style="display: grid; grid-template-columns: repeat({{fg.n}}, minmax(0, 1fr)); gap: 16px; width: 100%; margin-top: 16px; padding-top: 14px; border-top: 1px solid #F0F1EC">
                        <sc-for list="{{fg.list}}" as="k" hint-placeholder-count="4">
                          <span class="hf-stop" data-fig="{{k.label}}" style="position: relative; display: flex; flex-direction: column; min-width: 0; cursor: default">
                            <span style="font-size: 11.5px; color: #5D665F; white-space: nowrap">{{k.label}}</span>
                            <span style="display: flex; align-items: baseline; gap: 3px; margin-top: 1px"><span class="hf-num" style="font-size: 17px; font-weight: 600; line-height: 21px; color: {{k.ink}}">{{k.v}}</span><span style="font-size: 11px; color: #8A938C">{{k.unit}}</span></span>
                            <span style="position: relative; display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: 7px">
                              <sc-for list="{{k.bars}}" as="br" hint-placeholder-count="6"><span style="flex: 1; height: {{br.h}}; border-radius: 2px 2px 1px 1px; background: {{br.c}}"></span></sc-for>
                              <sc-for list="{{k.goal}}" as="gl" hint-placeholder-count="0"><span style="position: absolute; left: 0; right: 0; bottom: {{gl}}; border-top: 1px dashed #1B211C"></span></sc-for>
                            </span>
                            <span class="hf-tip" style="position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX({{k.tx}}); z-index: 6; white-space: nowrap; display: flex; flex-direction: column; gap: 6px; min-width: 128px; box-sizing: border-box; padding: 7px 10px 8px; border-radius: 8px; border: 1px solid #E6E9E2; background: #FFFFFF; color: #1B211C; box-shadow: 0 20px 25px -5px rgba(17,21,17,.10), 0 8px 10px -6px rgba(17,21,17,.10); text-align: left; font-weight: 400"><span style="font-size: 12px; font-weight: 500; line-height: 16px; color: #1B211C">{{k.title}}</span><sc-for list="{{k.rows}}" as="tr" hint-placeholder-count="2"><span style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px"><sc-for list="{{tr.dot}}" as="dc" hint-placeholder-count="0"><span style="width: 10px; height: 10px; flex: none; border-radius: 2px; background: {{dc}}"></span></sc-for><span style="color: #5D665F">{{tr.a}}</span><span style="margin-left: auto; padding-left: 16px; font-variant-numeric: tabular-nums; font-weight: 500; color: #1B211C">{{tr.b}}</span></span></sc-for><sc-for list="{{k.warn}}" as="tw" hint-placeholder-count="0"><span style="padding-top: 6px; border-top: 1px solid #F0F1EC; font-size: 12px; font-weight: 500; line-height: 16px; color: #8A5A12">{{tw}}</span></sc-for></span>
                          </span>
                        </sc-for>
                      </span>
                    </sc-for>
                  </span>
                  <sc-for list="{{db.list}}" as="ls" hint-placeholder-count="0">
                    <span style="display: flex; flex-direction: column; width: 100%; box-sizing: border-box; padding: 11px 14px 6px; border-top: 1px solid #F0F1EC">
                      <span style="font-size: 12.5px; font-weight: 600; color: #3B4540">{{ls.title}}</span>
                      <sc-for list="{{ls.rows}}" as="r" hint-placeholder-count="5">
                        <span class="hf-stop" data-row="{{r.chip}}" style="position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) 76px 42px; align-items: center; gap: 10px; height: 36px; border-top: 1px solid {{r.line}}; cursor: default">
                          <span class="hf-num" style="justify-self: start; font-size: 11.5px; font-weight: 600; line-height: 20px; padding: 0 6px; border-radius: 6px; background: #F1F3EE; color: #3B4540">{{r.chip}}</span>
                          <span style="position: relative; height: 11px">
                            <span style="position: absolute; left: 0; right: 0; top: 3px; height: 5px; border-radius: 3px; background: #EEF0EA"></span>
                            <span style="position: absolute; left: 0; width: {{r.pct}}; top: 3px; height: 5px; border-radius: 3px; background: {{r.col}}"></span>
                            <span style="position: absolute; left: 0; top: 0; width: 11px; height: 11px; border-radius: 50%; background: {{r.dot}}"></span>
                            <span style="position: absolute; right: -5px; top: 0; width: 11px; height: 11px; box-sizing: border-box; border-radius: 50%; border: 2px solid #CDD3C9; background: #FFFFFF"></span>
                            <sc-for list="{{r.via}}" as="v" hint-placeholder-count="0"><span style="position: absolute; left: {{v.x}}; top: 0; width: 11px; height: 11px; margin-left: -5.5px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{v.ring}}; background: #FFFFFF"></span></sc-for>
                          </span>
                          <span style="font-size: 12.5px; color: #5D665F; text-align: right; white-space: nowrap">{{r.end}}</span>
                          <span class="hf-num" style="font-size: 13.5px; font-weight: 600; text-align: right; color: {{r.ink}}">{{r.value}}</span>
