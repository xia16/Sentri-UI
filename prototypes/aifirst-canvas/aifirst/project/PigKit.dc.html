<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pig sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}@keyframes sentriRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}</style>
</helmet>
<div ref="{{setRoot}}" style="{{rootStyle}}">

  <!-- title line -->
  <div style="flex: none; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 20px; box-sizing: border-box; min-width: 0">
    <h1 style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap">Pigs</h1>
    <span style="font-size: 13px; color: #626C66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{sub}}</span>
  </div>

  <!-- stage -->
  <div style="flex: 1 1 auto; min-height: 0; position: relative; border-top: 1px solid #E3E6E1; background: #FFFFFF; overflow: hidden; isolation: isolate">
    <div ref="{{setMount}}" style="position: absolute; inset: 0"></div>
    <div ref="{{setLabels}}" aria-label="Labels" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden"></div>

    <sc-if value="{{loading}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #626C66">{{loadMsg}}</div>
    </sc-if>

    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
      <div style="{{camStyle}}">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
          <button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.style}}">{{v.name}}</button>
        </sc-for>
        <span style="width: 1px; height: 22px; background: #E3E6E1; margin: 0 4px"></span>
        <button type="button" onClick="{{zoomOut}}" aria-label="Zoom out" style="{{iconBtn}}">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{ic.minus}}"></path></svg>
        </button>
        <button type="button" onClick="{{zoomIn}}" aria-label="Zoom in" style="{{iconBtn}}">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{ic.plus}}"></path></svg>
        </button>
      </div>
      <div style="position: absolute; right: 18px; bottom: 16px; font-size: 12px; color: #6B746E; pointer-events: none; text-align: right">Click a tile to look closer · Drag to turn · Scroll to zoom</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["all","crate","pen"],"default":"all"},"$preview":{"width":1360,"height":900}}'>
// <inlined>
const PIGS_MODULE = (function () {
// pigs.module.js: believable low-poly pigs for the Sentri 3D barn view.
// ES module, loaded with dynamic import('./pigs.module.js'). Everything is built from a THREE passed in.
//   const kit = pigKit(THREE);
//   const field = kit.field();                       // one InstancedMesh per variety, per detail level
//   field.add('sow-stand', { x, y, z, yaw, s, sx, sz, tone });
//   const g = field.build();                         // { hi, lo, base } groups (base = soft shadows, lamp glow)
// Metres, +x is the way a pig faces, +y up. Sows are 180 cm, finishers 120 cm, weaners 65 cm, piglets 34 cm.

function makeRng(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.n = (lo, hi) => lo + (hi - lo) * f();
  f.i = (lo, hi) => Math.floor(lo + (hi - lo + 1) * f());
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  f.sgn = () => (f() < 0.5 ? -1 : 1);
  return f;
}

const CLASSES = { sow: 1.8, finisher: 1.2, weaner: 0.65, piglet: 0.34 };
// How big every pig is drawn, against the 1.8 m sow above: one scale for every variety. Pen and rail sizes stay real, so the pen reads around each animal.
const PIG_SCALE = 0.7;

// the varieties, in the order of the pig sheet
const VARIETIES = [
  { key: 'sow-stand', name: 'Sow, standing', cm: 180 },
  { key: 'sow-sternal', name: 'Sow, lying on her belly', cm: 180 },
  { key: 'sow-side', name: 'Sow, lying on her side', cm: 180 },
  { key: 'piglet-suckle', name: 'Piglets, suckling', cm: 34, group: true },
  { key: 'piglet-sternal', name: 'Piglets, sleeping', cm: 34, group: true },
  { key: 'weaner-stand', name: 'Weaner, standing', cm: 65 },
  { key: 'weaner-sternal', name: 'Weaners, lying in a huddle', cm: 65, group: true },
  { key: 'finisher-stand', name: 'Finisher, standing', cm: 120 },
  { key: 'finisher-sternal', name: 'Finisher, lying', cm: 120 }
];

const COL = { skin: '#EED0C6', belly: '#F1D6CD', ear: '#E5B3AA', snout: '#E5ADA6', hoof: '#CDBFB8', eye: '#2A2523', teat: '#E6B2AB' };

// ---- geometry helpers ----------------------------------------------------------------------
function accum(T) {
  const P = [], N = [], C = [];
  const v = new T.Vector3();
  return {
    add(geo, m, color) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      g.applyMatrix4(m);
      const p = g.attributes.position.array, n = g.attributes.normal.array;
      const c = new T.Color(color);
      for (let i = 0; i < p.length; i += 3) { P.push(p[i], p[i + 1], p[i + 2]); v.set(n[i], n[i + 1], n[i + 2]).normalize(); N.push(v.x, v.y, v.z); C.push(c.r, c.g, c.b); }
      g.dispose();
    },
    finish(ground) {
      let minY = 0;
      if (ground) { minY = 1e9; for (let i = 1; i < P.length; i += 3) minY = Math.min(minY, P[i]); }
      const col = new Float32Array(C.length);
      for (let i = 0; i < P.length; i += 3) {
        P[i + 1] -= minY;
        const ny = N[i + 1], y = P[i + 1];
        const down = Math.max(0, Math.min(1, ny * 0.5 + 0.5));
        const ao = (0.8 + 0.2 * down) * (0.86 + 0.14 * Math.max(0, Math.min(1, y / 0.14)));
        col[i] = C[i] * ao; col[i + 1] = C[i + 1] * ao; col[i + 2] = C[i + 2] * ao;
      }
      const g = new T.BufferGeometry();
      g.setAttribute('position', new T.Float32BufferAttribute(P, 3));
      g.setAttribute('normal', new T.Float32BufferAttribute(N, 3));
      g.setAttribute('color', new T.BufferAttribute(col, 3));
      g.computeBoundingSphere();
      return g;
    }
  };
}

// a smooth body of revolution-ish shape: stations [x, centreY, radiusY, radiusZ], Catmull-Rom between them
function loft(T, st, nA, nR) {
  const N = st.length;
  const cr = (p0, p1, p2, p3, t) => 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  const g = (k) => st[Math.max(0, Math.min(N - 1, k))];
  const rows = [];
  for (let a = 0; a <= nA; a++) {
    const u = a / nA * (N - 1), i = Math.min(N - 2, Math.floor(u)), t = u - i;
    const r = [0, 1, 2, 3].map((c) => cr(g(i - 1)[c], g(i)[c], g(i + 1)[c], g(i + 2)[c], t));
    r[2] = Math.max(0.012, r[2]); r[3] = Math.max(0.012, r[3]);
    rows.push(r);
  }
  const pos = [], idx = [];
  rows.forEach((r) => { for (let j = 0; j < nR; j++) { const an = j / nR * Math.PI * 2; pos.push(r[0], r[1] + r[2] * Math.sin(an), r[3] * Math.cos(an)); } });
  for (let a = 0; a < nA; a++) for (let j = 0; j < nR; j++) {
    const j2 = (j + 1) % nR, p = a * nR, q = (a + 1) * nR;
    idx.push(p + j, q + j, q + j2, p + j, q + j2, p + j2);
  }
  const f0 = pos.length / 3; pos.push(rows[0][0] - 0.02, rows[0][1], 0);
  const f1 = pos.length / 3; pos.push(rows[nA][0] + 0.02, rows[nA][1], 0);
  for (let j = 0; j < nR; j++) { const j2 = (j + 1) % nR; idx.push(f0, j2, j); idx.push(f1, nA * nR + j, nA * nR + j2); }
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

const BASE = [
  [-0.90, 0.56, 0.05, 0.05],
  [-0.86, 0.58, 0.17, 0.15],
  [-0.76, 0.61, 0.31, 0.235],
  [-0.58, 0.62, 0.38, 0.285],
  [-0.28, 0.60, 0.375, 0.27],
  [0.06, 0.585, 0.385, 0.275],
  [0.34, 0.58, 0.385, 0.27],
  [0.50, 0.56, 0.34, 0.245],
  [0.62, 0.52, 0.27, 0.205],
  [0.72, 0.485, 0.245, 0.19],
  [0.85, 0.44, 0.185, 0.145],
  [0.96, 0.405, 0.13, 0.10],
  [1.05, 0.385, 0.095, 0.078],
  [1.12, 0.38, 0.075, 0.068],
  [1.15, 0.378, 0.03, 0.03]
];
const LM = 2.04;
const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function stationsFor(spec) {
  const kid = spec.kid || 0;
  return BASE.map((s) => {
    let [x, cy, ry, rz] = s;
    const head = sm(0.5, 0.7, x);
    ry *= (1 + 0.28 * head * kid) * (1 - 0.1 * kid); rz *= (1 + 0.3 * head * kid) * (1 - 0.04 * kid);
    cy += 0.07 * kid;
    if (spec.headDrop) cy -= spec.headDrop * sm(0.45, 1.0, x);
    if (spec.pose === 'sternal') {
      const body = 1 - sm(0.45, 0.8, x);
      const ry2 = ry * (0.8 - 0.02 * head), rz2 = rz * 1.07;
      const cyB = ry2 + 0.012;
      const cyH = Math.max(0.3 + 0.04 * sm(0.7, 1, x) * 0, ry2 + 0.012);
      ry = ry2; rz = rz2; cy = cyB * body + Math.max(cyH, cyB) * (1 - body);
      if (x > 0.7) cy = Math.max(cy - 0.06 * sm(0.7, 1.05, x), ry + 0.012);
    }
    return [x, cy, ry, rz];
  });
}

function interp(st, x) {
  for (let i = 0; i < st.length - 1; i++) if (x >= st[i][0] && x <= st[i + 1][0]) { const t = (x - st[i][0]) / (st[i + 1][0] - st[i][0]); return [1, 2, 3].map((c) => st[i][c] + (st[i + 1][c] - st[i][c]) * t); }
  return st[st.length - 1].slice(1);
}

function buildGeo(T, spec, lod) {
  const hi = lod === 'hi', xs = lod === 'xs';
  const acc = accum(T);
  const k = spec.len / LM;
  const st = stationsFor(spec);
  const M = new T.Matrix4(), A = new T.Matrix4(), B = new T.Matrix4(), E = new T.Euler();
  const pose = new T.Matrix4();
  const lateral = spec.pose === 'side' || spec.pose === 'sideB';
  if (lateral) {
    const th = spec.pose === 'side' ? -Math.PI / 2 : Math.PI / 2;
    pose.makeRotationX(th);
    pose.premultiply(new T.Matrix4().makeTranslation(0, 0, spec.pose === 'side' ? 0.58 : -0.58));
  }
  const scale = new T.Matrix4().makeScale(k, k, k);
  const put = (geo, local, color) => { M.copy(scale).multiply(pose).multiply(local); acc.add(geo, M, color); };
  const rot = (rx, ry, rz) => B.makeRotationFromEuler(E.set(rx, ry, rz, 'XYZ'));
  const tr = (x, y, z) => new T.Matrix4().makeTranslation(x, y, z);
  const sc = (x, y, z) => new T.Matrix4().makeScale(x, y, z);

  // body, neck and head in one smooth piece
  const body = loft(T, st, hi ? 24 : xs ? 6 : 9, hi ? 12 : xs ? 5 : 6);
  put(body, new T.Matrix4(), COL.skin);
  body.dispose();

  const sph = (w, h) => new T.SphereGeometry(1, w, h);
  const cyl = (rt, rb, h, seg) => new T.CylinderGeometry(rt, rb, h, seg);
  const seg = hi ? 9 : 5;

  // snout disc and ears
  const tip = interp(st, 1.12);
  const snout = cyl(0.057, 0.052, 0.05, 12);
  if (hi) put(snout, tr(1.14, tip[0] - 0.002, 0).multiply(rot(0, 0, Math.PI / 2)), COL.snout);
  snout.dispose();
  const ear = sph(10, 7);
  const hp = interp(st, 0.70);
  if (hi) [1, -1].forEach((sd) => {
    const m = tr(0.71, hp[0] + hp[1] * 0.74, sd * 0.135).multiply(rot(sd * 0.9, 0, -0.65)).multiply(sc(0.13, 0.016, 0.082));
    put(ear, m, COL.ear);
  });
  ear.dispose();
  if (hi) {
    const eye = sph(6, 5);
    const ep = interp(st, 0.9);
    [1, -1].forEach((sd) => put(eye, tr(0.93, ep[0] + ep[1] * 0.3, sd * ep[2] * 0.88).multiply(sc(0.014, 0.014, 0.014)), COL.eye));
    eye.dispose();
    const tail = new T.TorusGeometry(0.045, 0.011, 5, 12, Math.PI * 1.55);
    put(tail, tr(-0.9, 0.55, 0).multiply(rot(0, 0, 2.2)), COL.skin);
    tail.dispose();
  }

  // legs: a thick upper leg and a slimmer lower one, a hoof at the end
  const leg = (x, z, top, uLen, lLen, rTop, rBot, phiU, phiL) => {
    if (xs) return;
    if (!hi) {
      const one = new T.CylinderGeometry(rTop * 0.8, rBot, uLen + lLen, 4, 1, true);
      put(one, tr(x, top, z).multiply(rot(0, 0, (phiU + phiL) / 2)).multiply(tr(0, -(uLen + lLen) / 2, 0)), COL.skin);
      one.dispose();
      return;
    }
    const up = cyl(rTop, (rTop + rBot) / 2, uLen, seg);
    const m1 = tr(x, top, z).multiply(rot(0, 0, phiU)).multiply(tr(0, -uLen / 2, 0));
    put(up, m1, COL.skin);
    up.dispose();
    const kx = x + uLen * Math.sin(phiU), ky = top - uLen * Math.cos(phiU);
    const lo = cyl((rTop + rBot) / 2, rBot, lLen, seg);
    const m2 = tr(kx, ky, z).multiply(rot(0, 0, phiL)).multiply(tr(0, -lLen / 2, 0));
    put(lo, m2, COL.skin);
    lo.dispose();
    const hf = cyl(rBot * 0.97, rBot * 1.05, 0.04, hi ? 8 : 5);
    put(hf, tr(kx, ky, z).multiply(rot(0, 0, phiL)).multiply(tr(0, -lLen - 0.015, 0)), COL.hoof);
    hf.dispose();
  };
  if (lateral) {
    // lying on her side: legs and udder are on the same side. Legs reach out from the belly, bent, resting low.
    const S = spec.pose === 'side' ? 1 : -1, tk = spec.tuck ? 0.42 : 1;
    const P = (a) => new T.Vector3(a[0], a[1], S * (0.30 + (a[2] - 0.30) * tk));
    const Z = new T.Vector3(0, 1, 0), qq = new T.Quaternion();
    const tube = (a, b, r0, r1, color, sg) => {
      const d = b.clone().sub(a), len = d.length();
      qq.setFromUnitVectors(Z, d.clone().normalize());
      const g = new T.CylinderGeometry(r1, r0, len, sg);
      M.copy(scale).multiply(new T.Matrix4().compose(a.clone().add(b).multiplyScalar(0.5), qq, new T.Vector3(1, 1, 1)));
      acc.add(g, M, color); g.dispose();
    };
    const hoofAt = (a, b, r) => {
      const d = b.clone().sub(a).normalize();
      qq.setFromUnitVectors(Z, d);
      const g = new T.CylinderGeometry(r * 0.95, r * 1.05, 0.045, hi ? 8 : 5);
      M.copy(scale).multiply(new T.Matrix4().compose(b.clone().addScaledVector(d, 0.01), qq, new T.Vector3(1, 1, 1)));
      acc.add(g, M, COL.hoof); g.dispose();
    };
    const legs = [
      [[0.40, 0.17, 0.30], [0.52, 0.0, 0.52], [0.50, -0.2, 0.64], 0.088, 0.06, 0.044],
      [[0.40, -0.15, 0.30], [0.52, -0.2, 0.52], [0.64, -0.235, 0.62], 0.088, 0.06, 0.044],
      [[-0.58, 0.17, 0.30], [-0.68, 0.02, 0.50], [-0.64, -0.2, 0.62], 0.108, 0.07, 0.046],
      [[-0.58, -0.15, 0.30], [-0.70, -0.21, 0.50], [-0.82, -0.235, 0.58], 0.108, 0.07, 0.046]
    ];
    legs.forEach((l) => {
      const a = P(l[0]), b = P(l[1]), c = P(l[2]);
      if (!hi) { tube(a, c, l[3] * 0.8, l[5], COL.skin, 4); return; }
      tube(a, b, l[3], l[4], COL.skin, seg);
      const kn = sph(8, 6);
      M.copy(scale).multiply(new T.Matrix4().compose(b, new T.Quaternion(), new T.Vector3(l[4], l[4], l[4])));
      acc.add(kn, M, COL.skin); kn.dispose();
      tube(b, c, l[4], l[5], COL.skin, seg);
      hoofAt(b, c, l[5]);
    });
  } else if (spec.pose === 'stand' || spec.pose === 'suckle') {
    const fr = spec.pose === 'suckle' ? 0.12 : 0;
    const pf = lateral ? 0.55 : 0, pr = lateral ? -0.4 : 0;
    const lift = 0.07 * (spec.kid || 0);
    const topF = (lateral ? 0.5 : 0.42) + lift, topR = (lateral ? 0.52 : 0.44) + lift;
    const kk = (lateral ? 1.18 : 1) * (1 + lift * 1.6);
    [1, -1].forEach((sd) => {
      const jit = lateral ? (sd > 0 ? 1.15 : 0.8) : 1;
      leg(0.38, sd * 0.17, topF, 0.22 * kk, 0.16 * kk, lateral ? 0.082 : 0.1, 0.04, 0.06 + pf * jit - fr, -0.04 + pf * 0.45 * jit - fr);
      leg(-0.56, sd * 0.185, topR, 0.22 * kk, 0.17 * kk, lateral ? 0.09 : 0.118, 0.043, -0.3 + pr * jit, lateral ? -0.5 * jit : 0.3);
    });
  } else {
    // lying on the belly: forelegs folded forward, hind feet tucked at the flanks
    const flat = (x0, y, z, len, r) => {
      if (!hi) return;
      const geoL = cyl(r * 0.9, r, len, seg);
      put(geoL, tr(x0 + len / 2, y, z).multiply(rot(0, 0, -Math.PI / 2)), COL.skin);
      geoL.dispose();
      const hf = cyl(r * 1.0, r * 1.05, 0.045, hi ? 8 : 5);
      put(hf, tr(x0 + len + 0.02, y, z).multiply(rot(0, 0, -Math.PI / 2)), COL.hoof);
      hf.dispose();
    };
    [1, -1].forEach((sd) => {
      flat(0.36, 0.055, sd * 0.2, 0.3, 0.055);
      flat(-0.5, 0.05, sd * 0.285, 0.23, 0.052);
    });
  }

  // teats along the belly of the sow lying on her side
  if (hi && lateral && spec.len > 1.5) {
    const tg = sph(6, 4);
    for (let i = 0; i < 8; i++) {
      const x = -0.56 + i * 0.1;
      const s = interp(st, x);
      [1, -1].forEach((sd) => put(tg, tr(x, s[0] - s[1] * 0.955, sd * 0.088).multiply(sc(0.017, 0.019, 0.017)), COL.teat));
    }
    tg.dispose();
  }
  return acc.finish(true);
}

const SPECS = (() => {
  const mk = (cls, pose, o) => Object.assign({ cls: cls, pose: pose, len: CLASSES[cls], kid: { sow: 0, finisher: 0.15, weaner: 0.45, piglet: 0.85 }[cls] }, o || {});
  const out = {};
  ['sow', 'finisher', 'weaner', 'piglet'].forEach((c) => {
    ['stand', 'sternal', 'side', 'sideB'].forEach((p) => { if ((p === 'side' || p === 'sideB') && c === 'finisher') return; out[c + '-' + p] = mk(c, p); });
  });
  out['piglet-suckle'] = mk('piglet', 'suckle', { headDrop: 0.15 });
  out['weaner-suckle'] = mk('weaner', 'suckle', { headDrop: 0.15 });
  out['sow-sideT'] = mk('sow', 'side', { tuck: true });
  out['sow-sideTB'] = mk('sow', 'sideB', { tuck: true });
  out['finisher-side'] = mk('finisher', 'side');
  out['finisher-sideB'] = mk('finisher', 'sideB');
  return out;
})();

// ---- rails and panels (barn furniture), one InstancedMesh each ------------------------------
function railSet(T) {
  const bars = [], panels = [];
  return {
    bar(x0, y0, z0, x1, y1, z1, r) { bars.push([x0, y0, z0, x1, y1, z1, r || 0.018]); },
    panel(cx, cy, cz, sx, sy, sz) { panels.push([cx, cy, cz, sx, sy, sz]); },
    count() { return bars.length + panels.length; },
    build(matBar, matPanel, shadow) {
      const g = new T.Group();
      if (bars.length) {
        const geo = new T.CylinderGeometry(1, 1, 1, 6, 1);
        const im = new T.InstancedMesh(geo, matBar, bars.length);
        const m = new T.Matrix4(), q = new T.Quaternion(), a = new T.Vector3(), b = new T.Vector3(), d = new T.Vector3(), up = new T.Vector3(0, 1, 0), s = new T.Vector3(), p = new T.Vector3();
        bars.forEach((r, i) => {
          a.set(r[0], r[1], r[2]); b.set(r[3], r[4], r[5]); d.subVectors(b, a); const len = Math.max(0.001, d.length()); d.normalize();

    const sun = new T.DirectionalLight('#FFF6EA', 1.55);
    sun.position.set(9, 16, 7);
    sun.target.position.set(0, 0, -0.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
    const sc = sun.shadow.camera; sc.left = -15; sc.right = 15; sc.top = 12; sc.bottom = -12; sc.near = 1; sc.far = 60;
    scene.add(sun); scene.add(sun.target);

    // a soft floor that fades into the white stage
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const cx = cv.getContext('2d'); const gr = cx.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, '#EDEBE5'); gr.addColorStop(0.55, '#F2F1EC'); gr.addColorStop(1, '#FFFFFF');
    cx.fillStyle = gr; cx.fillRect(0, 0, 256, 256);
    const tex = new T.CanvasTexture(cv); tex.colorSpace = T.SRGBColorSpace;
    const floor = new T.Mesh(new T.PlaneGeometry(64, 48), new T.MeshBasicMaterial({ map: tex }));
    floor.rotation.x = -Math.PI / 2; floor.position.set(0, -0.004, -0.8);
    scene.add(floor);
    const catcher = new T.Mesh(new T.PlaneGeometry(64, 48), new T.ShadowMaterial({ color: '#4A463C', opacity: 0.13 }));
    catcher.rotation.x = -Math.PI / 2; catcher.position.set(0, 0.0, -0.8); catcher.receiveShadow = true;
    scene.add(catcher);

    this.kit = P.pigKit(T);
    this.matBar = new T.MeshStandardMaterial({ color: '#CFD4D2', roughness: 0.5, metalness: 0.0 });
    this.matPanel = new T.MeshStandardMaterial({ color: '#F3F3EF', roughness: 0.85, metalness: 0 });
    this.matTile = new T.MeshStandardMaterial({ color: '#FBFAF7', roughness: 0.95, metalness: 0 });
    this.labels = new Map();
    this.spinners = [];
    this.buildSheet();

    this.cam = { tx: 0, ty: 0.3, tz: -1, dist: 28, yaw: 0, pitch: 0.62 };
    this.resize();
    this.ro = new ResizeObserver(() => { this.resize(); });
    this.ro.observe(this.mountEl);
    this.bindPointer();
    this.applied = this.props.start || 'all';
    this.put({ ready: true, view: this.applied });
    this.cam = this.presetFor(this.applied);
    this.dirty = true;
    if (window.__dbg) window.__pk = this;
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!this.alive) return; this.labels.forEach((L) => { L.w = 0; }); this.dirty = true; });
    this.t0 = performance.now();
    const loop = () => { if (!this.alive) return; this.raf = requestAnimationFrame(loop); this.frame(); };
    loop();
  }

  tile(g, x, z, w, d, y) {
    const T = this.T;
    const s = new T.Shape(); const r = 0.2, hw = w / 2, hd = d / 2;
    s.moveTo(-hw + r, -hd); s.lineTo(hw - r, -hd); s.quadraticCurveTo(hw, -hd, hw, -hd + r); s.lineTo(hw, hd - r); s.quadraticCurveTo(hw, hd, hw - r, hd); s.lineTo(-hw + r, hd); s.quadraticCurveTo(-hw, hd, -hw, hd - r); s.lineTo(-hw, -hd + r); s.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
    const geo = new T.ExtrudeGeometry(s, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.012, bevelSegments: 1, curveSegments: 6 });
    geo.rotateX(-Math.PI / 2);
    const m = new T.Mesh(geo, this.matTile);
    m.position.set(x, 0.0, z); m.receiveShadow = true; m.castShadow = true;
    g.add(m);
    (this.tileMeshes = this.tileMeshes || []).push(m);
    return m;
  }
  // one labelled tile: build(field, rails, rng, y) fills it in its own frame
  addTile(o) {
    const T = this.T, P = this.P;
    const root = new T.Group(); root.position.set(o.x, 0, o.z);
    this.scene.add(root);
    const tm = this.tile(root, 0, 0, o.w, o.d, 0);
    tm.userData.tile = o;
    const y = 0.062;
    const field = this.kit.field(), rails = P.railSet(T), rng = P.makeRng(o.seed || 7);
    o.build(field, rails, rng, y);
    const built = field.build();
    const spin = new T.Group(); root.add(spin);
    spin.add(built.hi); spin.add(built.base); spin.add(built.fix);
    const rg = rails.build(this.matBar, this.matPanel, true);
    spin.add(rg);
    if (o.spin !== false) this.spinners.push({ g: spin, base: o.angle == null ? -0.5 : o.angle, amp: 0.55, ph: (o.seed || 1) * 0.9 });
    else spin.rotation.y = o.angle || 0;
    this.label(o.id, o.name, o.size, o.x, 0.06, o.z + o.d / 2 + 0.28);
    o.root = root;
    return o;
  }
  label(id, name, size, x, y, z) {
    const el = document.createElement('div');
    el.style.cssText = "position:absolute; left:0; top:0; white-space:nowrap; will-change:transform; text-align:center; font-family: Geist, Inter, system-ui, sans-serif; display:none";
    const a = document.createElement('div'); a.textContent = name; a.style.cssText = 'font-size:13px; line-height:17px; font-weight:600; color:#121815; letter-spacing:-0.003em';
    const b = document.createElement('div'); b.textContent = size; b.style.cssText = "font-family: 'Geist Mono', ui-monospace, monospace; font-size:11.5px; line-height:15px; color:#626C66; margin-top:1px";
    el.appendChild(a); el.appendChild(b);
    this.labelsEl.appendChild(el);
    this.labels.set(id, { id: id, el: el, pos: new this.T.Vector3(x, y, z), w: 0, h: 0 });
  }

  buildSheet() {
    const P = this.P;
    const same = (o) => o;
    void same;
    const adult = (id, name, size, x, key, extra) => this.addTile(Object.assign({ id: id, name: name, size: size, x: x, z: -6.6, w: 2.8, d: 2.8, seed: 3 + (x | 0), build: (f, r, g, y) => { f.add(key, { x: 0, y: y, z: 0, yaw: 0 }); } }, extra || {}));
    adult('sow-stand', 'Sow, standing', '180 cm · 50 cm wide', -6.2, 'sow-stand');
    adult('sow-sternal', 'Sow, lying on her belly', '180 cm', -3.1, 'sow-sternal');
    adult('sow-side', 'Sow, lying on her side', '180 cm · 75 cm wide', 0, 'sow-side');
    adult('fin-stand', 'Finisher, standing', '120 cm', 3.1, 'finisher-stand');
    adult('fin-lie', 'Finisher, lying', '120 cm', 6.2, 'finisher-sternal');

    this.addTile({ id: 'suckle', name: 'Piglets, suckling', size: '11 piglets · 34 cm each', x: -4.65, z: -2.2, w: 2.8, d: 2.8, seed: 11, angle: -0.35, build: (f, r, g, y) => { P.crateFill(f, P.railSet(this.T), g, { x: 0, z: -0.05, y: y, head: 1, litter: 11, mode: 'suck', lamp: false }); } });
    this.addTile({ id: 'sleep', name: 'Piglets, sleeping', size: '12 piglets · under the lamp', x: -1.55, z: -2.2, w: 2.8, d: 2.8, seed: 13, angle: -0.3, build: (f, r, g, y) => { P.pigletHeap(f, g, 0, 0.05, y, 12); P.heatLamp(f, r, y, 0, 0.05, 0.75, 0.85); } });
    this.addTile({ id: 'weaner', name: 'Weaner, standing', size: '65 cm · 8 to 30 kg', x: 1.55, z: -2.2, w: 2.8, d: 2.8, seed: 17, build: (f, r, g, y) => { f.add('weaner-stand', { x: 0, y: y, z: 0, yaw: 0 }); } });
    this.addTile({ id: 'huddle', name: 'Weaners, lying in a huddle', size: '7 weaners', x: 4.65, z: -2.2, w: 2.8, d: 2.8, seed: 19, angle: -0.2, spin: false, build: (f, r, g, y) => { P.huddle(f, g, 'weaner', 0, 0, y, 7); } });

    // a farrowing crate, as the barn view builds it
    this.addTile({ id: 'crate', name: 'Farrowing crate', size: 'Sow on her side · 12 piglets · 9 days', x: -3.7, z: 2.9, w: 4.4, d: 3.0, seed: 29, spin: false, angle: 0, build: (f, r, g, y) => {
      const o = { x: 0, z: 0, y: y, head: 1, litter: 12, mode: 'mixed' };
      P.crateFill(f, r, g, o); P.crateRails(r, o);
      [-0.9, 0.9].forEach((dz) => { r.panel(0, y + 0.19, dz, 2.7, 0.38, 0.04); r.bar(-1.35, y + 0.45, dz, 1.35, y + 0.45, dz, 0.02); });
      [0.3, 0.7].forEach((hy) => r.bar(-1.35, y + hy, -0.9, -1.35, y + hy, 0.9, 0.016));
      [-0.9, 0.9].forEach((dz) => { r.bar(-1.35, y, dz, -1.35, y + 0.9, dz, 0.02); r.bar(1.35, y, dz, 1.35, y + 0.6, dz, 0.02); });
    } });
    // a nursery pen
    this.addTile({ id: 'pen', name: 'Nursery pen', size: '10 weaners · 150 × 240 cm', x: 3.7, z: 2.9, w: 3.8, d: 3.0, seed: 31, spin: false, angle: 0, build: (f, r, g, y) => {
      P.groupPenFill(f, r, g, { x: 0, z: 0, y: y, sx: 2.4, sz: 1.5, head: 1, n: 10, cls: 'weaner' });
      [-0.75, 0.75].forEach((dz) => { r.panel(0, y + 0.25, dz, 2.4, 0.5, 0.04); r.bar(-1.2, y + 0.56, dz, 1.2, y + 0.56, dz, 0.02); });
      [0.3, 0.7].forEach((hy) => { r.bar(-1.2, y + hy, -0.75, -1.2, y + hy, 0.75, 0.016); });
      [-0.75, 0.75].forEach((dz) => r.bar(-1.2, y, dz, -1.2, y + 0.84, dz, 0.02));
    } });
  }

  // ---------- camera ----------
  applyCam() {
    const c = this.cam, cp = Math.cos(c.pitch);
    this.camera.position.set(c.tx + Math.sin(c.yaw) * cp * c.dist, c.ty + Math.sin(c.pitch) * c.dist, c.tz + Math.cos(c.yaw) * cp * c.dist);
    this.camera.lookAt(c.tx, c.ty, c.tz);
    this.camera.updateMatrixWorld();
  }
  presetFor(view) {
    const asp = (this.W || 1360) / (this.H || 860);
    if (view === 'crate') return { tx: -3.7, ty: 0.35, tz: 2.9, dist: asp < 1.3 ? 9.6 : 7.4, yaw: 0.8, pitch: 1.05 };
    if (view === 'pen') return { tx: 3.7, ty: 0.3, tz: 2.9, dist: asp < 1.3 ? 9.0 : 6.8, yaw: -0.6, pitch: 1.0 };
    const tv = Math.tan(15 * Math.PI / 180), th = tv * asp;
    const pitch = 0.66;
    const wNeed = 15.6, hNeed = 12.4 * Math.sin(pitch) + 2.6;
    const dist = Math.max(wNeed / (2 * th), hNeed / (2 * tv)) * 1.02 + 2;
    return { tx: 0, ty: 0.2, tz: -1.0, dist: dist, yaw: 0, pitch: pitch };
  }
  goView(v, soft) {
    this.put({ view: v });
    this.tweenTo(this.presetFor(v), soft ? 900 : 1000);
  }
  tweenTo(to, ms) {
    const from = Object.assign({}, this.cam);
    let dy = to.yaw - from.yaw;
    while (dy > Math.PI) dy -= 2 * Math.PI;
    while (dy < -Math.PI) dy += 2 * Math.PI;
    to = Object.assign({}, to, { yaw: from.yaw + dy });
    this.tw = { from: from, to: to, t0: performance.now(), ms: ms || 900 };
    this.dirty = true;
  }
  resize() {
    const el = this.mountEl;
    const W = Math.max(1, el.clientWidth), H = Math.max(1, el.clientHeight);
    if (W === this.W && H === this.H) return;
    const first = !this.W;
    this.W = W; this.H = H;
    this.renderer.setSize(W, H);
    this.camera.aspect = W / H; this.camera.updateProjectionMatrix();
    this.dirty = true;
    if (!first && this.U && this.U.ready) this.cam = this.presetFor(this.U.view);
  }
  bindPointer() {
    const c = this.renderer.domElement;
    const T = this.T;
    let down = null;
    const h = {};
    h.down = (e) => { down = { x: e.clientX, y: e.clientY, moved: false }; this.tw = null; this.touched = true; try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } c.style.cursor = 'grabbing'; };
    h.move = (e) => {
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y; down.x = e.clientX; down.y = e.clientY;
      if (Math.abs(dx) + Math.abs(dy) > 0) down.moves = (down.moves || 0) + Math.abs(dx) + Math.abs(dy);
      if (down.moves > 4) down.moved = true;
      this.cam.yaw -= dx * 0.0055; this.cam.pitch = Math.max(0.3, Math.min(1.45, this.cam.pitch + dy * 0.0045));
      this.dirty = true;
    };
    h.up = (e) => {
      const d = down; down = null; c.style.cursor = 'grab';
      if (!d || d.moved || !e || e.target !== c) return;
      const b = c.getBoundingClientRect();
      const nd = new T.Vector2(((e.clientX - b.left) / b.width) * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
      const ray = new T.Raycaster(); ray.setFromCamera(nd, this.camera);
      const hit = ray.intersectObjects(this.tileMeshes || [], false)[0];
      if (hit) { const o = hit.object.userData.tile; this.put({ view: 'tile' }); this.tweenTo({ tx: o.x, ty: 0.35, tz: o.z, dist: Math.max(4.6, o.w * 1.55) * Math.max(1, 1.5 / ((this.W || 1360) / (this.H || 860))), yaw: 0.45, pitch: 0.62 }, 900); }
    };
    h.wheel = (e) => { e.preventDefault(); this.tw = null; this.cam.dist = Math.max(2.5, Math.min(60, this.cam.dist * Math.exp(e.deltaY * 0.0012))); this.dirty = true; };
    c.addEventListener('pointerdown', h.down);
    window.addEventListener('pointermove', h.move);
    window.addEventListener('pointerup', h.up);
    c.addEventListener('wheel', h.wheel, { passive: false });
    c.style.cursor = 'pointer';
    this.h = h;
  }
  frame() {
    const now = performance.now();
    if (this.tw) {
      const t = Math.min(1, (now - this.tw.t0) / this.tw.ms);
      const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const a = this.tw.from, b = this.tw.to;
      this.cam = { tx: a.tx + (b.tx - a.tx) * e, ty: a.ty + (b.ty - a.ty) * e, tz: a.tz + (b.tz - a.tz) * e, dist: Math.exp(Math.log(a.dist) + (Math.log(b.dist) - Math.log(a.dist)) * e), yaw: a.yaw + (b.yaw - a.yaw) * e, pitch: a.pitch + (b.pitch - a.pitch) * e };
      if (t >= 1) this.tw = null;
      this.dirty = true;
    }

    const tt = (now - this.t0) / 1000;
    if (this.spinners && this.spinners.length && !window.__still) { this.spinners.forEach((s) => { s.g.rotation.y = s.base + s.amp * Math.sin(tt * 0.42 + s.ph); }); this.dirty = true; }
    if (!this.dirty || !this.W) return;
    this.dirty = false;
    this.applyCam();
    this.renderer.render(this.scene, this.camera);
    this.placeLabels();
  }
  placeLabels() {
    const cam = this.camera, v = new this.T.Vector3(), W = this.W, H = this.H;
    const show = ((this.U && this.U.view) === 'all' || (this.U && this.U.view) === 'tile') && !window.__nolabels;
    this.labels.forEach((L) => {
      v.copy(L.pos).project(cam);
      const ok = show && v.z < 1 && v.z > -1;
      if (!ok) { L.el.style.display = 'none'; return; }
      if (!L.w) { L.el.style.display = 'block'; L.w = L.el.offsetWidth; L.h = L.el.offsetHeight; }
      const sx = (v.x * 0.5 + 0.5) * W, sy = (-v.y * 0.5 + 0.5) * H;
      L.el.style.display = 'block';
      L.el.style.transform = 'translate(' + Math.round(sx - L.w / 2) + 'px,' + Math.round(sy) + 'px)';
    });
  }

  renderVals() {
    const u = this.ui();
    const ic = this.icons();
    const FL = 'background: rgba(255, 255, 255, 0.96); border: 1px solid #E3E6E1; border-radius: 12px; box-shadow: 0 1px 2px rgba(18, 24, 21, 0.05), 0 8px 24px rgba(18, 24, 21, 0.06);';
    const seg = (on) => 'height: 36px; padding: 0 14px; border: 0; border-radius: 8px; font: inherit; font-size: 13px; font-weight: ' + (on ? '600' : '500') + '; cursor: pointer; background: ' + (on ? '#EEF0EC' : 'transparent') + '; color: ' + (on ? '#121815' : '#4A544E');
    const ready = u.ready && !u.err;
    const defs = [['all', 'All pigs'], ['crate', 'Crate'], ['pen', 'Nursery pen']];
    return {
      ic: ic,
      setRoot: (el) => { if (el) { this.rootEl = el; if (!this.availH) this.measure(); } },
      rootStyle: "width: 100%; height: " + (u.avail || 760) + "px; box-sizing: border-box; background: #FFFFFF; font-family: 'Geist', 'Inter', system-ui, sans-serif; color: #121815; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden",
      sub: 'Every kind of pig in the barn view, to scale',
      setMount: (el) => { if (el) this.mountEl = el; },
      setLabels: (el) => { if (el) this.labelsEl = el; },
      loading: !ready || !!u.err,
      loadMsg: u.err || 'Loading the 3D model…',
      ready: ready,
      camStyle: 'position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 2px; padding: 4px; ' + FL,
      views: defs.map((d) => ({ name: d[1], on: u.view === d[0], style: seg(u.view === d[0]), pick: () => this.goView(d[0]) })),
      iconBtn: 'width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: #121815; cursor: pointer',
      zoomIn: () => this.tweenTo(Object.assign({}, this.cam, { dist: Math.max(2.5, this.cam.dist * 0.72) }), 380),
      zoomOut: () => this.tweenTo(Object.assign({}, this.cam, { dist: Math.min(60, this.cam.dist * 1.38) }), 380)
    };
  }
}
