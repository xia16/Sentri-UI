<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="expect" content="gap"><title>Record dead, before #150: the body 10px under the hairline</title>
<link rel="stylesheet" href="../../ux/design-system/tokens.css"><link rel="stylesheet" href="../../ux/design-system/components/bundle.css"><script src="../../ux/design-system/components/bundle.js"></script>
<style>html,body{margin:0}.ph{position:relative;height:844px;overflow:hidden;background:var(--app-background);font-family:var(--font-sans);color:var(--ink)}.ph .bg{padding:56px var(--space-gutter) 0}.sheet-titles{flex:1;min-width:0}.sheet-subtitle{margin:11px 0 0;font:var(--type-description-size)/1.6 var(--font-sans);color:var(--muted)}.sheet-aside{flex:none;display:flex;align-items:center;align-self:center;gap:var(--space-6)}.sheet-aside .st-text-action{min-width:var(--tap-min)}.utility-header{text-align:left}.sheet-titles{align-items:flex-start}</style></head><body>
<div class="ph"></div><script>
const UI=window.SentriUI;
const behind=()=>UI.panel(UI.row({title:'Litter',description:'Day 2 · B4'}),{className:'st-row-group'});
const body=()=>UI.field({label:'Cause',control:'<textarea rows="3"></textarea>'});
const foot=(p)=>UI.sheetFooter(Object.assign({back:{action:'back'},primary:{label:'Record death',action:'save'}},p||{}));
const draw=(html)=>{document.querySelector('.ph').innerHTML='<div class="bg">'+behind()+'</div>'+html;};
</script>
<script>draw(`<section class="sheet" data-ds="Sheet" role="dialog" aria-modal="true" data-st-context="drawer" data-size="short" data-sizing="content"><div class="grab" aria-hidden="true"></div><header class="utility-header"><div class="sheet-titles"><h2 class="sheet-title">Record dead</h2></div></header><div class="sheet-body" style="padding-top:10px">BODY</div>FOOT</section>`.replace('BODY',UI.stepper({label:'Piglets',value:0,key:'died',action:'step'})).replace('FOOT',foot()));</script>
</body></html>
