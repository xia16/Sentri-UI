<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="expect" content="pass"><title>Page header: the title sits beside Back, so body text aligns to Back, not the title (Headers law, 2026-10-13)</title><style>
.ph{position:relative;max-width:390px;margin:0 auto;background:var(--paper);font-family:var(--sans);color:var(--ink);border:1px solid var(--line)}
.ph .utility-header{display:flex;align-items:center;padding:8px 18px 16px;border-bottom:1px solid var(--line);text-align:left}
.ph .sheet-titles{flex:1;display:flex;flex-direction:column;align-items:flex-start}
.ph .sheet-title{margin:0;font:500 17px/1.3 var(--font-sans)}
.ph .sheet-body{padding:24px 18px}
</style></head><body>
<div class="ph" data-state="Empty"><section data-ds="Sheet"><header class="utility-header"><button type="button" aria-label="Back" style="width:48px;height:48px;margin-right:12px">&lt;</button><div class="sheet-titles"><h2 class="sheet-title">Selected</h2></div></header><div class="sheet-body"><p class="st-choice-empty">Nothing selected yet. Tap a pig in the list to add it.</p></div></section></div>
</body></html>
