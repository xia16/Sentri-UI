<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="expect" content="pass"><title>Pen map scrolled: tiles scrolled out of view are not on screen</title><style>
.ph{position:relative;height:var(--phone-height);max-width:var(--phone-width);margin:0 auto;overflow:hidden;background:var(--app-background);font-family:var(--font-sans);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .bg{padding:0 var(--space-gutter)}
.ph .bar{display:flex;justify-content:space-between;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
/* the 101px tiles of an earlier size cap: the fourth one runs past the map's bottom edge, under the footer */
.ph[data-demo=tall] .st-pen-grid .st-pen-tile{min-height:101px!important}
</style></head><body>
<!-- A map opened deep in a long room: the grid's top is far above the drag handle, but scrolled out of view (k). A tile cut by
     the map's bottom edge sits in the scroller, not beside the footer's buttons (i). Both are what the phone shows, not defects. -->
<div class="ph" data-state="Opened at A30 of 2 × 60" data-demo="deep"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Group pens, the fourth cut at the bottom" data-demo="tall"><div class="bg"></div><div class="over"></div></div>
<script>
const UI=window.SentriUI;
const bg=()=>'<div class="bar" aria-hidden="true"><span>9:41</span></div>'+UI.heading({title:'Farrowing',kind:'page',description:'Last record 08:41 · G.H'});
const R={
 deep:{lanes:['A','B'],depth:60,pens:{A30:'act',B31:'plain'},current:'A30'},
 tall:{lanes:[{runs:[{n:6,type:'Group pen',size:545}]},{runs:[{n:6,type:'Group pen',size:545}]}],rows:[{letter:'C',runs:[{n:4,type:'Sick pen',size:250}]}],pens:{A1:'plain',B2:'act'},current:'A1'}
};
document.querySelectorAll('[data-state]').forEach((el,i)=>{const b=R[el.dataset.demo];el.querySelector('.bg').innerHTML=bg();
 el.querySelector('.over').innerHTML=UI.sheet({surface:'menu',size:'long',title:'Pen map',label:'Pen map',body:UI.penMap(Object.assign({},b,{action:'pick',key:'fx-'+i})),footer:UI.penMapFooter({back:{action:'back',label:'Back'}})});});
</script></body></html>
