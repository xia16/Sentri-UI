<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit and the litter record</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css. Cards (ADR 0002): the correction Banner, Status lines for every receipt and
   warning, Button's text register and waiting face (buttonReason + guard). WellTray stays a task-level composition
   (ADR 0002: one consumer). The litter header and stamp words come from the shell (shell-ui.js, shell.css). */
.ed-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.ed-phone .scrim { inset: 0; }
/* The page sits under the scrim of a drawer opened over it (R1-28: the crate picker had no visible scrim). */
.ed-phone .sheet[data-presentation="page"] { z-index: 1; }
.ed-body { display: flex; flex-direction: column; gap: var(--space-section); }
.ed-body > * { margin: 0; }
.ed-group { display: flex; flex-direction: column; gap: var(--space-heading); }
.ed-group > * { margin: 0; }
.ed-pad { flex: none; padding: var(--space-row-y) var(--space-gutter); background: var(--paper); border-top: 1px solid var(--line); }
.ed-phone .sheet-footer > .button { flex: 1; }
.ed-phone .sheet-footer { flex-wrap: wrap; row-gap: var(--space-row-y); }
/* A record-page entry's change lines, moved right under its title (see logHtml): colour on the value, the words ink. */
.ed-delta { margin: 0; font-size: var(--type-description-size); line-height: 1.5; color: var(--ink); }
.ed-delta + .ed-delta { margin-top: var(--space-key-gap); }
/* Each part of a change line wraps as a whole, so a wrapped part never lies under another. */
.ed-delta > span, .ed-line > span { display: inline-block; max-width: 100%; }
.ed-line { margin: 0; font-size: var(--type-row-title-size); line-height: 1.5; color: var(--ink); }
/* A text action on its own line, right-aligned under the thing it acts on (Button text register). */
.ed-act { display: flex; justify-content: flex-end; }
.ed-act > .st-text-action, .ed-later-row > .st-text-action { flex: none; min-width: var(--touch-min); justify-content: flex-end; padding: 0; }
/* The records a change would drop: each named, each with its door. */
.ed-later { display: flex; flex-direction: column; gap: var(--space-key-gap); }
.ed-later-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-footer-gap); }
.ed-later-row > .ed-line, .ed-later-row > .st-status-line { flex: 1; min-width: 0; }
.ed-body .st-status-line { margin: 0; }
/* A record-page entry a door points at (the death or Move that explained a count line): marked, and briefly lit. */
.st-log-extra:has(> .ed-anchor:only-child) { display: none; }
.st-log-entry[data-flash] { background: var(--amber-wash); }
/* Candidate:WellTray — farrowing's At-finish tray: a row expands in place into a well whose fields edit within the one
   Edit screen (no drawer, no second Save). */
.ed-tray { display: flex; flex-direction: column; gap: var(--space-row-y); padding: var(--space-row-y) var(--space-panel) var(--space-panel); background: var(--well); border-radius: var(--radius-inset); }
.ed-tray > * { margin: 0; }
</style>
</head>
<body>
<main class="inspection-phone ed-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, U = window.PPUI, ICON = window.SentriIcons;

  /* ---- states: a variant of the shared fixture + the crate + the Edit draft. What can be corrected, the change summary,
     the records a change would drop, why Save waits and the effect of Save are the ledger's (select.edit: the draft is ONE
     correction event, replayed exactly as append would); the record page is select.record; the possible-double answer is
     select.doubleDraft. Draft keys `@<dose>` name the newest mark of that dose; `@first` the litter's first death. ---- */
  var STATES = {
    'record-page':            { view: 'record', data: 'a02-marked', crate: 'A02' },
    'record-page-corrected':  { view: 'record', data: 'a02-corrected', crate: 'A02' },
    'record-page-concurrent': { view: 'record', data: 'a02-concurrent', crate: 'A02' },
    'edit':                   { view: 'edit', data: 'a02-marked', crate: 'A02' },
    'edit-changed':           { view: 'edit', data: 'a02-marked', crate: 'A02', draft: { marks: { 'T-A02-visit': { n: 10, reason: 'weak' } } } },
    'edit-unrecord':          { view: 'edit', data: 'a02-marked', crate: 'A02', draft: { marks: { 'T-A02-tail': { void: true } } } },
    'edit-gated':             { view: 'edit', data: 'a02-followup', crate: 'A02', draft: { marks: { 'T-A02-visit': { n: 12 } } } },
    'wrong-litter':           { view: 'edit', data: 'a02-marked', crate: 'A02', draft: { marks: { 'T-A02-tail': { to: 'A04' } } } },
    'wrong-litter-there':     { view: 'record', data: 'a02-wrong-litter', crate: 'A04' },
    'wrong-litter-back':      { view: 'edit', data: 'a02-wrong-litter', crate: 'A04', draft: { marks: { '@tail': { back: true } } } },
    'edit-row':               { view: 'edit', data: 'a02-tags-all', crate: 'A02', lead: 'rows', row: 'A02-r4', pad: 'weight', typed: { weight: '1.15' } },
    'edit-row-dup':           { view: 'edit', data: 'a02-tags-all', crate: 'A02', lead: 'rows', row: 'A02-r4', pad: 'tag', typed: { tag: '004305' } },
    'withdraw-row':           { view: 'edit', data: 'a02-tags-over', crate: 'A02', lead: 'rows', row: 'A02-r13', draft: { rows: { 'A02-r13': { withdraw: true } } } },
    'withdraw-dead':          { view: 'edit', data: 'base', crate: 'B04', lead: 'rows', row: 'B04-r3', draft: { rows: { 'B04-r3': { withdraw: true } } } },
    'reopen-set':             { view: 'edit', data: 'keepers-closed', crate: 'A07', lead: 'rows', draft: { reopen: true } },
    'edit-move':              { view: 'edit', data: 'moved-b06-b08', crate: 'B06', lead: 'moves', draft: { moves: { 'MV-0929-01': { n: 1 } } } },
    'edit-move-void':         { view: 'edit', data: 'moved-b06-b08', crate: 'B06', lead: 'moves', draft: { moves: { 'MV-0929-01': { void: true } } } },
    'edit-move-rows':         { view: 'edit', data: 'moved-to-c05', crate: 'C03', lead: 'moves', draft: { moves: { 'MV-0929-02': { rows: ['C03-r4'] } } } },
    'edit-after-end':         { view: 'edit', data: 'ended', crate: 'B03', draft: { marks: { 'T-B03-wrong': { to: 'B01' } } } },
    'edit-after-end-lower':   { view: 'edit', data: 'ended', crate: 'C04', draft: { marks: { '@health': { n: 7 } } } },
    'edit-restored':          { view: 'edit', data: 'a02-corrected', crate: 'A02', restore: { draft: { marks: { 'T-A02-visit': { n: 11, reason: 'weak' } } }, base: { marks: { 'T-A02-visit': 12 } } } },
    // RULINGS round 3: a mistaken count is corrected through Edit (withdrawn here); the record page shows the correction
    'edit-count':             { view: 'edit', data: 'explain', crate: 'B06', lead: 'counts', draft: { counts: { 'C-B06-loss': { void: true } } } },
    'record-page-count':      { view: 'record', data: 'b06-count-corrected', crate: 'B06' },
    // R1-7: deaths are listed; one recorded by mistake is withdrawn, one on the wrong litter moves; a tagged one only withdraws
    'edit-deaths':            { view: 'edit', data: 'held-body', crate: 'A07', lead: 'deaths' },
    'edit-death-void':        { view: 'edit', data: 'count-offline', crate: 'A07', lead: 'deaths', draft: { deaths: { 'D-A07-gh': { void: true } } } },
    'edit-death-move':        { view: 'edit', data: 'count-offline', crate: 'A07', lead: 'deaths', draft: { deaths: { 'D-A07-gh': { to: 'A05' } } } },
    'edit-death-tagged':      { view: 'edit', data: 'base', crate: 'B04', lead: 'deaths', draft: { deaths: { '@first': { void: true } } } },
    // R1-28: castration's not-castrated reasons are Q16's (hernia · cryptorchid · deferred · kept boar)
    'edit-castration':        { view: 'edit', data: 'a02-castrated', crate: 'A02', draft: { marks: { 'T-A02-visit': { n: 2, reason: 'hernia' } } } },
    // R1-28: Save says what the correction did (the receipt of the newest correction on this litter)
    'edit-saved':             { view: 'edit', data: 'b06-count-corrected', crate: 'B06', saved: true },
    // R1-29 + round 4: a possible double lists its answer; the answer sheet has a URL of its own
    'edit-double':            { view: 'edit', data: 'base', crate: 'A05' },
    'double':                 { view: 'double', data: 'base', crate: 'A05' },
    'double-same':            { view: 'double', data: 'base', crate: 'A05', answer: { answer: 'same' } },
    'double-same-picked':     { view: 'double', data: 'base', crate: 'A05', answer: { answer: 'same', withdraw: 'T-A05-lm' } },
    'double-twice':           { view: 'double', data: 'base', crate: 'A05', answer: { answer: 'twice' } },
    'double-answered':        { view: 'double', data: 'double-same', crate: 'A05' },
    // R1-14: the record page tells one truthful story
    'record-page-held':       { view: 'record', data: 'held-body', crate: 'A07' },
    'record-page-double':     { view: 'record', data: 'base', crate: 'A05' },
    'record-page-double-same':  { view: 'record', data: 'double-same', crate: 'A05' },
    'record-page-double-twice': { view: 'record', data: 'double-twice', crate: 'A05' }
  };
  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'edit';
  var st = STATES[name];
  var store, CFG, TODAY, SOW, crate, ME;
  var view = st.view;
  var EMPTY = function () { return { marks: {}, moves: {}, rows: {}, counts: {}, deaths: {}, reopen: false }; };
  var draft = EMPTY();
  var lead = '', rowOpen = null, pad = null, typed = {}, picker = null, pickerBefore = null, ceilTap = '', drawerClosedAt = 0, lastSave = 0, notices = [];
  var cleared = null, clearTimer = 0, saved = null, dbl = { answer: '', withdraw: '' }, dblSaved = null;

  /* ---- the ledger ---- */
  function L(c) { return store.derived.litters[c || crate]; }
  function stamp() { return { id: 'edit-draft', at: null, who: ME }; }
  var memo = { k: '', v: null };
  function E() { var k = JSON.stringify(draft) + store.events.length; if (memo.k !== k) memo = { k: k, v: exemptCastration(store.select.edit(store.derived, crate, draft, stamp())) }; return memo.v; }
  function doseCfg(id) { return CFG.doses.filter(function (d) { return d.id === id; })[0]; }
  function mark(e, id) { return e.marks.filter(function (m) { return m.id === id; })[0]; }
  function row(e, id) { return e.rows.filter(function (r) { return r.rowId === id; })[0]; }
  function move(e, id) { return e.moves.filter(function (m) { return m.id === id; })[0]; }
  function countOf(e, id) { return e.counts.filter(function (c) { return c.id === id; })[0]; }
  function deathOf(e, id) { return e.deaths.filter(function (x) { return x.id === id; })[0]; }
  function changeOf(e, key, val) { return e.changes.filter(function (c) { return c[key] === val; })[0]; }
  function eventOf(id) { return store.events.filter(function (x) { return x.id === id; })[0] || null; }
  var EXEMPT = ['hernia', 'cryptorchid', 'kept'];
  /* Q16 on a corrected castration: select.edit files every not-castrated piglet of a lowered castration as deferred with
     the reason given. Hernia, cryptorchid and kept boar leave the task (Q15), so the page moves them to their own field and
     replays the event through append (store.trial) — the ledger still decides. Logged for the ledger worker. */
  function exemptCastration(e) {
    if (!e || !e.events || !e.events.length) return e;
    var list = e.events[0].changes, touched = false;
    e.changes.forEach(function (c) {
      if (c.kind !== 'mark' || EXEMPT.indexOf(c.reason) < 0) return;
      var m = mark(e, c.mark); if (!m || !m.castration) return;
      var ch = list.filter(function (x) { return x.target === m.id && x.set && x.set.castration; })[0]; if (!ch) return;
      var was = m.castration, k = c.rest - (was.deferred || 0); if (k <= 0) return;
      var set = Object.assign({}, was, { castrated: c.to });
      set[c.reason] = (was[c.reason] || 0) + k;
      if (!was.deferred) { delete set.deferred; delete set.deferReason; }
      ch.set = { castration: set };
      c.exempt = k; touched = true;
    });
    if (!touched) return e;
    var r = store.trial(e.events[0]);
    if (!r.ok) { e.why = r.reason === 'correction_invalid' && r.detail ? r.detail.reason : r.reason; e.whyDetail = r.detail; e.events = null; }
    return e;
  }
  // Open possible doubles on this litter, and the answered ones (round 4).
  function pairs(c) { var out = []; var X = L(c); if (!X) return out; Object.keys(X.doses).forEach(function (k) { X.doses[k].possibleDoubleTreatment.forEach(function (p) { out.push({ dose: k, records: p.slice() }); }); }); return out; }
  function answered(c) { var out = []; var X = L(c); if (!X) return out; Object.keys(X.doses).forEach(function (k) { X.doses[k].doubles.forEach(function (x) { out.push(Object.assign({ dose: k }, x)); }); }); return out; }
  function pairOf(id) { return pairs().filter(function (p) { return p.records.indexOf(id) >= 0; })[0] || null; }

  /* ---- words: registered strings as spans (Log, headings) and as Status parts (banner, receipts) ---- */
  var span = function (id, args, tone) { return U.span(id, args, { tone: tone }); };
  var SEP = function () { return ' ' + span('pp.common.sep') + ' '; };
  function part(id, args, tone) { return { text: PP.t(id, args), strs: { text: id }, args: args ? { text: args } : undefined, tone: tone || undefined }; }
  function sline(tokens, o) { return UI.statusLine(tokens.filter(Boolean), Object.assign({ sep: 'dot' }, o || {})); }
  function tx(dose) { var d = doseCfg(dose); return d.tx === 'iron' ? ['pp.litter.tx_day', { tx: PP.t('pp.common.tx.iron'), d: d.due }] : ['pp.common.tx.' + d.tx, null]; }
  function txText(dose) { var t = tx(dose); return PP.t(t[0], t[1]); }
  function txPart(dose) { var t = tx(dose); return part(t[0], t[1]); }
  function pigs(n) { return [PP.one('pp.common.unit.piglet', n), { n: n }]; }
  function pigsText(n) { return PP.tn('pp.common.unit.piglet', n); }
  function pigsPart(n, tone) { var p = pigs(n); return part(p[0], p[1], tone); }
  function why(k) { return PP.t(k === 'not_done' ? 'pp.edit.why.not_done_word' : 'pp.litter.why.' + k); }
  function idOf(r) { return (r && (r.tag || r.notch)) || ''; }
  function stampText(iso, who) { return U.stamp(iso, who, TODAY); }
  function stampStrs(iso, who) { return ['pp.common.stamp.' + (String(iso).slice(0, 10) === TODAY ? 'today' : 'date'), { t: U.time(iso), who: who, date: U.date(iso) }]; }
  function stampPart(iso, who) { var s = stampStrs(iso, who); return part(s[0], s[1]); }
  function sexWord(s) { return PP.t(s === 'b' ? 'pp.common.sex.boar' : 'pp.common.sex.gilt'); }
  function causeText(byCause) { return Object.keys(byCause || {}).map(function (c) { return PP.t('pp.edit.rec.death_part', { n: byCause[c], cause: PP.t('dead.' + c.replace('-', '_')) }); }).join(' · '); }
  // Record-page day headers: today, yesterday, then the date.
  function dayWord(date) {
    var a = Date.UTC(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10)), b = Date.UTC(+TODAY.slice(0, 4), +TODAY.slice(5, 7) - 1, +TODAY.slice(8, 10));
    var k = Math.round((b - a) / 86400000);
    return k === 0 ? PP.t('time.today') : k === 1 ? PP.t('time.yesterday') : U.date(date);
  }
  // Button's text register (ADR 0002): a bare word, right-aligned on what it acts on.
  function textAction(action, id, args, value) { return UI.button({ label: PP.t(id, args), register: 'text', action: action, value: value == null ? '' : value, strs: { label: id }, args: args ? { label: args } : undefined }); }
  function button(register, action, id, o) { o = o || {}; return UI.button({ label: PP.t(id), register: register, action: action, waiting: !!o.waiting, describedby: o.describedby || '', strs: { label: id } }); }
  function header(sub, args) { return U.litterHeader({ crate: crate, sow: SOW.sow, parity: SOW.parity, sub: span(sub, args) }); }
  // A changed value, amber, with its unit: `12 → 10 piglets`.
  function dPigs(a, b) { return span(PP.one('pp.edit.delta_pigs', b), { a: a, b: b }, 'amber'); }
  function dText(a, b) { return span('pp.edit.delta', { a: a, b: b }, 'amber'); }
  function dPigsPart(a, b) { return part(PP.one('pp.edit.delta_pigs', b), { a: a, b: b }, 'amber'); }
  function dTextPart(a, b) { return part('pp.edit.delta', { a: a, b: b }, 'amber'); }
  function fieldText(k, v) {
    if (v == null || v === '') return PP.t('ds.field.placeholder');
    if (k === 'weight') return PP.t('pp.common.kg', { w: v });
    if (k === 'sex') return sexWord(v);
    return String(v);
  }
  function castrText(c) {
    return ['hernia', 'cryptorchid', 'kept', 'deferred'].filter(function (k) { return c[k]; }).map(function (k) {
      return PP.t('pp.common.mark.part', { n: c[k], reason: why(k === 'deferred' && c.deferReason ? c.deferReason : k) });
    }).join(PP.lang === 'zh' ? '，' : ', ');
  }
  function amountOf(f) { return f.castration ? f.castration.castrated || 0 : f.n; }

  /* =====================================================================================================
     The litter record page: the ledger as a timeline (Log), newest first, grouped by day; read-only. One truthful story
     (R1-14): a count line explained reads explained (with a door to what explained it), a held body reads held until its
     answer, a withdrawn record reads withdrawn, a death's photos show, a possible double shows and links to its answer.
     ===================================================================================================== */
  function treatTitle(x) {
    var t = txText(x.dose);
    if (x.castration) {
      var rest = castrText(x.castration);
      return rest ? ['pp.edit.rec.castr_not', { tx: t, c: x.castration.castrated || 0, rest: rest }] : ['pp.edit.rec.castr', { tx: t, c: x.castration.castrated || 0 }];
    }
    if (x.target === 'unknown') return ['pp.edit.rec.arrived', { tx: t, pigs: pigsText(x.n) }];
    if (x.deferred && x.deferred.n) return ['pp.edit.rec.treat_def', { tx: t, pigs: pigsText(x.n), k: x.deferred.n, reason: why(x.deferred.reason || 'deferred') }];
    return ['pp.edit.rec.treat', { tx: t, pigs: pigsText(x.n) }];
  }
  // One change of a correction, as a line: the act it touched (with its stamp), the changed value amber.
  function recChange(ch) {
    var b = ch.before, a = ch.after, T = ch.target || {};
    var of = T.at ? SEP() + span('pp.edit.rec.of', { stamp: stampText(T.at, T.who) }) : '';
    switch (ch.kind) {
      case 'mark':
        var rest = a.castration ? (castrText(a.castration) ? SEP() + span('pp.edit.rec.castr_rest', { rest: castrText(a.castration) }, 'amber') : '')
          : a.deferred && a.deferred.n ? SEP() + span(a.deferred.reason === 'not_done' ? 'pp.edit.ch.not_done' : 'pp.common.mark.deferred', { k: a.deferred.n, reason: why(a.deferred.reason || 'deferred') }, 'amber') : '';
        return span(tx(T.dose)[0], tx(T.dose)[1]) + ' ' + dPigs(amountOf(b), amountOf(a)) + rest + of;
      case 'void':
        return span(tx(T.dose)[0], tx(T.dose)[1]) + ' ' + dPigs(amountOf(b), 0) + SEP() + span('pp.edit.rec.by_mistake') + of;
      case 'wrong':
        if (!ch.here) return span(tx(T.dose)[0], tx(T.dose)[1]) + ' ' + span(pigs(amountOf(ch.fresh))[0], pigs(amountOf(ch.fresh))[1], 'amber') + SEP() + span('pp.edit.rec.fresh.from', { code: T.litter, stamp: stampText(ch.fresh.at, ch.fresh.who) });
        return span(tx(T.dose)[0], tx(T.dose)[1]) + ' ' + dPigs(amountOf(b), 0) + SEP() + span('pp.edit.rec.done_on', { code: ch.fresh.litter }) + ' ' + span(pigs(amountOf(ch.fresh))[0], pigs(amountOf(ch.fresh))[1], 'amber') + of;
      case 'restore':
        return span(tx(T.dose)[0], tx(T.dose)[1]) + ' ' + span('pp.edit.ch.restored', null, 'amber') + of;
      case 'move':
        var parts = [];
        if (a.n !== b.n) parts.push(dPigs(b.n, a.n));
        if (a.to !== b.to) parts.push(dText(b.to, a.to));
        if (a.from !== b.from) parts.push(dText(b.from, a.from));
        if (JSON.stringify(a.rows) !== JSON.stringify(b.rows) && a.n === b.n) parts.push(span('pp.edit.ch.rows_picked', null, 'amber'));
        return span('pp.edit.ch.move', { a: b.from, b: b.to }) + ' ' + parts.join(SEP()) + of;
      case 'move_void':
        return span('pp.edit.ch.move', { a: b.from, b: b.to }) + ' ' + dPigs(b.n, 0) + SEP() + span('pp.edit.rec.by_mistake') + of;
      case 'row':
        return span('pp.id.row.id', { id: idOf(ch.row) }) + ' ' + Object.keys(ch.set || {}).map(function (k) { return span('pp.edit.f.' + k + '_word') + ' ' + span('pp.edit.to_value', { b: fieldText(k, ch.set[k]) }, 'amber'); }).join(SEP());
      case 'withdraw':
        return span('pp.id.row.id', { id: idOf(ch.row) }) + ' ' + span('pp.edit.ch.withdrawn', null, 'amber') + SEP() + span('pp.edit.rec.by_mistake');
      case 'reopen':
        return span('pp.edit.ch.keepers') + ' ' + span('pp.edit.ch.reopened', null, 'amber') + of;
      case 'count':
        return span('pp.edit.ch.count') + ' ' + dPigs(b.observed, a.observed) + of;
      case 'count_void':
        return span('pp.edit.ch.count') + ' ' + span(pigs(b.observed)[0], pigs(b.observed)[1]) + ' ' + span('pp.edit.ch.count_void', null, 'amber') + SEP() + span('pp.edit.rec.by_mistake') + of;
      case 'death_void':
        return span('pp.edit.ch.death', { list: deathList(b) }) + ' ' + span('pp.edit.ch.withdrawn', null, 'amber') + SEP() + span('pp.edit.rec.by_mistake') + of;

      commitRowTyping(); if (view === 'edit') persist();
      location.href = home();
    } else if (a === 'open-edit') {
      location.href = PP.href('edit.html', { state: 'edit', crate: crate, data: store.name, from: 'record' });
    } else document.documentElement.setAttribute('data-door', a + ':' + (v || ''));
  });
  function openPicker(p) {
    var bm = JSON.parse(JSON.stringify(draft));
    if (p.kind === 'mark') { var pm = bm.marks[p.id]; if (pm && pm.to === '') delete bm.marks[p.id]; }
    if (p.kind === 'death') { var pd = bm.deaths[p.id]; if (pd && pd.to === '') delete bm.deaths[p.id]; }
    pickerBefore = JSON.stringify(bm); picker = p;
  }

  PP.ready.then(function () {
    ME = window.PPFixtures.ME;
    var q = qs.get('crate');
    // From another page: ?data= names its variant (none = the base story); a state's own draft belongs to its own crate.
    store = PP.open(qs.get('data') || (q ? 'base' : st.data));
    CFG = store.config; TODAY = store.today;
    crate = q || st.crate;
    SOW = store.sow(crate) || { sow: '', parity: 0 };
    if (!L()) { document.getElementById('screen').innerHTML = ''; return; }
    var own = !q || q === st.crate;
    var e0 = view === 'edit' ? store.select.edit(store.derived, crate, EMPTY(), stamp()) : null;
    var resolve = function (d) {

        var m = e0.marks.filter(function (x) { return x.dose === k.slice(1); })[0];
        if (m) d.marks[m.id] = d.marks[k];
        delete d.marks[k];
      });

    if (view === 'edit') {
      if (own && st.restore) restore(JSON.parse(JSON.stringify(st.restore)));

      else { try { var kept = JSON.parse(localStorage.getItem(key()) || 'null'); if (kept) restore(kept); } catch (err) {} }
      // A saved correction's receipt: the one named, or (the state) the newest correction that touched this litter.
      var sid = qs.get('saved');
      if (sid && eventOf(sid)) saved = { id: sid };
      else if (st.saved && own) {
        var R = store.select.record(store.derived, crate), last = null;
        R.days.forEach(function (g) { g.entries.forEach(function (x) { if (x.kind === 'correction' && !last) last = x; }); });
        if (last) saved = { id: last.id };
      }
    }
    if (view === 'double' && own && st.answer) dbl = Object.assign({ answer: '', withdraw: '' }, st.answer);
    // Arriving on a row (the identity table's row, ?row= its tag, notch or id): it opens in place.
    var want = qs.get('row') || (own ? st.row : null);
    if (want) { var hit = L().identity.rows.filter(function (r) { return r.rowId === want || r.tag === want || r.notch === want; })[0]; if (hit) rowOpen = hit.rowId; }
    if (own && st.pad && rowOpen) { pad = st.pad; typed = Object.assign({}, st.typed || {}); commitRowTyping(); }
    lead = qs.get('count') || qs.get('from') === 'count' ? 'counts' : qs.get('move') || qs.get('from') === 'move' ? 'moves' : qs.get('death') || qs.get('from') === 'dead' ? 'deaths' : qs.get('from') === 'id' || qs.get('row') ? 'rows' : own ? st.lead || '' : '';
    render();
  });
