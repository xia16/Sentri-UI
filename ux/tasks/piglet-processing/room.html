<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piglet processing · Room</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Room list: layout only, from tokens.css. The litter rows are the shell's (shell-ui.js); the drift, review and ended doors
   are Row (ADR 0002: DriftStrip became a row with toned tokens). Candidate:LeadFigure and Candidate:ScanFrame stay task-level. */
#screen { display: flex; flex-direction: column; gap: var(--space-section); }
.pp-head { display: flex; align-items: flex-start; gap: var(--space-footer-gap); }
.pp-head > .pp-title { flex: 1; min-width: 0; }
.pp-head .st-heading { margin: 0; }
.pp-head .pp-title > .st-heading + .st-heading { margin-top: 4px; }
.pp-controls { display: flex; align-items: center; gap: var(--space-footer-gap); }
.pp-controls .segment { flex: 1; min-width: 0; }
.pp-block > .st-heading { margin-bottom: 8px; }
.pp-filtered { margin-top: 20px; }
.pp-controls + .pp-filtered { margin-top: 20px; }
.pp-filtered:first-child { margin-top: 0; }
.pp-bulkdoor { padding-top: var(--space-heading); }
.pp-list { display: flex; flex-direction: column; gap: var(--space-footer-gap); }
.pp-dock { position: sticky; bottom: 0; margin: 0 calc(-1 * var(--space-gutter)) -20px; }
@media (max-width: 370px) { .pp-dock { margin-left: calc(-1 * var(--space-gutter-narrow)); margin-right: calc(-1 * var(--space-gutter-narrow)); padding-left: var(--space-gutter-narrow); padding-right: var(--space-gutter-narrow); } }
.pp-dock .button { gap: 8px; }
.pp-dock .button svg { width: 18px; height: 18px; }
.pp-locked { position: relative; height: 100vh; overflow: hidden; }
.pp-layer .scrim { inset: 0; }
.pp-layer .sheet { max-height: 85%; }
.pp-layer .sheet-body { padding-bottom: var(--space-panel); }
.pp-layer .sheet-body > * + * { margin-top: var(--space-heading); }
.pp-layer .utility-header { display: flex; align-items: center; gap: var(--space-footer-gap); padding: var(--space-gutter) var(--space-gutter) 8px; }
.pp-layer .utility-header .st-heading { margin: 0; flex: 1; }
.pp-layer .sheet-footer { justify-content: flex-end; }
.pp-scan-frame { display: grid; place-items: center; min-height: 200px; margin-bottom: var(--space-footer-gap); border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--inset); color: var(--ink); }
.pp-scan-frame svg { width: 64px; height: 64px; }
.pp-findbar { display: flex; align-items: flex-start; gap: var(--space-footer-gap); }
.pp-findbar .field { flex: 1; min-width: 0; margin: 0; }
.pp-findbar + #scan-results { margin-top: var(--space-footer-gap); }
.pp-results > * + * { margin-top: var(--space-footer-gap); }
.pp-outside { margin-top: var(--space-section); }
.pp-outside > .st-heading { margin-bottom: 8px; }

/* Candidate:LeadFigure: the number of litters that owe today, in the figure style of farrowing's task header. */
.pp-lead { display: flex; align-items: baseline; gap: var(--space-footer-gap); }
.pp-lead .pp-fig { font-family: var(--font-mono); font-size: var(--type-figure-lg-size); font-weight: 500; color: var(--ink); }
.pp-lead .pp-leadlab { font-size: var(--type-row-title-size); color: var(--muted); }
.pp-wide { width: 100%; }
.pp-last { margin-top: 4px; }
</style>
</head>
<body>
<main class="phone inspection-phone" data-st-context="page" id="phone">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, I = window.SentriIcons.icon, U = window.PPUI;

  /* ---- states: a fixture variant (the shared log, fixtures.js) + UI state. Every figure comes from the ledger's selectors
     (select.room with identity, select.reviews, select.end). ---- */
  var STATES = {
    'room': { data: 'base' }, 'room-empty': { data: 'quiet', room: 8 }, 'room-all-done': { data: 'all-done' },
    'room-overdue': { data: 'behind' }, 'room-drift': { data: 'drift' },
    'room-filter': { data: 'base', sheet: 'filter', filter: ['iron'] },
    'room-filtered': { data: 'base', filter: ['iron'] },
    'room-filter-done': { data: 'a02-by-other', filter: ['iron'], lens: 'done' },
    'room-bulk-ticked': { data: 'base', filter: ['iron'], ticks: { dose: 'iron3', sel: ['A02', 'A04', 'A07', 'B01', 'B06', 'B10', 'C05'] } },
    'room-bulk-ended': { data: 'ended-moves', filter: ['iron'] },
    'room-scan': { data: 'base', sheet: 'scan' },
    'room-find': { data: 'base', sheet: 'find', q: '000354' },
    'room-scan-hit': { data: 'base', sheet: 'find', q: '000354', scanned: true },
    'room-find-many': { data: 'base', sheet: 'find', q: '4-2' },
    'room-scan-none': { data: 'base', sheet: 'find', q: '000999' },
    'room-find-sow': { data: 'base', sheet: 'find', q: '000231' },
    'room-find-crate': { data: 'base', sheet: 'find', q: 'F02' },
    'room-find-garbage': { data: 'base', sheet: 'find', q: 'hello' },
    'room-error': { data: 'base', error: true },
    'room-finished': { data: 'late' }, 'room-none': { data: 'base', room: 9 },
    'room-scan-unavailable': { data: 'base', sheet: 'scan', unavailable: true },
    // scenario round 1
    'room-done-late': { data: 'all-done', lens: 'done' },
    'room-deferred': { data: 'a02-short' },
    'room-missed': { data: 'base', missed: true },
    'room-all': { data: 'base', lens: 'all' },
    'room-emptied': { data: 'emptied', lens: 'all' },
    'room-ended': { data: 'ended' },
    'room-ended-other': { data: 'ended-by-other', lens: 'all' },
    'room-reviews': { data: 'held-body', sheet: 'reviews' },
    'room-review-count': { data: 'count-offline' },
    'room-ended-reviews': { data: 'ended', sheet: 'reviews' },
    'room-units': { data: 'base', sheet: 'units' }
  };
  var start = STATES[PP.state] || STATES.room;
  var qs = PP.q;
  var S = {
    lens: qs.get('lens') || start.lens || '',
    filter: qs.has('filter') ? qs.get('filter').split(',').filter(Boolean) : (start.filter || []).slice(),
    missed: qs.has('missed') ? qs.get('missed') === '1' : !!start.missed,
    sheet: start.sheet || '', q: qs.get('q') || start.q || '', opened: 0, flash: '', error: !!start.error, unavailable: !!start.unavailable, scanned: !!start.scanned, cameFrom: ''
  };
  var ROOM = +(qs.get('unit') || start.room || 7);
  var store, CFG;
  var held = {}, holdTimer = 0;

  /* ---- the ledger, read once per derived log ---- */
  var memo = { d: null };
  function R() {
    if (memo.d !== store.derived) {
      memo.d = store.derived;
      // identity is owed on its day (R1-17): the ledger counts it in the lens, kind and lateness
      memo.room = store.select.room(store.derived, { room: ROOM, lens: 'all', identity: true });
      memo.rev = store.select.reviews(store.derived, { room: ROOM });
      memo.end = endOf(memo.room);
    }
    return memo;
  }
  function facts() { return R().room.rows; }
  // The task this room's litters are in, and its End (frozen figures) when it has ended (R1-13).
  function endOf(room) {
    var tasks = store.derived.tasks || [], ids = {};
    room.rows.forEach(function (f) { var L = store.derived.litters[f.litter]; if (L && L.task) ids[L.task] = 1; });
    var T = tasks.filter(function (t) { return ids[t.id] && t.ended; })[0];
    if (!T) return null;
    var e = store.select.end(store.derived, { task: T.id });
    return e.ended && e.atEnd ? { at: e.ended.at, who: e.ended.who, atEnd: e.atEnd } : null;
  }
  function ended() { return R().end; }
  function now() { return store.now(); }            // the phone's clock: advances with every record in the log (R1-15)

  function doseCfg(id) { return CFG.doses.filter(function (d) { return d.id === id; })[0]; }
  function txOf(id) { return id === 'identity' ? 'identity' : (doseCfg(id) || { tx: id }).tx; }
  function scheme() { var s = CFG.identity || {}; return s.who === 'candidates' ? 'candidates' : s.scheme === 'notch' ? 'notch' : 'tag'; }
  function txId(tx) { return tx === 'identity' ? 'pp.room.id.' + scheme() : 'pp.common.tx.' + tx; }
  function name(tx) { return PP.t(txId(tx)); }
  function doseList(ds) {
    var count = {}; ds.forEach(function (o) { count[o.tx] = (count[o.tx] || 0) + 1; });
    return ds.map(function (o) { return count[o.tx] > 1 ? PP.t('pp.room.dose.withday', { name: name(o.tx), n: o.due }) : name(o.tx); }).join(' · ');
  }
  function names(ids) { return ids.map(function (id) { return name(txOf(id)); }).join(' · '); }
  function T(id, args, tone) { return U.tok(id, args, null, tone); }
  function pig(n) { return T(PP.one('pp.common.unit.piglet', n), { n: n }); }
  function male(n) { return T(PP.one('pp.room.tok.males', n), { n: n }); }
  var castr = function (o) { return !!(doseCfg(o.dose) || {}).castration; };
  function dose(f, id) { var L = store.derived.litters[f.litter]; return L && L.doses[id] || {}; }

  /* ---- what a litter owes, did today, has next and missed — by treatment word (iron d3 and d14 are one word) ---- */
  function idLive(f) { return !!f.lens && (f.identity.status === 'due' || f.identity.status === 'late'); }
  // The owed items: the ledger's doses, each with its deferral (weak, sick: stays due, never late — R1-16), plus the
  // identity step on its day (R1-17).
  function owedItems(f) {
    var xs = f.doses.map(function (x) {
      var D = dose(f, x.dose), def = D.deferred || 0;
      return Object.assign({}, x, { deferred: def, reason: D.deferReason, deferredAll: def > 0 && x.n != null && def >= x.n });
    });
    if (idLive(f)) xs.push({ tx: 'identity', dose: 'identity', n: f.identity.owed, of: f.alive, lateBy: f.identity.lateBy, deferred: 0 });
    return xs;
  }
  function lateOf(f) { return Math.max.apply(null, [0].concat(owedItems(f).filter(function (x) { return !x.deferredAll; }).map(function (x) { return x.lateBy || 0; }))); }
  function owedTx(f) { return owedItems(f).map(function (x) { return x.tx; }); }
  function doneTx(f) { return f.doneToday.map(txOf); }
  function laterTx(f) { return (f.next ? f.next.doses.map(txOf) : []).concat(f.identity.status === 'later' ? ['identity'] : []); }
  function missedTx(f) { return f.missed.map(function (o) { return o.tx; }); }

  /* ---- lenses. Owed · Done · Later · All; missed is its own group (Q15: not overdue, never Later, never owed); an emptied
     litter owes nothing (R1-19). Under a filter a litter sits in the lens of the filtered treatments. After End: Not done ·
     Finished · All, from End's frozen figures. ---- */
  function lensKeys() { return ended() ? ['notdone', 'finished', 'all'] : ['owed', 'done', 'later', 'all']; }
  function naturalLens(f) {
    if (!f.lens) return null;                          // not in the task
    if (ended()) { var E = ended().atEnd; return E.unfinishedLitters.indexOf(f.litter) >= 0 ? 'notdone' : E.finishedLitters.indexOf(f.litter) >= 0 ? 'finished' : null; }
    if (f.closed) return 'closed';
    if (f.kind === 'missed') return 'missed';
    return f.lens;
  }
  function filterLens(f, filter) {
    if (!f.lens || f.closed || ended()) return null;
    var hit = function (l) { return l.some(function (t) { return filter.indexOf(t) >= 0; }); };
    if (hit(owedTx(f))) return 'owed';
    if (hit(doneTx(f))) return 'done';
    if (hit(laterTx(f))) return 'later';
    if (hit(missedTx(f))) return 'missed';
    return null;
  }
  function filtering() { return S.filter.length > 0 && !ended(); }
  function lensOfF(f, filter) { filter = filter || (filtering() ? S.filter : []); return filter.length ? filterLens(f, filter) : naturalLens(f); }
  function inView(f, lens, filter) {
    filter = filter || (filtering() ? S.filter : []);
    if (S.missed && !ended()) return !!f.lens && !f.closed && f.missed.length > 0 && (!filter.length || filterLens(f, filter) != null);
    var l = lensOfF(f, filter);
    if (lens === 'all') return filter.length ? !!l : true;
    return l === lens;
  }
  var byCode = function (a, b) { return a.litter < b.litter ? -1 : a.litter > b.litter ? 1 : 0; };
  function sorter(lens) {
    if (lens === 'owed') {
      var rank = function (f) { return lateOf(f) ? 0 : f.partly ? 2 : 1; };
      return function (a, b) { return rank(a) - rank(b) || (rank(a) === 0 ? lateOf(b) - lateOf(a) : 0) || byCode(a, b); };
    }
    if (lens === 'later') return function (a, b) { return (a.next ? a.next.inDays : 999) - (b.next ? b.next.inDays : 999) || byCode(a, b); };
    return byCode;
  }
  function viewRows(lens, filter) { return facts().filter(function (f) { return inView(f, lens, filter); }).sort(sorter(S.missed ? 'all' : lens)); }
  function lensOf(lens) {
    var xs = viewRows(lens);
    // Hold, then depart: a row a record or a sync moved out of this lens stays put until the hand is idle.
    Object.keys(held).forEach(function (c) { if (held[c].lens === lens && !xs.some(function (x) { return x.litter === c; })) xs.push(held[c].f); });
    return xs;
  }
  // the litters that owe today (under the filter, the filtered treatments): the headline, whatever the view below shows
  function owedCount() {
    var n = facts().filter(function (f) { return lensOfF(f) === 'owed'; }).length;
    return n + Object.keys(held).filter(function (c) { return held[c].lens === 'owed' && !facts().some(function (f) { return f.litter === c && lensOfF(f) === 'owed'; }); }).length;
  }
  function curLens() { var ks = lensKeys(); return ks.indexOf(S.lens) >= 0 ? S.lens : ks[0]; }

  /* ---- review items (N4, R1-22): possible doubles, disputed counts, held bodies, concurrent corrections ---- */
  function reviews() { return R().rev.items; }
  function reviewsOf(code) { return reviews().filter(function (x) { return x.litter === code; }); }

  /* ---- the litter row (row law: line 1 the fact, line 2 mono time -> counts -> codes, open loss/gain appended; one named chip) ---- */
  // one word for all when every owed item owes the same (`12 piglets`); per treatment when some are deferred
  function whole(xs, all) { return xs.length === (all || xs).length; }
  function counts(lv, all) {
    var xs = lv.filter(function (o) { return o.n != null && o.n > 0; });
    var unk = lv.filter(function (o) { return o.unknown > 0; }).map(function (o) { return T('pp.room.tok.unknown', { name: name(o.tx), n: o.unknown }, 'amber'); });
    // castration before its first record: the ledger says males are uncounted
    unk = lv.filter(function (o) { return o.males === 'uncounted'; }).map(function () { return T('pp.common.males_uncounted'); }).concat(unk);
    if (!xs.length) return unk;
    var same = xs.every(function (o) { return o.n === xs[0].n && castr(o) === castr(xs[0]); });
    if (same && whole(xs, all || lv)) return [castr(xs[0]) ? male(xs[0].n) : pig(xs[0].n)].concat(unk);
    return xs.map(function (o) { return castr(o) ? T('pp.room.tok.dosemales', { name: name(o.tx), n: o.n }) : T('pp.room.tok.dosecount', { name: name(o.tx), n: o.n }); }).concat(unk);
  }
  function remainders(lv, all) {
    var xs = lv.filter(function (o) { return o.n != null && o.of != null; });
    if (!xs.length) return [];
    var same = xs.every(function (o) { return o.n === xs[0].n && o.of === xs[0].of && castr(o) === castr(xs[0]); });
    function still(o) { return castr(o) ? T('pp.room.tok.still.males', { n: o.n, total: o.of }) : T('pp.room.tok.still.piglets', { n: o.n, total: o.of }); }
    if (same && whole(xs, all || lv)) return [still(xs[0])];
    // `Nasal drops · 9 still owed`, never `9 of 9 piglets` (reads done, R1-16)
    return xs.map(function (o) { return castr(o) ? T('pp.room.tok.stilldose.males', { name: name(o.tx), n: o.n, total: o.of }) : T('pp.room.tok.stilldose.piglets', { name: name(o.tx), n: o.n, total: o.of }); });
  }
  // Deferred piglets (weak, sick) stay due and show next visit: their own words, never the red of late (R1-16).
  function deferToks(xs, alone) {
    return xs.filter(function (x) { return x.deferred > 0; }).map(function (x) {
      var why = PP.t('pp.litter.why.' + (x.reason || 'deferred'));
      return alone ? T('pp.room.tok.deferred', { n: x.deferred, reason: why }) : T('pp.room.tok.deferdose', { name: name(x.tx), n: x.deferred, reason: why });
    });
  }
  function lapseToks(lp) {
    if (!lp.length) return [];
    var out = [T('pp.room.tok.missed', { dose: lp.map(function (o) { return name(o.tx); }).join(' · ') }, 'amber')], seen = {};
    lp.forEach(function (o) { if (!seen[o.last]) { seen[o.last] = 1; out.push(T('pp.room.tok.window', { n: o.last }, 'amber')); } });
    return out;
  }
  function windowToks(lp) { var seen = {}; return lp.filter(function (o) { if (seen[o.last]) return false; seen[o.last] = 1; return true; }).map(function (o) { return T('pp.room.tok.window', { n: o.last }, 'amber'); }); }
  function dueTok(late) { return late === 0 ? T('pp.room.tok.due_today') : late === 1 ? T('pp.room.tok.due_yest', {}, 'red') : T('pp.room.tok.due_ago', { n: late }, 'red'); }
  // A litter done late keeps its late marker once done (R1-16): the latest a dose recorded today became full, past its day.
  function doneLate(f, only) {
    var late = 0;
    f.doneToday.forEach(function (id) {
      if (only && only.indexOf(txOf(id)) < 0) return;
      var D = dose(f, id);
      if (D.fullAt != null && D.due != null && D.fullAt > D.due) late = Math.max(late, D.fullAt - D.due);
    });
    return late ? [T(PP.one('pp.room.tok.done_late', late), { n: late }, 'amber')] : [];
  }
  function recToks(f, only) {
    return [T('pp.room.tok.recorded', { when: U.ago(f.lastRecord.at, now()) })].concat(doneLate(f, only), [pig(f.alive), T('pp.room.who', { who: f.lastRecord.who })]);
  }
  function dayToks(f) { return [T('pp.common.unit.day', { n: f.day }), pig(f.alive)]; }
  function nextL1(nx) { return nx.inDays === 1 ? T('pp.room.l1.tomorrow', { doses: names(nx.doses) }) : T('pp.room.l1.next', { doses: names(nx.doses), n: nx.inDays }); }
  function owesSpec(f, s) {
    var items = owedItems(f), live = items.filter(function (x) { return !x.deferredAll; }), def = items.filter(function (x) { return x.deferredAll; });
    var late = lateOf(f), alone = items.length === 1;
    s.l1 = T('pp.room.l1.owes', { doses: doseList(items) });
    if (f.partly && f.lastRecord) s.tok = [T('pp.room.tok.recorded', { when: U.ago(f.lastRecord.at, now()) })].concat(live.length ? [dueTok(late)] : [], remainders(live, items), deferToks(items, alone), [T('pp.room.who', { who: f.lastRecord.who })]);
    else s.tok = (live.length ? [dueTok(late)] : []).concat(counts(live, items), deferToks(items, alone));
    s.tok = s.tok.concat(lapseToks(f.missed));
  }
  // After End (R1-13): what End froze for the litter — not done, never owed; no new marks.
  function endedSpec(f, s) {
    var E = ended().atEnd, list = E.byLitter[f.litter] || [];
    if (E.unfinishedLitters.indexOf(f.litter) < 0) { s.l1 = T('pp.room.l1.finished'); s.tok = dayToks(f); return; }
    s.l1 = list.length ? list.map(function (x) { return x.n == null ? T('pp.room.end.males', { name: name(txOf(x.dose)) }) : T('pp.room.end.notdone', { name: name(txOf(x.dose)), n: x.n }); })
      : T('pp.room.end.identity', { name: name('identity') });
    if (!Array.isArray(s.l1[0])) s.l1 = [s.l1];
    var kinds = {}; list.forEach(function (x) { kinds[x.kind] = 1; });
    s.tok = dayToks(f).concat(kinds.owed ? [T('pp.room.end.owed', {}, 'amber')] : [], kinds.not_due ? [T('pp.room.end.not_due')] : [],
      kinds.missed ? windowToks(list.filter(function (x) { return x.kind === 'missed'; }).map(function (x) { return { last: (doseCfg(x.dose) || {}).last }; })) : []);
  }
  function spec(f, mode) {
    var s = { l1: null, tok: [] };
    if (!f.lens) { s.l1 = T('pp.room.l1.none'); s.tok = dayToks(f); }
    else if (ended()) endedSpec(f, s);
    else if (mode === 'next' && f.next) { s.l1 = nextL1(f.next); s.tok = dayToks(f); return s; }
    else if (mode === 'donetx') { s.l1 = T('pp.room.l1.done_tx', { doses: S.filter.filter(function (t) { return doneTx(f).indexOf(t) >= 0; }).map(name).join(' · ') }); s.tok = recToks(f, S.filter); }
    else if (mode === 'missed') { s.l1 = T('pp.room.l1.missed', { doses: f.missed.map(function (o) { return name(o.tx); }).join(' · ') }); s.tok = dayToks(f).concat(windowToks(f.missed)); }
    else if (f.closed) { s.l1 = T('pp.room.l1.closed'); s.tok = [T('pp.common.unit.day', { n: f.day }), T('pp.room.tok.closed')]; }
    else if (f.kind === 'owes') owesSpec(f, s);
    else if (f.kind === 'done') { s.l1 = T('pp.room.l1.done'); s.tok = recToks(f); }
    else if (f.kind === 'missed') { s.l1 = T('pp.room.l1.missed', { doses: f.missed.map(function (o) { return name(o.tx); }).join(' · ') }); s.tok = dayToks(f).concat(windowToks(f.missed)); }
    else if (f.kind === 'next') { s.l1 = nextL1(f.next); s.tok = f.lastRecord ? recToks(f) : dayToks(f); }
    else {
      // Nothing owed, nothing missed, nothing coming: every treatment is done.
      s.l1 = T('pp.room.l1.finished');
      s.tok = f.lastRecord ? recToks(f) : dayToks(f);
    }
    // review markers (R1-22): the row says it waits for an answer; the answer is where the room's review list sends you
    if (f.collide) s.tok.push(T('pp.room.tok.collide', { n: f.collide }, 'amber'));

    var head = UI.heading({ title: '', kind: 'group', level: 4, strs: { title: ids[0] }, args: { title: ids[1] } });
    var here = h.room === ROOM ? facts().filter(function (f) { return f.litter === h.litter; })[0] : null;
    var pigTag = h.kind === 'piglet' ? h.tag || h.notch : null, body;
    if (h.kind === 'piglet' && h.status === 'weaned') body = UI.rowGroup(UI.row({ title: '', strs: { title: 'pp.room.scan.weaned' } }));
    else if (here) body = rows([here], pigTag);
    else body = UI.rowGroup(UI.row({ title: '', action: 'open-litter', value: h.litter, attrs: { 'data-unit': h.room, 'data-piglet': pigTag || '' }, strs: { title: 'pp.room.scan.in_unit' }, args: { title: { n: h.room, code: h.litter } } }));
    return '<div>' + head + body + '</div>';
  }
  function findResults() {
    var r = lookup(S.q); if (!r) return '';
    if (!r.hits.length) return UI.choiceEmpty('', { strs: { text: 'pp.room.scan.none' }, args: { text: { q: r.q } } }) + UI.choiceEmpty('', { strs: { text: 'pp.room.scan.hint' } });
    return '<div class="pp-results">' + r.hits.map(hitBlock).join('') + '</div>';
  }
  function scanSheet() {
    var typeBtn = '<button type="button" class="button ' + (S.unavailable ? 'primary' : 'secondary') + ' pp-wide" data-action="type" data-str="pp.room.scan.type">' + U.esc(PP.t('pp.room.scan.type')) + '</button>';
    var body = S.unavailable
      ? UI.panel(UI.choiceEmpty('', { strs: { text: 'pp.room.scan.unavailable' } })) + '<div class="pp-block">' + typeBtn + '</div>'
      : '<div class="pp-scan-frame" data-ds="Candidate:ScanFrame">' + I('scan') + '</div>' + UI.heading({ title: '', kind: 'section', level: 4, strs: { title: 'pp.room.scan.hold' } }) + typeBtn;
    return sheetFrame('act.scan', body, closeFooter());
  }
  function findSheet() {
    var body = '<div class="pp-findbar">' +
      UI.choiceSearch({ label: 'Find', placeholder: 'Find', value: S.q, attrs: { 'data-role': 'q', inputmode: 'text', 'data-str-attr': 'aria-label:pp.room.scan.placeholder;placeholder:pp.room.scan.placeholder' } }) +
      '</div>' + (S.scanned ? '' : UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.room.find.hint' } })) +
      '<div id="scan-results">' + findResults() + '</div>';
    return sheetFrame('pp.room.scan.title', body, closeFooter());
  }
  function errorView() {
    return UI.panel(UI.choiceEmpty('', { strs: { text: 'pp.room.err.title' } }) + UI.choiceEmpty('', { strs: { text: 'pp.room.err.why' } }) +
      '<button type="button" class="button secondary" data-action="retry" data-str="pp.room.err.retry">' + U.esc(PP.t('pp.room.err.retry')) + '</button>');
  }

  /* ---- render ---- */
  var screen = document.getElementById('screen'), phone = document.getElementById('phone');
  function render() {
    if (S.error) { screen.innerHTML = header() + errorView(); phone.classList.remove('pp-locked'); tag(); return; }
    screen.innerHTML = header() + lead() + doors() + controls() + list() + dock() +
      (S.sheet === 'filter' ? filterSheet() : S.sheet === 'scan' ? scanSheet() : S.sheet === 'find' ? findSheet() : S.sheet === 'reviews' ? reviewsSheet() : S.sheet === 'units' ? unitsSheet() : '');
    phone.classList.toggle('pp-locked', !!S.sheet);
    tag();
    if (S.sheet === 'find') { var i = screen.querySelector('[data-role=q]'); if (i && !S.scanned && !i.dataset.focused) { i.dataset.focused = '1'; try { i.focus(); } catch (e) {} } }
  }
  function tag() {
    function aria(s, id) { var e = screen.querySelector(s); if (e) e.setAttribute('data-str-attr', 'aria-label:' + id); }
    aria('.task-return', 'pp.room.aria.back'); aria('[data-action="filter"]', 'pp.room.aria.filter'); aria('.pp-dock [data-action="find"]', 'pp.room.aria.find'); aria('.segment', 'pp.room.lens.aria');
    PP.apply(screen);
  }

  /* ---- URL, history, scroll ---- */
  function url() {
    var p = new URLSearchParams(location.search);
    ['lens', 'filter', 'missed'].forEach(function (k) { p.delete(k); });
    if (S.lens && S.lens !== (start.lens || lensKeys()[0])) p.set('lens', S.lens);
    if (S.filter.length) p.set('filter', S.filter.join(','));
    if (S.missed) p.set('missed', '1');
    // A state that carries a filter or the missed view names the plain room once the worker changes them: clearing a
    // filter clears it from the URL too (R1-16).
    var changed = S.filter.join(',') !== (start.filter || []).join(',') || S.missed !== !!start.missed;
    if (changed && ((start.filter || []).length || start.missed)) {
      p.set('state', 'room');
      if (start.data !== 'base' && !p.get('data')) p.set('data', start.data);
      if (start.room && !p.get('unit')) p.set('unit', start.room);
    }
    var s = p.toString(); return location.pathname + (s ? '?' + s : '');
  }
  function persist() { try { history.replaceState(history.state, '', url()); } catch (e) {} }
  function openSheet(n) {
    S.sheet = n; S.opened = Date.now();
    try { history.pushState({ sheet: n }, '', location.href); } catch (e) {}
  }
  function closeSheet() {
    S.q = ''; var st = history.state;
    if (st && st.sheet && !st.deep) { history.back(); return; }
    S.sheet = ''; render(); persist(); refocus();
  }
  function refocus() { var b = screen.querySelector('[data-action="scan"]'); if (b) b.focus(); }
  window.addEventListener('popstate', function (ev) {
    var sh = (ev.state && ev.state.sheet) || '';
    if (!sh) S.q = '';
    S.sheet = sh; persist(); render(); if (!sh) refocus();
  });
  if (S.sheet) { try { history.replaceState({ sheet: S.sheet, deep: true }, '', location.href); } catch (e) {} }
  function scrollKey() { return 'pp-room-scroll:' + PP.state + ':' + S.lens; }
  function saveScroll() { try { sessionStorage.setItem(scrollKey(), String(window.scrollY)); } catch (e) {} }
  function restoreScroll() { try { var y = +sessionStorage.getItem(scrollKey()); if (y && !S.sheet) window.scrollTo(0, y); } catch (e) {} }
  function go(href) { saveScroll(); location.href = href; }

  screen.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]'); if (!b) return;
    // ChoiceList's multi row carries its value on the checkbox (`value`), not `data-value`.
    var a = b.dataset.action, v = b.dataset.value != null ? b.dataset.value : b.value;
    if (a === 'scrim') { if (Date.now() - S.opened < 300) return; closeSheet(); return; }
    // Back goes up to the task (its overview; after End, the ended task), never to the designer index (R1-5)
    if (a === 'back') { go(PP.href('end.html', { state: ended() ? 'ended' : 'overview', unit: ROOM !== 7 ? ROOM : '', data: dataParam() })); return; }
    if (a === 'open-litter') { go(litterHref(v, b.dataset.piglet, b.dataset.unit)); return; }
    if (a === 'explain') { go(PP.href('count.html', { state: 'explain', unit: ROOM, data: store.name })); return; }
    if (a === 'overview') { go(PP.href('end.html', { state: ended() ? 'ended' : 'overview', unit: ROOM !== 7 ? ROOM : '', data: dataParam() })); return; }
    if (a === 'receipt') { go(PP.href('end.html', { state: 'receipt', data: store.name })); return; }
    if (a === 'open-review') { var x = reviews().filter(function (r) { return r.id === v; })[0]; if (x) go(reviewHref(x)); return; }
    if (a === 'open-unit') {
      if (+v === ROOM) { closeSheet(); return; }
      go(PP.href('room.html', { state: 'room', unit: +v !== 7 ? v : '', data: dataParam() })); return;
    }
    if (a === 'retry') { location.reload(); return; }
    if (a === 'open-bulk') { go(PP.href('bulk.html', { state: 'bulk', tx: v, unit: ROOM !== 7 ? ROOM : '', data: dataParam() })); return; }
    if (a === 'lens') { S.lens = v; persist(); }
    else if (a === 'filter') { openSheet('filter'); }
    else if (a === 'scan') { openSheet('scan'); }
    else if (a === 'find') { openSheet('find'); }
    else if (a === 'reviews') { openSheet('reviews'); }
    else if (a === 'units') { openSheet('units'); }
    else if (a === 'type') { S.scanned = false; S.sheet = 'find'; try { history.replaceState({ sheet: 'find', deep: !!(history.state && history.state.deep) }, '', location.href); } catch (e) {} }
    else if (a === 'close-sheet') { closeSheet(); return; }
    else if (a === 'toggle-dose') { var i = S.filter.indexOf(v); if (i >= 0) S.filter.splice(i, 1); else S.filter.push(v); persist(); }
    else if (a === 'clear-filter') { S.filter = []; if (S.missed) { S.missed = false; if (S.cameFrom) S.lens = S.cameFrom; } persist(); }
    else if (a === 'show-missed') { S.cameFrom = S.lens; S.missed = true; persist(); }
    render();
  });
  screen.addEventListener('input', function (ev) {
    if (ev.target.dataset.role !== 'q') return;
    S.q = ev.target.value;
    var r = document.getElementById('scan-results'); r.innerHTML = findResults(); PP.apply(r);
  });
  screen.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || ev.target.dataset.role !== 'q') return;
    ev.preventDefault();
    var r = lookup(S.q), h = r && r.hits.length === 1 ? r.hits[0] : null;
    if (h && (h.kind === 'litter' || h.status === 'alive')) go(litterHref(h.litter, h.kind === 'piglet' ? h.tag || h.notch : '', h.room));
    else ev.target.blur();
  });

  /* ---- sync: a row that another hand's record changes departs by the same law as this hand's: hold 800ms of idle, any touch resets ---- */
  function armHold() {
    clearTimeout(holdTimer);
    if (Object.keys(held).length) holdTimer = setTimeout(function () { held = {}; S.flash = ''; render(); }, 800);
  }
  ['pointerdown', 'touchstart', 'scroll'].forEach(function (e) { window.addEventListener(e, armHold, { passive: true, capture: true }); });
  function snapshot() { var m = {}, l = curLens(); viewRows(l).forEach(function (f) { m[f.litter] = f; }); return { lens: l, m: m }; }
  function holdDeparted(before) {
    var now2 = snapshot().m;
    Object.keys(before.m).forEach(function (c) { if (!now2[c]) held[c] = { lens: before.lens, f: before.m[c] }; });
  }
  // Another hand's record arrives (PP.sync({ type: 'treat', litter: 'A02', dose: 'iron3', n: 12, who: 'L.M' })): it goes through the ledger.
  PP.sync = function (event) {
    var before = snapshot(), r = store.commit(Object.assign({ who: 'L.M' }, event));
    if (!r.ok) return r;
    holdDeparted(before); S.flash = event.litter || event.from || ''; render(); armHold();
    return r;
  };
  // Resume (phone unlocked, or back from a litter): re-read the log, and let rows that changed lens depart by the same law.
  PP.resume = function () {
    var before = snapshot();
    store = PP.open(start.data);
    holdDeparted(before); render(); armHold();
  };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !S.error && store) PP.resume(); });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted && store) PP.resume(); });

  // A successful scan resolves into the Find result for that tag.
  PP.scanned = function (t) { S.q = t; S.scanned = true; S.sheet = 'find'; try { history.replaceState({ sheet: 'find', deep: !!(history.state && history.state.deep) }, '', location.href); } catch (e) {} render(); };

  var boot = PP.ready.then(function () {
    store = PP.open(start.data);
    CFG = store.config;
    // room-bulk-ticked: ticks a bulk page left on this phone (slice #7's device draft).
    if (start.ticks) { try { sessionStorage.setItem('pp-bulk-ticks:' + store.name + ':' + ROOM + ':' + start.ticks.dose, JSON.stringify(start.ticks.sel)); } catch (e) {} }
    render(); restoreScroll();
  });
  // The one registry exception: when the registry itself failed to load there is nothing to look strings up in.
  boot.catch(function (e) {
    if (window.console) console.error(e);
    screen.innerHTML = '<p>Couldn’t load the unit.</p><button type="button" onclick="location.reload()">Retry</button>';
  });
})();
</script>
</body>
</html>
