<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piglet processing · Room</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Room list: layout only, from tokens.css. Candidate:LitterRow, Candidate:LeadFigure and Candidate:DriftStrip are described in the report. */
#screen { display: flex; flex-direction: column; gap: var(--space-section); }
.pp-head { display: flex; align-items: flex-start; gap: var(--space-footer-gap); }
.pp-head > .pp-title { flex: 1; min-width: 0; }
.pp-head .st-heading { margin: 0; }
.pp-head .pp-title > .st-heading + .st-heading { margin-top: 4px; }
.pp-controls { display: flex; align-items: center; gap: var(--space-footer-gap); }
.pp-controls .segment { flex: 1; min-width: 0; }
.pp-block > .st-heading { margin-bottom: 8px; }
.pp-filtered { margin-top: 20px; }
.pp-list { display: flex; flex-direction: column; gap: var(--space-footer-gap); }
.pp-dock { position: sticky; bottom: 0; margin: 0 calc(-1 * var(--space-gutter)) -20px; }
@media (max-width: 370px) { .pp-dock { margin-left: calc(-1 * var(--space-gutter-narrow)); margin-right: calc(-1 * var(--space-gutter-narrow)); padding-left: var(--space-gutter-narrow); padding-right: var(--space-gutter-narrow); } }
.pp-dock .button { gap: 8px; }
.pp-dock .button svg { width: 18px; height: 18px; }
.pp-locked { position: relative; height: 100vh; overflow: hidden; }
.pp-layer .scrim { inset: 0; }
.pp-layer .sheet { max-height: 85%; }
.pp-layer .sheet-body { padding-bottom: var(--space-panel); }
.pp-layer .utility-header { display: flex; align-items: center; gap: var(--space-footer-gap); padding: var(--space-gutter) var(--space-gutter) 8px; }
.pp-layer .utility-header .st-heading { margin: 0; flex: 1; }
.pp-layer .sheet-footer { justify-content: flex-end; }
.pp-scan-frame { display: grid; place-items: center; min-height: 200px; margin-bottom: var(--space-footer-gap); border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--inset); color: var(--ink); }
.pp-scan-frame svg { width: 64px; height: 64px; }
.pp-findbar { display: flex; align-items: flex-start; gap: var(--space-footer-gap); }
.pp-findbar .field { flex: 1; min-width: 0; margin: 0; }
.pp-findbar + #scan-results { margin-top: var(--space-footer-gap); }
.pp-results > * + * { margin-top: var(--space-footer-gap); }

/* Candidate:LeadFigure: the number of litters that owe today, in the figure style of farrowing's task header. */
.pp-lead { display: flex; align-items: baseline; gap: var(--space-footer-gap); }
.pp-lead .pp-fig { font-family: var(--font-mono); font-size: var(--type-figure-lg-size); font-weight: 500; color: var(--ink); }
.pp-lead .pp-leadlab { font-size: var(--type-row-title-size); color: var(--muted); }

/* Candidate:DriftStrip: open unexplained gain and loss on one compact read-only strip; each crate code is grouped with its figure. */
.pp-strip { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--space-panel); row-gap: 4px; padding: var(--space-row-y) var(--space-footer-gap); border-radius: var(--radius-inset); background: var(--well); font-size: var(--type-panel-title-size); color: var(--ink); }
.pp-strip .pp-grp { display: inline-flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
.pp-strip .pp-codes { font-family: var(--font-mono); font-size: var(--type-identifier-size); color: var(--muted); }
/* The strip is the door to the room's open lines (count.html?state=explain): a bare button, 44px, focus ring. */
button.pp-strip { width: 100%; min-height: var(--touch-min); margin: 0; border: 0; font-family: inherit; text-align: left; cursor: pointer; }
button.pp-strip:active { background: var(--choice-press); }
button.pp-strip > svg { align-self: center; margin-left: auto; width: var(--glyph-key); height: var(--glyph-key); flex: none; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
button.pp-strip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.pp-wide { width: 100%; }
.pp-last { margin-top: 4px; }

/* Candidate:LitterRow lives in shell.css (shared with End). */
</style>
</head>
<body>
<main class="phone inspection-phone" data-st-context="page" id="phone">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, I = window.SentriIcons.icon, U = window.PPUI;

  /* ---- states: a fixture variant (the shared log, fixtures.js) + UI state. Every figure comes from the ledger's select.room. ---- */
  var STATES = {
    'room': { data: 'base' }, 'room-empty': { data: 'quiet', room: 8 }, 'room-all-done': { data: 'all-done' },
    'room-overdue': { data: 'behind' }, 'room-drift': { data: 'drift' },
    'room-filter': { data: 'base', sheet: 'filter', filter: ['iron'] },
    'room-scan': { data: 'base', sheet: 'scan' },
    'room-find': { data: 'base', sheet: 'find', q: '000354' },
    'room-scan-hit': { data: 'base', sheet: 'find', q: '000354', scanned: true },
    'room-find-many': { data: 'base', sheet: 'find', q: '4-2' },
    'room-scan-none': { data: 'base', sheet: 'find', q: '000999' },
    'room-error': { data: 'base', error: true },
    'room-finished': { data: 'late' }, 'room-none': { data: 'base', room: 9 },
    'room-scan-unavailable': { data: 'base', sheet: 'scan', unavailable: true }
  };
  var start = STATES[PP.state] || STATES.room;
  var qs = PP.q;
  var S = {
    lens: qs.get('lens') || start.lens || 'owed',
    filter: qs.get('filter') ? qs.get('filter').split(',') : (start.filter || []).slice(),
    missed: qs.get('missed') === '1',
    sheet: start.sheet || '', q: qs.get('q') || start.q || '', opened: 0, flash: '', error: !!start.error, unavailable: !!start.unavailable, scanned: !!start.scanned, cameFrom: ''
  };
  var ROOM = +(qs.get('unit') || start.room || 7);
  var store, NOW, CFG;
  var held = {}, holdTimer = 0;

  /* ---- the ledger's room ---- */
  function sel(lens, filter) { return store.select.room(store.derived, { room: ROOM, lens: lens || S.lens, filter: filter || S.filter, missedOnly: S.missed }); }
  function lensOf(lens, filter) {
    var xs = sel(lens, filter).rows.slice();
    // Hold, then depart: a row a record or a sync moved out of this lens stays put until the hand is idle.
    Object.keys(held).forEach(function (c) { if (held[c].lens === lens && !xs.some(function (x) { return x.litter === c; })) xs.push(held[c].f); });
    return xs;
  }
  function doseCfg(id) { return CFG.doses.filter(function (d) { return d.id === id; })[0]; }
  function txOf(id) { return (doseCfg(id) || { tx: id }).tx; }
  function name(tx) { return PP.t('pp.common.tx.' + tx); }
  function doseList(ds) {
    var count = {}; ds.forEach(function (o) { count[o.tx] = (count[o.tx] || 0) + 1; });
    return ds.map(function (o) { return count[o.tx] > 1 ? PP.t('pp.room.dose.withday', { name: name(o.tx), n: o.due }) : name(o.tx); }).join(' · ');
  }
  function names(ids) { return ids.map(function (id) { return name(txOf(id)); }).join(' · '); }
  function T(id, args, tone) { return U.tok(id, args, null, tone); }
  function pig(n) { return T(PP.one('pp.common.unit.piglet', n), { n: n }); }
  function male(n) { return T(PP.one('pp.room.tok.males', n), { n: n }); }
  var castr = function (o) { return !!(doseCfg(o.dose) || {}).castration; };

  /* ---- the litter row (row law: line 1 the fact, line 2 mono time -> counts -> codes, open loss/gain appended; one named chip) ---- */
  function counts(lv) {
    var xs = lv.filter(function (o) { return o.n != null && o.n > 0; });
    var unk = lv.filter(function (o) { return o.unknown > 0; }).map(function (o) { return T('pp.room.tok.unknown', { name: name(o.tx), n: o.unknown }, 'amber'); });
    // castration before its first record: the ledger says males are uncounted
    unk = lv.filter(function (o) { return o.males === 'uncounted'; }).map(function () { return T('pp.common.males_uncounted'); }).concat(unk);
    if (!xs.length) return unk;
    var same = xs.every(function (o) { return o.n === xs[0].n && castr(o) === castr(xs[0]); });
    if (same && xs.length === lv.length) return [castr(xs[0]) ? male(xs[0].n) : pig(xs[0].n)].concat(unk);
    return xs.map(function (o) { return castr(o) ? T('pp.room.tok.dosemales', { name: name(o.tx), n: o.n }) : T('pp.room.tok.dosecount', { name: name(o.tx), n: o.n }); }).concat(unk);
  }
  function remainders(lv) {
    var xs = lv.filter(function (o) { return o.n != null && o.of != null; });
    if (!xs.length) return [];
    var same = xs.every(function (o) { return o.n === xs[0].n && o.of === xs[0].of && castr(o) === castr(xs[0]); });
    function still(o) { return castr(o) ? T('pp.room.tok.still.males', { n: o.n, total: o.of }) : T('pp.room.tok.still.piglets', { n: o.n, total: o.of }); }
    if (same && xs.length === lv.length) return [still(xs[0])];
    return xs.map(function (o) { return castr(o) ? T('pp.room.tok.stilldose.males', { name: name(o.tx), n: o.n, total: o.of }) : T('pp.room.tok.stilldose.piglets', { name: name(o.tx), n: o.n, total: o.of }); });
  }
  function lapseToks(lp) {
    if (!lp.length) return [];
    var out = [T('pp.room.tok.missed', { dose: lp.map(function (o) { return name(o.tx); }).join(' · ') }, 'amber')], seen = {};
    lp.forEach(function (o) { if (!seen[o.last]) { seen[o.last] = 1; out.push(T('pp.room.tok.window', { n: o.last }, 'amber')); } });
    return out;
  }
  function dueTok(late) { return late === 0 ? T('pp.room.tok.due_today') : late === 1 ? T('pp.room.tok.due_yest', {}, 'red') : T('pp.room.tok.due_ago', { n: late }, 'red'); }
  function recToks(f) { return [T('pp.room.tok.recorded', { when: U.ago(f.lastRecord.at, NOW) }), pig(f.alive), T('pp.room.who', { who: f.lastRecord.who })]; }
  function spec(f, forceNext) {
    var s = { l1: null, tok: [] };
    if (forceNext) {
      var nx0 = f.next; s.l1 = nx0.inDays === 1 ? T('pp.room.l1.tomorrow', { doses: names(nx0.doses) }) : T('pp.room.l1.next', { doses: names(nx0.doses), n: nx0.inDays });
      s.tok = [T('pp.common.unit.day', { n: f.day }), pig(f.alive)];
      return s;
    }
    if (f.kind === 'none') { s.l1 = T('pp.room.l1.none'); s.tok = [T('pp.common.unit.day', { n: f.day }), pig(f.alive)]; }
    else if (f.kind === 'owes') {
      s.l1 = T('pp.room.l1.owes', { doses: doseList(f.doses) });
      if (f.partly) s.tok = [T('pp.room.tok.recorded', { when: U.ago(f.lastRecord.at, NOW) })].concat(f.lateBy ? [dueTok(f.lateBy)] : [], remainders(f.doses), [T('pp.room.who', { who: f.lastRecord.who })]);
      else s.tok = [dueTok(f.lateBy)].concat(counts(f.doses));
      s.tok = s.tok.concat(lapseToks(f.missed));
    } else if (f.kind === 'done') {
      s.l1 = T('pp.room.l1.done'); s.tok = recToks(f);
    } else if (f.kind === 'missed') {
      s.l1 = T('pp.room.l1.owes', { doses: f.missed.map(function (o) { return name(o.tx); }).join(' · ') });
      s.tok = [T('pp.common.unit.day', { n: f.day }), pig(f.missed[0].n)].concat(lapseToks(f.missed));
    } else if (f.kind === 'next') {
      var nx = f.next; s.l1 = nx.inDays === 1 ? T('pp.room.l1.tomorrow', { doses: names(nx.doses) }) : T('pp.room.l1.next', { doses: names(nx.doses), n: nx.inDays });
      s.tok = f.lastRecord ? recToks(f) : [T('pp.common.unit.day', { n: f.day }), pig(f.alive)];
    } else {
      // Nothing owed, nothing missed, nothing coming: every treatment is done.
      s.l1 = T('pp.room.l1.finished');
      s.tok = f.lastRecord ? recToks(f) : [T('pp.common.unit.day', { n: f.day }), pig(f.alive)];
    }
    if (f.collide) s.tok.push(T('pp.room.tok.collide', { n: f.collide }, 'amber'));
    if (f.loss) s.tok.push(T('pp.room.tok.loss', { k: f.loss }, 'red'));
    if (f.gain) s.tok.push(T('pp.room.tok.gain', { k: f.gain }, 'blue'));
    return s;
  }
  function chip(f) { return f.chip === 'sowdied' ? ['red', 'sowdied'] : f.chip === 'unlocked' ? ['amber', 'unlocked'] : null; }
  function litterHref(code, piglet, unit) {
    return PP.href('litter.html', { state: 'litter', crate: code, unit: unit || ROOM, piglet: piglet, data: store.name !== 'base' ? store.name : '' });
  }
  function litterRow(f, piglet, forceNext) {
    var s = spec(f, forceNext);
    return U.litterRow({ code: f.litter, l1: [s.l1], toks: s.tok, chip: forceNext ? null : chip(f), flash: S.flash === f.litter,
      attrs: piglet ? ' data-piglet="' + U.esc(piglet) + '"' : '' });
  }
  function rows(xs, piglet, forceNext) { return UI.rowGroup(xs.map(function (f) { return litterRow(f, piglet, forceNext); }).join('')); }

  /* ---- header ---- */
  function signed(n) { return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }
  function driftStrip() {
    var h = sel().strip; if (!h.openLoss && !h.openGain) return '';
    function grp(id, n, codes) { return '<span class="pp-grp">' + U.span(id, { n: n }) + '<span class="pp-codes">' + U.span('pp.room.codes', { list: codes.join(' ') }) + '</span></span>'; }
    var parts = '';
    if (h.openLoss) parts += grp('pp.room.loss_open', h.openLoss, h.lossLitters);
    if (h.openGain) parts += grp('pp.room.gain_open', h.openGain, h.gainLitters);
    if (h.showNet) parts += '<span class="pp-grp">' + U.span(Math.abs(h.netDrift) === 1 && PP.lang === 'en' ? 'pp.room.drift.one' : 'pp.room.drift', { n: signed(h.netDrift) }) + '</span>';
    return '<button type="button" class="pp-strip" data-ds="Candidate:DriftStrip" data-action="explain">' + parts + I('chevron') + '</button>';
  }
  // The newest stamped event of any kind: treatment, count, move, death, identity or correction — in its own words.
  function evWhat(ev) {
    var e = store.events.filter(function (x) { return x.id === ev.id; })[0] || {};
    if (ev.type === 'treat') return name(txOf(e.dose));
    if (ev.type === 'count') return PP.t('pp.room.ev.count', { n: e.observed });
    if (ev.type === 'move') return PP.t('pp.room.ev.move', { n: e.n });
    if (ev.type === 'death') return PP.t('pp.room.ev.dead', { n: (e.lines || []).reduce(function (t, l) { return t + (l.rowId ? 1 : l.n); }, 0) });
    if (ev.type === 'identity') return PP.t('pp.room.ev.id');
    if (ev.type === 'farrowed') return PP.t('pp.room.ev.farrowed');
    if (ev.type === 'sow_died') return PP.t('pp.room.ev.sow');
    if (ev.type === 'weaned') return PP.t('pp.room.ev.weaned', { n: e.n });
    return PP.t('pp.room.ev.edit');
  }
  function lastRecord() {
    var best = sel().lastRecord;
    if (!best) return '';
    return UI.heading({ title: '', kind: 'group', level: 4, className: 'pp-last', strs: { title: 'pp.room.last' }, args: { title: { when: U.ago(best.at, NOW), what: evWhat(best), code: best.litter, who: best.who } } });
  }
  function lead() {
    var n = sel('owed').lead + Object.keys(held).filter(function (c) { return held[c].lens === 'owed'; }).length;
    return '<div><div class="pp-lead" data-ds="Candidate:LeadFigure"><span class="pp-fig">' + U.span('pp.room.lead.figure', { n: n }) + '</span><span class="pp-leadlab">' + U.span('pp.room.lead.' + (n === 1 && PP.lang === 'en' ? 'one' : 'many')) + '</span></div>' + lastRecord() + '</div>';
  }
  function header() {
    return '<header class="task-header pp-head">' +
      UI.iconButton({ action: 'back', icon: I('back'), label: 'Back', className: 'task-return' }) +
      '<div class="pp-title">' +
      UI.heading({ title: '', kind: 'group', level: 3, strs: { title: 'pp.common.task' }, action: '<button type="button" data-action="overview" data-str="pp.room.overview">' + U.esc(PP.t('pp.room.overview')) + '</button>' }) +
      UI.heading({ title: '', kind: 'page', level: 2, description: '', strs: { title: 'pp.room.unit', description: 'pp.room.howto' }, args: { title: { n: ROOM } } }) +
      '</div></header>';
  }
  function filterWhat() {
    var w = []; if (S.missed) w.push(PP.t('pp.room.filter.missed')); if (S.filter.length) w.push(S.filter.map(name).join(' · '));
    return w.join(' · ');
  }
  function controls() {
    var counts = {}; ['owed', 'done', 'later', 'all'].forEach(function (k) { counts[k] = lensOf(k).length; });
    var opts = ['owed', 'done', 'later', 'all'].map(function (k) {
      return [k, PP.t('pp.room.lens.' + k, { n: counts[k] }), { strs: { label: 'pp.room.lens.' + k }, args: { label: { n: counts[k] } } }];
    });
    var seg = UI.segment({ options: opts, active: S.lens, action: 'lens', ariaLabel: '' });
    var f = (roomTx().length || S.filter.length) ? UI.iconButton({ action: 'filter', icon: I('filter'), label: 'Filter litters', className: 'room-filter-button' }) : '';
    var sum = (S.filter.length || S.missed) ? '<div class="pp-filtered">' + UI.heading({ title: '', kind: 'group', level: 4, action: '<button type="button" data-action="clear-filter" data-str="act.clear">' + U.esc(PP.t('act.clear')) + '</button>', strs: { title: 'pp.room.filtered' }, args: { title: { what: filterWhat() } } }) + '</div>' : '';
    return '<div class="pp-controlwrap"><div class="pp-controls">' + seg + f + '</div>' + sum + '</div>';
  }
  // The treatments this lens's litters owe, did today or have next — one filter row per treatment (iron day 3 and day 14 are one word).
  function roomTx() {
    var ids = store.select.room(store.derived, { room: ROOM, lens: S.lens }).doses, seen = {};
    return ids.map(txOf).filter(function (tx) { if (seen[tx]) return false; seen[tx] = 1; return true; });
  }
  function comingUp() {
    var xs = sel('owed').comingUp;
    if (!xs.length) return '';
    var min = Math.min.apply(null, xs.map(function (f) { return f.next.inDays; }));
    xs = xs.filter(function (f) { return f.next.inDays === min; });
    return '<div class="pp-block">' + UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.room.next' } }) + rows(xs, null, true) + '</div>';
  }
  function missedLine() {
    var n = sel().missedLitters;
    if (!n || S.missed) return '';
    return UI.rowGroup(UI.row({ title: '', action: 'show-missed', strs: { title: PP.one('pp.room.missed', n) }, args: { title: { n: n } } }));
  }
  function list() {
    var all = sel('all');
    if (!all.counts.all) return UI.panel(UI.choiceEmpty('', { strs: { text: 'pp.room.empty.none' } }));
    var xs = lensOf(S.lens);
    if (xs.length) return rows(xs) + (S.lens === 'owed' ? missedLine() : '');
    var anyDone = all.counts.done > 0;
    var id = (S.filter.length || S.missed) ? 'pp.room.empty.filter' : S.lens === 'owed' ? (anyDone ? 'pp.room.empty.alldone' : 'pp.room.empty.owed') : 'pp.room.empty.' + S.lens;
    return UI.panel(UI.choiceEmpty('', { strs: { text: id } })) + (S.lens === 'owed' ? missedLine() + comingUp() : '');
  }
  function dock() {
    return '<footer class="sheet-footer pp-dock" data-ds="Sheet">' +
      '<button type="button" class="button primary" data-action="scan">' + I('scan') + U.span('act.scan') + '</button>' + UI.iconButton({ action: 'find', icon: I('search'), label: 'Find a piglet by tag or notch', className: 'room-filter-button' }) + '</footer>';
  }

  /* ---- sheets: one exit, the footer Close (the bar holds exits only) ---- */
  function sheetFrame(titleId, body, footer, sizing) {
    return '<div class="pp-layer" data-ds="Sheet"><div class="scrim" data-action="scrim"></div>' +
      '<section class="sheet" data-st-context="drawer" data-size="' + (sizing ? 'medium" data-sizing="content' : 'long') + '" role="dialog">' +
      '<header class="utility-header">' + UI.heading({ title: '', kind: 'page', level: 3, strs: { title: titleId } }) + '</header>' +
      '<div class="sheet-body">' + body + '</div>' + footer + '</section></div>';
  }
  function closeFooter() {
    return '<footer class="sheet-footer"><button type="button" class="button secondary" data-action="close-sheet" data-str="act.close">' + U.esc(PP.t('act.close')) + '</button></footer>';
  }
  function filterSheet() {
    var rowsH = roomTx().concat(S.filter.filter(function (tx) { return roomTx().indexOf(tx) < 0; })).map(function (tx) {
      var n = sel(S.lens, [tx]).rows.length;
      if (!n && S.filter.indexOf(tx) < 0) return '';
      return UI.choiceRow({ label: '', meta: '', mode: 'multi', action: 'toggle-dose', value: tx, selected: S.filter.indexOf(tx) >= 0,
        strs: { label: 'pp.common.tx.' + tx, meta: PP.one('pp.room.filter.n', n) }, args: { meta: { n: n } } });
    });
    var head = UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.room.filter.treatment' },
      action: S.filter.length ? '<button type="button" data-action="clear-filter" data-str="act.clear">' + U.esc(PP.t('act.clear')) + '</button>' : '' });
    return sheetFrame('pp.room.filter.title', head + UI.choiceGroup(rowsH, {}), closeFooter(), true);
  }

  /* ---- lookup over the ledger's identity rows, every room: nothing until the input can be a full tag or a notch ---- */
  function normal(q) { return q.trim().replace(/[‐-―−\s.\/_]+/g, '-'); }
  function lookup(raw) {
    var q = normal(raw), P = window.PPFixtures.piglets(store.derived).filter(function (p) { return p.status === 'alive' || p.status === 'weaned'; });
    if (/^\d{6}$/.test(q)) return { q: q, hits: P.filter(function (p) { return p.tag === q; }) };
    if (/^\d{4}$/.test(q)) return { q: q, hits: P.filter(function (p) { return p.tag && p.tag.slice(-4) === q; }) };
    if (/^\d+-\d+$/.test(q)) return { q: q, hits: P.filter(function (p) { return p.notch === q; }) };
    return null;
  }
  function hitBlock(p) {
    var ids = p.tag && p.notch ? ['pp.room.scan.ids_both', { tag: p.tag, notch: p.notch }] : p.tag ? ['pp.room.scan.ids_tag', { tag: p.tag }] : ['pp.room.scan.ids_notch', { notch: p.notch }];
    var head = UI.heading({ title: '', kind: 'group', level: 4, strs: { title: ids[0] }, args: { title: ids[1] } });
    var here = p.room === ROOM ? sel('all', []).rows.filter(function (f) { return f.litter === p.litter; })[0] : null;
    var body;
    if (p.status === 'weaned') body = UI.rowGroup(UI.row({ title: '', strs: { title: 'pp.room.scan.weaned' } }));
    else if (here) body = rows([here], p.tag || p.notch);
    else body = UI.rowGroup(UI.row({ title: '', action: 'open-litter', value: p.litter, attrs: { 'data-unit': p.room, 'data-piglet': p.tag || p.notch }, strs: { title: 'pp.room.scan.in_unit' }, args: { title: { n: p.room, code: p.litter } } }));
    return '<div>' + head + body + '</div>';
  }
  function findResults() {
    var r = lookup(S.q); if (!r) return '';
    if (!r.hits.length) return UI.choiceEmpty('', { strs: { text: 'pp.room.scan.none' }, args: { text: { q: r.q } } }) + UI.choiceEmpty('', { strs: { text: 'pp.room.scan.hint' } });
    return '<div class="pp-results">' + r.hits.map(hitBlock).join('') + '</div>';
  }
  function scanSheet() {
    var typeBtn = '<button type="button" class="button ' + (S.unavailable ? 'primary' : 'secondary') + ' pp-wide" data-action="type" data-str="pp.room.scan.type">' + U.esc(PP.t('pp.room.scan.type')) + '</button>';
    var body = S.unavailable
      ? UI.panel(UI.choiceEmpty('', { strs: { text: 'pp.room.scan.unavailable' } })) + '<div class="pp-block">' + typeBtn + '</div>'
      : '<div class="pp-scan-frame" data-ds="Candidate:ScanFrame">' + I('scan') + '</div>' + UI.heading({ title: '', kind: 'section', level: 4, strs: { title: 'pp.room.scan.hold' } }) + typeBtn;
    return sheetFrame('act.scan', body, closeFooter());
  }
  function findSheet() {
    var body = '<div class="pp-findbar">' +
      UI.choiceSearch({ label: 'Ear tag or notch', placeholder: 'Ear tag or notch', value: S.q, attrs: { 'data-role': 'q', inputmode: 'text', 'data-str-attr': 'aria-label:pp.room.scan.placeholder;placeholder:pp.room.scan.placeholder' } }) +
      '</div>' + (S.scanned ? '' : UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.room.find.hint' } })) +
      '<div id="scan-results">' + findResults() + '</div>';
    return sheetFrame('pp.room.scan.title', body, closeFooter());
  }
  function errorView() {
    return UI.panel(UI.choiceEmpty('', { strs: { text: 'pp.room.err.title' } }) + UI.choiceEmpty('', { strs: { text: 'pp.room.err.why' } }) +
      '<button type="button" class="button secondary" data-action="retry" data-str="pp.room.err.retry">' + U.esc(PP.t('pp.room.err.retry')) + '</button>');
  }

  /* ---- render ---- */
  var screen = document.getElementById('screen'), phone = document.getElementById('phone');
  function render() {
    if (S.error) { screen.innerHTML = header() + errorView(); phone.classList.remove('pp-locked'); tag(); return; }
    screen.innerHTML = header() + lead() + driftStrip() + controls() + list() + dock() +
      (S.sheet === 'filter' ? filterSheet() : S.sheet === 'scan' ? scanSheet() : S.sheet === 'find' ? findSheet() : '');
    phone.classList.toggle('pp-locked', !!S.sheet);
    tag();
    if (S.sheet === 'find') { var i = screen.querySelector('[data-role=q]'); if (i && !S.scanned && !i.dataset.focused) { i.dataset.focused = '1'; try { i.focus(); } catch (e) {} } }
  }
  function tag() {
    function aria(s, id) { var e = screen.querySelector(s); if (e) e.setAttribute('data-str-attr', 'aria-label:' + id); }
    aria('.task-return', 'act.back'); aria('[data-action="filter"]', 'pp.room.aria.filter'); aria('.pp-dock [data-action="find"]', 'pp.room.aria.find'); aria('.segment', 'pp.room.lens.aria');
    PP.apply(screen);
  }

  /* ---- URL, history, scroll ---- */
  function url() {
    var p = new URLSearchParams(location.search);
    ['lens', 'filter', 'missed'].forEach(function (k) { p.delete(k); });
    if (S.lens !== (start.lens || 'owed')) p.set('lens', S.lens);
    if (S.filter.length) p.set('filter', S.filter.join(','));
    if (S.missed) p.set('missed', '1');
    var s = p.toString(); return location.pathname + (s ? '?' + s : '');
  }
  function persist() { try { history.replaceState(history.state, '', url()); } catch (e) {} }
  function openSheet(n) {
    S.sheet = n; S.opened = Date.now();
    try { history.pushState({ sheet: n }, '', location.href); } catch (e) {}
  }
  function closeSheet() {
    S.q = ''; var st = history.state;
    if (st && st.sheet && !st.deep) { history.back(); return; }
    S.sheet = ''; render(); refocus();
  }
  function refocus() { var b = screen.querySelector('[data-action="scan"]'); if (b) b.focus(); }
  window.addEventListener('popstate', function (ev) {
    var sh = (ev.state && ev.state.sheet) || '';
    if (!sh) S.q = '';
    S.sheet = sh; render(); if (!sh) refocus();
  });
  if (S.sheet) { try { history.replaceState({ sheet: S.sheet, deep: true }, '', location.href); } catch (e) {} }
  function scrollKey() { return 'pp-room-scroll:' + PP.state + ':' + S.lens; }
  function saveScroll() { try { sessionStorage.setItem(scrollKey(), String(window.scrollY)); } catch (e) {} }
  function restoreScroll() { try { var y = +sessionStorage.getItem(scrollKey()); if (y && !S.sheet) window.scrollTo(0, y); } catch (e) {} }

  screen.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]'); if (!b) return;
    var a = b.dataset.action, v = b.dataset.value;
    if (a === 'scrim') { if (Date.now() - S.opened < 300) return; closeSheet(); return; }
    if (a === 'back') { location.href = PP.href('index.html'); return; }
    if (a === 'open-litter') { saveScroll(); location.href = litterHref(v, b.dataset.piglet, b.dataset.unit); return; }
    if (a === 'explain') { location.href = PP.href('count.html', { state: 'explain', unit: ROOM, data: store.name }); return; }
    if (a === 'overview') { location.href = PP.href('end.html', { state: 'overview', data: store.name !== 'base' ? store.name : '' }); return; }
    if (a === 'retry') { location.reload(); return; }
    if (a === 'lens') { S.lens = v; persist(); }
    else if (a === 'filter') { openSheet('filter'); }
    else if (a === 'scan') { openSheet('scan'); }
    else if (a === 'find') { openSheet('find'); }
    else if (a === 'type') { S.scanned = false; S.sheet = 'find'; try { history.replaceState({ sheet: 'find', deep: !!(history.state && history.state.deep) }, '', location.href); } catch (e) {} }
    else if (a === 'close-sheet') { closeSheet(); return; }
    else if (a === 'toggle-dose') { var i = S.filter.indexOf(v); if (i >= 0) S.filter.splice(i, 1); else S.filter.push(v); persist(); }
    else if (a === 'clear-filter') { S.filter = []; if (S.missed) { S.missed = false; if (S.cameFrom) S.lens = S.cameFrom; } persist(); }
    else if (a === 'show-missed') { S.cameFrom = S.lens; S.missed = true; S.lens = 'all'; persist(); }
    render();
  });
  screen.addEventListener('input', function (ev) {
    if (ev.target.dataset.role !== 'q') return;
    S.q = ev.target.value;
    var r = document.getElementById('scan-results'); r.innerHTML = findResults(); PP.apply(r);
  });
  screen.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || ev.target.dataset.role !== 'q') return;
    ev.preventDefault();
    var r = lookup(S.q);
    if (r && r.hits.length === 1 && r.hits[0].status === 'alive') { saveScroll(); location.href = litterHref(r.hits[0].litter, r.hits[0].tag || r.hits[0].notch, r.hits[0].room); }
    else ev.target.blur();
  });

  /* ---- sync: a row that another hand's record changes departs by the same law as this hand's: hold 800ms of idle, any touch resets ---- */
  function armHold() {
    clearTimeout(holdTimer);
    if (Object.keys(held).length) holdTimer = setTimeout(function () { held = {}; S.flash = ''; render(); }, 800);
  }
  ['pointerdown', 'touchstart', 'scroll'].forEach(function (e) { window.addEventListener(e, armHold, { passive: true, capture: true }); });
  function snapshot() { var m = {}; sel().rows.forEach(function (f) { m[f.litter] = f; }); return m; }
  function holdDeparted(before) {
    var now = snapshot();
    Object.keys(before).forEach(function (c) { if (!now[c]) held[c] = { lens: S.lens, f: before[c] }; });
  }
  // Another hand's record arrives (PP.sync({ type: 'treat', litter: 'A02', dose: 'iron3', n: 12, who: 'L.M' })): it goes through the ledger.
  PP.sync = function (event) {
    var before = snapshot(), r = store.commit(Object.assign({ who: 'L.M' }, event));
    if (!r.ok) return r;
    holdDeparted(before); S.flash = event.litter || event.from || ''; render(); armHold();
    return r;
  };
  // Resume (phone unlocked, or back from a litter): re-read the log, and let rows that changed lens depart by the same law.
  PP.resume = function () {
    var before = snapshot();
    store = PP.open(start.data);
    holdDeparted(before); render(); armHold();
  };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !S.error && store) PP.resume(); });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted && store) PP.resume(); });

  // A successful scan resolves into the Find result for that tag.
  PP.scanned = function (t) { S.q = t; S.scanned = true; S.sheet = 'find'; try { history.replaceState({ sheet: 'find', deep: !!(history.state && history.state.deep) }, '', location.href); } catch (e) {} render(); };

  var boot = PP.ready.then(function () {
    store = PP.open(start.data);
    CFG = store.config;
    NOW = store.today + 'T10:30';
    render(); restoreScroll();
  });
  // The one registry exception: when the registry itself failed to load there is nothing to look strings up in.
  boot.catch(function () {
    screen.innerHTML = '<p>Couldn’t load the unit.</p><button type="button" onclick="location.reload()">Retry</button>';
  });
})();
</script>
</body>
</html>
