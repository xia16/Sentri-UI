<style>
/* The room on the task skeleton (ADR 0003): farrowing's room list — TaskHeader, TaskLatest, TaskSummary, TaskLens, rows
   grouped by crate row (TaskGroup + TaskRow), TaskDock — and its sheets and the litter drawer (TaskSheet). Layout only,
   tokens from tokens.css. Candidate:ScanFrame stays task-level. */
.pp-answers { margin: 0 var(--space-panel) var(--space-panel); }
.pp-filtered { margin: 0 var(--space-panel) 6px; }
.pp-filtered > * + * { margin-top: var(--space-heading); }
.pp-after { padding: 0 var(--space-panel) var(--space-gutter); }
.pp-after > * + * { margin-top: var(--space-heading); }
.pp-tail { margin-top: 8px; }
.pp-sheet-stack > * + * { margin-top: var(--space-heading); }
.pp-scan-frame { display: grid; place-items: center; min-height: 200px; border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--inset); color: var(--ink); }
.pp-scan-frame svg { width: 64px; height: 64px; }
.pp-wide { width: 100%; }
.pp-findbar .field { margin: 0; }
.pp-results > * + * { margin-top: var(--space-heading); }
.pp-results .st-heading { margin-bottom: 8px; }
/* the litter drawer (litter.js) */
.lt-face { display: flex; flex-direction: column; gap: var(--space-heading); }
.lt-face > .pp-group { margin-top: var(--space-heading); }
.lt-summary > * + * { margin-top: 8px; }
.lt-stack { display: flex; flex-direction: column; gap: var(--space-row-y); }
/* One left edge in the drawer (rule 4): ChoiceList's group label sits on the drawer's column, not inset to its rows. */
.lt-stack .st-choice-heading.st-choice-heading { padding-left: 0; padding-right: 0; }
.lt-receipt, .lt-confirm { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-footer-gap); }
.lt-actions { display: flex; gap: var(--space-footer-gap); }
.lt-actions .button { flex: 1; }
</style>

(function () {
  var UI = window.SentriUI, I = window.SentriIcons.icon, U = window.PPUI, K = window.SentriTask;

  /* ---- states: a fixture variant (the shared log, fixtures.js) + UI state. Every figure comes from the ledger's selectors
     (select.room with identity, select.reviews, select.end). ---- */
  var STATES = {
    'room': { data: 'base' }, 'room-empty': { data: 'quiet', room: 8 }, 'room-all-done': { data: 'all-done' },
    'room-overdue': { data: 'behind' }, 'room-drift': { data: 'drift' },

    'room-missed': { data: 'base', missed: true },
    'room-all': { data: 'base', lens: 'all' },
    'room-emptied': { data: 'emptied', lens: 'all' },

  };
  /* The litter drawer's states (litter.html and edge.html forward here under the same names): [variant, crate, preset].

     records (`visit`), a treatment open (`drawer`, `resolve`, `range`), the birth-weight view (`weight`). */
  var LITTER = {
    'litter':             ['base', ''],

    'draft-waiting':      ['base', 'A02', { drafts: { iron3: { kind: 'dose', key: 'iron3', dose: 'iron3', n: 10, reason: '', owed: 12 } } }],
    'litter-short-count': ['base', 'A02', { drawer: { dose: 'iron3', n: 10, reason: '' } }],
    'litter-short-saved': ['a02-short', 'A02', { visit: ['T-A02-visit'], receipt: 'saved' }],
    'castrate':           ['a02-castrate', 'A02', { drawer: { dose: 'castrate', castr: { castrated: 3, hernia: 1, cryptorchid: 0, kept: 0, deferred: 2, deferReason: 'weak' } } }],
    'castrate-saved':     ['a02-castrated', 'A02', { visit: ['T-A02-visit'], receipt: 'saved' }],
    'castrate-catchup':   ['base', 'B03', { drawer: { dose: 'castrate', castr: { castrated: 1, hernia: 0, cryptorchid: 0, kept: 0, deferred: 1, deferReason: 'sick' } } }],
    'castrate-none':      ['c05-no-males', 'C05', { visit: ['T-C05-visit'], receipt: 'saved' }],
    'done-by-other':      ['a02-by-other', 'A02', { tap: { dose: 'iron3', n: 12 } }],
    'stale-tap':          ['a02-stale', 'A02', { tap: { dose: 'iron3', n: 12 } }],
    'early':              ['c02-early', 'C02', { visit: ['T-C02-visit'], receipt: 'saved' }],
    'late':               ['base', 'B01'],
    'missed':             ['base', 'B04'],
    'snapshot-kept':      ['base', 'B04', { drawer: { dose: 'iron14' } }],
    'double-flag':        ['base', 'A05'],
    'all-done':           ['a02-all-done', 'A02', { visit: ['T-A02-visit'], receipt: 'saved' }],
    'after-end':          ['ended-after-end', 'B01'],
    'corrected-after-end': ['ended-correct', 'B03'],
    'arrived-unknown':    ['moved-unknown', 'B02'],
    'arrived-resolve':    ['moved-unknown', 'B02', { resolve: { dose: 'iron3', had: 1 } }],
    'arrived-check':      ['moved-unknown', 'B02', { resolve: { dose: 'tail', had: 1, rest: 'record' } }],
    'range':              ['move-doubt', 'A07'],
    'range-check':        ['move-doubt', 'A07', { range: { dose: 'iron3', still: 1 } }],
    'arrivals-young':     ['move-young', 'D03'],
    'not-due':            ['base', 'A02', { pre: [{ type: 'move', from: 'D06', to: 'A02', n: 2, answers: {} }] }],
    'closed':             ['emptied', 'C05'],
    'orphan':             ['base', 'B01'],
    'orphan-unlocked':    ['base', 'D06'],
    'nurse':              ['moved-orphan', 'D02'],
    'nurse-arrivals':     ['moved-orphan', 'D02'],
    'ended':              ['ended', 'B01'],
    'ended-review':       ['ended', 'A05'],
    'held':               ['held-body', 'A07'],
    'count-conflict':     ['count-offline', 'A07'],
    'double-answered':    ['double-twice', 'A05'],
    'identity-late':      ['base', 'C05'],
    'keepers-closed':     ['keepers-closed', 'A07'],
    'one-tap-saved':      ['base', 'A02', { tap: { dose: 'iron3', n: 12 } }],
    'no-males-confirm':   ['a02-castrate', 'A02', { drawer: { dose: 'castrate', castr: { castrated: 3, hernia: 1, cryptorchid: 0, kept: 0, deferred: 0, deferReason: '' }, confirmNone: true } }],
    'split-reasons':      ['base', 'A02', { drawer: { dose: 'iron3', n: 10, reason: 'split', weak: 1 } }],
    'all-deferred':       ['base', 'A02', { drawer: { dose: 'iron3', n: 0, reason: 'weak' } }],
    'all-deferred-saved': ['base', 'A02', { pre: [{ type: 'treat', litter: 'A02', dose: 'iron3', n: 0, deferred: { n: 12, reason: 'weak' } }], preVisit: true }],
    'corrected':          ['a02-corrected', 'A02'],
    'dead-saved':         ['base', 'A02', { saved: 'dead', handoff: { parts: [{ id: 'receipt.saved' }, { id: 'ds.dead.receipt.line', args: { n: 1, cause: 'crushed' }, tone: 'green' }], litter: 'A02', from: 'A02' } }],
    'drafts-on-doors':    ['base', 'A02', { kept: { dead: { pig: { tallies: { crushed: 2 }, picks: {}, miss: {}, photos: [], note: '', route: '' }, sow: null },
                            count: { observed: 10, rows: [], at: '2026-09-29T10:20', obsMs: 0, seen: [] }, id: { run: { tag: '004301', sex: 'g', weight: null } } } }],
    // edge.html's states: litters outside the task, before the lock, the birth litter weight
    'no-task':            ['base', 'E01'],
    'no-task-moved':      ['base', 'A03', { pre: [{ type: 'move', from: 'F02', to: 'A03', n: 2, answers: {} }] }],
    'prelock':            ['base', 'D01'],
    'birth-weight-missing': ['base', 'C02'],
    'birth-weight-entry':   ['base', 'C02', { weight: { draft: '', pad: true } }],
    'birth-weight-typed':   ['base', 'C02', { weight: { draft: '16.4', pad: true } }],
    'birth-weight-range':   ['base', 'C02', { weight: { draft: '34.2', pad: false } }],
    'birth-weight-refused': ['base', 'C02', { weight: { draft: '99.9', pad: true } }],
    'birth-weight-deadtap': ['base', 'C02', { weight: { draft: '16.4', pad: true, hint: 'pp.edge.weight.dead_places' } }],
    'birth-weight-set':     ['c02-weight-set', 'C02'],
    'birth-weight-conflict': ['c02-weight-conflict', 'C02'],
    'birth-weight-saved':   ['c02-weight-saved', 'C02', { weightSaved: true }]
  };
  var qs = PP.q;
  var LS = LITTER[PP.state] || null;
  var start = STATES[PP.state] || (LS ? { data: LS[0] } : STATES.room);
  var S = {
    lens: qs.get('lens') || start.lens || '',
    filter: qs.has('filter') ? qs.get('filter').split(',').filter(Boolean) : (start.filter || []).slice(),
    missed: qs.has('missed') ? qs.get('missed') === '1' : !!start.missed,
    sheet: start.sheet || '', q: qs.get('q') || start.q || '', opened: 0, flash: '', error: !!start.error, unavailable: !!start.unavailable, scanned: !!start.scanned, cameFrom: ''
  };
  var ROOM = +(qs.get('unit') || start.room || 7);
  var store, CFG;
  var held = {}, holdTimer = 0;
  var phone = document.getElementById('phone');
  var P = function (id, args, tone) { return { text: PP.t(id, args), str: id, args: args || undefined, tone: tone || undefined }; };
  var SEP = { sep: true };
  function joined(list) { return list.filter(Boolean).reduce(function (acc, x, i) { return i ? acc.concat([SEP, x]) : [x]; }, []); }

  /* ---- the litter drawer (litter.js): over the room, the room inert behind it ---- */
  var LD = window.PPLitter({
    store: function () { return store; },
    go: function (href) { go(href); },
    unitParam: function () { return qs.get('unit') || (ROOM !== 7 ? ROOM : ''); }
  });

  /* ---- the ledger, read once per derived log ---- */
  var memo = { d: null };
  function R() {
    if (memo.d !== store.derived || memo.room !== ROOM) {
      memo.d = store.derived; memo.room = ROOM;
      memo.rows = store.select.room(store.derived, { room: ROOM, lens: 'all', identity: true });
      memo.rev = store.select.reviews(store.derived, { room: ROOM });
      memo.end = endOf(memo.rows);
    }
    return memo;
  }
  function facts() { return R().rows.rows; }
  function endOf(room) {
    var tasks = store.derived.tasks || [], ids = {};
    room.rows.forEach(function (f) { var L = store.derived.litters[f.litter]; if (L && L.task) ids[L.task] = 1; });
    var T = tasks.filter(function (t) { return ids[t.id] && t.ended; })[0];
    if (!T) return null;
    var e = store.select.end(store.derived, { task: T.id });
    return e.ended && e.atEnd ? { at: e.ended.at, who: e.ended.who, atEnd: e.atEnd } : null;
  }
  function ended() { return R().end; }
  function now() { return store.now(); }

  function doseCfg(id) { return CFG.doses.filter(function (d) { return d.id === id; })[0]; }
  function txOf(id) { return id === 'identity' ? 'identity' : (doseCfg(id) || { tx: id }).tx; }
  function scheme() { var s = CFG.identity || {}; return s.who === 'candidates' ? 'candidates' : s.scheme === 'notch' ? 'notch' : 'tag'; }
  function txId(tx) { return tx === 'identity' ? 'pp.room.id.' + scheme() : 'pp.common.tx.' + tx; }
  function name(tx) { return PP.t(txId(tx)); }
  function doseList(ds) {
    var count = {}; ds.forEach(function (o) { count[o.tx] = (count[o.tx] || 0) + 1; });
    return ds.map(function (o) { return count[o.tx] > 1 ? PP.t('pp.room.dose.withday', { name: name(o.tx), n: o.due }) : name(o.tx); }).join(' · ');
  }
  function names(ids) { return ids.map(function (id) { return name(txOf(id)); }).join(' · '); }
  function pig(n) { return P(PP.one('pp.common.unit.piglet', n), { n: n }); }
  function dose(f, id) { var L = store.derived.litters[f.litter]; return L && L.doses[id] || {}; }

  /* ---- what a litter owes, did today, has next and missed — by treatment word ---- */
  function idLive(f) { return !!f.lens && (f.identity.status === 'due' || f.identity.status === 'late'); }
  function owedItems(f) {
    var xs = f.doses.map(function (x) {
      var D = dose(f, x.dose), def = D.deferred || 0;
      return Object.assign({}, x, { deferred: def, reason: D.deferReason, deferredAll: def > 0 && x.n != null && def >= x.n });
    });
    if (idLive(f)) xs.push({ tx: 'identity', dose: 'identity', n: f.identity.owed, of: f.alive, lateBy: f.identity.lateBy, deferred: 0 });
    return xs;
  }
  function lateOf(f) { return Math.max.apply(null, [0].concat(owedItems(f).filter(function (x) { return !x.deferredAll; }).map(function (x) { return x.lateBy || 0; }))); }
  function owedTx(f) { return owedItems(f).map(function (x) { return x.tx; }); }
  function doneTx(f) { return f.doneToday.map(txOf); }
  function laterTx(f) { return (f.next ? f.next.doses.map(txOf) : []).concat(f.identity.status === 'later' ? ['identity'] : []); }
  function missedTx(f) { return f.missed.map(function (o) { return o.tx; }); }

  /* ---- lenses: Owed · Done · Later · All; missed is its own view (Q15); after End: Not done · Finished · All ---- */
  function lensKeys() { return ended() ? ['notdone', 'finished', 'all'] : ['owed', 'done', 'later', 'all']; }
  function naturalLens(f) {
    if (!f.lens) return null;
    if (ended()) { var E = ended().atEnd; return E.unfinishedLitters.indexOf(f.litter) >= 0 ? 'notdone' : E.finishedLitters.indexOf(f.litter) >= 0 ? 'finished' : null; }
    if (f.closed) return 'closed';
    if (f.kind === 'missed') return 'missed';
    return f.lens;
  }
  function filterLens(f, filter) {
    if (!f.lens || f.closed || ended()) return null;
    var hit = function (l) { return l.some(function (t) { return filter.indexOf(t) >= 0; }); };
    if (hit(owedTx(f))) return 'owed';
    if (hit(doneTx(f))) return 'done';
    if (hit(laterTx(f))) return 'later';
    if (hit(missedTx(f))) return 'missed';
    return null;
  }
  function filtering() { return S.filter.length > 0 && !ended(); }
  function lensOfF(f, filter) { filter = filter || (filtering() ? S.filter : []); return filter.length ? filterLens(f, filter) : naturalLens(f); }
  function inView(f, lens, filter) {
    filter = filter || (filtering() ? S.filter : []);
    if (S.missed && !ended()) return !!f.lens && !f.closed && f.missed.length > 0 && (!filter.length || filterLens(f, filter) != null);
    var l = lensOfF(f, filter);
    if (lens === 'all') return filter.length ? !!l : true;
    return l === lens;
  }
  var byCode = function (a, b) { return a.litter < b.litter ? -1 : a.litter > b.litter ? 1 : 0; };
  function sorter(lens) {
    if (lens === 'owed') {
      var rank = function (f) { return lateOf(f) ? 0 : f.partly ? 2 : 1; };
      return function (a, b) { return rank(a) - rank(b) || (rank(a) === 0 ? lateOf(b) - lateOf(a) : 0) || byCode(a, b); };
    }
    if (lens === 'later') return function (a, b) { return (a.next ? a.next.inDays : 999) - (b.next ? b.next.inDays : 999) || byCode(a, b); };
    return byCode;
  }
  function viewRows(lens, filter) { return facts().filter(function (f) { return inView(f, lens, filter); }).sort(sorter(S.missed ? 'all' : lens)); }
  function lensOf(lens) {
    var xs = viewRows(lens);
    // Hold, then depart: a row a record or a sync moved out of this lens stays put until the hand is idle.
    Object.keys(held).forEach(function (c) { if (held[c].lens === lens && !xs.some(function (x) { return x.litter === c; })) xs.push(held[c].f); });
    return xs;
  }
  function owedCount() {
    var n = facts().filter(function (f) { return lensOfF(f) === 'owed'; }).length;
    return n + Object.keys(held).filter(function (c) { return held[c].lens === 'owed' && !facts().some(function (f) { return f.litter === c && lensOfF(f) === 'owed'; }); }).length;
  }
  function curLens() { var ks = lensKeys(); return ks.indexOf(S.lens) >= 0 ? S.lens : ks[0]; }

  function reviews() { return R().rev.items; }
  function reviewsOf(code) { return reviews().filter(function (x) { return x.litter === code; }); }

  /* ---- the row (farrowing's TaskRow): crate + at most one chip · one headline · one meta line. The headline is what the
     litter owes (or did, or has next); the meta line says when and how many. Per-treatment counts, deferrals, arrivals,
     losses, who and when live in the litter drawer. ---- */
  function dueTok(late) { return late === 0 ? P('pp.room.tok.due_today') : late === 1 ? P('pp.room.tok.due_yest', null, 'red') : P('pp.room.tok.due_ago', { n: late }, 'red'); }
  function doneLate(f, only) {
    var late = 0;
    f.doneToday.forEach(function (id) {
      if (only && only.indexOf(txOf(id)) < 0) return;
      var D = dose(f, id);
      if (D.fullAt != null && D.due != null && D.fullAt > D.due) late = Math.max(late, D.fullAt - D.due);
    });
    return late ? P(PP.one('pp.room.tok.done_late', late), { n: late }, 'amber') : null;
  }
  // One meta line (retro 30): when it was recorded, then either how late it was done or how many piglets.
  function recMeta(f, only) { var late = doneLate(f, only); return [P('pp.room.latest.when', { when: U.ago(f.lastRecord.at, now()) }), late || pig(f.alive)]; }
  function dayMeta(f) { return [P('pp.common.unit.day', { n: f.day }), pig(f.alive)]; }
  function nextHead(nx) { return nx.inDays === 1 ? P('pp.room.l1.tomorrow', { doses: names(nx.doses) }) : P('pp.room.l1.next', { doses: names(nx.doses), n: nx.inDays }); }
  function owesSpec(f, s) {
    var items = owedItems(f), live = items.filter(function (x) { return !x.deferredAll; });
    var late = lateOf(f);
    s.head = P('pp.room.l1.owes', { doses: doseList(items) });
    // Deferred piglets (weak, sick) stay due and show on the next visit: their counts and reasons are in the drawer.
    var still = live.filter(function (o) { return o.n != null; });
    var same = still.length && still.every(function (o) { return o.n === still[0].n; });
    if (f.partly && f.lastRecord && same && still[0].n < f.alive) s.meta = [P('pp.room.meta.still', { n: still[0].n }), live.length ? dueTok(late) : null];
    else s.meta = [live.length ? dueTok(late) : null, pig(f.alive)];
  }
  function endedSpec(f, s) {
    var E = ended().atEnd, list = E.byLitter[f.litter] || [];
    if (E.unfinishedLitters.indexOf(f.litter) < 0) { s.head = P('pp.room.l1.finished'); s.meta = dayMeta(f); s.trail = 'edit'; return; }
    s.head = list.length ? joined(list.map(function (x) { return x.n == null ? P('pp.room.end.males', { name: name(txOf(x.dose)) }) : P('pp.room.end.notdone', { name: name(txOf(x.dose)), n: x.n }); }))
      : P('pp.room.end.identity', { name: name('identity') });
    var kinds = {}; list.forEach(function (x) { kinds[x.kind] = 1; });
    s.meta = dayMeta(f).concat([kinds.owed ? P('pp.room.end.owed', null, 'amber') : kinds.not_due ? P('pp.room.end.not_due') : null]);
  }
  function spec(f, mode) {
    var s = { head: null, meta: [], tone: '', trail: 'chevron' };
    if (!f.lens) { s.head = P('pp.room.l1.none'); s.meta = dayMeta(f); }
    else if (ended()) endedSpec(f, s);
    else if (mode === 'next' && f.next) { s.head = nextHead(f.next); s.tone = 'forecast'; s.meta = dayMeta(f); }
    else if (mode === 'donetx') { s.head = P('pp.room.l1.done_tx', { doses: S.filter.filter(function (t) { return doneTx(f).indexOf(t) >= 0; }).map(name).join(' · ') }); s.meta = recMeta(f, S.filter); s.trail = 'edit'; }
    else if (mode === 'missed' || f.kind === 'missed') {
      var seen = {};
      s.head = P('pp.room.l1.missed', { doses: f.missed.map(function (o) { return name(o.tx); }).join(' · ') });
      s.meta = [P('pp.common.unit.day', { n: f.day })].concat(f.missed.filter(function (o) { if (seen[o.last]) return false; seen[o.last] = 1; return true; }).map(function (o) { return P('pp.room.tok.window', { n: o.last }, 'amber'); }));
    }

  /* ---- Find over the ledger, every unit: a piglet's tag or notch, a sow's number, a crate's code (N9) ---- */

    var Ls = store.derived.litters, codes = Object.keys(Ls).sort();

    var head = UI.heading({ title: '', kind: 'group', level: 4, strs: { title: ids[0] }, args: { title: ids[1] } });
    var here = h.room === ROOM ? facts().filter(function (f) { return f.litter === h.litter; })[0] : null, body;
    if (h.kind === 'piglet' && h.status === 'weaned') body = UI.rowGroup(UI.row({ title: '', strs: { title: 'pp.room.scan.weaned' } }));
    else if (here) body = UI.rowGroup(row(here));
    else body = UI.rowGroup(UI.row({ title: '', action: 'open-litter', value: h.litter, attrs: { 'data-unit': h.room }, strs: { title: 'pp.room.scan.in_unit' }, args: { title: { n: h.room, code: h.litter } } }));
    return '<div>' + head + body + '</div>';
  }
  function findResults() {
    var r = lookup(S.q); if (!r) return '';
    if (!r.hits.length) return UI.choiceEmpty('', { strs: { text: 'pp.room.scan.none' }, args: { text: { q: r.q } } }) + UI.choiceEmpty('', { strs: { text: 'pp.room.scan.hint' } });
    return '<div class="pp-results">' + r.hits.map(hitBlock).join('') + '</div>';
  }
  function scanSheet() {
    var typeBtn = UI.button({ label: PP.t('pp.room.scan.type'), register: S.unavailable ? 'primary' : 'secondary', action: 'type', className: 'pp-wide', strs: { label: 'pp.room.scan.type' } });
    var body = S.unavailable ? UI.panel(UI.choiceEmpty('', { strs: { text: 'pp.room.scan.unavailable' } })) + typeBtn
      : '<div class="pp-scan-frame" data-ds="Candidate:ScanFrame">' + I('scan') + '</div>' + typeBtn;
    return sheet({ title: P('act.scan'), subtitle: S.unavailable ? null : P('pp.room.scan.hold'), view: 'scan', body: '<div class="pp-sheet-stack">' + body + '</div>' });
  }
  function findSheet() {
    var body = '<div class="pp-findbar">' +
      UI.choiceSearch({ label: 'Find', placeholder: 'Find', value: S.q, attrs: { 'data-role': 'q', inputmode: 'text', 'data-str-attr': 'aria-label:pp.room.scan.placeholder;placeholder:pp.room.scan.placeholder' } }) +
      '</div><div id="scan-results">' + findResults() + '</div>';
    return sheet({ title: P('pp.room.scan.title'), subtitle: P('pp.room.find.sub'), view: 'find', size: 'long', height: 'full', body: '<div class="pp-sheet-stack">' + body + '</div>' });
  }
  function errorView() {
    return '<div class="pp-after">' + UI.panel(UI.choiceEmpty('', { strs: { text: 'pp.room.err.title' } }) + UI.choiceEmpty('', { strs: { text: 'pp.room.err.why' } }) +
      UI.button({ label: PP.t('pp.room.err.retry'), register: 'secondary', action: 'retry', strs: { label: 'pp.room.err.retry' } })) + '</div>';
  }
  function roomSheet() {
    return S.sheet === 'filter' ? filterSheet() : S.sheet === 'scan' ? scanSheet() : S.sheet === 'find' ? findSheet() : S.sheet === 'reviews' ? reviewsSheet() : S.sheet === 'units' ? unitsSheet() : '';
  }

  /* ---- render: keeps the room's scroll, the drawer's scroll and focus ---- */
  function render() {
    var sc = phone.querySelector('.tk-scroll'), top = sc ? sc.scrollTop : 0;
    var sh = phone.querySelector('.tk-sheet'), sb = sh && sh.querySelector('.tk-sheet-body'), sv = sh ? sh.dataset.view || '' : '', stop = sb ? sb.scrollTop : 0;
    var f = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-action]');
    var fk = f ? [f.dataset.action, f.dataset.value || '', f.dataset.step || ''] : null;
    var header = K.header({ title: P('pp.common.task'), back: { action: 'back' }, backLabel: P('pp.room.aria.back') });
    var body = S.error ? errorView() : latest() + summaryCard() + answersRow() + filteredBlock() + lensBar() + list();
    var overlay = S.error ? '' : LD.view ? LD.html() : roomSheet();
    phone.innerHTML = K.statusbar() + K.screen({ header: header, body: body, dock: S.error ? '' : dock(), inert: !!overlay, label: P('pp.room.aria.list', { n: ROOM }) }) + overlay;
    var sc2 = phone.querySelector('.tk-scroll'); if (sc2) sc2.scrollTop = top;
    var sh2 = phone.querySelector('.tk-sheet'), sb2 = sh2 && sh2.querySelector('.tk-sheet-body');
    if (sb2 && sh2.dataset.view === sv) sb2.scrollTop = stop;
    PP.apply(phone);
    UI.liveFill(phone, { then: function (el) { PP.apply(el); } });
    if (fk) {
      var t = Array.prototype.filter.call(phone.querySelectorAll('[data-action]'), function (e) {
        return e.dataset.action === fk[0] && (e.dataset.value || '') === fk[1] && (e.dataset.step || '') === fk[2] && !e.closest('[inert]');
      })[0];
      if (t) t.focus({ preventScroll: true });
    }
    if (S.sheet === 'find' && !LD.view) { var i = phone.querySelector('[data-role=q]'); if (i && !S.scanned && !i.dataset.focused) { i.dataset.focused = '1'; try { i.focus(); } catch (e) {} } }
  }

  /* ---- URL and history. The room: room.html?state=room[&lens][&filter][&missed][&unit][&data]. The litter drawer:
     room.html?state=litter&crate=<X>[&unit][&data], a treatment in it &dose=<id>. Each drawer view pushes one entry (its
     `n` counts the entries back to the room), so the phone's Back walks treatment → litter → room (R1-24). ---- */
  function roomUrl() {
    var p = new URLSearchParams(location.search);
    ['crate', 'dose', 'saved', 'stay', 'sow', 'fresh', 'record', 'back', 'lens', 'filter', 'missed'].forEach(function (k) { p.delete(k); });
    if (!STATES[p.get('state')]) {
      p.set('state', 'room');
      if (store && store.name !== 'base') p.set('data', store.name);
      if (ROOM !== 7) p.set('unit', ROOM);
    }
    if (S.lens && S.lens !== (start.lens || lensKeys()[0])) p.set('lens', S.lens);
    if (S.filter.length) p.set('filter', S.filter.join(','));
    if (S.missed) p.set('missed', '1');
    var changed = S.filter.join(',') !== (start.filter || []).join(',') || S.missed !== !!start.missed;
    if (changed && ((start.filter || []).length || start.missed)) {
      p.set('state', 'room');
      if (start.data !== 'base' && !p.get('data')) p.set('data', start.data);
      if (start.room && !p.get('unit')) p.set('unit', start.room);
    }
    var s = p.toString(); return location.pathname + (s ? '?' + s : '');
  }
  function drawerUrl(c, key) {
    var p = new URLSearchParams();
    p.set('state', 'litter'); p.set('crate', c);
    var u = qs.get('unit') || (ROOM !== 7 ? String(ROOM) : '');
    if (u) p.set('unit', u);
    if (store.name !== 'base') p.set('data', store.name);
    if (key) p.set('dose', key);
    if (PP.lang === 'zh') p.set('lang', 'zh');
    return location.pathname + '?' + p.toString();
  }
  function persist() { if (LD.view) return; try { history.replaceState(history.state, '', roomUrl()); } catch (e) {} }
  function hs() { return history.state || {}; }
  function openLitter(c, unit) {
    if (unit && +unit !== ROOM) { go(PP.href('room.html', { state: 'litter', crate: c, unit: +unit !== 7 ? unit : '', data: dataParam() })); return; }
    S.sheet = ''; S.q = '';
    if (!LD.open(c)) return;
    try { history.pushState({ pp: 'litter', n: 1 }, '', drawerUrl(c)); } catch (e) {}
    render();
  }
  function afterDrawer(r) {
    if (r === 'push') { try { history.pushState({ pp: 'view', n: (hs().n || 0) + 1 }, '', drawerUrl(LD.crate, LD.viewKey())); } catch (e) {} render(); return; }
    if (r === 'pop') {
      LD.sync(LD.crate, '');
      if (hs().pp === 'view' && hs().n > 1) { history.back(); render(); return; }
      try { history.replaceState({ pp: 'litter', n: Math.max(0, (hs().n || 1) - 1) }, '', drawerUrl(LD.crate)); } catch (e) {}
      render(); return;
    }
    if (r === 'close') {
      var back = hs().n || 0;
      LD.close();
      if (back > 0) { history.go(-back); render(); return; }
      try { history.replaceState(null, '', roomUrl()); } catch (e) {}
      render(); return;
    }
    if (r === 'render') render();
  }
  function openSheet(n) {
    S.sheet = n; S.opened = Date.now();
    try { history.pushState({ sheet: n }, '', location.href); } catch (e) {}
  }
  function closeSheet() {
    S.q = ''; var st = history.state;
    if (st && st.sheet && !st.deep) { history.back(); return; }
    S.sheet = ''; render(); persist(); refocus();
  }
  function refocus() { var b = phone.querySelector('.tk-dock-primary'); if (b) b.focus(); }
  window.addEventListener('popstate', function (ev) {
    var q = new URLSearchParams(location.search), st = ev.state || {};
    if (q.get('state') === 'litter' && q.get('crate')) { S.sheet = ''; LD.sync(q.get('crate'), q.get('dose') || ''); render(); return; }
    if (LD.view) LD.close();
    var sh = st.sheet || '';
    if (!sh) S.q = '';
    S.sheet = sh; persist(); render(); if (!sh) refocus();
  });
  function scrollKey() { return 'pp-room-scroll:' + PP.state + ':' + S.lens; }
  function saveScroll() { try { var sc = phone.querySelector('.tk-scroll'); sessionStorage.setItem(scrollKey(), String(sc ? sc.scrollTop : 0)); } catch (e) {} }
  function restoreScroll() { try { var y = +sessionStorage.getItem(scrollKey()), sc = phone.querySelector('.tk-scroll'); if (y && sc && !S.sheet && !LD.view) sc.scrollTop = y; } catch (e) {} }
  function go(href) { saveScroll(); location.href = href; }

  phone.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]'); if (!b) return;
    var a = b.dataset.action, v = b.dataset.value != null ? b.dataset.value : b.value;
    if (LD.view) { var r = LD.click(a, v, b); if (r) { afterDrawer(r); return; } return; }
    if (a === 'dismiss') { if (Date.now() - S.opened < 300) return; closeSheet(); return; }
    if (UI.guard(b)) return;
    if (a === 'back' || a === 'overview') { go(PP.href('end.html', { state: ended() ? 'ended' : 'overview', unit: ROOM !== 7 ? ROOM : '', data: dataParam() })); return; }
    if (a === 'open-litter') { openLitter(v, b.dataset.unit); return; }
    if (a === 'explain') { go(PP.href('count.html', { state: 'explain', unit: ROOM, data: store.name })); return; }
    if (a === 'receipt') { go(PP.href('end.html', { state: 'receipt', data: store.name })); return; }
    if (a === 'open-review') {
      var x = reviews().filter(function (y) { return y.id === v; })[0];
      if (!x) return;
      var href = reviewHref(x);
      if (href) go(href); else openLitter(x.litter);
      return;
    }
    if (a === 'open-unit') {
      if (+v === ROOM) { closeSheet(); return; }
      go(PP.href('room.html', { state: 'room', unit: +v !== 7 ? v : '', data: dataParam() })); return;
    }
    if (a === 'retry') { location.reload(); return; }
    if (a === 'open-bulk') { go(PP.href('bulk.html', { state: 'bulk', tx: v, unit: ROOM !== 7 ? ROOM : '', data: dataParam() })); return; }
    if (a === 'lens') { S.lens = v; persist(); }
    else if (a === 'filter' || a === 'scan' || a === 'find' || a === 'reviews' || a === 'units') { openSheet(a); }
    else if (a === 'type') { S.scanned = false; S.sheet = 'find'; try { history.replaceState({ sheet: 'find', deep: !!(history.state && history.state.deep) }, '', location.href); } catch (e) {} }
    else if (a === 'close-sheet') { closeSheet(); return; }
    else if (a === 'toggle-dose') { var i = S.filter.indexOf(v); if (i >= 0) S.filter.splice(i, 1); else S.filter.push(v); persist(); }
    else if (a === 'clear-filter') { S.filter = []; if (S.missed) { S.missed = false; if (S.cameFrom) S.lens = S.cameFrom; } persist(); }
    else if (a === 'show-missed') { S.cameFrom = S.lens; S.missed = true; persist(); }
    else return;
    render();
  });
  UI.radioBind(phone, { onChange: function (field, value) { if (LD.view) { LD.radio(field, value); render(); } } });
  phone.addEventListener('input', function (ev) {
    if (ev.target.dataset.role !== 'q') return;
    S.q = ev.target.value;
    var r = document.getElementById('scan-results'); r.innerHTML = findResults(); PP.apply(r);
  });
  phone.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || ev.target.dataset.role !== 'q') return;
    ev.preventDefault();
    var r = lookup(S.q), h = r && r.hits.length === 1 ? r.hits[0] : null;
    if (h && (h.kind === 'litter' || h.status === 'alive')) openLitter(h.litter, h.room !== ROOM ? h.room : '');
    else ev.target.blur();
  });

  /* ---- sync: a row another hand's record changes departs by the same law as this hand's: hold 800ms of idle ---- */
  function armHold() {
    clearTimeout(holdTimer);
    if (Object.keys(held).length) holdTimer = setTimeout(function () { held = {}; S.flash = ''; render(); }, 800);
  }
  ['pointerdown', 'touchstart', 'scroll'].forEach(function (e) { window.addEventListener(e, armHold, { passive: true, capture: true }); });
  function snapshot() { var m = {}, l = curLens(); viewRows(l).forEach(function (f) { m[f.litter] = f; }); return { lens: l, m: m }; }
  function holdDeparted(before) {
    var now2 = snapshot().m;
    Object.keys(before.m).forEach(function (c) { if (!now2[c]) held[c] = { lens: before.lens, f: before.m[c] }; });
  }
  PP.sync = function (event) {
    var before = snapshot(), r = store.commit(Object.assign({ who: 'L.M' }, event));
    if (!r.ok) return r;
    holdDeparted(before); S.flash = event.litter || event.from || ''; render(); armHold();
    return r;
  };
  PP.resume = function () {
    if (LD.view) return;
    var before = snapshot();
    store = PP.open(start.data);
    holdDeparted(before); render(); armHold();
  };
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !S.error && store) PP.resume(); });
  window.addEventListener('pageshow', function (ev) { if (ev.persisted && store) PP.resume(); });
  PP.scanned = function (t) { S.q = t; S.scanned = true; S.sheet = 'find'; try { history.replaceState({ sheet: 'find', deep: !!(history.state && history.state.deep) }, '', location.href); } catch (e) {} render(); };

  var boot = PP.ready.then(function () {
    var pre = LS && LS[2] ? LS[2] : null;
    // a state that records at load (`pre`, a one-tap) shows the moment after, kept out of the tab's log
    store = PP.open(start.data, pre && (pre.pre || pre.tap) ? { session: false } : null);
    CFG = store.config;
    if (start.ticks) { try { sessionStorage.setItem('pp-bulk-ticks:' + store.name + ':' + ROOM + ':' + start.ticks.dose, JSON.stringify(start.ticks.sel)); } catch (e) {} }
    if (LS) {
      var c = qs.get('crate') || LS[1] || 'A02';
      if (qs.get('sow')) c = store.crateOfSow(qs.get('sow')) || c;
      if (LD.open(c, { preset: pre, dose: qs.get('dose') || '', saved: qs.get('saved') || '' })) {
        if (!qs.get('unit') && LD.unit() != null) ROOM = LD.unit();
        try { history.replaceState({ pp: LD.view === 'litter' ? 'litter' : 'view', n: 0, deep: true }, '', location.href); } catch (e) {}
      }
    } else if (S.sheet) { try { history.replaceState({ sheet: S.sheet, deep: true }, '', location.href); } catch (e) {} }
    render(); restoreScroll();
  });
  boot.catch(function (e) {
    if (window.console) console.error(e);
    phone.innerHTML = '<p>Couldn’t load the unit.</p><button type="button" onclick="location.reload()">Retry</button>';
  });
})();
</script>
</body>
