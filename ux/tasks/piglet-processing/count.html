<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set count</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="/ux/design-system/components/task-skeleton.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css. The page is the task skeleton (ADR 0003): TaskPhone; TaskSheet for Set count and
   the litter's counts (grab, title, subtitle, ✕ or Clear, divider, body, footer with Back + the primary); TaskPage for
   Explain; TaskDialog for one question. The body is cards: Stepper (hero), Facts, Row, ChoiceList, Heading, Status and
   Button's reason line. */
.ct-over { display: contents; }
/* The room behind the sheets: the page the worker returns to, drawn by its own page (inert, never focusable). */
.ct-behind { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--app-background); pointer-events: none; }
.ct-body { display: flex; flex-direction: column; gap: var(--space-section); }
.ct-body > * { margin: 0; }
.ct-group { display: flex; flex-direction: column; gap: var(--space-heading); }
.ct-group > * { margin: 0; }
.ct-body .st-status-line { margin: 0; }
</style>
</head>
<body class="tk-stage">
<div id="screen"></div>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="/ux/design-system/components/task-skeleton.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, U = window.PPUI, K = window.SentriTask;

  /* ---- states: a variant of the shared fixture + UI state. Every figure is the ledger's: select.countDraft (the number seen,
     what Save writes — a count never closes a line, RULINGS round 3 — which tagged piglets must be named, why Save waits), select.explain
     (each open line, its death door and the Moves the app suggests, ranked, with what each leaves open), select.counts (the
     standing count, what each wrote, sync review) and select.moveDraft (alive after an explaining Move). Save commits through
     append. `save`: the state is the moment after Save (committed at load, not kept in the tab). `sub`: a view one level
     down (roster: the tagged piglets a count names missing · held: the held-body question). ---- */
  var STATES = {
    'count':           { view: 'count', crate: 'A02' },
    // the litter's counts are the litter drawer's (round 5): these states forward there (`litter`), after what they record
    'host':            { view: 'litter', crate: 'A02' },
    // R1-27: a count far above Alive asks before it saves; 0 asks "moved or weaned?"; a kept 0 asks again (never a stale 0 ready)
    'count-high':      { view: 'count', crate: 'A02', observed: 42 },
    'count-zero':      { view: 'count', crate: 'A02', observed: 0 },
    'count-kept-zero': { view: 'count', crate: 'A02', kept: { observed: 0, rows: [], at: '2026-09-29T10:20', ageMin: 10 } },
    // R1-9: a count below Alive on a litter with tags may name which tagged piglets are missing (optional when untagged cover it)
    'count-name-optional': { view: 'count', crate: 'B06', observed: 11, rows: ['B06-r4'] },
    'count-name-list': { view: 'count', crate: 'B06', observed: 11, rows: ['B06-r4'], sub: 'roster' },
    // R1-22: a held body is answered in the Set count drawer too, above the number
    'count-held':      { view: 'count', crate: 'A07', data: 'held-body' },
    'count-held-ask':  { view: 'count', crate: 'A07', data: 'held-body', sub: 'held' },
    // R1-20: a concurrent count that agrees net of a death its phone had not seen
    'count-agree':     { view: 'count', crate: 'A07', data: 'count-agree' },
    // round 4: a counted gain owes nothing new — "check on the pig"; a body never explains a gain
    'explain-gain':    { view: 'explain', crate: 'B08', data: 'explain' },
    // R1-26: back on Explain after a body found from its line: the dead drawer's receipt, `all missing found`
    'found-saved':     { view: 'explain', crate: 'D03', dead: { lines: [{ cause: 'crushed', n: 2 }], fromMissing: 2 } },
    'count-match':     { view: 'litter', crate: 'A02', save: 12 },
    'count-loss':      { view: 'litter', crate: 'A02', save: 10 },
    'count-gain':      { view: 'litter', crate: 'A02', save: 13 },
    'count-recount':   { view: 'count', crate: 'D03', observed: 13 },
    'count-named':     { view: 'count', crate: 'B06', observed: 8 },
    'count-named-list': { view: 'count', crate: 'B06', observed: 8, sub: 'roster' },
    'count-kept':      { view: 'litter', crate: 'A02', kept: { observed: 10, rows: [], at: '2026-09-29T06:00', ageMin: 270 } },
    'count-kept-newer': { view: 'count', crate: 'A02', data: 'drift', kept: { observed: 10, rows: [], at: '2026-09-29T08:50', ageMin: 20, seen: [] } },
    'count-prelock':   { view: 'count', crate: 'D01' },
    'count-weaned':    { view: 'count', crate: 'D02' },
    'count-ended':     { view: 'count', crate: 'A02', data: 'ended' },
    'count-conflict':  { view: 'count', crate: 'A07', data: 'count-offline' },
    'explain':         { view: 'explain', crate: 'B06', data: 'explain' },
    'explain-suggest': { view: 'suggest', crate: 'B06', data: 'explain', line: 'C-B06-loss', pick: 'C-B08-gain' },
    'explain-pick':    { view: 'suggest', crate: 'B06', data: 'explain-named', line: 'C-B06-named', pick: 'C-B08-gain' },
    'explain-open':    { view: 'explain', crate: 'D03' },
    'explain-room':    { view: 'explain', room: 7, data: 'explain' },
    // RULINGS round 3: the same body recorded twice is held for review until a worker answers one body or two
    'held-body':       { view: 'count', crate: 'A07', data: 'held-body', sub: 'held' }
  };
  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'count';
  var spec = JSON.parse(JSON.stringify(STATES[name]));
  var STALE_MIN = 90;                     // a kept count older than a visit (RULINGS: ~90 minutes idle ends a visit) asks for a recount
  var store, TODAY, crate, S, lastTap = 0;

  /* ---- the ledger ---- */
  function L(c) { return store.derived.litters[c || crate]; }
  function sow(c) { return store.sow(c || crate) || { sow: '', parity: 0, unit: 7 }; }
  var memo = { key: '', val: null };
  function draft() {
    var d = { observed: S.observed, missingRows: S.rows.slice(), at: S.at }, key = JSON.stringify(d) + crate + store.events.length;
    if (memo.key !== key) memo = { key: key, val: store.select.countDraft(store.derived, crate, d, { who: window.PPFixtures.ME }) };
    return memo.val;
  }
  function explain() { return store.select.explain(store.derived, S.room ? { room: S.room } : { litter: crate }, { who: window.PPFixtures.ME }); }
  function dirty() { return S.observed !== draft().base || S.rows.length > 0; }
  function countIds() { return L().counts.map(function (c) { return c.id; }); }
  /* A kept count is stale when a newer count reached this phone after it was observed (same-device order: the counts it had
     seen, never clocks between devices), or when this phone's own clock, read now, says it is older than a visit. Once stale,
     Save waits until the count is touched again (a fresh observation). */
  function stale() {
    if (!S.at) return null;
    var newer = L().counts.filter(function (c) { return (S.seen || []).indexOf(c.id) < 0; });
    if (newer.length) return { kind: 'newer', c: newer[newer.length - 1] };
    if (Date.now() - (S.obsMs || 0) > STALE_MIN * 60000) return { kind: 'old' };
    return null;
  }

  /* ---- the draft stays on this phone with its observation time and the counts it had seen, saved on every change
     (sessionStorage); a state that shows a kept draft holds it in memory only ---- */
  var DKEY = function () { return 'pp-count-draft:' + store.name + ':' + crate; };
  var mem = spec.kept && spec.view !== 'litter' ? { d: null } : null;
  function keepDraft() {
    var d = dirty() ? { observed: S.observed, rows: S.rows.slice(), at: S.at, obsMs: S.obsMs, seen: S.seen } : null;
    if (mem) { mem.d = d; return; }
    try { if (d) sessionStorage.setItem(DKEY(), JSON.stringify(d)); else sessionStorage.removeItem(DKEY()); } catch (e) {}
  }
  function keptDraft() { if (mem) return mem.d; try { return JSON.parse(sessionStorage.getItem(DKEY()) || 'null'); } catch (e) { return null; } }
  function dropDraft() { if (mem) { mem.d = null; return; } try { sessionStorage.removeItem(DKEY()); } catch (e) {} }

  /* ---- helpers ---- */
  var pl = PP.one;
  function span(id, args, o) { return U.span(id, args, o); }
  var s = function (id, args) { return { text: PP.t(id, args), str: id, args: args }; };       // a skeleton text slot
  function np(n) { return PP.tn('pp.common.unit.piglet', n); }            // `12 piglets` · `12头`
  function pigs(n) { return { id: pl('pp.common.unit.piglet', n), args: { n: n } }; }
  function stamp(at, who) { return U.stamp(at, who, TODAY); }
  function when(at) { return String(at).slice(0, 10) === String(TODAY).slice(0, 10) ? U.time(at) : U.date(at) + ' · ' + U.time(at); }
  function fact(label, labelArgs, value, valueArgs, meta, metaArgs, tone) {
    var f = { label: '', strs: { label: label }, args: { label: labelArgs } };
    if (tone) f.valueHtml = span(value, valueArgs, { tone: tone }); else { f.value = ''; f.strs.value = value; f.args.value = valueArgs; }
    if (meta) { f.meta = ''; f.strs.meta = meta; f.args.meta = metaArgs; }
    return f;
  }
  // A door row (Row card): one title, at most one meta line, a chevron or a trailing word.
  function row(o) {
    var strs = { title: o.title }, args = { title: o.titleArgs };
    if (o.desc) { strs.description = o.desc; args.description = o.descArgs; }
    if (o.trail) { strs.trailing = o.trail; args.trailing = o.trailArgs; }
    return UI.row({ title: '', description: o.desc ? '' : undefined, trailing: o.trail ? '' : undefined, action: o.action, value: o.value, strs: strs, args: args });
  }
  function rowLabel(r) { return r.tag ? { id: 'pp.count.row.tag', args: { tag: r.tag } } : { id: 'pp.count.row.notch', args: { notch: r.notch } }; }
  function eventOf(id) { return store.events.filter(function (e) { return e.id === id; })[0] || null; }
  function lineTitle(l, withCode) {
    var base = 'pp.count.line.' + l.kind + (l.open < l.qty ? '_part' : '') + (withCode ? '_code' : '');
    return { id: base, args: { np: np(l.open), qp: np(l.qty), code: l.litter } };
  }
  // the base the difference was taken from (no count replaces another: RULINGS round 3)
  function lineStamp(l) {
    return { id: 'pp.count.line.stamp', args: { op: np(l.observed), stamp: stamp(l.at, l.who), wp: np(l.sizedAgainst) } };
  }
  // Save (or the step's primary), and the reason it waits (Button's waiting face, ADR 0002): the footer's status line
  function saveFooter(p, waiting, action, id, args, backAction) {
    return K.footer({ back: { action: backAction || 'back' }, status: p ? { text: PP.t(p.id, p.args), str: p.id, args: p.args, id: 'ct-why' } : null,
      primary: { label: s(id || 'act.save', args), action: action || 'save', waiting: waiting } });
  }
  // the answer a sanity question takes (`17 is right`, `None are there`): a text action under the number it questions
  function sureAct(p) {
    if (!p || !p.act) return '';
    return UI.button({ label: PP.t(p.act.id, p.act.args), register: 'text', action: p.act.action, value: String(S.observed), strs: { label: p.act.id }, args: p.act.args ? { label: p.act.args } : undefined });
  }
  function subtitleOf() {
    var x = L(), d = draft(), sub = [s('pp.count.sub.alive', { code: crate, a: x.alive })];
    if (d.open && (d.open.loss || d.open.gain)) sub.push({ sep: true }, s(d.open.loss ? 'pp.count.sub.missing' : 'pp.count.sub.extra', { op: np(d.open.loss || d.open.gain) }));
    var E = store.derived.ended;
    if (E && E.event && x.inTask) sub.push({ sep: true }, s('pp.count.sub.ended', { date: U.date(E.at) }));
    return sub;
  }

  /* ---- The receipt owns the change this Save made (Status line, ADR 0002): colour sits on the numeral only (the totals stay
     in the record). A body saved from this page's doors comes back with the dead drawer's own receipt. ---- */
  function tok(id, args, tone) { return { text: PP.t(id, args), strs: { text: id }, args: args ? { text: args } : undefined, tone: tone || '' }; }
  function receiptLine() {
    if (!S.deadRcpt) return '';
    return UI.statusLine(S.deadRcpt.map(function (p) { return tok(p.id, p.args, p.tone); }), { live: true, id: 'ct-receipt' });
  }
  // What Save wrote, handed to the litter drawer it returns to (`pp-receipt:count`, parts as the dead drawer's)
  function receiptParts(kind, diff) {
    var k = Math.abs(diff), parts = [{ id: 'receipt.saved' }];
    if (kind === 'loss') parts.push({ id: 'pp.count.rcpt.loss_line', args: { kp: np(k) }, tone: 'red' });
    else if (kind === 'gain') parts.push({ id: 'pp.count.rcpt.gain_line', args: { kp: np(k) }, tone: 'blue' }, { id: 'pp.count.rcpt.check_line' });
    else parts.push({ id: 'pp.count.rcpt.match_line' });
    return parts;
  }

  /* ---- The same body recorded twice (RULINGS round 3): the second allocation of one missing piglet is held — Dead and
     Alive stay — until a worker answers one body (the duplicate is withdrawn) or two (a second death). One row where the
     next count or body is recorded (R1-22); the question one level down, as a dialog. ---- */
  function heldOpen() { return (L().held || []).filter(function (h) { return !h.resolved; }); }
  function heldRow() {
    return heldOpen().map(function (h) {
      return '<div data-target="held">' + UI.rowGroup(row({ action: 'sub', value: 'held', title: 'pp.count.held.title', desc: 'pp.count.held.row', descArgs: { b: h.who, t: U.time(h.at) } })) + '</div>';
    }).join('');
  }
  function heldDialog() {
    var x = L(), h = heldOpen()[0];
    if (!h) return '';
    var first = null;
    x.deaths.forEach(function (d) { if (!first && d.id !== h.event && d.fromMissing > 0) first = d; });
    // farrowing's dialog: one question, the answers as radios, Back + Apply (Apply waits until an answer is picked)
    var pick = S.heldPick || '';
    var body = UI.choiceRadios({ label: '', layout: 'rows', action: 'held-pick', key: 'held', selected: pick, id: 'held-answer', options: [
      { value: 'one', label: '', strs: { label: 'pp.count.held.one', meta: 'pp.count.held.one_short' }, args: { meta: { ap: np(x.alive) } }, meta: '' },
      { value: 'two', label: '', strs: { label: 'pp.count.held.two', meta: 'pp.count.held.two_short' }, args: { meta: { ap: np(Math.max(0, x.alive - h.n)) } }, meta: '' }] });
    var apply = { label: s('pp.count.held.apply'), action: 'resolve', value: pick ? h.event + '|' + pick : '', waiting: !pick };
    return K.dialog({ title: s('pp.count.held.title'), description: s('pp.count.held.ask', { a: first ? first.who : '', b: h.who }), body: body,
      footer: K.footer({ back: { action: 'sub-back' }, primary: apply }) });
  }

  /* Two counts to settle: disagreeing (neither saw the other: neither stands) or under sync review (one missed a change).
     One still row above the number: the counts are said in its meta, and this count settles it. */
  function settleRow(c) {
    if (c.conflict) {
      var list = c.counts.filter(function (k) { return c.disputed.indexOf(k.id) >= 0; })
        .map(function (k) { return PP.t('pp.count.review.one', { who: k.who, np: np(k.observed) }); }).join(' · ');
      return UI.rowGroup(row({ action: '', value: '', title: 'pp.count.review.conflict', desc: 'pp.count.review.conflict_row', descArgs: { list: list } }));
    }
    if (!c.review) return '';
    var st = c.counts.filter(function (k) { return k.stands; })[0];
    var desc, dargs = { np: np(st.observed) };
    if (st.crossed.length) {
      var x = eventOf(st.crossed[0]) || {};
      desc = x.type === 'move' ? 'pp.count.review.move' : x.type === 'weaned' ? 'pp.count.review.weaned' : 'pp.count.review.death';
      dargs.who = st.who; dargs.t = U.time(x.at || st.at); dargs.by = x.who || '';
    } else {
      var o = eventOf(st.order[0]) || {};
      desc = 'pp.count.review.order'; dargs.who = o.who || ''; dargs.t = U.time(o.at || st.at);
    }
    return UI.rowGroup(row({ action: '', value: '', title: 'pp.count.review.title', desc: desc, descArgs: dargs }));
  }
  // R1-20: two counts that saw the same crate, net of a change one phone had not seen: one observation, nothing to settle
  function agreeRow(c) {
    var k = c.counts.filter(function (x) { return x.agreesNet; })[0];
    if (!k) return '';
    return UI.rowGroup(row({ action: '', value: '', title: 'pp.count.agree.title', titleArgs: { np: np(k.observed) },
      desc: 'pp.count.c.agrees', descArgs: { who: (eventOf(k.agreesWith[0]) || {}).who || '' } }));
  }
  /* ---- the Set count drawer: a staged assertion (Back keeps the draft, Clear discards it, Save writes one stamped count) ---- */
  function hint(d) {
    if (d.kind === 'match') return { id: 'pp.count.hint.match' };
    return { id: 'pp.count.hint.' + d.kind, args: { k: Math.abs(d.diff), kp: np(Math.abs(d.diff)) } };
  }
  // R1-9: below Alive on a litter with tags, the count may name which tagged piglets are missing — required only when the
  // untagged cannot cover the difference; a named piglet's body later closes its own line. One row here; the list one level down.
  function rosterRow(d) {
    if (!d.roster.length || (d.kind !== 'loss' && !S.rows.length)) return '';
    var must = d.needRows > 0, n = S.rows.length;
    return '<div data-target="roster">' + UI.rowGroup(row({ action: 'sub', value: 'roster', title: must ? pl('pp.count.named.title', d.needRows) : 'pp.count.named.title_opt',
      desc: n ? pl('pp.count.named.picked', n) : null, descArgs: { n: n } })) + '</div>';
  }
  function rosterView(d) {
    var must = d.needRows > 0;
    var rows = UI.choiceGroup(d.roster.map(function (r) {
      var l = rowLabel(r);
      return UI.choiceRow({ label: '', mode: 'multi', action: 'pick-row', value: r.rowId, selected: S.rows.indexOf(r.rowId) >= 0, mono: true, strs: { label: l.id }, args: { label: l.args } });
    }));
    var p = pointer(d);
    return K.drawer({ size: 'long', height: 'full', view: 'roster', title: s(must ? pl('pp.count.named.title', d.needRows) : 'pp.count.named.title_opt'),
      subtitle: [s(must ? pl('pp.count.named.desc', d.needRows) : 'pp.count.named.desc_opt', { up: np(d.untagged), kp: np(d.maxRows), n: d.needRows })], close: { action: 'sub-dismiss' },
      body: '<div class="ct-body" data-target="roster-list">' + rows + '</div>',
      footer: saveFooter(p, !d.event || !!stale() || S.failed || !!sanity(d), 'save', 'act.save', null, 'sub-back'), scrim: { action: 'sub-dismiss' } });
  }
  function pointer(d) {
    if (S.failed) return { id: 'pp.count.why.failed' };
    var st = stale();
    if (st && st.kind === 'newer') return { id: 'pp.count.why.newer', args: { who: st.c.who, np: np(st.c.observed), t: when(st.c.at) } };
    if (st) return { id: 'pp.count.why.stale', args: { t: when(S.at) } };
    if (d.why === 'name_the_rows') return { id: pl('pp.count.why.rows', d.needRows - d.picked.length), args: { n: d.needRows - d.picked.length } };
    if (d.why === 'too_many_rows') return { id: pl('pp.count.why.too_many', d.maxRows), args: { n: d.maxRows } };
    if (d.why) return { id: 'pp.count.why.check' };
    var ask = sanity(d);
    if (ask === 'zero') return { id: 'pp.count.why.zero', args: { ap: np(d.base) }, act: { action: 'sure', id: 'pp.count.zero.yes' } };
    if (ask === 'far') return { id: 'pp.count.why.far', args: { np: np(S.observed), k: d.diff, ap: np(d.base) }, act: { action: 'sure', id: 'pp.count.far.yes', args: { n: S.observed } } };
    return null;
  }
  /* R1-27: a count far above Alive, or 0 on a litter with piglets, is asked before Save (`sure` is never kept with the draft,
     so a kept 0 asks again: never a stale 0 ready to Save). */
  var FAR = 4;                             // unexplained gains of 4 or more in one crate: ask before writing them
  function sanity(d) {
    if (S.sure === S.observed) return null;
    if (S.observed === 0 && d.base > 0) return 'zero';
    if (d.kind === 'gain' && d.diff >= FAR) return 'far';
    return null;
  }
  // 0 seen: moved or weaned? A Move is recorded as a Move (it never writes missing piglets); weaning is recorded at weaning.
  function zeroSection(d) {
    if (sanity(d) !== 'zero') return '';
    return '<section class="ct-group" data-target="zero">' + UI.heading({ title: '', kind: 'group', level: 3, strs: { title: 'pp.count.zero.title' }, args: { title: { code: crate } } }) +
      UI.rowGroup(row({ action: 'open-move', value: crate, title: 'pp.count.zero.move', titleArgs: { code: crate }, desc: 'pp.count.zero.move_desc' })) + '</section>';
  }
  function settleRows() { var c = store.select.counts(store.derived, crate) || { counts: [] }; return settleRow(c) + agreeRow(c); }
  function countSheet() {
    var d = draft(), h = hint(d), p = pointer(d);
    var hero = UI.stepper({ label: '', value: S.observed, min: 0, key: 'observed', variant: 'hero', draft: dirty(), hint: '', reserveHint: true,
      strs: { label: 'pp.count.seen', value: 'ds.field.figure', hint: h.id, decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase' },
      args: { label: { code: crate }, hint: h.args } });
    // a held body is answered here too, above the number (R1-22): the drawer never hides the question under it
    return K.drawer({ size: 'long', view: 'count', title: s('pp.count.title'), subtitle: subtitleOf(),
      aside: dirty() ? UI.button({ label: PP.t('act.clear'), register: 'text', action: 'clear', strs: { label: 'act.clear' } }) : '', close: { action: 'dismiss' },
      body: '<div class="ct-body">' + heldRow() + settleRows() + hero + sureAct(p) + zeroSection(d) + rosterRow(d) + '</div>',
      footer: saveFooter(p, !d.event || !!stale() || S.failed || !!sanity(d)), scrim: { action: 'dismiss' } });
  }

  /* ---- where the ledger does not take a count, the door says why: before the lock the count is the farrowing sheet's (hand-off);
     a weaned-out litter has nothing to count ---- */
  function refusedSheet(why) {
    var x = L(), body, sub;
    if (why === 'farrowing_open') {
      var ev = x.lastEvent;
      sub = s('pp.count.pre.sub', { code: crate });
      body = UI.rowGroup(row({ action: 'open-farrowing', value: crate, title: 'pp.count.pre.door', titleArgs: { code: crate },
        desc: 'pp.count.pre.door_desc', descArgs: { bp: np(x.born), ago: U.ago(ev.at, store.now()), who: ev.who } }));
    } else {
      var w = store.events.filter(function (e) { return e.type === 'weaned' && e.litter === crate; }).pop() || {};
      sub = s('pp.count.weaned.sub', { code: crate, date: w.at ? U.date(w.at) : '', np: np(x.weaned) });
      body = UI.rowGroup(row({ action: 'open-move', value: crate, title: 'pp.count.weaned_move', desc: 'pp.count.weaned_move_desc', descArgs: { code: crate } }));
    }
    return K.drawer({ size: 'short', view: 'refused', title: s('pp.count.title'), subtitle: [sub], close: { action: 'dismiss' },
      body: body, footer: K.footer({ back: { action: 'back' } }), scrim: { action: 'dismiss' } });
  }

  /* ---- Explain: the open lines one by one (a litter, or the unit from its drift strip), each with its doors ---- */
  function effect(sg) {
    var l = sg.left;
    if (!l.loss && !l.gain) return PP.t('pp.count.sug.both');
    return l.loss ? PP.t('pp.count.sug.gain_closes', { kp: np(l.loss) }) : PP.t('pp.count.sug.loss_closes', { kp: np(l.gain) });
  }
  // how far apart the two counts were: the rail word of a suggestion (`5 min`, `2h`)
  function gap(m) { return m == null ? null : m < 60 ? ['pp.count.sug.gap_min', { m: m }] : ['pp.count.sug.gap_h', { h: Math.round(m / 60) }]; }
  function suggestionRow(l, sg) {
    var cross = sg.room !== l.room, g = gap(sg.gapMin);
    var t = (sg.kind === 'gain' ? 'pp.count.sug.gained' : 'pp.count.sug.lost') + (cross ? '_unit' : '');
    return row({ action: 'suggest', value: l.id + '|' + sg.id, title: t, titleArgs: { code: sg.litter, np: np(sg.open), u: sg.room },
      desc: 'pp.count.sug.desc', descArgs: { effect: effect(sg) }, trail: g && g[0], trailArgs: g && g[1] });
  }
  // One line: its title and stamp, then its doors — the Moves the app suggests (ranked, never proof), a body, a new count
  // (a new observation: it never closes the line) and Edit for a wrong count. One headline per door.
  function lineSection(l, withCode) {
    var t = lineTitle(l, withCode), st = lineStamp(l), rows = [];
    var all = S.more[l.id] ? l.suggestions : l.suggestions.slice(0, 3);
    all.forEach(function (sg) { rows.push(suggestionRow(l, sg)); });
    var more = l.suggestions.length - all.length;
    if (more > 0) rows.push(row({ action: 'more', value: l.id, title: pl('pp.count.sug.more', more), titleArgs: { n: more } }));
    if (l.kind === 'gain') rows.push(row({ action: 'move-in', value: l.id, title: 'pp.count.ex.move_in' }));
    if (l.death) rows.push(row({ action: 'open-dead', value: l.litter, title: 'pp.dead.title.record' }));
    rows.push(row({ action: 'open-count', value: l.litter, title: 'pp.count.review.again', titleArgs: { code: l.litter } }));
    // a mistaken count is corrected through Edit (RULINGS round 3): withdrawn or set, stamped, its line goes
    rows.push(row({ action: 'edit-count', value: l.litter + '|' + l.id, title: 'pointer.wrong_count' }));
    // round 4: a counted gain owes nothing new — the litter's recorded treatments stand; the worker checks on the pig
    var g = l.kind === 'gain' ? L(l.litter).unexplained.gains.filter(function (x) { return x.id === l.id; })[0] : null;
    var note = g && g.check ? 'pp.count.line.check' : l.review ? 'pp.count.review.line' : '';
    return '<section class="ct-group">' +
      UI.heading({ title: '', description: '', kind: 'section', level: 3, strs: { title: t.id, description: st.id }, args: { title: t.args, description: st.args } }) +
      (note ? UI.heading({ title: '', kind: 'panel', level: 4, strs: { title: note } }) : '') + UI.rowGroup(rows.join('')) + '</section>';
  }
  function explainPage(inert) {
    var x = explain(), sub = { lp: np(x.openLoss), gp: np(x.openGain) };
    var title = S.room ? s('pp.count.ex.title_room', { u: S.room }) : s('pp.count.ex.title', { code: crate });
    // R1-8: a body found loose in the room — say whose missing piglet it is (the dead drawer lists the unit's open losses)
    var found = S.room && x.openLoss ? UI.rowGroup(row({ action: 'found-body', value: String(S.room), title: 'pp.count.ex.found', desc: 'pp.count.ex.found_desc' })) : '';
    var body = receiptLine() + (S.room ? '' : heldRow()) + found + (x.lines.length ? x.lines.map(function (l) { return lineSection(l, !!S.room); }).join('')
      : UI.heading({ title: '', kind: 'panel', level: 4, strs: { title: 'pp.count.ex.empty' } }));
    return K.page({ inert: !!inert, title: title, description: s('pp.count.ex.sub', sub), body: '<div class="ct-body">' + body + '</div>', footer: K.footer({ back: { action: 'back' } }) });
  }
  /* The suggestion, side by side: both counts (who, when, where), what saving it as a Move closes and leaves open, and the door
     to the Move sheet. A suggestion is never proof; nothing pairs until the worker saves the Move. */
  function lineOf(id) {
    var out = null;
    [explain(), store.select.explain(store.derived, {}, {})].forEach(function (x) { x.lines.forEach(function (a) { if (!out && a.id === id) out = a; }); });
    return out;
  }
  function suggestion() {
    var l = lineOf(S.line), sg = null;
    if (l) l.suggestions.forEach(function (b) { if (b.id === S.pick) sg = b; });
    return l && sg ? { l: l, s: sg } : null;
  }
  function moveOf(sg) { return sg.pickFrom ? Object.assign({}, sg.move, { rows: S.pickRows.slice() }) : sg.move; }
  function suggestSheet() {
    var p = suggestion();
    if (!p) { S.view = 'explain'; return ''; }
    var l = p.l, sg = p.s, m = moveOf(sg), loss = l.kind === 'loss' ? l : sg, gain = l.kind === 'loss' ? sg : l;
    var picked = !sg.pickFrom || S.pickRows.length === m.n;
    // before the pick, the figures are the replay's with the first named rows (Alive after does not depend on which)
    var mv = store.select.moveDraft(store.derived, picked ? m : Object.assign({}, m, { rows: sg.pickFrom.slice(0, m.n) }), { who: window.PPFixtures.ME });
    var cross = loss.room !== gain.room;
    var side = function (y, kind) {
      return fact(cross ? 'pp.count.sg.side_unit' : 'pp.count.sg.side', { code: y.litter, u: y.room },
        'pp.count.line.' + kind, { np: np(y.open) }, 'pp.count.sg.stamp', { op: np(y.observed), stamp: stamp(y.at, y.who) }, kind === 'loss' ? 'red' : 'blue');
    };
    var t = (l.kind === 'loss' ? 'pp.count.sug.gained' : 'pp.count.sug.lost') + (sg.room !== l.room ? '_unit' : '');
    var body = UI.facts([side(loss, 'loss'), side(gain, 'gain')], { columns: 2 }) +
      UI.heading({ title: '', description: '', kind: 'panel', level: 4, strs: { title: 'pp.count.sg.if', description: 'pp.count.sg.alive' },
        args: { title: { np: np(m.n), effect: effect(sg) }, description: { a: m.from, xp: mv.delta ? np(mv.delta.from[1]) : '', b: m.to, yp: mv.delta ? np(mv.delta.to[1]) : '' } } });
    // more named missing piglets than the Move carries: the worker picks which (never the app)
    if (sg.pickFrom) {
      var rows = L(loss.litter).identity.rows;
      body += '<section class="ct-group" data-target="pick">' + UI.heading({ title: '', kind: 'group', level: 3, strs: { title: pl('pp.count.sg.pick', m.n) }, args: { title: { n: m.n, code: loss.litter } } }) +
        UI.choiceGroup(sg.pickFrom.map(function (id) {
          var r = rows.filter(function (x) { return x.rowId === id; })[0] || { tag: id }, lb = rowLabel(r);
          return UI.choiceRow({ label: '', mode: 'multi', action: 'pick-named', value: id, selected: S.pickRows.indexOf(id) >= 0, strs: { label: lb.id }, args: { label: lb.args } });
        })) + '</section>';
    }
    var why = picked ? null : { id: pl('pp.count.why.pick', m.n), args: { n: m.n } };
    return K.drawer({ size: 'long', view: 'suggest', title: s(t, { code: sg.litter, np: np(sg.open), u: sg.room }), subtitle: [s('pp.count.sg.sub')], close: { action: 'dismiss' },
      body: '<div class="ct-body">' + body + '</div>',
      footer: saveFooter(why, !picked || !mv.event, 'open-move', 'pp.count.sg.move', { n: m.n, from: m.from, to: m.to }), scrim: { action: 'dismiss' } });
  }

  function behind() {
    var src = PP.href('room.html', { state: 'room', unit: L() && L().room !== 7 ? L().room : '', data: store.name !== 'base' ? store.name : '' });
    return '<iframe class="ct-behind" src="' + U.esc(src) + '" title="" aria-hidden="true" tabindex="-1" inert></iframe>';
  }
  function render() {
    var html, over = '';
    if (S.view === 'count') {
      var w = draft().why;
      html = w === 'farrowing_open' || w === 'weaned' ? refusedSheet(w) : S.sub === 'roster' ? rosterView(draft()) : countSheet();
      if (S.sub === 'held') over = heldDialog();
    }
    else if (S.view === 'explain') { html = explainPage(); if (S.sub === 'held') over = heldDialog(); }
    else if (S.view === 'suggest') { var dr = suggestSheet(); html = dr ? explainPage(true) + dr : explainPage(); }
    if (over) html = '<div inert>' + html + '</div>' + over;
    var root = document.getElementById('screen');
    var body = root.querySelector('.tk-sheet .tk-sheet-body, .tk-page .tk-page-body'), top = body ? body.scrollTop : 0, view = S.view + ':' + S.sub;
    // the phone and the room behind are drawn once and stay (an iframe reloads when re-inserted); the sheets re-render
    if (!root.querySelector('#ct-over')) root.innerHTML = K.phone('<div id="ct-over" class="ct-over"></div>', { bar: false, label: s('pp.count.title') });
    if (S.view !== 'explain' && !root.querySelector('.ct-behind')) root.querySelector('#ct-over').insertAdjacentHTML('beforebegin', behind());
    root.querySelector('#ct-over').innerHTML = html;
    PP.apply(root);
    UI.liveFill(root, { then: function (el) { PP.apply(el); } });      // live regions mount empty, then fill (Status)
    var nb = root.querySelector('.tk-sheet .tk-sheet-body, .tk-page .tk-page-body'); if (nb && view === S.lastView) nb.scrollTop = top;
    S.lastView = view;
  }

  /* ---- acts ---- */
  // The variant always travels (`data=base` too): a page whose state names its own variant must not fall back to it.
  function nav(page, params) { location.href = PP.href(page, Object.assign({ data: store.name }, params)); }
  function here() { return location.pathname + location.search; }
  // the way back to Explain (the dead drawer returns here, with its receipt), for the room or a litter
  function backHere() {
    return PP.href('count.html', S.room ? { state: 'explain', unit: S.room, data: store.name } : { state: 'explain', crate: crate, unit: qs.get('unit'), data: store.name });
  }
  function openCount(c) {
    if (c && c !== crate) { nav('count.html', { state: 'count', crate: c }); return; }
    var k = keptDraft();
    S.rows = k ? k.rows.slice() : []; S.at = k ? k.at : null; S.obsMs = k ? k.obsMs : 0; S.seen = k ? k.seen : null;
    S.failed = false; S.view = 'count'; S.sub = ''; S.receipt = null; S.deadRcpt = null; S.sure = null;
    S.observed = k ? k.observed : draft().base;
  }
  // any change to the count is a fresh observation: its time (the stamp Save writes; this phone's clock for staleness)
  // and the counts this phone had at that moment
  function touch() { S.at = store.now(); S.obsMs = Date.now(); S.seen = countIds(); S.failed = false; S.sure = null; }
  function save() {
    var d = draft();
    if (!d.event) return false;
    var r = store.commit(Object.assign({}, d.event, { at: S.at || store.now() }));
    if (!r.ok) { S.failed = true; return false; }
    try { sessionStorage.setItem('pp-receipt:count', JSON.stringify({ parts: receiptParts(d.kind, d.diff), litter: crate, event: r.event.id })); } catch (e) {}
    dropDraft(); S.rows = []; S.at = null; lastTap = Date.now();
    return true;
  }
  function back() {
    if (S.sub) { var from = S.sub; S.sub = ''; S.focus = '[data-action="sub"][data-value="' + from + '"]'; return; }
    if (S.view === 'count') keepDraft();
    if (S.view === 'suggest') { S.view = 'explain'; return; }
    if (S.view === 'explain' && S.room) { nav('room.html', { state: 'room', unit: S.room !== 7 ? S.room : '' }); return 'nav'; }
    toLitter('');
    return 'nav';
  }
  // the litter drawer over the room: where Set count and Explain were opened (with `saved=count`, the count's receipt)
  function toLitter(saved) { nav('room.html', { state: 'litter', crate: crate, unit: qs.get('unit'), saved: saved }); }
  function goTo(target) {
    var t = document.querySelector('[data-target="' + target + '"]');
    if (t) { t.scrollIntoView({ block: 'center' }); var f = t.querySelector('input, button'); if (f) f.focus({ preventScroll: true }); }
  }
  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    // a double tap after Save lands nowhere — except on stepper keys, where a double tap is two steps
    if (Date.now() - lastTap < 400 && !(b && b.dataset.action === 'step')) return;
    if (!b) return;
    var a = b.dataset.action, v = b.dataset.value;
    if (a === 'dismiss' || a === 'sub-dismiss') a = 'back';                    // the ✕ and the scrim are Back
    if (a === 'sub-back') a = 'back';
    if (a === 'pick-row' || a === 'pick-named') v = b.value;
    if (a === 'step') {
      if (b.getAttribute('aria-disabled') === 'true') return;
      S.observed = Math.max(0, S.observed + (+b.dataset.step)); touch();
      if (S.observed >= draft().base) S.rows = [];                               // nothing missing: no tagged piglet to name
      keepDraft();
    }
    else if (a === 'pick-row') { var i = S.rows.indexOf(v); if (i >= 0) S.rows.splice(i, 1); else S.rows.push(v); touch(); keepDraft(); }
    else if (a === 'clear') { dropDraft(); S.observed = draft().base; S.rows = []; S.at = null; S.obsMs = 0; S.seen = null; S.failed = false; }
    else if (a === 'save') {
      // a waiting Save answers the tap (the reason flashes and re-announces) and points at the step
      if (UI.guard(b)) {
        var dw = draft();
        if (dw.why === 'name_the_rows' || dw.why === 'too_many_rows') { if (S.sub !== 'roster') { S.sub = 'roster'; render(); } goTo('roster-list'); }
        else if (sanity(dw) === 'zero') { if (S.sub) { S.sub = ''; render(); } goTo('zero'); }
        return;
      }
      if (save()) { toLitter('count'); return; }
    }
    else if (a === 'back') { if (back() === 'nav') return; }
    else if (a === 'sub') { S.sub = v; }
    else if (a === 'open-count') openCount(v);
    else if (a === 'suggest') { var p = v.split('|'); S.line = p[0]; S.pick = p[1]; S.pickRows = []; S.view = 'suggest'; }
    else if (a === 'pick-named') {
      var sgn = suggestion(), j = S.pickRows.indexOf(v);
      if (j >= 0) S.pickRows.splice(j, 1); else if (sgn && S.pickRows.length < sgn.s.move.n) S.pickRows.push(v);
    }
    else if (a === 'more') { S.more[v] = true; }
    else if (a === 'edit-count') { var ec = v.split('|'); nav('edit.html', { state: 'edit', crate: ec[0], count: ec[1], from: 'count' }); return; }
    else if (a === 'held-pick') { S.heldPick = v; }
    else if (a === 'resolve') {
      if (UI.guard(b) || !v) return;
      S.heldPick = '';
      var rv = v.split('|'), r = store.commit({ type: 'resolve', litter: crate, held: rv[0], answer: rv[1] });
      if (!r.ok) S.failed = true;
      S.sub = '';
    }
    else if (a === 'open-dead') { nav('dead.html', { state: 'dead', crate: v || crate, unit: qs.get('unit'), back: backHere() }); return; }
    else if (a === 'found-body') { nav('dead.html', { state: 'dead-found', unit: v, back: backHere() }); return; }
    else if (a === 'sure') { S.sure = S.observed; }
    else if (a === 'move-in') {
      var gl = lineOf(v); if (!gl) return;
      nav('move.html', { state: 'move', crate: gl.litter, dir: 'in', n: gl.open, explains: ',' + gl.id }); return;
    }
    else if (a === 'open-move' && S.view === 'suggest') {
      var sg = suggestion(); if (!sg) return;
      if (UI.guard(b)) { if (sg.s.pickFrom) goTo('pick'); return; }
      var m = moveOf(sg.s);
      nav('move.html', { state: 'move-explain', crate: m.from, other: m.to, n: m.n, rows: m.rows.join(','), explains: m.explains.join(',') });
      return;
    }
    else if (a === 'open-move') { nav('move.html', { state: 'move', crate: v || crate }); return; }
    else if (a === 'open-farrowing') {
      // the hand-off carries its context: the crate, the sow, the state, the language, and the way back here
      location.href = '/ux/system/farrowing-astra-concept.html?' + new URLSearchParams({ state: 'farrowing', unit: L().room, crate: crate, sow: sow().sow, back: here() }).toString() + (PP.lang === 'zh' ? '&lang=zh' : '');
      return;
    }
    else { document.documentElement.setAttribute('data-door', a + ':' + (v || '')); return; }
    render();
    if (S.focus) { var f = document.querySelector(S.focus); S.focus = ''; if (f) f.focus({ preventScroll: true }); }
  });
  // Swipe down on a sheet's grab or head = Back.
  var grab = null;
  document.getElementById('screen').addEventListener('pointerdown', function (ev) { if (ev.target.closest('.tk-grab, .tk-sheet-head')) grab = ev.clientY; }, true);
  document.getElementById('screen').addEventListener('pointerup', function (ev) {
    if (grab != null && ev.clientY - grab > 100) { if (back() !== 'nav') render(); }
    grab = null;
  }, true);

  PP.ready.then(function () {
    store = PP.open(spec.data || 'base', spec.dead ? { session: false } : null);
    TODAY = store.today;                   // the clock is the store's (R1-15): store.now() advances with every record
    crate = qs.get('crate') || spec.crate || '';
    var room = +(qs.get('unit') || spec.room || 0);
    S = { view: spec.view, sub: '', observed: 0, rows: [], at: null, obsMs: 0, seen: null, pickRows: [], failed: false, receipt: null, deadRcpt: null, sure: null, more: {},
      room: spec.view === 'explain' && !qs.get('crate') ? room : 0, line: spec.line || '', pick: spec.pick || '', focus: '', lastView: '' };
    if (!L()) crate = 'A02';
    if (spec.kept) {
      var kk = spec.kept, kd = { observed: kk.observed, rows: kk.rows || [], at: kk.at, obsMs: Date.now() - (kk.ageMin || 0) * 60000, seen: kk.seen || countIds() };
      if (mem) mem.d = kd; else try { sessionStorage.setItem(DKEY(), JSON.stringify(kd)); } catch (e) {}
    }
    // a state of the litter's counts: the litter drawer shows them (after what the state records: a kept draft, a Save)
    if (spec.view === 'litter') {
      var saved = '';
      if (spec.save != null) { openCount(); S.observed = spec.save; touch(); if (save()) saved = 'count'; }
      location.replace(PP.href('room.html', { state: 'litter', crate: crate, unit: qs.get('unit'), data: store.name, saved: saved }));
      return;
    }
    if (S.view === 'count') {
      openCount();
      if (spec.observed != null) { S.observed = spec.observed; touch(); }
      if (spec.rows) S.rows = spec.rows.slice();
    }
    if (spec.sub) S.sub = spec.sub;
    // back from the dead drawer (Save): its receipt, handed over on this phone
    if (qs.get('saved') === 'dead') {
      try { var hr = JSON.parse(sessionStorage.getItem('pp-receipt:dead') || 'null'); sessionStorage.removeItem('pp-receipt:dead'); if (hr) S.deadRcpt = hr.parts; } catch (e) {}
      lastTap = Date.now();
    }
    if (spec.dead) {
      var dr = store.commit({ type: 'death', litter: crate, lines: spec.dead.lines, fromMissing: spec.dead.fromMissing });
      if (dr.ok) S.deadRcpt = [{ id: 'receipt.saved' }].concat(spec.dead.lines.map(function (l) { return { id: 'ds.dead.receipt.line', args: { n: l.n, cause: PP.t('dead.' + l.cause) }, tone: 'green' }; }))
        .concat(L().unexplained.openLoss ? [{ id: 'ds.dead.receipt.missing', args: { n: L().unexplained.openLoss } }] : [{ id: 'pp.dead.rcpt.all_found' }]);
    }
    render();
    // staleness is read from this phone's clock at every check: re-check while the drawer is open
    setInterval(function () { if (S.view === 'count') render(); }, 30000);
    UI.radioBind(document.getElementById('screen'), { onChange: function (field, value) { if (field === 'held') { S.heldPick = value; render(); } } });
  });
})();
</script>
</body>
</html>
