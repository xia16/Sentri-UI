<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set count</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css. The page draws cards (ADR 0002 adopted: Button's waiting face with its reason
   line and guard, Button's text register, Status lines for the receipt), the shared header and tools (shell-ui.js) and
   the Stepper's hero variant. */
.ct-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.ct-phone .scrim { inset: 0; }
.ct-body { display: flex; flex-direction: column; gap: var(--space-section); padding-bottom: var(--space-panel); }
.ct-body > * { margin: 0; }
.ct-group { display: flex; flex-direction: column; gap: var(--space-heading); }
.ct-group > * { margin: 0; }
.ct-head { display: flex; align-items: flex-start; gap: var(--space-footer-gap); }
.ct-head > .st-text-action { min-width: var(--touch-min); justify-content: flex-end; }
.ct-phone .sheet[data-st-context="drawer"] > .sheet-body { flex: 1; }
.ct-bar { flex-wrap: wrap; row-gap: var(--space-row-y); }
.ct-bar > .st-status-line, .ct-bar > .st-button-reason { flex-basis: 100%; margin: 0; }
.ct-bar > .button { flex: 1; }
.ct-bar > .button.secondary:not(:only-of-type) { flex: none; }
</style>
</head>
<body>
<main class="inspection-phone ct-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, U = window.PPUI;

  /* ---- states: a variant of the shared fixture + UI state. Every figure is the ledger's: select.countDraft (the number seen,
     what Save writes — a count never closes a line, RULINGS round 3 — which tagged piglets must be named, why Save waits), select.explain
     (each open line, its death door and the Moves the app suggests, ranked, with what each leaves open), select.counts (the
     standing count, what each wrote, sync review) and select.moveDraft (alive after an explaining Move). Save commits through
     append. `save`: the state is the moment after Save (committed at load, not kept in the tab). ---- */
  var STATES = {
    'count':           { view: 'count', crate: 'A02' },
    'host':            { view: 'host', crate: 'A02' },
    // R1-27: a count far above Alive asks before it saves; 0 asks "moved or weaned?"; a kept 0 asks again (never a stale 0 ready)
    'count-high':      { view: 'count', crate: 'A02', observed: 42 },
    'count-zero':      { view: 'count', crate: 'A02', observed: 0 },
    'count-kept-zero': { view: 'count', crate: 'A02', kept: { observed: 0, rows: [], at: '2026-09-29T10:20', ageMin: 10 } },
    // R1-9: a count below Alive on a litter with tags may name which tagged piglets are missing (optional when untagged cover it)
    'count-name-optional': { view: 'count', crate: 'B06', observed: 11, rows: ['B06-r4'] },
    // R1-22: a held body is answered in the Set count drawer too, above the number
    'count-held':      { view: 'count', crate: 'A07', data: 'held-body' },
    // R1-20: a concurrent count that agrees net of a death its phone had not seen
    'count-agree':     { view: 'host', crate: 'A07', data: 'count-agree' },
    // round 4: a counted gain owes nothing new — "check on the pig"; a body never explains a gain
    'explain-gain':    { view: 'explain', crate: 'B08', data: 'explain' },
    // R1-26: back on Explain after a body found from its line: the dead drawer's receipt, `all missing found`
    'found-saved':     { view: 'explain', crate: 'D03', dead: { lines: [{ cause: 'crushed', n: 2 }], fromMissing: 2 } },
    'count-match':     { view: 'host', crate: 'A02', save: 12 },
    'count-loss':      { view: 'host', crate: 'A02', save: 10 },
    'count-gain':      { view: 'host', crate: 'A02', save: 13 },
    'count-recount':   { view: 'count', crate: 'D03', observed: 13 },
    'count-named':     { view: 'count', crate: 'B06', observed: 8 },
    'count-kept':      { view: 'host', crate: 'A02', kept: { observed: 10, rows: [], at: '2026-09-29T06:00', ageMin: 270 } },
    'count-kept-newer': { view: 'count', crate: 'A02', data: 'drift', kept: { observed: 10, rows: [], at: '2026-09-29T08:50', ageMin: 20, seen: [] } },
    'count-prelock':   { view: 'count', crate: 'D01' },
    'count-weaned':    { view: 'count', crate: 'D02' },
    'count-ended':     { view: 'count', crate: 'A02', data: 'ended' },
    'count-conflict':  { view: 'host', crate: 'A07', data: 'count-offline' },
    'explain':         { view: 'explain', crate: 'B06', data: 'explain' },
    'explain-suggest': { view: 'suggest', crate: 'B06', data: 'explain', line: 'C-B06-loss', pick: 'C-B08-gain' },
    'explain-pick':    { view: 'suggest', crate: 'B06', data: 'explain-named', line: 'C-B06-named', pick: 'C-B08-gain' },
    'explain-open':    { view: 'explain', crate: 'D03' },
    'explain-room':    { view: 'explain', room: 7, data: 'explain' },
    // RULINGS round 3: the same body recorded twice is held for review until a worker answers one body or two
    'held-body':       { view: 'host', crate: 'A07', data: 'held-body' }
  };
  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'count';
  var spec = JSON.parse(JSON.stringify(STATES[name]));
  var STALE_MIN = 90;                     // a kept count older than a visit (RULINGS: ~90 minutes idle ends a visit) asks for a recount
  var store, TODAY, crate, S, lastTap = 0;

  /* ---- the ledger ---- */
  function L(c) { return store.derived.litters[c || crate]; }
  function sow(c) { return store.sow(c || crate) || { sow: '', parity: 0, unit: 7 }; }
  var memo = { key: '', val: null };
  function draft() {
    var d = { observed: S.observed, missingRows: S.rows.slice(), at: S.at }, key = JSON.stringify(d) + crate + store.events.length;
    if (memo.key !== key) memo = { key: key, val: store.select.countDraft(store.derived, crate, d, { who: window.PPFixtures.ME }) };
    return memo.val;
  }
  function explain() { return store.select.explain(store.derived, S.room ? { room: S.room } : { litter: crate }, { who: window.PPFixtures.ME }); }
  function dirty() { return S.observed !== draft().base || S.rows.length > 0; }
  function countIds() { return L().counts.map(function (c) { return c.id; }); }
  /* A kept count is stale when a newer count reached this phone after it was observed (same-device order: the counts it had
     seen, never clocks between devices), or when this phone's own clock, read now, says it is older than a visit. Once stale,
     Save waits until the count is touched again (a fresh observation). */
  function stale() {
    if (!S.at) return null;
    var newer = L().counts.filter(function (c) { return (S.seen || []).indexOf(c.id) < 0; });
    if (newer.length) return { kind: 'newer', c: newer[newer.length - 1] };
    if (Date.now() - (S.obsMs || 0) > STALE_MIN * 60000) return { kind: 'old' };
    return null;
  }

  /* ---- the draft stays on this phone with its observation time and the counts it had seen, saved on every change
     (sessionStorage); a state that shows a kept draft holds it in memory only ---- */
  var DKEY = function () { return 'pp-count-draft:' + store.name + ':' + crate; };
  var mem = spec.kept ? { d: null } : null;
  function keepDraft() {
    var d = dirty() ? { observed: S.observed, rows: S.rows.slice(), at: S.at, obsMs: S.obsMs, seen: S.seen } : null;
    if (mem) { mem.d = d; return; }
    try { if (d) sessionStorage.setItem(DKEY(), JSON.stringify(d)); else sessionStorage.removeItem(DKEY()); } catch (e) {}
  }
  function keptDraft() { if (mem) return mem.d; try { return JSON.parse(sessionStorage.getItem(DKEY()) || 'null'); } catch (e) { return null; } }
  function dropDraft() { if (mem) { mem.d = null; return; } try { sessionStorage.removeItem(DKEY()); } catch (e) {} }

  /* ---- helpers ---- */
  var pl = PP.one;
  function span(id, args, o) { return U.span(id, args, o); }
  function np(n) { return PP.tn('pp.common.unit.piglet', n); }            // `12 piglets` · `12头`
  function pigs(n) { return { id: pl('pp.common.unit.piglet', n), args: { n: n } }; }
  function stamp(at, who) { return U.stamp(at, who, TODAY); }
  function when(at) { return String(at).slice(0, 10) === String(TODAY).slice(0, 10) ? U.time(at) : U.date(at) + ' · ' + U.time(at); }
  function fact(label, labelArgs, value, valueArgs, meta, metaArgs, tone) {
    var f = { label: '', strs: { label: label }, args: { label: labelArgs } };
    if (tone) f.valueHtml = span(value, valueArgs, { tone: tone }); else { f.value = ''; f.strs.value = value; f.args.value = valueArgs; }
    if (meta) { f.meta = ''; f.strs.meta = meta; f.args.meta = metaArgs; }
    return f;
  }
  function row(o) {
    var strs = { title: o.title }, args = { title: o.titleArgs };
    if (o.desc) { strs.description = o.desc; args.description = o.descArgs; }
    if (o.trail) { strs.trailing = o.trail; args.trailing = o.trailArgs; }
    return UI.row({ title: '', description: o.desc ? '' : undefined, trailing: o.trail ? '' : undefined, action: o.action, value: o.value, wrap: !!o.wrap, strs: strs, args: args });
  }
  function button(cls, action, id, args, quiet) {
    return '<button type="button" class="button ' + cls + '" data-ds="Button" data-action="' + action + '" data-str="' + id + '"' +
      (args ? " data-args='" + U.esc(JSON.stringify(args)) + "'" : '') + (quiet ? ' aria-disabled="true"' : '') + '>' + U.esc(PP.t(id, args)) + '</button>';
  }
  function textAction(action, id) { return UI.button({ label: PP.t(id), register: 'text', action: action, strs: { label: id } }); }
  // Save, and the reason it waits (Button's waiting face, ADR 0002): present, quiet, focusable; a tap is answered by guard()
  function saveBar(p, waiting, action, id, args) {
    var reason = UI.buttonReason({ id: 'ct-why', text: p ? PP.t(p.id, p.args) : '', strs: p ? { text: p.id } : undefined, args: p && p.args ? { text: p.args } : undefined,
      actions: p && p.act ? [{ label: PP.t(p.act.id, p.act.args), action: p.act.action, value: String(S.observed), strs: { label: p.act.id }, args: p.act.args ? { label: p.act.args } : undefined }] : [] });
    return reason + button('secondary', 'back', 'act.back') +
      UI.button({ label: PP.t(id || 'act.save', args), register: 'primary', action: action || 'save', waiting: waiting, describedby: 'ct-why', strs: { label: id || 'act.save' }, args: args ? { label: args } : undefined });
  }
  function rowLabel(r) { return r.tag ? { id: 'pp.count.row.tag', args: { tag: r.tag } } : { id: 'pp.count.row.notch', args: { notch: r.notch } }; }
  function eventOf(id) { return store.events.filter(function (e) { return e.id === id; })[0] || null; }
  function lineTitle(l, withCode) {
    var base = 'pp.count.line.' + l.kind + (l.open < l.qty ? '_part' : '') + (withCode ? '_code' : '');
    return { id: base, args: { np: np(l.open), qp: np(l.qty), code: l.litter } };
  }
  // the base the difference was taken from (no count replaces another: RULINGS round 3)
  function lineStamp(l) {
    return { id: 'pp.count.line.stamp', args: { op: np(l.observed), stamp: stamp(l.at, l.who), wp: np(l.sizedAgainst) } };
  }

  /* ---- the litter host: the shared header, the ledger's figures, the tools, the open line and the counts ---- */
  function hostHead() {
    var x = L();
    var sub = x.phase === 'open' ? span('pp.count.host.sub_farrowing', { u: x.room }) : span('pp.count.host.sub', { u: x.room, day: x.dayAge });
    return U.litterHeader({ crate: crate, sow: sow().sow, parity: sow().parity, sub: sub });
  }
  function hostFacts() {
    var x = L(), items = [];
    if (x.phase === 'locked') items.push(fact('label.born', null, pigs(x.born).id, pigs(x.born).args));
    items.push(fact('label.alive', null, pigs(x.alive).id, pigs(x.alive).args));
    items.push(fact('label.dead', null, pigs(x.dead.total).id, pigs(x.dead.total).args));
    return UI.facts(items, { columns: items.length });
  }
  // A kept draft shows its age: the observation it holds, when it was counted, and what the record says now.
  function keptRow() {
    var k = keptDraft();
    if (!k) return '';
    return UI.rowGroup(row({ action: 'open-count', value: crate, title: 'pp.count.kept.title', titleArgs: { np: np(k.observed) },
      desc: 'pp.count.kept.desc', descArgs: { t: when(k.at), rp: np(L().alive) } }));
  }
  // One open line opens its doors right here; several lead to Explain.
  function openSection() {
    var lines = explain0();
    if (!lines.length) return '';
    var head = UI.heading({ title: '', description: '', kind: 'section', level: 3, strs: { title: 'pp.count.open.title', description: 'pp.count.open.desc' } });
    if (lines.length === 1) return '<section class="ct-group">' + head + '</section>' + lineSection(lines[0], false);
    var rows = lines.map(function (l) {
      var t = lineTitle(l), s = lineStamp(l);
      return row({ action: 'open-explain', value: crate, title: t.id, titleArgs: t.args, desc: s.id, descArgs: s.args, trail: 'pp.count.act.explain' });
    }).join('');
    return '<section class="ct-group">' + head + UI.rowGroup(rows) + '</section>';
  }
  function explain0() { return store.select.explain(store.derived, { litter: crate }, { who: window.PPFixtures.ME }).lines; }
  // The counts on this litter, newest first: each an observation with who and when; the one that stands says so.
  function countsSection() {
    var c = store.select.counts(store.derived, crate);
    if (!c || !c.counts.length) return '';
    var list = c.counts.slice().reverse();
    var facts = UI.facts(list.slice(0, 3).map(function (k) {
      var ev = eventOf(k.id) || {}, rest;
      if (k.late) rest = PP.t('pp.count.c.late');
      else if (k.disputed && !k.settledBy) rest = PP.t('pp.count.c.disputed');
      else if (k.crossed.length) rest = PP.t('pp.count.c.phone', { who: k.who, bp: np(k.baseAlive) });
      // R1-20: two counts that saw the same crate, net of a change one phone had not seen: one observation, nothing to settle
      else if (k.agreesNet) rest = PP.t('pp.count.c.agrees', { who: (eventOf(k.agreesWith[0]) || {}).who || '' });
      else if (k.wrote < 0) rest = PP.t('pp.count.c.loss', { kp: np(-k.wrote) });
      else if (k.wrote > 0) rest = PP.t('pp.count.c.gain', { kp: np(k.wrote) });
      else rest = PP.t('pp.count.c.match');
      var by = k.supersededBy ? eventOf(k.supersededBy) : null;
      var meta = k.stands ? ['pp.count.c.stands', { rest: rest }] : by ? ['pp.count.c.replaced', { t: when(by.at), rest: rest }] : ['pp.count.c.plain', { rest: rest }];
      return fact(ev.syncedAt ? 'pp.count.c.label_synced' : 'pp.count.c.label', { stamp: stamp(k.at, k.who), t: ev.syncedAt ? U.time(ev.syncedAt) : '' },
        pigs(k.observed).id, pigs(k.observed).args, meta[0], meta[1]);
    }), { columns: 1 });
    var out = '<section class="ct-group">' + UI.heading({ title: '', kind: 'section', level: 3, strs: { title: 'pp.count.c.title' } }) + facts;
    if (c.conflict) {
      // two counts disagree (neither saw the other): neither stands until a count that saw both
      var list = c.counts.filter(function (k) { return c.disputed.indexOf(k.id) >= 0; })
        .map(function (k) { return PP.t('pp.count.review.one', { who: k.who, np: np(k.observed) }); }).join(' · ');
      out += UI.heading({ title: '', description: '', kind: 'panel', level: 4, strs: { title: 'pp.count.review.conflict', description: 'pp.count.review.conflict_desc' }, args: { description: { list: list } } }) +
        UI.rowGroup(row({ action: 'open-count', value: crate, title: 'pp.count.review.again', titleArgs: { code: crate }, desc: 'pp.count.review.conflict_again' }));
    } else if (c.review) {
      var st = c.counts.filter(function (k) { return k.stands; })[0];
      var desc, dargs = { np: np(st.observed) };
      if (st.crossed.length) {
        var x = eventOf(st.crossed[0]) || {};
        desc = x.type === 'move' ? 'pp.count.review.move' : x.type === 'weaned' ? 'pp.count.review.weaned' : 'pp.count.review.death';
        dargs.who = st.who; dargs.t = U.time(x.at || st.at); dargs.by = x.who || '';
      } else {
        var o = eventOf(st.order[0]) || {};
        desc = 'pp.count.review.order'; dargs.who = o.who || ''; dargs.t = U.time(o.at || st.at);
      }
      out += UI.heading({ title: '', description: '', kind: 'panel', level: 4, strs: { title: 'pp.count.review.title', description: desc }, args: { description: dargs } }) +
        UI.rowGroup(row({ action: 'open-count', value: crate, title: 'pp.count.review.again', titleArgs: { code: crate }, desc: 'pp.count.review.again_desc' }));
    }
    return out + '</section>';
  }
  /* The receipt owns the change this Save made (Status line, ADR 0002): colour sits on the numeral only (the totals stay
     in the record). A body saved from this page's doors comes back with the dead drawer's own receipt. */
  function tok(id, args, tone) { return { text: PP.t(id, args), strs: { text: id }, args: args ? { text: args } : undefined, tone: tone || '' }; }
  function receiptLine() {
    if (S.deadRcpt) return UI.statusLine(S.deadRcpt.map(function (p) { return tok(p.id, p.args, p.tone); }), { live: true, id: 'ct-receipt' });
    var r = S.receipt;
    if (!r) return '';
    var n = Math.abs(r.diff), toks = [tok('receipt.saved')];
    function part(id, tone) { return [tok(id), tok('pp.count.rcpt.n', { n: n }, tone), tok(pl('pp.count.rcpt.unit', n))]; }
    if (r.kind === 'loss') toks.push(part('pp.count.rcpt.loss', 'red'));
    else if (r.kind === 'gain') { toks.push(part('pp.count.rcpt.gain', 'progress')); toks.push(tok('pp.count.rcpt.check')); }
    else toks.push(tok('pp.count.rcpt.match'));
    return UI.statusLine(toks, { live: true, sep: 'dot', tight: PP.lang === 'zh', id: 'ct-receipt' });
  }
  /* The same body recorded twice (RULINGS round 3): the second allocation of one missing piglet is held — Dead and
     Alive stay — until a worker answers one body (the duplicate is withdrawn) or two (a second death). */
  function heldSection() {
    var x = L(), held = (x.held || []).filter(function (h) { return !h.resolved; });
    if (!held.length) return '';
    return held.map(function (h) {
      var first = null;
      x.deaths.forEach(function (d) { if (!first && d.id !== h.event && d.fromMissing > 0) first = d; });
      var ev = eventOf(h.event) || {};
      var head = UI.heading({ title: '', description: '', kind: 'panel', level: 4, strs: { title: 'pp.count.held.title', description: 'pp.count.held.desc' },
        args: { description: { a: first ? first.who : '', b: h.who, t: U.time(ev.syncedAt || h.at), dp: np(x.dead.total), ap: np(x.alive) } } });
      var rows = row({ action: 'resolve', value: h.event + '|one', title: 'pp.count.held.one', desc: 'pp.count.held.one_meta', descArgs: { ap: np(x.alive) }, wrap: true }) +
        row({ action: 'resolve', value: h.event + '|two', title: 'pp.count.held.two', desc: 'pp.count.held.two_meta', descArgs: { ap: np(Math.max(0, x.alive - h.n)) }, wrap: true });
      return '<section class="ct-group" data-ds="Candidate:HeldBody">' + head + UI.rowGroup(rows) + '</section>';
    }).join('');
  }
  function hostHtml(inert) {
    var c = store.select.counts(store.derived, crate);
    // a held body or a count under sync review leads: the next act is to answer it, or to count again
    var body = hostFacts() + U.tools(crate) + keptRow() + heldSection() + (c && c.review ? countsSection() + openSection() : openSection() + countsSection());
    return '<section class="sheet" data-ds="Sheet" data-presentation="page"' + (inert ? ' inert' : '') + '>' + hostHead() +
      '<div class="sheet-body"><div class="ct-body">' + body + '</div></div>' +
      '<footer class="sheet-footer ct-bar">' + receiptLine() + button('secondary', 'back', 'act.back') + '</footer></section>';
  }

  /* ---- the Set count drawer: a staged assertion (Back keeps the draft, Clear discards it, Save writes one stamped count) ---- */
  function hint(d) {
    if (d.kind === 'match') return { id: 'pp.count.hint.match' };
    return { id: 'pp.count.hint.' + d.kind, args: { k: Math.abs(d.diff), kp: np(Math.abs(d.diff)) } };
  }
  // R1-9: below Alive on a litter with tags, the count may name which tagged piglets are missing — required only when the
  // untagged cannot cover the difference; a named piglet's body later closes its own line
  function rosterSection(d) {
    if (!d.roster.length || (d.kind !== 'loss' && !S.rows.length)) return '';
    var must = d.needRows > 0;
    var h = UI.heading({ title: '', description: '', kind: 'section', level: 3,
      strs: { title: must ? pl('pp.count.named.title', d.needRows) : 'pp.count.named.title_opt', description: must ? pl('pp.count.named.desc', d.needRows) : 'pp.count.named.desc_opt' },
      args: { description: { up: np(d.untagged), kp: np(d.maxRows), n: d.needRows } } });
    var rows = UI.choiceGroup(d.roster.map(function (r) {
      var l = rowLabel(r);
      return UI.choiceRow({ label: '', mode: 'multi', action: 'pick-row', value: r.rowId, selected: S.rows.indexOf(r.rowId) >= 0, mono: true, strs: { label: l.id }, args: { label: l.args } });
    }));
    return '<section class="ct-group" data-target="roster">' + h + rows + '</section>';
  }
  function pointer(d) {
    if (S.failed) return { id: 'pp.count.why.failed' };
    var st = stale();
    if (st && st.kind === 'newer') return { id: 'pp.count.why.newer', args: { who: st.c.who, np: np(st.c.observed), t: when(st.c.at) } };
    if (st) return { id: 'pp.count.why.stale', args: { t: when(S.at) } };
    if (d.why === 'name_the_rows') return { id: pl('pp.count.why.rows', d.needRows - d.picked.length), args: { n: d.needRows - d.picked.length } };
    if (d.why === 'too_many_rows') return { id: pl('pp.count.why.too_many', d.maxRows), args: { n: d.maxRows } };
    if (d.why) return { id: 'pp.count.why.check' };
    var ask = sanity(d);
    if (ask === 'zero') return { id: 'pp.count.why.zero', args: { ap: np(d.base) }, act: { action: 'sure', id: 'pp.count.zero.yes' } };

    }
    if (spec.dead) {
      var dr = store.commit({ type: 'death', litter: crate, lines: spec.dead.lines, fromMissing: spec.dead.fromMissing });
      if (dr.ok) S.deadRcpt = [{ id: 'receipt.saved' }].concat(spec.dead.lines.map(function (l) { return { id: 'ds.dead.receipt.line', args: { n: l.n, cause: PP.t('dead.' + l.cause) }, tone: 'green' }; }))
        .concat(L().unexplained.openLoss ? [{ id: 'ds.dead.receipt.missing', args: { n: L().unexplained.openLoss } }] : [{ id: 'pp.dead.rcpt.all_found' }]);
    }
    if (spec.save != null) { openCount(); S.observed = spec.save; touch(); save(); lastTap = 0; }
    render();
    // staleness is read from this phone's clock at every check: re-check while the drawer is open
    setInterval(function () { if (S.view === 'count') render(); }, 30000);
  });
})();
</script>
