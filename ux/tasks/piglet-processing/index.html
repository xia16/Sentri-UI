<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piglet processing</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<main class="phone inspection-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script>
(function () {
  var UI = window.SentriUI;
  var rows = [
    UI.row({ title: '', action: 'open', value: 'room', strs: { title: 'pp.room.title' } }),
    UI.row({ title: '', action: 'open', value: 'litter', strs: { title: 'pp.litter.title' } }),
    UI.row({ title: '', action: 'open', value: 'bulk', strs: { title: 'pp.bulk.title' } }),
    UI.row({ title: '', action: 'open', value: 'id', strs: { title: 'pp.id.title' } }),
    UI.row({ title: '', action: 'open', value: 'dead', strs: { title: 'pp.dead.title' } }),
    UI.row({ title: '', action: 'open', value: 'count', strs: { title: 'pp.count.title' } }),
    UI.row({ title: '', action: 'open', value: 'move', strs: { title: 'pp.move.title' } }),
    UI.row({ title: '', action: 'open', value: 'edit', strs: { title: 'pp.edit.title' } }),
    UI.row({ title: '', action: 'open', value: 'end', strs: { title: 'pp.end.title' } }),
    UI.row({ title: '', action: 'open', value: 'edge', strs: { title: 'pp.edge.title' } })
  ];
  document.getElementById('screen').innerHTML =
    UI.heading({ title: '', kind: 'page', level: 1, strs: { title: 'pp.common.task' } }) +
    UI.rowGroup(rows.join(''), { title: '', strs: { title: 'pp.common.slices' } });
  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action="open"]');
    if (b) location.href = b.dataset.value + '.html?lang=' + PP.lang;
  });
})();
</script>
<script src="shell.js"></script>
</body>
</html>
