<script>/* ../../../system/atlas-bare.js */
/* Bare screens: open any built prototype page with ?screen=<stable id> (ids are atlas/atlas.json's) and it shows only
   that screen: the phone's content at 390 x 844 in the page's top-left, no study chrome and no phone frame (the atlas
   draws the frame). Without the param this file does nothing, so the study page works as before.
   - Putting the page in the state: the screen's `preset` goes through the page's select.scenario; pages driven by their own
     URL params (Home, Piglet processing) already carry them in the screen's url.
   - Ready: parent.postMessage({ atlasReady: id }).
   - Screens only a tap reaches: the screen's `steps` (ordered; each a string or { tap, hold }) are replayed after the preset.
     A step is visible text, an aria-label / title, or a CSS selector (starts with [ . #), matched inside the phone.
   - The flow follows the demo: a page calls AtlasBare.watch(fn) after every render, fn() returns the screen id of the
     state it is in (or null); when that changes, parent.postMessage({ atlasScreen: id }).
   One convention for every prototype: new pages include this script in <head> and call AtlasBare.watch where they can.
   Entry markers live in the pages' own markup: data-entry="<feature id>" (space-separated for several) on a control that
   is a way into that feature; the atlas outlines it. */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search), id = q.get('screen');
  var AB = window.AtlasBare = { id: id || null, screen: null, screens: [], bare: !!id, watch: function () {} };
  if (!id) return;

  var root = document.documentElement, ready = false, fn = null, prev = null;
  root.classList.add('atlas-bare');
  var css = document.createElement('style');
  css.textContent =
    'html.atlas-bare,html.atlas-bare body{margin:0!important;padding:0!important;width:390px!important;height:844px!important;overflow:hidden!important;background:#fff!important}' +
    'html.atlas-bare:not(.atlas-ready) body{opacity:0}' +
    'html.atlas-bare [data-atlas-hide]{display:none!important}' +
    'html.atlas-bare .atlas-path{display:block!important;position:static!important;margin:0!important;padding:0!important;border:0!important;width:auto!important;height:auto!important;min-height:0!important;max-width:none!important;' +
    'overflow:visible!important;transform:none!important;filter:none!important;background:none!important;box-shadow:none!important;border-radius:0!important;contain:none!important;opacity:1!important}' +
    'html.atlas-bare .atlas-phone{position:fixed!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;width:390px!important;height:844px!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;' +
    'margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important;transform:none!important;overflow:hidden!important;z-index:1}' +
    'html.atlas-bare *,html.atlas-bare *::before,html.atlas-bare *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important;caret-color:transparent}' +
    'html.atlas-bare *,html.atlas-bare *::before,html.atlas-bare *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important;caret-color:transparent}' +
    'html.atlas-bare .atlas-phone::before,html.atlas-bare .atlas-phone::after{box-shadow:none!important}';
  document.head.appendChild(css);

  /* the atlas data starts loading at once */
  var here = document.currentScript && document.currentScript.src;
  var dataUrl = here ? new URL('../../atlas/atlas.json', here).href : '/atlas/atlas.json';
  var data = fetch(dataUrl).then(function (r) { return r.json(); }).catch(function () { return null; });

  function findScreen(d) {
    var found = null, path = location.pathname;
    if (!d) return;
    d.platforms.forEach(function (p) { p.sections.forEach(function (s) { s.features.forEach(function (f) { f.screens.forEach(function (c) {
      if (c.id === id) found = c;
      if (c.url && c.url.split('?')[0] === path) AB.screens.push(c);
    }); }); }); });
    AB.screen = found;
  }

  function hideAround(phone) {
    for (var el = phone; el && el !== document.body; el = el.parentElement) {
      var par = el.parentElement; if (!par) break;
      Array.prototype.forEach.call(par.children, function (sib) {
        if (sib !== el && !/^(SCRIPT|STYLE|LINK|TEMPLATE)$/.test(sib.tagName)) sib.setAttribute('data-atlas-hide', '');
      });
      if (par !== document.body) par.classList.add('atlas-path');
    }
    phone.classList.add('atlas-phone');
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function frames() { return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); }); }
  function shown(el) { return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length); }
  function norm(t) { return (t || '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  var TAPPABLE = 'button,a,[data-action],[role=button],label,summary,[tabindex]';
  function findStep(phone, key) {
    var k = String(key), want = norm(k), el, list, i;
    if (/^[\[.#]/.test(k)) { list = phone.querySelectorAll(k); for (i = 0; i < list.length; i++) if (shown(list[i])) return list[i]; return null; }
    var all = Array.prototype.filter.call(phone.querySelectorAll('*'), shown), best = null;
    for (i = 0; i < all.length; i++) {   // smallest visible element whose text is the step, then its nearest control
      el = all[i];
      if (norm(el.textContent) === want && (!best || best.contains(el))) best = el;
    }
    if (best) return best.closest(TAPPABLE) && phone.contains(best.closest(TAPPABLE)) ? best.closest(TAPPABLE) : best;
    for (i = 0; i < all.length; i++) {   // a control whose text begins with the step (its other words are a hint line)
      el = all[i];
      if (el.matches(TAPPABLE) && norm(el.textContent).indexOf(want) === 0 && (!best || best.contains(el))) best = el;
    }
    if (best) return best;
    for (i = 0; i < all.length; i++) if (norm(all[i].getAttribute('aria-label')) === want || norm(all[i].getAttribute('title')) === want) return all[i];
    return null;
  }
  function replay(phone, steps) {
    var chain = Promise.resolve();
    steps.forEach(function (st) {
      chain = chain.then(function () {
        var key = typeof st === 'string' ? st : st.tap, hold = typeof st === 'object' && st.hold;
        var el = findStep(phone, key);
        if (!el) { console.error('atlas-bare: step not found: ' + key); return; }
        if (hold) {
          var o = { bubbles: true, cancelable: true, button: 0, pointerId: 1, pointerType: 'mouse', isPrimary: true };
          el.dispatchEvent(new PointerEvent('pointerdown', o));
          return wait(hold).then(function () { el.dispatchEvent(new PointerEvent('pointerup', o)); });
        }
        el.click();
      }).then(frames).then(function () { return wait(60); });
    });
    return chain;
  }

  function check() {
    if (!ready || !fn) return;
    var sid = null; try { sid = fn(AB.screens); } catch (e) { return; }
    if (sid === prev) return;
    prev = sid;
    if (sid) parent.postMessage({ atlasScreen: sid }, '*');
  }
  AB.watch = function (f) { fn = f; check(); };
  AB.current = function () { try { return fn ? fn(AB.screens) : null; } catch (e) { return null; } };   // the screen the page is on now (for checks)

  function start() {
    data.then(function (d) {
      findScreen(d);
      var sel = document.querySelector('select.scenario');
      var phone = (sel && sel.closest('.spec') && sel.closest('.spec').querySelector('.phone')) || document.querySelector('.phone, section.device, .tk-phone');
      if (!phone) { console.error('atlas-bare: no phone found'); return; }
      var preset = AB.screen && AB.screen.preset;
      if (preset && sel) {
        if (![].some.call(sel.options, function (o) { return o.value === preset; })) console.warn('atlas-bare: preset "' + preset + '" is not in the page');
        else if (sel.value !== preset) { sel.value = preset; sel.dispatchEvent(new Event('change', { bubbles: true })); }
      }
      if (!AB.screen) console.warn('atlas-bare: unknown screen ' + id);
      var steps = (AB.screen && AB.screen.steps) || [];
      (steps.length ? frames().then(function () { return replay(phone, steps); }) : Promise.resolve()).then(function () {
      hideAround(phone);
      var fonts = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 250); })]) : Promise.resolve();
      fonts.then(function () { requestAnimationFrame(function () { requestAnimationFrame(function () {
        root.classList.add('atlas-ready'); ready = true;
        if (fn) { try { prev = fn(AB.screens); } catch (e) { prev = null; } }   // the state the screen opens in is not a change
        parent.postMessage({ atlasReady: id }, '*');
      }); }); });
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<style>/* ../../../design-system/components/bundle.css */

/* Sentri — the shared stylesheet, in load order:
   1. aliases from the generated tokens to the names the components read
   2. base elements and controls (from farrowing-astra-concept.css, the prototypes' common base)
   3. Sheet: drawer | page | dialog
   4. sentri-visual-foundation.css (its :root palette now comes from tokens.css)
   Section 2 sits in a cascade layer (sentri-base): any page stylesheet wins over it in any load order, so Home, Farrowing
   and Inspection keep their own base. Sections 3-5 are unlayered and load after the page CSS.
   5. the SentriUI parts.
   Screens scope the foundation to a phone root: wrap content in .inspection-phone or .farrowing-phone
   and mark the container data-st-context="page" or "drawer". */
:root{--sans:var(--font-sans);--mono:var(--font-mono);--wash:var(--well)}

/* 2 · base: in a cascade layer, so the page CSS of Home, Farrowing and Inspection (which carry their own base) always wins. */
@layer sentri-base{
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:var(--font-size-14) var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;border:0}
button:disabled,button[aria-disabled=true]{cursor:default;color:var(--disabled-ink);background:var(--disabled-surface);border-color:var(--disabled-border)}
svg{width:var(--size-20);height:var(--size-20);display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.button{min-height:var(--tap-min);min-width:var(--tap-min);padding:var(--space-10) var(--space-17);display:flex;align-items:center;justify-content:center;gap:var(--space-7);border:var(--border-width) solid var(--control-border);background:var(--paper);border-radius:var(--radius-control);font-weight:var(--type-weight-strong);font-size:var(--type-button-size);text-align:center;line-height:1.3}
.button.primary{flex:1;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.button.primary:disabled{background:var(--disabled-fill);border-color:var(--disabled-fill);color:var(--disabled-ink)}
.button.secondary{min-width:var(--back-width);font-weight:600}
.button:active:not(:disabled){transform:translateY(var(--size-2))}
.button.danger:not(:disabled):not([aria-disabled="true"]){background:var(--red);border-color:var(--red)}
.icon-button{background:transparent;min-width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;border-radius:var(--radius-control);position:relative}
.field{display:flex;flex-direction:column;gap:var(--space-9);font-size:var(--font-size-12);font-weight:600;margin:var(--space-18) 0 0}
@media(prefers-reduced-motion:reduce){.button:active{transform:none}}
}

/* 3 · Sheet: drawer | page | dialog. The one implementation (SentriUI.sheet); it replaces the old per-prototype drawer and page styles and the
   TaskSheet / TaskPage / TaskDialog styles. Every value is a token. A sheet is sized by its nearest positioned ancestor
   (the phone root): see Sheet/README.md. */
.scrim{position:absolute;top:var(--statusbar-height);left:0;right:0;bottom:0;z-index:calc(2 + 10 * var(--sheet-layer,0));width:100%;padding:0;margin:0;border:0;background:var(--scrim);backdrop-filter:blur(var(--blur-scrim))}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:calc(3 + 10 * var(--sheet-layer,0));display:flex;flex-direction:column;overflow:hidden;max-height:calc(100% - var(--size-80));background:var(--paper);color:var(--ink);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;box-shadow:var(--shadow-sheet)}
.sheet:focus{outline:none}
/* Drawer: as tall as its content, up to its size's max. sizing "full" holds it at the max, for a sheet whose content grows
   as the worker taps; the body then takes the spare height and the footer still sits on the bottom edge. */
.sheet[data-size="compact"]{max-height:var(--drawer-compact-max)}
.sheet[data-size="short"]{max-height:var(--drawer-short-max)}
.sheet[data-size="medium"]{max-height:var(--drawer-medium-max)}
.sheet[data-size="long"]{max-height:var(--drawer-long-max)}
.sheet[data-sizing="full"]{height:calc(100% - var(--size-80))}
.sheet[data-sizing="full"][data-size="compact"]{height:var(--drawer-compact-max)}
.sheet[data-sizing="full"][data-size="short"]{height:var(--drawer-short-max)}
.sheet[data-sizing="full"][data-size="medium"]{height:var(--drawer-medium-max)}
.sheet[data-sizing="full"][data-size="long"]{height:var(--drawer-long-max)}
/* Page: the whole canvas, square, no scrim; Back is in its footer. */
.sheet[data-presentation="page"]{inset:0;height:100%;max-height:100%;border-radius:0;box-shadow:none;background:var(--app-background);z-index:calc(5 + 10 * var(--sheet-layer,0))}

/* Section navigation footer: preserve the approved Back + underlined categories. */
.st-category-footer.st-category-footer{display:grid;grid-template-columns:var(--back-width) minmax(0,1fr);align-items:center;gap:var(--space-16);position:relative;flex:none;min-width:0;padding:var(--space-footer-top) var(--space-gutter) var(--space-footer-bottom);border-top:var(--border-width) solid var(--st-line);background:var(--st-paper);container-type:inline-size}

.st-category-footer .st-category-tabs button{position:relative;flex:1 0 auto;min-width:var(--tap-min);min-height:var(--control-height);margin:0;padding:0 var(--space-8);border:0;border-radius:0;background:transparent;color:var(--tab-ink);font:500 var(--font-size-12) var(--font-sans);white-space:nowrap;touch-action:manipulation}

.inspection-phone .sheet.picker-step .chooser-header-back{width:var(--tap-min);height:var(--tap-min);min-width:var(--tap-min);padding:var(--space-12);border:0;background:transparent;box-shadow:none;border-radius:50%;margin:0}

/* Selection is a check, not an extra rectangle inside the contextual panel. */

/* Chooser: one row geometry for every level and shape (flat, sectioned, nested).

/* 6 · Field cards (candidate, ADR 0001): Stepper, Measure, Numpad.

.st-stepper.st-stepper,.st-measure.st-measure,.st-numpad.st-numpad{margin:0;padding:0;border:0;background:transparent;color:var(--ink);font-family:var(--font-sans)}

/* Stepper · row: label left, `− n +` right; each key's hit area spans the whole row height */
.st-stepper.st-stepper{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:var(--space-row-y);min-height:var(--stepper-row-min)}

.st-stepper-description{font:400 var(--type-description-size)/1.5 var(--font-sans);color:var(--muted)}

.st-stepper:is([data-variant="count"],[data-variant="well"]) .st-stepper-face{width:var(--hero-key);height:var(--hero-key);border-radius:var(--radius-inset)}
.st-stepper:is([data-variant="count"],[data-variant="well"]) .st-stepper-face svg{width:var(--glyph-key-hero);height:var(--glyph-key-hero)}
.st-stepper:is([data-variant="count"],[data-variant="well"]) .st-stepper-value{flex:1;font:600 var(--type-hero-count-size)/1.15 var(--font-mono);letter-spacing:var(--tracking-hero);color:var(--count-ink)}

.st-stepper:is([data-variant="count"],[data-variant="well"]) .st-stepper-hint{justify-content:center;text-align:center}

/* Measure: label above, a field-shaped box, value in mono with its unit always written */
.st-measure.st-measure{display:flex;flex-direction:column;gap:var(--space-8)}
.st-measure-label{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--space-6);font:600 var(--type-choice-label-size)/1.4 var(--font-sans);color:var(--ink)}

.st-measure-box.st-measure-box{display:flex;align-items:baseline;gap:var(--space-6);width:100%;min-height:var(--field-height);margin:0;padding:var(--space-row-y) var(--space-row-x);box-sizing:border-box;border:1px solid var(--control-border);border-radius:var(--radius-control);background:var(--paper);color:var(--ink);box-shadow:none;text-align:left;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

button.st-measure-box:is(:active,[data-preview~="pressed"]){background:var(--press)}
.st-measure-value{font:500 var(--type-figure-size)/1.2 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:pre}
.st-measure-unit{font:500 var(--type-identifier-size)/1.5 var(--font-mono);color:var(--muted)}

.st-measure[data-active] .st-measure-box,.st-numpad-readout .st-measure-box.st-measure-box{border-color:var(--ink);box-shadow:inset 0 0 0 calc(var(--caret-width) - 1px) var(--ink);cursor:default}
:is(.st-measure[data-active],.st-numpad-readout:not([data-suggested])) .st-measure-value::after{content:"";display:inline-block;width:var(--caret-width);height:1em;margin-left:var(--space-2);background:var(--ink);vertical-align:-.12em}
.st-measure[data-changed] .st-measure-value,.st-measure[data-tone="refused"] .st-measure-value{color:var(--amber)}
.st-measure[data-tone="refused"] .st-measure-value{text-decoration:line-through;text-decoration-thickness:var(--caret-width)}

/* Numpad: readout, reserved hint, reserved running list, then 1–9 · [. or gap] 0 ⌫ — keys never move */
.st-numpad.st-numpad{display:flex;flex-direction:column;gap:var(--space-row-y)}
.st-numpad-readout{display:flex;flex-direction:column;gap:var(--space-8)}
.st-numpad-label{font:600 var(--type-choice-label-size)/1.4 var(--font-sans);color:var(--ink)}
.st-numpad-readout[data-suggested] .st-measure-value{color:var(--muted)}

   Sized for the longest status in en and zh (two lines, or one line with a text action) and three list lines. */
.st-numpad-feedback{display:flex;flex-direction:column;gap:var(--space-4)}
.st-numpad-hint.st-numpad-hint{height:var(--tap-min);overflow-y:auto;overscroll-behavior:contain}

.st-numpad-recent li[data-tone="amber"]::before{content:"";flex:none;width:var(--status-dot);height:var(--status-dot);border-radius:50%;background:currentColor}
.st-numpad-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-key-gap)}
.st-numpad-key.st-numpad-key{width:100%;height:var(--choice-row-min);font:500 var(--type-figure-size)/1 var(--font-mono);font-variant-numeric:tabular-nums}
.st-numpad-key svg{width:var(--glyph-pad);height:var(--glyph-pad);stroke-width:var(--icon-pad-stroke)}
@media (prefers-reduced-motion:reduce){:is(.st-stepper-face,.st-numpad-key){transition:none}.st-stepper-key:is(:active,[data-preview~="pressed"]) .st-stepper-face,.st-numpad-key:is(:active,[data-preview~="pressed"]){transform:none}}

/* 7 · Design-system candidates 2 (candidate, ADR 0002): Status, Banner, Photos, Button registers / waiting / hold,
   ChoiceList radio, Row variants. Tokens only, including the candidate sizes (radio-size, radio-dot, ring-width,
   photo-tile, row-code-min, row-chip-max, radio-row-min, ring-width-fine), ink-2, amber-wash-strong, identifier-strong,
   type-weight-strong, the hold opacities and motion (hold-commit). */
/* Status: colour lives on the value; the word stays ink */
.st-part[data-tone]{font-weight:600}
.st-part[data-tone="amber"]{color:var(--amber)}
.st-part[data-tone="progress"]{color:var(--progress)}
.st-part[data-tone="green"]{color:var(--green)}
.st-part[data-tone="red"]{color:var(--red)}
.st-part[data-tone="muted"]{color:var(--muted)}

.st-tok{display:inline-block;max-width:100%}
.st-sep{margin:0 var(--space-4);color:var(--muted)}
.st-status{display:inline-flex;align-items:center;gap:var(--status-dot);font:500 var(--type-description-size)/1.5 var(--font-sans);color:var(--muted)}
.st-status::before{content:"";flex:none;width:var(--status-dot);height:var(--status-dot);border-radius:50%;background:currentColor}
.st-status[data-tone="amber"]{color:var(--amber)}
.st-status[data-tone="progress"]{color:var(--progress)}
.st-status[data-tone="green"]{color:var(--green)}
.st-status[data-tone="red"]{color:var(--red)}

.st-status[data-variant="chip"]{display:inline-flex;align-items:center;gap:var(--space-4);width:fit-content;max-width:var(--row-chip-max);padding:var(--space-3) var(--space-6);border:1px solid var(--line);border-radius:var(--radius-chip);background:var(--well);font:600 var(--type-meta-size)/1.2 var(--font-sans);overflow-wrap:anywhere}

.tk-table-columns, .tk-table-row { display: grid; grid-template-columns: minmax(78px, 1.5fr) repeat(var(--tk-cols, 3), minmax(0, 1fr)) 18px; column-gap: 8px; align-items: center; }
.tk-table-columns { padding: var(--space-row-y) var(--space-row-x); background: var(--surface); border-bottom: 1px solid var(--line);
  font: var(--type-table-heading-size)/1.3 var(--font-sans); color: var(--muted); }
.tk-table-columns > span:not(:first-child) { text-align: center; }
.tk-table-surface [role="listitem"] + [role="listitem"] { border-top: 1px solid var(--rule); }
.tk-table-row { width: 100%; min-height: var(--animal-row-min); margin: 0; padding: var(--space-row-x); border: 0; background: var(--paper); color: var(--ink);
  font: 500 var(--type-button-size) var(--font-sans); text-align: left; }
.tk-table-row:active { background: var(--green-wash); }
.tk-table-name { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; }
.tk-table-name > :is(strong, small) { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-table-name > strong { font: 500 var(--type-button-size)/1.3 var(--font-sans); }
.tk-table-name > small { font: 400 var(--type-table-heading-size)/1.3 var(--font-sans); color: var(--muted); }
.tk-table-figure { font: 400 var(--type-table-figure-size)/1.3 var(--font-mono); text-align: center; font-variant-numeric: tabular-nums; }
.tk-table-row > svg { width: 18px; height: 18px; color: var(--green); }

/* TaskMetrics: farrowing's performance card — two headline measures, a rule, small totals. */
.tk-metrics-surface { padding: var(--space-panel); border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); }
.tk-metrics-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.tk-metrics-pair > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tk-metrics-pair > div > span { font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-metrics-pair strong { font: 500 var(--type-metric-size)/1.2 var(--font-mono); letter-spacing: -1px; color: var(--ink); }
.tk-metrics-pair strong > small { margin-left: 2px; font-size: var(--type-figure-denominator-size); }
.tk-metrics-pair > div > small { font: var(--type-meta-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-metrics-pair > div > small[data-tone="amber"] { color: var(--amber); }
.tk-metrics-totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: var(--space-panel) 0 0; padding-top: var(--space-row-x); border-top: 1px solid var(--line); }
.tk-metrics-totals > div { min-width: 0; }
.tk-metrics-totals dt { font: var(--type-meta-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-metrics-totals dd { margin: 2px 0 0; font: 500 var(--type-metric-total-size)/1.5 var(--font-mono); color: var(--ink); }
@media (max-width: 370px) {
  .tk-table-columns, .tk-table-row { column-gap: 5px; grid-template-columns: minmax(65px, 1.35fr) repeat(var(--tk-cols, 3), minmax(0, 1fr)) 16px; padding-left: var(--space-row-y); padding-right: var(--space-row-y); }
  .tk-table-name > strong { font-size: var(--type-row-title-size); }
}

/* TaskRadios layout 'row': farrowing's inline field — label (Optional tag, Clear) left, outlined option pills right. */
.st-choice-inline.tk-radios[data-face="row"] { display: flex; align-items: center; justify-content: space-between; gap: var(--space-row-y); min-height: 64px; }
.tk-radios[data-face="row"] .st-choice-inline-label { flex: 1; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; column-gap: var(--space-key-gap);
  font: 500 var(--type-entry-label-size)/1.4 var(--font-sans); }
.tk-radios[data-face="row"] .st-choice-inline-label small { font: 400 var(--type-meta-size)/1.4 var(--font-sans); }
.tk-radios[data-face="row"] .st-choice-inline-clear { min-height: var(--tap-min); }
.tk-radios[data-face="row"] .st-choice-inline-opts { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(66px, 1fr); gap: 6px; align-self: center; }
.tk-radios[data-face="row"] .st-choice-inline-opt.st-choice-inline-opt { justify-content: center; gap: 5px; min-width: 0; min-height: var(--tap-min); padding: 0 var(--space-row-y);
  border: 1px solid var(--control-border); border-radius: 11px; font: 500 var(--type-row-title-size)/1.3 var(--font-sans); }
.tk-radios[data-face="row"] .st-choice-inline-opt[aria-checked="true"] { border-color: var(--ink); background: var(--press); font-weight: 500; }
.tk-radios[data-face="row"] .st-radio { width: 14px; height: 14px; border-width: var(--ring-width-fine); border-color: var(--muted); }
.tk-radios[data-face="row"] .st-radio::after { width: 8px; height: 8px; }
.tk-radios[data-face="row"] [aria-checked="true"] .st-radio { border-color: var(--ink); }

/* TaskSection: an icon-headed card section; the outcomes list (label 12px, figure 14px/500 mono right). */
.tk-section { display: flex; flex-direction: column; }
.tk-section > .st-heading { margin: 0 0 var(--space-heading); }
.tk-outcomes.st-panel { margin: 0; padding: var(--space-panel); }
.tk-outcomes > div { display: flex; align-items: center; justify-content: space-between; gap: var(--space-panel); min-height: 27px; }
.tk-outcomes dt { margin: 0; font: var(--type-choice-meta-size)/1.5 var(--font-sans); color: var(--ink); }
.tk-outcomes dd { margin: 0; font: 500 var(--type-button-size) var(--font-mono); color: var(--ink); }

/* TaskReceipt: the ✓ receipt row. */
.tk-receipt { display: flex; align-items: center; gap: var(--space-row-y); padding: 6px 0 10px; }
.tk-receipt-mark { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--green-wash); color: var(--green); }
.tk-receipt-mark svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tk-receipt-title { margin: 0; font: 600 var(--type-button-size)/1.5 var(--font-sans); color: var(--ink); }
.tk-receipt-meta { margin: 5px 0 0; font: var(--type-description-size)/1.2 var(--font-sans); color: var(--muted); }

/* TaskDay: the day card — a tinted band (bold day, mono status), rows that are doors (mark, title, mono meta), an act. */
.tk-day { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-inset); background: var(--paper); }
.tk-day-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-row-y); padding: var(--space-row-y) var(--space-row-x); background: var(--surface); }
.tk-day-head > strong { font: 700 var(--type-row-title-size)/1.25 var(--font-sans); color: var(--ink); }
.tk-day-head > span { font: var(--type-meta-size)/1.3 var(--font-mono); color: var(--muted); }

/* TaskDock unit: the labelled place control (B1 / Go to pen). */
.tk-dock-unit { flex: none; display: flex; align-items: center; gap: 9px; min-height: 50px; margin: 0; padding: 0 3px; border: 0; background: var(--paper); color: var(--ink); text-align: left; }
.tk-dock-unit > svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tk-dock-unit > span { display: flex; flex-direction: column; gap: 4px; }
.tk-dock-unit strong { font: 600 var(--type-row-title-size)/1.2 var(--font-mono); }
.tk-dock-unit small { font: var(--type-dock-caption-size)/1.2 var(--font-sans); color: var(--muted); }

/* TaskDoors: flat door rows, or (card) a section title with its icon and one card of icon doors (the Pen page). */
.tk-doors[data-card] { display: flex; flex-direction: column; gap: var(--space-heading); }
.tk-doors[data-card] > * { margin: 0; }

@media (prefers-reduced-motion: reduce) { .tk-summary-task { transition: none; } }

/* ---- TaskChips (candidate): one row of filter chips over a task list (README: TaskChips/README.md) ----
   Farrowing's segment faces on separate chips: a `well` chip with a 1px `line`, `radius-segment`; the chosen chip is the
   pressed segment (`paper`, `ink` 500, the segment shadow). 48px targets; the count in mono inside the chip. The track
   scrolls sideways; a trailing spacer the gutter's width keeps the last chip clear of the edge fade. */
.tk-chips { padding: 6px 0 9px; background: var(--app-background); }
.tk-chips-track { display: flex; gap: var(--space-key-gap); overflow-x: auto; padding: 0 0 0 var(--space-gutter); scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - var(--space-gutter)), transparent); mask-image: linear-gradient(to right, #000 calc(100% - var(--space-gutter)), transparent); }
.tk-chips-track::-webkit-scrollbar { display: none; }
.tk-chips-track::after { content: ""; flex: none; width: var(--space-gutter); }
.tk-chips-chip { flex: none; display: inline-flex; align-items: center; gap: var(--space-key-gap); min-height: var(--tap-min); margin: 0; padding: 0 var(--space-row-x);
  border: 1px solid var(--line); border-radius: var(--radius-segment); background: var(--well); color: var(--tab-ink);
  font: 400 var(--type-row-title-size)/1.2 var(--font-sans); white-space: nowrap; cursor: pointer; }
.tk-chips-chip[aria-checked="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px #20271f0d; }
.tk-chips-count { font: 500 var(--type-meta-size)/1 var(--font-mono); color: var(--muted); }
.tk-chips-chip:active { background: var(--press); }
.tk-radios .st-choice-row[data-mode="radio"][aria-checked="true"] .st-choice-label,.tk-radios[data-face="row"] .st-choice-inline-opt[aria-checked="true"]{font-weight:var(--type-weight-strong)}

</style>
<style>/* app.css */
/* Simple piglet processing: layout only, tokens from tokens.css. Everything else is the task skeleton. */

/* the stack inside a sheet or a page body */
.sheet-body > * + *, .sheet-body > * + * { margin-top: var(--space-heading); }
.sheet-body > .tk-stepper + .tk-stepper { margin-top: 0; }

/* the receipt line after a save, with Undo */
.sp-flash { display: flex; align-items: center; justify-content: space-between; gap: var(--space-footer-gap); min-height: var(--tap-min);
  color: var(--green); font: 500 var(--type-row-title-size)/1.4 var(--font-sans); }
.tk-scroll > .sp-flash { margin: 0 var(--space-gutter) 4px; }
.sp-flash > span { min-width: 0; }
.sp-note { margin: 0 var(--space-gutter) var(--space-heading); }
.sp-quiet { margin: 0; font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.sp-empty { margin: var(--space-section) var(--space-gutter); font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); text-align: center; }
.sp-weigh.sp-weigh { margin-top: var(--space-4); font-size: var(--type-description-size); font-weight: 400; color: var(--amber); }
.sheet-footer.sp-two > * { flex: 1 1 0; min-width: 0; }
@keyframes sp-tick-in { from { transform: scale(.7); background: var(--paper); border-color: var(--muted); } to { transform: none; } }
@keyframes sp-tick-draw { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }

/* ---- inside a pen, as farrowing's sow sheet: the Piglets card (Litter summary · View log ›), the tool row, the day
   cards; [⋯] beside the footer's one action ---- */
/* farrowing's in-sheet tool row (Edit · Record death · More actions): outlined tools sharing the width */
.sp-toolrow { display: flex; gap: var(--space-key-gap); }
.sp-toolrow > .button.tool { flex: 1 1 0; min-width: var(--tap-min); padding: var(--space-8) var(--space-6); }
/* the breeder mark on an identified piglet: a 44px flag; filled when kept */

.sp-mark svg { width: var(--glyph-pad); height: var(--glyph-pad); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.sp-mark[aria-pressed="true"] { color: var(--green); }
.sp-mark[aria-pressed="true"] svg { fill: currentColor; }
.sp-tabs.st-segment { margin: 0; }
.sheet-footer > .sp-more { flex: none; display: grid; place-items: center; width: var(--control-height); min-height: var(--control-height); margin: 0; padding: 0;
  border: 1px solid var(--control-border); border-radius: var(--radius-control); background: var(--paper); color: var(--ink); }
.sp-more svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

/* Processing: one TaskDay card per age-day (the skeleton's day card). A ticked, not yet submitted item is not a done
   row: it stays in ink on the green wash; a row saved on this visit fills its check in place; later days are muted. */
.sheet-body > .tk-day + .tk-day { margin-top: var(--space-key-gap); }
.st-row[data-ticked] .st-row-copy > strong { color: var(--ink); }
.st-row[data-ticked] .st-row-mark, .st-row[data-fresh] .st-row-chip { animation: sp-tick-in 200ms ease-out; }
.tk-day[data-when="future"] .tk-day-head > strong, .tk-day[data-when="future"] .st-row-copy > strong { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .st-row[data-ticked] .st-row-mark, .st-row[data-fresh] .st-row-chip { animation: none !important; } }

/* Piglets: Scan tag · Choose notch · Add manually — three tool Buttons in a line */
.sp-adds { display: flex; gap: var(--space-key-gap); }
.sp-adds > .button { flex: 1 1 0; min-width: 0; }
.sheet-body > .tk-list, .sheet-body > .tk-list { margin: 0; }

/* Give IDs: one piglet at a time — big readouts (Measure) on the skeleton's Numpad, Boar · Gilt as TaskChoice tiles */
.sp-give-id { display: flex; align-items: flex-start; gap: var(--space-key-gap); }
.sp-give-id > .sp-give-scan { margin-top: 30px; }
.sp-keep-row > .st-row-identity { display: none; }
.sp-give-id > .st-measure { flex: 1; min-width: 0; }
.sp-give-scan.icon-button { flex: none; width: var(--control-height); height: var(--control-height); border: 1px solid var(--control-border); border-radius: var(--radius-control); background: var(--paper); }
.sp-give-scan svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sp-give-measure .st-measure-value { font-size: var(--type-figure-well-size); }
.sp-give-measure .st-measure-box.st-measure-box { min-height: 64px; }
.sp-give-measure:has(.st-measure-hint) { margin-bottom: 0; }
.sp-give-litter { display: flex; flex-direction: column; gap: var(--space-heading); }
.sp-give-litter > .tk-stepper + .tk-stepper { margin-top: calc(-1 * var(--space-heading)); }
/* the pad docks above the footer, out of the scroller */
:is(.sheet[data-presentation="page"], .sheet) > .st-numpad { flex: none; padding: var(--space-row-y) var(--space-gutter); background: var(--paper); border-top: 1px solid var(--line); }
:is(.sheet[data-presentation="page"], .sheet) > .st-numpad + .sheet-footer { border-top: 0; }
.sheet-body > .st-row[data-select] { border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); }
.button.sp-wide { width: 100%; }

/* Move: the other pens as tiles, four to a line */
.sheet-body > .sp-pick + * { margin-top: var(--space-section); }

/* ---- outside the phone: the demo controls ----
   Wide window: a card beside (or under) the framed phone. Phone width: a small "Demo" pill on the status bar's empty
   middle that opens the same card over the phone, so the page itself never scrolls. */
.sp-demo { box-sizing: border-box; font: 13px/1.5 var(--font-sans); color: var(--ink); }
.sp-demo button { font: inherit; color: inherit; cursor: pointer; }
.sp-demo-panel { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.sp-demo-toggle { display: none; }
@media (min-width: 431px) {
  .sp-demo { width: 100%; max-width: var(--phone-width); margin: 0 auto; padding: var(--space-section) 0; }
}
@media (min-width: 900px) {
  .sp-demo { position: fixed; top: var(--space-section); left: var(--space-section); width: 240px; margin: 0; padding: 16px;
    border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); }
}
@media (max-width: 430px) {
  .sp-demo { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; align-items: center; }
  .sp-demo-toggle { display: block; min-height: 30px; padding: 3px 14px; border: 1px solid var(--control-border); border-radius: 999px; background: var(--paper); font-size: 12px; }
  .sp-demo[data-open="false"] .sp-demo-panel { display: none; }
  .sp-demo-panel { width: min(300px, calc(100vw - 32px)); margin-top: 6px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-panel);
    background: var(--paper); box-shadow: var(--shadow-dialog); }
}
.sp-demo-lang { display: flex; border: 1px solid var(--line); border-radius: var(--radius-segment); overflow: hidden; background: var(--paper); }
.sp-demo-lang button { min-width: 56px; min-height: 36px; border: 0; background: transparent; }
.sp-demo-lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.sp-demo-btn { min-height: 40px; padding: 8px 12px; border: 1px solid var(--control-border); border-radius: var(--radius-segment); background: var(--paper); text-align: left; }
.sp-demo-tip, .sp-demo-msg { margin: 0; color: var(--muted); font-size: 12px; }
.sp-demo-msg { color: var(--amber); }
.sp-demo-link { padding: 0; border: 0; background: none; text-decoration: underline; color: var(--muted); }
.sp-demo-farm { display: flex; flex-direction: column; align-items: stretch; gap: 2px; width: 100%; }
.sp-demo-label { margin: 0 0 2px; font-weight: 600; }
.sp-demo-farm button { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0; border: 0; background: none; text-align: left; }
.sp-demo-dot { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.sp-demo-farm button[aria-checked="true"] .sp-demo-dot { border: 5px solid var(--ink); }

/* a piglet on the Piglets page: the row (tap to fix) and its breeder flag beside it */
.sp-pigrow { display: flex; align-items: center; padding-right: 6px; }
.sp-pigrow + .sp-pigrow { border-top: 1px solid var(--line); }
.sp-pigrow > .st-row { flex: 1; min-width: 0; }
/* Processing: a section title like the Piglets card's; the Done section sits last */
.sp-proc > .tk-day + .tk-day { margin-top: var(--space-key-gap); }
.tk-day[data-when="done"] .tk-day-head > strong { color: var(--muted); }

.sp-list-lens{margin:0 var(--space-panel)}

</style>
</head>

  /* ---- TaskProgress: farrowing's Whole-task progress card (Task overview): a panel head (title, meta), the segmented

  /* ---- TaskLens: tabs, the count under each label; the filter at the end ---- */

  }

  /* ---- TaskGroup: a pen / crate-row card ---- */
  function list(groups) { return `<div class="tk-list">${Array.isArray(groups) ? groups.join('') : groups || ''}</div>`; }
  /* face: 'code' (default: a place code in mono, `B1`) | 'word' (a word in the sans face, `Row A`, `Arrivals`). */
  function group({ title, meta, door, rows = '', face = 'code' } = {}) {
    const inner = `<strong class="tk-group-title"${face === 'word' ? ' data-face="word"' : ''}>${T(title)}</strong>${meta ? `<small class="tk-group-meta">${T(meta)}</small>` : ''}`;

      ? `<button type="button" class="tk-group-door"${A(door.action, door.value)}${L(door.label)}>${inner}${glyph('chevron')}</button>`

  }
  /* ---- row (alias of SentriUI.row / rowSelect — use Row): id + chip | headline + meta | chevron, edit or tick ----
     trail 'tick' (with tick: { action = 'toggle', value, checked, label }): the row is a <label> around ChoiceList's multi
     trail, a checkbox (the selection of a bulk act); the whole row is the target. still: a row with no action (a <div>,
     e.g. one that holds its place after a record). data: { name: value } becomes data-name="value" on the row. */
  function row({ id, chip, headline, tone, meta, trail = 'chevron', action = 'open', value = '', label, tick, still = false, data } = {}) {
    const convert = v => Array.isArray(v) ? v.filter(x=>!x.sep).map(convert) : typeof v==='object' && v ? {text:v.text||'',strs:v.str?{text:v.str}:undefined,args:v.args?{text:v.args}:undefined,tone:v.tone} : v;
    const props={code:obj(id).text||'',strs:obj(id).str?{code:obj(id).str}:undefined,args:obj(id).args?{code:obj(id).args}:undefined,chip:chip?{variant:'chip',kind:chip.kind,text:obj(chip).text||'',strs:obj(chip).str?{text:obj(chip).str}:undefined,args:obj(chip).args?{text:obj(chip).args}:undefined}:null,title:Array.isArray(headline)?headline.map(x=>x.sep?{text:'·',strs:{text:'ds.sep'}}:convert(x)):typeof headline==='object'?[convert(headline)]:headline,description:typeof meta==='object'&&!Array.isArray(meta)?[convert(meta)]:convert(meta),mono:true,wrap:true,trail:trail||'none',action:still?'':action,value,variant:trail==='edit'?'record':'animal',attrs:Object.assign(tone?{'data-tone':tone}:{},label?{'aria-label':obj(label).text||''}:{},Object.fromEntries(Object.entries(data||{}).map(([k,v])=>['data-'+k,v])))};
    if(trail==='tick') return root.SentriUI.rowSelect({...props,action:tick?.action||'toggle',value:tick?.value??value,checked:!!tick?.checked,inputAttrs:tick?.label?{'aria-label':obj(tick.label).text||''}:{}});

  // Compatibility adapter; Stepper owns every face and its implementation.
  function stepper(props = {}) {

  /* TaskPhotos: compatibility alias; Photos owns the optional line face. */
  function photos(props = {}) { return root.SentriUI.photos(props); }

  /* ---- door (alias of SentriUI.row / rowAction — use Row): a row with no id column (farrowing's .disclosure): a title, one muted description line, a chevron.

  function door({ title, description, action = 'open', value = '', label, trail = 'chevron', act, id = '', chip, attrs = {}, mono = false, mark = '' } = {}) {
    const convert=v=>Array.isArray(v)?v.filter(x=>!x.sep).map(convert):typeof v==='object'&&v?[{text:v.text||'',strs:v.str?{text:v.str}:undefined,args:v.args?{text:v.args}:undefined,tone:v.tone}]:v;

  /* ---- TaskChoice: farrowing's choice tiles (Foster piglets: Send / Receive): two (or three) big outlined tiles, an icon

  }

  /* ---- TaskRadios: farrowing's flat radio rows (.radio-row: 60px, a line under each, a 14px label, the radio at the
     right). The design system's ChoiceList radio field (SentriUI.choiceRadios: role=radio buttons, roving tab stop,
     radioBind, an optional Clear) in farrowing's face. Every prop is choiceRadios'; layout is always 'rows'. ---- */
  /* layout 'row': farrowing's inline field (Finish · Assisted farrowing: No | Yes): the label (with its Optional tag and

  function radios(props = {}) {

  /* TaskWarning: legacy slot/tone adapter; Banner owns rendering and styles. */
  function warning({title,text,actions='',detail,tone='red',icon='',door,label}={}) {

  /* ---- TaskSection: farrowing's icon-headed card section (Task outcomes, Other outcomes): a section heading with its
     icon and meta, then one card. body: HTML for the card, or items (below). items: [{ label, value, action, value2 }] —
     rows: false (default) farrowing's outcomes list (label 12px left, 14px mono figure right); rows: true the design

  function section({ title, icon = '', meta, body, items = [], rows = false, label } = {}) {
    const UI = root.SentriUI;

    if (!body && items.length && !rows) card = `<dl class="st-panel tk-outcomes">${items.map(i => `<div><dt>${T(i.label)}</dt><dd>${T(i.value)}</dd></div>`).join('')}</dl>`;

  function receipt({ title, meta, icon = 'check', label } = {}) {
    return `<div class="tk-receipt" data-ds="TaskReceipt" role="status"${L(label)}><span class="tk-receipt-mark">${glyph(icon)}</span><div><h3 class="tk-receipt-title">${parts(title)}</h3>${meta ? `<p class="tk-receipt-meta">${parts(meta)}</p>` : ''}</div></div>`;

  /* ---- TaskDay: farrowing's day card (Piglet processing · Care): a tinted header band (bold `Day 3`, a mono status right),

     12px/700 title; a 10px mono meta line); act: an optional trailing one-tap (Record 12), beside the door. No chevron.

  let daySeq = 0;
  function day({ title, status, items = [], label } = {}) {

    const rows = items.map(i => door({title:i.title,description:i.meta,action:i.action==='noop'?'':i.action||'open',value:i.value,label:i.label,id:i.id||`tk-day-${++daySeq}`,trail:i.mark==='done'&&i.action!=='noop'?'edit':'',mono:true,mark:i.mark==='due'||i.mark==='ticked'?i.mark:'',chip:i.mark==='done'?{variant:'chip',kind:'done',text:'Done',strs:{text:'ds.row.done'}}:null,attrs:{...(i.mark==='done'?{'data-done':''}:{}),...(i.mark==='ticked'?{'data-ticked':''}:{}),...(i.fresh?{'data-fresh':''}:{}),...(i.mark==='due'||i.mark==='ticked'?{'aria-pressed':String(i.mark==='ticked')}:{})},act:i.act})).join('');

     card: true — farrowing's Pen page / sow-actions list: an optional section title with its icon, then the doors in one
     card, each with a 34px tinted icon tile, a title and one description line, a chevron (the design system's Row).

  function doors({ card = false, title, icon = '', items = [], label } = {}) {

  /* ---- TaskTable: farrowing's comparison table (Task overview · Choose a unit): a section heading, then one card —
     a column-heading line (9px, as farrowing) and one door row per place: its name (and a 9px subline), a mono figure per
     column, a green chevron. columns: [text slots]; rows: [{ name, sub, values: [text slots], action, value, label,

  function table({ title, icon = '', meta, nameColumn = '', columns = [], rows = [], label } = {}) {

  function totals(items = [], { columns = 3, label } = {}) {
    return `<dl class="st-panel tk-totals" data-ds="TaskTotals" data-columns="${columns === 2 ? 2 : 3}"${L(label)}>${items.map(i => `<div class="tk-total"><dt>${T(i.label)}</dt><dd>${T(i.value)}</dd></div>`).join('')}</dl>`;

     value, aria } — the place in 13px/600 mono over a 9px caption, the icon left, no frame. */
  function dock({ primary, tools = [], unit } = {}) {
    const u = unit ? `<button type="button" class="tk-dock-unit"${A(unit.action || 'unit', unit.value)}${L(unit.aria)}>${glyph(unit.icon || 'grid')}<span><strong>${T(unit.label)}</strong>${unit.caption ? `<small>${T(unit.caption)}</small>` : ''}</span></button>` : '';

  /* ---- TaskChips (candidate): one row of filter chips over a task list — `All · Iron 4 · Castrate 6 · Done 3`. One is

<script>/* state.js */
/* Simple piglet processing: the whole state model. Plain JS, kept in sessionStorage.
   A pen is a litter. Each step on the farm's plan (a treatment, or the ID step) has a window in days of the pen's age.
   Treatments: for every pen we keep `got`, how many of the piglets alive now have had it; still to do = alive − got.
   Identity: the farm's scheme says who gets an ID — 'tag' or 'notch' every piglet, 'breeders' (tag only the piglets kept
   for breeding), or 'none' (fatteners raised as a batch: no ID step at all). */
(function (root) {
  'use strict';
  var KEY = 'pp-simple-v5';
  var ME = 'G. Hansen', OTHER = 'L. Madsen';
  var PLAN = [
    { key: 'iron', from: 2, to: 4 },
    { key: 'tail', from: 2, to: 4 },
    { key: 'castrate', from: 3, to: 7 },
    { key: 'cocci', from: 3, to: 5 }
  ];
  var ID = { key: 'id', from: 3, to: 7 };   // the farm's ID day: day 3, until day 7
  var SCHEMES = ['tag', 'notch', 'breeders', 'none'];
  var BATCH = { name: '40', firstDay: 1, lastDay: 6 };   // the batch farrowed over these pen ages
  var FIRST_TAG = 1201;   // tags come on pre-printed strips of six-digit numbers: 001201, 001202, …
  var tag6 = function (n) { return ('000000' + n).slice(-6); };

  function todayAt(h, m) { var d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); }

  /* ---- sample farm: 12 pens in two rows of one batch, day 1–6 ---- */
  function seed(scheme) {
    scheme = SCHEMES.indexOf(scheme) >= 0 ? scheme : 'tag';
    var pens = {}, records = [], seq = 0, litter = 21;
    function pen(code, age, born, dead, extra) {
      var i = Object.keys(pens).length;
      var p = { code: code, row: code[0], age: age, born: born, alive: born - dead, dead: dead, sowDied: false, movedIn: 0, movedOut: 0,
        sow: '000' + (231 + i * 7), parity: 1 + (i * 5) % 6, litter: litter++, ids: [], idIn: 0, idOut: 0, picked: null, sex: null, weights: [], tr: {}, bornAt: daysAgoAt(age, 7, 10), bornWho: OTHER };
      PLAN.forEach(function (t) { p.tr[t.key] = { got: 0, why: '' }; });
      Object.assign(p, extra || {});
      pens[code] = p;
      return p;
    }
    function give(code, tr, n, ago, h, m, who, mark, why) {
      var p = pens[code];
      records.push({ id: 'r' + (++seq), pen: code, tr: tr, n: n, at: daysAgoAt(ago, h, m), day: p.age - ago, who: who || ME, mark: mark || '' });
      p.tr[tr].got += n;
      if (why) p.tr[tr].why = why;
    }
    var tagNo = FIRST_TAG;
    function ident(code, count, ago, h, m, breeders, who) {
      var p = pens[code];
      for (var i = 0; i < count; i++) {
        var keep = breeders.indexOf(i) >= 0;
        var no = scheme === 'notch' ? p.litter + '-' + (p.ids.length + 1) : tag6(tagNo++);
        var at = daysAgoAt(ago, h, m + i);
        p.ids.push({ no: no, tag: scheme === 'notch' ? '' : no, notch: scheme === 'notch' ? no : '', sex: i % 2 ? 'boar' : 'gilt', kg: i === 0 ? 1.6 : null, keep: keep, at: at, who: who || ME });
        records.push({ id: 'r' + (++seq), pen: code, tr: 'id', n: 1, no: no, at: at, day: p.age - ago, who: who || ME, mark: '' });
      }
    }
    pen('A01', 6, 13, 1); pen('A02', 5, 12, 0); pen('A03', 4, 13, 1); pen('A04', 3, 11, 0); pen('A05', 3, 12, 0); pen('A06', 2, 14, 1);
    pen('B01', 6, 12, 1); pen('B02', 5, 12, 1, { sowDied: true }); pen('B03', 4, 13, 0); pen('B04', 2, 12, 1); pen('B05', 1, 11, 0); pen('B06', 1, 13, 0);
    // A01: everything given
    give('A01', 'iron', 12, 3, 8, 5); give('A01', 'tail', 12, 3, 8, 12); give('A01', 'castrate', 12, 2, 9, 30); give('A01', 'cocci', 12, 2, 9, 40);
    // A02: iron and tail by the other worker; castrate and cocci due
    give('A02', 'iron', 12, 2, 8, 30, OTHER); give('A02', 'tail', 12, 2, 8, 34, OTHER);
    // A03: iron 10 of 12, 2 weak ones left for later; tail done
    give('A03', 'iron', 10, 1, 8, 40, ME, '', 'weak'); give('A03', 'tail', 12, 1, 8, 46);
    // A05: tail this morning, iron still due
    give('A05', 'tail', 12, 0, 8, 20);
    // B01: iron missed (late); tail, castrate, cocci given
    give('B01', 'tail', 11, 3, 9, 2); give('B01', 'castrate', 11, 1, 9, 10); give('B01', 'cocci', 11, 1, 9, 14);
    // B02: sow died; iron and tail given
    give('B02', 'iron', 11, 2, 9, 20); give('B02', 'tail', 11, 2, 9, 24);
    // B03: iron this morning
    give('B03', 'iron', 13, 0, 7, 52);
    // litter weights: birth weights on a few litters, A01 weighed again on its ID day
    ['A01', 'A02', 'B03'].forEach(function (c, i) { pens[c].weights.push({ kg: [15.2, 14.1, 16.8][i], day: 0, at: daysAgoAt(pens[c].age, 8, 0), who: OTHER }); });
    pens.A01.weights.push({ kg: 24.6, day: 4, at: daysAgoAt(pens.A01.age - 4, 9, 15), who: ME }); pens.A01.sex = { boar: 6, gilt: 6 };
    // identity: A01 all done; A02 four of twelve so far, one kept for breeding
    if (scheme === 'tag' || scheme === 'notch') { ident('A01', 12, 2, 10, 0, []); ident('A02', 4, 0, 7, 30, [1]); }
    if (scheme === 'breeders') {
      ident('A01', 1, 2, 10, 0, [0]); pens.A01.picked = { at: daysAgoAt(2, 10, 5), who: ME };
      ident('A02', 1, 0, 7, 30, [0]);

  }

  var S;
  function load() {
    try { S = (window.AtlasBare && window.AtlasBare.bare) ? null : JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }   // a bare atlas screen starts from the sample and keeps nothing
    if (!S || !S.pens) S = seed('tag');
  }
  function save() { if (window.AtlasBare && window.AtlasBare.bare) return; try { sessionStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private window: the demo still runs */ } }
  function reset() { S = seed(S ? S.scheme : 'tag'); save(); }
  /* A different farm: switching the scheme starts the demo again on that farm */
  function setScheme(s) { S = seed(s); save(); }

  /* ---- reading ---- */
  function hasId() { return S.scheme !== 'none'; }
  function steps() { return PLAN.map(function (t) { return t.key; }).concat(hasId() ? ['id'] : []); }
  function plan(k) { return k === 'id' ? (hasId() ? ID : null) : PLAN.filter(function (t) { return t.key === k; })[0] || null; }
  function idCount(p) { return Math.max(0, Math.min(p.alive, p.ids.length - p.idOut + p.idIn)); }
  function breeders(p) { return p.ids.filter(function (x) { return x.keep; }).length; }
  function need(p, k) {
    if (k === 'id') return S.scheme === 'breeders' ? 0 : Math.max(0, p.alive - idCount(p));
    return Math.max(0, p.alive - p.tr[k].got);
  }
  function recs(code, k) { return S.records.filter(function (r) { return r.pen === code && (!k || r.tr === k); }); }
  /* One step in one pen: 'done' | 'left' (given, some held back for later) | 'due' | 'late' | 'coming' */
  function status(p, k) {
    var t = plan(k);
    var window = p.age < t.from ? 'coming' : p.age > t.to ? 'late' : 'due';
    if (k === 'id') {
      if (S.scheme === 'breeders') return p.picked ? 'done' : window;
      return need(p, k) === 0 ? 'done' : window;
    }
    var n = need(p, k), given = recs(p.code, k).length > 0;
    if (n === 0) return given || p.tr[k].got > 0 ? 'done' : (p.age < t.from ? 'coming' : 'done');
    if (given) return 'left';
    return window;
  }
  function todo(p) { return steps().filter(function (k) { var s = status(p, k); return s === 'due' || s === 'late' || s === 'left'; }); }
  function coming(p) { return steps().filter(function (k) { return status(p, k) === 'coming'; }); }
  function pens() { return Object.keys(S.pens).sort().map(function (c) { return S.pens[c]; }); }
  function last() { var r = S.records.slice().sort(function (a, b) { return b.at - a.at; })[0]; return r || null; }
  /* Several pens at once: where a pen sits for one step — 'now' (inside the window, or left from before), 'early', 'late', 'done' */
  function bulkPlace(p, k) {
    var s = status(p, k);
    if (s === 'done') return 'done';
    if (s === 'left' || s === 'due') return 'now';
    return s === 'coming' ? 'early' : 'late';
  }
  function sameBatch(a, b) { return a.code !== b.code && b.age >= BATCH.firstDay && b.age <= BATCH.lastDay; }
  /* The next ID to suggest: the farm's next tag number, or this litter's next notch */
  function nextNo(code) {
    var p = S.pens[code];
    if (S.scheme === 'notch') {
      var used = p.ids.filter(function (x) { return x.notch; }).map(function (x) { return +String(x.notch).split('-')[1] || 0; });
      return p.litter + '-' + ((used.length ? Math.max.apply(null, used) : 0) + 1);
    }
    var max = FIRST_TAG - 1;
    Object.keys(S.pens).forEach(function (c) { S.pens[c].ids.forEach(function (x) { if (x.tag && +x.tag > max) max = +x.tag; }); });
    return tag6(max + 1);
  }
  function taken(no) {
    return Object.keys(S.pens).some(function (c) { return S.pens[c].ids.some(function (x) { return x.tag === String(no) || x.notch === String(no); }); });
  }

  /* ---- writing: every change keeps the state before it, so the last one can be undone ---- */
  function change(kind, fn) {
    if (S.ended) return null;
    var before = JSON.stringify(Object.assign({}, S, { undo: null }));
    var out = fn();
    S.undo = { kind: kind, before: before };
    save();
    return out;
  }
  function undo() {
    if (!S.undo) return false;
    S = JSON.parse(S.undo.before); S.undo = null; save();
    return true;
  }
  /* Take back treatment records by id (the in-place "Recorded · Undo"): each one's piglets come off, the reason before it
     comes back. Works for any of this phone's records, not only the last change. */
  function unrecord(ids) {
    if (S.ended) return;
    [].concat(ids).forEach(function (id) {
      var r = S.records.filter(function (x) { return x.id === id; })[0];
      if (!r || !S.pens[r.pen].tr[r.tr]) return;
      var t = S.pens[r.pen].tr[r.tr];
      t.got = Math.max(0, t.got - r.n); t.why = r.prevWhy || '';
      S.records.splice(S.records.indexOf(r), 1);
    });

  }

    S.records.push(r);

    p.tr[k].why = need(p, k) > 0 ? (opts.why || p.tr[k].why || '') : '';

  function submit(code, items) {

  function identifyForm(code, form) {

        var x = { no: r.tag || r.notch, tag: r.tag || '', notch: r.notch || '', sex: r.sex, kg: r.kg == null || r.kg === '' ? null : +r.kg, keep: keep, at: now, who: ME };
        p.ids.push(x);
        S.records.push({ id: 'r' + (++S.seq), pen: code, tr: 'id', n: 1, no: x.no, at: now, day: p.age, who: ME, mark: st === 'late' ? 'late' : '' });
      });
