<style>/* ../../../design-system/components/bundle.css */

/* Sentri — the shared stylesheet, in load order:
   1. aliases from the generated tokens to the names the components read
   2. base elements and controls (from farrowing-astra-concept.css, the prototypes' common base)
   3. sentri-visual-foundation.css (its :root palette now comes from tokens.css)
   4. astra-surfaces.css (page / drawer presentation)
   5. sentri-components.css (the SentriUI parts), verbatim.
   Screens scope the foundation to a phone root: wrap content in .inspection-phone or .farrowing-phone
   and mark the container data-st-context="page" or "drawer". */
:root{--sans:var(--font-sans);--mono:var(--font-mono);--wash:var(--well)}

/* 2 · base */
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;border:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3e6890;outline-offset:3px}
button:disabled,button[aria-disabled=true]{cursor:default;color:#92998d;background:#f1f2ed;border-color:#d9ddd3}
svg{width:20px;height:20px;display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.scrim{position:absolute;inset:42px 0 0;background:#37402c24;backdrop-filter:blur(1.4px);z-index:2;width:100%}
.sheet{position:absolute;bottom:0;left:0;right:0;z-index:3;background:white;border-radius:28px 28px 0 0;box-shadow:0 -10px 40px #27351d0b;display:flex;flex-direction:column;max-height:calc(100% - 80px)}
.sheet-body{padding:0 18px;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sheet-footer{flex-shrink:0;display:flex;gap:10px;padding:17px 18px 28px;border-top:1px solid var(--line);background:white;position:relative}
.sheet-footer:after{content:'';position:absolute;bottom:8px;left:calc(50% - 46px);height:4px;width:92px;border-radius:4px;background:#dce0d4}
.button{min-height:52px;padding:10px 17px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #aab2a1;background:white;border-radius:13px;font-weight:700;font-size:14px;text-align:center;line-height:1.3}
.button.primary{flex:1;background:var(--ink);border-color:var(--ink);color:white}
.button.primary:disabled{background:#e9ece3;border-color:#e9ece3;color:#92998d}
.button.secondary{min-width:86px;font-weight:600}
.button:hover:not(:disabled){filter:brightness(.96)}
.button:active:not(:disabled){transform:translateY(1px)}
.button.danger:not([aria-disabled="true"]){background:var(--red);border-color:var(--red)}
.icon-button{background:transparent;min-width:44px;height:44px;display:grid;place-items:center;border-radius:10px;position:relative}
.segment{display:flex;border-radius:10px;padding:3px;margin-top:16px;border:1px solid transparent}
.segment button{flex:1;min-height:38px;background:transparent;font-size:12px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:9px;font-size:12px;font-weight:600;margin:18px 0 0}
.field textarea,.field input,.field select{width:100%;border:1px solid #aeb8a1;border-radius:11px;padding:12px;background:white;color:var(--ink);font-size:14px;min-height:46px}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.field.error input,.field.error textarea{border-color:var(--red)}
@media(prefers-reduced-motion:reduce){.button:active{transform:none}}

/* 3 · sentri-visual-foundation.css */
/* Shared visual vocabulary for the current Sentri prototypes. */
body{background:var(--ground);color:var(--ink)}
:is(.farrowing-phone,.inspection-phone){background:var(--app-background);border-color:#c7d0bd}
:is(.farrowing-phone,.inspection-phone) :is(.statusbar,.task-header){background:var(--app-background)}
:is(.farrowing-phone,.inspection-phone) .task-header{padding:4px 18px 10px;gap:12px}
:is(.farrowing-phone,.inspection-phone) .task-header h2{font-size:22px;line-height:1.25;font-weight:500;letter-spacing:-.6px}
:is(.farrowing-phone,.inspection-phone) .task-header>.task-return{width:44px;min-width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff}
:is(.farrowing-phone,.inspection-phone) .task-activity{padding-left:18px;padding-right:18px;color:var(--muted)}
:is(.farrowing-phone,.inspection-phone) .task-activity strong{font-weight:500}
:is(.farrowing-phone,.inspection-phone) :is(.sheet,.dialog){background:var(--paper);color:var(--ink)}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]{background:var(--app-background)}
:is(.farrowing-phone,.inspection-phone) .sheet>.utility-header{padding-left:18px;padding-right:18px;border-color:var(--line)}
:is(.farrowing-phone,.inspection-phone) :is(.utility-header h3,.page-header h3,.dialog h3){font-size:20px;line-height:1.3;font-weight:500;letter-spacing:-.4px}
:is(.farrowing-phone,.inspection-phone) :is(.section-title,.read-heading,.section-heading){font-size:13px;font-weight:500;letter-spacing:0}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]>.sheet-body{padding:18px 18px 24px}
:is(.farrowing-phone,.inspection-phone) :is(.sheet-footer,.inspect-dock,.room-dock){background:#fff;border-color:var(--line)}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]>.sheet-footer{padding-left:18px;padding-right:18px}
:is(.farrowing-phone,.inspection-phone) :is(.button,.key){font-weight:500;border-radius:12px;min-height:44px}
:is(.farrowing-phone,.inspection-phone) .button.secondary{background:#fff;border-color:#bdc7b6;color:var(--ink)}
:is(.farrowing-phone,.inspection-phone) .button.primary:not(:disabled):not([aria-disabled="true"]){background:var(--ink);border-color:var(--ink);color:#fff}
:is(.farrowing-phone,.inspection-phone) :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),select,textarea){border-color:#bdc7b6;border-radius:12px}
:is(.farrowing-phone,.inspection-phone) :is(.room-tabs,.segment,.scope-tabs,.health-tabs){background:var(--well);border-color:var(--line)}
:is(.farrowing-phone,.inspection-phone) :is(.room-tabs,.segment,.scope-tabs,.health-tabs) button{font-weight:400;min-height:44px}
:is(.farrowing-phone,.inspection-phone) :is(.room-tabs,.segment,.scope-tabs,.health-tabs) :is(button[aria-pressed=true],button[aria-selected=true],button.on){font-weight:500;background:#fff;color:var(--ink)}
:is(.farrowing-phone,.inspection-phone) :is(button,a,input,select,textarea,summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* Action semantics remain explicit; destructive controls never inherit the green treatment. */
:is(.farrowing-phone,.inspection-phone) .button:is(.danger,.task-end-confirm):not(:disabled):not([aria-disabled="true"]){background:var(--red);border-color:var(--red);color:#fff}
:is(.farrowing-phone,.inspection-phone) .button.task-end-early:not(:disabled):not([aria-disabled="true"]){background:#fff1ee;border-color:var(--red);color:var(--red)}
@media(max-width:370px){
 :is(.farrowing-phone,.inspection-phone) .task-header{gap:8px;padding-left:12px;padding-right:12px}
 :is(.farrowing-phone,.inspection-phone) .task-header h2{font-size:20px}
 :is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]>:is(.utility-header,.sheet-body,.sheet-footer){padding-left:12px;padding-right:12px}
}

/* Shared room context and explicit record commits. */
:is(.farrowing-phone,.inspection-phone) .task-context-card{background:#fff;border-color:var(--line);border-radius:18px;box-shadow:0 3px 12px #26351e04}
:is(.farrowing-phone,.inspection-phone) .tc-task:before{background:var(--line)}
:is(.farrowing-phone,.inspection-phone) .tc-task:active{background:var(--green-wash)}
:is(.farrowing-phone,.inspection-phone) .tc-heading{color:var(--muted);font-weight:500}
.farrowing-phone .button[data-action="deletePhoto"]:not(:disabled){background:var(--red);border-color:var(--red);color:#fff}

/* 4 · astra-surfaces.css */
/* Full pages share the phone canvas; drawers retain their standard sizes. */
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]{inset:0;height:100%;max-height:100%;border-radius:0;box-shadow:none;background:#fff;z-index:3}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]>.statusbar{flex:none;height:42px;min-height:42px}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]>.utility-header{display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:8px 21px 18px;border-bottom:1px solid var(--line);margin:0;flex:none}
:is(.farrowing-phone,.inspection-phone) .sheet-footer>.surface-back{display:flex;align-items:center;justify-content:center;gap:4px;width:86px;min-width:86px;min-height:48px;margin:0;padding:8px;background:#fff;border:1px solid #b6c0ad;border-radius:12px;box-shadow:none;flex:none;font:500 14px var(--sans);color:var(--ink,#253021);white-space:nowrap}
:is(.farrowing-phone,.inspection-phone) .sheet-footer>.surface-back>svg{width:16px;height:16px;flex:none;transform:none}
:is(.farrowing-phone,.inspection-phone) .sheet-footer>.surface-back:active{background:#f5f6f1;color:#526847}
:is(.farrowing-phone,.inspection-phone) .sheet-footer>.surface-back:focus-visible{outline:2px solid #40698c;outline-offset:2px}
:is(.farrowing-phone,.inspection-phone) .sheet>.sheet-footer.record-toolbar{grid-template-columns:86px minmax(0,1fr)}
.inspection-phone .actions-bottom-bar>.surface-back:after{display:none}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]>.sheet-body{min-height:0;flex:1;overflow-y:auto;padding:20px 21px 24px;overscroll-behavior:contain}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]>.sheet-footer{flex:none;padding:14px 21px 28px}
/* Keep the return control stationary between pig details and its action menu. */
.inspection-phone .sheet>.sheet-footer.record-toolbar:is(.pig-detail-footer,.actions-bottom-bar){padding:14px 21px 28px;min-height:91px;flex:none}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"] .sheet-footer:after{display:none}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]:after{content:"";position:absolute;bottom:8px;left:calc(50% - 46px);height:4px;width:92px;background:#dce0d4;border-radius:4px;pointer-events:none}
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"] .sheet-footer>.button:only-child{width:100%;flex:1}
.farrowing-phone .sheet[data-st-context="drawer"],.inspection-phone .sheet[data-st-context="drawer"]{background:var(--paper,#fff);max-height:var(--drawer-max-height,calc(100% - 24px));overflow:hidden}
.farrowing-phone .sheet[data-st-context="drawer"]>.sheet-body,.inspection-phone .sheet[data-st-context="drawer"]>.sheet-body{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.farrowing-phone .sheet[data-st-context="drawer"][data-size="compact"],.inspection-phone .sheet[data-st-context="drawer"][data-size="compact"]{height:auto;max-height:var(--drawer-compact-max,42%)}
.farrowing-phone .sheet[data-st-context="drawer"][data-size="short"],.inspection-phone .sheet[data-st-context="drawer"][data-size="short"]{height:auto;max-height:var(--drawer-short-max,58%)}
.farrowing-phone .sheet[data-st-context="drawer"][data-size="medium"],.inspection-phone .sheet[data-st-context="drawer"][data-size="medium"]{height:var(--drawer-medium-height,76%);max-height:var(--drawer-medium-max,76%)}
.farrowing-phone .sheet[data-st-context="drawer"][data-size="long"],.inspection-phone .sheet[data-st-context="drawer"][data-size="long"]{height:var(--drawer-long-height,85%);max-height:var(--drawer-long-max,85%)}
.farrowing-phone .sheet[data-st-context="drawer"][data-sizing="content"],.inspection-phone .sheet[data-st-context="drawer"][data-sizing="content"]{height:auto}
.farrowing-phone .sheet[data-presentation="page"] .sow-header-actions:empty{display:none}
:is(.farrowing-phone,.inspection-phone) .page-background{position:absolute;inset:0;pointer-events:none;z-index:1}
:is(.farrowing-phone,.inspection-phone) .page-background>.sheet{z-index:1}
.inspection-phone .sheet[data-presentation="page"].single-action-sheet>.sheet-body{display:block}
.inspection-phone .sheet[data-presentation="page"].single-action-sheet .bulk-controls{max-width:100%}
.inspection-phone .sheet[data-presentation="page"].single-action-sheet .bulk-controls{padding:16px;gap:20px}
.inspection-phone .sheet[data-presentation="page"].single-action-sheet .field{font-size:13px;gap:8px}
.inspection-phone .sheet[data-presentation="page"].single-action-sheet :is(.field input,.field select,.bulk-condition-button){min-height:48px;font-size:14px;padding:12px}
.inspection-phone .sheet[data-presentation="page"].single-action-sheet .feed-optional-open{min-height:44px}

/* A lone return action owns the footer; paired Back remains secondary. */

/* 5 · sentri-components.css (the waiting face, ADR 0002: the ink / red / red-wash register rules skip aria-disabled) */
/* Canonical shared components, loaded after legacy prototype styles.
   Context belongs to the containing page/drawer, not its individual panels. */
:root{--st-canvas:#f6f7f1;--st-paper:#fff;--st-inset:#f6f8f1;--st-ink:#20291f;--st-muted:#657060;--st-line:#dfe4d8;--st-rule:#e8eddf;--st-panel-bg:var(--st-paper);--st-space-section:24px;--st-radius:18px;--drawer-compact-max:42%;--drawer-short-max:58%;--drawer-medium-height:76%;--drawer-medium-max:76%;--drawer-long-height:85%;--drawer-long-max:85%}
[data-st-context="page"]{--st-panel-bg:var(--st-paper);--st-context-bg:var(--st-canvas)}
[data-st-context="drawer"]{--st-panel-bg:var(--st-inset);--st-context-bg:var(--st-paper)}
:is(.inspection-phone,.farrowing-phone) .sheet[data-st-context]{background:var(--st-context-bg)}
.st-heading.st-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 12px;padding:0;min-height:0;border:0;background:transparent;color:var(--st-ink)}
.st-heading .st-heading-main{min-width:0;flex:1}
.st-heading.st-heading .st-heading-title{display:flex;align-items:center;gap:8px;font:500 13px/1.5 var(--sans,'Plus Jakarta Sans',sans-serif);letter-spacing:0;margin:0;padding:0;border:0;color:var(--st-ink);text-transform:none}
.st-heading.st-heading .st-heading-title>span:not(.st-heading-icon){font:inherit;letter-spacing:inherit;color:inherit;margin:0}
.st-heading-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:16px;height:20px;color:var(--st-muted)}
.st-heading-icon svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.st-heading.st-heading .st-heading-description{font:400 11px/1.5 var(--sans,'Plus Jakarta Sans',sans-serif);letter-spacing:0;color:var(--st-muted);margin:5px 0 0}
.st-heading[data-has-icon="true"] .st-heading-description{margin-left:24px}
.st-heading-aside{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;flex:none;max-width:46%;min-height:20px}
.st-heading .st-heading-meta{font:400 10px/1.5 var(--sans,'Plus Jakarta Sans',sans-serif);color:var(--st-muted);white-space:normal;text-align:right}
.st-heading-action{display:flex;align-items:center}
.st-heading .st-heading-action :is(button,a){display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:-12px 0;padding:0 0 0 4px;border:0;border-radius:6px;background:transparent;font:500 11px/1.5 var(--sans,'Plus Jakarta Sans',sans-serif);color:var(--st-ink);text-decoration:none}

.st-row.st-row .st-row-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}

button.st-row{cursor:pointer}
button.st-row:active:not(:disabled){background:#f1f5eb}
button.st-row:disabled{opacity:.5;cursor:default}

.st-panel.st-row-group{padding:0;overflow:hidden}

/* Category titles inherit the standard section style; nesting establishes hierarchy. */

/* Actions and destinations share the same row geometry and contextual group. */
.st-log.st-log{padding:16px;margin:0}

.st-log-entry>small{display:block;font:400 10px/1.5 var(--sans,'Plus Jakarta Sans',sans-serif);color:var(--st-muted);margin-top:4px}

.st-section+.st-section{margin-top:var(--st-space-section)}
/* Screen-level controls follow the existing footer/back contract. */
:is(.inspection-phone,.farrowing-phone,.device) :is(.button.primary,.primary-button,.lifecycle-primary):not(:disabled):not([aria-disabled="true"]):not(.danger):not(.task-end-early):not(.task-end-confirm){background:#20291f;border-color:#20291f;color:#fff}

@media(max-width:370px){.st-panel,.st-facts.st-facts,.st-log.st-log{padding:12px}.st-panel.st-row-group{padding:0}.st-heading{gap:8px}.st-row.st-row{padding-left:12px;padding-right:12px}}

.device .drawer[data-st-context="drawer"]{background:var(--st-paper);max-height:var(--drawer-medium-max);height:auto;overflow:hidden}
.device .drawer[data-st-context="drawer"][data-size="compact"]{max-height:var(--drawer-compact-max)}

/* Picker field: the mobile-standard choice control that replaces native selects.
   The trigger echoes text-input geometry; the sheet lists options as tappable rows. */
.st-picker-field .st-picker-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;padding:12px;border:1px solid #bdc7b6;border-radius:12px;background:var(--st-paper);color:var(--st-ink);font:400 14px/1.5 var(--sans,'Plus Jakarta Sans',sans-serif);text-align:left;touch-action:manipulation}

.st-picker-trigger>svg{width:15px;height:15px;flex:none;color:var(--st-muted);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.st-picker-trigger:disabled{opacity:.5}
.st-picker-options{display:flex;flex-direction:column;margin:0;padding:0}
.st-picker-option{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:12px 2px;border:0;border-bottom:1px solid var(--st-rule);border-radius:0;background:transparent;color:var(--st-ink);text-align:left;font-family:var(--sans,'Plus Jakarta Sans',sans-serif);touch-action:manipulation}

.st-picker-option[aria-selected="true"] .st-picker-option-copy strong{font-weight:600}
.st-picker-option:active{background:#f1f5eb}
:is(.st-picker-trigger,.st-picker-option):focus-visible{outline:3px solid #577fa6;outline-offset:2px}
/* Filter button: one canonical toolbar control for every room/list screen. */
:is(.inspection-phone,.farrowing-phone) .room-filter-button{min-width:48px;height:48px;display:grid;place-items:center;background:var(--st-paper);border:1px solid var(--st-line);border-radius:12px;position:relative;color:var(--st-ink)}
:is(.inspection-phone,.farrowing-phone) .room-filter-button svg{width:17px;height:17px}
:is(.inspection-phone,.farrowing-phone) .filter-badge{position:absolute;right:-3px;top:-4px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;background:var(--st-ink);color:#fff;font:10px var(--mono,'IBM Plex Mono',monospace)}

.device .st-home-drawer-footer>.secondary{flex:1;min-width:0;min-height:48px;margin:0}
.device .st-home-drawer-footer>.danger{background:#a13a2d;border-color:#a13a2d;color:#fff}

/* The product canvas scrolls by touch; desktop scrollbar chrome belongs outside it. */
:is(.farrowing-phone,.inspection-phone) .sheet[data-st-context]>.sheet-body,
.device :is(.app-scroll,.drawer-body){scrollbar-width:none;-webkit-overflow-scrolling:touch}
:is(.farrowing-phone,.inspection-phone) .sheet[data-st-context]>.sheet-body::-webkit-scrollbar,
.device :is(.app-scroll,.drawer-body)::-webkit-scrollbar{display:none;width:0;height:0}

/* Shared chooser: catalogue = flat; short ungrouped choices = one muted inset.
   A second text line never changes selection behavior or adds a nested card. */
.inspection-phone .sheet.picker-step :is(.catalog-categories,.catalog-items,.chooser-options){border:0;border-radius:0;background:transparent;overflow:visible}
.inspection-phone .sheet.picker-step:is(.medicine-picker-step,.health-picker-step)>.sheet-body{background:var(--st-paper)}
.inspection-phone .sheet.picker-step .st-chooser-list{border:0;border-radius:0;background:transparent;min-width:0;flex:none}
.inspection-phone .sheet.picker-step .st-chooser-list[data-chooser-tone="inset"]{background:var(--st-inset);border-radius:14px;padding:4px 10px}
.inspection-phone .sheet.picker-step .st-chooser-list .st-picker-options{border:0;border-radius:0;background:transparent;overflow:visible}
.inspection-phone .sheet.picker-step :is(.st-picker-option,.medicine-option,.catalog-item,.catalog-category){display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 8px;box-sizing:border-box;border:0;border-radius:0;background:transparent}
.inspection-phone .sheet.picker-step :is(.st-picker-option,.medicine-option,.catalog-item,.catalog-category)+:is(.st-picker-option,.medicine-option,.catalog-item,.catalog-category){border-top:1px solid var(--st-rule)}
.inspection-phone .sheet.picker-step :is(.st-picker-option[aria-selected="true"],.medicine-option[aria-pressed="true"],.catalog-item:has(input:checked)){background:transparent;color:var(--st-ink)}
.inspection-phone .sheet.picker-step :is(.st-picker-option,.medicine-option,.catalog-category):active{background:#eaf0e2}
.inspection-phone .sheet.picker-step .chooser-selection{border:0;border-radius:0;background:transparent;width:22px;height:22px;flex:none}
.inspection-phone .sheet.picker-step .st-chooser-subtitle{margin:0;padding:16px 8px 6px;font:600 12px/1.4 var(--sans);color:var(--st-muted)}
.inspection-phone .sheet.picker-step .st-picker-option-copy{flex:1;min-width:0}
.inspection-phone .sheet.picker-step :is(.st-picker-option strong,.medicine-option strong,.catalog-item strong){overflow-wrap:anywhere}
.inspection-phone .sheet.picker-step .st-picker-option small{font:400 11px/1.4 var(--sans);color:var(--st-muted)}
.inspection-phone .sheet.picker-step .catalog-path{background:transparent}

/* Drawer convention: white canvas, contextual tinted panels; rules only between rows. */
.inspection-phone .sheet.picker-step :is(.catalog-categories,.catalog-items,.chooser-options){background:var(--st-panel-bg,var(--st-inset));border:1px solid var(--st-line);border-radius:var(--st-radius);overflow:hidden;padding:0}
.inspection-phone .sheet.picker-step :is(.catalog-category,.catalog-item,.medicine-option){padding:14px;min-height:56px}
.inspection-phone .sheet.picker-step :is(.health-catalog,.medicine-results){border:0;padding-top:0}
.inspection-phone .sheet.picker-step :is(.health-catalog,.medicine-results)::before{display:none}
.inspection-phone .sheet.picker-step .catalog-group h5{border:0}
.inspection-phone .sheet.picker-step .chooser-header-back{width:44px;height:44px;min-width:44px;padding:12px;border:0;background:transparent;box-shadow:none;border-radius:50%;margin:0}
.inspection-phone .sheet.picker-step .chooser-header-back svg{width:20px;height:20px}

/* Selection is a check, not an extra rectangle inside the contextual panel. */
.inspection-phone .sheet.picker-step .st-chooser-section+.st-chooser-section{margin-top:18px}
.inspection-phone .sheet.picker-step .st-chooser-section .st-chooser-subtitle{padding:0 4px 8px;color:var(--st-ink);font-size:13px;font-weight:600}
.inspection-phone .sheet.picker-step .st-chooser-section-options{background:var(--st-panel-bg,var(--st-inset));border:1px solid var(--st-line);border-radius:var(--st-radius);overflow:hidden}
.inspection-phone .sheet.picker-step .st-chooser-section-options .st-picker-option{padding:12px 14px}
.inspection-phone .sheet.picker-step .st-chooser-section-options .st-picker-option-copy{display:flex;flex-direction:row;align-items:baseline;gap:12px}
.inspection-phone .sheet.picker-step .st-chooser-section-options .st-picker-option-copy strong{min-width:28px}
.inspection-phone .sheet.picker-step .medicine-category-row>span{display:flex;flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;min-width:0}
.inspection-phone .sheet.picker-step .medicine-category-row small{flex:none;white-space:nowrap}
.inspection-phone .sheet.picker-step .medicine-category-row strong{min-width:0;overflow-wrap:anywhere}

.inspection-phone .sheet.record-optional-editor[data-size="short"],.inspection-phone .sheet.brand-picker-step[data-size="short"]{min-height:min(360px,58%);max-height:58%}
.inspection-phone .sheet.record-optional-editor>.sheet-body{flex:1;display:flex;flex-direction:column;min-height:0}
.inspection-phone .sheet.record-optional-editor textarea.notes-input{flex:1;width:100%;height:auto;min-height:120px;box-sizing:border-box;resize:none;padding:14px;font:400 14px/1.5 var(--sans);color:var(--st-ink);background:var(--st-inset)}


/* Chooser: one row geometry for every level and shape (flat, sectioned, nested).
   Headings and row text share one left edge; the trailing slot is always 24px on the right. */
.st-choice-group.st-choice-group{margin:0 0 20px;padding:0;border:0;background:transparent}
.st-choice-group:last-child{margin-bottom:0}
.st-choice-heading.st-choice-heading{margin:0;padding:0 17px 8px;border:0;font:600 12px/1.4 var(--sans,'Plus Jakarta Sans',sans-serif);letter-spacing:0;text-transform:none;color:var(--st-muted)}
.st-choice-panel{background:var(--st-panel-bg,var(--st-inset));border:1px solid var(--st-line);border-radius:var(--st-radius);overflow:hidden}
.st-choice-row.st-choice-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0;padding:10px 16px;box-sizing:border-box;border:0;border-radius:0;background:transparent;box-shadow:none;color:var(--st-ink);font:inherit;text-align:left;cursor:pointer}
.st-choice-row.st-choice-row+.st-choice-row{border-top:1px solid var(--st-rule)}
.st-choice-row.st-choice-row:active{background:#eaf0e2}
.st-choice-copy{display:flex;flex:1;flex-direction:column;gap:2px;min-width:0}
.st-choice-label{font:500 14px/1.4 var(--sans,'Plus Jakarta Sans',sans-serif);color:var(--st-ink);overflow-wrap:anywhere}
.st-choice-meta{font:400 12px/1.4 var(--sans,'Plus Jakarta Sans',sans-serif);color:var(--st-muted)}
.st-choice-row[aria-pressed="true"] .st-choice-label{font-weight:600}
.st-choice-trail{display:grid;place-items:center;flex:none;width:24px;height:24px;color:var(--st-ink)}
.st-choice-trail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st-choice-row[data-mode="navigate"] .st-choice-trail{color:var(--st-muted)}
.st-choice-row[data-mode="navigate"] .st-choice-trail svg{width:18px;height:18px}
.st-choice-trail input[type="checkbox"]{width:20px;height:20px;margin:0;accent-color:var(--st-ink)}
.st-choice-search.st-choice-search{margin:0 0 20px}
.st-choice-empty{margin:0;padding:24px 17px;font:400 13px/1.5 var(--sans,'Plus Jakarta Sans',sans-serif);color:var(--st-muted)}

/* 6 · Field cards (candidate, ADR 0001): Stepper, Measure, Numpad.
   Tokens only, including the candidate sizes (stepper-row-min, hero-key, glyph-*, caret-width, status-dot, space-key-gap). */
.st-stepper.st-stepper,.st-measure.st-measure,.st-numpad.st-numpad{margin:0;padding:0;border:0;background:transparent;color:var(--ink);font-family:var(--font-sans)}
/* shared: keys, faces, hint line, text action */
.st-stepper-key.st-stepper-key,.st-numpad-key.st-numpad-key{margin:0;padding:0;min-width:0;min-height:0;box-shadow:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.st-stepper-face,.st-numpad-key.st-numpad-key{display:grid;place-items:center;border:1px solid var(--control-border);border-radius:var(--radius-control);background:var(--paper);color:var(--ink);transition:transform 120ms ease}
:is(.st-stepper-face,.st-numpad-key) svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
/* the floor-gray: a key with nothing to do (DS README, States) */
.st-stepper-key[aria-disabled="true"] .st-stepper-face,.st-numpad-key.st-numpad-key[aria-disabled="true"]{background:var(--disabled-fill);border-color:var(--disabled-fill);color:var(--disabled-ink);cursor:default}

.tk-page-aside { flex: none; display: flex; align-items: center; }
.tk-page-title { margin: 0; font: 500 var(--type-page-title-size)/1.3 var(--font-sans); letter-spacing: -0.5px; color: var(--ink); }
.tk-page-desc { margin: 6px 0 0; font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-page-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px var(--space-gutter) var(--space-section); }
.tk-page > .tk-footer { padding-left: var(--space-gutter); padding-right: var(--space-gutter); }

/* ---- TaskDialog: one question over a sheet, rising from the bottom ---- */
.tk-dialog-backdrop { position: absolute; inset: 0; z-index: calc(8 + 10 * var(--tk-layer, 0)); display: flex; flex-direction: column; justify-content: flex-end; background: var(--dialog-backdrop); }
.tk-dialog { display: flex; flex-direction: column; overflow: hidden; max-height: calc(100% - 24px); background: var(--paper);
  border-radius: var(--radius-dialog) var(--radius-dialog) 0 0; box-shadow: var(--shadow-dialog); }
.tk-dialog-body { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: var(--space-gutter-sheet) var(--space-gutter-sheet) 0; }
.tk-dialog-title { display: flex; align-items: center; gap: 7px; margin: 0; font: 500 var(--type-sheet-title-size)/1.3 var(--font-sans); letter-spacing: -0.4px; color: var(--ink); }
.tk-dialog-title svg { width: 16px; height: 16px; }
.tk-dialog-desc { margin: 10px 0 0; font: var(--type-description-size)/1.7 var(--font-sans); color: var(--muted); }
.tk-dialog > .tk-footer { margin: 15px var(--space-gutter-sheet) 0; padding: 18px 0 var(--space-footer-bottom); }
.tk-dialog > .tk-footer::after { display: none; }

/* ---- Skeleton 2 (owner round 5: match farrowing) ---- */

/* TaskStepper · row face: farrowing's entry row — the label 15px/500, outlined keys (both), a mono 18px value; pressed ink. */
.st-stepper.tk-stepper[data-face="row"] { min-height: var(--entry-row-min); column-gap: var(--space-key-gap); }
.st-stepper.tk-stepper[data-face="row"] + .st-stepper.tk-stepper[data-face="row"] { border-top: 1px solid var(--line); }
.tk-stepper[data-face="row"] .st-stepper-label { font: 500 var(--type-entry-label-size)/1.4 var(--font-sans); }
.tk-stepper[data-face="row"] .st-stepper-key { width: var(--touch-min); min-height: var(--entry-row-min); }
.tk-stepper:is([data-face="row"], [data-face="well"]) .st-stepper-face { width: var(--touch-min); height: var(--touch-min); border: 1px solid var(--task-key-border);
  border-radius: var(--radius-control); background: var(--paper); color: var(--ink); }
.tk-stepper[data-face="well"] .st-stepper-face { width: var(--field-height); height: var(--field-height); }
.tk-stepper:is([data-face="row"], [data-face="well"]) .st-stepper-key:not([data-step^="-"]):not([aria-disabled="true"]) .st-stepper-face { background: var(--paper); border-color: var(--task-key-border); color: var(--ink); }
.tk-stepper:is([data-face="row"], [data-face="well"]) .st-stepper-face svg { width: var(--glyph-key-task); height: var(--glyph-key-task); stroke-width: 2.2; }
.tk-stepper .st-stepper-key[aria-disabled="true"] .st-stepper-face { background: var(--well); border-color: var(--line); color: var(--disabled-ink); }
.tk-stepper.tk-stepper .st-stepper-key.st-stepper-key:not([aria-disabled="true"]):is(:active, [data-preview~="pressed"]) .st-stepper-face { background: var(--ink); border-color: var(--ink); color: var(--paper); filter: none; }
.tk-stepper[data-face="row"] .st-stepper-value { min-width: 3ch; font: 600 var(--type-step-value-size)/1.3 var(--font-mono); }
.tk-stepper[data-face="row"][data-zero] .st-stepper-value { color: var(--ink); }
/* TaskStepper · well face: the label as a section title, then the keys and value on a well (Foster, Reconcile). */
.st-stepper.tk-stepper[data-face="well"] { row-gap: 10px; }
.tk-stepper[data-face="well"] .st-stepper-copy { align-items: flex-start; text-align: left; }
.tk-stepper[data-face="well"] .st-stepper-label { font: 500 var(--type-section-title-size)/1.5 var(--font-sans); color: var(--ink); }
.tk-stepper[data-face="well"] .st-stepper-keys { padding: var(--space-row-y); border-radius: var(--radius-inset); background: var(--well); }
.tk-stepper[data-face="well"] .st-stepper-key { width: var(--field-height); min-height: var(--field-height); }
.tk-stepper[data-face="well"] .st-stepper-value { font: 600 var(--type-figure-well-size)/1.3 var(--font-mono); letter-spacing: 0; color: var(--ink); }
.tk-stepper[data-face="well"][data-zero] .st-stepper-value { color: var(--ink); }
.tk-stepper[data-face="well"] .st-stepper-hint.st-stepper-hint { justify-content: flex-start; text-align: left; font-size: var(--type-description-size); line-height: 1.6; }
/* TaskStepper · count face: the count sheet's hero on the green area; − outlined green, + filled green. */
.st-stepper.tk-stepper[data-face="count"] { padding: var(--space-panel) var(--space-row-y) 10px; border-radius: var(--radius-count); background: var(--green-wash); }
.tk-stepper[data-face="count"] .st-stepper-label { font: 500 var(--type-row-title-size)/1.3 var(--font-sans); color: var(--green); }
.tk-stepper[data-face="count"] .st-stepper-keys { gap: var(--space-heading); min-height: 86px; }
.tk-stepper[data-face="count"] .st-stepper-face { width: var(--hero-key); height: var(--hero-key); border: 1px solid var(--chip-green-border); border-radius: var(--radius-hero-key);
  background: var(--paper); color: var(--green); }
.tk-stepper[data-face="count"] .st-stepper-face svg { width: var(--glyph-key-count); height: var(--glyph-key-count); }
.tk-stepper[data-face="count"] .st-stepper-key:not([data-step^="-"]):not([aria-disabled="true"]) .st-stepper-face { background: var(--green); border-color: var(--green); color: var(--paper);
  box-shadow: 0 3px 8px #225d3520; }
.tk-stepper[data-face="count"] .st-stepper-key[aria-disabled="true"] .st-stepper-face { background: var(--paper); border-color: var(--chip-green-border); color: var(--disabled-ink); box-shadow: none; }
.tk-stepper[data-face="count"] .st-stepper-value { color: var(--count-ink); }

/* TaskPhotos: farrowing's photo line — no well; a camera glyph, the label 13px, `Optional` 10px; an outlined camera key. */
.st-photos.tk-photos { padding: 0; border-radius: 0; background: transparent; }
* + .st-photos.tk-photos { margin-top: var(--space-section); }
.tk-photos .st-photos-head { gap: 6px; }
.tk-photos .st-photos-label { align-items: center; column-gap: 7px; font: 500 var(--type-row-title-size)/1.4 var(--font-sans); }
.tk-photos .st-photos-label small { font: var(--type-meta-size)/1.4 var(--font-sans); color: var(--muted); }
.tk-photos-glyph { display: inline-flex; }
.tk-photos-glyph svg { width: var(--glyph-key); height: var(--glyph-key); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tk-photos .st-photos-camera.st-photos-camera { border: 1px solid var(--task-key-border); border-radius: var(--radius-segment); background: var(--paper); }
.tk-photos .st-photos-items { gap: var(--space-key-gap); padding: var(--space-key-gap) 0; }
.tk-photos .st-photos-thumb.st-photos-thumb { width: var(--photo-thumb-task); height: var(--photo-thumb-task); border: 0; border-radius: 8px; }
.tk-photos .st-photos-hint.st-photos-hint { padding-right: 0; }

/* TaskRow door: farrowing's .disclosure — a title 13px/600, one muted line, a chevron; a line under each. */
.tk-door { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 62px; margin: 0; padding: 15px 0;
  border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; text-align: left; }
.tk-door:active { background: var(--press); }
.tk-door-copy { flex: 1; min-width: 0; }
.tk-door-copy > strong { display: block; font: 600 var(--type-row-title-size)/1.4 var(--font-sans); }
.tk-door-copy > small { display: block; margin-top: 5px; font: var(--type-meta-size)/1.7 var(--font-sans); color: var(--muted); }
.tk-door > svg, .tk-door-main > svg { flex: none; width: 16px; height: 16px; color: var(--ink); }
/* A door with a one-tap at its end (`Record 12`): the door is the copy (and its chevron), the button sits beside it. */
.tk-door[data-act] { padding: 0; gap: var(--space-row-y); }
.tk-door[data-act]:active { background: transparent; }
.tk-door-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 62px; margin: 0; padding: 15px 0;
  border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
.tk-door-main:active { background: var(--press); }
.tk-door[data-act] > .button { flex: none; min-height: var(--touch-min); margin: 0; padding: 0 var(--space-row-x); border-radius: var(--radius-control);
  font: 500 var(--type-button-size)/1.3 var(--font-sans); }

/* TaskChoice: farrowing's choice tiles (Foster: Send / Receive). */
.tk-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tk-choice[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tk-choice-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: var(--choice-tile-min); margin: 0; padding: var(--space-row-y);
  border: 1px solid var(--task-key-border); border-radius: var(--radius-inset); background: var(--paper); color: var(--muted); font: 600 var(--type-button-size)/1.3 var(--font-sans); text-align: center; }
.tk-choice-tile svg { width: 24px; height: 24px; }
.tk-choice-tile[aria-pressed="true"] { background: var(--green-wash); border-color: var(--choice-pressed-border); color: var(--ink); }
.tk-choice-tile:active { background: var(--press); }

/* The status slot with one text action at its end. */
.tk-footer-status[data-action-slot] { display: flex; align-items: center; justify-content: space-between; gap: var(--space-row-y); padding-top: 4px; }
.tk-footer-status[data-action-slot] > p { flex: 1; min-width: 0; margin: 0; }
.tk-footer-status > p[data-tone="amber"] { color: var(--amber); }
.tk-footer-status > p[data-tone="red"] { color: var(--red); }
.tk-footer-status[data-action-slot] > .st-text-action { flex: none; }

/* One left edge per surface: a ChoiceList's group title inside a page or sheet sits on the body's edge, not 17px in. */
:is(.tk-page-body, .tk-sheet-body) .st-choice-heading.st-choice-heading { padding-left: 0; padding-right: 0; }
:is(.tk-page-body, .tk-sheet-body) .st-choice-heading-row { padding-right: 0; }

/* TaskRow: the id column holds its width; a chip wider than it ellipses under the id, so every headline lines up. */
.tk-row-identity { width: var(--animal-id-col); min-width: var(--animal-id-col); }
.tk-row-identity > .tk-chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* A page description or sheet subtitle toned as a whole line. */
:is(.tk-page-desc, .tk-sheet-subtitle)[data-tone="amber"] { color: var(--amber); }
:is(.tk-page-desc, .tk-sheet-subtitle)[data-tone="red"] { color: var(--red); }
:is(.tk-page-desc, .tk-sheet-subtitle)[data-tone="green"] { color: var(--green); }

/* ---- Skeleton 3 ---- */

/* TaskRadios: farrowing's flat radio rows — no panel; 60px rows, a line under each, a 14px/400 label, the radio right. */
.tk-radios .st-choice-panel { background: transparent; border: 0; border-radius: 0; }
.tk-radios .st-choice-row.st-choice-row { min-height: var(--radio-row-min); padding: 0; gap: 10px; border-bottom: 1px solid var(--line); }
.tk-radios .st-choice-row.st-choice-row + .st-choice-row { border-top: 0; }
.tk-radios .st-choice-label, .tk-radios .st-choice-row[data-mode="radio"][aria-checked="true"] .st-choice-label { font: 400 var(--type-button-size)/1.4 var(--font-sans); }
.tk-radios .st-choice-row .st-radio { order: 2; margin-left: auto; border-width: var(--ring-width-fine); border-color: var(--muted); }
.tk-radios .st-choice-row[aria-checked="true"] .st-radio { border-color: var(--ink); }

/* TaskWarning: farrowing's danger band — pale red, 12px red text, text actions, a 10px muted consequence line. */
.tk-warning { margin: 0; padding: var(--space-row-y); border: 1px solid var(--danger-border); border-radius: var(--radius-control); background: var(--red-wash); color: var(--red);
  font: var(--type-choice-meta-size)/1.6 var(--font-sans); }
.tk-warning[data-tone="amber"] { border-color: var(--pending-border); background: var(--amber-wash); color: var(--amber); }
.tk-warning-text { margin: 0; }
.tk-warning-actions { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-row-y); margin-top: 4px; }
.tk-warning-actions > .st-text-action { color: inherit; }
.tk-warning-detail { display: block; margin-top: 4px; font: var(--type-meta-size)/1.6 var(--font-sans); color: var(--muted); }

/* TaskTable: farrowing's comparison table (Choose a unit). Column headings and sublines are 9px, as farrowing
   (`table-heading`, below the 10px floor by the owner's round-5 ruling, like the hold caption). */
.tk-table, .tk-metrics { display: flex; flex-direction: column; }
.tk-table > .st-heading, .tk-metrics > .st-heading { margin: 0 0 var(--space-heading); }
.tk-table-surface { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); }
.tk-table-columns, .tk-table-row { display: grid; grid-template-columns: minmax(78px, 1.5fr) repeat(var(--tk-cols, 3), minmax(0, 1fr)) 18px; column-gap: 8px; align-items: center; }
.tk-table-columns { padding: var(--space-row-y) var(--space-row-x); background: var(--surface); border-bottom: 1px solid var(--line);
  font: var(--type-table-heading-size)/1.3 var(--font-sans); color: var(--muted); }
.tk-table-columns > span:not(:first-child) { text-align: center; }
.tk-table-surface [role="listitem"] + [role="listitem"] { border-top: 1px solid var(--rule); }
.tk-table-row { width: 100%; min-height: var(--animal-row-min); margin: 0; padding: var(--space-row-x); border: 0; background: var(--paper); color: var(--ink);
  font: 500 var(--type-button-size) var(--font-sans); text-align: left; }
.tk-table-row:active { background: var(--green-wash); }
.tk-table-name { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; }
.tk-table-name > :is(strong, small) { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-table-name > strong { font: 500 var(--type-button-size)/1.3 var(--font-sans); }
.tk-table-name > small { font: 400 var(--type-table-heading-size)/1.3 var(--font-sans); color: var(--muted); }
.tk-table-figure { font: 400 var(--type-table-figure-size)/1.3 var(--font-mono); text-align: center; font-variant-numeric: tabular-nums; }
.tk-table-row > svg { width: 18px; height: 18px; color: var(--green); }

/* TaskMetrics: farrowing's performance card — two headline measures, a rule, small totals. */
.tk-metrics-surface { padding: var(--space-panel); border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); }
.tk-metrics-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.tk-metrics-pair > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tk-metrics-pair > div > span { font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-metrics-pair strong { font: 500 var(--type-metric-size)/1.2 var(--font-mono); letter-spacing: -1px; color: var(--ink); }
.tk-metrics-pair strong > small { margin-left: 2px; font-size: var(--type-figure-denominator-size); }
.tk-metrics-pair > div > small { font: var(--type-meta-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-metrics-pair > div > small[data-tone="amber"] { color: var(--amber); }
.tk-metrics-totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: var(--space-panel) 0 0; padding-top: var(--space-row-x); border-top: 1px solid var(--line); }
.tk-metrics-totals > div { min-width: 0; }
.tk-metrics-totals dt { font: var(--type-meta-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-metrics-totals dd { margin: 2px 0 0; font: 500 var(--type-metric-total-size)/1.5 var(--font-mono); color: var(--ink); }
@media (max-width: 370px) {
  .tk-table-columns, .tk-table-row { column-gap: 5px; grid-template-columns: minmax(65px, 1.35fr) repeat(var(--tk-cols, 3), minmax(0, 1fr)) 16px; padding-left: var(--space-row-y); padding-right: var(--space-row-y); }
  .tk-table-name > strong { font-size: var(--type-row-title-size); }
}

/* ---- Skeleton 4 ---- */

/* TaskWarning title (bold, as farrowing), and the End banner (⚠ icon, copy, chevron; the whole band a door). */
.tk-warning-title { display: block; font: 600 var(--type-choice-meta-size)/1.5 var(--font-sans); }
.tk-warning-title + .tk-warning-text { margin-top: 4px; font-size: var(--type-description-size); }
.tk-warning[data-tone="amber"] { border-color: var(--banner-border); background: var(--banner-wash); color: var(--amber); }
.tk-warning[data-banner] { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 80px; text-align: left; }
button.tk-warning[data-banner] { margin: 0; cursor: pointer; }
button.tk-warning[data-banner]:active { filter: brightness(.97); }
.tk-warning-icon { flex: none; align-self: flex-start; display: grid; place-items: center; width: 16px; margin-top: 2px; }
.tk-warning-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tk-warning-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tk-warning-copy > .tk-warning-title + .tk-warning-text { margin-top: 0; line-height: 1.6; }
.tk-warning-go { flex: none; display: grid; place-items: center; }
.tk-warning-go svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* The red band's hierarchy is farrowing's .danger-band: the headline is <strong> (bold, red), the consequence line a <small> (muted, 10px,
   4px under). The amber band and the End banner (data-banner) keep their own look: amber text throughout, as their reference. */
.tk-warning:not([data-tone="amber"]) .tk-warning-title { font-weight: 700; line-height: 1.6; }
.tk-warning:not([data-tone="amber"]):not([data-banner]) .tk-warning-title + .tk-warning-text { margin-top: 4px; font-size: var(--type-meta-size); color: var(--muted); }

/* TaskRadios layout 'row': farrowing's inline field — label (Optional tag, Clear) left, outlined option pills right. */
.st-choice-inline.tk-radios[data-face="row"] { display: flex; align-items: center; justify-content: space-between; gap: var(--space-row-y); min-height: 64px; }
.tk-radios[data-face="row"] .st-choice-inline-label { flex: 1; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; column-gap: var(--space-key-gap);
  font: 500 var(--type-entry-label-size)/1.4 var(--font-sans); }
.tk-radios[data-face="row"] .st-choice-inline-label small { font: 400 var(--type-meta-size)/1.4 var(--font-sans); }
.tk-radios[data-face="row"] .st-choice-inline-clear { min-height: var(--touch-min); }
.tk-radios[data-face="row"] .st-choice-inline-opts { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(66px, 1fr); gap: 6px; align-self: center; }
.tk-radios[data-face="row"] .st-choice-inline-opt.st-choice-inline-opt { justify-content: center; gap: 5px; min-width: 0; min-height: var(--touch-min); padding: 0 var(--space-row-y);
  border: 1px solid var(--control-border); border-radius: 11px; font: 500 var(--type-row-title-size)/1.3 var(--font-sans); }
.tk-radios[data-face="row"] .st-choice-inline-opt[aria-checked="true"] { border-color: var(--ink); background: var(--press); font-weight: 500; }
.tk-radios[data-face="row"] .st-radio { width: 14px; height: 14px; border-width: var(--ring-width-fine); border-color: var(--muted); }
.tk-radios[data-face="row"] .st-radio::after { width: 8px; height: 8px; }
.tk-radios[data-face="row"] [aria-checked="true"] .st-radio { border-color: var(--ink); }

/* TaskSection: an icon-headed card section; the outcomes list (label 12px, figure 14px/500 mono right). */
.tk-section { display: flex; flex-direction: column; }
.tk-section > .st-heading { margin: 0 0 var(--space-heading); }
.tk-outcomes.st-panel { margin: 0; padding: var(--space-panel); }
.tk-outcomes > div { display: flex; align-items: center; justify-content: space-between; gap: var(--space-panel); min-height: 27px; }
.tk-outcomes dt { margin: 0; font: var(--type-choice-meta-size)/1.5 var(--font-sans); color: var(--ink); }
.tk-outcomes dd { margin: 0; font: 500 var(--type-button-size) var(--font-mono); color: var(--ink); }

/* TaskReceipt: the ✓ receipt row. */
.tk-receipt { display: flex; align-items: center; gap: var(--space-row-y); padding: 6px 0 10px; }
.tk-receipt-mark { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--green-wash); color: var(--green); }
.tk-receipt-mark svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tk-receipt-title { margin: 0; font: 600 var(--type-button-size)/1.5 var(--font-sans); color: var(--ink); }
.tk-receipt-meta { margin: 5px 0 0; font: var(--type-description-size)/1.2 var(--font-sans); color: var(--muted); }

/* TaskDay: the day card — a tinted band (bold day, mono status), rows that are doors (mark, title, mono meta), an act. */
.tk-day { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-inset); background: var(--paper); }
.tk-day-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-row-y); padding: var(--space-row-y) var(--space-row-x); background: var(--surface); }

  const parts = v => (Array.isArray(v) ? v.map(p => { const o = obj(p); if (o.sep) return '<span class="tk-sep" data-str="ds.sep">·</span>'; return o.tone ? `<span class="tk-tone" data-tone="${esc(o.tone)}">${T(o)}</span>` : T(o); }).join('') : T(v));
  /* A Button from SentriUI (Button card), from a { label, action, value, register, waiting } spec. */
  function button(b) {
    if (!b) return '';
    if (typeof b === 'string') return b;
    const l = obj(b.label);
    const UI = root.SentriUI;
    const props = { label: l.text ?? '', register: b.register || 'primary', action: b.action || '', value: b.value || '', waiting: !!b.waiting, describedby: b.describedby || '' };
    if (l.str) { props.strs = { label: l.str }; if (l.args) props.args = { label: l.args }; }
    if (UI && UI.button) return UI.button(props);
    return `<button type="button" class="button ${esc(props.register)}" data-ds="Button"${A(props.action, props.value)}>${T(l)}</button>`;
  }
  /* A hold from SentriUI (Button holdButton): { label, caption, action, value, tone, phase, statusId }. */
  function hold(h) {
    const UI = root.SentriUI, l = obj(h.label), c = obj(h.caption);
    const props = { label: l.text ?? '', caption: c.text ?? '', action: h.action || 'hold', value: h.value || '', tone: h.tone || 'primary', phase: h.phase || 'idle', statusId: h.statusId || '', waiting: !!h.waiting, describedby: h.describedby || '' };
    const strs = {}, args = {};
    if (l.str) { strs.label = l.str; if (l.args) args.label = l.args; }
    if (c.str) { strs.caption = c.str; if (c.args) args.caption = c.args; }
    props.strs = strs; props.args = args;
    return UI.holdButton(props);
  }

  /* ---- TaskPhone ---- */
  function statusbar({ time = { text: '9:41', str: 'tk.statusbar.time' } } = {}) {
    return `<div class="tk-statusbar" aria-hidden="true"><span>${T(time)}</span><span class="tk-statusbar-icons">${glyph('signal')}${glyph('battery')}</span></div>`;
  }
  /* The phone root. Put it straight in <body class="tk-stage">: framed 390×844 when the window is wider than a
     phone, full-bleed at phone width. `inner` is a screen() plus any overlays (drawer(), page(), dialog()). */
  function phone(inner, { label, bar = true, id = '' } = {}) {
    return `<main class="tk-phone inspection-phone" data-ds="TaskPhone" data-st-context="page"${id ? ` id="${esc(id)}"` : ''}${L(label)}>${bar ? statusbar() : ''}${inner || ''}</main>`;
  }
  /* The task surface: header, the one scroller, the dock. `inert` while a drawer, page or dialog is over it. */
  function screen({ header = '', body = '', dock = '', inert = false, label } = {}) {
    return `<div class="tk-screen"${inert ? ' inert' : ''}>${header}<div class="tk-scroll" role="region" tabindex="-1"${L(label)}>${body}</div>${dock}</div>`;
  }

  /* ---- TaskHeader ---- */
  function header({ title, back = { action: 'back' }, backLabel } = {}) {
    const b = back ? `<button type="button" class="tk-header-back"${A(back.action, back.value)}${L(backLabel, { text: 'Back', str: 'act.back' })}>${glyph('back-chevron')}</button>` : '';
    return `<header class="tk-header" data-ds="TaskHeader">${b}<h1 class="tk-header-title">${T(title)}</h1></header>`;
  }
  /* ---- TaskLatest: `Last record 08:41 · G. Hansen` ---- */
  function latest({ lead, value, rest } = {}) {
    return `<div class="tk-latest" data-ds="TaskLatest"><p><span>${T(lead)}</span> <strong>${T(value)}</strong>${rest ? ` <span>${T(rest)}</span>` : ''}</p></div>`;
  }

  /* ---- TaskSummary ---- */
  function summary({ unit = {}, task = {} } = {}) {
    const seg = (task.segments || []).map(s => `<i data-tone="${esc(s.tone)}" style="width:${Math.max(0, Math.min(100, +s.share || 0))}%"></i>`).join('');
    const bar = task.segments ? `<span class="tk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${esc(task.max ?? 100)}" aria-valuenow="${esc(task.now ?? 0)}"${L(task.barLabel)}>${seg}</span>` : '';
    const u = `<div class="tk-summary-half tk-summary-unit">
      <span class="tk-summary-heading">${unit.icon ? glyph(unit.icon) : ''}${T(unit.heading)}</span>
      <div class="tk-summary-value"><strong>${T(unit.value)}</strong></div>
      <span class="tk-summary-desc">${T(unit.description)}</span>
      ${unit.support ? `<span class="tk-summary-support"${unit.supportTone ? ` data-tone="${esc(unit.supportTone)}"` : ''}>${T(unit.support)}</span>` : ''}</div>`;
    const t = `<button type="button" class="tk-summary-half tk-summary-task"${A(task.action || 'task-overview', task.value)}${L(task.label)}>
      <span class="tk-summary-heading">${task.icon ? glyph(task.icon) : ''}${T(task.heading)}<span class="tk-summary-go">${glyph('chevron')}</span></span>
      <div class="tk-summary-value"><strong>${T(task.count)}</strong>${task.of ? `<span class="tk-summary-of">${T(task.of)}</span>` : ''}</div>
      <span class="tk-summary-desc">${T(task.description)}${task.scope ? ` <span class="tk-summary-scope">${T(task.scope)}</span>` : ''}</span>
      ${bar}${task.support ? `<span class="tk-summary-support">${T(task.support)}</span>` : ''}</button>`;
    return `<section class="tk-summary" data-ds="TaskSummary"${L(unit.label)}>${u}${t}</section>`;
  }

  /* ---- TaskProgress: farrowing's Whole-task progress card (Task overview): a panel head (title, meta), the segmented
     bar, then one count per segment (figure over a dotted label). segments: [{ tone: done|active|rest, share }];
     counts: [{ value, label, tone }] (text slots; tone draws the label's dot in its segment's colour). ---- */
  function progress({ title, meta, segments = [], max, now, barLabel, counts = [], label } = {}) {
    const seg = segments.map(s => `<i data-tone="${esc(s.tone)}" style="width:${Math.max(0, Math.min(100, +s.share || 0))}%"></i>`).join('');
    const c = counts.map(x => `<div class="tk-progress-count"><strong>${T(x.value)}</strong><span>${x.tone ? `<i class="tk-progress-dot" data-tone="${esc(x.tone)}" aria-hidden="true"></i>` : ''}${T(x.label)}</span></div>`).join('');
    return `<section class="st-panel tk-progress-card" data-ds="TaskProgress"${L(label ?? title)}>
      <header class="tk-progress-head"><h3 class="tk-progress-title">${T(title)}</h3>${meta ? `<span class="tk-progress-meta">${T(meta)}</span>` : ''}</header>
      <span class="tk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${esc(max ?? 100)}" aria-valuenow="${esc(now ?? 0)}"${L(barLabel)}>${seg}</span>
      ${counts.length ? `<div class="tk-progress-counts" style="--tk-count:${counts.length}">${c}</div>` : ''}</section>`;
  }

  /* ---- TaskLens: tabs, the count under each label; the filter at the end ---- */
  function lens({ tabs = [], action = 'lens', filter } = {}) {
    const b = tabs.map(t => `<button type="button" class="tk-lens-tab" aria-pressed="${t.pressed ? 'true' : 'false'}"${A(action, t.value)}${L(t.label)}><span>${T(t.text)}</span><span class="tk-lens-count">${T(t.count)}</span></button>`).join('');
    const f = filter ? `<button type="button" class="tk-lens-filter"${A(filter.action || 'filter', filter.value)}${L(filter.label)}>${glyph('filter')}</button>` : '';
    return `<div class="tk-lens" data-ds="TaskLens"><div class="tk-lens-bar"><div class="tk-lens-tabs" role="group"${L(tabs.label)}>${b}</div>${f}</div></div>`;
  }

  /* ---- TaskGroup: a pen / crate-row card ---- */
  function list(groups) { return `<div class="tk-list">${Array.isArray(groups) ? groups.join('') : groups || ''}</div>`; }
  /* face: 'code' (default: a place code in mono, `B1`) | 'word' (a word in the sans face, `Row A`, `Arrivals`). */
  function group({ title, meta, door, rows = '', face = 'code' } = {}) {
    const inner = `<strong class="tk-group-title"${face === 'word' ? ' data-face="word"' : ''}>${T(title)}</strong>${meta ? `<small class="tk-group-meta">${T(meta)}</small>` : ''}`;
    const head = door
      ? `<button type="button" class="tk-group-door"${A(door.action, door.value)}${L(door.label)}>${inner}${glyph('chevron')}</button>`
      : `<span class="tk-group-door">${inner}</span>`;
    return `<section class="tk-group" data-ds="TaskGroup"><header class="tk-group-head">${head}</header>${Array.isArray(rows) ? rows.join('') : rows}</section>`;
  }
  /* ---- TaskRow: id + chip | headline + meta | chevron, edit or tick ----
     trail 'tick' (with tick: { action = 'toggle', value, checked, label }): the row is a <label> around ChoiceList's multi
     trail, a checkbox (the selection of a bulk act); the whole row is the target. still: a row with no action (a <div>,
     e.g. one that holds its place after a record). data: { name: value } becomes data-name="value" on the row. */
  function row({ id, chip, headline, tone, meta, trail = 'chevron', action = 'open', value = '', label, tick, still = false, data } = {}) {
    const c = chip ? `<span class="tk-chip"${chip.tone ? ` data-tone="${esc(chip.tone)}"` : ''}>${T(chip)}</span>` : '';
    const g = trail === 'edit' ? glyph('edit') : trail === 'chevron' ? glyph('chevron') : '';
    const d = data ? Object.keys(data).map(k => ` data-${esc(k)}="${esc(data[k])}"`).join('') : '';
    const inner = `
      <span class="tk-row-identity"><span class="tk-row-id">${T(id)}</span>${c}</span>
      <span class="tk-row-detail"><span class="tk-row-headline"${tone ? ` data-tone="${esc(tone)}"` : ''}>${parts(headline)}</span>${meta ? `<span class="tk-row-meta">${parts(meta)}</span>` : ''}</span>`;
    if (trail === 'tick') {
      const t = tick || {};
      return `<label class="tk-row" data-ds="TaskRow" data-trail="tick"${d}>${inner}<span class="tk-row-tick st-choice-trail"><input type="checkbox" data-action="${esc(t.action || 'toggle')}" value="${esc(t.value ?? value)}"${t.checked ? ' checked' : ''}${L(t.label)}></span></label>`;
    }
    if (still) return `<div class="tk-row" data-ds="TaskRow"${d}>${inner}${g}</div>`;
    return `<button type="button" class="tk-row" data-ds="TaskRow"${A(action, value)}${L(label)}${d}>${inner}${g}</button>`;
  }

  /* ---- TaskStepper: the design system's Stepper card (its behaviour, strings and a11y) in farrowing's face ----
     Every prop is SentriUI.stepper's. face: 'row' (default for variant 'row': farrowing's entry row, outlined keys) |
     'well' (default for variant 'hero': the Foster / Reconcile stepper on a well, its label as the section title above) |
     'count' (the count sheet's hero on the green area: a filled green +). */
  function stepper(props = {}) {
    const UI = root.SentriUI;
    const face = props.face || (props.variant === 'hero' ? 'well' : 'row');
    // Farrowing reserves no hint line: a stepper with no hint and no pointers takes no space under its keys.
    const quiet = props.reserveHint == null && !props.hint && !(props.strs && props.strs.hint) && !(props.pointers && props.pointers.length);
    const html = UI.stepper(Object.assign({}, props, quiet ? { reserveHint: false } : {}, { className: `tk-stepper${props.className ? ' ' + props.className : ''}` }));
    return html.replace('data-ds="Stepper"', `data-ds="Stepper" data-face="${esc(face)}"`);
  }

  /* ---- TaskPhotos: the design system's Photos card in farrowing's face (a line, not a well: a camera glyph, the label,
     `Optional`, and an outlined camera key at the right; 50px thumbnails under it). Every prop is SentriUI.photos'. ---- */
  function photos(props = {}) {
    const UI = root.SentriUI;
    const html = UI.photos(Object.assign({}, props, { className: `tk-photos${props.className ? ' ' + props.className : ''}` }));
    return html.replace(/(<span class="st-photos-label"[^>]*>)/, `$1<span class="tk-photos-glyph">${glyph('camera')}</span>`);
  }

  /* ---- TaskRow door: a row with no id column (farrowing's .disclosure): a title, one muted description line, a chevron.
     For a non-animal door inside a sheet or a page (`Record here › Move piglets`). ---- */
  let doorSeq = 0;
  function door({ title, description, action = 'open', value = '', label, trail = 'chevron', act, id = '' } = {}) {
    /* act: a Button spec ({ label, action, value, register = 'secondary', waiting, busy }) — the row's one-tap at its end
       (`Record 12`), beside the door; its accessible name is its label plus the row's title. */
    if (act) {
      const rid = id || `tk-door-${++doorSeq}`, tid = rid + '-title', aid = rid + '-act';
      const g = trail === 'chevron' ? glyph('chevron') : trail === 'edit' ? glyph('edit') : '';
      const main = `<button type="button" class="tk-door-main"${A(action, value)}${L(label)}><span class="tk-door-copy"><strong id="${esc(tid)}">${parts(title)}</strong>${description ? `<small>${parts(description)}</small>` : ''}</span>${g}</button>`;
      const UI = root.SentriUI, l = obj(act.label);
      const props = { label: l.text ?? '', register: act.register || 'secondary', action: act.action || 'act', value: act.value ?? value, waiting: !!act.waiting, busy: !!act.busy, id: aid, labelledby: `${aid} ${tid}` };
      if (l.str) { props.strs = { label: l.str }; if (l.args) props.args = { label: l.args }; }
      return `<div class="tk-door" data-ds="TaskRow" data-variant="door" data-act="" id="${esc(rid)}">${main}${UI.button(props)}</div>`;
    }
    return `<button type="button" class="tk-door" data-ds="TaskRow" data-variant="door"${A(action, value)}${L(label)}><span class="tk-door-copy"><strong>${parts(title)}</strong>${description ? `<small>${parts(description)}</small>` : ''}</span>${trail === 'chevron' ? glyph('chevron') : trail === 'edit' ? glyph('edit') : ''}</button>`;
  }

  /* ---- TaskChoice: farrowing's choice tiles (Foster piglets: Send / Receive): two (or three) big outlined tiles, an icon
     over the label; the chosen one on green-wash. options: [{ value, label, icon, pressed }]; one action for all. ---- */
  function choice({ options = [], action = 'choose', label } = {}) {
    const b = options.map(o => `<button type="button" class="tk-choice-tile" aria-pressed="${o.pressed ? 'true' : 'false'}"${A(action, o.value)}${L(o.aria)}>${o.icon ? glyph(o.icon) : ''}<span>${T(o.label)}</span></button>`).join('');
    return `<div class="tk-choice" data-ds="TaskChoice" role="group" data-count="${options.length}"${L(label)}>${b}</div>`;
  }

  /* ---- TaskRadios: farrowing's flat radio rows (.radio-row: 60px, a line under each, a 14px label, the radio at the
     right). The design system's ChoiceList radio field (SentriUI.choiceRadios: role=radio buttons, roving tab stop,
     radioBind, an optional Clear) in farrowing's face. Every prop is choiceRadios'; layout is always 'rows'. ---- */
  /* layout 'row': farrowing's inline field (Finish · Assisted farrowing: No | Yes): the label (with its Optional tag and
     Clear) left, the options as two 44px outlined pills right, all on one row (the ChoiceList's 'inline' layout). */
  function radios(props = {}) {
    const UI = root.SentriUI, row = props.layout === 'row';
    const html = UI.choiceRadios(Object.assign({}, props, { layout: row ? 'inline' : 'rows', className: `tk-radios${props.className ? ' ' + props.className : ''}` }));
    return html.replace('data-ds="ChoiceList"', `data-ds="ChoiceList" data-face="${row ? 'row' : 'flat'}"`);
  }

  /* ---- TaskWarning: farrowing's danger band (.danger-band): a pale red box, the warning in 12px red, then (optional)
     text actions, then one 10px muted consequence line. tone: 'red' (default) | 'amber'. ---- */
  /* title: a bold first line (farrowing's banners and bands lead with it; the text under it drops to 11px).
     icon + door: farrowing's End banner (⚠ `9 sows will be removed from this batch` ›): the icon left, the copy, a chevron;
     with door ({ action, value, label }) the whole band is one button. tone 'amber' is the banner's colours. */
  function warning({ title, text, actions = '', detail, tone = 'red', icon = '', door: d, label } = {}) {
    const copy = `${title ? `<strong class="tk-warning-title">${parts(title)}</strong>` : ''}${text ? `<p class="tk-warning-text">${parts(text)}</p>` : ''}${actions ? `<div class="tk-warning-actions">${actions}</div>` : ''}${detail ? `<small class="tk-warning-detail">${parts(detail)}</small>` : ''}`;
    const t = esc(tone === 'amber' ? 'amber' : 'red');
    if (!icon && !d) return `<div class="tk-warning" data-ds="TaskWarning" data-tone="${t}" role="note"${L(label)}>${copy}</div>`;
    const inner = `${icon ? `<span class="tk-warning-icon">${glyph(icon)}</span>` : ''}<span class="tk-warning-copy">${copy}</span>${d ? `<span class="tk-warning-go">${glyph('chevron')}</span>` : ''}`;
    return d
      ? `<button type="button" class="tk-warning" data-ds="TaskWarning" data-tone="${t}" data-banner=""${A(d.action || 'open', d.value)}${L(d.label ?? label)}>${inner}</button>`
      : `<div class="tk-warning" data-ds="TaskWarning" data-tone="${t}" data-banner="" role="note"${L(label)}>${inner}</div>`;
  }

  /* ---- TaskSection: farrowing's icon-headed card section (Task outcomes, Other outcomes): a section heading with its
     icon and meta, then one card. body: HTML for the card, or items (below). items: [{ label, value, action, value2 }] —
     rows: false (default) farrowing's outcomes list (label 12px left, 14px mono figure right); rows: true the design
     system's Rows (label 13px/500, the figure as trailing muted text, a chevron when the row has an action). ---- */
  function section({ title, icon = '', meta, body, items = [], rows = false, label } = {}) {
    const UI = root.SentriUI;
    let card = body || '';
    if (!body && items.length && !rows) card = `<dl class="st-panel tk-outcomes">${items.map(i => `<div><dt>${T(i.label)}</dt><dd>${T(i.value)}</dd></div>`).join('')}</dl>`;
    if (!body && items.length && rows) {
      card = UI.rowGroup(items.map(i => {
        const o = obj(i.label), v = obj(i.value == null ? '' : i.value), strs = {}, args = {};
        if (o.str) { strs.title = o.str; if (o.args) args.title = o.args; }
        if (v.str) { strs.trailing = v.str; if (v.args) args.trailing = v.args; }
        return UI.row(Object.assign({ title: o.text ?? '', trailing: v.text ?? '', strs, args }, i.action ? { action: i.action, value: i.target || '' } : {}));
      }).join(''));
    }
    return `<section class="tk-section" data-ds="TaskSection"${L(label ?? title)}>${sectionHead(title, icon, meta)}${card}</section>`;
  }

  /* ---- TaskReceipt: farrowing's ✓ receipt row (Farrowing task ended · 30 Sept, 23:09 · G. Hansen): a 36px green-wash
     disc with a check, a 14px/600 title, an 11px muted meta line. ---- */
  function receipt({ title, meta, icon = 'check', label } = {}) {
    return `<div class="tk-receipt" data-ds="TaskReceipt" role="status"${L(label)}><span class="tk-receipt-mark">${glyph(icon)}</span><div><h3 class="tk-receipt-title">${parts(title)}</h3>${meta ? `<p class="tk-receipt-meta">${parts(meta)}</p>` : ''}</div></div>`;
  }

  /* ---- TaskDay: farrowing's day card (Piglet processing · Care): a tinted header band (bold `Day 3`, a mono status right),
     then one row per item — the whole row is the door (a mark left: 'done' a check disc, 'due' an open ring, '' none; a
     12px/700 title; a 10px mono meta line); act: an optional trailing one-tap (Record 12), beside the door. No chevron.
     items: [{ title, meta, mark, action, value, label, act, id }]. ---- */
  let daySeq = 0;
  function day({ title, status, items = [], label } = {}) {
    const UI = root.SentriUI;
    const rows = items.map(i => {
      const mark = i.mark === 'done' ? `<span class="tk-day-mark" data-mark="done">${glyph('check')}</span>` : i.mark === 'due' ? '<span class="tk-day-mark" data-mark="due"></span>' : '';
      const rid = i.id || `tk-day-${++daySeq}`, tid = rid + '-title';
      const main = `<button type="button" class="tk-day-door"${A(i.action || 'open', i.value)}${L(i.label)}>${mark}<span class="tk-day-copy"><strong id="${esc(tid)}">${parts(i.title)}</strong>${i.meta ? `<small>${parts(i.meta)}</small>` : ''}</span></button>`;
      if (!i.act) return `<div class="tk-day-row"${i.mark === 'done' ? ' data-done=""' : ''}>${main}</div>`;
      const a = i.act, l = obj(a.label), aid = rid + '-act';
      const props = { label: l.text ?? '', register: a.register || 'secondary', action: a.action || 'act', value: a.value ?? i.value ?? '', waiting: !!a.waiting, busy: !!a.busy, id: aid, labelledby: `${aid} ${tid}` };
      if (l.str) { props.strs = { label: l.str }; if (l.args) props.args = { label: l.args }; }
      return `<div class="tk-day-row" data-act=""${i.mark === 'done' ? ' data-done=""' : ''}>${main}${UI.button(props)}</div>`;
    }).join('');
    return `<section class="tk-day" data-ds="TaskDay"${L(label ?? title)}><header class="tk-day-head"><strong>${parts(title)}</strong>${status ? `<span>${parts(status)}</span>` : ''}</header>${rows}</section>`;
  }

  /* ---- TaskHold binding: SentriUI.holdBind, with farrowing's caption — the caption (`HOLD TO END`) stays as it is through
     the hold (farrowing shows only the sweep); the cues still reach the hold's status line (statusId) when there is one.
     The unknown phase keeps the Button card's message. Same options and return as SentriUI.holdBind. ---- */
  function holdBind(scope, opts = {}) {
    const UI = root.SentriUI, sel = opts.selector || '.st-hold', idle = new WeakMap();
    const keep = b => { const c = b && b.querySelector('.st-hold-caption'); if (c && b.getAttribute('data-phase') === 'idle') idle.set(b, c.outerHTML); };
    scope.querySelectorAll(sel).forEach(keep);
    const early = e => { const b = e.target.closest && e.target.closest(sel); if (b) keep(b); };
    scope.addEventListener('pointerdown', early, true);
    scope.addEventListener('keydown', early, true);
    const onPhase = opts.onPhase;
    return UI.holdBind(scope, Object.assign({}, opts, { onPhase(b, phase, cue) {
      const c = b.querySelector('.st-hold-caption');
      if (phase !== 'unknown' && c && idle.has(b) && c.outerHTML !== idle.get(b)) c.outerHTML = idle.get(b);
      if (onPhase) onPhase(b, phase, cue);
    } }));
  }

  /* ---- TaskDoors: a list of doors. card: false (default) — flat door rows (SentriTask.door, no id column).
     card: true — farrowing's Pen page / sow-actions list: an optional section title with its icon, then the doors in one
     card, each with a 34px tinted icon tile, a title and one description line, a chevron (the design system's Row).
     items: [{ title, description, icon, action, value, label }] (text slots); title / icon: the section's. ---- */
  function doors({ card = false, title, icon = '', items = [], label } = {}) {
    if (!card) return `<div class="tk-doors" data-ds="TaskDoors"${L(label)}>${items.map(door).join('')}</div>`;
    const UI = root.SentriUI, u = v => obj(v == null ? '' : v);
    const st = (slot, key, out) => { const o = u(slot); if (o.str) { out.strs[key] = o.str; if (o.args) out.args[key] = o.args; } return o.text ?? ''; };
    const head = sectionHead(title, icon);
    const rows = items.map(i => { const r = { strs: {}, args: {} }; const t = st(i.title, 'title', r); const d = i.description != null ? st(i.description, 'description', r) : undefined;
      return UI.row(Object.assign({ title: t, icon: i.icon ? glyph(i.icon) : undefined, action: i.action || 'open', value: i.value || '', strs: r.strs, args: r.args }, d !== undefined ? { description: d } : {})); }).join('');
    return `<section class="tk-doors" data-ds="TaskDoors" data-card=""${L(label)}>${head}${UI.rowGroup(rows)}</section>`;
  }

  /* A section heading (SentriUI.heading, kind 'section') from text slots: title, meta and a glyph name. */
  function sectionHead(title, icon, meta) {
    if (!title) return '';
    const UI = root.SentriUI, h = { strs: {}, args: {} };
    const slot = (v, k) => { const o = obj(v); if (o.str) { h.strs[k] = o.str; if (o.args) h.args[k] = o.args; } return o.text ?? ''; };
    const t = slot(title, 'title'), m = meta ? slot(meta, 'meta') : undefined;
    return UI.heading(Object.assign({ title: t, icon: icon ? glyph(icon) : '', kind: 'section', level: 3, strs: h.strs, args: h.args }, m !== undefined ? { meta: m } : {}));
  }

  /* ---- TaskTable: farrowing's comparison table (Task overview · Choose a unit): a section heading, then one card —
     a column-heading line (9px, as farrowing) and one door row per place: its name (and a 9px subline), a mono figure per
     column, a green chevron. columns: [text slots]; rows: [{ name, sub, values: [text slots], action, value, label,
     current }]. ---- */
  function table({ title, icon = '', meta, nameColumn = '', columns = [], rows = [], label } = {}) {
    const n = columns.length;
    const cols = `<div class="tk-table-columns" aria-hidden="true"><span>${T(nameColumn)}</span>${columns.map(c => `<span>${T(c)}</span>`).join('')}<span></span></div>`;
    const body = rows.map(r => `<div role="listitem"><button type="button" class="tk-table-row"${A(r.action || 'open', r.value)}${L(r.label)}${r.current ? ' aria-current="true"' : ''}>
      <span class="tk-table-name"><strong>${T(r.name)}</strong>${r.sub ? `<small>${T(r.sub)}</small>` : ''}</span>${(r.values || []).map(v => `<span class="tk-table-figure">${T(v)}</span>`).join('')}${glyph('chevron')}</button></div>`).join('');
    return `<section class="tk-table" data-ds="TaskTable" style="--tk-cols:${n}"${L(label ?? title)}>${sectionHead(title, icon, meta)}<div class="tk-table-surface">${cols}<div role="list">${body}</div></div></section>`;
  }

  /* ---- TaskMetrics: farrowing's performance card (Task overview · Performance metrics): a section heading, then one
     card — two headline measures (label, a 28px mono figure with an optional unit, a subline; subTone 'amber' when below
     target), a rule, then small totals. measures: [{ label, value, unit, sub, subTone }]; totals: [{ label, value }]. ---- */
  function metrics({ title, icon = '', meta, measures = [], totals: tt = [], label } = {}) {
    const m = measures.map(x => `<div><span>${T(x.label)}</span><strong>${T(x.value)}${x.unit ? `<small>${T(x.unit)}</small>` : ''}</strong>${x.sub ? `<small${x.subTone ? ` data-tone="${esc(x.subTone)}"` : ''}>${T(x.sub)}</small>` : ''}</div>`).join('');
    const t = tt.length ? `<dl class="tk-metrics-totals">${tt.map(x => `<div><dt>${T(x.label)}</dt><dd>${T(x.value)}</dd></div>`).join('')}</dl>` : '';
    return `<section class="tk-metrics" data-ds="TaskMetrics"${L(label ?? title)}>${sectionHead(title, icon, meta)}<div class="tk-metrics-surface"><div class="tk-metrics-pair">${m}</div>${t}</div></section>`;
  }

  /* ---- TaskTotals: the few figures a sheet commits, at farrowing's Finish size (Born 14 · Alive 9 · Dead 5) ----
     items: [{ label, value }] (text slots); columns: 2 | 3 (default 3). */
  function totals(items = [], { columns = 3, label } = {}) {
    return `<dl class="st-panel tk-totals" data-ds="TaskTotals" data-columns="${columns === 2 ? 2 : 3}"${L(label)}>${items.map(i => `<div class="tk-total"><dt>${T(i.label)}</dt><dd>${T(i.value)}</dd></div>`).join('')}</dl>`;
  }

  /* ---- TaskDock ---- */
  /* unit: farrowing's labelled place control at the dock's start (B1 / Go to pen): { icon = 'grid', label, caption, action,
     value, aria } — the place in 13px/600 mono over a 9px caption, the icon left, no frame. */
  function dock({ primary, tools = [], unit } = {}) {
    const u = unit ? `<button type="button" class="tk-dock-unit"${A(unit.action || 'unit', unit.value)}${L(unit.aria)}>${glyph(unit.icon || 'grid')}<span><strong>${T(unit.label)}</strong>${unit.caption ? `<small>${T(unit.caption)}</small>` : ''}</span></button>` : '';
    const p = u + (primary ? `<button type="button" class="tk-dock-primary"${A(primary.action, primary.value)}>${primary.icon ? glyph(primary.icon) : ''}<span>${T(primary.label)}</span></button>` : '');
    const t = tools.map(x => `<button type="button" class="tk-dock-tool"${A(x.action, x.value)}${L(x.label)}>${glyph(x.icon)}</button>`).join('');
    return `<nav class="tk-dock" data-ds="TaskDock"${L(tools.label)}>${p}${t}</nav>`;
  }

  /* ---- Footer: Back + one primary (a Button spec, a hold spec, or raw HTML) ---- */
  function back({ action = 'back', value = '', label = { text: 'Back', str: 'act.back' } } = {}) {
    return `<button type="button" class="tk-back"${A(action, value)}>${glyph('back-chevron')}<span>${T(label)}</span></button>`;
  }
  /* status: { text, str, args, id, tone, action } — one status line directly above the footer (the reason a waiting primary
     waits, or the hold's progress line); it is wired as the primary's aria-describedby / the hold's statusId. action:
     { label, action, value } adds one text action at the line's end (`42 is right`). */
  function footer({ back: b = {}, primary, hold: h, status } = {}) {
    let s = '';
    if (status) {
      const id = status.id || 'tk-footer-status';
      // Farrowing draws no line above a footer: the status is read (role=status, the primary's / hold's description) but
      // visually hidden, unless the page opts in (`visible: true`, e.g. after a tap on the waiting primary).
      // A line that carries a text action (`17 is right`) is shown unless the page says `visible: false`: its act must be
      // reachable.
      const vis = status.visible != null ? !!status.visible : !!status.action, hid = vis ? '' : ' st-visually-hidden';
      const act = vis && status.action ? button(Object.assign({ register: 'text' }, status.action)) : '';
