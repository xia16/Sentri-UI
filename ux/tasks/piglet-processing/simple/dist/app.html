    return `<header class="tk-header" data-ds="TaskHeader">${b}<h1 class="tk-header-title">${T(title)}</h1></header>`;
  }
  /* ---- TaskLatest: `Last record 08:41 · G. Hansen` ---- */
  function latest({ lead, value, rest } = {}) {
    return `<div class="tk-latest" data-ds="TaskLatest"><p><span>${T(lead)}</span> <strong>${T(value)}</strong>${rest ? ` <span>${T(rest)}</span>` : ''}</p></div>`;
  }

  /* ---- TaskSummary ---- */
  function summary({ unit = {}, task = {} } = {}) {
    const seg = (task.segments || []).map(s => `<i data-tone="${esc(s.tone)}" style="width:${Math.max(0, Math.min(100, +s.share || 0))}%"></i>`).join('');
    const bar = task.segments ? `<span class="tk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${esc(task.max ?? 100)}" aria-valuenow="${esc(task.now ?? 0)}"${L(task.barLabel)}>${seg}</span>` : '';
    const u = `<div class="tk-summary-half tk-summary-unit">
      <span class="tk-summary-heading">${unit.icon ? glyph(unit.icon) : ''}${T(unit.heading)}</span>
      <div class="tk-summary-value"><strong>${T(unit.value)}</strong></div>
      <span class="tk-summary-desc">${T(unit.description)}</span>
      ${unit.support ? `<span class="tk-summary-support"${unit.supportTone ? ` data-tone="${esc(unit.supportTone)}"` : ''}>${T(unit.support)}</span>` : ''}</div>`;
    const t = `<button type="button" class="tk-summary-half tk-summary-task"${A(task.action || 'task-overview', task.value)}${L(task.label)}>
      <span class="tk-summary-heading">${task.icon ? glyph(task.icon) : ''}${T(task.heading)}<span class="tk-summary-go">${glyph('chevron')}</span></span>
      <div class="tk-summary-value"><strong>${T(task.count)}</strong>${task.of ? `<span class="tk-summary-of">${T(task.of)}</span>` : ''}</div>
      <span class="tk-summary-desc">${T(task.description)}${task.scope ? ` <span class="tk-summary-scope">${T(task.scope)}</span>` : ''}</span>
      ${bar}${task.support ? `<span class="tk-summary-support">${T(task.support)}</span>` : ''}</button>`;
    return `<section class="tk-summary" data-ds="TaskSummary"${L(unit.label)}>${u}${t}</section>`;
  }

  /* ---- TaskProgress: farrowing's Whole-task progress card (Task overview): a panel head (title, meta), the segmented
     bar, then one count per segment (figure over a dotted label). segments: [{ tone: done|active|rest, share }];
     counts: [{ value, label, tone }] (text slots; tone draws the label's dot in its segment's colour). ---- */
  function progress({ title, meta, segments = [], max, now, barLabel, counts = [], label } = {}) {
    const seg = segments.map(s => `<i data-tone="${esc(s.tone)}" style="width:${Math.max(0, Math.min(100, +s.share || 0))}%"></i>`).join('');
    const c = counts.map(x => `<div class="tk-progress-count"><strong>${T(x.value)}</strong><span>${x.tone ? `<i class="tk-progress-dot" data-tone="${esc(x.tone)}" aria-hidden="true"></i>` : ''}${T(x.label)}</span></div>`).join('');
    return `<section class="st-panel tk-progress-card" data-ds="TaskProgress"${L(label ?? title)}>
      <header class="tk-progress-head"><h3 class="tk-progress-title">${T(title)}</h3>${meta ? `<span class="tk-progress-meta">${T(meta)}</span>` : ''}</header>
      <span class="tk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${esc(max ?? 100)}" aria-valuenow="${esc(now ?? 0)}"${L(barLabel)}>${seg}</span>
      ${counts.length ? `<div class="tk-progress-counts" style="--tk-count:${counts.length}">${c}</div>` : ''}</section>`;
  }

  /* ---- TaskLens: tabs, the count under each label; the filter at the end ---- */
  function lens({ tabs = [], action = 'lens', filter } = {}) {
    const b = tabs.map(t => `<button type="button" class="tk-lens-tab" aria-pressed="${t.pressed ? 'true' : 'false'}"${A(action, t.value)}${L(t.label)}><span>${T(t.text)}</span><span class="tk-lens-count">${T(t.count)}</span></button>`).join('');
    const f = filter ? `<button type="button" class="tk-lens-filter"${A(filter.action || 'filter', filter.value)}${L(filter.label)}>${glyph('filter')}</button>` : '';
    return `<div class="tk-lens" data-ds="TaskLens"><div class="tk-lens-bar"><div class="tk-lens-tabs" role="group"${L(tabs.label)}>${b}</div>${f}</div></div>`;
  }

  /* ---- TaskGroup: a pen / crate-row card ---- */
  function list(groups) { return `<div class="tk-list">${Array.isArray(groups) ? groups.join('') : groups || ''}</div>`; }
  /* face: 'code' (default: a place code in mono, `B1`) | 'word' (a word in the sans face, `Row A`, `Arrivals`). */
  function group({ title, meta, door, rows = '', face = 'code' } = {}) {
    const inner = `<strong class="tk-group-title"${face === 'word' ? ' data-face="word"' : ''}>${T(title)}</strong>${meta ? `<small class="tk-group-meta">${T(meta)}</small>` : ''}`;
    const head = door
      ? `<button type="button" class="tk-group-door"${A(door.action, door.value)}${L(door.label)}>${inner}${glyph('chevron')}</button>`
      : `<span class="tk-group-door">${inner}</span>`;
    return `<section class="tk-group" data-ds="TaskGroup"><header class="tk-group-head">${head}</header>${Array.isArray(rows) ? rows.join('') : rows}</section>`;
  }
  /* ---- TaskRow: id + chip | headline + meta | chevron, edit or tick ----
     trail 'tick' (with tick: { action = 'toggle', value, checked, label }): the row is a <label> around ChoiceList's multi
     trail, a checkbox (the selection of a bulk act); the whole row is the target. still: a row with no action (a <div>,
     e.g. one that holds its place after a record). data: { name: value } becomes data-name="value" on the row. */
  function row({ id, chip, headline, tone, meta, trail = 'chevron', action = 'open', value = '', label, tick, still = false, data } = {}) {
    const c = chip ? `<span class="tk-chip"${chip.tone ? ` data-tone="${esc(chip.tone)}"` : ''}>${T(chip)}</span>` : '';
    const g = trail === 'edit' ? glyph('edit') : trail === 'chevron' ? glyph('chevron') : '';
    const d = data ? Object.keys(data).map(k => ` data-${esc(k)}="${esc(data[k])}"`).join('') : '';
    const inner = `
      <span class="tk-row-identity"><span class="tk-row-id">${T(id)}</span>${c}</span>
      <span class="tk-row-detail"><span class="tk-row-headline"${tone ? ` data-tone="${esc(tone)}"` : ''}>${parts(headline)}</span>${meta ? `<span class="tk-row-meta">${parts(meta)}</span>` : ''}</span>`;
    if (trail === 'tick') {
      const t = tick || {};
      return `<label class="tk-row" data-ds="TaskRow" data-trail="tick"${d}>${inner}<span class="tk-row-tick st-choice-trail"><input type="checkbox" data-action="${esc(t.action || 'toggle')}" value="${esc(t.value ?? value)}"${t.checked ? ' checked' : ''}${L(t.label)}></span></label>`;
    }
    if (still) return `<div class="tk-row" data-ds="TaskRow"${d}>${inner}${g}</div>`;
    return `<button type="button" class="tk-row" data-ds="TaskRow"${A(action, value)}${L(label)}${d}>${inner}${g}</button>`;
  }

  /* ---- TaskStepper: the design system's Stepper card (its behaviour, strings and a11y) in farrowing's face ----
     Every prop is SentriUI.stepper's. face: 'row' (default for variant 'row': farrowing's entry row, outlined keys) |
     'well' (default for variant 'hero': the Foster / Reconcile stepper on a well, its label as the section title above) |
     'count' (the count sheet's hero on the green area: a filled green +). */
  function stepper(props = {}) {
    const UI = root.SentriUI;
    const face = props.face || (props.variant === 'hero' ? 'well' : 'row');
    // Farrowing reserves no hint line: a stepper with no hint and no pointers takes no space under its keys.
    const quiet = props.reserveHint == null && !props.hint && !(props.strs && props.strs.hint) && !(props.pointers && props.pointers.length);
    const html = UI.stepper(Object.assign({}, props, quiet ? { reserveHint: false } : {}, { className: `tk-stepper${props.className ? ' ' + props.className : ''}` }));
    return html.replace('data-ds="Stepper"', `data-ds="Stepper" data-face="${esc(face)}"`);
  }

  /* ---- TaskPhotos: the design system's Photos card in farrowing's face (a line, not a well: a camera glyph, the label,
     `Optional`, and an outlined camera key at the right; 50px thumbnails under it). Every prop is SentriUI.photos'. ---- */
  function photos(props = {}) {
    const UI = root.SentriUI;
    const html = UI.photos(Object.assign({}, props, { className: `tk-photos${props.className ? ' ' + props.className : ''}` }));
    return html.replace(/(<span class="st-photos-label"[^>]*>)/, `$1<span class="tk-photos-glyph">${glyph('camera')}</span>`);
  }

  /* ---- TaskRow door: a row with no id column (farrowing's .disclosure): a title, one muted description line, a chevron.
     For a non-animal door inside a sheet or a page (`Record here › Move piglets`). ---- */
  let doorSeq = 0;
  function door({ title, description, action = 'open', value = '', label, trail = 'chevron', act, id = '' } = {}) {
    /* act: a Button spec ({ label, action, value, register = 'secondary', waiting, busy }) — the row's one-tap at its end
       (`Record 12`), beside the door; its accessible name is its label plus the row's title. */
    if (act) {
      const rid = id || `tk-door-${++doorSeq}`, tid = rid + '-title', aid = rid + '-act';
      const g = trail === 'chevron' ? glyph('chevron') : trail === 'edit' ? glyph('edit') : '';
      const main = `<button type="button" class="tk-door-main"${A(action, value)}${L(label)}><span class="tk-door-copy"><strong id="${esc(tid)}">${parts(title)}</strong>${description ? `<small>${parts(description)}</small>` : ''}</span>${g}</button>`;
      const UI = root.SentriUI, l = obj(act.label);
      const props = { label: l.text ?? '', register: act.register || 'secondary', action: act.action || 'act', value: act.value ?? value, waiting: !!act.waiting, busy: !!act.busy, id: aid, labelledby: `${aid} ${tid}` };
      if (l.str) { props.strs = { label: l.str }; if (l.args) props.args = { label: l.args }; }
      return `<div class="tk-door" data-ds="TaskRow" data-variant="door" data-act="" id="${esc(rid)}">${main}${UI.button(props)}</div>`;
    }
    return `<button type="button" class="tk-door" data-ds="TaskRow" data-variant="door"${A(action, value)}${L(label)}><span class="tk-door-copy"><strong>${parts(title)}</strong>${description ? `<small>${parts(description)}</small>` : ''}</span>${trail === 'chevron' ? glyph('chevron') : trail === 'edit' ? glyph('edit') : ''}</button>`;
  }

  /* ---- TaskChoice: farrowing's choice tiles (Foster piglets: Send / Receive): two (or three) big outlined tiles, an icon
     over the label; the chosen one on green-wash. options: [{ value, label, icon, pressed }]; one action for all. ---- */
  function choice({ options = [], action = 'choose', label } = {}) {
    const b = options.map(o => `<button type="button" class="tk-choice-tile" aria-pressed="${o.pressed ? 'true' : 'false'}"${A(action, o.value)}${L(o.aria)}>${o.icon ? glyph(o.icon) : ''}<span>${T(o.label)}</span></button>`).join('');
    return `<div class="tk-choice" data-ds="TaskChoice" role="group" data-count="${options.length}"${L(label)}>${b}</div>`;
  }

  /* ---- TaskRadios: farrowing's flat radio rows (.radio-row: 60px, a line under each, a 14px label, the radio at the
     right). The design system's ChoiceList radio field (SentriUI.choiceRadios: role=radio buttons, roving tab stop,
     radioBind, an optional Clear) in farrowing's face. Every prop is choiceRadios'; layout is always 'rows'. ---- */
  /* layout 'row': farrowing's inline field (Finish · Assisted farrowing: No | Yes): the label (with its Optional tag and
     Clear) left, the options as two 44px outlined pills right, all on one row (the ChoiceList's 'inline' layout). */
  function radios(props = {}) {
    const UI = root.SentriUI, row = props.layout === 'row';
    const html = UI.choiceRadios(Object.assign({}, props, { layout: row ? 'inline' : 'rows', className: `tk-radios${props.className ? ' ' + props.className : ''}` }));
    return html.replace('data-ds="ChoiceList"', `data-ds="ChoiceList" data-face="${row ? 'row' : 'flat'}"`);
  }

  /* ---- TaskWarning: farrowing's danger band (.danger-band): a pale red box, the warning in 12px red, then (optional)
     text actions, then one 10px muted consequence line. tone: 'red' (default) | 'amber'. ---- */
  /* title: a bold first line (farrowing's banners and bands lead with it; the text under it drops to 11px).
     icon + door: farrowing's End banner (⚠ `9 sows will be removed from this batch` ›): the icon left, the copy, a chevron;
     with door ({ action, value, label }) the whole band is one button. tone 'amber' is the banner's colours. */
  function warning({ title, text, actions = '', detail, tone = 'red', icon = '', door: d, label } = {}) {
    const copy = `${title ? `<strong class="tk-warning-title">${parts(title)}</strong>` : ''}${text ? `<p class="tk-warning-text">${parts(text)}</p>` : ''}${actions ? `<div class="tk-warning-actions">${actions}</div>` : ''}${detail ? `<small class="tk-warning-detail">${parts(detail)}</small>` : ''}`;
    const t = esc(tone === 'amber' ? 'amber' : 'red');
    if (!icon && !d) return `<div class="tk-warning" data-ds="TaskWarning" data-tone="${t}" role="note"${L(label)}>${copy}</div>`;
    const inner = `${icon ? `<span class="tk-warning-icon">${glyph(icon)}</span>` : ''}<span class="tk-warning-copy">${copy}</span>${d ? `<span class="tk-warning-go">${glyph('chevron')}</span>` : ''}`;
    return d
      ? `<button type="button" class="tk-warning" data-ds="TaskWarning" data-tone="${t}" data-banner=""${A(d.action || 'open', d.value)}${L(d.label ?? label)}>${inner}</button>`
      : `<div class="tk-warning" data-ds="TaskWarning" data-tone="${t}" data-banner="" role="note"${L(label)}>${inner}</div>`;
  }

  /* ---- TaskSection: farrowing's icon-headed card section (Task outcomes, Other outcomes): a section heading with its
     icon and meta, then one card. body: HTML for the card, or items (below). items: [{ label, value, action, value2 }] —
     rows: false (default) farrowing's outcomes list (label 12px left, 14px mono figure right); rows: true the design
     system's Rows (label 13px/500, the figure as trailing muted text, a chevron when the row has an action). ---- */
  function section({ title, icon = '', meta, body, items = [], rows = false, label } = {}) {
    const UI = root.SentriUI;
    let card = body || '';
    if (!body && items.length && !rows) card = `<dl class="st-panel tk-outcomes">${items.map(i => `<div><dt>${T(i.label)}</dt><dd>${T(i.value)}</dd></div>`).join('')}</dl>`;
    if (!body && items.length && rows) {
      card = UI.rowGroup(items.map(i => {
        const o = obj(i.label), v = obj(i.value == null ? '' : i.value), strs = {}, args = {};
        if (o.str) { strs.title = o.str; if (o.args) args.title = o.args; }
        if (v.str) { strs.trailing = v.str; if (v.args) args.trailing = v.args; }
        return UI.row(Object.assign({ title: o.text ?? '', trailing: v.text ?? '', strs, args }, i.action ? { action: i.action, value: i.target || '' } : {}));
      }).join(''));
    }
    return `<section class="tk-section" data-ds="TaskSection"${L(label ?? title)}>${sectionHead(title, icon, meta)}${card}</section>`;
  }

  /* ---- TaskReceipt: farrowing's ✓ receipt row (Farrowing task ended · 30 Sept, 23:09 · G. Hansen): a 36px green-wash
     disc with a check, a 14px/600 title, an 11px muted meta line. ---- */
  function receipt({ title, meta, icon = 'check', label } = {}) {
    return `<div class="tk-receipt" data-ds="TaskReceipt" role="status"${L(label)}><span class="tk-receipt-mark">${glyph(icon)}</span><div><h3 class="tk-receipt-title">${parts(title)}</h3>${meta ? `<p class="tk-receipt-meta">${parts(meta)}</p>` : ''}</div></div>`;
  }

  /* ---- TaskDay: farrowing's day card (Piglet processing · Care): a tinted header band (bold `Day 3`, a mono status right),
     then one row per item — the whole row is the door (a mark left: 'done' a check disc, 'due' an open ring, '' none; a
     12px/700 title; a 10px mono meta line); act: an optional trailing one-tap (Record 12), beside the door. No chevron.
     items: [{ title, meta, mark, action, value, label, act, id }]. ---- */
  let daySeq = 0;
  function day({ title, status, items = [], label } = {}) {
    const UI = root.SentriUI;
    const rows = items.map(i => {
      const mark = i.mark === 'done' ? `<span class="tk-day-mark" data-mark="done">${glyph('check')}</span>` : i.mark === 'due' ? '<span class="tk-day-mark" data-mark="due"></span>' : '';
      const rid = i.id || `tk-day-${++daySeq}`, tid = rid + '-title';
      const main = `<button type="button" class="tk-day-door"${A(i.action || 'open', i.value)}${L(i.label)}>${mark}<span class="tk-day-copy"><strong id="${esc(tid)}">${parts(i.title)}</strong>${i.meta ? `<small>${parts(i.meta)}</small>` : ''}</span></button>`;
      if (!i.act) return `<div class="tk-day-row"${i.mark === 'done' ? ' data-done=""' : ''}>${main}</div>`;
      const a = i.act, l = obj(a.label), aid = rid + '-act';
      const props = { label: l.text ?? '', register: a.register || 'secondary', action: a.action || 'act', value: a.value ?? i.value ?? '', waiting: !!a.waiting, busy: !!a.busy, id: aid, labelledby: `${aid} ${tid}` };
      if (l.str) { props.strs = { label: l.str }; if (l.args) props.args = { label: l.args }; }
      return `<div class="tk-day-row" data-act=""${i.mark === 'done' ? ' data-done=""' : ''}>${main}${UI.button(props)}</div>`;
    }).join('');
    return `<section class="tk-day" data-ds="TaskDay"${L(label ?? title)}><header class="tk-day-head"><strong>${parts(title)}</strong>${status ? `<span>${parts(status)}</span>` : ''}</header>${rows}</section>`;
  }

  /* ---- TaskHold binding: SentriUI.holdBind, with farrowing's caption — the caption (`HOLD TO END`) stays as it is through
     the hold (farrowing shows only the sweep); the cues still reach the hold's status line (statusId) when there is one.
     The unknown phase keeps the Button card's message. Same options and return as SentriUI.holdBind. ---- */
  function holdBind(scope, opts = {}) {
    const UI = root.SentriUI, sel = opts.selector || '.st-hold', idle = new WeakMap();
    const keep = b => { const c = b && b.querySelector('.st-hold-caption'); if (c && b.getAttribute('data-phase') === 'idle') idle.set(b, c.outerHTML); };
    scope.querySelectorAll(sel).forEach(keep);
    const early = e => { const b = e.target.closest && e.target.closest(sel); if (b) keep(b); };
    scope.addEventListener('pointerdown', early, true);
    scope.addEventListener('keydown', early, true);
    const onPhase = opts.onPhase;
    return UI.holdBind(scope, Object.assign({}, opts, { onPhase(b, phase, cue) {
      const c = b.querySelector('.st-hold-caption');
      if (phase !== 'unknown' && c && idle.has(b) && c.outerHTML !== idle.get(b)) c.outerHTML = idle.get(b);
      if (onPhase) onPhase(b, phase, cue);
    } }));
  }

  /* ---- TaskDoors: a list of doors. card: false (default) — flat door rows (SentriTask.door, no id column).
     card: true — farrowing's Pen page / sow-actions list: an optional section title with its icon, then the doors in one
     card, each with a 34px tinted icon tile, a title and one description line, a chevron (the design system's Row).
     items: [{ title, description, icon, action, value, label }] (text slots); title / icon: the section's. ---- */
  function doors({ card = false, title, icon = '', items = [], label } = {}) {
    if (!card) return `<div class="tk-doors" data-ds="TaskDoors"${L(label)}>${items.map(door).join('')}</div>`;
    const UI = root.SentriUI, u = v => obj(v == null ? '' : v);
    const st = (slot, key, out) => { const o = u(slot); if (o.str) { out.strs[key] = o.str; if (o.args) out.args[key] = o.args; } return o.text ?? ''; };
    const head = sectionHead(title, icon);
    const rows = items.map(i => { const r = { strs: {}, args: {} }; const t = st(i.title, 'title', r); const d = i.description != null ? st(i.description, 'description', r) : undefined;
      return UI.row(Object.assign({ title: t, icon: i.icon ? glyph(i.icon) : undefined, action: i.action || 'open', value: i.value || '', strs: r.strs, args: r.args }, d !== undefined ? { description: d } : {})); }).join('');
    return `<section class="tk-doors" data-ds="TaskDoors" data-card=""${L(label)}>${head}${UI.rowGroup(rows)}</section>`;
  }

  /* A section heading (SentriUI.heading, kind 'section') from text slots: title, meta and a glyph name. */
  function sectionHead(title, icon, meta) {
    if (!title) return '';
    const UI = root.SentriUI, h = { strs: {}, args: {} };
    const slot = (v, k) => { const o = obj(v); if (o.str) { h.strs[k] = o.str; if (o.args) h.args[k] = o.args; } return o.text ?? ''; };
    const t = slot(title, 'title'), m = meta ? slot(meta, 'meta') : undefined;
    return UI.heading(Object.assign({ title: t, icon: icon ? glyph(icon) : '', kind: 'section', level: 3, strs: h.strs, args: h.args }, m !== undefined ? { meta: m } : {}));
  }

  /* ---- TaskTable: farrowing's comparison table (Task overview · Choose a unit): a section heading, then one card —
     a column-heading line (9px, as farrowing) and one door row per place: its name (and a 9px subline), a mono figure per
     column, a green chevron. columns: [text slots]; rows: [{ name, sub, values: [text slots], action, value, label,
     current }]. ---- */
  function table({ title, icon = '', meta, nameColumn = '', columns = [], rows = [], label } = {}) {
    const n = columns.length;
    const cols = `<div class="tk-table-columns" aria-hidden="true"><span>${T(nameColumn)}</span>${columns.map(c => `<span>${T(c)}</span>`).join('')}<span></span></div>`;
    const body = rows.map(r => `<div role="listitem"><button type="button" class="tk-table-row"${A(r.action || 'open', r.value)}${L(r.label)}${r.current ? ' aria-current="true"' : ''}>
      <span class="tk-table-name"><strong>${T(r.name)}</strong>${r.sub ? `<small>${T(r.sub)}</small>` : ''}</span>${(r.values || []).map(v => `<span class="tk-table-figure">${T(v)}</span>`).join('')}${glyph('chevron')}</button></div>`).join('');
    return `<section class="tk-table" data-ds="TaskTable" style="--tk-cols:${n}"${L(label ?? title)}>${sectionHead(title, icon, meta)}<div class="tk-table-surface">${cols}<div role="list">${body}</div></div></section>`;
  }

  /* ---- TaskMetrics: farrowing's performance card (Task overview · Performance metrics): a section heading, then one
     card — two headline measures (label, a 28px mono figure with an optional unit, a subline; subTone 'amber' when below
     target), a rule, then small totals. measures: [{ label, value, unit, sub, subTone }]; totals: [{ label, value }]. ---- */
  function metrics({ title, icon = '', meta, measures = [], totals: tt = [], label } = {}) {
    const m = measures.map(x => `<div><span>${T(x.label)}</span><strong>${T(x.value)}${x.unit ? `<small>${T(x.unit)}</small>` : ''}</strong>${x.sub ? `<small${x.subTone ? ` data-tone="${esc(x.subTone)}"` : ''}>${T(x.sub)}</small>` : ''}</div>`).join('');
    const t = tt.length ? `<dl class="tk-metrics-totals">${tt.map(x => `<div><dt>${T(x.label)}</dt><dd>${T(x.value)}</dd></div>`).join('')}</dl>` : '';
    return `<section class="tk-metrics" data-ds="TaskMetrics"${L(label ?? title)}>${sectionHead(title, icon, meta)}<div class="tk-metrics-surface"><div class="tk-metrics-pair">${m}</div>${t}</div></section>`;
  }

  /* ---- TaskTotals: the few figures a sheet commits, at farrowing's Finish size (Born 14 · Alive 9 · Dead 5) ----
     items: [{ label, value }] (text slots); columns: 2 | 3 (default 3). */
  function totals(items = [], { columns = 3, label } = {}) {
    return `<dl class="st-panel tk-totals" data-ds="TaskTotals" data-columns="${columns === 2 ? 2 : 3}"${L(label)}>${items.map(i => `<div class="tk-total"><dt>${T(i.label)}</dt><dd>${T(i.value)}</dd></div>`).join('')}</dl>`;
  }

  /* ---- TaskDock ---- */
  /* unit: farrowing's labelled place control at the dock's start (B1 / Go to pen): { icon = 'grid', label, caption, action,
     value, aria } — the place in 13px/600 mono over a 9px caption, the icon left, no frame. */
  function dock({ primary, tools = [], unit } = {}) {
    const u = unit ? `<button type="button" class="tk-dock-unit"${A(unit.action || 'unit', unit.value)}${L(unit.aria)}>${glyph(unit.icon || 'grid')}<span><strong>${T(unit.label)}</strong>${unit.caption ? `<small>${T(unit.caption)}</small>` : ''}</span></button>` : '';
    const p = u + (primary ? `<button type="button" class="tk-dock-primary"${A(primary.action, primary.value)}>${primary.icon ? glyph(primary.icon) : ''}<span>${T(primary.label)}</span></button>` : '');
    const t = tools.map(x => `<button type="button" class="tk-dock-tool"${A(x.action, x.value)}${L(x.label)}>${glyph(x.icon)}</button>`).join('');
    return `<nav class="tk-dock" data-ds="TaskDock"${L(tools.label)}>${p}${t}</nav>`;
  }

  /* ---- Footer: Back + one primary (a Button spec, a hold spec, or raw HTML) ---- */
  function back({ action = 'back', value = '', label = { text: 'Back', str: 'act.back' } } = {}) {
    return `<button type="button" class="tk-back"${A(action, value)}>${glyph('back-chevron')}<span>${T(label)}</span></button>`;
  }
  /* status: { text, str, args, id, tone, action } — one status line directly above the footer (the reason a waiting primary
     waits, or the hold's progress line); it is wired as the primary's aria-describedby / the hold's statusId. action:
     { label, action, value } adds one text action at the line's end (`42 is right`). */
  function footer({ back: b = {}, primary, hold: h, status } = {}) {
    let s = '';
    if (status) {
      const id = status.id || 'tk-footer-status';
      // Farrowing draws no line above a footer: the status is read (role=status, the primary's / hold's description) but
      // visually hidden, unless the page opts in (`visible: true`, e.g. after a tap on the waiting primary).
      // A line that carries a text action (`17 is right`) is shown unless the page says `visible: false`: its act must be
      // reachable.
      const vis = status.visible != null ? !!status.visible : !!status.action, hid = vis ? '' : ' st-visually-hidden';
      const act = vis && status.action ? button(Object.assign({ register: 'text' }, status.action)) : '';
      if (!vis) s = `<p class="tk-footer-status${hid}" id="${esc(id)}" role="status" aria-live="polite"${status.tone ? ` data-tone="${esc(status.tone)}"` : ''}>${T(status)}</p>`;
      else s = act
        ? `<div class="tk-footer-status" data-action-slot><p id="${esc(id)}" role="status" aria-live="polite"${status.tone ? ` data-tone="${esc(status.tone)}"` : ''}>${T(status)}</p>${act}</div>`
        : `<p class="tk-footer-status" id="${esc(id)}" role="status" aria-live="polite"${status.tone ? ` data-tone="${esc(status.tone)}"` : ''}>${T(status)}</p>`;
      if (h && !h.statusId) h = Object.assign({}, h, { statusId: id });
      if (primary && typeof primary === 'object' && !primary.describedby) primary = Object.assign({}, primary, { describedby: id });
    }
    return `${s}<div class="tk-footer" data-ds="TaskFooter">${b ? back(b) : ''}${h ? hold(h) : button(primary)}</div>`;
  }

  /* ---- The overlay layer model ----
     Every overlay (scrim, sheet, page, dialog) sits on a layer: z = base + 10 × layer (scrim 2, sheet 3, page 5, dialog 8).
     Layer 0 is over the task screen. An overlay placed after a page or a sheet in the phone rises one layer on its own
     (CSS); `layer: n` sets it explicitly for deeper stacks (a sheet over a sheet over a page: layer 2). */
  const LY = n => (n ? ` data-layer="${esc(n)}"` : '');

  /* ---- TaskSheet: the drawer ---- */
  function scrim({ action = 'dismiss', label = { text: 'Dismiss sheet', str: 'tk.sheet.dismiss' }, layer = 0 } = {}) {
    return `<button type="button" class="tk-scrim" data-ds="TaskSheet"${LY(layer)}${A(action)}${L(label)}></button>`;
  }
  /* size: compact | short | medium | long (the max height). height: 'content' (default) | 'full'.
     close: { action, label } draws the ✕; aside: raw HTML in its place (a text action such as Clear). */
  function sheet({ title, subtitle, subtitleTone = '', close = { action: 'dismiss' }, aside = '', body = '', footer: f = '', size = 'medium', height = 'content', label, view = '', layer = 0, inert = false } = {}) {
    const x = aside || (close ? `<button type="button" class="tk-sheet-close"${A(close.action || 'dismiss', close.value)}${L(close.label, { text: 'Close', str: 'act.close' })}>${glyph('close')}</button>` : '');
    const sub = subtitle ? `<p class="tk-sheet-subtitle"${subtitleTone ? ` data-tone="${esc(subtitleTone)}"` : ''}>${parts(subtitle)}</p>` : '';
    return `<section class="tk-sheet" data-ds="TaskSheet" role="dialog" aria-modal="true" tabindex="-1" data-st-context="drawer"${LY(layer)}${inert ? ' inert' : ''} data-size="${esc(size)}"${height === 'full' ? ' data-height="full"' : ''}${view ? ` data-view="${esc(view)}"` : ''}${L(label ?? title)}>
      <div class="tk-grab" aria-hidden="true"></div>
      <header class="tk-sheet-head"><div class="tk-sheet-titles"><h2 class="tk-sheet-title">${T(title)}</h2>${sub}</div>${x}</header>
      <div class="tk-sheet-body">${body}</div>${f}</section>`;
  }
  function drawer(o = {}) { return scrim(Object.assign({ layer: o.layer || 0 }, o.scrim)) + sheet(o); }

  /* ---- TaskPage: the record page ----
     aside: raw HTML at the right end of the title line (text actions such as Clear), as a sheet's aside.
     inert: while a drawer or dialog is over the page. view: data-view (the host's state name). descriptionTone: 'amber' |
     'red' | 'green' colours the whole description line (a part can still carry its own tone). */
  function page({ title, description, descriptionTone = '', body = '', footer: f = '', label, bar = true, aside = '', inert = false, layer = 0, view = '' } = {}) {
    const t = `<h2 class="tk-page-title">${T(title)}</h2>`;
    return `<section class="tk-page" data-ds="TaskPage" role="region" tabindex="-1" data-st-context="page"${LY(layer)}${view ? ` data-view="${esc(view)}"` : ''}${inert ? ' inert' : ''}${L(label ?? title)}>${bar ? statusbar() : ''}
      <header class="tk-page-head"${aside ? ' data-aside' : ''}>${aside ? `<div class="tk-page-titleline">${t}<div class="tk-page-aside">${aside}</div></div>` : t}${description ? `<p class="tk-page-desc"${descriptionTone ? ` data-tone="${esc(descriptionTone)}"` : ''}>${parts(description)}</p>` : ''}</header>
      <div class="tk-page-body">${body}</div>${f || footer({})}</section>`;
  }

  /* ---- TaskDialog ---- */
  function dialog({ title, icon = '', description, body = '', footer: f = '', label, layer = 0 } = {}) {
    return `<div class="tk-dialog-backdrop" data-ds="TaskDialog"${LY(layer)}><div class="tk-dialog" role="dialog" aria-modal="true"${L(label ?? title)}>
      <div class="tk-dialog-body"><h2 class="tk-dialog-title">${icon ? glyph(icon) : ''}${T(title)}</h2>${description ? `<p class="tk-dialog-desc">${parts(description)}</p>` : ''}${body}</div>${f}</div></div>`;
  }

  /* ---- TaskChips (candidate): one row of filter chips over a task list — `All · Iron 4 · Castrate 6 · Done 3`. One is
     chosen at a time (a radio group: role=radiogroup, each chip role=radio with aria-checked and a roving tab stop; wire the
     arrow keys with SentriUI.radioBind). The row scrolls sideways; its end keeps a gutter so the last chip is never cut.
     items: [{ value, label, count, checked, aria }] (label and count are text slots; count is drawn in mono inside the
     chip). action: the one data-action for every chip. key: the group's data-field (radioBind's field). ---- */
  function chips({ items = [], action = 'chip', key = 'chips', label } = {}) {
    const on = items.some(i => i.checked) ? items.find(i => i.checked).value : (items[0] && items[0].value);
    const b = items.map(i => `<button type="button" class="tk-chips-chip" role="radio" aria-checked="${i.value === on ? 'true' : 'false'}" tabindex="${i.value === on ? 0 : -1}"${A(action, i.value)}${L(i.aria)}><span class="tk-chips-label">${T(i.label)}</span>${i.count != null && i.count !== '' ? `<span class="tk-chips-count">${T(i.count)}</span>` : ''}</button>`).join('');
    return `<div class="tk-chips" data-ds="TaskChips" data-field="${esc(key)}"><div class="tk-chips-track" role="radiogroup"${L(label)}>${b}</div></div>`;
  }

  const api = { T, statusbar, phone, screen, header, latest, summary, progress, lens, chips, list, group, row, door, doors, radios, warning, section, receipt, day, holdBind, table, metrics, stepper, photos, choice, totals, dock, back, footer, scrim, sheet, drawer, page, dialog, glyph };
  root.SentriTask = api;
  if (typeof module !== 'undefined') module.exports = api;
})(globalThis);

<script>/* state.js */
/* Simple piglet processing: the whole state model. Plain JS, kept in sessionStorage.
   A pen is a litter. Each step on the farm's plan (a treatment, or the ID step) has a window in days of the pen's age.
   Treatments: for every pen we keep `got`, how many of the piglets alive now have had it; still to do = alive − got.
   Identity: the farm's scheme says who gets an ID — 'tag' or 'notch' every piglet, 'breeders' (tag only the piglets kept
   for breeding), or 'none' (fatteners raised as a batch: no ID step at all). */
(function (root) {
  'use strict';
  var KEY = 'pp-simple-v5';
  var ME = 'G. Hansen', OTHER = 'L. Madsen';
  var PLAN = [
    { key: 'iron', from: 2, to: 4 },
    { key: 'tail', from: 2, to: 4 },
    { key: 'castrate', from: 3, to: 7 },
    { key: 'cocci', from: 3, to: 5 }
  ];
  var ID = { key: 'id', from: 3, to: 7 };   // the farm's ID day: day 3, until day 7
  var SCHEMES = ['tag', 'notch', 'breeders', 'none'];
  var BATCH = { name: '40', firstDay: 1, lastDay: 6 };   // the batch farrowed over these pen ages
  var FIRST_TAG = 1201;   // tags come on pre-printed strips of six-digit numbers: 001201, 001202, …
  var tag6 = function (n) { return ('000000' + n).slice(-6); };

  function todayAt(h, m) { var d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); }
  function daysAgoAt(n, h, m) { return todayAt(h, m) - n * 864e5; }

  /* ---- sample farm: 12 pens in two rows of one batch, day 1–6 ---- */
  function seed(scheme) {
    scheme = SCHEMES.indexOf(scheme) >= 0 ? scheme : 'tag';
    var pens = {}, records = [], seq = 0, litter = 21;
    function pen(code, age, born, dead, extra) {
      var i = Object.keys(pens).length;
      var p = { code: code, row: code[0], age: age, born: born, alive: born - dead, dead: dead, sowDied: false, movedIn: 0, movedOut: 0,
        sow: '000' + (231 + i * 7), parity: 1 + (i * 5) % 6, litter: litter++, ids: [], idIn: 0, idOut: 0, picked: null, sex: null, weights: [], tr: {} };
      PLAN.forEach(function (t) { p.tr[t.key] = { got: 0, why: '' }; });
      Object.assign(p, extra || {});
      pens[code] = p;
      return p;
    }
    function give(code, tr, n, ago, h, m, who, mark, why) {
      var p = pens[code];
      records.push({ id: 'r' + (++seq), pen: code, tr: tr, n: n, at: daysAgoAt(ago, h, m), day: p.age - ago, who: who || ME, mark: mark || '' });
      p.tr[tr].got += n;
      if (why) p.tr[tr].why = why;
    }
    var tagNo = FIRST_TAG;
    function ident(code, count, ago, h, m, breeders, who) {
      var p = pens[code];
      for (var i = 0; i < count; i++) {
        var keep = breeders.indexOf(i) >= 0;
        var no = scheme === 'notch' ? p.litter + '-' + (p.ids.length + 1) : tag6(tagNo++);
        var at = daysAgoAt(ago, h, m + i);
        p.ids.push({ no: no, tag: scheme === 'notch' ? '' : no, notch: scheme === 'notch' ? no : '', sex: i % 2 ? 'boar' : 'gilt', kg: i === 0 ? 1.6 : null, keep: keep, at: at, who: who || ME });
        records.push({ id: 'r' + (++seq), pen: code, tr: 'id', n: 1, no: no, at: at, day: p.age - ago, who: who || ME, mark: '' });
      }
    }
    pen('A01', 6, 13, 1); pen('A02', 5, 12, 0); pen('A03', 4, 13, 1); pen('A04', 3, 11, 0); pen('A05', 3, 12, 0); pen('A06', 2, 14, 1);
    pen('B01', 6, 12, 1); pen('B02', 5, 12, 1, { sowDied: true }); pen('B03', 4, 13, 0); pen('B04', 2, 12, 1); pen('B05', 1, 11, 0); pen('B06', 1, 13, 0);
    // A01: everything given
    give('A01', 'iron', 12, 3, 8, 5); give('A01', 'tail', 12, 3, 8, 12); give('A01', 'castrate', 12, 2, 9, 30); give('A01', 'cocci', 12, 2, 9, 40);
    // A02: iron and tail by the other worker; castrate and cocci due
    give('A02', 'iron', 12, 2, 8, 30, OTHER); give('A02', 'tail', 12, 2, 8, 34, OTHER);
    // A03: iron 10 of 12, 2 weak ones left for later; tail done
    give('A03', 'iron', 10, 1, 8, 40, ME, '', 'weak'); give('A03', 'tail', 12, 1, 8, 46);
    // A05: tail this morning, iron still due
    give('A05', 'tail', 12, 0, 8, 20);
    // B01: iron missed (late); tail, castrate, cocci given
    give('B01', 'tail', 11, 3, 9, 2); give('B01', 'castrate', 11, 1, 9, 10); give('B01', 'cocci', 11, 1, 9, 14);
    // B02: sow died; iron and tail given
    give('B02', 'iron', 11, 2, 9, 20); give('B02', 'tail', 11, 2, 9, 24);
    // B03: iron this morning
    give('B03', 'iron', 13, 0, 7, 52);
    // litter weights: birth weights on a few litters, A01 weighed again on its ID day
    ['A01', 'A02', 'B03'].forEach(function (c, i) { pens[c].weights.push({ kg: [15.2, 14.1, 16.8][i], day: 0 }); });
    pens.A01.weights.push({ kg: 24.6, day: 4 }); pens.A01.sex = { boar: 6, gilt: 6 };
    // identity: A01 all done; A02 four of twelve so far, one kept for breeding
    if (scheme === 'tag' || scheme === 'notch') { ident('A01', 12, 2, 10, 0, []); ident('A02', 4, 0, 7, 30, [1]); }
    if (scheme === 'breeders') {
      ident('A01', 1, 2, 10, 0, [0]); pens.A01.picked = { at: daysAgoAt(2, 10, 5), who: ME };
      ident('A02', 1, 0, 7, 30, [0]);
    }

  }

  var S;
  function load() {
    try { S = (window.AtlasBare && window.AtlasBare.bare) ? null : JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }   // a bare atlas screen starts from the sample and keeps nothing
    if (!S || !S.pens) S = seed('tag');
  }
  function save() { if (window.AtlasBare && window.AtlasBare.bare) return; try { sessionStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private window: the demo still runs */ } }
  function reset() { S = seed(S ? S.scheme : 'tag'); save(); }

  function setScheme(s) { S = seed(s); save(); }

  /* ---- reading ---- */
  function hasId() { return S.scheme !== 'none'; }
  function steps() { return PLAN.map(function (t) { return t.key; }).concat(hasId() ? ['id'] : []); }
  function plan(k) { return k === 'id' ? (hasId() ? ID : null) : PLAN.filter(function (t) { return t.key === k; })[0] || null; }
  function idCount(p) { return Math.max(0, Math.min(p.alive, p.ids.length - p.idOut + p.idIn)); }
  function breeders(p) { return p.ids.filter(function (x) { return x.keep; }).length; }
  function need(p, k) {

  function recs(code, k) { return S.records.filter(function (r) { return r.pen === code && (!k || r.tr === k); }); }

  function status(p, k) {

    var window = p.age < t.from ? 'coming' : p.age > t.to ? 'late' : 'due';
    if (k === 'id') {
      if (S.scheme === 'breeders') return p.picked ? 'done' : window;
      return need(p, k) === 0 ? 'done' : window;
    }

  function todo(p) { return steps().filter(function (k) { var s = status(p, k); return s === 'due' || s === 'late' || s === 'left'; }); }

  function pens() { return Object.keys(S.pens).sort().map(function (c) { return S.pens[c]; }); }

  function bulkPlace(p, k) {

  }
  function sameBatch(a, b) { return a.code !== b.code && b.age >= BATCH.firstDay && b.age <= BATCH.lastDay; }
  /* The next ID to suggest: the farm's next tag number, or this litter's next notch */
  function nextNo(code) {
    var p = S.pens[code];
    if (S.scheme === 'notch') {
      var used = p.ids.filter(function (x) { return x.notch; }).map(function (x) { return +String(x.notch).split('-')[1] || 0; });
      return p.litter + '-' + ((used.length ? Math.max.apply(null, used) : 0) + 1);
    }
    var max = FIRST_TAG - 1;
    Object.keys(S.pens).forEach(function (c) { S.pens[c].ids.forEach(function (x) { if (x.tag && +x.tag > max) max = +x.tag; }); });
    return tag6(max + 1);
  }
  function taken(no) {
    return Object.keys(S.pens).some(function (c) { return S.pens[c].ids.some(function (x) { return x.tag === String(no) || x.notch === String(no); }); });
  }

  /* ---- writing: every change keeps the state before it, so the last one can be undone ---- */

  }
  function undo() {

  }

    if (S.ended) return;

  function record(code, k, n, opts) {
    opts = opts || {};
    var p = S.pens[code], r = { id: 'r' + (++S.seq), pen: code, tr: k, n: n, at: Date.now(), day: p.age, who: ME, mark: opts.mark || '', prevWhy: p.tr[k].why };
    S.records.push(r);

    p.tr[k].why = need(p, k) > 0 ? (opts.why || p.tr[k].why || '') : '';

      S.records.push({ id: 'r' + (++S.seq), pen: code, tr: 'id', n: 1, no: x.no, at: x.at, day: p.age, who: ME, mark: st === 'late' ? 'late' : '' });

  }
  /* Give IDs, one piglet at a time: { tag, notch, sex, kg, keep } is saved at once (nothing waits for a submit) */
  function givePig(code, pig) {
    return change('id', function () {
      var p = S.pens[code], st = status(p, 'id');
      var x = { no: pig.tag || pig.notch, tag: pig.tag || '', notch: pig.notch || '', sex: pig.sex, kg: pig.kg == null || pig.kg === '' ? null : +pig.kg,
        keep: S.scheme === 'breeders' ? true : !!pig.keep, at: Date.now(), who: ME };
      p.ids.push(x);
      S.records.push({ id: 'r' + (++S.seq), pen: code, tr: 'id', n: 1, no: x.no, at: x.at, day: p.age, who: ME, mark: st === 'late' ? 'late' : '' });

    });
  }
  /* Fix one piglet's record (tap its row): the record is replaced, stamped again */
  function fixPig(code, no, pig) {
    return change('id-fix', function () {
      var p = S.pens[code], x = p.ids.filter(function (y) { return y.no === no; })[0];
      if (!x) return null;
      x.tag = pig.tag || ''; x.notch = pig.notch || ''; x.no = x.tag || x.notch; x.sex = pig.sex;
      x.kg = pig.kg == null || pig.kg === '' ? null : +pig.kg; x.keep = S.scheme === 'breeders' ? true : !!pig.keep; x.at = Date.now(); x.who = ME;

  /* Mark or unmark one identified piglet as a breeder (the mark on the identified piglets list) */
  function toggleBreeder(code, no) {
    return change('breeder', function () {

  /* Take back one piglet's ID (the "Last … · Undo" line) */
  function removePig(code, no) {
    var p = S.pens[code];

  }
  /* The litter, after the last piglet: its total weight, and boar / gilt counts when some piglets have no ID */
  function setLitter(code, litter) {
    return change('litter', function () {
      var p = S.pens[code];
      if (litter.kg != null && litter.kg !== '') p.weights.push({ kg: +litter.kg, day: p.age, at: Date.now() });
      if (litter.boar != null) p.sex = { boar: litter.boar, gilt: litter.gilt };
      return true;
    });
  }
  /* Breeders-only farm: the worker says this litter's breeders are all picked */
  function donePicking(code) {
    return change('pick', function () {
      var p = S.pens[code];
      p.picked = { at: Date.now(), who: ME };
      S.records.push({ id: 'r' + (++S.seq), pen: code, tr: 'pick', n: breeders(p), at: Date.now(), day: p.age, who: ME, mark: '' });
      return breeders(p);
    });
  }

  function death(code, causes) {

      var p = S.pens[code], k = 0;

    });
  }
  /* Move n piglets; had: { stepKey: true|false } for what was given (or the ID) in the pen they leave */
  function move(from, to, n, had) {
    return change('move', function () {
      var a = S.pens[from], b = S.pens[to];

      PLAN.forEach(function (t) {
        var k = t.key;
        if (had[k]) { a.tr[k].got = Math.max(0, a.tr[k].got - n); b.tr[k].got += n; }
        if (!had[k] && need(b, k) > 0 && recs(to, k).length) b.tr[k].why = 'moved';
      });
      if (had.id) { a.idOut += n; b.idIn += n; }
      clamp(a); clamp(b);
      S.records.push({ id: 'r' + (++S.seq), pen: from, tr: 'move', n: n, to: to, at: Date.now(), day: a.age, who: ME, mark: '' });

    });
  }
  /* Set count: the pen's record becomes what is there now (round 9). No reason is asked and the pen shows no status; the

    return change('count', function () {
      var p = S.pens[code], diff = p.alive - n;

      S.unaccounted = (S.unaccounted || 0) + diff;
      p.alive = n;
      full.forEach(function (k) { p.tr[k].got = n; });
      clamp(p);
      S.records.push({ id: 'r' + (++S.seq), pen: code, tr: 'count', n: n, at: Date.now(), day: p.age, who: ME, mark: '' });
      return n;
    });
  }
  function end() { if (S.ended) return; S.ended = { at: Date.now(), who: ME }; S.undo = null; save(); }

  /* Two phones: the other phone recorded iron on A05 at 08:40 while this one was offline. First record in wins. */
  function otherPhone() {
    var code = 'A05', k = 'iron', p = S.pens[code], at = todayAt(8, 40);
    if (S.ended) return { kind: 'ended' };
    var theirs = recs(code, k).filter(function (r) { return r.who === OTHER; })[0];
    if (theirs) return { kind: 'again' };
    var mine = recs(code, k).filter(function (r) { return r.who === ME; });

      S.records.push({ id: 'r' + (++S.seq), pen: code, tr: k, n: n, at: at, day: p.age, who: OTHER, mark: '' });

    PLAN: PLAN, ID: ID, SCHEMES: SCHEMES, BATCH: BATCH, ME: ME, OTHER: OTHER,

<script>/* app.js */
/* Simple piglet processing: the screens. Built from the task skeleton (window.SentriTask) and the design-system cards
   (window.SentriUI); the data is state.js (window.PPS), the words strings.js (window.PPT). One render() draws the phone.
   Structure and flow follow the farm's existing design (Figma 生产任务 · 仔猪处理, research/inventory.md §2): a list by pen,
   and inside a pen two tabs — Processing (a checklist by age-day, one tick per item, one Submit) and Piglets (what is in

(function () {
  'use strict';

  }

  function md(ms) { var d = new Date(ms); return pad(d.getMonth() + 1) + '/' + pad(d.getDate()); }
  function sameDay(ms) { return new Date(ms).toDateString() === new Date().toDateString(); }
  function when(r) { return sameDay(r.at) ? hm(r.at) : md(r.at) + ' ' + hm(r.at); }
  function short(who) { var p = who.split(/[.\s]+/).filter(Boolean); return p.length > 1 ? p[0] + '.' + p[p.length - 1][0] : who; }
  var scheme = function () { return P.s.scheme; };
  var tr = function (k) { return k === 'id' ? T('tr.id.' + scheme()) : T('tr.' + k); };
  var trl = function (k) { return k === 'id' ? T('trl.id.' + scheme()) : T('trl.' + k); };
  var chipName = function (k) { return k === 'id' ? T('chip.id.' + scheme()) : T('tr.' + k); };

  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  function idWhat(p) { var x = idKey(p); return T(x[0], x[1]); }
  function idS(p) { var x = idKey(p); return S(x[0], x[1]); }
  var reduced = function () { return (window.AtlasBare && window.AtlasBare.bare) || window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; };
  function lastWeight(p) { return p.weights.length ? p.weights[p.weights.length - 1] : null; }

  /* ================= the pen list: one row per pen ================= */
  /* One rule for "needs it today": the step is due, late, or has piglets left from before. The summary card, the chip's
     count and the chip's list all use it. */
  function needsToday(p, k) { var s = P.status(p, k); return s === 'due' || s === 'late' || s === 'left'; }
  /* `due today · 12 piglets`, `late · day 6 · 11 piglets`, `2 left · weak` (the End page's not-done list) */
  function todoMeta(p) {

  }
  function penChip(p) {   // the End page's rows
    var sts = P.todo(p).map(function (k) { return P.status(p, k); });
    if (!P.s.ended && sts.indexOf('late') >= 0) return S('chip.late', null, 'amber');
    if (p.sowDied) return S('chip.sow', null, 'red');
    return null;
  }
  function names(keys) { return keys.reduce(function (acc, k, i) { return (i ? acc.concat([SEP]) : acc).concat([S(chipKey(k))]); }, []); }
  /* One status chip under the sow ID, in farrowing's chip style (its Active / Done / Sow died): Late, Sow died, To do,
     Done — one at most. */
  function sowChip(p) {
    var sts = P.todo(p).map(function (k) { return P.status(p, k); });
    if (P.s.ended) return null;
    if (sts.indexOf('late') >= 0) return S('chip.late', null, 'amber');
    if (p.sowDied) return S('chip.sow', null, 'red');
    if (sts.length) return S('st.todo', null, 'green');
    return P.coming(p).length ? null : S('chips.done');
  }
  /* The pen's card, exactly farrowing's room list: the pen header (`A03 · 1 sow ›`, TaskGroup) and the sow's row under it
     (TaskRow): mono sow ID with its one chip; the headline is what is due (or, with nothing due, farrowing's figure:
     `12 piglets`, or the forecast `Iron in 2 days` as farrowing's `Due tomorrow`); the meta is one mono line,
     `12 piglets · day 4 · 08:20 · G.H` (farrowing's `born 14 · 1h ago · G.H`). Done rows end in farrowing's edit pencil. */
  function penCard(p) {
    var td = P.todo(p), c = P.coming(p), headline, tone = '', figure = false;
    var lastR = newest(P.recs(p.code));
    if (P.s.ended) { headline = [S('ended.row')]; tone = 'forecast'; }
    else if (td.length) headline = names(td);
    else if (c.length) {
      var next = Math.min.apply(null, c.map(function (k) { return P.plan(k).from; }));
      headline = [S('st.in', { tr: chipName(c.filter(function (k) { return P.plan(k).from === next; })[0]), n: next - p.age })]; tone = 'forecast';
    } else { headline = [S('piglets', { n: p.alive })]; figure = true; }
    var meta = figure ? [] : [S('piglets', { n: p.alive }), SEP];
    meta.push(S('day.n', { d: p.age }));
    if (lastR) meta.push(SEP, S('fig', { v: sameDay(lastR.at) ? hm(lastR.at) : md(lastR.at) }), SEP, S('fig', { v: short(lastR.who) }));
    var done = !P.s.ended && !td.length && !c.length;
    var row = K.row({ id: S('code', { c: p.sow }), chip: sowChip(p), headline: headline, tone: tone, meta: meta, action: 'pen', value: p.code, trail: done ? 'edit' : 'chevron' });
    return K.group({ title: S('code', { c: p.code }), meta: S('sows.one'), door: { action: 'pen', value: p.code, label: T('pen.aria', { pen: p.code }) }, rows: row });
  }
  function isDone(p) { return P.todo(p).length === 0; }
  /* the chips: All · one per job that pens need today (with how many) · Done. A chip only filters the pens. */
  function chipCounts() {
    var all = P.pens();
    if (P.s.ended) return [];
    return P.steps().map(function (k) { return { k: k, n: all.filter(function (p) { return needsToday(p, k); }).length }; })
      .filter(function (c) { return c.n > 0 || c.k === V.chip; });
  }
  function chipsRow() {
    var all = P.pens(), done = all.filter(isDone).length;
    var items = [{ value: '', label: S('chips.all'), count: S('fig', { v: all.length }), checked: V.chip === '', aria: T('chips.all') }]
      .concat(chipCounts().map(function (c) { return { value: c.k, label: S(chipKey(c.k)), count: S('fig', { v: c.n }), checked: V.chip === c.k, aria: T('chip.aria', { name: chipName(c.k), n: c.n }) }; }))
      .concat([{ value: 'done', label: S('chips.done'), count: S('fig', { v: done }), checked: V.chip === 'done', aria: T('chips.done') }]);
    return K.chips({ items: items, action: 'chip', key: 'chips', label: T('chips.label') });
  }
  /* the task's overall checker: piglets the records cannot account for (set counts lower than the record), batch level only */
  function batchLine() { var u = P.s.unaccounted || 0; return u > 0 ? S('batch.unacc', { b: P.BATCH.name, n: u }) : S('batch', { b: P.BATCH.name }); }
  function listScreen(inert) {
    var all = P.pens(), done = all.filter(isDone), todo = all.filter(function (p) { return !isDone(p); }), ended = P.s.ended;
    var last = P.last();
    var body = K.latest(last ? { lead: S('last'), value: S('fig', { v: hm(last.at) }), rest: S('last.who', { who: last.who }) } : { lead: S('last.none') });
    if (V.flash && !V.pen) body += flashLine();
    P.s.notes.forEach(function (n, i) {
      if (n.seen) return;
      body += '<div class="sp-note">' + K.warning({ tone: 'amber', text: S('note.clash', { Tr: tr(n.tr), pen: n.pen, who: n.who, t: hm(n.at) }),
        actions: btn('ok', null, { register: 'text', action: 'note-ok', value: String(i) }) }) + '</div>';
    });
    // the summary card: the first job on the plan that pens need today (the same count as its chip) | the task, the door to End
    var best = { k: '', n: 0 };
    P.steps().forEach(function (k) {
      var n = all.filter(function (p) { return needsToday(p, k); }).length;
      if (n && !best.n) best = { k: k, n: n };
    });
    var unit = ended ? { icon: 'treat', heading: S('sum.notdone'), value: S('fig', { v: todo.length }), description: S('sum.pens', { n: todo.length }), support: batchLine() }
      : { icon: 'treat', heading: best.n ? S('sum.due', { Tr: tr(best.k) }) : S('sum.none'), value: S('fig', { v: best.n }),
        description: best.n ? S('sum.pens', { n: best.n }) : S('sum.nothing'), support: batchLine() };
    body += K.summary({
      unit: unit,
      task: { icon: 'record', heading: ended ? S('sum.ended') : S('sum.task'), count: S('fig', { v: done.length }), of: S('of', { n: all.length }), description: S('sum.done'),
        segments: [{ tone: 'done', share: done.length / all.length * 100 }, { tone: 'rest', share: 100 - done.length / all.length * 100 }], max: all.length, now: done.length,
        support: ended ? S('ended.at', { t: hm(ended.at), who: ended.who }) : S('sum.end'), action: 'end', label: T('end.title') }
    });
    body += chipsRow();
    var shown = !V.chip ? all : V.chip === 'done' ? done : all.filter(function (p) { return needsToday(p, V.chip); });
    body += shown.length ? K.list(shown.map(penCard))
      : '<p class="sp-empty">' + H(V.chip === 'done' ? 'empty.done' : 'chip.none') + '</p>';
    return K.screen({ inert: inert, label: T('task'), header: K.header({ title: S('task'), back: null }), body: body });
  }

  /* The receipt line after a save: what was saved, and Undo while it can still be taken back */
  function flashLine() {
    var f = V.flash;
    var undo = f.undoIds ? btn('undo', null, { register: 'text', action: 'undo-items' }) : f.undo && P.s.undo ? btn('undo', null, { register: 'text', action: 'undo' }) : '';
    return '<div class="sp-flash" role="status"><span>' + (f.key ? H(f.key, f.args) : esc(f.text)) + '</span>' + undo + '</div>';
  }

  /* ================= inside a pen: Processing | Piglets ================= */
  function metaHtml(parts) {
    return parts.map(function (x) {
      if (x.sep) return '<span class="tk-sep">·</span>';
      if (typeof x === 'object') return '<span class="tk-tone" data-tone="' + esc(x.tone) + '">' + esc(x.text) + '</span>';
      return esc(x);
    }).join('');
  }
  var dayDate = function (p, d) { return md(Date.now() - (p.age - d) * 864e5); };
  /* Processing: one TaskDay card per age-day (the skeleton's day card, farrowing's Piglet processing · Care). Each item is
     one row of that card — its whole row ticks it: the open ring becomes the check disc; Submit saves the ticked ones. A
     ticked item carries its count as the card's one-tap slot (fewer piglets: tap it). A day with everything done folds to
     one row (`2 done · Iron · Dock tail`); tap it to open. Later days say they can be done early. The ID item opens the
     ID form. */
  var dayDate = function (p, d) { return md(Date.now() - (p.age - d) * 864e5); };
  function doneMeta(p, k) {
    if (k === 'id') {
      var r = newest(P.recs(p.code, 'id').concat(P.recs(p.code, 'pick')));
      return r ? [short(r.who) + ' ' + when(r), SEP, idWhat(p)] : [idWhat(p)];
    }
    var rs = P.recs(p.code, k), r2 = newest(rs), n = rs.reduce(function (s2, x) { return s2 + x.n; }, 0);
    var meta = r2 ? [short(r2.who) + ' ' + when(r2), SEP, pigs(n || p.tr[k].got)] : [pigs(p.tr[k].got)];
    var mk = rs.filter(function (x) { return x.mark; })[0];
    if (mk) meta.push(SEP, { text: T(mk.mark === 'early' ? 'item.early' : mk.mark), tone: 'amber' });
    var note = P.s.notes.filter(function (x) { return x.pen === p.code && x.tr === k; })[0];
    if (note) meta.push(SEP, T('kept.note') + ' (' + hm(note.mine.at) + ')');
    return meta;
  }
  function dayItem(p, k, ended, future) {
    var t = P.plan(k), st = P.status(p, k), n = P.need(p, k);
    if (st === 'done') return { title: tr(k), meta: doneMeta(p, k), mark: 'done', action: k === 'id' ? 'id-open' : 'noop', value: k, id: 'sp-done-' + k };
    if (k === 'id') {
      var filled = scheme() === 'breeders' ? !!p.picked : P.recs(p.code, 'id').length > 0;   // opens Give IDs
      var m = [{ text: T(filled ? 'item.filled' : 'item.notfilled'), tone: filled ? 'green' : 'amber' }, SEP, idWhat(p)];
      if (st === 'late') m.push(SEP, { text: T('late'), tone: 'amber' });
      return { title: tr(k), meta: m, mark: 'due', action: ended ? 'noop' : 'id-open', value: 'id', id: 'sp-id-' + k };
    }
    var dft = V.draft[k], meta = st === 'left' ? [T('tl.given', { n: p.tr[k].got }), SEP, T('left', { n: n }), SEP, T('why.' + (p.tr[k].why || 'weak'))]
      : [T('given.days', { a: t.from, b: t.to })];
    if (st === 'late') meta.push(SEP, { text: T('late'), tone: 'amber' });
    if (future && dft) meta.push(SEP, { text: T('item.early'), tone: 'amber' });
    if (dft && dft.n < n) meta.push(SEP, { text: T('left', { n: n - dft.n }) + ' · ' + T('why.' + (dft.why || 'weak')), tone: 'amber' });
    return { title: tr(k), meta: meta, mark: dft ? 'done' : 'due', action: ended ? 'noop' : 'item', value: k, id: 'sp-tk-' + k, label: tr(k),
      act: dft ? { label: pigs(dft.n), action: 'adjust', value: k } : null };
  }
  function processing(p) {
    var ended = !!P.s.ended, days = {}, doneKs = [];
    P.steps().forEach(function (k) {
      var st = P.status(p, k), d = P.plan(k).from;
      // a step saved on this visit stays in its day card a few seconds (in place), then goes to Done
      if (st === 'done' && !V.keepOpen[k]) doneKs.push(k);
      else (days[d] = days[d] || []).push(k);
    });
    var html = UI.heading({ title: T('proc.title'), kind: 'section', level: 3, icon: I('treat') });
    html += Object.keys(days).map(Number).sort(function (a, b) { return a - b; }).map(function (d) {
      var future = d > p.age;
      var items = days[d].map(function (k) { return dayItem(p, k, ended, future); });
      var day = K.day({ title: T('day.open', { d: d }), status: future ? T('day.early') : T('day.plan', { date: dayDate(p, d) }), items: items });
      days[d].forEach(function (k) { if (V.draft[k]) day = day.replace('id="sp-tk-' + k + '-title"', 'id="sp-tk-' + k + '-title" data-ticked=""'); });
      V.justRec.forEach(function (id) { var r = P.s.records.filter(function (x) { return x.id === id; })[0]; if (r) day = day.replace('id="sp-done-' + r.tr + '-title"', 'id="sp-done-' + r.tr + '-title" data-fresh=""'); });
      return day.replace('class="tk-day"', 'class="tk-day" data-when="' + (future ? 'future' : 'today') + '"');
    }).join('');
    if (!Object.keys(days).length) html += '<p class="sp-quiet">' + esc(T('proc.nothing')) + '</p>';
    if (doneKs.length) {
      var open = !!V.open.done;
      var rows = open ? doneKs.map(function (k) { var x = dayItem(p, k, ended, false); x.meta = [T('day.n', { d: P.plan(k).from }), SEP].concat(x.meta); return x; }) : [];
      rows.push({ title: T(open ? 'tl.close' : 'tl.open'), meta: open ? '' : [doneKs.map(tr).join(' · ')], mark: '', action: 'day', value: 'done', id: 'sp-done-toggle' });
      html += K.day({ title: T('proc.done'), status: T('proc.done.n', { n: doneKs.length }), items: rows }).replace('class="tk-day"', 'class="tk-day" data-when="done"');
    }
    return '<section class="sp-proc">' + html + '</section>';
  }
  /* Piglets: what is in the pen now, then the identified piglets. Born and deaths are history: they live in the pen log. */
  /* The Piglets card: farrowing's "Litter summary · View log ›" — a section heading with its link, then the facts. Each
     figure acts on itself: piglets now → Set count; boars · gilts → the counts; litter weight → the weight pad; tagged
     and breeders → the identified piglets (where breeders are marked). */
  function factBtn(action, value, empty) {
    return '<button type="button" class="sp-fact-act" data-action="' + action + '" data-value=""' + (P.s.ended ? ' aria-disabled="true"' : '') + '>' +
      '<span' + (empty ? ' data-empty=""' : '') + '>' + esc(value) + '</span>' + I('chevron') + '</button>';
  }
  function pigletsCard(p) {
    var w = lastWeight(p), every = P.hasId() && scheme() !== 'breeders' && P.idCount(p) >= p.alive && p.alive > 0;
    var sex = every ? { boar: p.ids.filter(function (x) { return x.sex === 'boar'; }).length, gilt: p.ids.filter(function (x) { return x.sex === 'gilt'; }).length } : p.sex;
    var items = [
      { label: T('pg.sex'), valueHtml: factBtn('counts-open', sex ? T('pg.sexv', { b: sex.boar, g: sex.gilt }) : '—', !sex) },
      { label: T('pg.weight'), valueHtml: factBtn('weight-open', w ? T('kg', { w: w.kg }) : '—', !w) }];
    if (P.hasId()) {
      items.push({ label: T(scheme() === 'notch' ? 'pc.notched' : 'pc.tagged'), valueHtml: factBtn('tagged-open', T('pc.of', { n: P.idCount(p), m: p.alive })) });
      items.push({ label: T('pg.breeders'), valueHtml: factBtn('tagged-open', String(P.breeders(p))) });
    }
    var log = '<button type="button" data-action="log-open" data-value="">' + esc(T('pc.log')) + I('chevron') + '</button>';
    return '<section class="sp-pcard">' + UI.heading({ title: T('pc.title'), kind: 'section', level: 3, icon: I('record'), action: log }) +
      UI.facts(items, { columns: items.length === 4 ? 2 : items.length, className: 'sp-pfacts' }) + (w ? '' : '<p class="sp-warn">' + esc(T('pg.weight.hint')) + '</p>') + '</section>';
  }
  /* The tool row, as farrowing's (Edit · Record death · More actions): Tag piglets (per farm scheme; none on a no-ID farm) ·
     Record death · More */
  function toolRow() {
    var tools = [];
    if (P.hasId()) tools.push(['id-open', 'scan', T('tr.id.' + scheme())]);
    tools.push(['tool-death', 'alert', T('tool.death')], ['more', 'more', T('more.title')]);
    return '<div class="sp-toolrow" data-count="' + tools.length + '">' + tools.map(function (x) {
      return '<button type="button" class="sp-tool" data-action="' + x[0] + '" data-value="">' + I(x[1]) + '<span>' + esc(x[2]) + '</span></button>';
    }).join('') + '</div>';
  }
  function penSheet(inert) {
    var p = pen(), ended = !!P.s.ended, body = '';
    if (V.flash && V.flash.pen === p.code) body += flashLine();
    if (ended) body += K.warning({ tone: 'amber', text: T('ended.note') });
    body += pigletsCard(p);
    if (!ended) body += toolRow();
    body += processing(p);
    var n = Object.keys(V.draft).length;
    var foot = K.footer({ back: { action: 'back', label: T('back') }, primary: ended ? null : { label: T('submit.n', { n: n }), action: 'submit', register: 'primary', waiting: !n } });
    var sub = [T('sheet.pen', { pen: p.code, p: p.parity }), SEP, T('piglets', { n: p.alive }), SEP, T('day.n', { d: p.age })];
    return K.drawer({ title: p.sow, subtitle: sub, size: 'long', height: 'full', view: 'pen', inert: inert, close: { action: 'back', label: T('back') },
      body: body, footer: foot });
  }
  /* ---- boars · gilts: two steppers ---- */
  function countsSheet() {
    var p = pen(), c = V.counts;
    return K.drawer({ title: T('cnt.title'), subtitle: T('w.sub', { pen: p.code, d: p.age }), size: 'long', view: 'counts', close: null,
      body: stepper('boar', T('idf.boars'), c.boar) + stepper('gilt', T('idf.gilts'), c.gilt),
      footer: K.footer({ back: { action: 'back', label: T('back') }, primary: { label: T('save'), action: 'counts-save', register: 'primary' } }) });
  }
  /* ---- Piglets: the pen's identified piglets (tag/notch · sex · weight), each with its breeder flag; tap a row to fix it;
     one primary "Tag a piglet" opens the one-piglet run, which comes back here ---- */
  function taggedPage() {
    var p = pen(), ended = !!P.s.ended;
    var rows = p.ids.slice().reverse().map(function (x) {
      var id = [x.tag, x.notch].filter(Boolean).join(' · ');
      var mark = UI.iconButton({ action: ended ? 'noop' : 'breeder', value: x.no, icon: I('bookmark'), label: T(x.keep ? 'mark.off' : 'mark.on', { no: x.no }), className: 'sp-mark' })
        .replace('class="icon-button', 'aria-pressed="' + !!x.keep + '" class="icon-button');
      var row = K.row({ id: id, chip: x.keep ? { text: T('breeder'), tone: 'green' } : null, headline: T(x.sex) + (x.kg != null ? ' · ' + T('kg', { w: x.kg }) : ''),
        meta: (sameDay(x.at) ? hm(x.at) + ' · ' : '') + short(x.who), action: ended ? '' : 'give-fix', value: x.no, trail: '', still: ended, label: T('fix.aria', { no: x.no }) });
      return '<div class="sp-pigrow" data-ds="TaskRow">' + row + mark + '</div>';
    });
    var body = (!ended && p.ids.length ? '<p class="sp-quiet">' + esc(T('tagged.hint')) + '</p>' : '') +
      K.list([K.group({ title: T(scheme() === 'notch' ? 'pc.notched' : 'pc.tagged'), face: 'word', meta: '· ' + idWhat(p) + ' · ' + T('breeders.n', { n: P.breeders(p) }),
        rows: rows.length ? rows : '<p class="sp-empty">' + esc(T('id.none.yet')) + '</p>' })]);
    if (scheme() === 'breeders' && !p.picked && !ended) body += UI.button({ label: T('id.done.pick', { n: P.breeders(p) }), register: 'secondary', action: 'pick-done', className: 'sp-wide' });
    return K.page({ title: T('pl.title'), description: p.code + ' · ' + T('sow', { tag: p.sow }), view: 'tagged', body: body,
      footer: K.footer({ back: { action: 'back', label: T('back') }, primary: ended ? null : { label: T('add.' + scheme()), action: 'give-new', register: 'primary' } }) });
  }

  /* ---- More: Move piglets · Record death · Set count ---- */
  function moreSheet() {
    return K.drawer({ title: T('more.title'), size: 'medium', view: 'more', close: null,
      body: K.doors({ card: true, items: [{ title: T('move.title'), icon: 'transfer', action: 'tool', value: 'move' }, { title: T('tool.count'), icon: 'edit', action: 'tool', value: 'count' }] }),
      footer: K.footer({ back: { action: 'back', label: T('back') } }) });
  }
  /* ---- fewer piglets for one ticked item: a stepper; a shortfall asks one reason ---- */
  function stepper(key, label, value, o) {
    return K.stepper(Object.assign({ label: label, value: value, key: key, action: 'step', min: 0 }, o || {}));
  }
  function adjustSheet() {
    var p = pen(), d = V.adj, n = P.need(p, d.k), less = d.n < n;
    var body = stepper('adj', T('treat.given'), d.n, { max: n, min: 1 });
    if (less) {
      body += K.radios({ label: T('treat.why'), action: 'why', key: 'why', selected: d.why, options: [
        { value: 'weak', label: T('treat.weak') }, { value: 'sick', label: T('treat.sick') }] });
      body += '<p class="sp-quiet">' + esc(T('treat.later', { n: n - d.n })) + '</p>';
    }
    return K.drawer({ title: tr(d.k), subtitle: T('adj.sub', { pen: p.code, n: n }), size: 'long', view: 'adjust', close: null, body: body,
      footer: K.footer({ back: { action: 'back', label: T('back') }, primary: { label: T('adj.use', { n: d.n }), action: 'adjust-use', register: 'primary', waiting: less && !d.why } }) });
  }

  /* ---- Give IDs: one piglet at a time (farrowing's identity pattern, research/per-piglet-proposal.md flow a) ----
     The tag readout holds the next number on the strip ("Use 001237"); a scan replaces it; the digits are editable on the
     skeleton's Numpad. Boar · Gilt are two big tiles. Weight is optional, on the same pad. Gilts can be kept for breeding
     where the farm picks breeders here. "Record · next piglet" saves this piglet now and moves to the next number. The
     recorded piglets are listed under it; tap one to fix it. After the last, the litter's weight (and its boar/gilt
     counts, from the rows — steppers only when some piglets have no ID). */
  var notch = function () { return scheme() === 'notch'; };
  function giveBlank(p, last) {
    var nx = P.nextNo(p.code);
    return { field: '', id: { value: notch() ? nx.split('-')[1] : nx, suggested: true, suggestion: notch() ? nx.split('-')[1] : nx }, kg: '', sex: '', keep: scheme() === 'breeders',
      last: last || null, edit: '', litterKg: '', boar: p.sex ? p.sex.boar : 0, gilt: p.sex ? p.sex.gilt : 0, litterSaved: false };
  }
  function giveNo(p) { var g = V.give, v = UI.numpadCommit(g.id.value); return v == null ? '' : notch() ? p.litter + '-' + v : v; }
  function giveUsed(p) { var g = V.give, no = giveNo(p); return no && no !== g.edit && P.taken(no) ? no : ''; }
  var PADS = { id: function () { return notch() ? { maxLength: 2 } : { maxLength: 6 }; }, kg: function () { return { decimals: 1, intLength: 2 }; }, litter: function () { return { decimals: 1, intLength: 3 }; } };
  function givePad() {
    var g = V.give, f = g.field;
    if (!f) return '';
    var st = f === 'id' ? g.id : { value: f === 'kg' ? g.kg : g.litterKg, suggested: false };
    return UI.numpad(Object.assign({ value: st.value, suggested: !!st.suggested, unit: f === 'id' ? '' : 'kg', action: 'pad', key: f, compact: true,

        : UI.optionalRow({ label: T('give.kg'), optionalWord: T('optional'), value: g.kg ? T('kg', { w: g.kg }) : '', icon: I('plus'), editIcon: I('edit'), action: 'give-field', key: 'kg' });

  /* ---- the pen log: born, deaths, moves, counts, treatments, IDs — the history, newest first ---- */
  function logPage() {

  /* ================= End task (the supervisor) ================= */
  function endPage() {
    var all = P.pens(), notDone = all.filter(function (p) { return !isDone(p); }), d = all.length - notDone.length, ended = P.s.ended;
    var body = '';

      }) })]);

  /* ================= render ================= */
  /* Each overlay on the phone has a key (its data-view). An overlay that is new on this render slides in (data-enter); one
     that is gone slides out first (data-leave), then the phone is redrawn. A re-render never replays. */
  var shownKeys = [], leaving = false;
  function overlays(root) {
    return Array.prototype.filter.call(root.children, function (el) { return el.matches('.tk-sheet, .tk-page, .tk-dialog-backdrop'); });
  }
  var keyOf = function (el) { return el.getAttribute('data-view') || (el.matches('.tk-dialog-backdrop') ? 'dialog' : ''); };
  function render() {
    if (leaving) return;
    document.documentElement.lang = L.lang === 'zh' ? 'zh-CN' : 'en';
    document.title = T('task');
    if (window.AtlasBare) AtlasBare.watch(atlasScreen);
    var html = K.statusbar() + listScreen(!!(V.pen || V.end));
    if (V.pen) html += penSheet(!!(V.over || V.end));
    var o = V.pen && V.over;
    if (o === 'more') html += moreSheet();
    if (o === 'adjust') html += adjustSheet();
    if (o === 'death') html += deathSheet();
    if (o === 'count') html += countSheet();
    if (o === 'weight') html += weightSheet();
    if (o === 'move') html += movePage();
    if (o === 'counts') html += countsSheet();
    if (o === 'tagged') html += taggedPage();
    if (o === 'tagged' && V.sub === 'give') html += givePage();
    if (o === 'log') html += logPage();
    if (V.end) html += endPage();
    var tmp = document.createElement('div'); tmp.innerHTML = html;
    var next = overlays(tmp).map(keyOf);
    var gone = overlays(phone).filter(function (el) { return next.indexOf(keyOf(el)) < 0; });
    if (gone.length && !reduced()) {
      leaving = true; phone.style.pointerEvents = 'none';   // no tap lands on a screen that is about to be redrawn
      gone.forEach(function (el) { el.setAttribute('data-leave', ''); var s = el.previousElementSibling; if (s && s.matches('.tk-scrim')) s.setAttribute('data-leave', ''); });
      setTimeout(function () {
        leaving = false; phone.style.pointerEvents = '';
        phone.querySelectorAll('[data-leave]').forEach(function (el) { el.remove(); });
        shownKeys = shownKeys.filter(function (k) { return next.indexOf(k) >= 0; });
        render();
      }, 180);
      return;
    }
    paint(html, next);
  }
  function paint(html, next) {
    var keep = {};
    phone.querySelectorAll('.tk-scroll, .tk-sheet-body, .tk-page-body').forEach(function (el) {
      var host = el.closest('[data-view]'); keep[(host ? host.getAttribute('data-view') : 'list') + el.className] = el.scrollTop;
    });
    var chipsX = phone.querySelector('.tk-chips-track'), cx = chipsX ? chipsX.scrollLeft : 0;
    var focusSel = null, a = document.activeElement, caret = null;
    if (a && phone.contains(a)) {
      if (a.id) focusSel = '#' + CSS.escape(a.id);
      else if (a.getAttribute('data-action')) focusSel = '[data-action="' + a.getAttribute('data-action') + '"][data-value="' + (a.getAttribute('data-value') || '') + '"]';
      if (a.tagName === 'INPUT' && a.type !== 'checkbox') caret = a.selectionStart;
    }
    phone.innerHTML = html;
    overlays(phone).forEach(function (el) {
      if (shownKeys.indexOf(keyOf(el)) >= 0) return;
      el.setAttribute('data-enter', '');
      var s = el.previousElementSibling; if (s && s.matches('.tk-scrim')) s.setAttribute('data-enter', '');
    });
    shownKeys = next;
    phone.querySelectorAll('.tk-scroll, .tk-sheet-body, .tk-page-body').forEach(function (el) {
      var host = el.closest('[data-view]'), k = (host ? host.getAttribute('data-view') : 'list') + el.className;
      if (keep[k] != null) el.scrollTop = keep[k];
    });
    var ct = phone.querySelector('.tk-chips-track'); if (ct) ct.scrollLeft = cx;
    if (V.pageTop) { phone.querySelectorAll('.tk-page-body, .tk-sheet-body').forEach(function (x) { x.scrollTop = 0; }); V.pageTop = false; }
    if (V.toTop) { var sc = phone.querySelector('.tk-scroll'); if (sc) sc.scrollTop = 0; V.toTop = false; }
    if (focusSel) {
      var f = phone.querySelector(focusSel);
      if (f && f.focus) { f.focus({ preventScroll: true }); if (caret != null && f.setSelectionRange) try { f.setSelectionRange(caret, caret); } catch (e) { /* not a text input */ } }
    }
    if (V.sub === 'give' && V.give && V.give.field) { var m = phone.querySelector('[data-action="give-field"][data-value="' + V.give.field + '"]'); if (m && m.scrollIntoView) m.scrollIntoView({ block: 'nearest' }); }
    V.justTick = ''; V.justRec = [];
    renderDemo();
  }

  /* ---- outside the phone: the farm's ID setting, language, the other phone, reset ---- */
  function renderDemo() {
    demo.setAttribute('data-open', V.demoOpen ? 'true' : 'false');
    demo.innerHTML = '<button type="button" class="sp-demo-toggle" data-demo="toggle" aria-expanded="' + !!V.demoOpen + '">' + esc(T('demo.open')) + '</button>' +

      '<button type="button" data-demo="lang" data-value="zh" aria-pressed="' + (L.lang === 'zh') + '">中文</button></div>' +
      '<div class="sp-demo-farm" role="radiogroup" aria-label="' + esc(T('demo.farm')) + '"><p class="sp-demo-label">' + esc(T('demo.farm')) + '</p>' +
      P.SCHEMES.map(function (s) {
        return '<button type="button" role="radio" data-demo="scheme" data-value="' + s + '" aria-checked="' + (scheme() === s) + '"><span class="sp-demo-dot" aria-hidden="true"></span>' + esc(T('scheme.' + s)) + '</button>';
      }).join('') + '<p class="sp-demo-tip">' + esc(T('demo.farm.note')) + '</p></div>' +
      '<button type="button" class="sp-demo-btn" data-demo="other">' + esc(T('demo.other')) + '</button>' +
      '<p class="sp-demo-tip">' + esc(T('demo.tip')) + '</p>' +

      '<button type="button" class="sp-demo-link" data-demo="reset">' + esc(T('demo.reset')) + '</button></div>';
  }
  demo.addEventListener('click', function (e) {
    var b = e.target.closest('[data-demo]'); if (!b) return;
    var w = b.getAttribute('data-demo');
