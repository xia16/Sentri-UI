<script>/* ../../../system/atlas-bare.js */
/* Bare screens: open any built prototype page with ?screen=<stable id> (ids are atlas/atlas.json's) and it shows only
   that screen: the phone's content at 390 x 844 in the page's top-left, no study chrome and no phone frame (the atlas
   draws the frame). Without the param this file does nothing, so the study page works as before.
   - Putting the page in the state: the screen's `preset` goes through the page's select.scenario; pages driven by their own
     URL params (Home, Piglet processing) already carry them in the screen's url.
   - Ready: parent.postMessage({ atlasReady: id }).
   - Screens only a tap reaches: the screen's `steps` (ordered; each a string or { tap, hold }) are replayed after the preset.
     A step is visible text, an aria-label / title, or a CSS selector (starts with [ . #), matched inside the phone.
   - The flow follows the demo: a page calls AtlasBare.watch(fn) after every render, fn() returns the screen id of the
     state it is in (or null); when that changes, parent.postMessage({ atlasScreen: id }).
   One convention for every prototype: new pages include this script in <head> and call AtlasBare.watch where they can.
   Entry markers live in the pages' own markup: data-entry="<feature id>" (space-separated for several) on a control that
   is a way into that feature; the atlas outlines it. */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search), id = q.get('screen');
  var AB = window.AtlasBare = { id: id || null, screen: null, screens: [], bare: !!id, watch: function () {} };
  if (!id) return;

  var root = document.documentElement, ready = false, fn = null, prev = null;
  root.classList.add('atlas-bare');
  var css = document.createElement('style');
  css.textContent =
    'html.atlas-bare,html.atlas-bare body{margin:0!important;padding:0!important;width:390px!important;height:844px!important;overflow:hidden!important;background:#fff!important}' +
    'html.atlas-bare:not(.atlas-ready) body{opacity:0}' +
    'html.atlas-bare [data-atlas-hide]{display:none!important}' +
    'html.atlas-bare .atlas-path{display:block!important;position:static!important;margin:0!important;padding:0!important;border:0!important;width:auto!important;height:auto!important;min-height:0!important;max-width:none!important;' +
    'overflow:visible!important;transform:none!important;filter:none!important;background:none!important;box-shadow:none!important;border-radius:0!important;contain:none!important;opacity:1!important}' +
    'html.atlas-bare .atlas-phone{position:fixed!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;width:390px!important;height:844px!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;' +
    'margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;outline:0!important;transform:none!important;overflow:hidden!important;z-index:1}' +
    'html.atlas-bare *,html.atlas-bare *::before,html.atlas-bare *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important;caret-color:transparent}' +
    'html.atlas-bare *,html.atlas-bare *::before,html.atlas-bare *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important;caret-color:transparent}' +
    'html.atlas-bare .atlas-phone::before,html.atlas-bare .atlas-phone::after{box-shadow:none!important}';
  document.head.appendChild(css);

  /* the atlas data starts loading at once */
  var here = document.currentScript && document.currentScript.src;
  var dataUrl = here ? new URL('../../atlas/atlas.json', here).href : '/atlas/atlas.json';
  var data = fetch(dataUrl).then(function (r) { return r.json(); }).catch(function () { return null; });

  function findScreen(d) {
    var found = null, path = location.pathname;
    if (!d) return;
    d.platforms.forEach(function (p) { p.sections.forEach(function (s) { s.features.forEach(function (f) { f.screens.forEach(function (c) {
      if (c.id === id) found = c;
      if (c.url && c.url.split('?')[0] === path) AB.screens.push(c);
    }); }); }); });
    AB.screen = found;
  }

  function hideAround(phone) {
    for (var el = phone; el && el !== document.body; el = el.parentElement) {
      var par = el.parentElement; if (!par) break;
      Array.prototype.forEach.call(par.children, function (sib) {
        if (sib !== el && !/^(SCRIPT|STYLE|LINK|TEMPLATE)$/.test(sib.tagName)) sib.setAttribute('data-atlas-hide', '');
      });
      if (par !== document.body) par.classList.add('atlas-path');
    }
    phone.classList.add('atlas-phone');
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function frames() { return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); }); }
  function shown(el) { return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length); }
  function norm(t) { return (t || '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  var TAPPABLE = 'button,a,[data-action],[role=button],label,summary,[tabindex]';
  function findStep(phone, key) {
    var k = String(key), want = norm(k), el, list, i;
    if (/^[\[.#]/.test(k)) { list = phone.querySelectorAll(k); for (i = 0; i < list.length; i++) if (shown(list[i])) return list[i]; return null; }
    var all = Array.prototype.filter.call(phone.querySelectorAll('*'), shown), best = null;
    for (i = 0; i < all.length; i++) {   // smallest visible element whose text is the step, then its nearest control
      el = all[i];
      if (norm(el.textContent) === want && (!best || best.contains(el))) best = el;
    }
    if (best) return best.closest(TAPPABLE) && phone.contains(best.closest(TAPPABLE)) ? best.closest(TAPPABLE) : best;
    for (i = 0; i < all.length; i++) {   // a control whose text begins with the step (its other words are a hint line)
      el = all[i];
      if (el.matches(TAPPABLE) && norm(el.textContent).indexOf(want) === 0 && (!best || best.contains(el))) best = el;
    }
    if (best) return best;
    for (i = 0; i < all.length; i++) if (norm(all[i].getAttribute('aria-label')) === want || norm(all[i].getAttribute('title')) === want) return all[i];
    return null;
  }
  function replay(phone, steps) {
    var chain = Promise.resolve();
    steps.forEach(function (st) {
      chain = chain.then(function () {
        var key = typeof st === 'string' ? st : st.tap, hold = typeof st === 'object' && st.hold;
        var el = findStep(phone, key);
        if (!el) { console.error('atlas-bare: step not found: ' + key); return; }
        if (hold) {
          var o = { bubbles: true, cancelable: true, button: 0, pointerId: 1, pointerType: 'mouse', isPrimary: true };
          el.dispatchEvent(new PointerEvent('pointerdown', o));
          return wait(hold).then(function () { el.dispatchEvent(new PointerEvent('pointerup', o)); });
        }
        el.click();
      }).then(frames).then(function () { return wait(60); });
    });
    return chain;
  }

  function check() {
    if (!ready || !fn) return;
    var sid = null; try { sid = fn(AB.screens); } catch (e) { return; }
    if (sid === prev) return;
    prev = sid;
    if (sid) parent.postMessage({ atlasScreen: sid }, '*');
  }
  AB.watch = function (f) { fn = f; check(); };
  AB.current = function () { try { return fn ? fn(AB.screens) : null; } catch (e) { return null; } };   // the screen the page is on now (for checks)

  function start() {
    data.then(function (d) {
      findScreen(d);
      var sel = document.querySelector('select.scenario');
      var phone = (sel && sel.closest('.spec') && sel.closest('.spec').querySelector('.phone')) || document.querySelector('.phone, section.device, .tk-phone');
      if (!phone) { console.error('atlas-bare: no phone found'); return; }
      var preset = AB.screen && AB.screen.preset;
      if (preset && sel) {
        if (![].some.call(sel.options, function (o) { return o.value === preset; })) console.warn('atlas-bare: preset "' + preset + '" is not in the page');
        else if (sel.value !== preset) { sel.value = preset; sel.dispatchEvent(new Event('change', { bubbles: true })); }
      }
      if (!AB.screen) console.warn('atlas-bare: unknown screen ' + id);
      var steps = (AB.screen && AB.screen.steps) || [];
      (steps.length ? frames().then(function () { return replay(phone, steps); }) : Promise.resolve()).then(function () {
      hideAround(phone);
      var fonts = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 250); })]) : Promise.resolve();
      fonts.then(function () { requestAnimationFrame(function () { requestAnimationFrame(function () {
        root.classList.add('atlas-ready'); ready = true;
        if (fn) { try { prev = fn(AB.screens); } catch (e) { prev = null; } }   // the state the screen opens in is not a change
        parent.postMessage({ atlasReady: id }, '*');
      }); }); });
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<style>/* ../../../design-system/components/bundle.css */

/* Sentri — the shared stylesheet, in load order:
   1. aliases from the generated tokens to the names the components read
   2. base elements and controls (from farrowing-astra-concept.css, the prototypes' common base)
   3. astra-surfaces.css (page / drawer presentation)
   4. sentri-visual-foundation.css (its :root palette now comes from tokens.css)
   Section 2 sits in a cascade layer (sentri-base): any page stylesheet wins over it in any load order, so Home, Farrowing
   and Inspection keep their own base. Sections 3-5 are unlayered and load after the page CSS.
   5. sentri-components.css (the SentriUI parts), verbatim.
   Screens scope the foundation to a phone root: wrap content in .inspection-phone or .farrowing-phone
   and mark the container data-st-context="page" or "drawer". */
:root{--sans:var(--font-sans);--mono:var(--font-mono);--wash:var(--well)}

/* 2 · base: in a cascade layer, so the page CSS of Home, Farrowing and Inspection (which carry their own base) always wins. */
@layer sentri-base{
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:var(--font-size-14) var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;border:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:var(--size-3) solid var(--focus-strong);outline-offset:var(--size-3)}
button:disabled,button[aria-disabled=true]{cursor:default;color:var(--disabled-ink);background:var(--disabled-surface);border-color:var(--disabled-border)}
svg{width:var(--size-20);height:var(--size-20);display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.scrim{position:absolute;inset:var(--statusbar-height) 0 0;background:var(--scrim);backdrop-filter:blur(var(--blur-scrim));z-index:2;width:100%}
.sheet{position:absolute;bottom:0;left:0;right:0;z-index:3;background:var(--paper);border-radius:var(--radius-28) var(--radius-28) 0 0;box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;max-height:calc(100% - var(--size-80))}
.sheet-body{padding:0 var(--space-18);min-height:0;overflow-y:auto;overscroll-behavior:contain}
.sheet-footer{flex-shrink:0;display:flex;gap:var(--space-10);padding:var(--space-17) var(--space-18) var(--space-28);border-top:1px solid var(--line);background:var(--paper);position:relative}
.sheet-footer:after{content:'';position:absolute;bottom:var(--space-8);left:calc(50% - var(--handle-width) / 2);height:var(--size-4);width:var(--handle-width);border-radius:var(--radius-4);background:var(--handle)}
.button{min-height:var(--size-52);padding:var(--space-10) var(--space-17);display:flex;align-items:center;justify-content:center;gap:var(--space-7);border:1px solid var(--button-border);background:var(--paper);border-radius:var(--radius-13);font-weight:700;font-size:var(--font-size-14);text-align:center;line-height:1.3}
.button.primary{flex:1;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.button.primary:disabled{background:var(--disabled-fill);border-color:var(--disabled-fill);color:var(--disabled-ink)}
.button.secondary{min-width:var(--back-width);font-weight:600}
.button:hover:not(:disabled){filter:brightness(.96)}
.button:active:not(:disabled){transform:translateY(1px)}
.button.danger:not([aria-disabled="true"]){background:var(--red);border-color:var(--red)}
.icon-button{background:transparent;min-width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;border-radius:var(--radius-10);position:relative}
.segment{display:flex;border-radius:var(--radius-10);padding:var(--space-3);margin-top:var(--space-16);border:1px solid transparent}
.segment button{flex:1;min-height:var(--tap-min);background:transparent;font-size:var(--font-size-12);border-radius:var(--radius-8)}
.field{display:flex;flex-direction:column;gap:var(--space-9);font-size:var(--font-size-12);font-weight:600;margin:var(--space-18) 0 0}
.field textarea,.field input,.field select{width:100%;border:1px solid var(--field-border);border-radius:var(--radius-11);padding:var(--space-12);background:var(--paper);color:var(--ink);font-size:var(--font-size-14);min-height:var(--field-height)}
.field textarea{min-height:var(--size-90);resize:vertical;line-height:1.6}
.field.error input,.field.error textarea{border-color:var(--red)}
@media(prefers-reduced-motion:reduce){.button:active{transform:none}}
}

/* 3 · astra-surfaces.css */
/* Full pages share the phone canvas; drawers retain their standard sizes. */
:is(.farrowing-phone,.inspection-phone) .sheet[data-presentation="page"]{inset:0;height:100%;max-height:100%;border-radius:0;box-shadow:none;background:var(--paper);z-index:3}

.st-category-footer.st-category-footer{display:grid;grid-template-columns:var(--back-width) minmax(0,1fr);align-items:center;gap:var(--space-16);position:relative;flex:none;min-width:0;padding:var(--space-14) var(--space-18) var(--space-28);border-top:1px solid var(--st-line);background:var(--st-paper);container-type:inline-size}

.st-category-footer .st-category-tabs{display:flex;min-width:0;gap:var(--space-2);overflow-x:auto;overscroll-behavior-x:contain;padding:0;margin:0;border:0;background:transparent;scrollbar-width:none}
.st-category-tabs::-webkit-scrollbar{display:none}
.st-category-footer .st-category-tabs button{position:relative;flex:1 0 auto;min-width:var(--tap-min);min-height:var(--tap-min);margin:0;padding:0 var(--space-8);border:0;border-radius:0;background:transparent;color:var(--tab-ink);font:500 var(--font-size-12) var(--font-sans);white-space:nowrap;touch-action:manipulation}
.st-category-footer .st-category-tabs button[aria-current="location"]{background:transparent;color:var(--tab-ink-active);font-weight:700}
.st-category-tabs button[aria-current="location"]:after{content:"";position:absolute;bottom:1px;left:var(--space-8);right:var(--space-8);height:var(--size-3);border-radius:var(--radius-2);background:var(--current-marker)}
.st-category-tabs button:disabled{opacity:.5}
.st-category-tabs button:focus-visible{outline:var(--size-2) solid var(--focus);outline-offset:calc(-1 * var(--size-2))}
@container(max-width:310px){.st-category-footer .st-category-tabs button{padding-left:var(--space-4);padding-right:var(--space-4);font-size:var(--font-size-11)}}

/* Picker field: the mobile-standard choice control that replaces native selects.
   The trigger echoes text-input geometry; the sheet lists options as tappable rows. */
.st-picker-field .st-picker-trigger{display:flex;align-items:center;justify-content:space-between;gap:var(--space-10);width:100%;min-height:var(--field-height);padding:var(--space-12);border:1px solid var(--control-border);border-radius:var(--radius-12);background:var(--st-paper);color:var(--st-ink);font:400 var(--font-size-14)/1.5 var(--font-sans);text-align:left;touch-action:manipulation}
.st-picker-trigger .st-picker-value{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.st-picker-trigger>svg{width:var(--size-15);height:var(--size-15);flex:none;color:var(--st-muted);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Filter button: one canonical toolbar control for every room/list screen. */
:is(.inspection-phone,.farrowing-phone) .room-filter-button{min-width:var(--tap-min);height:var(--tap-min);display:grid;place-items:center;background:var(--st-paper);border:1px solid var(--st-line);border-radius:var(--radius-12);position:relative;color:var(--st-ink)}
:is(.inspection-phone,.farrowing-phone) .room-filter-button svg{width:var(--size-17);height:var(--size-17)}
:is(.inspection-phone,.farrowing-phone) .filter-badge{position:absolute;right:calc(-1 * var(--space-3));top:calc(-1 * var(--space-4));min-width:var(--size-17);height:var(--size-17);border-radius:var(--radius-9);display:grid;place-items:center;background:var(--st-ink);color:var(--paper);font:var(--font-size-10) var(--mono)}

.device .st-home-drawer-footer>.secondary{flex:1;min-width:0;min-height:var(--tap-min);margin:0}
.device .st-home-drawer-footer>.danger{background:var(--red);border-color:var(--red);color:var(--paper)}

/* The product canvas scrolls by touch; desktop scrollbar chrome belongs outside it. */
:is(.farrowing-phone,.inspection-phone) .sheet[data-st-context]>.sheet-body,
.device :is(.app-scroll,.drawer-body){scrollbar-width:none;-webkit-overflow-scrolling:touch}
:is(.farrowing-phone,.inspection-phone) .sheet[data-st-context]>.sheet-body::-webkit-scrollbar,
.device :is(.app-scroll,.drawer-body)::-webkit-scrollbar{display:none;width:0;height:0}

/* Shared chooser: catalogue = flat; short ungrouped choices = one muted inset.
   A second text line never changes selection behavior or adds a nested card. */
.inspection-phone .sheet.picker-step:is(.medicine-picker-step,.health-picker-step)>.sheet-body{background:var(--st-paper)}

.inspection-phone .sheet.picker-step .catalog-path{background:transparent}

/* Drawer convention: white canvas, contextual tinted panels; rules only between rows. */
.inspection-phone .sheet.picker-step :is(.health-catalog,.medicine-results){border:0;padding-top:0}
.inspection-phone .sheet.picker-step :is(.health-catalog,.medicine-results)::before{display:none}
.inspection-phone .sheet.picker-step .catalog-group h5{border:0}
.inspection-phone .sheet.picker-step .chooser-header-back{width:var(--tap-min);height:var(--tap-min);min-width:var(--tap-min);padding:var(--space-12);border:0;background:transparent;box-shadow:none;border-radius:50%;margin:0}
.inspection-phone .sheet.picker-step .chooser-header-back svg{width:var(--size-20);height:var(--size-20)}

/* Selection is a check, not an extra rectangle inside the contextual panel. */

.inspection-phone .sheet.record-optional-editor[data-size="short"],.inspection-phone .sheet.brand-picker-step[data-size="short"]{min-height:min(var(--size-360),58%);max-height:58%}
.inspection-phone .sheet.record-optional-editor>.sheet-body{flex:1;display:flex;flex-direction:column;min-height:0}
.inspection-phone .sheet.record-optional-editor textarea.notes-input{flex:1;width:100%;height:auto;min-height:var(--size-120);box-sizing:border-box;resize:none;padding:var(--space-14);font:400 var(--font-size-14)/1.5 var(--font-sans);color:var(--st-ink);background:var(--st-inset)}


/* Chooser: one row geometry for every level and shape (flat, sectioned, nested).
   Headings and row text share one left edge; the trailing slot is always 24px on the right. */
.st-choice-group.st-choice-group{margin:0 0 var(--space-20);padding:0;border:0;background:transparent}
.st-choice-group:last-child{margin-bottom:0}
.st-choice-heading.st-choice-heading{margin:0;padding:0 var(--space-17) var(--space-8);border:0;font:600 var(--font-size-12)/1.4 var(--font-sans);letter-spacing:0;text-transform:none;color:var(--st-muted)}

.st-choice-row.st-choice-row{display:flex;align-items:center;gap:var(--space-12);width:100%;min-height:var(--size-56);margin:0;padding:var(--space-10) var(--space-16);box-sizing:border-box;border:0;border-radius:0;background:transparent;box-shadow:none;color:var(--st-ink);font:inherit;text-align:left;cursor:pointer}

.st-choice-copy{display:flex;flex:1;flex-direction:column;gap:var(--space-2);min-width:0}
.st-choice-label{font:500 var(--font-size-14)/1.4 var(--font-sans);color:var(--st-ink);overflow-wrap:anywhere}
.st-choice-meta{font:400 var(--font-size-12)/1.4 var(--font-sans);color:var(--st-muted)}
.st-choice-row[aria-pressed="true"] .st-choice-label{font-weight:600}
.st-choice-trail{display:grid;place-items:center;flex:none;width:var(--size-24);height:var(--size-24);color:var(--st-ink)}
.st-choice-trail svg{width:var(--size-20);height:var(--size-20);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st-choice-row[data-mode="navigate"] .st-choice-trail{color:var(--st-muted)}
.st-choice-row[data-mode="navigate"] .st-choice-trail svg{width:var(--size-18);height:var(--size-18)}
.st-choice-trail input[type="checkbox"]{width:var(--size-20);height:var(--size-20);margin:0;accent-color:var(--st-ink)}
.st-choice-search.st-choice-search{margin:0 0 var(--space-20)}
.st-choice-empty{margin:0;padding:var(--space-24) var(--space-17);font:400 var(--font-size-13)/1.5 var(--font-sans);color:var(--st-muted)}

/* 6 · Field cards (candidate, ADR 0001): Stepper, Measure, Numpad.
   Tokens only, including the candidate sizes (stepper-row-min, hero-key, glyph-*, caret-width, status-dot, space-key-gap). */
.st-stepper.st-stepper,.st-measure.st-measure,.st-numpad.st-numpad{margin:0;padding:0;border:0;background:transparent;color:var(--ink);font-family:var(--font-sans)}
/* shared: keys, faces, hint line, text action */
.st-stepper-key.st-stepper-key,.st-numpad-key.st-numpad-key{margin:0;padding:0;min-width:0;min-height:0;box-shadow:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.st-stepper-face,.st-numpad-key.st-numpad-key{display:grid;place-items:center;border:1px solid var(--control-border);border-radius:var(--radius-control);background:var(--paper);color:var(--ink);transition:transform 120ms ease}
:is(.st-stepper-face,.st-numpad-key) svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
/* the floor-gray: a key with nothing to do (DS README, States) */
.st-stepper-key[aria-disabled="true"] .st-stepper-face,.st-numpad-key.st-numpad-key[aria-disabled="true"]{background:var(--disabled-fill);border-color:var(--disabled-fill);color:var(--disabled-ink);cursor:default}
.st-stepper-key:not([aria-disabled="true"]):is(:active,[data-preview~="pressed"]) .st-stepper-face,.st-numpad-key.st-numpad-key:not([aria-disabled="true"]):is(:active,[data-preview~="pressed"]){transform:scale(.96);background:var(--press)}
.st-stepper-key.st-stepper-key:focus-visible{outline:none}
:is(.st-stepper-key:focus-visible,.st-stepper-key[data-preview~="focus"]) .st-stepper-face,:is(.st-numpad-key,.st-measure-box,.st-stepper-value,.st-text-action):is(:focus-visible,[data-preview~="focus"]){outline:var(--size-3) solid var(--focus);outline-offset:var(--size-2)}
.st-field-hint.st-field-hint{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-6);margin:0;padding:0;font:400 var(--type-input-size)/1.4 var(--font-sans);color:var(--muted)}
.st-field-hint[data-reserve="text"]{min-height:calc(var(--type-input-size) * 1.4)}
.st-field-hint[data-reserve="action"]{min-height:var(--tap-min)}
.st-field-hint[data-tone="amber"]{color:var(--amber)}
.st-field-hint[data-tone="amber"]::before{content:"";flex:none;width:var(--status-dot);height:var(--status-dot);border-radius:50%;background:currentColor}
.st-text-action.st-text-action{display:inline-flex;align-items:center;min-height:var(--tap-min);margin:0;padding:0 var(--space-8) 0 0;border:0;border-radius:0;background:transparent;color:var(--ink-2);font:var(--type-weight-strong) var(--type-row-title-size)/1.4 var(--font-sans);cursor:pointer}

/* Stepper · row: label left, `− n +` right; each key's hit area spans the whole row height */
.st-stepper.st-stepper{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:var(--space-row-y);min-height:var(--stepper-row-min)}
.st-stepper+.st-stepper{border-top:1px solid var(--rule)}
.st-stepper-copy{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.st-stepper-label{font:600 var(--type-choice-label-size)/1.4 var(--font-sans);color:var(--ink);overflow-wrap:anywhere}
.st-stepper-description{font:400 var(--type-description-size)/1.5 var(--font-sans);color:var(--muted)}
.st-stepper-keys{display:flex;align-items:center;gap:var(--space-key-gap);align-self:stretch}
.st-stepper-key.st-stepper-key{display:grid;place-items:center;flex:none;width:var(--field-height);min-height:var(--stepper-row-min);align-self:stretch;border:0;border-radius:0;background:transparent;color:inherit}
.st-stepper-face{width:var(--field-height);height:var(--field-height)}
.st-stepper-face svg{width:var(--glyph-key);height:var(--glyph-key);stroke-width:2.2}
.st-stepper-key[data-step^="-"] .st-stepper-face{color:var(--ink)}
.st-stepper-key:not([data-step^="-"]):not([aria-disabled="true"]) .st-stepper-face{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.st-stepper-key:not([data-step^="-"]):not([aria-disabled="true"]):is(:active,[data-preview~="pressed"]) .st-stepper-face{background:var(--ink);filter:brightness(.96)}
.st-stepper-value{min-width:3ch;text-align:center;font:500 var(--type-figure-size)/1.2 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);-webkit-user-select:none;user-select:none}
.st-stepper[data-wide] .st-stepper-value{min-width:4ch}
.st-stepper[data-zero] .st-stepper-value{color:var(--muted)}
.st-stepper[data-changed] .st-stepper-value{color:var(--amber)}
.st-stepper[data-draft] .st-stepper-value{color:var(--green)}
.st-stepper-hint.st-stepper-hint{grid-column:1/-1}
.st-stepper[data-variant="row"] .st-stepper-hint[data-reserve="text"]{margin-bottom:var(--space-row-y)}
/* Stepper · hero */
.st-stepper[data-variant="hero"]{grid-template-columns:minmax(0,1fr);justify-items:stretch;row-gap:var(--space-8);min-height:0}
.st-stepper[data-variant="hero"] .st-stepper-copy{align-items:center;text-align:center}
.st-stepper[data-variant="hero"] .st-stepper-label{font-size:var(--type-section-title-size);color:var(--muted)}
.st-stepper[data-variant="hero"] .st-stepper-keys{justify-content:space-between}
.st-stepper[data-variant="hero"] .st-stepper-key{width:var(--hero-key);min-height:var(--hero-key)}
.st-stepper[data-variant="hero"] .st-stepper-face{width:var(--hero-key);height:var(--hero-key);border-radius:var(--radius-inset)}
.st-stepper[data-variant="hero"] .st-stepper-face svg{width:var(--glyph-key-hero);height:var(--glyph-key-hero)}
.st-stepper[data-variant="hero"] .st-stepper-value{flex:1;font:600 var(--type-hero-count-size)/1.15 var(--font-mono);letter-spacing:var(--tracking-hero);color:var(--count-ink)}
.st-stepper[data-variant="hero"][data-zero] .st-stepper-value{color:var(--muted)}
.st-stepper[data-variant="hero"][data-changed] .st-stepper-value{color:var(--amber)}
.st-stepper[data-variant="hero"][data-draft] .st-stepper-value{color:var(--green)}
.st-stepper[data-variant="hero"] .st-stepper-hint{justify-content:center;text-align:center}

/* Measure: label above, a field-shaped box, value in mono with its unit always written */
.st-measure.st-measure{display:flex;flex-direction:column;gap:var(--space-8)}
.st-measure-label{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--space-6);font:600 var(--type-choice-label-size)/1.4 var(--font-sans);color:var(--ink)}
.st-measure-label small{font:400 var(--type-choice-meta-size)/1.4 var(--font-sans);color:var(--muted)}
.st-measure-box.st-measure-box{display:flex;align-items:baseline;gap:var(--space-6);width:100%;min-height:var(--field-height);margin:0;padding:var(--space-row-y) var(--space-row-x);box-sizing:border-box;border:1px solid var(--control-border);border-radius:var(--radius-control);background:var(--paper);color:var(--ink);box-shadow:none;text-align:left;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.st-measure-box[data-unit-gap="none"]{gap:0}
button.st-measure-box:is(:active,[data-preview~="pressed"]){background:var(--press)}
.st-measure-value{font:500 var(--type-figure-size)/1.2 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:pre}
.st-measure-unit{font:500 var(--type-identifier-size)/1.5 var(--font-mono);color:var(--muted)}
.st-measure[data-empty]:not([data-active]) .st-measure-value{color:var(--muted)}
.st-measure[data-active] .st-measure-box,.st-numpad-readout .st-measure-box.st-measure-box{border-color:var(--ink);box-shadow:inset 0 0 0 calc(var(--caret-width) - 1px) var(--ink);cursor:default}
:is(.st-measure[data-active],.st-numpad-readout:not([data-suggested])) .st-measure-value::after{content:"";display:inline-block;width:var(--caret-width);height:1em;margin-left:var(--space-2);background:var(--ink);vertical-align:-.12em}
.st-measure[data-changed] .st-measure-value,.st-measure[data-tone="refused"] .st-measure-value{color:var(--amber)}
.st-measure[data-tone="refused"] .st-measure-value{text-decoration:line-through;text-decoration-thickness:var(--caret-width)}

/* Numpad: readout, reserved hint, reserved running list, then 1–9 · [. or gap] 0 ⌫ — keys never move */
.st-numpad.st-numpad{display:flex;flex-direction:column;gap:var(--space-row-y)}
.st-numpad-readout{display:flex;flex-direction:column;gap:var(--space-8)}
.st-numpad-label{font:600 var(--type-choice-label-size)/1.4 var(--font-sans);color:var(--ink)}
.st-numpad-readout[data-suggested] .st-measure-value{color:var(--muted)}
/* the bounded feedback region: fixed heights that scroll inside themselves, so feedback never moves the keys.
   Sized for the longest status in en and zh (two lines, or one line with a text action) and three list lines. */
.st-numpad-feedback{display:flex;flex-direction:column;gap:var(--space-4)}
.st-numpad-hint.st-numpad-hint{height:var(--tap-min);overflow-y:auto;overscroll-behavior:contain}
.st-numpad-recent.st-numpad-recent{display:flex;flex-direction:column;gap:var(--space-2);height:calc(var(--type-input-size) * 1.5 * 3 + var(--size-4));margin:0;padding:0 var(--space-row-x);overflow-y:auto;overscroll-behavior:contain;list-style:none;font:500 var(--type-input-size)/1.5 var(--font-mono);color:var(--ink)}
.st-numpad-recent li[data-tone="amber"]{display:flex;align-items:center;gap:var(--space-6);color:var(--amber)}
.st-numpad-recent li[data-tone="amber"]::before{content:"";flex:none;width:var(--status-dot);height:var(--status-dot);border-radius:50%;background:currentColor}
.st-numpad-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-key-gap)}
.st-numpad-key.st-numpad-key{width:100%;height:var(--choice-row-min);font:500 var(--type-figure-size)/1 var(--font-mono);font-variant-numeric:tabular-nums}
.st-numpad-key svg{width:var(--glyph-pad);height:var(--glyph-pad);stroke-width:1.8}
@media (prefers-reduced-motion:reduce){:is(.st-stepper-face,.st-numpad-key){transition:none}.st-stepper-key:is(:active,[data-preview~="pressed"]) .st-stepper-face,.st-numpad-key:is(:active,[data-preview~="pressed"]){transform:none}}

/* 7 · Design-system candidates 2 (candidate, ADR 0002): Status, Banner, Photos, Button registers / waiting / hold,
   ChoiceList radio, Row variants. Tokens only, including the candidate sizes (radio-size, radio-dot, ring-width,
   photo-tile, row-code-min, row-chip-max, radio-row-min, ring-width-fine), ink-2, amber-wash-strong, identifier-strong,
   type-weight-strong, the hold opacities and motion (hold-commit). */
/* Status: colour lives on the value; the word stays ink */
.st-part[data-tone]{font-weight:600}
.st-part[data-tone="amber"]{color:var(--amber)}
.st-part[data-tone="progress"]{color:var(--progress)}
.st-part[data-tone="green"]{color:var(--green)}
.st-part[data-tone="red"]{color:var(--red)}
.st-part[data-tone="muted"]{color:var(--muted)}
.st-part[data-mono],.st-status-line[data-mono],.st-choice-label[data-mono],.st-choice-inline-opt [data-mono]{font-family:var(--font-mono)}
.st-tok{display:inline-block;max-width:100%}
.st-sep{margin:0 var(--space-4);color:var(--muted)}
.st-status{display:inline-flex;align-items:center;gap:var(--status-dot);font:500 var(--type-description-size)/1.5 var(--font-sans);color:var(--muted)}
.st-status::before{content:"";flex:none;width:var(--status-dot);height:var(--status-dot);border-radius:50%;background:currentColor}
.st-status[data-tone="amber"]{color:var(--amber)}
.st-status[data-tone="progress"]{color:var(--progress)}
.st-status[data-tone="green"]{color:var(--green)}
.st-status[data-tone="red"]{color:var(--red)}
.st-status-line.st-status-line{display:block;margin:0;font:400 var(--type-row-title-size)/1.5 var(--font-sans);color:var(--ink)}
.st-status-line.st-status-line[data-mono]{font-family:var(--font-mono)}

/* Row variants: code · token lines · chip · wrap · rail ✎ · select · act (two targets) */
.st-row.st-row .st-row-code{flex:none;min-width:var(--row-code-min);font:600 var(--type-identifier-strong-size)/1.5 var(--font-mono);color:var(--ink)}
.st-row.st-row .st-row-copy small[data-mono]{font-family:var(--font-mono)}

.tk-progress > i[data-tone="active"] { background: var(--progress-active); }
.tk-progress > i[data-tone="rest"] { background: var(--handle); }
.tk-progress + .tk-summary-support { margin-top: 7px; }

/* ---- TaskProgress: farrowing's Whole-task progress card (Task overview): head, an 8px segmented bar, one count per segment ---- */
.tk-progress-card.st-panel { margin: 0; padding: var(--space-row-x) var(--space-panel); }
.tk-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-heading); margin: 0 0 var(--space-heading); }
.tk-progress-title { margin: 0; min-width: 0; font: 500 var(--type-panel-title-size)/1.5 var(--font-sans); color: var(--ink); }
.tk-progress-meta { flex: none; font: var(--type-meta-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-progress-card > .tk-progress { height: 8px; gap: 2px; margin-top: 0; }
.tk-progress-counts { display: grid; grid-template-columns: repeat(var(--tk-count, 3), minmax(0, 1fr)); gap: 10px; margin-top: var(--space-heading); }
.tk-progress-count { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tk-progress-count > strong { font: 500 var(--type-figure-total-size)/1.25 var(--font-mono); letter-spacing: -1px; font-variant-numeric: tabular-nums; color: var(--ink); }
.tk-progress-count > span { display: flex; align-items: center; font: var(--type-meta-size)/1.2 var(--font-sans); color: var(--muted); }
.tk-progress-dot { flex: none; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--handle); }
.tk-progress-dot[data-tone="done"] { background: var(--current-marker); }
.tk-progress-dot[data-tone="active"] { background: var(--progress-active); }

/* ---- TaskLens: tabs with the count under the label, and the filter ---- */
.tk-lens { position: sticky; top: 0; z-index: 2; padding: 6px 0 9px; border-bottom: 1px solid transparent; background: var(--app-background); }
.tk-lens-bar { display: flex; gap: 7px; margin: 0 var(--space-panel); }
.tk-lens-tabs { flex: 1; min-width: 0; display: flex; gap: 1px; padding: 3px; background: var(--well); border: 1px solid var(--line); border-radius: var(--radius-segment); }
.tk-lens-tab { flex: 1; min-width: 0; min-height: var(--tap-min); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 4px 6px; border: 0; border-radius: var(--radius-tab); background: transparent; color: var(--muted); font: 400 var(--type-description-size) var(--font-sans); }
.tk-lens-tab[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px #20271f0d; }
.tk-lens-count { font: 500 var(--type-meta-size) var(--font-mono); color: var(--muted); }
.tk-lens-filter { flex: none; display: grid; place-items: center; width: var(--control-height); height: var(--control-height); padding: 0;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-control); color: var(--ink); }
.tk-lens-filter svg { width: 17px; height: 17px; }

/* ---- TaskGroup: a pen / crate-row card, its header and its rows ---- */
.tk-list { display: flex; flex-direction: column; gap: var(--space-heading); padding: 1px var(--space-panel) var(--space-gutter); }
.tk-group { flex-shrink: 0; overflow: clip; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-panel); box-shadow: 0 2px 8px #20291f0a; }
.tk-group-head { display: flex; align-items: center; gap: 10px; padding: 2px var(--space-row-x);
  background: var(--surface); border-bottom: 1px solid var(--line); font: var(--type-description-size) var(--font-sans); color: var(--muted); }
.tk-group-door { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; min-height: var(--tap-min); padding: 0; margin: 0;
  border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; text-align: left; }
.tk-group-title { font: 600 var(--type-row-title-size) var(--font-mono); color: var(--ink); }
.tk-group-title[data-face="word"] { font-family: var(--font-sans); }
.tk-group-meta { font: var(--type-meta-size) var(--font-sans); color: var(--muted); }
.tk-group-door svg { width: 12px; height: 12px; color: var(--muted); }
/* The header sticks under the lens bar only; a list with no lens above it (a page, a sheet) scrolls its headers away. */
.tk-lens ~ .tk-list .tk-group-head { position: sticky; top: var(--tk-sticky, 68px); z-index: 1; }
/* A list on a page or in a sheet: the surface's body already carries the gutter. */
:is(.tk-page-body, .tk-sheet-body) .tk-list { padding: 0; }

/* ---- TaskRow: mono id + chip under it | one headline, one meta line | trailing chevron or edit ---- */
.tk-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--animal-row-min); margin: 0;
  padding: var(--space-animal-row-y) var(--space-row-x); border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; }
.tk-row + .tk-row { border-top: 1px solid var(--line); }
.tk-row:active { background: var(--press); }
.tk-row-identity { flex: none; min-width: var(--animal-id-col); display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
.tk-row-id { font: 600 var(--type-row-title-size) var(--font-mono); letter-spacing: -0.6px; color: var(--ink); }
.tk-chip { display: inline-flex; align-items: center; max-width: var(--row-chip-max); padding: 3px 6px; border: 1px solid var(--line); border-radius: var(--radius-chip);
  background: var(--well); color: var(--muted); font: 600 var(--type-meta-size)/1.2 var(--font-sans); white-space: nowrap; }
.tk-chip[data-tone="green"] { color: var(--green); background: var(--green-wash); border-color: var(--chip-green-border); }
.tk-chip[data-tone="red"] { color: var(--red); background: var(--red-wash); border-color: var(--chip-red-border); }
.tk-chip[data-tone="amber"] { color: var(--amber); background: var(--amber-wash); border-color: var(--pending-border); }
.tk-row-detail { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.tk-row-headline { font: 500 var(--type-button-size)/1.45 var(--font-sans); color: var(--ink); }
.tk-row-headline[data-tone="forecast"] { color: var(--muted); }
.tk-row-meta { font: var(--type-meta-size)/1.6 var(--font-mono); color: var(--muted); }
.tk-sep { margin: 0 var(--status-dot); }
/* A headline or meta part wraps as a whole: a wrapped part never lies under the next one. */
:is(.tk-row-headline, .tk-row-meta) > * { display: inline-block; max-width: 100%; }
.tk-tone[data-tone="red"] { color: var(--red); }
.tk-tone[data-tone="amber"] { color: var(--amber); }
.tk-tone[data-tone="green"] { color: var(--green); }
.tk-row > svg { flex: none; width: var(--glyph-key); height: var(--glyph-key); color: var(--muted); }
/* The tick trail: the row is a <label> around ChoiceList's checkbox; the whole row is the target. */
label.tk-row { cursor: pointer; }
.tk-row-tick { flex: none; }

/* ---- TaskTotals: the figures a sheet commits, at farrowing's Finish size (a panel of label over figure) ---- */
.tk-totals.st-panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-heading); margin: 0; padding: var(--space-row-x); }
.tk-totals[data-columns="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tk-total { min-width: 0; margin: 0; }
.tk-total > dt { margin: 0; font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-total > dd { margin: 4px 0 0; font: 600 var(--type-figure-total-size)/1.3 var(--font-sans); color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---- TaskDock: the room's bottom tools ---- */
.tk-dock { flex: none; position: relative; display: flex; align-items: center; gap: 9px; padding: var(--space-heading) var(--space-panel) var(--space-section);
  background: var(--paper); border-top: 1px solid var(--line); }
.tk-dock-primary { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-key-gap); min-height: var(--tap-min); padding: 10px var(--space-heading);
  background: var(--ink); border: 1px solid var(--ink); border-radius: var(--radius-control); color: var(--paper); font: 500 var(--type-panel-title-size)/1.3 var(--font-sans); }
.tk-dock-tool { flex: none; display: grid; place-items: center; width: var(--control-height); min-height: 50px; padding: 0;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-control); color: var(--ink); }

/* The handle bar: the bottom edge of every surface that reaches the bottom of the phone. */
.tk-dock::after, .tk-footer::after { content: ""; position: absolute; bottom: 8px; left: calc(50% - 46px); width: 92px; height: 4px; border-radius: 4px; background: var(--handle); pointer-events: none; }

/* ---- TaskSheet: scrim, drawer, grab, head (title, subtitle, ✕), divider, body, footer ----
   A drawer is as tall as its content, up to its size's max; the footer is always its last child, so it
   always sits on the drawer's bottom edge. data-height="full" holds the drawer at its max (for a sheet whose
   content grows as the worker taps); its body then takes the spare height, never the space under the footer. */
.tk-scrim { position: absolute; top: var(--statusbar-height); left: 0; right: 0; bottom: 0; z-index: calc(2 + 10 * var(--tk-layer, 0)); width: 100%; padding: 0; margin: 0;
  border: 0; background: var(--scrim); backdrop-filter: blur(1.4px); }
.tk-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: calc(3 + 10 * var(--tk-layer, 0)); display: flex; flex-direction: column; overflow: hidden;
  max-height: calc(100% - 80px); background: var(--paper); color: var(--ink); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-sheet); }
.tk-sheet[data-size="compact"] { max-height: var(--drawer-compact-max); }
.tk-sheet[data-size="short"] { max-height: var(--drawer-short-max); }
.tk-sheet[data-size="medium"] { max-height: var(--drawer-medium-max); }
.tk-sheet[data-size="long"] { max-height: var(--drawer-long-max); }
.tk-sheet[data-height="full"] { height: calc(100% - 80px); }
.tk-sheet[data-height="full"][data-size="compact"] { height: var(--drawer-compact-max); }
.tk-sheet[data-height="full"][data-size="short"] { height: var(--drawer-short-max); }
.tk-sheet[data-height="full"][data-size="medium"] { height: var(--drawer-medium-max); }
.tk-sheet[data-height="full"][data-size="long"] { height: var(--drawer-long-max); }
.tk-sheet:focus { outline: none; }
/* ---- The overlay layer model: z = base + 10 × layer (scrim 2, sheet 3, page 5, dialog 8). Layer 0 is over the task
   screen. Each page or sheet placed before an overlay in the phone raises it one layer by itself (up to 3), so a sheet or
   dialog opened over a sheet or a page, in DOM order, always stacks above it; data-layer (the factories' `layer: n`)
   sets it explicitly. ---- */
:is(.tk-page, .tk-sheet) ~ :is(.tk-scrim, .tk-sheet, .tk-page, .tk-dialog-backdrop):not([data-layer]) { --tk-layer: 1; }
:is(.tk-page, .tk-sheet) ~ :is(.tk-page, .tk-sheet) ~ :is(.tk-scrim, .tk-sheet, .tk-page, .tk-dialog-backdrop):not([data-layer]) { --tk-layer: 2; }
:is(.tk-page, .tk-sheet) ~ :is(.tk-page, .tk-sheet) ~ :is(.tk-page, .tk-sheet) ~ :is(.tk-scrim, .tk-sheet, .tk-page, .tk-dialog-backdrop):not([data-layer]) { --tk-layer: 3; }
[data-layer="1"] { --tk-layer: 1; }
[data-layer="2"] { --tk-layer: 2; }
[data-layer="3"] { --tk-layer: 3; }
.tk-grab { flex: none; position: relative; height: var(--grab-height); touch-action: none; cursor: grab; }
.tk-grab::before { content: ""; position: absolute; top: 10px; left: calc(50% - 21px); width: 42px; height: 4px; border-radius: 3px; background: var(--back-border); }
.tk-sheet-head { flex: none; display: flex; align-items: flex-start; gap: 10px; padding: 5px var(--space-gutter-sheet) 17px; border-bottom: 1px solid var(--line); }
.tk-sheet-titles { flex: 1; min-width: 0; }
.tk-sheet-title { margin: 0; font: 500 var(--type-sheet-title-size)/1.3 var(--font-sans); letter-spacing: -0.4px; color: var(--ink); }
.tk-sheet-subtitle { margin: 6px 0 0; font: var(--type-description-size)/1.6 var(--font-sans); color: var(--muted); }
.tk-sheet-close { flex: none; display: grid; place-items: center; width: var(--tap-min); height: var(--tap-min); padding: 0; margin: 0;
  border: 0; border-radius: var(--radius-segment); background: transparent; color: var(--ink); }
.tk-sheet-close svg { width: var(--glyph-pad); height: var(--glyph-pad); }
.tk-sheet-body { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px var(--space-gutter-sheet) var(--space-panel); }
.tk-sheet[data-height="full"] > .tk-sheet-body { flex: 1 1 auto; }

/* ---- Footer: Back + the primary (or a hold), pinned to the bottom of its surface ---- */
.tk-footer { flex: none; position: relative; display: flex; align-items: stretch; gap: var(--space-row-x); margin: 0;
  padding: var(--space-row-x) var(--space-gutter-sheet) var(--space-footer-bottom); background: var(--paper); border-top: 1px solid var(--line); }
.tk-back { flex: none; display: flex; align-items: center; justify-content: center; gap: 4px; width: var(--back-width); min-height: var(--control-height); margin: 0; padding: 8px;
  background: var(--paper); border: 1px solid var(--back-border); border-radius: var(--radius-control); color: var(--ink); font: 500 var(--type-button-size) var(--font-sans); white-space: nowrap; }
.tk-back svg { width: 16px; height: 16px; }
.tk-back:active { background: var(--press); }
/* A surface with nothing to commit: Back alone fills the bar, in the primary's face (farrowing's record page). */
.tk-back:only-child { flex: 1; width: auto; background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }
/* The status slot: one line directly above the footer (a waiting reason, a hold's progress line). */
.tk-footer-status { flex: none; margin: 0; padding: var(--space-row-y) var(--space-gutter-sheet) 0; background: var(--paper); border-top: 1px solid var(--line);
  font: 500 var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-footer-status[data-tone="amber"] { color: var(--amber); }
.tk-footer-status[data-tone="red"] { color: var(--red); }
.tk-footer-status + .tk-footer { border-top: 0; }
.tk-footer-status.st-visually-hidden + .tk-footer { border-top: 1px solid var(--line); }
/* The hidden status keeps the utility's 1px box (the slot's own padding and edge must not win) at its surface's corner. */
.tk-footer-status.st-visually-hidden { top: 0; left: 0; width: 1px; height: 1px; padding: 0; border: 0; white-space: normal; }
.tk-page > .tk-footer-status { padding-left: var(--space-gutter); padding-right: var(--space-gutter); }
/* TaskHold's caption: farrowing's face (owner round 5: match farrowing): 9px/500 capitals, 0.07em apart, at 80%. */
.tk-footer > .st-hold .st-hold-caption { font: 500 var(--type-hold-caption-size)/1.3 var(--font-sans); letter-spacing: 0.07em; text-transform: uppercase;
  opacity: var(--task-hold-caption-opacity); }
.tk-footer > .st-hold[data-phase="unknown"] .st-hold-caption { opacity: 1; }
.tk-footer > .button { flex: 1; min-width: 0; min-height: var(--control-height); margin: 0; padding: 10px 17px; border-radius: var(--radius-control);
  font: 500 var(--type-button-size)/1.3 var(--font-sans); }

/* ---- TaskPage: the record page (a full page over the task, with its own status bar) ---- */
.tk-page { position: absolute; inset: 0; z-index: calc(5 + 10 * var(--tk-layer, 0)); display: flex; flex-direction: column; background: var(--app-background); }
.tk-page-head { flex: none; padding: 8px var(--space-gutter) 18px; border-bottom: 1px solid var(--line); }
/* aside: text actions at the right end of the title line (a sheet's aside, on a page). */
.tk-page-titleline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tk-page-titleline > .tk-page-title { flex: 1; min-width: 0; }
.tk-page-aside { flex: none; display: flex; align-items: center; }
.tk-page-title { margin: 0; font: 500 var(--type-page-title-size)/1.3 var(--font-sans); letter-spacing: -0.5px; color: var(--ink); }
.tk-page-desc { margin: 6px 0 0; font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-page-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px var(--space-gutter) var(--space-section); }
.tk-page > .tk-footer { padding-left: var(--space-gutter); padding-right: var(--space-gutter); }

/* ---- TaskDialog: one question over a sheet, rising from the bottom ---- */
.tk-dialog-backdrop { position: absolute; inset: 0; z-index: calc(8 + 10 * var(--tk-layer, 0)); display: flex; flex-direction: column; justify-content: flex-end; background: var(--dialog-backdrop); }
.tk-dialog { display: flex; flex-direction: column; overflow: hidden; max-height: calc(100% - 24px); background: var(--paper);
  border-radius: var(--radius-dialog) var(--radius-dialog) 0 0; box-shadow: var(--shadow-dialog); }
.tk-dialog-body { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: var(--space-gutter-sheet) var(--space-gutter-sheet) 0; }
.tk-dialog-title { display: flex; align-items: center; gap: 7px; margin: 0; font: 500 var(--type-sheet-title-size)/1.3 var(--font-sans); letter-spacing: -0.4px; color: var(--ink); }
.tk-dialog-title svg { width: 16px; height: 16px; }
.tk-dialog-desc { margin: 10px 0 0; font: var(--type-description-size)/1.7 var(--font-sans); color: var(--muted); }
.tk-dialog > .tk-footer { margin: 15px var(--space-gutter-sheet) 0; padding: 18px 0 var(--space-footer-bottom); }
.tk-dialog > .tk-footer::after { display: none; }

/* ---- Skeleton 2 (owner round 5: match farrowing) ---- */

/* TaskStepper · row face: farrowing's entry row — the label 15px/500, outlined keys (both), a mono 18px value; pressed ink. */
.st-stepper.tk-stepper[data-face="row"] { min-height: var(--entry-row-min); column-gap: var(--space-key-gap); }
.st-stepper.tk-stepper[data-face="row"] + .st-stepper.tk-stepper[data-face="row"] { border-top: 1px solid var(--line); }
.tk-stepper[data-face="row"] .st-stepper-label { font: 500 var(--type-entry-label-size)/1.4 var(--font-sans); }
.tk-stepper[data-face="row"] .st-stepper-key { width: var(--tap-min); min-height: var(--entry-row-min); }
.tk-stepper:is([data-face="row"], [data-face="well"]) .st-stepper-face { width: var(--tap-min); height: var(--tap-min); border: 1px solid var(--task-key-border);
  border-radius: var(--radius-control); background: var(--paper); color: var(--ink); }
.tk-stepper[data-face="well"] .st-stepper-face { width: var(--field-height); height: var(--field-height); }
.tk-stepper:is([data-face="row"], [data-face="well"]) .st-stepper-key:not([data-step^="-"]):not([aria-disabled="true"]) .st-stepper-face { background: var(--paper); border-color: var(--task-key-border); color: var(--ink); }
.tk-stepper:is([data-face="row"], [data-face="well"]) .st-stepper-face svg { width: var(--glyph-key-task); height: var(--glyph-key-task); stroke-width: 2.2; }
.tk-stepper .st-stepper-key[aria-disabled="true"] .st-stepper-face { background: var(--well); border-color: var(--line); color: var(--disabled-ink); }
.tk-stepper.tk-stepper .st-stepper-key.st-stepper-key:not([aria-disabled="true"]):is(:active, [data-preview~="pressed"]) .st-stepper-face { background: var(--ink); border-color: var(--ink); color: var(--paper); filter: none; }
.tk-stepper[data-face="row"] .st-stepper-value { min-width: 3ch; font: 600 var(--type-step-value-size)/1.3 var(--font-mono); }
.tk-stepper[data-face="row"][data-zero] .st-stepper-value { color: var(--ink); }
/* TaskStepper · well face: the label as a section title, then the keys and value on a well (Foster, Reconcile). */
.st-stepper.tk-stepper[data-face="well"] { row-gap: 10px; }
.tk-stepper[data-face="well"] .st-stepper-copy { align-items: flex-start; text-align: left; }
.tk-stepper[data-face="well"] .st-stepper-label { font: 500 var(--type-section-title-size)/1.5 var(--font-sans); color: var(--ink); }
.tk-stepper[data-face="well"] .st-stepper-keys { padding: var(--space-row-y); border-radius: var(--radius-inset); background: var(--well); }
.tk-stepper[data-face="well"] .st-stepper-key { width: var(--field-height); min-height: var(--field-height); }
.tk-stepper[data-face="well"] .st-stepper-value { font: 600 var(--type-figure-well-size)/1.3 var(--font-mono); letter-spacing: 0; color: var(--ink); }
.tk-stepper[data-face="well"][data-zero] .st-stepper-value { color: var(--ink); }
.tk-stepper[data-face="well"] .st-stepper-hint.st-stepper-hint { justify-content: flex-start; text-align: left; font-size: var(--type-description-size); line-height: 1.6; }
/* TaskStepper · count face: the count sheet's hero on the green area; − outlined green, + filled green. */
.st-stepper.tk-stepper[data-face="count"] { padding: var(--space-panel) var(--space-row-y) 10px; border-radius: var(--radius-count); background: var(--green-wash); }
.tk-stepper[data-face="count"] .st-stepper-label { font: 500 var(--type-row-title-size)/1.3 var(--font-sans); color: var(--green); }
.tk-stepper[data-face="count"] .st-stepper-keys { gap: var(--space-heading); min-height: 86px; }
.tk-stepper[data-face="count"] .st-stepper-face { width: var(--hero-key); height: var(--hero-key); border: 1px solid var(--chip-green-border); border-radius: var(--radius-hero-key);
  background: var(--paper); color: var(--green); }
.tk-stepper[data-face="count"] .st-stepper-face svg { width: var(--glyph-key-count); height: var(--glyph-key-count); }
.tk-stepper[data-face="count"] .st-stepper-key:not([data-step^="-"]):not([aria-disabled="true"]) .st-stepper-face { background: var(--green); border-color: var(--green); color: var(--paper);
  box-shadow: 0 3px 8px #225d3520; }
.tk-stepper[data-face="count"] .st-stepper-key[aria-disabled="true"] .st-stepper-face { background: var(--paper); border-color: var(--chip-green-border); color: var(--disabled-ink); box-shadow: none; }
.tk-stepper[data-face="count"] .st-stepper-value { color: var(--count-ink); }

/* TaskPhotos: farrowing's photo line — no well; a camera glyph, the label 13px, `Optional` 10px; an outlined camera key. */
.st-photos.tk-photos { padding: 0; border-radius: 0; background: transparent; }
* + .st-photos.tk-photos { margin-top: var(--space-section); }

/* the stack inside a sheet or a page body */
.tk-sheet-body > * + *, .tk-page-body > * + * { margin-top: var(--space-heading); }
.tk-sheet-body > .tk-stepper + .tk-stepper { margin-top: 0; }

/* the receipt line after a save, with Undo */
.sp-flash { display: flex; align-items: center; justify-content: space-between; gap: var(--space-footer-gap); min-height: var(--tap-min);
  color: var(--green); font: 500 var(--type-row-title-size)/1.4 var(--font-sans); }
.tk-scroll > .sp-flash { margin: 0 var(--space-gutter) 4px; }
.sp-flash > span { min-width: 0; }
.sp-note { margin: 0 var(--space-gutter) var(--space-heading); }
.sp-quiet { margin: 0; font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); }
.sp-empty { margin: var(--space-section) var(--space-gutter); font: var(--type-description-size)/1.5 var(--font-sans); color: var(--muted); text-align: center; }
.sp-warn { margin: 6px 0 0; font: var(--type-description-size)/1.5 var(--font-sans); color: var(--amber); }
.tk-footer.sp-two > * { flex: 1 1 0; min-width: 0; }
@keyframes sp-tick-in { from { transform: scale(.7); background: var(--paper); border-color: var(--muted); } to { transform: none; } }
@keyframes sp-tick-draw { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }

/* ---- inside a pen, as farrowing's sow sheet: the Piglets card (Litter summary · View log ›), the tool row, the day
   cards; [⋯] beside the footer's one action ---- */
.sp-pcard > .st-heading { margin-bottom: 8px; }
.sp-pfacts .st-fact dd { margin: 0; }
/* a figure that acts on itself: the fact's value as a button (the value, a small chevron) */
.sp-fact-act { display: inline-flex; align-items: center; gap: 4px; min-height: var(--tap-min); min-width: var(--tap-min); margin: -12px 0; padding: 0; border: 0; background: none;
  color: var(--ink); font: 500 var(--type-button-size)/1.3 var(--font-sans); text-align: left; cursor: pointer; }
.sp-fact-act [data-empty] { color: var(--muted); }
.sp-fact-act svg { flex: none; width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 2; }
/* farrowing's in-sheet tool row (Edit · Record death · More actions): outlined tools sharing the width */
.sp-toolrow { display: flex; gap: var(--space-key-gap); }
.sp-tool { flex: 1 1 0; min-width: 0; min-height: var(--tap-min); display: flex; align-items: center; justify-content: center; gap: 5px;
  margin: 0; padding: 8px 6px; border: 1px solid var(--line); border-radius: var(--radius-segment); background: var(--paper); color: var(--ink);
  font: 500 var(--type-identifier-size)/1.3 var(--font-sans); white-space: nowrap; cursor: pointer; }
.sp-tool:active { background: var(--press); }
.sp-tool svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* the breeder mark on an identified piglet: a 44px flag; filled when kept */
.icon-button.sp-mark { flex: none; width: var(--tap-min); height: var(--tap-min); border: 0; background: none; color: var(--muted); }
.sp-mark svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.sp-mark[aria-pressed="true"] { color: var(--green); }
.sp-mark[aria-pressed="true"] svg { fill: currentColor; }
.sp-tabs.st-segment { margin: 0; }
.tk-footer > .sp-more { flex: none; display: grid; place-items: center; width: var(--control-height); min-height: var(--control-height); margin: 0; padding: 0;
  border: 1px solid var(--control-border); border-radius: var(--radius-control); background: var(--paper); color: var(--ink); }
.sp-more svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

/* Processing: one TaskDay card per age-day (the skeleton's day card). A ticked, not yet submitted item is not a done
   row: it stays in ink on the green wash; a row saved on this visit fills its check in place; later days are muted. */
.tk-sheet-body > .tk-day + .tk-day { margin-top: var(--space-key-gap); }
.tk-day-row:has([data-ticked]) { background: var(--green-wash); }
.tk-day-row:has([data-ticked]) .tk-day-copy > strong { color: var(--ink); }
.tk-day-row:has([data-ticked]) .tk-day-mark, .tk-day-row:has([data-fresh]) .tk-day-mark { animation: sp-tick-in 200ms ease-out; }
.tk-day[data-when="future"] .tk-day-head > strong, .tk-day[data-when="future"] .tk-day-copy > strong { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .tk-day-row .tk-day-mark { animation: none !important; } }

/* Piglets: Scan tag · Choose notch · Add manually — three tool Buttons in a line */
.sp-adds { display: flex; gap: var(--space-key-gap); }
.sp-adds > .button { flex: 1 1 0; min-width: 0; }
.tk-sheet-body > .tk-list, .tk-page-body > .tk-list { margin: 0; }

/* Give IDs: one piglet at a time — big readouts (Measure) on the skeleton's Numpad, Boar · Gilt as TaskChoice tiles */
.sp-give-id { display: flex; align-items: flex-start; gap: var(--space-key-gap); }
.sp-give-id > .sp-give-scan { margin-top: 30px; }
.sp-keep-row > .tk-row-identity { display: none; }
.sp-give-id > .st-measure { flex: 1; min-width: 0; }
.sp-give-scan.icon-button { flex: none; width: var(--control-height); height: var(--control-height); border: 1px solid var(--control-border); border-radius: var(--radius-control); background: var(--paper); }
.sp-give-scan svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sp-give-measure .st-measure-value { font-size: var(--type-figure-well-size); }
.sp-give-measure .st-measure-box.st-measure-box { min-height: 64px; }
.sp-give-measure:has(.st-measure-hint) { margin-bottom: 0; }
.sp-give-litter { display: flex; flex-direction: column; gap: var(--space-heading); }
.sp-give-litter > .tk-stepper + .tk-stepper { margin-top: calc(-1 * var(--space-heading)); }
/* the pad docks above the footer, out of the scroller */
:is(.tk-page, .tk-sheet) > .st-numpad { flex: none; padding: var(--space-row-y) var(--space-gutter); background: var(--paper); border-top: 1px solid var(--line); }
:is(.tk-page, .tk-sheet) > .st-numpad + .tk-footer { border-top: 0; }
.tk-page-body > .tk-row[data-trail="tick"] { border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); }
.button.sp-wide { width: 100%; }

/* Move: the other pens as tiles, four to a line */
.sp-pick > .st-heading { margin-bottom: 8px; }
.tk-page-body > .sp-pick + * { margin-top: var(--space-section); }

/* ---- outside the phone: the demo controls ----
   Wide window: a card beside (or under) the framed phone. Phone width: a small "Demo" pill on the status bar's empty
   middle that opens the same card over the phone, so the page itself never scrolls. */
.sp-demo { box-sizing: border-box; font: 13px/1.5 var(--font-sans); color: var(--ink); }
.sp-demo button { font: inherit; color: inherit; cursor: pointer; }
.sp-demo-panel { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.sp-demo-toggle { display: none; }
@media (min-width: 431px) {
  .sp-demo { width: 100%; max-width: var(--phone-width); margin: 0 auto; padding: var(--space-section) 0; }
}
@media (min-width: 900px) {
  .sp-demo { position: fixed; top: var(--space-section); left: var(--space-section); width: 240px; margin: 0; padding: 16px;
    border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--paper); }
}
@media (max-width: 430px) {
  .sp-demo { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; align-items: center; }
  .sp-demo-toggle { display: block; min-height: 30px; padding: 3px 14px; border: 1px solid var(--control-border); border-radius: 999px; background: var(--paper); font-size: 12px; }
  .sp-demo[data-open="false"] .sp-demo-panel { display: none; }
  .sp-demo-panel { width: min(300px, calc(100vw - 32px)); margin-top: 6px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-panel);
    background: var(--paper); box-shadow: var(--shadow-dialog); }
}
.sp-demo-lang { display: flex; border: 1px solid var(--line); border-radius: var(--radius-segment); overflow: hidden; background: var(--paper); }
.sp-demo-lang button { min-width: 56px; min-height: 36px; border: 0; background: transparent; }
.sp-demo-lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.sp-demo-btn { min-height: 40px; padding: 8px 12px; border: 1px solid var(--control-border); border-radius: var(--radius-segment); background: var(--paper); text-align: left; }
.sp-demo-tip, .sp-demo-msg { margin: 0; color: var(--muted); font-size: 12px; }
.sp-demo-msg { color: var(--amber); }
.sp-demo-link { padding: 0; border: 0; background: none; text-decoration: underline; color: var(--muted); }
.sp-demo-farm { display: flex; flex-direction: column; align-items: stretch; gap: 2px; width: 100%; }
.sp-demo-label { margin: 0 0 2px; font-weight: 600; }
.sp-demo-farm button { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0; border: 0; background: none; text-align: left; }
.sp-demo-dot { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); box-sizing: border-box; }
.sp-demo-farm button[aria-checked="true"] .sp-demo-dot { border: 5px solid var(--ink); }

/* a piglet on the Piglets page: the row (tap to fix) and its breeder flag beside it */
.sp-pigrow { display: flex; align-items: center; padding-right: 6px; }
.sp-pigrow + .sp-pigrow { border-top: 1px solid var(--line); }
.sp-pigrow > .tk-row { flex: 1; min-width: 0; }
/* Processing: a section title like the Piglets card's; the Done section sits last */
.sp-proc > .st-heading { margin-bottom: 8px; }
.sp-proc > .tk-day + .tk-day { margin-top: var(--space-key-gap); }
.tk-day[data-when="done"] .tk-day-head > strong { color: var(--muted); }
</style>
</head>
