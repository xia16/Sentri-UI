<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/ux/design-system/tokens.css">

<style>
/* End task, the ended task and the handoff to weaning: layout only, from tokens.css. Built on the task skeleton (ADR 0003,
   SentriTask): every surface is a TaskPage over the room, as farrowing's Task overview and End task early; litters are
   TaskRows in TaskGroups by crate row. Cards (ADR 0002): Button's hold (holdButton + holdBind) with its status line
   (buttonReason) right above the footer, the danger Banner, Facts, Row doors, Status lines, Log. */
.en-body { --tk-sticky: 0px; display: flex; flex-direction: column; gap: var(--space-section); }
.en-body > * { margin: 0; }
.en-block > .st-heading { margin: 0 0 var(--space-key-gap); }
.en-groups { display: flex; flex-direction: column; gap: var(--space-heading); }
/* the whole-task progress card: the bar under its heading, the three counts under the bar (Facts, flat in the card) */
.en-progress > .tk-progress { margin: var(--space-heading) 0 0; }
.en-progress > .st-facts.st-facts.st-facts { margin: var(--space-heading) 0 0; padding: 0; border: 0; border-radius: 0; background: none; }
/* the hold's status line, right above the footer (Button · buttonReason); absent while it has nothing to say */
.en-why { flex: none; padding: var(--space-key-gap) var(--space-gutter) 0; background: var(--app-background); }
.en-why:has(> .st-button-reason:empty) { display: none; }
</style>
</head>
<body class="tk-stage">
<div id="screen"></div>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="/ux/design-system/components/task-skeleton.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, I = window.SentriIcons.icon, U = window.PPUI, K = window.SentriTask;
  var qs = PP.q;

  /* ---- states: a variant of the shared fixture + UI state. The figures are the ledger's End selector (select.end: `now`
     live, `atEnd` frozen by end_task) and its litters; End itself is `end_task` through append. ---- */
  var STATES = {
    'overview': { data: 'base', sheet: 'overview' },
    'overview-ended': { data: 'ended', ended: true, sheet: 'overview' },
    'end-review': { data: 'late', sheet: 'review' },
    'end-hold': { data: 'late', sheet: 'review', holding: 'static' },
    'end-pending': { data: 'late', sheet: 'review', pending: true },
    'end-changed': { data: 'late-changed', sheet: 'review', changed: true },
    'end-offline': { data: 'late', sheet: 'review', offline: true },
    'end-already': { data: 'late', sheet: 'review', already: true },
    'end-again': { data: 'ended', ended: true, sheet: 'review' },
    'end-unconfirmed': { data: 'late', sheet: 'review', unconfirmed: true },
    'receipt-after-end-mark': { data: 'ended-after-end', ended: true, sheet: 'receipt' },
    'end-blocked': { data: 'base', sheet: 'review' },
    'end-blocked-draft': { data: 'late', sheet: 'review', drafts: true },
    'receipt': { data: 'ended', ended: true, sheet: 'receipt' },
    'receipt-late-mark': { data: 'ended-late-mark', ended: true, sheet: 'receipt' },
    'receipt-since': { data: 'ended-after', ended: true, sheet: 'receipt' },
    'receipt-answered': { data: 'ended-answered', ended: true, sheet: 'receipt' },   // round 4: a review answered after End
    'ended': { data: 'ended', ended: true },
    'ended-correct': { data: 'ended-correct', ended: true },
    'ended-moves': { data: 'ended-moves', ended: true },
    'weaning-handoff': { data: 'ended', ended: true, sheet: 'handoff' },
    // one level down (round 5): the unfinished litters and today's records by hand, from the review; not done at End
    'end-litters': { data: 'late', sheet: 'litters' },
    'end-day': { data: 'late', sheet: 'day' },
    'ended-litters': { data: 'ended', ended: true, sheet: 'litters' }
  };
  var ALIAS = { 'late-after': 'ended-after' };            // ?data= names the pages used before the shared fixture
  var start = STATES[PP.state] || STATES.overview;
  var S = {
    data: start.data,
    sheet: start.sheet || '', ended: !!start.ended, drafts: !!start.drafts,
    holding: start.holding || '', pending: !!start.pending, changed: !!start.changed, offline: !!start.offline,
    already: !!start.already, unconfirmed: !!start.unconfirmed,
    mandatory: qs.get('mandatory') === '1', opened: 0, ovScroll: 0
  };
  // The unit comes from the room (?unit=, 7 by default); its task is the configured task whose litters stand in it.
  var store, CFG, UNIT = +(qs.get('unit') || 7) || 7, TASK = null, WEIGH_DAY = 21, frozen = { key: '', d: null };
  function load(name) {
    S.data = name || S.data; store = window.PPFixtures.open(S.data, { fresh: qs.get('fresh') === '1' }); CFG = store.config;
    var list = CFG.tasks || (CFG.task ? [CFG.task] : []);
    TASK = list.filter(function (t) { return t.litters.some(function (id) { var L = store.derived.litters[id]; return L && L.room === UNIT; }); })[0] || null;
  }

  /* ---- the ledger ---- */
  function D() { return store.derived; }
  function E() { return store.select.end(D(), { task: TASK.id }); }
  function fig(atEnd) { var e = E(); return atEnd && e.atEnd ? e.atEnd : e.now; }
  function ended() { var T0 = (D().tasks || []).filter(function (t) { return t.id === TASK.id; })[0]; return T0 && T0.ended && T0.ended.event ? T0.ended : null; }
  function inTask(c) { return TASK.litters.indexOf(c) >= 0; }
  function taskIds() { return TASK.litters.filter(function (id) { return D().litters[id]; }); }
  function Lx(id) { return D().litters[id]; }
  /* The ledger as it stood at End (the log up to end_task, replayed): the receipt's outcomes are frozen from it, never
     read live (R1-21). */
  function atEndLedger() {
    var en = ended(); if (!en) return D();
    var k = store.name + store.events.length;
    if (frozen.key !== k) {
      var i = store.events.findIndex(function (x) { return x.id === en.event; });
      try { frozen = { key: k, d: window.PPLedger.derive(store.events.slice(0, i + 1), CFG, { today: String(en.at).slice(0, 10) }) }; } catch (err) { frozen = { key: k, d: D() }; }
    }
    return frozen.d;
  }
  function doseCfg(id) { return CFG.doses.filter(function (d) { return d.id === id; })[0]; }
  function name(id) {
    var d = doseCfg(id), same = CFG.doses.filter(function (x) { return x.tx === d.tx; }).length > 1;
    return same ? PP.t('pp.room.dose.withday', { name: PP.t('pp.common.tx.' + d.tx), n: d.due }) : PP.t('pp.common.tx.' + d.tx);
  }
  function sum(xs, f) { return xs.reduce(function (a, x) { return a + (f(x) || 0); }, 0); }
  function eventOf(id) { return store.events.filter(function (x) { return x.id === id; })[0] || null; }
  function amount(e) { return !e ? 0 : e.castration ? e.castration.castrated || 0 : e.n || 0; }
  // An open possible double counts once toward Done: the ledger's `treatedOnce` (R1-21) feeds progress and per-litter done.
  // One litter as End reads it: the selector's per-dose list and per-litter totals (atEnd frozen, or now), and the litter's facts.
  // At End, the litter's own facts (day, alive, identity, loss) are the ledger's as it stood at End too.
  function litter(id, atEnd) {
    var x = (atEnd && ended() && atEndLedger().litters[id]) || Lx(id), f = fig(atEnd), list = (f.byLitter[id] || []), t = f.litters[id] || { done: 0, owed: 0, unknown: 0, missed: 0, notDue: 0, excluded: 0 };
    var idDay = x.dayAge >= (CFG.identity.day || 0);
    return {
      code: id, day: x.dayAge, alive: x.alive, sowDied: !!x.sowDied, unlocked: x.phase === 'open', loss: x.unexplained.openLoss,
      list: list, done: t.done, owed: t.owed + t.unknown, missed: t.missed, ahead: t.notDue, excluded: t.excluded,
      late: list.some(function (e) { return e.kind === 'owed' && x.doses[e.dose].status === 'late'; }),
      idDone: x.identity.done !== false, idAhead: !idDay, identified: x.identity.identified, unid: x.identity.done === false && idDay ? x.alive - x.identity.identified : 0,
      unfinished: fig(atEnd).unfinishedLitters.indexOf(id) >= 0
    };
  }
  function litters(atEnd) { return taskIds().map(function (id) { return litter(id, atEnd); }); }
  function workLeft(l) { return l.list.some(function (e) { return e.kind !== 'not_due'; }) || !l.idDone; }
  function totals(atEnd) {
    var f = fig(atEnd), ls = litters(atEnd), unf = ls.filter(function (l) { return l.unfinished; });
    return { done: f.progress.done, owed: f.progress.owed + f.progress.unknown, missed: f.progress.missed, ahead: f.progress.ahead, total: f.progress.total,
      ontime: f.onTime.n, due: f.onTime.k, excluded: sum(ls, function (l) { return l.excluded; }), pct: f.onTime.k ? Math.round(100 * f.onTime.n / f.onTime.k) : null,
      idDone: f.identityDone.n, litters: f.identityDone.k, unf: unf, work: unf.filter(workLeft).length,
      aheadLitters: ls.filter(function (l) { return l.ahead > 0; }).length,
      alive: sum(ls, function (l) { return l.alive; }), identified: sum(ls, function (l) { return l.identified; }) };
  }
  function outside() { return Object.keys(D().litters).filter(function (id) { var x = Lx(id); return x.room === UNIT && !inTask(id); }).sort(); }
  // End is refused while the batch's farrowing task is open (the ledger's own gate), and while this phone holds drafts.
  var gate = { key: '', open: false };
  function blocked() {
    var why = [], key = store.name + store.events.length;
    if (gate.key !== key) gate = { key: key, open: !ended() && store.trial({ type: 'end_task', task: TASK.id }).reason === 'farrowing_task_open' };
    if (gate.open) why.push({ kind: 'farrowing' });
    if (S.drafts) window.PPFixtures.DEVICE_DRAFTS.forEach(function (d) { why.push({ kind: d.kind === 'death' ? 'draft-death' : 'draft-edit', code: d.litter }); });
    return why;
  }
  function farrowingNow() { return Object.keys(D().litters).filter(function (id) { return Lx(id).phase === 'open' && inTask(id); }).sort(); }

  /* ---- the log after End: every kind of post-End event, in its own words ---- */
  function endIndex() { var e = ended(); return e ? store.events.findIndex(function (x) { return x.id === e.event; }) : -1; }
  function flagged(id, reason) { return D().flags.some(function (f) { return f.reason === reason && f.events.indexOf(id) >= 0; }); }
  function rejected(id) { return D().rejected.filter(function (r) { return r.id === id; })[0]; }
  function lineCount(e) { return (e.lines || []).reduce(function (t, l) { return t + (l.rowId ? 1 : l.n); }, 0); }
  function post() {
    var i0 = endIndex(); if (i0 < 0) return [];
    var out = [], idRun = null;
    store.events.slice(i0 + 1).forEach(function (e) {
      var at = e.syncedAt || e.at;
      if (e.type !== 'identity') idRun = null;
      if (e.type === 'treat') {
        var n = e.castration ? e.castration.castrated : e.n;
        // done after End on a phone that had not seen it: kept, stamped, flagged — never counted (RULINGS round 3)
        if (flagged(e.id, 'after_end')) out.push({ kind: 'afterend', code: e.litter, k: e.dose, n: n, stamped: e.at, at: at, who: e.who });
        else if (flagged(e.id, 'arrived_after_end')) out.push({ kind: 'late', code: e.litter, k: e.dose, n: n, stamped: e.at, at: at, who: e.who });
      } else if (e.type === 'correction' && !rejected(e.id)) {
        // one correction is one act: the one-event form (`changes[]`) or the older single form
        var list = e.changes || [{ target: e.target, void: e.void, set: e.set, fresh: e.fresh }];
        list.forEach(function (ch) {
          if (ch.identity) return;
          var t = eventOf(ch.target) || {};
          if (ch.fresh) out.push({ kind: 'wrong', code: ch.fresh.litter, from: t.litter, k: ch.fresh.dose, n: ch.fresh.castration ? ch.fresh.castration.castrated : ch.fresh.n, at: at, who: e.who });
          else if (t.type !== 'treat') return;
          else if (ch.void) out.push({ kind: 'void', code: t.litter, k: t.dose, n: t.castration ? t.castration.castrated : t.n, at: at, who: e.who });
          else if (ch.set && ch.set.castration) out.push({ kind: 'edit', code: t.litter, a: (t.castration || {}).castrated, b: ch.set.castration.castrated, at: at, who: e.who });
          else if (ch.set && ch.set.n != null) out.push({ kind: 'lower', code: t.litter, k: t.dose, a: t.n, b: ch.set.n, at: at, who: e.who });
        });
      } else if (e.type === 'double') out.push({ kind: 'double', code: e.litter, k: e.dose, answer: e.answer, at: at, who: e.who });
      else if (e.type === 'identity' && e.op === 'add') {
        if (idRun && idRun.code === e.litter) idRun.n++; else { idRun = { kind: 'id', code: e.litter, n: 1, at: at, who: e.who }; out.push(idRun); }
      } else if (e.type === 'death') out.push({ kind: 'death', code: e.litter, n: lineCount(e), at: at, who: e.who });
      else if (e.type === 'count') out.push({ kind: 'count', code: e.litter, n: e.observed, at: at, who: e.who });
      else if (e.type === 'move') {
        var inT = inTask;
        // arrivals owe their doses as not done: no marks after End (RULINGS round 3)
        var owes = (Lx(e.to).moves.filter(function (m) { return m.id === e.id; })[0] || { packets: {} }).packets;
        var owed = Object.keys(owes).filter(function (k) { return owes[k] === 'owed' && Lx(e.to).doses[k].status !== 'later'; });
        if (inT(e.from)) out.push({ kind: 'out', code: e.from, to: e.to, unit: Lx(e.to).room, n: e.n, at: at, who: e.who });
        if (inT(e.to)) out.push({ kind: 'in', code: e.to, from: e.from, unit: Lx(e.from).room, n: e.n, owes: owed, at: at, who: e.who });
      }
    });
    return out;
  }
  function postOf(code, kind) { return post().filter(function (e) { return e.code === code && (!kind || e.kind === kind); }); }
  function postSum(code, kind) { return sum(postOf(code, kind), function (e) { return e.n; }); }
  function gone(code) { return postSum(code, 'out') + postSum(code, 'death'); }

  /* ---- strings ---- */
  function esc(s) { return U.esc(s); }
  var one = PP.one;
  function date(iso) { return U.date(iso); }
  function time(iso) { return U.time(iso); }
  function stamp(iso, who) { return { date: date(iso), time: time(iso), who: who }; }
  function h(o) { return UI.heading(Object.assign({ title: '', kind: 'section', level: 4 }, o)); }
  function part(id, args, tone) { return { text: PP.t(id, args), strs: { text: id }, args: args ? { text: args } : undefined, tone: tone || undefined }; }

  /* ---- tokens: [wordId, args, valueId?, tone?] — the word stays ink, the value carries the colour ---- */
  var T = U.tok;
  function lossTok(n) { return T('pp.end.tok.loss', { n: n }, 'pp.end.tok.n', 'red'); }
  function rows(html) { return UI.rowGroup(html); }

  // Post-End facts about one litter, as tokens (the ended face and the handoff; never the receipt's frozen rows).
  function postToks(l, where) {
    var out = [];
    postOf(l.code).forEach(function (e) {
      if (e.kind === 'death') out.push(T('pp.end.tok.died_after', { n: e.n }));
      if (e.kind === 'out') out.push(T('pp.end.tok.out_after', { n: e.n }));
      if (e.kind === 'late') out.push(T(one('pp.end.tok.late_mark', 1), { n: 1 }));
      if (e.kind === 'afterend') out.push(T('pp.end.tok.afterend', { name: name(e.k), n: e.n }));
      if (where === 'face' && (e.kind === 'void' || e.kind === 'lower')) out.push(T('pp.end.tok.corrected', { name: name(e.k) }));
      if (where === 'face' && e.kind === 'wrong') out.push(T('pp.end.tok.wrong', { name: name(e.k), n: e.n }));
      if (where === 'face' && e.kind === 'edit') out.push(T('pp.end.tok.castrated', { a: e.a, b: e.b }, 'pp.end.tok.castrated.v', 'amber'));
      if (where === 'face' && e.kind === 'id') out.push(T('pp.end.tok.id_after', { n: e.n }));
    });
    return out;
  }
  // Not done for one litter × dose on the ended face: frozen at End, less the piglets gone since (the live figure when lower).
  function notDone(l, e) { var now = (fig(false).byLitter[l.code] || []).filter(function (x) { return x.dose === e.dose; })[0]; return now ? Math.min(e.n || 0, now.n || 0) : 0; }
  // Piglets moved in after End: their owed doses stay not done (RULINGS round 3), per dose.
  function arrivalsNotDone(l) {
    var by = {};
    postOf(l.code, 'in').forEach(function (e) { e.owes.forEach(function (k) { by[k] = (by[k] || 0) + e.n; }); });
    return Object.keys(by).map(function (k) { return { k: k, n: by[k] }; });
  }
  /* ---- shared blocks ---- */
  function pd(n) { return one('pp.end.v.pd', n); }
  /* Deaths recorded in processing (a body that explained a missing piglet included, R1-21), Moves inside the task, open
     unexplained items and sow deaths — now, or frozen at End (the ledger replayed to End) on the receipt. */
  function outcomes(toEnd) {
    var X = toEnd ? atEndLedger() : D();
    var deaths = [], moves = [], loss = 0, lossC = [], gain = 0, sows = [];
    taskIds().forEach(function (id) {
      var x = X.litters[id]; if (!x) return;
      x.deaths.forEach(function (d) { if (d.phase === 'locked') { var n = d.plain + d.rows + (d.fromMissing || 0); for (var k = 0; k < n; k++) deaths.push(id); } });
      x.moves.forEach(function (m) { if (m.dir === 'out') moves.push(m.n + '|' + id + '|' + m.other); });
      if (x.unexplained.openLoss) { loss += x.unexplained.openLoss; lossC.push(id); }
      gain += x.unexplained.openGain;
      if (x.sowDied) sows.push(id);
    });
    return { deaths: deaths, moves: moves.map(function (s) { var p = s.split('|'); return { n: +p[0], from: p[1], to: p[2] }; }), loss: loss, lossC: lossC, gain: gain, sows: sows };
  }
  /* Review items (round 4): End never waits for them. Before End they are listed open; End freezes them as "unresolved at
     End" on the receipt and the handoff; each stays answerable after, as a correction (the row opens its answer). */
  function reviewTitle(r) {
    if (r.kind === 'double') return ['pp.end.rev.double', { code: r.litter, name: name(r.dose) }];
    if (r.kind === 'count') return ['pp.end.rev.count', { code: r.litter }];
    if (r.kind === 'held') return ['pp.end.rev.held', { code: r.litter }];
    return ['pp.end.rev.correction', { code: r.litter }];
  }
  function reviewDesc(r) {
    if (r.kind === 'double') { var a = eventOf(r.records[0]) || {}, b = eventOf(r.records[1]) || {}; return ['pp.end.rev.double.d', { a: time(a.at) + ' · ' + a.who, b: time(b.at) + ' · ' + b.who }]; }
    if (r.kind === 'count') return ['pp.end.rev.count.d', { list: r.counts.map(function (c) { return c.observed; }).join(' · ') }];
    if (r.kind === 'held') return ['pp.end.rev.held.d', { n: r.n }];
    return ['pp.end.rev.correction.d', null];
  }
  function reviewRow(r) {
    var t = reviewTitle(r), d = reviewDesc(r);
    return UI.row({ title: '', description: '', action: 'open-review', value: r.id, strs: { title: t[0], description: d[0] }, args: { title: t[1], description: d[1] } });
  }
  // The receipt's review list: the items End froze; answered since, they move to Since End.
  function frozenReviews() { var R = store.select.reviews(D()), open = {}; R.items.forEach(function (x) { open[x.id] = 1; }); return (fig(true).reviews || []).filter(function (r) { return open[r.id]; }); }
  function sinceEntries() {
    return post().slice().sort(function (a, b) { return a.at < b.at ? 1 : a.at > b.at ? -1 : 0; }).map(function (e) {
      var m = { meta: 'pp.end.stamp' }, a = { meta: stamp(e.at, e.who) };
      if (e.kind === 'edit') return { title: '', strs: Object.assign({ title: 'pp.end.since.edit', detail: 'pp.end.since.edit.detail' }, m), args: Object.assign({ title: { code: e.code, a: e.a, b: e.b } }, a) };
      if (e.kind === 'id') return { title: '', strs: Object.assign({ title: one('pp.end.since.id', e.n) }, m), args: Object.assign({ title: { code: e.code, n: e.n } }, a) };
      if (e.kind === 'death') return { title: '', strs: Object.assign({ title: 'pp.end.since.death' }, m), args: Object.assign({ title: { code: e.code, n: e.n } }, a) };
      if (e.kind === 'count') return { title: '', strs: Object.assign({ title: 'pp.end.since.count' }, m), args: Object.assign({ title: { code: e.code, n: e.n } }, a) };
      if (e.kind === 'double') return { title: '', strs: Object.assign({ title: e.answer === 'twice' ? 'pp.end.since.dbl_twice' : 'pp.end.since.dbl_same', detail: 'pp.end.since.dbl.detail' }, m), args: Object.assign({ title: { code: e.code, name: name(e.k) } }, a) };
      if (e.kind === 'wrong') return { title: '', strs: Object.assign({ title: 'pp.end.since.wrong', detail: 'pp.end.since.wrong.detail' }, m), args: Object.assign({ title: { code: e.code, name: name(e.k), n: e.n }, detail: { from: e.from } }, a) };
      if (e.kind === 'late') return { title: '', strs: Object.assign({ title: 'pp.end.since.late', detail: 'pp.end.since.late.detail' }, m), args: Object.assign({ title: { code: e.code, name: name(e.k), n: e.n }, detail: { date: date(e.stamped), time: time(e.stamped) } }, a) };
      if (e.kind === 'void') return { title: '', strs: Object.assign({ title: 'pp.end.since.void', detail: 'pp.end.since.void.detail' }, m), args: Object.assign({ title: { code: e.code, name: name(e.k), n: e.n } }, a) };

      if (e.kind === 'afterend') return { title: '', strs: Object.assign({ title: 'pp.end.since.afterend', detail: 'pp.end.since.afterend.detail' }, m), args: Object.assign({ title: { code: e.code, name: name(e.k), n: e.n }, detail: { date: date(e.stamped), time: time(e.stamped) } }, a) };

    var words = function (e) {

      if (e.type === 'death') return ['pp.end.day.death', { code: e.litter, n: lineCount(e) }];
      if (e.type === 'count') return ['pp.end.day.count', { code: e.litter, n: e.observed }];
      return ['pp.end.day.move', { n: e.n, from: e.from, to: e.to }];
    };
    var body = d.order.map(function (who) {
      var list = d.by[who].slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
      return '<div class="en-block">' + h({ kind: 'group', strs: { title: 'pp.end.day.who', meta: one('pp.end.day.n', list.length) }, args: { title: { who: who }, meta: { n: list.length } } }) +
        rows(list.map(function (e) { var w = words(e); return UI.row({ title: '', description: '', action: 'open-record', value: e.litter || e.from, strs: { title: w[0], description: 'pp.end.day.at' }, args: { title: w[1], description: { t: time(e.at) } } }); }).join('')) + '</div>';
    }).join('');
    return page('pp.end.day.title', null, 'pp.end.day.desc', null, body, backOnly());
  }
  /* The handoff to weaning: as it stands now. Every row opens its litter; weights say their day; doses not reached are
     "not given in this task", owed ones "not done at End" (R1-21); the review items End froze are listed. */
  function weightTok(l) {
    var ws = store.weights(l.code).slice().sort(function (a, b) { return (b.day || 0) - (a.day || 0); }), w = ws[0];
    if (w) return T('pp.end.w.l.kg_day', { kg: w.kg, n: w.day });
    return l.day < WEIGH_DAY ? T('pp.end.w.l.weigh_ahead', { n: WEIGH_DAY }) : T('pp.end.w.l.noweight');
  }
  function handoffPage() {
    var now = totals(false), atEnd = litters(true), loss = outcomes(false);
    var perLitter = function (l) {
      var toks = [weightTok(l)];
      if (l.loss) toks.push(lossTok(l.loss));
      if (gone(l.code)) toks = toks.concat(postToks(l, 'handoff').filter(function (x) { return /died_after|out_after/.test(x[0]); }));
      return litterRow(l, [P('pp.end.w.l.alive', { n: l.alive }), { sep: true }, P('pp.end.w.l.identified', { n: l.identified })], tparts(toks));
    };
    var groups = [];
    function add(kind, k, n, code) {
      if (!n) return;
      var g = groups.filter(function (x) { return x.k === k && x.kind === kind; })[0];
      if (!g) { g = { k: k, kind: kind, n: 0, codes: [], since: false }; groups.push(g); }
      g.n += n; if (g.codes.indexOf(code) < 0) g.codes.push(code);
      // A mark stamped before End, a correction or an after-End treatment on this litter and dose.
      if (postOf(code).some(function (e) { return e.k === k && /late|wrong|void|lower|afterend/.test(e.kind); })) g.since = true;
    }
    atEnd.filter(function (l) { return l.unfinished; }).forEach(function (l) {
      l.list.forEach(function (e) { add(e.kind === 'missed' ? 'missed' : e.kind === 'not_due' ? 'ahead' : 'owed', e.dose, notDone(l, e), l.code); });
    });
    atEnd.forEach(function (l) { arrivalsNotDone(l).forEach(function (a) { add('owed', a.k, a.n, l.code); }); });
    var ndTotal = sum(groups, function (g) { return g.n; });
    var nd = groups.map(function (g) {
      return UI.row({ title: '', action: 'open-litter', value: g.codes[0], strs: { title: g.kind === 'missed' ? 'pp.end.u.missed' : 'pp.end.w.u.' + g.kind, description: g.since ? 'pp.end.w.since' : 'pp.end.codes' }, args: { title: { name: name(g.k), n: g.n }, description: { list: g.codes.join(' ') } } });
    }).join('');
    var weighed = litters(false).filter(function (l) { return store.weights(l.code).some(function (x) { return x.day === WEIGH_DAY; }); }).length;
    var weighAhead = litters(false).filter(function (l) { return !store.weights(l.code).some(function (x) { return x.day === WEIGH_DAY; }) && l.day < WEIGH_DAY; }).length;
    var body = UI.facts([
      { label: '', strs: { label: 'pp.end.w.alive', value: one('pp.common.unit.piglet', now.alive) }, args: { value: { n: now.alive } } },
      { label: '', strs: { label: 'pp.end.w.identified', value: 'pp.end.v.piglets_of' }, args: { value: { n: now.identified, k: now.alive } } },
      { label: '', strs: { label: 'pp.end.w.weights', value: 'pp.end.v.litters_of', meta: weighAhead ? one('pp.end.w.weights.ahead', weighAhead) : undefined }, args: { value: { n: weighed, k: now.litters }, meta: { n: weighAhead, day: WEIGH_DAY } } },
      { label: '', strs: { label: 'pp.end.out.loss', value: 'pp.end.out.open', meta: loss.loss ? 'pp.end.codes' : undefined }, args: { value: { n: loss.loss }, meta: { list: loss.lossC.join(' ') } } }
    ], { columns: 2 }) +
      (nd ? '<div class="en-block">' + sec({ strs: { title: 'pp.end.nd.title', meta: pd(ndTotal) }, args: { meta: { n: ndTotal } } }) + rows(nd) + '</div>' : '') +
      reviewsBlock(frozenReviews(), true) +
      '<div class="en-block">' + sec({ strs: { title: 'pp.end.w.litters', meta: one('pp.end.v.litters', now.litters) }, args: { meta: { n: now.litters } } }) + groupsOf(byRow(litters(false), perLitter)) + '</div>';
    return page('pp.end.w.title', null, 'pp.end.w.desc', { n: UNIT }, body, backOnly());
  }

  /* ---- render: the active page over the room (one page at a time) ---- */
  var screen = document.getElementById('screen');
  function render() {
    var scroll = screen.querySelector('.tk-page-body'), top = scroll ? scroll.scrollTop : 0, was = S.shown;
    var inner;
    if (!TASK) {
      // A unit with no processing task: nothing to end here; its litters record deaths, counts and moves (Q18)
      inner = page('pp.end.none.title', { n: UNIT }, 'pp.end.none.desc', null, '', backOnly('back'));
    } else {
      var sh = S.sheet;
      inner = sh === 'overview' ? overviewPage() : sh === 'review' ? reviewPage() : sh === 'receipt' ? receiptPage() : sh === 'handoff' ? handoffPage()
        : sh === 'litters' ? littersPage() : sh === 'day' ? dayPage() : S.ended ? endedPage() : overviewPage();
    }
    screen.innerHTML = K.phone(behind() + inner, { label: P('pp.common.task') });
    PP.apply(screen);
    UI.liveFill(screen, { then: function (el) { PP.apply(el); } });
    S.shown = S.sheet + (S.ended ? ':e' : '');
    var nb = screen.querySelector('.tk-page-body');
    if (nb) nb.scrollTop = S.shown === was ? top : S.sheet === 'overview' ? S.ovScroll : 0;
  }

  /* ---- URL and history: every view is a state; the review is one history entry above the overview ---- */
  function stateName() {
    if (S.sheet === 'litters') return S.ended ? 'ended-litters' : 'end-litters';
    if (S.sheet === 'day') return 'end-day';
    if (S.ended) return S.sheet === 'receipt' ? (S.data === 'ended-late-mark' ? 'receipt-late-mark' : S.data === 'ended-after-end' ? 'receipt-after-end-mark' : S.data === 'ended-after' ? 'receipt-since' : 'receipt') : S.sheet === 'handoff' ? 'weaning-handoff' : S.sheet === 'overview' ? 'overview-ended' : S.sheet === 'review' ? 'end-again' : S.data === 'ended-correct' ? 'ended-correct' : S.data === 'ended-moves' ? 'ended-moves' : 'ended';
    if (S.sheet === 'review') return blocked().length ? (S.drafts ? 'end-blocked-draft' : 'end-blocked') : S.offline ? 'end-offline' : S.already ? 'end-already' : S.unconfirmed ? 'end-unconfirmed' : S.changed ? 'end-changed' : S.pending ? 'end-pending' : 'end-review';
    return 'overview';
  }
  function setUrl(push, st) {
    var p = new URLSearchParams(location.search), sn = stateName(); p.set('state', sn);
    if (S.data !== (STATES[sn] || {}).data && store.name === S.data) p.set('data', S.data); else p.delete('data');
    ['offline', 'recheck', 'fresh'].forEach(function (k) { p.delete(k); });
    try { history[push ? 'pushState' : 'replaceState'](st || {}, '', location.pathname + '?' + p.toString()); } catch (e) {}
  }
  function openSheet(n) {
    if (S.sheet === 'overview') { var b = screen.querySelector('.tk-page-body'); if (b) S.ovScroll = b.scrollTop; }
    var from = S.sheet; S.sheet = n; S.opened = Date.now(); setUrl(true, { sheet: n, from: from }); render();
  }
  function closeSheet() {
    S.holding = ''; var st = history.state;
    if (st && st.sheet && !st.deep) { history.back(); return; }
    // Deep-linked: the review returns to the overview, a page one level down to the review; the others to the page beneath.
    S.sheet = S.ended ? '' : S.sheet === 'review' ? 'overview' : S.sheet === 'litters' || S.sheet === 'day' ? 'review' : ''; S.pending = S.changed = S.offline = S.already = S.unconfirmed = false; setUrl(false); render();
  }
  window.addEventListener('popstate', function (ev) {
    S.holding = ''; S.pending = S.changed = S.offline = S.already = S.unconfirmed = false;
    S.sheet = (ev.state && ev.state.sheet) || (S.ended ? '' : 'overview');
    // Back after End never reopens the End flow: an overview or review entry left in history lands on the ended face.
    if (S.ended && (S.sheet === 'overview' || S.sheet === 'review')) { S.sheet = ''; setUrl(false, { ended: true }); }
    render();
  });
  if (S.sheet) { try { history.replaceState({ sheet: S.sheet, deep: true }, '', location.href); } catch (e) {} }

  /* ---- routes out: they carry the crate, the state, the unit, the sow and, after End, task=ended (and the variant) ---- */
  function route(page, state, code, extra) {
    var sow = store.sow(code) || {};
    return PP.href(page, Object.assign({ state: state, crate: code, unit: UNIT, sow: sow.sow, task: S.ended ? 'ended' : '', data: store.name !== 'base' ? store.name : '' }, extra || {}));
  }
  function roomHref() { return PP.href('room.html', { unit: UNIT !== 7 ? UNIT : '', data: store.name !== 'base' ? store.name : '' }); }
  function litterHref(code) { return PP.href('room.html', { state: 'litter', crate: code, unit: UNIT !== 7 ? UNIT : '', task: S.ended ? 'ended' : '', data: store.name !== 'base' ? store.name : '' }); }

  /* ---- hold to End (Button's hold, ADR 0002): 850ms, released early it says so; the keyboard is a two-step. On commit the
     server rechecks every litter; the hold is then settled done (the receipt), failed (the reason, the review again) or
     unknown (terminal: never offered again). ---- */
  var holds = null;
  function commitEnd(el) {
    S.holding = ''; S.offline = S.changed = false;
    if (qs.get('offline') === '1' || navigator.onLine === false) { holds.settle(el, 'failed'); S.offline = true; setUrl(false, history.state); render(); return; }
    S.pending = true; setUrl(false, history.state);
    setTimeout(function () {
      S.pending = false;
      if (qs.get('recheck') === 'changed') { holds.settle(el, 'failed'); S.changed = true; load('late-changed'); setUrl(false, history.state); render(); return; }
      // Someone else ended it first: say who and when, and open their receipt from here.
      if (qs.get('recheck') === 'already') { holds.settle(el, 'failed'); S.already = true; setUrl(false, history.state); render(); return; }
      // The answer never came: End may have gone through. The hold goes unknown (terminal); point at the task.
      if (qs.get('recheck') === 'unconfirmed') { holds.settle(el, 'unknown'); S.unconfirmed = true; setUrl(false, history.state); render(); return; }
      if (blocked().length) { holds.settle(el, 'failed'); setUrl(false, history.state); render(); return; }
      var r = store.commit({ type: 'end_task', task: TASK.id });
      if (!r.ok) { holds.settle(el, 'failed'); if (r.reason === 'already_ended') S.already = true; setUrl(false, history.state); render(); return; }
      holds.settle(el, 'done');
      finishEnded('receipt');
    }, 700);
  }
  // The task is ended: the review's history entry becomes the receipt; the overview's entry beneath is rewritten on the way back.
  function finishEnded(sheet, variant) {
    if (variant) load(variant);
    S.ended = true; S.pending = S.already = S.unconfirmed = false; S.sheet = sheet;
    setUrl(false, { sheet: sheet || undefined, deep: true, ended: true }); render();
  }
  holds = UI.holdBind(screen, { t: function (id) { return PP.t(id); },
    cues: { keep: 'pp.end.hold.keep', tap: 'pp.end.hold.tap', released: 'pp.end.hold.released', disarmed: 'pp.end.hold.released', again: 'ds.c2.hold.again', early: 'ds.c2.hold.again', pending: 'pp.end.hold.pending', failed: 'pp.end.hold.failed', unknown: 'ds.c2.hold.unknown' },
    onCommit: function (el) { commitEnd(el); } });
  screen.addEventListener('keydown', function (ev) {
    if (ev.defaultPrevented) return;                                  // the hold took Escape (it disarmed)
    if (ev.key === 'Escape') { if (S.sheet && S.sheet !== 'overview') closeSheet(); }
  });

  screen.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]'); if (!b) return;
    var a = b.dataset.action, v = b.dataset.value;
    if (a === 'hold') return;
    if (a === 'close-sheet') { closeSheet(); return; }
    // R1-30: Back from the ended face (and its receipt) returns to the room, not the designer index
    if (a === 'back') { location.href = roomHref(); return; }
    if (a === 'review') { openSheet('review'); return; }
    if (a === 'receipt') { if (S.sheet === 'overview' || S.sheet === 'review') { S.sheet = 'receipt'; setUrl(false, { sheet: 'receipt', deep: true, ended: true }); render(); return; } openSheet('receipt'); return; }
    if (a === 'handoff') { openSheet('handoff'); return; }
    if (a === 'litters') { openSheet('litters'); return; }
    if (a === 'day') { openSheet('day'); return; }
    if (a === 'open-room') { location.href = roomHref(); return; }
    if (a === 'open-litter') { location.href = litterHref(v); return; }
    if (a === 'open-record') { location.href = PP.href('edit.html', { state: 'record-page', crate: v, data: store.name !== 'base' ? store.name : '' }); return; }
    if (a === 'open-review') {
      var r = (fig(!!ended()).reviews || []).concat(fig(false).reviews || []).filter(function (x) { return x.id === v; })[0];
      if (!r) return;
      // the same doors as the room's review list: a held body and a count conflict on the count sheet, a crossed correction on
      // the record page; a possible double on its answer sheet
      var p = { crate: r.litter, unit: UNIT !== 7 ? UNIT : '', data: store.name };
      location.href = r.kind === 'double' ? PP.href('edit.html', Object.assign({ state: 'double', dose: r.dose, from: 'end' }, p))
        : r.kind === 'held' ? PP.href('count.html', Object.assign({ state: 'held-body' }, p))
          : r.kind === 'count' ? PP.href('count.html', Object.assign({ state: 'count-conflict' }, p))
            : PP.href('edit.html', Object.assign({ state: 'record-page' }, p));
      return;
    }
    if (a === 'already-receipt') { finishEnded('receipt', 'ended-by-other'); return; }
    if (a === 'check-ended') { finishEnded('', 'ended'); return; }
    // the dead sheet's Save and Back return here (its `back`: this page, as it stands)
    if (a === 'open-dead') { location.href = route('dead.html', 'dead-draft', v, { back: 'end.html' + location.search }); return; }
  });

  var boot = PP.ready.then(function () {
    var q = qs.get('data');
    load(ALIAS[q] || (window.PPFixtures.VARIANTS[q] ? q : start.data));
    // Ended already (here or on another phone): the task opens as ended; the review never offers End again (R1-13)
    if (TASK && ended()) S.ended = true;
    render();
  });
  // The one registry exception: when the registry itself failed to load there is nothing to look strings up in.
  boot.catch(function () {
    screen.innerHTML = '<p>Couldn’t load the task.</p><button type="button" onclick="location.reload()">Retry</button>';
  });
})();
</script>
