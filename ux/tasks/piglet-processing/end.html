<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piglet processing · End task</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<style>
/* End task, the ended task and the handoff to weaning: layout only, from tokens.css.
   Candidate:LitterRow is S1's (room.html), reused; Candidate:HoldButton is this slice's (see the report). */
#screen { display: flex; flex-direction: column; gap: var(--space-section); }
.pp-head { display: flex; align-items: flex-start; gap: var(--space-footer-gap); }
.pp-head > .pp-title { flex: 1; min-width: 0; }
.pp-head .st-heading { margin: 0; }
.pp-head .pp-title > .st-heading + .st-heading { margin-top: 4px; }
.pp-block > .st-heading { margin-bottom: 8px; }
.pp-locked { position: relative; height: 100vh; overflow: hidden; }
.pp-layer .scrim { inset: 0; }
/* Overview and End share farrowing's tallest drawer: 32px of the phone stays above it; title and footer stay put, the body scrolls. */
.pp-layer .sheet { height: calc(100% - 32px); max-height: calc(100% - 32px); }
.pp-layer .sheet-body { flex: 1; display: flex; flex-direction: column; gap: var(--space-section); padding-bottom: var(--space-panel); }
.pp-layer .sheet-body > * { flex: none; }
.pp-layer .utility-header { padding: var(--space-gutter) var(--space-gutter) 8px; }
.pp-layer .utility-header .st-heading { margin: 0; }
.pp-layer .sheet-footer { gap: var(--space-section); }
.pp-layer .sheet-footer .button { flex: 1; }
.pp-layer .sheet-footer .button.secondary { flex: none; min-width: var(--back-width); }

/* Candidate:LitterRow (S1): the Row card's geometry with the row law's mono line 2, one named chip and the rail. Colour sits on the value only. */
.pp-litter .pp-code { flex: none; min-width: 40px; font-family: var(--font-mono); font-size: var(--type-identifier-size); font-weight: 600; color: var(--ink); }
.st-row.pp-litter .st-row-copy small.pp-mono { font-family: var(--font-mono); white-space: normal; overflow: visible; text-overflow: clip; }
.st-row.pp-litter .st-row-copy strong { white-space: normal; overflow: visible; text-overflow: clip; }
.pp-litter .pp-tok { display: inline-block; max-width: 100%; white-space: nowrap; }
.st-row.pp-litter .st-row-copy strong .pp-tok { white-space: normal; }
.pp-litter .pp-tok:not(:last-child)::after { content: "·"; margin-left: 4px; margin-right: 4px; color: var(--muted); }
.pp-litter [data-tone="red"] { color: var(--red); }
.pp-litter [data-tone="amber"] { color: var(--amber); }
.pp-litter .pp-chip { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 96px; font-size: var(--type-description-size); color: var(--amber); }
.pp-litter .pp-chip[data-tone="red"] { color: var(--red); }
.pp-litter .pp-chip::before { content: ""; flex: none; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

/* Candidate:HoldButton: the danger Button with farrowing's 850ms hold-to-commit fill (ASTRA-TASK-CLOSURE). */
.pp-hold { position: relative; overflow: hidden; flex-direction: column; gap: 4px; touch-action: none; user-select: none; -webkit-user-select: none; }
.pp-hold > span, .pp-hold > small { position: relative; z-index: 1; pointer-events: none; }
.pp-hold > small { font-size: var(--type-description-size); font-weight: 600; }
.pp-hold::before { content: ""; position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; background: var(--ink); }
.pp-hold[data-holding]::before { transform: scaleX(1); transition: transform 850ms linear; }
.pp-hold[data-holding="static"]::before { transform: scaleX(.6); transition: none; }
.pp-hold[data-holding="full"]::before { transform: scaleX(1); transition: none; }
</style>
</head>
<body>
<main class="phone inspection-phone" data-st-context="page" id="phone">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  var UI = window.SentriUI, I = window.SentriIcons.icon;
  var qs = new URLSearchParams(location.search);

  /* ---- farm config (sample): one obligation per scheduled dose; identity = notch every piglet (scheme all) on day 3; weigh day 21 ---- */
  var DOSES = [
    { k: 'cord', day: 0 }, { k: 'nasal', day: 0 }, { k: 'iron', day: 3 }, { k: 'tail', day: 3 },
    { k: 'castrate', day: 5, males: true }, { k: 'coccidiosis', day: 7, last: 7 }, { k: 'health', day: 21 }
  ];
  var UNIT = 7, WEIGH_DAY = 21;

  /* ---- fixtures: Unit 7, the room list's crates (room.html `base`), and the same litters 18 days on.
     st: one code per DOSES entry. o on time · l recorded late · p due today, not yet · P<n> due today, n still owed ·
     O<n> late, n owed (no n: all) · M missed (past the last age-day) · N not yet due.
     id: done · due · ahead · <n>/<k> identified · closed:<n>/<k> (a candidates farm's closed set counts as done). ---- */
  function L(code, day, alive, males, st, o) { return Object.assign({ code: code, day: day, alive: alive, males: males, st: st.split(' '), id: 'done' }, o || {}); }
  var FIX = {
    // 29 Sep 10:30 — the room list's `base`. The batch's farrowing task is open (D01 is still farrowing).
    now: { farrowing: { open: true, units: [7], active: ['D01'] }, litters: [
      L('A02', 3, 12, 6, 'o o p p N N N', { id: 'due' }),
      L('A05', 3, 11, 5, 'o o o P5 N N N'),
      L('B01', 5, 13, 7, 'o o O o p N N', { sowDied: true }),
      L('B04', 9, 10, 5, 'o o o o o M N'),
      L('C02', 1, 14, 7, 'o o N N N N N', { id: 'ahead' }),
      L('C04', 3, 9, 4, 'o o o o N N N'),
      L('D01', 0, 8, 4, 'p p N N N N N', { id: 'ahead', unlocked: true }),
      L('D03', 5, 11, 6, 'o o o o p N N', { loss: 2 }),
      L('D05', 6, 10, 5, 'o o l l o N N')
    ], outside: ['E01'], deaths: [], moves: [], sowDeaths: ['B01'] },
    // 17 Oct 16:10 — the farrowing task ended 3 Oct; 3 piglets died (A02, B01, C02); 3 moved B01 → C04; D03's loss of 2 still open.
    late: { farrowing: { open: false, units: [7], active: [] }, litters: [
      L('A02', 21, 11, 6, 'o o o o o o o', { kg: '66.0' }),
      L('A05', 21, 11, 5, 'o o o o o o o', { kg: '63.8' }),
      L('B01', 23, 9, 7, 'o o l o O1 o o', { sowDied: true, kg: '51.3' }),
      L('B04', 27, 10, 5, 'o o o o o M o', { kg: '57.5' }),
      L('C02', 19, 13, 7, 'o o o o o o N'),
      L('C04', 21, 12, 4, 'o o o o o o o', { kg: '68.4' }),
      L('D01', 18, 8, 4, 'o o o o o o N', { id: '5/8' }),
      L('D03', 23, 11, 6, 'o o o o o o o', { loss: 2, kg: '62.7' }),
      L('D05', 24, 10, 5, 'o o l l o o o', { kg: '60.2' })
    ], outside: ['E01'], deaths: ['A02', 'B01', 'C02'], moves: [{ from: 'B01', to: 'C04', n: 3 }], sowDeaths: ['B01'] }
  };
  var ENDED = { at: new Date(2026, 9, 17, 16, 20), who: 'G. Hansen' };
  function at(d, h, m) { return new Date(2026, 9, d, h, m); }
  // Records written after End, per state. Every kind of post-End event lands in Since End.
  var POST = {
    correct: [
      { kind: 'late', code: 'C02', k: 'health', n: 13, stamped: at(17, 16, 5), at: at(17, 18, 40), who: 'L.M' },
      { kind: 'death', code: 'A02', n: 1, at: at(18, 7, 10), who: 'G.H' },
      { kind: 'wrong', code: 'B01', from: 'B04', k: 'castrate', n: 1, at: at(18, 8, 20), who: 'L.M' },
      { kind: 'edit', code: 'A05', a: 5, b: 4, at: at(18, 8, 40), who: 'L.M' },
      { kind: 'id', code: 'D01', n: 3, at: at(18, 9, 5), who: 'L.M' },
      { kind: 'count', code: 'D03', n: 11, at: at(18, 9, 30), who: 'G.H' }
    ],
    moves: [
      { kind: 'death', code: 'C02', n: 2, at: at(18, 6, 50), who: 'G.H' },
      { kind: 'out', code: 'C02', to: 'F03', unit: 8, n: 4, at: at(18, 7, 30), who: 'L.M' },
      { kind: 'in', code: 'D01', from: 'F05', unit: 8, n: 2, owes: 'health', at: at(18, 7, 40), who: 'L.M' },
      { kind: 'catchup', code: 'D01', k: 'health', n: 2, at: at(18, 8, 0), who: 'L.M' }
    ],
    late: [{ kind: 'late', code: 'C02', k: 'health', n: 13, stamped: at(17, 16, 5), at: at(17, 18, 40), who: 'L.M' }],
    // A treatment physically done after End, synced later from an offline phone: kept, stamped, flagged; frozen figures unchanged.
    afterEnd: [{ kind: 'afterend', code: 'B01', k: 'castrate', n: 1, stamped: at(17, 17, 5), at: at(17, 19, 10), who: 'L.M' }]
  };
  POST.after = POST.correct.concat(POST.moves);
  // What a recheck found when it ran after the hold (end-changed): a mark from another phone — late, so on time is unchanged.
  var CHANGE = { code: 'B01', k: 'castrate', n: 1, who: 'L.M' };
  // Who ended it, when the server says it already was (end-already).
  var ALREADY = { at: new Date(2026, 9, 17, 16, 20), who: 'A.K' };
  // Drafts live on this phone only; they block End here.
  var DRAFTS = [{ kind: 'death', code: 'D03' }, { kind: 'edit', code: 'A05' }];

  var STATES = {
    'overview': { fix: 'now', sheet: 'overview' },
    'end-review': { fix: 'late', sheet: 'review' },
    'end-hold': { fix: 'late', sheet: 'review', holding: 'static' },
    'end-pending': { fix: 'late', sheet: 'review', pending: true },
    'end-changed': { fix: 'late', sheet: 'review', changed: true },
    'end-offline': { fix: 'late', sheet: 'review', offline: true },
    'end-already': { fix: 'late', sheet: 'review', already: true },
    'end-unconfirmed': { fix: 'late', sheet: 'review', unconfirmed: true },
    'receipt-after-end-mark': { ended: true, sheet: 'receipt', post: 'afterEnd' },
    'end-blocked': { fix: 'now', sheet: 'review' },
    'end-blocked-draft': { fix: 'late', sheet: 'review', drafts: true },
    'receipt': { ended: true, sheet: 'receipt' },
    'receipt-late-mark': { ended: true, sheet: 'receipt', post: 'late' },
    'ended': { ended: true },
    'ended-correct': { ended: true, post: 'correct' },
    'ended-moves': { ended: true, post: 'moves' },
    'weaning-handoff': { ended: true, sheet: 'handoff' }
  };
  var start = STATES[PP.state] || STATES.overview;
  var S = {
    fix: start.ended ? 'late' : (qs.get('data') === 'late' || qs.get('data') === 'now' ? qs.get('data') : start.fix),
    sheet: start.sheet || '', ended: !!start.ended, post: start.post || (start.ended && qs.get('data') === 'late-after' ? 'after' : ''), drafts: !!start.drafts,
    holding: start.holding || '', pending: !!start.pending, changed: !!start.changed, offline: !!start.offline,
    already: !!start.already, unconfirmed: !!start.unconfirmed, endedBy: null,
    mandatory: qs.get('mandatory') === '1', opened: 0, ovScroll: 0
  };
  var F;
  function load() {
    F = JSON.parse(JSON.stringify(FIX[S.fix]));
    if (S.changed) F.litters.forEach(function (l) { if (l.code === CHANGE.code) l.st[4] = 'l'; });
  }
  load();
  function post() { return POST[S.post] || []; }

  /* ---- derivations: every number on the page comes from here ---- */
  function parse(code) { return { c: code.charAt(0), n: code.length > 1 ? +code.slice(1) : null }; }
  function doses(l) {
    return DOSES.map(function (d, i) {
      var p = parse(l.st[i]), pop = d.males ? l.males : l.alive, owed = 0, ahead = 0;
      if (p.c === 'p' || p.c === 'M') owed = pop; else if (p.c === 'P' || p.c === 'O') owed = p.n == null ? pop : p.n; else if (p.c === 'N') ahead = pop;
      return { k: d.k, day: d.day, last: d.last, c: p.c, pop: pop, owed: owed, missed: p.c === 'M' ? pop : 0, ahead: ahead, done: pop - owed - ahead };
    });
  }
  // Identity at End (the snapshot) and now (live: rows written after End count).
  function identAtEnd(l) {
    if (l.id === 'done') return { done: true, have: l.alive, of: l.alive };
    if (l.id === 'due' || l.id === 'ahead') return { done: false, have: 0, of: l.alive, ahead: l.id === 'ahead' };
    var closed = l.id.indexOf('closed:') === 0, x = l.id.replace('closed:', '').split('/');
    return { done: closed || +x[0] >= +x[1], have: +x[0], of: +x[1], closed: closed };
  }
  function identNow(l) {
    // Live: identity rows since End add; deaths and moves since End change the alive it is counted against.
    var i = identAtEnd(l), add = 0, alive = liveAlive(l);
    post().forEach(function (e) { if (e.kind === 'id' && e.code === l.code) add += e.n; });
    if (i.ahead || (!i.done && !i.have && !add)) return Object.assign({}, i, { of: alive });
    var have = Math.min(i.done && !i.closed ? l.alive : i.have + add, alive);
    return { done: i.closed || have >= alive, have: have, of: alive, after: add, closed: i.closed };
  }
  function sum(xs, f) { return xs.reduce(function (a, x) { return a + f(x); }, 0); }
  function sums(l) {
    var ds = doses(l);
    return { ds: ds, done: sum(ds, function (d) { return d.done; }), owed: sum(ds, function (d) { return d.owed; }), missed: sum(ds, function (d) { return d.missed; }), ahead: sum(ds, function (d) { return d.ahead; }),
      late: ds.some(function (d) { return d.c === 'O'; }) };
  }
  function unfinished(l) { var s = sums(l); return s.owed > 0 || s.ahead > 0 || !identAtEnd(l).done; }
  // Work left: something doable now (owed, missed or identity); the rest have only doses not yet due.
  function workLeft(l) { var s = sums(l); return s.owed > 0 || !identAtEnd(l).done; }
  function totals(atEnd) {
    var t = { done: 0, owed: 0, missed: 0, ahead: 0, ontime: 0, due: 0, dueToday: 0, notDue: 0, idDone: 0, litters: F.litters.length, unf: [], work: 0, alive: 0, identified: 0, weighed: 0, weighNotDue: 0 };
    F.litters.forEach(function (l) {
      var s = sums(l); t.done += s.done; t.owed += s.owed; t.missed += s.missed; t.ahead += s.ahead; t.alive += liveAlive(l);
      // Cohort: treatments (litter × dose) recorded or past their planned day. At End a dose due today and never recorded counts as not on time.
      s.ds.forEach(function (d) {
        if ('olOM'.indexOf(d.c) >= 0 || (atEnd && 'pP'.indexOf(d.c) >= 0)) { t.due++; if (d.c === 'o') t.ontime++; }
        else if ('pP'.indexOf(d.c) >= 0) t.dueToday++; else t.notDue++;
      });
      var id = identNow(l); if (id.done) t.idDone++; t.identified += id.have;
      if (l.kg) t.weighed++; else if (l.day < WEIGH_DAY) t.weighNotDue++;
      if (unfinished(l)) { t.unf.push(l); if (workLeft(l)) t.work++; }
    });
    t.total = t.done + t.owed + t.ahead;
    t.pct = t.due ? Math.round(100 * t.ontime / t.due) : null;
    return t;
  }
  function loss() { var n = 0, c = []; F.litters.forEach(function (l) { if (l.loss) { n += l.loss; c.push(l.code); } }); return { n: n, codes: c }; }
  function blocked() {
    var why = [];
    if (F.farrowing.open) why.push({ kind: 'farrowing' });
    if (S.drafts) DRAFTS.forEach(function (d) { why.push({ kind: d.kind === 'death' ? 'draft-death' : 'draft-edit', code: d.code }); });
    return why;
  }

  /* ---- strings ---- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function sa(id, args) { return 'data-str="' + id + '"' + (args ? " data-args='" + esc(JSON.stringify(args)) + "'" : ''); }
  function S_(id, args, tone) { return '<span ' + sa(id, args) + (tone ? ' data-tone="' + tone + '"' : '') + '>' + esc(PP.t(id, args)) + '</span>'; }
  function one(base, n) { return base + (n === 1 && PP.lang === 'en' ? '.one' : '.many'); }
  function dose(k) { return PP.t('pp.common.tx.' + k); }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function date(d) { return PP.lang === 'zh' ? (d.getMonth() + 1) + '月' + d.getDate() + '日' : MONTHS[d.getMonth()] + ' ' + d.getDate(); }
  function time(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function stamp(d, who) { return { date: date(d), time: time(d), who: who }; }
  function h(o) { return UI.heading(Object.assign({ title: '', kind: 'section', level: 4 }, o)); }

  /* ---- tokens: [wordId, args, valueId?, tone?] — the word stays ink, the value carries the colour ---- */
  function T(word, args, val, tone) { return [word, args || {}, val, tone]; }
  function tokHtml(t) {
    return '<span class="pp-tok">' + S_(t[0], t[1]) + (t[2] ? ' ' + S_(t[2], t[1], t[3]) : '') + '</span>';
  }
  function dayTok(l) { return T('pp.common.unit.day', { n: l.day }); }
  function pigTok(n) { return T(one('pp.common.unit.piglet', n), { n: n }); }
  function lateTok(n) { return T('pp.end.tok.overdue', { n: n }, one('pp.end.tok.days', n), 'red'); }
  function windowTok(n) { return T('pp.end.tok.window', { n: n }, 'pp.end.tok.window.v', 'amber'); }
  function lossTok(n) { return T('pp.end.tok.loss', { n: n }, 'pp.end.tok.n', 'red'); }

  /* ---- Candidate:LitterRow (S1) ---- */
  function litterRow(l, l1, toks, opts) {
    opts = opts || {};
    var chip = l.sowDied ? ['red', 'sowdied'] : l.unlocked && !S.ended ? ['amber', 'unlocked'] : null;
    var tag = opts.static ? 'div' : 'button';
    return '<' + tag + (opts.static ? '' : ' type="button" data-action="open-litter" data-value="' + l.code + '"') + ' class="st-row pp-litter" data-ds="Candidate:LitterRow">' +
      '<span class="pp-code">' + S_('pp.room.code', { code: l.code }) + '</span>' +
      '<span class="st-row-copy"><strong>' + l1.map(tokHtml).join('') + '</strong><small class="pp-mono">' + toks.map(tokHtml).join('') + '</small></span>' +
      (chip ? '<span class="pp-chip" data-tone="' + chip[0] + '">' + S_('pp.room.chip.' + chip[1]) + '</span>' : '') +
      (opts.static ? '' : '<span class="st-row-chevron">' + I('chevron') + '</span>') + '</' + tag + '>';
  }
  function rows(html) { return UI.rowGroup(html); }

  // Overview row: what the litter owes now, then its piglet-doses done · owed · missed · not yet due; an identity gap is a token.
  function overviewRow(l) {
    var s = sums(l), owedNames = s.ds.filter(function (d) { return d.owed > 0; }).map(function (d) { return dose(d.k); });
    var l1 = owedNames.length ? [T('pp.room.l1.owes', { doses: owedNames.join(' · ') })] : s.ahead ? [T('pp.end.l1.nothing')] : [T('pp.room.l1.finished')];
    var toks = [dayTok(l), T('pp.end.tok.done', { n: s.done }, 'pp.end.tok.n')];
    if (s.owed) toks.push(T('pp.end.tok.owed', { n: s.owed }, 'pp.end.tok.n', s.late ? 'red' : ''));
    if (s.missed) toks.push(T('pp.end.tok.missed', { n: s.missed }, 'pp.end.tok.n', 'amber'));
    if (s.ahead) toks.push(T('pp.end.tok.ahead', { n: s.ahead }, 'pp.end.tok.n'));
    var id = identNow(l); if (!id.done && !id.ahead) toks.push(T('pp.end.tok.unid', { n: id.of - id.have }));
    if (l.loss) toks.push(lossTok(l.loss));
    return litterRow(l, l1, toks);
  }
  // Review and receipt row: what End leaves (or left) not done, in numbers. Doses not yet due fold into one item from two.
  function unfinishedParts(l) {
    var s = sums(l), l1 = [], toks = [dayTok(l)], late = -1, win = null, today = false;
    var ahead = s.ds.filter(function (d) { return d.ahead; });
    s.ds.forEach(function (d) {
      if (d.missed) { l1.push(T('pp.end.u.missed', { name: dose(d.k), n: d.missed })); if (win == null) win = d.last; }
      else if (d.owed) { l1.push(T('pp.end.u.owed', { name: dose(d.k), n: d.owed })); if (l.day > d.day) late = Math.max(late, l.day - d.day); else today = true; }
    });
    if (ahead.length === 1) l1.push(T('pp.end.u.ahead', { name: dose(ahead[0].k), n: ahead[0].ahead }));
    else if (ahead.length) l1.push(T('pp.end.u.ahead_many', { n: sum(ahead, function (d) { return d.ahead; }) }));
    var i = identAtEnd(l); if (!i.done) l1.push(T('pp.end.u.unid', { n: i.of - i.have }));
    if (late > 0) toks.push(lateTok(late)); else if (today) toks.push(T('pp.room.tok.due_today'));
    if (win != null) toks.push(windowTok(win));
    if (ahead.length) toks.push(T('pp.end.tok.dueday', { n: ahead[0].day }));
    return { l1: l1, toks: toks };
  }
  // Post-End facts about one litter, as tokens.
  function postToks(l, where) {
    var out = [];
    post().forEach(function (e) {
      if (e.code !== l.code) return;
      if (e.kind === 'death') out.push(T('pp.end.tok.died_after', { n: e.n }));
      if (e.kind === 'out') out.push(T('pp.end.tok.out_after', { n: e.n }));
      if (e.kind === 'late') out.push(T(one('pp.end.tok.late_mark', 1), { n: 1 }));
      if (e.kind === 'afterend') out.push(T('pp.end.tok.afterend', { name: dose(e.k), n: e.n }));
      if (where === 'face' && e.kind === 'catchup') out.push(T('pp.end.tok.catchup', { name: dose(e.k), n: e.n }));
      if (where === 'face' && e.kind === 'wrong') out.push(T('pp.end.tok.wrong', { name: dose(e.k), n: e.n }));

    }).join('');
    var body = UI.facts([
      { label: '', strs: { label: 'pp.end.w.alive', value: one('pp.common.unit.piglet', t.alive), meta: 'pp.end.w.alive.meta' }, args: { value: { n: t.alive } } },
      { label: '', strs: { label: 'pp.end.w.identified', value: 'pp.end.v.piglets_of' }, args: { value: { n: t.identified, k: t.alive } } },
      { label: '', strs: { label: 'pp.end.w.weights', value: 'pp.end.v.litters_of', meta: t.weighNotDue ? one('pp.end.w.weights.ahead', t.weighNotDue) : undefined }, args: { value: { n: t.weighed, k: t.litters }, meta: { n: t.weighNotDue, day: WEIGH_DAY } } },
      { label: '', strs: { label: 'pp.end.out.loss', value: 'pp.end.out.open', meta: ls.n ? 'pp.end.codes' : undefined }, args: { value: { n: ls.n }, meta: { list: ls.codes.join(' ') } } }
    ], { columns: 2 }) +
      '<div class="pp-block">' + h({ strs: { title: 'pp.end.w.litters', meta: one('pp.end.v.litters', t.litters) }, args: { meta: { n: t.litters } } }) + rows(perLitter) + '</div>' +
      (nd ? '<div class="pp-block">' + h({ strs: { title: 'pp.end.nd.title', meta: pd(ndTotal) }, args: { meta: { n: ndTotal } } }) + rows(nd) + '</div>' : '') +
      UI.panel(h({ strs: { title: 'pp.end.w.note' } }));
    return sheetFrame('pp.end.w.title', {}, 'pp.end.w.desc', { n: UNIT }, body, closeFooter());
  }

  /* ---- render ---- */
  var screen = document.getElementById('screen'), phone = document.getElementById('phone');
  function render() {
    var sh = S.sheet === 'overview' ? overviewSheet() : S.sheet === 'review' ? reviewSheet() : S.sheet === 'receipt' ? receiptSheet() : S.sheet === 'handoff' ? handoffSheet() : '';
    screen.innerHTML = (S.ended ? endedFace() : backdrop()) + sh;
    phone.classList.toggle('pp-locked', !!S.sheet);
    var b = screen.querySelector('.task-return'); if (b) b.setAttribute('data-str-attr', 'aria-label:act.back');
    PP.apply(screen);
    if (S.sheet === 'overview') { var body = screen.querySelector('.sheet-body'); if (body) body.scrollTop = S.ovScroll; }
  }

  /* ---- URL and history: every view is a state; the review is one history entry above the overview ---- */
  function stateName() {
    if (S.ended) return S.sheet === 'receipt' ? (S.post === 'late' ? 'receipt-late-mark' : S.post === 'afterEnd' ? 'receipt-after-end-mark' : 'receipt') : S.sheet === 'handoff' ? 'weaning-handoff' : S.post === 'correct' ? 'ended-correct' : S.post === 'moves' ? 'ended-moves' : 'ended';
    if (S.sheet === 'review') return blocked().length ? (S.drafts ? 'end-blocked-draft' : 'end-blocked') : S.offline ? 'end-offline' : S.already ? 'end-already' : S.unconfirmed ? 'end-unconfirmed' : S.changed ? 'end-changed' : S.pending ? 'end-pending' : 'end-review';
    return 'overview';
  }
  function setUrl(push, st) {
    var p = new URLSearchParams(location.search); p.set('state', stateName());
    if (!S.ended && S.fix !== (STATES[stateName()] || {}).fix) p.set('data', S.fix); else if (S.ended && S.post === 'after') p.set('data', 'late-after'); else p.delete('data');
    ['offline', 'recheck'].forEach(function (k) { p.delete(k); });
    try { history[push ? 'pushState' : 'replaceState'](st || {}, '', location.pathname + '?' + p.toString()); } catch (e) {}
  }
  function openSheet(name) {
    if (S.sheet === 'overview') { var b = screen.querySelector('.sheet-body'); if (b) S.ovScroll = b.scrollTop; }
    var from = S.sheet; S.sheet = name; S.opened = Date.now(); setUrl(true, { sheet: name, from: from }); render();
  }
  function closeSheet() {
    stopHold(); var st = history.state;
    if (st && st.sheet && !st.deep) { history.back(); return; }
    // Deep-linked: the review returns to the overview; the others to the page beneath.
    S.sheet = S.sheet === 'review' ? 'overview' : ''; S.holding = ''; S.pending = S.changed = S.offline = S.already = S.unconfirmed = false; setUrl(false); render();
  }
  window.addEventListener('popstate', function (ev) {
    stopHold(); S.holding = ''; S.pending = S.changed = S.offline = S.already = S.unconfirmed = false;
    S.sheet = (ev.state && ev.state.sheet) || (S.ended ? '' : 'overview');
    // Back after End never reopens the End flow: an overview or review entry left in history lands on the ended face.
    if (S.ended && (S.sheet === 'overview' || S.sheet === 'review')) { S.sheet = ''; setUrl(false, { ended: true }); }
    load(); render();
  });
  if (S.sheet) { try { history.replaceState({ sheet: S.sheet, deep: true }, '', location.href); } catch (e) {} }

  function lang(u) { return u + (PP.lang === 'zh' ? (u.indexOf('?') >= 0 ? '&' : '?') + 'lang=zh' : ''); }
  function litterHref(code) { return lang('litter.html?state=litter&crate=' + code + (S.ended ? '&task=ended' : '')); }

  /* ---- hold to End: 850ms; release, cancel, blur, leaving the view or Escape cancels; a tap does nothing ---- */
  var holdTimer = 0, holdEl = null;
  function caption(id) { var c = holdEl && holdEl.querySelector('small'); if (c) { c.setAttribute('data-str', id); c.textContent = PP.t(id); } }
  function startHold(el) {
    if (holdEl || S.pending) return; holdEl = el; el.setAttribute('data-holding', ''); caption('pp.end.hold.keep');
    holdTimer = setTimeout(function () { var ok = holdEl === el && el.isConnected; stopHold(); if (ok) commitEnd(); }, 850);
  }
  function stopHold() { clearTimeout(holdTimer); if (holdEl) { holdEl.removeAttribute('data-holding'); caption('pp.end.hold.caption'); } holdEl = null; }
  // End is a shared-state commit: pending while the server rechecks every litter and every phone's records.
  // Offline it is refused; a change found by the recheck is said in one line and the review is shown again.
  function commitEnd() {
    S.holding = ''; S.offline = S.changed = false;
    if (qs.get('offline') === '1' || navigator.onLine === false) { S.offline = true; setUrl(false, history.state); render(); return; }
    S.pending = true; setUrl(false, history.state); render();
    setTimeout(function () {
      S.pending = false;
      if (qs.get('recheck') === 'changed') { S.changed = true; load(); setUrl(false, history.state); render(); return; }
      // Someone else ended it first: say who and when, and open their receipt from here.
      if (qs.get('recheck') === 'already') { S.already = true; setUrl(false, history.state); render(); return; }
      // The answer never came: End may have gone through. Point at the ended face; never offer the hold again.
      if (qs.get('recheck') === 'unconfirmed') { S.unconfirmed = true; setUrl(false, history.state); render(); return; }
      if (blocked().length) { setUrl(false, history.state); render(); return; }
      finishEnded('receipt', null);
    }, 700);
  }
  // The task is ended: the review's history entry becomes the receipt; the overview's entry beneath is rewritten on the way back.
  function finishEnded(sheet, by) {
    S.ended = true; S.fix = 'late'; S.endedBy = by; S.pending = S.already = S.unconfirmed = false; load(); S.sheet = sheet;
    setUrl(false, { sheet: sheet || undefined, deep: true, ended: true }); render();
  }
  screen.addEventListener('pointerdown', function (ev) {
    var el = ev.target.closest('.pp-hold'); if (!el || ev.button !== 0) return;
    if (el.getAttribute('data-holding') === 'static') el.removeAttribute('data-holding');
    try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    startHold(el);
  });
  ['pointerup', 'pointercancel'].forEach(function (n) { screen.addEventListener(n, function () { stopHold(); }); });
  screen.addEventListener('focusout', function (ev) { if (ev.target === holdEl) stopHold(); });
  window.addEventListener('blur', stopHold);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState !== 'visible') stopHold(); });
  screen.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (holdEl) { stopHold(); return; } if (S.sheet && S.sheet !== 'overview') closeSheet(); return; }
    var el = ev.target.closest && ev.target.closest('.pp-hold');
    if (el && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); if (!ev.repeat) startHold(el); }
  });
  screen.addEventListener('keyup', function (ev) { if (ev.target.closest && ev.target.closest('.pp-hold') && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); stopHold(); } });

  screen.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]'); if (!b) return;
    var a = b.dataset.action, v = b.dataset.value;
    if (a === 'hold') return;
    if (a === 'scrim') { if (Date.now() - S.opened < 300) return; if (S.sheet === 'overview') { location.href = lang('room.html?state=room'); return; } closeSheet(); return; }
    if (a === 'close-sheet') { closeSheet(); return; }
    if (a === 'back') { location.href = S.ended ? lang('index.html') : lang('room.html?state=room'); return; }
    if (a === 'review') { openSheet('review'); return; }
    if (a === 'receipt') { openSheet('receipt'); return; }
    if (a === 'handoff') { openSheet('handoff'); return; }
    if (a === 'open-litter') { location.href = litterHref(v); return; }
    if (a === 'already-receipt') { finishEnded('receipt', ALREADY); return; }
    if (a === 'check-ended') { finishEnded('', null); return; }
    if (a === 'open-dead') { location.href = lang('dead.html?state=dead-draft&crate=' + v); return; }
    if (a === 'farrowing') { location.href = '/ux/system/farrowing-astra-concept.html'; return; }
  });

  var boot = PP.ready.then(render);
  // The one registry exception: when the registry itself failed to load there is nothing to look strings up in.
  boot.catch(function () {
    screen.innerHTML = '<p>Couldn’t load the task.</p><button type="button" onclick="location.reload()">Retry</button>';
  });
})();
</script>
</body>
