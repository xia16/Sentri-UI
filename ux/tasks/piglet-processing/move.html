<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move piglets</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="/ux/design-system/components/task-skeleton.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css. Built on the task skeleton (ADR 0003): Move is farrowing's Foster piglets page
   (TaskPage), the litter's Moves record is a TaskPage, the receipt, the arrivals' check and the pre-lock door are
   TaskSheets over it. Content inside is the design system's cards (Segment, ChoiceList, Stepper, Facts, Row, Banner). */
.mv-stack { display: flex; flex-direction: column; gap: var(--space-panel); }
.mv-stack > * { margin: 0; }
.mv-section { display: flex; flex-direction: column; gap: var(--space-heading); }
.mv-section > * { margin: 0; }
.mv-find { display: flex; align-items: center; gap: var(--space-footer-gap); }
.mv-find > .field { flex: 1; min-width: 0; margin: 0; }
/* A drawer over a page (the receipt, an arrival's check, the pre-lock door): the page below drops under the drawer's
   layers. The skeleton stacks page (z 5) over drawer (z 2–3), so the page is lifted into its own layer at z 1. */
.mv-under { position: absolute; inset: 0; z-index: 1; }
</style>
</head>
<body class="tk-stage">
<div id="screen"></div>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="/ux/design-system/components/task-skeleton.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, ICON = window.SentriIcons, U = window.PPUI, K = window.SentriTask;

  /* ---- states: a variant of the shared fixture + the view + the draft. Every figure — both litters' ledgers, what each dose
     carries, the questions to ask, the source's coverage range, before → after, why Move waits — is the ledger's
     (select.moveDraft / derive over fixtures.js). Save and the arrivals' checks commit through append. ---- */
  var STATES = {
    'move':              { view: 'move', face: 'B06' },
    'move-review':       { view: 'move', face: 'B06', other: 'B08', n: 2 },
    'move-into':         { view: 'move', face: 'B08', dir: 'in', other: 'B10', n: 1 },
    'move-ask':          { view: 'move', face: 'B09', other: 'B02', rows: ['B09-r9', 'B09-r10'] },
    'move-repeat':       { view: 'move', face: 'B08', other: 'B02', n: 1, data: 'moved-b06-b08' },
    'move-tagged':       { view: 'move', face: 'C03', other: 'C05', rows: ['C03-r4', 'C03-r7'] },
    'move-orphan':       { view: 'move', face: 'B01', other: 'D02', allRows: true },
    'move-explain':      { view: 'move', face: 'B06', other: 'B08', n: 1, explains: ['C-B06-loss', 'C-B08-gain'], data: 'explain' },
    'move-cross':        { view: 'move', face: 'B06', other: 'A03', n: 1 },
    'move-prelock':      { view: 'prelock', face: 'D01' },
    'move-receipt':      { view: 'receipt', face: 'B06', other: 'B08', n: 2 },
    'move-draft-kept':   { view: 'face', face: 'B06', other: 'B08', n: 2, kept: true },
    'move-orphan-saved': { view: 'face', face: 'B01', data: 'moved-orphan' },
    'nurse-arrived':     { view: 'face', face: 'D02', data: 'moved-orphan' },
    'owed-from-move':    { view: 'face', face: 'B08', data: 'moved-b06-b08' },
    'owed-arrived-done': { view: 'face', face: 'C05', data: 'moved-to-c05' },
    'unknown-check':     { view: 'face', face: 'B02', drawer: 'MV-0929-05:iron3', had: 1, rest: 'record', data: 'moved-unknown' },
    // scenario round 1
    'move-search':       { view: 'move', face: 'B06', query: 'A0' },                         // R1-5: other rows and other units by code
    'move-search-self':  { view: 'move', face: 'B06', query: 'B06' },                        // R1-31: this crate says why
    'move-scan':         { view: 'move', face: 'B06', scan: true },                          // R1-5: the crate card fills the search
    'move-answered':     { view: 'move', face: 'B09', other: 'B02', rows: ['B09-r9', 'B09-r10'], answers: { iron3: 'unknown' } },   // R1-18: Move says what it records
    'move-crowded':      { view: 'move', face: 'C05', other: 'B08', n: 8 },                  // R1-31: past a sane litter size
    'move-orphan-receipt': { view: 'receipt', face: 'B01', other: 'D02', allRows: true },    // round 4: the nurse sow joins the task
    'move-doubt':        { view: 'face', face: 'A07', data: 'move-doubt' },                  // R1-3: the source owes a range
    'move-young':        { view: 'face', face: 'D03', data: 'move-young' },                  // R1-4: arrivals keep their own age
    'move-emptied':      { view: 'face', face: 'C05', data: 'emptied' }                      // R1-19: a litter emptied by moves closes
  };
  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'move';
  var S = JSON.parse(JSON.stringify(STATES[name]));
  if (PP.state === 'move-prelock' && qs.get('data') === 'other') S = { view: 'move', face: 'B06', query: 'D01' };
  if (qs.get('crate') && name === 'move') S.face = qs.get('crate');
  // Opened from a suggestion on count.html (Explain): the pair it names, pre-filled — from, to, n, the missing rows and `explains`.
  if (name === 'move-explain' && qs.get('explains')) {
    S.face = qs.get('crate'); S.other = qs.get('other'); S.n = +qs.get('n') || 1; S.explains = qs.get('explains').split(',');
    S.rows = qs.get('rows') ? qs.get('rows').split(',') : []; S.dir = 'out';
  }
  // Opened from a gain line on count.html (`Move from another crate`): this litter receives, the worker picks the source;
  // the Move explains the gain only (`explains: [null, gain]`), so the source loses the piglets and this litter keeps its alive.
  // The direction stays `in` whatever the litter's state (a sow-died crate may receive: it is the only way to close its gain);
  // n is capped at the gain; a source with an open loss is flagged and may be paired (`explains: [loss, gain]`) by the worker.
  if (name === 'move' && qs.get('explains')) {
    S.explains = qs.get('explains').split(','); S.explains[0] = S.explains[0] || null; S.dir = 'in'; S.n = +qs.get('n') || 1; S.gainMode = true;
  }
  function gainOnly() { return !!S.gainMode; }
  function gainOpen() { var g = L(S.face).unexplained.gains.filter(function (x) { return x.id === S.explains[1]; })[0]; return g ? g.open : 0; }
  function openLossOf(c) { return L(c).unexplained.losses.filter(function (x) { return x.open > 0; })[0] || null; }
  S.dir = S.dir || 'out'; S.answers = S.answers || {}; S.rows = S.rows || []; S.untagged = S.untagged || 0;
  if (S.n == null) S.n = 1;
  // A kept draft (Back from the Move page to the Moves page) reopens the Move where it was.
  if (S.kept) S.fromFace = true;
  var DEFAULT = JSON.stringify({ other: '', n: 1, rows: [], untagged: 0, answers: {}, dir: 'out' });
  var store, CFG, TODAY, UNIT, resolveDrafts = {};

  /* ---- the ledger ---- */
  function L(c) { return store.derived.litters[c]; }
  function alive(c) { return L(c).alive; }
  function unitOf(c) { return L(c).room; }
  function where(c) { return unitOf(c) !== UNIT; }
  function tag(c) { return (store.sow(c) || {}).sow || ''; }
  function doseCfg(id) { return CFG.doses.filter(function (d) { return d.id === id; })[0]; }
  function txName(id) { return PP.t('pp.common.tx.' + doseCfg(id).tx); }
  function txList(ids) { return ids.map(txName).join(' · '); }
  function farrowing(c) { return !!L(c) && L(c).phase === 'open'; }
  function canSource(c) { return !!L(c) && L(c).phase === 'locked' && alive(c) > 0; }
  function canReceive(c) { return !!L(c) && L(c).phase === 'locked' && (!L(c).sowDied || (gainOnly() && c === S.face)); }
  function source() { return S.dir === 'out' ? S.face : S.other; }
  function receiver() { return S.dir === 'out' ? S.other : S.face; }
  function liveRows(c) { return L(c).identity.rows.filter(function (r) { return r.litter === c && r.status === 'alive'; }); }
  function remainder(c) { return Math.max(0, alive(c) - liveRows(c).length); }
  function hasRows(c) { return liveRows(c).length > 0; }
  function count() { return hasRows(source()) ? S.rows.length + S.untagged : S.n; }
  function draftInput() {
    return { from: source(), to: receiver(), n: count(), rows: hasRows(source()) ? S.rows.slice() : [], answers: Object.assign({}, S.answers), explains: S.explains || undefined };
  }
  var memo = { key: '', val: null };
  function draft() {
    var d = draftInput(), key = JSON.stringify(d) + store.events.length;
    if (memo.key !== key) memo = { key: key, val: store.select.moveDraft(store.derived, d, { who: window.PPFixtures.ME }) };
    return memo.val;
  }
  // Clamp on every change: roles valid, rows only from the source (the ledger clamps n).
  function normalize() {
    if (S.view !== 'move') return;
    if (gainOnly()) S.dir = 'in';                                       // explaining this litter's gain: it receives
    else {
      if (!canSource(S.face)) S.dir = 'in';                            // a sow with no piglets can only receive
      if (!canReceive(S.face) && canSource(S.face)) S.dir = 'out';      // a litter whose sow died can only send
    }
    if (S.explains && !gainOnly()) return;                              // an explaining Move is locked to its crates, direction and count
    if (S.other) {
      var bad = S.other === S.face || !L(S.other) || farrowing(S.other) || (S.dir === 'out' && !canReceive(S.other)) || (S.dir === 'in' && !canSource(S.other));
      if (bad) S.other = '';
    }
    var src = source();
    if (!src) return;
    S.n = Math.max(0, Math.min(S.n, alive(src)));
    var ids = liveRows(src).map(function (r) { return r.rowId; });
    S.rows = S.rows.filter(function (r) { return ids.indexOf(r) >= 0; });
    S.untagged = Math.max(0, Math.min(S.untagged, remainder(src)));
    if (gainOnly()) {                                                   // a Move explaining a gain carries at most the gain
      var cap = gainOpen();
      S.n = Math.min(S.n, cap); S.rows = S.rows.slice(0, cap); S.untagged = Math.min(S.untagged, cap - S.rows.length);
      var lo = openLossOf(src);
      if (S.explains[0] && (!lo || lo.id !== S.explains[0])) S.explains[0] = null;   // the pairing belongs to the source picked
    }
  }
  function draftExists() { return JSON.stringify({ other: S.other || '', n: S.n, rows: S.rows, untagged: S.untagged, answers: S.answers, dir: S.dir }) !== DEFAULT; }

  /* ---- helpers ---- */
  var pl = PP.one;
  // A skeleton text slot: the registered string, filled now and by PP.apply.
  function s(id, args) { var o = { text: PP.t(id, args), str: id }; if (args) o.args = args; return o; }
  // The skeleton's page takes no data-view; the host names its surfaces so tests and the lint can find them.
  function named(html, view) { return html.replace(/^(\s*<section class="tk-(?:page|sheet)")/, '$1 data-view="' + view + '"'); }
  function row(o) {
    var strs = { title: o.title }, args = { title: o.titleArgs };
    if (o.desc) { strs.description = o.desc; args.description = o.descArgs; }
    if (o.trail) { strs.trailing = o.trail; args.trailing = o.trailArgs; }
    return UI.row({ title: '', description: o.desc ? '' : undefined, trailing: o.trail ? '' : undefined, trail: o.glyph || 'auto', action: o.action, value: o.value, strs: strs, args: args });
  }
  function fact(label, labelArgs, value, valueArgs, meta, metaArgs) {
    var f = { label: '', value: '', strs: { label: label, value: value }, args: { label: labelArgs, value: valueArgs } };
    if (meta) { f.meta = ''; f.strs.meta = meta; f.args.meta = metaArgs; }
    return f;
  }
  // a balance figure: the number alone, as farrowing's facts print it (the labels say what is counted)
  function pigs(n) { return { id: 'ds.field.figure', args: { n: n } }; }
  function textAction(action, id, args) {
    return UI.button({ label: '', register: 'text', action: action, strs: { label: id }, args: args ? { label: args } : undefined });
  }
  // ChoiceList radios (ADR 0002): nothing is chosen until the worker chooses (never a default). opts: [{ value, id, args, meta, metaArgs }];
  // the group's title is the question (labelId + labelArgs).
  function radios(action, opts, active, labelId, labelArgs, key) {
    return UI.choiceRadios({ label: '', layout: 'rows', action: action, key: key || action, selected: active || '',
      strs: { label: labelId }, args: labelArgs ? { label: labelArgs } : undefined,
      options: opts.map(function (o) {
        return { value: o.value, label: '', meta: o.meta ? '' : undefined, strs: o.meta ? { label: o.id, meta: o.meta } : { label: o.id }, args: { label: o.args, meta: o.metaArgs } };
      }) });
  }
  function heading(id, args, action) { return UI.heading({ title: '', kind: 'section', level: 3, strs: { title: id }, args: args ? { title: args } : undefined, action: action || '' }); }
  function rowLabel(r) { return r.tag ? PP.t('pp.move.rows.tag', { tag: r.tag }) : PP.t('pp.move.rows.notch', { notch: r.notch }); }
  function litterHref(c) { return PP.href('room.html', { state: 'litter', crate: c, data: store.name !== 'base' ? store.name : '' }); }
  // The task under every surface: the room's header, inert (the Move and Moves pages cover it).
  function taskScreen() { return K.screen({ inert: true, header: K.header({ title: s('pp.common.task'), back: { action: 'home' } }), body: '' }); }

  /* ---- the Moves page: the litter's balance, what arrivals owe here, its moves (each the Edit door), and Move ---- */
  function faceDesc(c) {
    var x = L(c), inn = x.moves.filter(function (m) { return m.dir === 'in'; }), a = { code: c, tag: tag(c), day: x.dayAge };
    if (farrowing(c)) return s('pp.move.face.d_farrowing', a);
    if (x.sowDied) return [s('pp.move.face.d', a), { sep: true }, { text: PP.t('pp.move.face.died'), str: 'pp.move.face.died', tone: 'red' }];
    if (x.alive === 0) return s('pp.move.face.d_empty', a);
    // a nurse sow that joined the task with these piglets (round 4): her piglets keep the age of the crate they came from
    if (x.nurse && L(x.nurse.from)) return s('pp.move.face.d_nurse', { code: c, tag: tag(c), day: x.dayAge, from: x.nurse.from });
    if (x.weaned && inn.length) return s('pp.move.face.d_nurse', { code: c, tag: tag(c), day: L(inn[0].other).dayAge, from: inn[0].other });
    return s('pp.move.face.d', a);
  }
  // The ledger's balance (R1-10, select.balance): every term that is not zero, so born + in − out − dead − weaned ± open = alive
  // reads off the card; a nurse sow's earlier litter is its own line, never mixed in (round 4).
  function ledgerFacts(c) {
    var x = L(c), B = store.select.balance(store.derived, c), items = [];
    if (x.phase === 'locked' && (B.born || !x.nurse)) items.push(fact('label.born', null, pigs(B.born).id, pigs(B.born).args));
    if (B.movedIn) items.push(fact('pp.move.label.moved_in', null, pigs(B.movedIn).id, pigs(B.movedIn).args));
    if (B.movedOut) items.push(fact('pp.move.label.moved_out', null, pigs(B.movedOut).id, pigs(B.movedOut).args));
    if (B.dead || !x.nurse) items.push(fact('label.dead', null, pigs(B.dead).id, pigs(B.dead).args));
    if (B.weaned) items.push(fact('pp.move.label.weaned', null, pigs(B.weaned).id, pigs(B.weaned).args));
    if (B.loss) items.push(fact('pp.move.label.loss', null, pigs(B.loss).id, pigs(B.loss).args, 'pp.move.fact.open'));
    if (B.gain) items.push(fact('pp.move.label.gain', null, pigs(B.gain).id, pigs(B.gain).args, 'pp.move.fact.open'));
    items.push(fact('label.alive', null, pigs(B.alive).id, pigs(B.alive).args));
    var out = UI.facts(items, { columns: items.length === 3 || items.length > 4 ? 3 : 2 });
    if (B.earlier) out += UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.move.face.earlier' },
      args: { title: { born: B.earlier.born, dead: B.earlier.dead, weaned: B.earlier.weaned, day: B.earlier.dayAge } } });
    return out;
  }
  // After a Don't-know move out, what this litter owes is a range (R1-3): `lo–hi of alive`, never a one-tap number; the row
  // goes to the litter, where the worker counts on the pig.
  function doubtRows(c) {
    var x = L(c), rows = [];
    CFG.doses.forEach(function (d) {
      var D = x.doses[d.id];
      if (!D || !D.range) return;
      rows.push(row({ action: 'record', value: d.id, title: 'pp.common.tx.' + d.tx, desc: 'pp.move.range.row',
        descArgs: { lo: D.owedLo, hi: D.owed, of: x.alive, moves: D.doubt.map(function (g) { return PP.t('pp.move.range.move', { n: g.n, to: g.to }); }).join(' · ') } }));
    });
    return rows.length ? UI.rowGroup(rows.join(''), { title: '', strs: { title: 'pp.move.range.title' } }) : '';
  }
  // One age group of arrivals that owe (R1-4): where they came from, their own day-age and when the dose is theirs.
  function groupText(g) {
    var when = g.status === 'later' ? PP.t(pl('pp.move.frag.when.later', g.inDays), { n: g.inDays }) : g.status === 'late' ? PP.t(pl('pp.move.frag.when.late', g.lateBy), { n: g.lateBy })
      : g.status === 'missed' ? PP.t('pp.move.frag.when.missed') : PP.t('pp.move.frag.when.due');
    if (g.kind === 'own') return PP.t('pp.move.frag.own', { k: g.n, day: g.dayAge, when: when });
    return PP.t('pp.move.frag.group', { k: g.n, code: g.from, day: g.dayAge, when: when });
  }
  // One row per Move, newest first; each is the Edit door for that record (who and when are on the record, one level down).
  function movesGroup(c) {
    var ms = L(c).moves.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    if (!ms.length) return '';
    return UI.rowGroup(ms.map(function (m) {
      var inn = m.dir === 'in', t = where(m.other) ? (inn ? 'pp.move.moves.in_unit' : 'pp.move.moves.out_unit') : (inn ? 'pp.move.moves.in' : 'pp.move.moves.out');
      var ex = m.explains && (m.explains[0] || m.explains[1]);
      return row({ action: 'edit-move', value: m.id, title: pl(t, m.n), titleArgs: { n: m.n, code: m.other, u: unitOf(m.other) }, desc: ex ? 'pp.move.moves.explained' : '', glyph: 'edit' });
    }).join(''));   // the page is the litter's Moves: the list needs no title of its own
  }
  // What the arrivals owe here, one row per dose: the headline is what is owed, the meta line where it came from.
  function arrivalRows(c) {
    var x = L(c), ins = x.moves.filter(function (m) { return m.dir === 'in'; });
    if (!ins.length) return '';
    var rows = [];
    CFG.doses.forEach(function (d) {
      var D = x.doses[d.id];
      var arrivals = (D.groups || []).filter(function (g) { return g.kind === 'arrival'; });
      // a dose not yet due for anyone here is left for later; one due for this litter shows when arrivals owe it on their own day (R1-4)
      if (D.status == null || (D.status === 'later' && (!arrivals.length || x.dayAge < d.due))) return;
      var arrOwed = (D.owedFrom.filter(function (f) { return f.kind === 'arrival'; })[0] || {}).n || 0;
      var owedSrc = ins.filter(function (m) { return m.packets[d.id] === 'owed'; });
      var groups = D.unknownGroups.filter(function (g) { return g.kind === 'move'; });
      if (!arrOwed && !groups.length && !D.carriedFromMove && !owedSrc.length && !arrivals.length) return;
      var parts = [];
      if (d.castration && owedSrc.length) owedSrc.forEach(function (m) { parts.push(PP.t('pp.move.frag.males', { k: m.n, code: m.other })); });
      else if (D.owed) {
        // The ledger's owed, and which arrivals owe it: their crate and their own age (R1-4, R1-18)
        parts.push(PP.t('pp.move.frag.owed', { n: D.owed }));
        if (arrivals.length) D.groups.forEach(function (g) { parts.push(groupText(g)); });
        else owedSrc.forEach(function (m) { parts.push(PP.t('pp.move.frag.from', { k: m.n, code: m.other })); });
      }
      if (D.carriedFromMove) parts.push(PP.t('pp.move.frag.arrived_done', { k: D.carriedFromMove }));
      groups.forEach(function (g) { parts.push(d.visible ? PP.t('pp.move.frag.check', { k: g.n, code: g.from }) : PP.t('pp.move.frag.unknown', { k: g.n })); });
      if (!parts.length) return;
      var g0 = groups[0];
      // a litter with no task (a nurse sow from a previous batch) records no treatments (RULINGS round 2, Q18): not done
      if (!x.inTask) { parts.push(PP.t('pp.edge.notask.why')); rows.push(row({ title: 'pp.common.tx.' + d.tx, desc: 'pp.move.owed.line', descArgs: { text: parts.join(' · ') } })); return; }
      rows.push(row({ action: g0 ? 'open-resolve' : D.owed ? 'record' : 'open-dose', value: g0 ? g0.id + ':' + d.id : d.id,
        title: 'pp.common.tx.' + d.tx, desc: 'pp.move.owed.line', descArgs: { text: parts.join(' · ') } }));
    });
    if (!rows.length) return '';
    return UI.rowGroup(rows.join(''), { title: '', strs: { title: 'pp.move.owed.title' } });
  }
  function facePage(c) {
    var body = ledgerFacts(c) + doubtRows(c) + arrivalRows(c) + movesGroup(c);
    var canMove = canSource(c) || canReceive(c);
    // Move is the page's one act; a kept draft says so on the button (Back from the Move page keeps it).
    var primary = canMove ? { label: S.kept ? s('pp.move.act.resume', { n: 1 }) : s('pp.move.sheet.title'), action: 'open-move', value: c } : null;
    return named(K.page({ title: s('pp.move.moves.title'), description: faceDesc(c), body: '<div class="mv-stack">' + body + '</div>',
      footer: K.footer({ back: { action: 'back' }, primary: primary }) }), 'face');
  }

  /* ---- the Move page (farrowing's Foster piglets): direction, the other crate, the count, the questions, before → after ---- */
  // The picker's word for a crate, truthful (R1-31): outside every task, a missed dose, nothing due yet — never "all done" for those.
  function crateState(c) {
    if (L(c).sowDied) return 'died';
    var f = store.select.room(store.derived, { room: unitOf(c), lens: 'all' }).rows.filter(function (r) { return r.litter === c; })[0];
    if (!f || f.kind === 'none') return 'notask';
    if (f.kind === 'owes') return f.lateBy ? 'late' : f.partly ? 'part' : 'due';
    if (f.kind === 'missed') return 'missed';
    if (f.kind === 'next') return 'next';
    return 'done';
  }
  function crateMeta(c) {

      body: '<div class="mv-stack">' + body + '</div>', footer: K.footer({ back: { action: 'close-resolve' }, primary: save }) });
  }

  /* ---- move-prelock: the door to the farrowing sheet ---- */
  function prelockDrawer() {
    var x = L(S.face);
    var door = UI.rowGroup(row({ action: 'open-farrowing', value: S.face, title: 'pp.move.pre.door', titleArgs: { code: S.face },
      desc: 'pp.move.pre.door_meta', descArgs: { n: x.born } }));   // who and when are on the farrowing sheet
    return K.drawer({ view: 'prelock', size: 'short', title: s('pp.move.sheet.title'), subtitle: s('pp.move.pre.why', { code: S.face }),
      body: door, footer: K.footer({ back: { action: 'back' } }) });
  }

  function render() {
    normalize();
    var over = '', under;
    if (S.view === 'move') under = movePage();
    else {
      over = S.view === 'receipt' ? receiptDrawer(S.saved) : S.view === 'prelock' ? prelockDrawer() : S.view === 'face' && S.drawer ? resolveDrawer() : '';
      under = over ? '<div class="mv-under" inert>' + facePage(S.face) + '</div>' : facePage(S.face);
    }
    document.getElementById('screen').innerHTML = K.phone(taskScreen() + under + over, { label: s('pp.common.task') });
    PP.apply(document.getElementById('screen'));
  }
  // Save: the one record goes through append; the receipt reads it back. The draft resets (moved identity rows have left the source).
  function post() {
    var dr = draft();
    if (!dr.event) return false;
    var before = { from: source(), to: receiver(), delta: dr.delta, sourceAfter: dr.sourceAfter };
    var r = store.commit(dr.event);
    if (!r.ok) return false;
    S.saved = Object.assign({ id: r.event.id }, before);
    S = Object.assign(JSON.parse(DEFAULT), { view: 'receipt', face: S.face, saved: S.saved, kept: false });
    return true;
  }
  function waiting(b) { return b.getAttribute('aria-disabled') === 'true' && (UI.guard(b), true); }

  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action, v = b.dataset.value;
    if (a === 'pick-row' || a === 'pair-loss') v = b.value;  // a multi row's checkbox carries its id as value
    if (a === 'pick-crate') {
      S.other = v; S.query = ''; S.scanned = ''; S.rows = []; S.untagged = 0; S.answers = {};
      // explaining a gain from a tagged source: the stray starts as untagged (a tag, if it has one, is picked instead)
      if (gainOnly() && S.dir === 'in' && hasRows(v)) S.untagged = Math.min(S.n, remainder(v));
      render();
    }
    else if (a === 'change-crate') { if (S.explains && !gainOnly()) return; S.other = ''; S.rows = []; S.untagged = 0; S.answers = {}; render(); }
    else if (a === 'dir') { if (S.dir !== v) { S.dir = v; S.rows = []; S.untagged = 0; S.answers = {}; } render(); }
    else if (a === 'step') {
      if (b.getAttribute('aria-disabled') === 'true') return;
      var k = b.dataset.value, st = +b.dataset.step;
      if (k === 'n' && (!S.explains || gainOnly())) S.n += st; else if (k === 'untagged') S.untagged += st; else if (k === 'had') S.had = (S.had || 0) + st;
      render();
    }
    else if (a === 'all') { S.n = +v; render(); }
    else if (a === 'all-rows') { S.rows = liveRows(source()).map(function (r) { return r.rowId; }); S.untagged = remainder(source()); render(); }
    else if (a === 'scan') { var code = scanCode(); S.query = code; S.scanned = code; render(); }   // the crate card's code fills the search (R1-5)
    else if (a === 'pick-row') { var i = S.rows.indexOf(v); if (i >= 0) S.rows.splice(i, 1); else S.rows.push(v); render(); }
    else if (a === 'pair-loss') { S.explains[0] = S.explains[0] === v ? null : v; render(); }   // the worker pairs; the app never does
    else if (a === 'answer') { var p = v.split(':'); S.answers[p[0]] = p[1]; render(); }
    // Back from the Move page: to the Moves page it was opened from (the draft kept there), else to the litter it came from.
    else if (a === 'back' && S.view === 'move') {
      if (S.fromFace) { S.view = 'face'; S.kept = draftExists(); render(); }
      else location.href = litterHref(S.face);
    }
    else if ((a === 'back' || a === 'dismiss') && S.view === 'receipt') { S.view = 'face'; render(); }
    else if (a === 'back' || a === 'dismiss') { location.href = litterHref(S.face); }
    else if (a === 'open-move') { S.view = 'move'; S.fromFace = true; S.kept = false; render(); }
    else if (a === 'save-move') { if (waiting(b)) return; post(); render(); }
    else if (a === 'open-resolve') { S.drawer = v; var kept = resolveDrafts[v]; S.had = kept ? kept.had : 0; S.rest = kept ? kept.rest : ''; render(); }
    else if (a === 'rest') { S.rest = v; render(); }
    else if (a === 'close-resolve') { resolveDrafts[S.drawer] = { had: S.had || 0, rest: S.rest }; S.drawer = ''; render(); }
    else if (a === 'save-resolve') {
      if (waiting(b)) return;
      var res = store.commitAll(resolveEvents());
      if (!res.ok) { document.documentElement.setAttribute('data-door', 'refused:' + res.reason); return; }
      delete resolveDrafts[S.drawer]; S.drawer = ''; render();
    }
    else if (a === 'record' || a === 'open-dose') { location.href = litterHref(S.face); }
    // Edit (ticket #12) corrects a Move by id: its crate or count, one stamped correction that re-routes both legs.
    else if (a === 'edit-move') { var mvs = L(S.face).moves; location.href = PP.href('edit.html', { state: 'edit', crate: S.face, move: v || (mvs[mvs.length - 1] || {}).id, from: 'move', data: store.name }); }
    else document.documentElement.setAttribute('data-door', a + ':' + (v || ''));
  });
  // Find a crate (R1-5): typing filters the list in place (the field keeps focus); Enter picks the one crate that can take part.
  document.getElementById('screen').addEventListener('input', function (ev) {
    if (ev.target.dataset.role !== 'crate-q') return;
    S.query = ev.target.value; S.scanned = '';
    var r = document.getElementById('mv-results'); if (r) { r.innerHTML = crateLists(); PP.apply(r); }
  });
  document.getElementById('screen').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || ev.target.dataset.role !== 'crate-q') return;
    ev.preventDefault();
    var picks = document.querySelectorAll('#mv-results [data-action="pick-crate"]');
    if (picks.length === 1) picks[0].click(); else ev.target.blur();
  });
  PP.ready.then(function () {
    store = PP.open(S.data || 'base', STATES[name].view === 'receipt' ? { session: false } : null);
    CFG = store.config; TODAY = store.today; UNIT = L(S.face).room;
    if (S.allRows) S.rows = liveRows(S.face).map(function (r) { return r.rowId; });
    // A count on a source with tagged piglets is the untagged ones (the rest are picked by their tags).
    if (S.other && hasRows(source()) && !S.rows.length && S.n) S.untagged = Math.min(S.n, remainder(source()));
    if (qs.get('q') && S.view === 'move') S.query = qs.get('q');
    if (S.scan && S.view === 'move') { S.query = scanCode(); S.scanned = S.query; }
    if (S.view === 'receipt') { S.view = 'move'; normalize(); post(); }
    render();
  });
})();
</script>
</body>
