<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move piglets</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<style>
/* Layout only, tokens from tokens.css; one Candidate composition (Candidate:Radio, below). */
.mv-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.mv-phone .scrim { inset: 0; }
.mv-title { flex: 1; min-width: 0; }
.mv-head { display: flex; align-items: flex-start; gap: var(--space-footer-gap); }
.mv-head > .st-text-action { min-width: var(--touch-min); justify-content: flex-end; }   /* the text action's hit area is 44px tall only; widen it to 44 */
.mv-body { display: flex; flex-direction: column; gap: var(--space-section); padding-bottom: var(--space-panel); }
.mv-body > * { margin: 0; }
.mv-face { display: flex; flex-direction: column; gap: var(--space-section); }
.mv-face > * { margin: 0; }
.mv-group { display: flex; flex-direction: column; gap: var(--space-heading); }
.mv-group > * { margin: 0; }
.mv-find { display: flex; align-items: center; gap: var(--space-footer-gap); }
.mv-find > .field { flex: 1; min-width: 0; margin: 0; }
.mv-summary { flex: none; display: flex; flex-direction: column; gap: var(--space-row-y); padding: var(--space-row-y) var(--space-gutter); }
.mv-summary > * { margin: 0; }
.mv-phone .sheet[data-st-context="drawer"] > .sheet-body { flex: 1; }
.sheet-footer > .button { flex: 1; }
.sheet-footer > .button.secondary:not(:only-child) { flex: none; }
@media (max-width: 370px) { .mv-summary { padding-left: var(--space-gutter-narrow); padding-right: var(--space-gutter-narrow); } }

/* Candidate:Radio — single-select rows with a visible radio (RULINGS craft pass: 2px rings; selected = ink ring + 10px ink dot;
   the whole row is the target; the selected label is heavier). ChoiceList geometry; a design-system batch will make the card. */
.mv-radios { margin: 0; background: var(--inset); border: 1px solid var(--line); border-radius: var(--radius-inset); overflow: hidden; }
.mv-radio { display: flex; align-items: center; gap: var(--space-footer-gap); width: 100%; min-height: var(--choice-row-min); margin: 0; padding: var(--space-row-y) var(--space-panel); border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.mv-radio + .mv-radio { border-top: 1px solid var(--rule); }
.mv-radio:active { background: var(--choice-press); }
.mv-radio:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.mv-radio-mark { flex: none; width: 22px; height: 22px; box-sizing: border-box; border: 2px solid var(--muted); border-radius: 50%; }
.mv-radio[aria-checked="true"] .mv-radio-mark { border-color: var(--ink); background: var(--ink); box-shadow: inset 0 0 0 4px var(--inset); }
.mv-radio-copy { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
.mv-radio-label { font-size: var(--type-choice-label-size); font-weight: 500; line-height: 1.4; }
.mv-radio[aria-checked="true"] .mv-radio-label { font-weight: 600; }
.mv-radio-meta { font-size: var(--type-choice-meta-size); line-height: 1.4; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .mv-radio { transition: none; } }
</style>
</head>
<body>
<main class="inspection-phone mv-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  var UI = window.SentriUI, ICON = window.SentriIcons;
  var zh = PP.lang === 'zh';
  var TODAY = zh ? '9月29日' : 'Sep 29', WHO = 'G.H', UNIT = 7;

  /* ---- schedule (farm config stand-in) ----
     Each scheduled dose is its own obligation, due at a day-age. castrate is counted against males (Q16).
     teeth has a console "last age-day" of 7: past it an undone piglet is missed, not owed (Q15). */
  var TX = ['teeth', 'tail', 'iron', 'coccidiosis', 'castrate'];
  var DUE = { teeth: 1, tail: 1, iron: 3, coccidiosis: 3, castrate: 5 };
  var LAST = { teeth: 7 };
  var INVISIBLE = { iron: 1, coccidiosis: 1, health: 1 };

  /* ---- fixtures: Unit 7 (rows B, C, D) and one crate in Unit 8; Sep 29 ----
     Alive is never stored: alive() derives it from the ledger, so every face balances.
     done[d] = alive own piglets recorded for dose d; deferred[d] = piglets skipped for a passing reason (still owed). */
  function base() {
    return {
      B01: { unit: 7, tag: '000226', day: 8, born: 10, dead: 3, males: 3, died: true, done: { teeth: 0, tail: 7, iron: 7, coccidiosis: 7, castrate: 0 } },
      B02: { unit: 7, tag: '000241', day: 4, born: 9, dead: 1, males: 4, done: { teeth: 8, tail: 8, iron: 8, coccidiosis: 8 } },
      B04: { unit: 7, tag: '000254', day: 4, born: 10, dead: 1, males: 5, done: { teeth: 9, tail: 9, iron: 9, coccidiosis: 9 } },
      B06: { unit: 7, tag: '000261', day: 3, born: 13, dead: 1, males: 6, done: { teeth: 0, tail: 0, iron: 0, coccidiosis: 0 } },
      B08: { unit: 7, tag: '000270', day: 0, farrowing: true, live: 6, dead: 1, sofar: 7, ago: 2, by: 'L.M' },
      B09: { unit: 7, tag: '000247', day: 4, born: 11, dead: 1, males: 5, done: { teeth: 10, tail: 7, iron: 8, coccidiosis: 10 },
             deferred: { iron: { n: 2, reason: 'weak' }, tail: { n: 3, reason: 'weak' } } },
      B10: { unit: 7, tag: '000265', day: 3, born: 12, dead: 1, males: 6, done: { teeth: 0, tail: 0, iron: 0, coccidiosis: 0 } },
      C01: { unit: 7, tag: '000283', day: 5, born: 13, dead: 1, males: 6, done: { teeth: 12, tail: 12, iron: 12, coccidiosis: 12, castrate: 0 } },
      C03: { unit: 7, tag: '000288', day: 4, born: 11, dead: 1, males: 5, done: { teeth: 10, tail: 10, iron: 10, coccidiosis: 10 },
             ids: ['000301', '000302', '000303', '000304', '000305', '000306', '000307', '000308', 'n:12-9'] },
      C05: { unit: 7, tag: '000292', day: 4, born: 9, dead: 1, males: 4, done: { teeth: 0, tail: 0, iron: 0, coccidiosis: 0 } },
      D02: { unit: 7, tag: '000233', day: 26, born: 12, dead: 1, weaned: 11, done: {} },
      A03: { unit: 8, tag: '000318', day: 4, born: 11, dead: 1, males: 5, done: { teeth: 10, tail: 10, iron: 10, coccidiosis: 10 } }
    };
  }
  var LIT = base();
  var MOVES = [];                                     // posted Move records: { id, from, to, n, rows, answers, explains, time, who }

  function inOut(code) {
    var o = { out: 0, inn: 0, outMoves: [], inMoves: [] };
    MOVES.forEach(function (m) {
      if (m.from === code) { o.out += m.n; o.outMoves.push(m); }
      if (m.to === code) { o.inn += m.n; o.inMoves.push(m); }
    });
    return o;
  }
  // An explaining Move relabels an open loss/gain as moved out/in: the loss and gain it closes leave the ledger.
  function closed(code, side) {
    return MOVES.reduce(function (s, m) { return s + (m.explains && ((side === 'loss' && m.from === code) || (side === 'gain' && m.to === code)) ? m.n : 0); }, 0);
  }
  function ledger(code) {
    var l = LIT[code], io = inOut(code);
    if (l.farrowing) return { alive: l.live, dead: l.dead };
    var loss = (l.loss || 0) - closed(code, 'loss'), gain = (l.gain || 0) - closed(code, 'gain');
    var alive = l.born - l.dead - (l.weaned || 0) - loss + gain - io.out + io.inn;
    return { born: l.born, dead: l.dead, weaned: l.weaned || 0, loss: loss, gain: gain, out: io.out, inn: io.inn, alive: alive, io: io };
  }
  function alive(code) { return ledger(code).alive; }
  function dueDoses(day) { return TX.filter(function (d) { return DUE[d] <= day; }); }
  function pop(code, d) { return d === 'castrate' ? (LIT[code].males || 0) : alive(code); }
  function status(code) {
    var l = LIT[code];
    if (l.died) return 'died';
    var ds = dueDoses(l.day), a = alive(code);
    if (!ds.length) return 'due';
    var full = ds.every(function (d) { return (l.done[d] || 0) >= pop(code, d); });
    var none = ds.every(function (d) { return !(l.done[d] || 0); });
    return full ? 'done' : none ? 'due' : 'part';
  }

  /* ---- the draft and the one resolved record ---- */
  var STATES = {
    'move':              { view: 'move', face: 'B06' },
    'move-review':       { view: 'move', face: 'B06', other: 'B04', n: 2 },
    'move-into':         { view: 'move', face: 'B04', dir: 'in', other: 'B10', n: 1 },
    'move-ask':          { view: 'move', face: 'B09', other: 'B02', n: 2 },
    'move-repeat':       { view: 'move', face: 'B04', other: 'B02', n: 1, prior: [{ id: 'MV-0929-01', from: 'B06', to: 'B04', n: 2, time: '09:42' }] },
    'move-tagged':       { view: 'move', face: 'C03', other: 'C05', rows: ['000304', '000307'], n: 0 },
    'move-orphan':       { view: 'move', face: 'B01', other: 'D02', n: 7 },
    'move-explain':      { view: 'move', face: 'B06', other: 'B04', n: 1, explains: ['UL-B06-0929-1', 'UG-B04-0929-1'], fx: { B06: { loss: 1 }, B04: { gain: 1 } } },
    'move-cross':        { view: 'move', face: 'B06', other: 'A03', n: 1 },
    'move-prelock':      { view: 'prelock', face: 'B08' },
    'move-receipt':      { view: 'receipt', face: 'B06', other: 'B04', n: 2, time: '09:42' },
    'move-draft-kept':   { view: 'face', face: 'B06', other: 'B04', n: 2, kept: true },
    'move-orphan-saved': { view: 'face', face: 'B01', prior: [{ id: 'MV-0929-04', from: 'B01', to: 'D02', n: 7, time: '11:05' }] },
    'nurse-arrived':     { view: 'face', face: 'D02', prior: [{ id: 'MV-0929-04', from: 'B01', to: 'D02', n: 7, time: '11:05' }] },
    'owed-from-move':    { view: 'face', face: 'B04', prior: [{ id: 'MV-0929-01', from: 'B06', to: 'B04', n: 2, time: '09:42' }] },
    'owed-arrived-done': { view: 'face', face: 'C05', prior: [{ id: 'MV-0929-02', from: 'C03', to: 'C05', n: 2, rows: ['000304', '000307'], time: '09:10' },
                                                              { id: 'MV-0929-03', from: 'B06', to: 'C05', n: 1, time: '10:20' }] },
    'unknown-check':     { view: 'face', face: 'B02', drawer: 'MV-0929-05:iron', had: 1, rest: 'record',
                           prior: [{ id: 'MV-0929-05', from: 'B09', to: 'B02', n: 2, answers: { iron: 'unknown' }, time: '10:05' }] }
  };
  var name = STATES[PP.state] ? PP.state : 'move';
  var S = JSON.parse(JSON.stringify(STATES[name]));
  if (PP.state === 'move-prelock' && new URLSearchParams(location.search).get('data') === 'other') S = { view: 'move', face: 'B06', query: 'B08' };
  S.dir = S.dir || 'out'; S.answers = S.answers || {}; S.rows = S.rows || []; S.untagged = S.untagged || 0;
  if (S.n == null) S.n = 1;
  if (S.fx) Object.keys(S.fx).forEach(function (c) { Object.assign(LIT[c], S.fx[c]); });
  // prior moves: each is posted with the answers and carry it resolved to at its own time, against the fixtures as they stood
  (S.prior || []).forEach(function (m) { m.carry = carry(m); m.who = WHO; MOVES.push(m); });
  var RECEIPT_AT_LOAD = S.view === 'receipt';
  var DEFAULT = JSON.stringify({ other: '', n: 1, rows: [], untagged: 0, answers: {}, dir: 'out' });

  function source() { return S.dir === 'out' ? S.face : S.other; }
  function receiver() { return S.dir === 'out' ? S.other : S.face; }
  function sourceIds(code) { return code && LIT[code].ids ? LIT[code].ids : null; }
  function remainder(code) { var ids = sourceIds(code); return ids ? Math.max(0, alive(code) - ids.length) : 0; }
  function count() { return sourceIds(source()) ? S.rows.length + S.untagged : S.n; }
  function canSource(c) { var l = LIT[c]; return !!l && !l.farrowing && alive(c) > 0; }
  function canReceive(c) { var l = LIT[c]; return !!l && !l.farrowing && !l.died; }
  // Clamp on every change: roles valid, n within the source's alive, rows only from the source.
  function normalize() {
    if (S.view !== 'move') return;
    if (!canSource(S.face)) S.dir = 'in';                              // a sow with no piglets can only receive
    if (S.other) {
      var bad = S.other === S.face || !LIT[S.other] || LIT[S.other].farrowing ||
        (S.dir === 'out' && !canReceive(S.other)) || (S.dir === 'in' && !canSource(S.other));
      if (bad) S.other = '';
    }
    var src = source();
    if (!src) return;
    var max = alive(src);
    S.n = Math.max(0, Math.min(S.n, max));
    var ids = sourceIds(src) || [];
    S.rows = S.rows.filter(function (r) { return ids.indexOf(r) >= 0; });
    S.untagged = Math.max(0, Math.min(S.untagged, remainder(src)));
  }
  function draftExists() { return JSON.stringify({ other: S.other || '', n: S.n, rows: S.rows, untagged: S.untagged, answers: S.answers, dir: S.dir }) !== DEFAULT; }
  function record() {
    return { id: S.id || 'MV-0929-06', from: source(), to: receiver(), n: count(), rows: S.rows.slice(), untagged: S.untagged,
             answers: JSON.parse(JSON.stringify(S.answers)), explains: S.explains || null, time: S.time || '11:30', who: WHO };
  }

  /* What the moved piglets owe, per dose, from the source's state (RULINGS round 2, Q14–Q16). One function for review, receipt and faces.
     all done → done · none done → owe (a lapsed window → missed; a deferral's reason travels) ·
     part done → invisible: the answer (yes · no · unknown); visible: check on the pig. */
  function knownOwing(code, d) {
    return inOut(code).inMoves.reduce(function (s, m) { return s + (m.carry && m.carry[d] && m.carry[d].kind === 'owe' ? m.n : 0); }, 0);
  }
  function answerFor(rec, d) {
    if (rec.answers && rec.answers[d]) return rec.answers[d];
    return knownOwing(rec.from, d) ? 'no' : 'unknown';
  }
  function carry(rec) {
    var s = LIT[rec.from], out = {};
    dueDoses(s.day).forEach(function (d) {
      var p = pop(rec.from, d), v = s.done[d] || 0, kind;
      var lapsed = LAST[d] && s.day > LAST[d];
      if (p === 0) return;
      if (v >= p) kind = 'done';
      else if (v === 0) kind = lapsed ? 'missed' : 'owe';
      else if (INVISIBLE[d]) { var a = answerFor(rec, d); kind = a === 'yes' ? 'done' : a === 'no' ? 'owe' : 'unknown'; }
      else kind = lapsed ? 'missed' : 'check';
      out[d] = { kind: kind, reason: kind === 'owe' && s.deferred && s.deferred[d] ? s.deferred[d].reason : '' };
    });
    return out;
  }
  // The source's coverage after the Move: a Yes debits n; Don't know / check leave a range, never a false "all done".
  function sourceAfter(rec, c) {
    var s = LIT[rec.from], after = alive(rec.from) - rec.n, out = [];
    Object.keys(c).forEach(function (d) {
      if (d === 'castrate') return;
      var v = s.done[d] || 0;
      if (c[d].kind === 'unknown' || c[d].kind === 'check') out.push({ d: d, lo: Math.max(0, v - rec.n), hi: Math.min(v, after), of: after });
    });
    return out;
  }

  /* ---- helpers ---- */
  function span(id, args, cls) {
    return '<span' + (cls ? ' class="' + cls + '"' : '') + ' data-str="' + id + '"' +
      (args ? " data-args='" + JSON.stringify(args).replace(/'/g, '&#39;') + "'" : '') + '></span>';
  }
  function pl(base, n) { return base + (n === 1 && !zh ? '.one' : '.many'); }
  function txName(d) { return PP.t('pp.common.tx.' + d); }
  function txList(list) { return list.map(txName).join(' · '); }
  function where(code) { return LIT[code].unit !== UNIT; }
  function row(o) {
    var strs = { title: o.title }, args = { title: o.titleArgs };
    if (o.desc) { strs.description = o.desc; args.description = o.descArgs; }
    if (o.trail) { strs.trailing = o.trail; args.trailing = o.trailArgs; }
    return UI.row({ title: '', description: o.desc ? '' : undefined, trailing: o.trail ? '' : undefined, action: o.action, value: o.value, strs: strs, args: args });
  }
  function fact(label, labelArgs, value, valueArgs, meta, metaArgs) {
    var f = { label: '', value: '', strs: { label: label, value: value }, args: { label: labelArgs, value: valueArgs } };
    if (meta) { f.meta = ''; f.strs.meta = meta; f.args.meta = metaArgs; }
    return f;
  }
  function pigs(n) { return { id: pl('pp.common.unit.piglet', n), args: { n: n } }; }
  function button(cls, action, id, args, disabled) {
    return '<button type="button" class="button ' + cls + '" data-ds="Button" data-action="' + action + '" data-str="' + id + '"' +
      (args ? " data-args='" + JSON.stringify(args).replace(/'/g, '&#39;') + "'" : '') + (disabled ? ' disabled' : '') + '></button>';
  }
  function textAction(action, id, args) {
    return '<button type="button" class="st-text-action" data-ds="Button" data-action="' + action + '" data-str="' + id + '"' +
      (args ? " data-args='" + JSON.stringify(args).replace(/'/g, '&#39;') + "'" : '') + '></button>';
  }
  // Candidate:Radio. opts: [{ value, id, args, meta, metaArgs }]
  function radios(action, opts, active, label) {
    return '<div class="mv-radios" data-ds="Candidate:Radio" role="radiogroup" aria-label="' + label.replace(/"/g, '&quot;') + '">' + opts.map(function (o) {
      var on = o.value === active;
      return '<button type="button" class="mv-radio" role="radio" aria-checked="' + on + '" data-action="' + action + '" data-value="' + o.value + '">' +
        '<span class="mv-radio-mark" aria-hidden="true"></span><span class="mv-radio-copy">' + span(o.id, o.args, 'mv-radio-label') +
        (o.meta ? span(o.meta, o.metaArgs, 'mv-radio-meta') : '') + '</span></button>';
    }).join('') + '</div>';
  }
  function stamp(t) { return TODAY + ' · ' + t + ' · ' + WHO; }

  /* ---- the litter face (a stand-in for the litter sheet: header, ledger, what arrivals owe, moves, the Move door) ---- */
  function header(code) {
    var l = LIT[code], sub;
    if (l.farrowing) sub = span('pp.move.face.sub_farrowing', { u: l.unit });
    else if (l.died) sub = span('pp.move.face.sub_died', { u: l.unit, day: l.day });
    else if (alive(code) === 0) sub = span('pp.move.face.sub_empty', { u: l.unit });
    else if (l.weaned && inOut(code).inn) sub = span('pp.move.face.sub_nurse', { u: l.unit, day: LIT[inOut(code).inMoves[0].from].day, code: inOut(code).inMoves[0].from });
    else sub = span('pp.move.face.sub', { u: l.unit, day: l.day });
    return '<header class="utility-header"><div class="mv-title"><h3>' + span('pp.move.face.title', { code: code, tag: l.tag }) + '</h3><p>' + sub + '</p></div></header>';
  }
  function ledgerFacts(code) {
    var g = ledger(code), items = [];
    if (g.born != null) items.push(fact('label.born', null, pigs(g.born).id, pigs(g.born).args));
    items.push(fact('label.dead', null, pigs(g.dead).id, pigs(g.dead).args));
    if (g.weaned) items.push(fact('pp.move.label.weaned', null, pigs(g.weaned).id, pigs(g.weaned).args));
    if (g.loss) items.push(fact('pp.move.label.loss', null, pigs(g.loss).id, pigs(g.loss).args, 'pp.move.fact.open'));
    if (g.gain) items.push(fact('pp.move.label.gain', null, pigs(g.gain).id, pigs(g.gain).args, 'pp.move.fact.open'));
    if (g.out) items.push(fact('pp.move.label.moved_out', null, pigs(g.out).id, pigs(g.out).args, pl('pp.move.fact.moves', g.io.outMoves.length), { k: g.io.outMoves.length }));
    if (g.inn) items.push(fact('pp.move.label.moved_in', null, pigs(g.inn).id, pigs(g.inn).args, pl('pp.move.fact.moves', g.io.inMoves.length), { k: g.io.inMoves.length }));
    items.push(fact('label.alive', null, pigs(g.alive).id, pigs(g.alive).args));
    return UI.facts(items, { columns: items.length === 3 ? 3 : 2 });
  }
  // One row per Move, newest first; each is the Edit door for that record (S8 owns Edit's screens).
  function movesGroup(code) {
    var io = inOut(code), ms = io.inMoves.concat(io.outMoves).sort(function (a, b) { return a.time < b.time ? 1 : -1; });
    if (!ms.length) return '';
    return UI.rowGroup(ms.map(function (m) {
      var inn = m.to === code, other = inn ? m.from : m.to;
      var t = where(other) ? (inn ? 'pp.move.moves.in_unit' : 'pp.move.moves.out_unit') : (inn ? 'pp.move.moves.in' : 'pp.move.moves.out');
      return row({ action: 'edit-move', value: m.id, title: pl(t, m.n), titleArgs: { n: m.n, code: other, u: LIT[other].unit },
        desc: m.explains ? 'pp.move.moves.stamp_explains' : 'pp.move.moves.stamp', descArgs: { stamp: stamp(m.time) }, trail: 'act.edit' });
    }).join(''), { title: '', strs: { title: 'pp.move.moves.title' } });
  }
  // What the arrivals owe here, one row per dose, merged across Moves with per-source counts.
  function arrivalRows(code) {
    var io = inOut(code);
    if (!io.inn) return '';
    var own = alive(code) - io.inn, l = LIT[code], rows = [];
    TX.forEach(function (d) {
      var owe = [], done = 0, unknown = 0, check = [], missed = [], males = [];
      io.inMoves.forEach(function (m) {
        var c = m.carry[d]; if (!c) return;
        var r = S.resolved && S.resolved[m.id + d];
        if (r) { if (r.rest === 'owed' && m.n - r.had > 0) owe.push({ from: m.from, n: m.n - r.had, carry: m.carry }); return; }
        if (c.kind === 'owe') (d === 'castrate' ? males : owe).push(m);
        else if (c.kind === 'done') done += m.n;
        else if (c.kind === 'unknown') unknown += m.n;
        else if (c.kind === 'check') check.push(m);

  /* ---- the Move drawer ---- */

  function countSection() {

  // The same facts on the review and on the receipt.

    else if (a === 'pick-row') { var i = S.rows.indexOf(v); if (i >= 0) S.rows.splice(i, 1); else S.rows.push(v); render(); }
    else if (a === 'answer') { var p = v.split(':'); S.answers[p[0]] = p[1]; render(); }
    else if (a === 'clear') { var keep = { view: 'move', face: S.face }; S = Object.assign(JSON.parse(DEFAULT), keep); render(); }
    else if (a === 'back' && S.view === 'move') { S.view = 'face'; S.kept = draftExists(); render(); }   // Back keeps the draft
    else if (a === 'open-move') { S.view = 'move'; S.kept = false; render(); }
    else if (a === 'save-move') { if (b.disabled) return; post(); render(); }
    else if (a === 'close') { S.view = 'face'; render(); }
    else if (a === 'open-resolve') { S.drawer = v; S.had = 0; S.rest = 'record'; render(); }
    else if (a === 'rest') { S.rest = v; render(); }
    else if (a === 'close-resolve') { S.drawer = ''; render(); }
    else if (a === 'save-resolve') { S.resolved = S.resolved || {}; S.resolved[S.drawer.replace(':', '')] = { had: S.had, rest: S.rest }; S.drawer = ''; render(); }
    else document.documentElement.setAttribute('data-door', a + ':' + (v || ''));
  });
  PP.ready.then(function () { if (RECEIPT_AT_LOAD) { S.view = 'move'; normalize(); post(); } render(); });
})();
</script>
