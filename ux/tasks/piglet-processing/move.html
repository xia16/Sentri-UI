<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move piglets</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<style>
/* Layout only, tokens from tokens.css. No candidate: the Move is Sheet + Segment + ChoiceList + Stepper + Facts + Heading + Row. */
.mv-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.mv-phone .scrim { inset: 0; }
.mv-title { flex: 1; min-width: 0; }
.mv-body { display: flex; flex-direction: column; gap: var(--space-section); padding-bottom: var(--space-panel); }
.mv-body > * { margin: 0; }
.mv-face { display: flex; flex-direction: column; gap: var(--space-section); }
.mv-face > * { margin: 0; }
.mv-group { display: flex; flex-direction: column; gap: var(--space-heading); }
.mv-group > * { margin: 0; }
.mv-find { display: flex; align-items: center; gap: var(--space-footer-gap); }
.mv-find > .field { flex: 1; min-width: 0; margin: 0; }
.mv-summary { flex: none; display: flex; flex-direction: column; gap: var(--space-row-y); padding: var(--space-row-y) var(--space-gutter); }
.mv-summary > * { margin: 0; }
.mv-phone .sheet[data-st-context="drawer"] > .sheet-body { flex: 1; }
.mv-receipt { display: flex; flex-direction: column; gap: var(--space-panel); padding-bottom: var(--space-panel); }
.mv-receipt > * { margin: 0; }
.sheet-footer > .button { flex: 1; }
.sheet-footer > .button.secondary:not(:only-child) { flex: none; }
@media (max-width: 370px) { .mv-summary { padding-left: var(--space-gutter-narrow); padding-right: var(--space-gutter-narrow); } }
</style>
</head>
<body>
<main class="inspection-phone mv-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  var UI = window.SentriUI, ICON = window.SentriIcons;
  var zh = PP.lang === 'zh';

  /* ---- fixtures: Unit 7, Sep 29. Every number printed on every state comes from here. ----
     done[d] = piglets of the litter recorded for dose d; equal to alive = all done, 0 = none, between = part done.
     Invisible doses (asked when part done): iron, coccidiosis, health. Visible (checked on the pig): teeth, tail, castrate. */
  var INVISIBLE = { iron: 1, coccidiosis: 1, health: 1 };
  var DOSES = ['iron', 'coccidiosis', 'teeth', 'tail'];
  var LIT = {
    B01: { tag: '000226', day: 3, born: 10, dead: 3, alive: 7, died: true, done: { teeth: 7, tail: 7, iron: 0, coccidiosis: 0 } },
    B02: { tag: '000241', day: 4, born: 9, dead: 1, alive: 8, done: { iron: 8, coccidiosis: 8, teeth: 8, tail: 8 } },
    B04: { tag: '000254', day: 4, born: 10, dead: 1, alive: 9, done: { iron: 9, coccidiosis: 9, teeth: 9, tail: 9 } },
    B06: { tag: '000261', day: 3, born: 13, dead: 1, alive: 12, done: { iron: 0, coccidiosis: 0, teeth: 0, tail: 0 } },
    B08: { tag: '000270', day: 0, alive: 6, dead: 1, sofar: 7, farrowing: true, ago: 2, who: 'L.M' },
    B09: { tag: '000247', day: 4, born: 11, dead: 1, alive: 10, done: { iron: 8, coccidiosis: 10, teeth: 10, tail: 7 } },
    B10: { tag: '000265', day: 3, born: 12, dead: 1, alive: 11, done: { iron: 0, coccidiosis: 0, teeth: 0, tail: 0 } },
    C01: { tag: '000283', day: 5, born: 13, dead: 1, alive: 12, done: { iron: 12, coccidiosis: 12, teeth: 12, tail: 12 } },
    C03: { tag: '000288', day: 4, born: 11, dead: 1, alive: 10, done: { iron: 10, coccidiosis: 10, teeth: 10, tail: 10 },
           tags: ['000301', '000302', '000303', '000304', '000305', '000306', '000307', '000308', '000309', '000310'] },
    C05: { tag: '000292', day: 4, born: 9, dead: 1, alive: 8, done: { iron: 0, coccidiosis: 0, teeth: 0, tail: 0 } },
    D02: { tag: '000233', empty: true, alive: 0 }
  };
  var UNIT = 7, WHO = 'G.H';
  // The room's other litters offered from each source: nearest day-age first; sows with no piglets in their own group.
  function listFor(src) {
    var me = LIT[src], near = [], empty = [];
    Object.keys(LIT).forEach(function (c) {
      var l = LIT[c];
      if (c === src || l.farrowing) return;                 // pre-lock litters are never offered (the farrowing sheet owns them)
      if (src.charAt(0) !== c.charAt(0) && !l.empty) return;  // this row of crates; the search finds the rest
      (l.empty ? empty : near).push(c);
    });
    near.sort(function (a, b) { return Math.abs(LIT[a].day - me.day) - Math.abs(LIT[b].day - me.day) || (a < b ? -1 : 1); });
    return { near: near, empty: empty };
  }

  /* ---- states ---- */
  var STATES = {
    'move':           { view: 'move', from: 'B06', n: 1 },
    'move-review':    { view: 'move', from: 'B06', to: 'B04', n: 2 },
    'move-ask':       { view: 'move', from: 'B09', to: 'B02', n: 1, answers: { iron: 'unknown' } },
    'move-tagged':    { view: 'move', from: 'C03', to: 'C05', picked: ['000304', '000307'] },
    'move-orphan':    { view: 'move', from: 'B01', to: 'D02', n: 7 },
    'move-prelock':   { view: 'prelock', face: 'B08' },
    'move-receipt':   { view: 'receipt', from: 'B06', to: 'B04', n: 2, time: '09:42' },
    'owed-from-move': { view: 'owed', face: 'B04', from: 'B06', n: 2, time: '09:42' },
    'unknown-check':  { view: 'owed', face: 'B02', from: 'B09', n: 1, time: '10:05', answers: { iron: 'unknown' }, drawer: 'iron' }
  };
  var name = STATES[PP.state] ? PP.state : 'move';
  var S = JSON.parse(JSON.stringify(STATES[name]));
  if (PP.state === 'move-prelock' && new URLSearchParams(location.search).get('data') === 'other') {
    S = { view: 'move', from: 'B06', n: 1, query: 'B08' };
  }
  S.dir = S.dir || 'out';
  S.answers = S.answers || {};

  /* ---- helpers ---- */
  function span(id, args, cls) {
    return '<span' + (cls ? ' class="' + cls + '"' : '') + ' data-str="' + id + '"' +
      (args ? " data-args='" + JSON.stringify(args).replace(/'/g, '&#39;') + "'" : '') + '></span>';
  }
  function pig(n) { return 'pp.common.unit.piglet.' + (n === 1 && !zh ? 'one' : 'many'); }
  function one(base, n) { return base + (n === 1 ? '.one' : '.many'); }
  function doseList(list) { return list.map(function (d) { return PP.t('pp.move.dose.' + d); }).join(' · '); }
  function row(o) {
    var strs = { title: o.title }, args = { title: o.titleArgs };
    if (o.desc) { strs.description = o.desc; args.description = o.descArgs; }
    return UI.row({ title: '', description: o.desc ? '' : undefined, action: o.action, value: o.value, strs: strs, args: args });
  }
  function fact(label, labelArgs, value, valueArgs, meta, metaArgs) {
    var f = { label: '', value: '', strs: { label: label, value: value }, args: { label: labelArgs, value: valueArgs } };
    if (meta) { f.meta = ''; f.strs.meta = meta; f.args.meta = metaArgs; }
    return f;
  }
  function button(cls, action, id, args, disabled) {
    return '<button type="button" class="button ' + cls + '" data-ds="Button" data-action="' + action + '" data-str="' + id + '"' +
      (args ? " data-args='" + JSON.stringify(args).replace(/'/g, '&#39;') + "'" : '') + (disabled ? ' disabled' : '') + '></button>';
  }
  function status(l) {
    if (l.empty) return null;
    var vals = DOSES.map(function (d) { return l.done[d] || 0; });
    if (vals.every(function (v) { return v >= l.alive; })) return 'done';
    if (vals.every(function (v) { return v === 0; })) return 'due';
    return 'part';
  }

  /* What the moved piglets owe, per dose, from the source's state (RULINGS round 2, Q14):
     all done → carried done · none done → owed in the receiver · part done → invisible: asked; visible: check on the pig. */
  function carry(from, to) {
    var s = LIT[from], r = LIT[to], out = { done: [], owe: [], ask: [], check: [] };
    DOSES.forEach(function (d) {
      var v = s.done[d] || 0;
      if (v >= s.alive) out.done.push(d);
      else if (v === 0) out.owe.push(d);
      else if (INVISIBLE[d]) out.ask.push(d);
      else out.check.push(d);
    });
    // an answer turns an asked dose into done (yes), owed (no), or leaves it unknown on the receiver
    out.unknown = [];
    out.ask.forEach(function (d) {
      var a = S.answers[d] || 'unknown';
      (a === 'yes' ? out.done : a === 'no' ? out.owe : out.unknown).push(d);
    });
    return out;
  }
  function count() { return S.picked ? S.picked.length : S.n; }
  function ends() { return S.dir === 'out' ? { a: S.from, b: S.to } : { a: S.to, b: S.from }; }

  /* ---- the litter face behind a drawer (a stand-in for the litter sheet: header, the ledger, the Move door) ---- */
  function header(code) {
    var l = LIT[code];
    var sub = l.farrowing ? span('pp.move.face.sub_farrowing', { u: UNIT }) :
      l.died ? span('pp.move.face.sub_died', { u: UNIT, day: l.day }) : span('pp.move.face.sub', { u: UNIT, day: l.day });
    return '<header class="utility-header"><div class="mv-title"><h3>' + span('pp.move.face.title', { code: code, tag: l.tag }) + '</h3><p>' + sub + '</p></div></header>';
  }
  function ledger(code, moved) {
    var l = LIT[code], items = [];
    if (l.born != null) items.push(fact('label.born', null, pig(l.born), { n: l.born }));
    items.push(fact('label.dead', null, pig(l.dead), { n: l.dead }));
    if (moved && moved.dir === 'in') items.push(fact('pp.move.label.moved_in', null, pig(moved.n), { n: moved.n }, 'pp.move.fact.from', { code: moved.code, time: moved.time, who: WHO }));
    if (moved && moved.dir === 'out') items.push(fact('pp.move.label.moved_out', null, pig(moved.n), { n: moved.n }, 'pp.move.fact.to', { code: moved.code, time: moved.time, who: WHO }));
    var alive = l.alive + (moved ? (moved.dir === 'in' ? moved.n : -moved.n) : 0);
    items.push(fact('label.alive', null, pig(alive), { n: alive }));
    return UI.facts(items, { columns: items.length === 3 ? 3 : 2 });
  }
  function faceSheet(code, bodyHtml, inert) {
    return '<section class="sheet" data-ds="Sheet" data-presentation="page"' + (inert ? ' inert' : '') + '>' + header(code) +
      '<div class="sheet-body"><div class="mv-face">' + bodyHtml + '</div></div>' +
      '<footer class="sheet-footer">' + button('secondary', 'back', 'act.back') + '</footer></section>';
  }
  function moveDoor(code) {
    return UI.rowGroup(row({ action: 'open-move', value: code, title: 'pp.move.sheet.title', desc: 'pp.move.door.desc' }));
  }

  /* ---- the Move drawer ---- */
  function crateRow(c) {
    var l = LIT[c], st = status(l);
    var meta = l.empty ? 'pp.move.crate.meta.empty' : 'pp.move.crate.meta.' + st;
    return UI.choiceRow({ label: '', meta: '', mode: 'single', action: 'pick-crate', value: c, selected: S.to === c,
      strs: { label: 'pp.move.crate.code', meta: meta }, args: { label: { code: c }, meta: { day: l.day, n: l.alive, tag: l.tag } } });
  }
  function crateSection() {
    var other = S.dir === 'out' ? 'pp.move.to.title' : 'pp.move.from.title';
    var find = '<div class="mv-find">' +
      UI.choiceSearch({ label: PP.t('pp.move.search.label'), placeholder: PP.t('pp.move.search.placeholder'), value: S.query || '' }) +
      UI.iconButton({ action: 'scan', icon: ICON.icon('scan'), label: PP.t('pp.move.aria.scan') }) + '</div>';
    if (S.to && !S.query) {                                   // chosen: the list folds into one picker; tap it to choose again
      var l2 = LIT[S.to], meta = l2.empty ? 'pp.move.crate.meta.empty' : 'pp.move.crate.meta.' + status(l2);
      return UI.pickerField({ label: '', display: S.to, action: 'change-crate', key: 'crate',
        strs: { label: other, display: 'pp.move.crate.chosen' }, args: { display: { code: S.to, meta: PP.t(meta, { day: l2.day, n: l2.alive, tag: l2.tag }) } } });
    }
    var lists;
    if (S.query) {
      var q = S.query.toUpperCase(), hit = LIT[q];
      if (hit && hit.farrowing) {
        lists = UI.choiceGroup(UI.choiceRow({ label: '', meta: '', mode: 'navigate', action: 'open-farrowing', value: q,
          strs: { label: 'pp.move.crate.code', meta: 'pp.move.crate.meta.farrowing' }, args: { label: { code: q } } }));
      } else if (hit) {
        lists = UI.choiceGroup(crateRow(q));
      } else {
        lists = UI.choiceEmpty('', { strs: { text: 'pp.move.search.none' }, args: { text: { q: S.query } } });
      }
    } else {
      var L = listFor(S.from);
      lists = UI.choiceGroup(L.near.map(crateRow), { title: '', strs: { title: 'pp.move.list.near' }, args: { title: { u: UNIT } } }) +
        (L.empty.length ? UI.choiceGroup(L.empty.map(crateRow), { title: '', strs: { title: 'pp.move.list.empty' } }) : '');
    }
    return '<section class="mv-group">' + UI.heading({ title: '', kind: 'section', level: 3, strs: { title: other } }) + find + lists + '</section>';
  }
  function countSection() {
    var src = LIT[S.dir === 'out' ? S.from : (S.to || S.from)];
    if (S.picked) {
      var tags = LIT[S.from].tags;
      return '<section class="mv-group">' +
        UI.heading({ title: '', meta: '', kind: 'section', level: 3, strs: { title: 'pp.move.tags.title', meta: 'pp.move.tags.meta' }, args: { meta: { n: S.picked.length, total: tags.length } },
          action: UI.iconButton({ action: 'scan-tag', icon: ICON.icon('scan'), label: PP.t('act.scan') }) }) +
        UI.choiceGroup(tags.map(function (t) {
          return UI.choiceRow({ label: '', mode: 'multi', action: 'pick-tag', value: t, selected: S.picked.indexOf(t) >= 0, strs: { label: 'pp.move.tag' }, args: { label: { tag: t } } });
        })) + '</section>';
    }
    return UI.stepper({ label: '', description: '', value: S.n, min: 1, max: src.alive, key: 'n',
      strs: { label: 'label.piglets', description: 'pp.move.count.of', value: 'ds.field.figure', decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase' },
      args: { description: { n: src.alive, code: S.dir === 'out' ? S.from : (S.to || S.from) } } });
  }
  function askSection() {
    if (!S.to) return '';
    var e = ends(), c = carry(e.a, e.b);
    if (!c.ask.length) return '';
    var qs = c.ask.map(function (d) {
      var a = S.answers[d] || 'unknown';
      return '<div class="mv-group">' + UI.heading({ title: '', kind: 'panel', level: 4, strs: { title: 'pp.move.ask.q.' + d } }) +
        UI.segment({ action: 'answer', ariaLabel: PP.t('pp.move.ask.q.' + d), active: d + ':' + a, options: [
          [d + ':yes', 'Yes', { strs: { label: 'pp.move.ask.yes' } }],
          [d + ':no', 'No', { strs: { label: 'pp.move.ask.no' } }],
          [d + ':unknown', "Don't know", { strs: { label: 'pp.move.ask.unknown' } }]] }) + '</div>';
    }).join('');
    return '<section class="mv-group">' +
      UI.heading({ title: '', description: '', kind: 'section', level: 3, strs: { title: 'pp.move.ask.title', description: 'pp.move.ask.desc' }, args: { title: { code: e.a }, description: { code: e.a } } }) +
      qs + '</section>';
  }
  /* What the moved piglets bring to the receiver, one fact per outcome; read before Save and again on the receipt. */
  function carrySection(c, to, n) {
    var items = [];
    function add(kind, list) { if (list.length) items.push(fact('pp.move.carry.l.' + kind, null, 'pp.move.carry.doses', { doses: doseList(list) })); }
    add('owe', c.owe); add('unknown', c.unknown); add('check', c.check); add('done', c.done);
    if (S.picked && S.picked.length) items.push(fact('pp.move.carry.l.tags', null, 'pp.move.carry.doses', { doses: S.picked.join(' · ') }));
    if (!items.length) return '';
    return '<section class="mv-group">' +
      UI.heading({ title: '', kind: 'section', level: 3, strs: { title: one('pp.move.carry.title', n) }, args: { title: { n: n, to: to } } }) +
      UI.facts(items, { columns: 1 }) + '</section>';
  }
  function summary() {
    if (!S.to) return '<div class="mv-summary">' + UI.heading({ title: '', kind: 'panel', level: 4, strs: { title: 'pp.move.pointer.choose' } }) + '</div>';
    var e = ends(), n = count(), a = LIT[e.a], b = LIT[e.b];
    var aAfter = a.alive - n, bAfter = b.alive + n;
    var fa = fact('pp.move.delta.from', { code: e.a }, 'pp.move.delta.value', { a: a.alive, b: aAfter }, aAfter === 0 ? 'pp.move.delta.none_left' : null);
    var fb = fact('pp.move.delta.to', { code: e.b }, 'pp.move.delta.value', { a: b.alive, b: bAfter }, b.empty ? 'pp.move.delta.keeps_day' : null, { day: a.day, code: e.a });
    return '<div class="mv-summary">' + UI.facts([fa, fb]) + '</div>';
  }
  function carryNow() { if (!S.to) return ''; var e = ends(); return carrySection(carry(e.a, e.b), e.b, count()); }
  function moveDrawer() {
    var src = S.dir === 'out' ? S.from : S.from, l = LIT[src];
    var ready = S.to && count() > 0, e = ends();
    var seg = UI.segment({ action: 'dir', ariaLabel: PP.t('pp.move.dir.aria'), active: S.dir, options: [
      ['out', 'Out', { strs: { label: 'pp.move.dir.out' }, args: { label: { code: S.from } } }],
      ['in', 'In', { strs: { label: 'pp.move.dir.in' }, args: { label: { code: S.from } } }]] });
    var primary = ready ? button('primary', 'save-move', 'pp.move.act.move', { n: count(), from: e.a, to: e.b }) : button('primary', 'save-move', 'pp.move.act.move_bare', null, true);
    return '<div class="scrim"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="long" role="dialog" aria-modal="true">' +
      '<header class="utility-header"><div class="mv-title"><h3 data-str="pp.move.sheet.title"></h3><p>' + span('pp.move.sheet.sub', { code: src, n: l.alive, day: l.day }) + '</p></div></header>' +
      '<div class="sheet-body"><div class="mv-body">' + seg + crateSection() + countSection() + askSection() + carryNow() + '</div></div>' +
      summary() +
      '<footer class="sheet-footer">' + button('secondary', 'back', 'act.back') + primary + '</footer></section>';
  }

  /* ---- the receipt: the Move drawer after Save ---- */
  function receiptDrawer() {
    var n = count(), c = carry(S.from, S.to), a = LIT[S.from], b = LIT[S.to];
    var body = '<div class="mv-receipt">' +
      UI.heading({ title: '', kind: 'panel', level: 4, strs: { title: 'pp.move.receipt.spray_why' }, args: { title: { to: S.to } } }) +
      UI.facts([fact('pp.move.delta.from', { code: S.from }, 'pp.move.delta.value', { a: a.alive, b: a.alive - n }),
                fact('pp.move.delta.to', { code: S.to }, 'pp.move.delta.value', { a: b.alive, b: b.alive + n })]) +
      carrySection(c, S.to, n) + '</div>';
    return '<div class="scrim"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="medium" data-sizing="content" role="dialog" aria-modal="true">' +
      '<header class="utility-header"><div class="mv-title"><h3>' + span(one('pp.move.receipt.spray', n), { n: n }) + '</h3><p>' + span('pp.move.receipt.title', { n: n, to: S.to, time: S.time, who: WHO }) + '</p></div></header>' +
      '<div class="sheet-body">' + body + '</div>' +
      '<footer class="sheet-footer">' + button('secondary', 'close', 'act.close') + '</footer></section>';
  }

  /* ---- the receiving litter: what the arrivals owe ---- */
  function arrivalRows() {
    var c = carry(S.from, S.face), rows = [];
    c.unknown.forEach(function (d) { if (S.resolved && S.resolved[d]) return; rows.push(row({ action: 'check-unknown', value: d, title: 'pp.common.tx.' + d, desc: 'pp.move.owed.unknown', descArgs: { n: S.n, dose: PP.t('pp.move.dose.' + d) } })); });
    c.owe.forEach(function (d) { rows.push(row({ action: 'record', value: d, title: 'pp.common.tx.' + d, desc: 'pp.move.owed.owe', descArgs: { n: S.n, code: S.from } })); });
    c.check.forEach(function (d) { rows.push(row({ action: 'record', value: d, title: 'pp.common.tx.' + d, desc: 'pp.move.owed.check', descArgs: { n: S.n, code: S.from } })); });
    if (!rows.length) return '';
    return UI.rowGroup(rows.join(''), { title: '', strs: { title: 'pp.move.owed.title' }, args: { title: { code: S.from } } });
  }
  function unknownDrawer() {
    var d = S.drawer, pick = S.resolve || '';
    var dose = PP.t('pp.move.dose.' + d);
    var rows = [
      UI.choiceRow({ label: '', meta: '', mode: 'single', action: 'resolve', value: 'had', selected: pick === 'had',
        strs: { label: 'pp.move.unk.had', meta: 'pp.move.unk.had_meta' }, args: { label: { dose: dose } } }),
      UI.choiceRow({ label: '', meta: '', mode: 'single', action: 'resolve', value: 'give', selected: pick === 'give',
        strs: { label: 'pp.move.unk.give', meta: 'pp.move.unk.give_meta' }, args: { label: { dose: dose }, meta: { dose: dose, n: S.n } } })
    ];
    return '<div class="scrim"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="short" data-sizing="content" role="dialog" aria-modal="true">' +
      '<header class="utility-header"><div class="mv-title"><h3>' + span('pp.move.unk.title', { dose: PP.t('pp.common.tx.' + d), n: S.n, code: S.from }) + '</h3><p>' +
      span('pp.move.owed.unknown', { n: S.n, dose: dose }) + '</p></div></header>' +
      '<div class="sheet-body"><div class="mv-body">' + UI.choiceGroup(rows) + '</div></div>' +
      '<footer class="sheet-footer">' + button('secondary', 'close-unknown', 'act.back') + button('primary', 'save-unknown', 'act.save', null, !pick) + '</footer></section>';
  }

  /* ---- move-prelock: the door to the farrowing sheet ---- */
  function prelockDrawer() {
    var l = LIT[S.face];
    var door = UI.rowGroup(row({ action: 'open-farrowing', value: S.face, title: 'pp.move.pre.door', titleArgs: { code: S.face },
      desc: 'pp.move.pre.door_desc', descArgs: { n: l.sofar, h: l.ago, who: l.who } }));
    return '<div class="scrim"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="short" data-sizing="content" role="dialog" aria-modal="true">' +
      '<header class="utility-header"><div class="mv-title"><h3 data-str="pp.move.sheet.title"></h3><p>' + span('pp.move.pre.why', { code: S.face }) + '</p></div></header>' +
      '<div class="sheet-body"><div class="mv-body">' + door + '</div></div>' +
      '<footer class="sheet-footer">' + button('secondary', 'back', 'act.back') + '</footer></section>';
  }

  function render() {
    var html;
    if (S.view === 'move') {
      html = faceSheet(S.from, ledger(S.from) + moveDoor(S.from), true) + moveDrawer();
    } else if (S.view === 'receipt') {
      html = faceSheet(S.from, ledger(S.from, { dir: 'out', n: count(), code: S.to, time: S.time }) + moveDoor(S.from), true) + receiptDrawer();
    } else if (S.view === 'owed') {
      html = faceSheet(S.face, ledger(S.face, { dir: 'in', n: S.n, code: S.from, time: S.time }) + arrivalRows() + moveDoor(S.face), !!S.drawer) + (S.drawer ? unknownDrawer() : '');
    } else if (S.view === 'prelock') {
      html = faceSheet(S.face, ledger(S.face), true) + prelockDrawer();
    }
    document.getElementById('screen').innerHTML = html;
    PP.apply(document.getElementById('screen'));
  }

  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action, v = b.dataset.value;
    if (a === 'pick-tag') v = b.value;                        // a multi row's checkbox carries its tag as value
    if (a === 'pick-crate') { S.to = v; S.query = ''; render(); }
    else if (a === 'change-crate') { S.to = ''; render(); }
    else if (a === 'dir') { S.dir = v; render(); }
    else if (a === 'step') {
      if (b.getAttribute('aria-disabled') === 'true') return;
      S.n += +b.dataset.step; render();
    } else if (a === 'pick-tag') {
      var i = S.picked.indexOf(v); if (i >= 0) S.picked.splice(i, 1); else S.picked.push(v); render();
    } else if (a === 'answer') { var p = v.split(':'); S.answers[p[0]] = p[1]; render(); }
    else if (a === 'save-move') { if (!S.to || !count()) return; S.view = 'receipt'; S.time = '09:42'; render(); }
    else if (a === 'check-unknown') { S.drawer = v; render(); }
    else if (a === 'close-unknown') { S.drawer = ''; render(); }
    else if (a === 'save-unknown') { if (!S.resolve) return; S.resolved = S.resolved || {}; S.resolved[S.drawer] = S.resolve; S.drawer = ''; S.resolve = ''; render(); }
    else if (a === 'resolve') { S.resolve = v; render(); }
    else document.documentElement.setAttribute('data-door', a + ':' + (v || ''));
  });
  PP.ready.then(render);
})();
</script>
</body>
</html>
