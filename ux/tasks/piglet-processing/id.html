<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identity and weigh</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css. Candidate compositions: Radio (the sex field), CompactRun (the Numpad run
   with its running list folded into the status line), Tool (the soft-well mid-sheet act), plus coloured status words. */
.id-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.id-phone .scrim { inset: 0; }
.id-body { display: flex; flex-direction: column; gap: var(--space-section); }
.id-body > * { margin: 0; }
.id-group > * + * { margin-top: var(--space-heading); }
/* The run has no scrolling body: the piglet's fields and the pad share one column anchored at the bottom,
   so the keys sit at one place for every piglet and the whole piglet fits a 360 × 740 phone. */
.id-run { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: var(--space-row-y); padding: 0 var(--space-gutter-sheet) var(--space-row-y); background: var(--paper); overflow-y: auto; }
.id-run-fields { display: flex; flex-direction: column; }
.id-dock { flex: none; display: flex; flex-direction: column; justify-content: flex-end; padding: var(--space-row-y) var(--space-gutter-sheet); background: var(--paper); border-top: 1px solid var(--line); }
.id-drawer-body { display: flex; flex-direction: column; gap: var(--space-row-y); }
@media (max-width: 370px) { .id-run, .id-dock { padding-left: var(--space-gutter-narrow); padding-right: var(--space-gutter-narrow); } }
/* The header's progress door: a text action on the title row, colour on the value when it is over alive. */
.id-door { display: inline-flex; align-items: center; gap: 4px; }
.id-door svg { width: 15px; height: 15px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
/* Candidate:CompactRun — the Numpad's run readout (its own markup) over the keys-only Numpad; the three-line running
   list is folded into the status line as one `Last …` line with Undo. */
.id-compact { display: flex; flex-direction: column; gap: var(--space-row-y); }
/* Candidate:Radio — a single-select field with visible radios (RULINGS craft pass: 2px rings, selected = ink ring + dot,
   the selected label weighs 700). Stepper silhouette: label left, the choices right, one 60px row. Optional: tapping the
   chosen radio again clears it (missing, never a default). */
.id-radio { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-row-y); min-height: var(--stepper-row-min); }
.id-radio-label { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; font: 600 var(--type-choice-label-size)/1.4 var(--font-sans); color: var(--ink); }
.id-radio-label small { font: 400 var(--type-choice-meta-size)/1.4 var(--font-sans); color: var(--muted); }
.id-radio-opts { display: flex; gap: var(--space-key-gap); align-self: stretch; }
.id-radio-opt { display: flex; align-items: center; gap: var(--space-key-gap); min-height: var(--stepper-row-min); min-width: var(--back-width); margin: 0; padding: 0 var(--space-row-y); border: 0; border-radius: var(--radius-control); background: transparent; color: var(--ink); font: 600 var(--type-choice-label-size)/1.4 var(--font-sans); cursor: pointer; touch-action: manipulation; }
.id-radio-opt:active { background: var(--press); }
.id-radio-opt:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.id-radio-ring { display: grid; place-items: center; flex: none; width: var(--glyph-pad); height: var(--glyph-pad); box-sizing: border-box; border: var(--caret-width) solid var(--muted); border-radius: 50%; }
.id-radio-opt[aria-checked="true"] { font-weight: 700; }
.id-radio-opt[aria-checked="true"] .id-radio-ring { border-color: var(--ink); }
.id-radio-opt[aria-checked="true"] .id-radio-ring::after { content: ""; width: calc(var(--glyph-pad) / 2); height: calc(var(--glyph-pad) / 2); border-radius: 50%; background: var(--ink); }
/* Candidate:Tool lives in shell.css (shared with the litter sheet's tools). */
/* Status words: colour lives on the value (dead red, a sync duplicate or an over count amber). */
.id-tone[data-tone="red"] { color: var(--red); }
.id-tone[data-tone="amber"] { color: var(--amber); }
.id-tone[data-tone="green"] { color: var(--green); }
@media (prefers-reduced-motion: reduce) { .id-radio-opt { transition: none; } }
</style>
</head>
<body>
<main class="inspection-phone id-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, ICON = window.SentriIcons, U = window.PPUI;
  var zh = PP.lang === 'zh';
  var ME = 'G.H';

  /* ---- states: a variant of the shared fixture (fixtures.js) + the crate + UI state. The identity rows, Alive, the day-age,
     the farm's scheme, the closed candidate set and over-alive are the ledger's (identity rows over the shared log);
     Record, Undo and closing the set commit identity events through append. The weigh-day litter weight (`litter_weight`),
     the boar/gilt counts for piglets not identified (`sex_counts`) and the same-tag lookup (`identity.sameTag`, row `alsoOn`,
     `select.findId`) are the ledger's too. ---- */
  // bag: the first tag in the hand's bag for this litter — what the camera reads when the scan button is tapped here.
  var BAG = { A02: '004301', B04: '004521', C02: '004401', A07: '004610' };
  var STATES = {
    'id-empty':           { data: 'base', l: 'A02' },
    'id-no-tag':          { data: 'base', l: 'A02', press: 'record' },
    'id-entry':           { data: 'a02-tags-gh', l: 'A02' },
    'id-weight':          { data: 'a02-tags-gh', l: 'A02', sex: 'g', weight: '1.4', active: 'weight' },
    'id-warned':          { data: 'a02-tags-gh', l: 'A02', tag: '00430', sex: 'g', weight: '0.62', press: 'record' },
    'id-partial':         { data: 'a02-tags-lm', l: 'A02' },
    'id-duplicate':       { data: 'a02-tags-gh', l: 'A02', tag: '004514' },
    'id-recatch':         { data: 'a02-tags-gh', l: 'A02', scan: '004302', weight: '1.4' },
    'id-recatch-edit':    { data: 'a02-tags-gh', l: 'A02', scan: '004301', sex: 'b' },
    'id-all':             { data: 'a02-tags-all', l: 'A02' },
    'id-over':            { data: 'a02-tags-over', l: 'A02', face: 'table' },
    'id-early':           { data: 'base', l: 'C02' },
    'id-candidates':      { data: 'keepers', l: 'A07' },
    'id-close-confirm':   { data: 'keepers', l: 'A07', face: 'table', confirm: true },
    'id-candidates-done': { data: 'keepers-closed', l: 'A07', face: 'table' },
    'id-notch-only':      { data: 'notch', l: 'A04' },
    'id-table':           { data: 'base', l: 'B04', face: 'table' },
    'id-draft-kept':      { data: 'a02-tags-lm', l: 'A02', face: 'table', tag: '004306', sex: 'g', lwDraft: { w: '16.', boars: 0, gilts: 0 } },
    'litter-weight':      { data: 'a02-tags-lm', l: 'A02', face: 'table', drawer: { w: '16.8', boars: 4, gilts: 2 } },
    'litter-weight-warn': { data: 'a02-tags-lm', l: 'A02', face: 'table', drawer: { w: '36.2', boars: 0, gilts: 0 } },
    'id-pair':            { data: 'a02-tags-pair', l: 'A02', face: 'table' },
    // Counts saved when 5 were identified (4 boars · 3 gilts not identified); two boars identified since consume two boar counts.
    'litter-weight-consumed': { data: 'a02-tags-seven', l: 'A02', face: 'table', open: 'weight' },
    'litter-weight-refused': { data: 'a02-tags-lm', l: 'A02', face: 'table', drawer: { w: '304', boars: 0, gilts: 0 } }
  };
  // The usual per-piglet weight by day-age (console): the soft range, never a gate.
  var USUAL = { 1: [0.8, 2.4], 2: [0.9, 2.6], 3: [1.0, 2.8], 4: [1.1, 3.0], 9: [1.8, 4.2] };
  // Refused only when physically impossible: over 6 kg per alive piglet on a suckling litter (a slipped decimal).
  var HARD_KG = 6;

  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'id-empty';
  var st = STATES[name];
  var store, crate, F, L, notch, keepers, NOW;
  var rows = [];                          // this litter's identity rows (the ledger's), in the page's shape
  var log = [];                           // every Record this visit and before, in order; the status line shows the newest
  var closed = null;
  var lwRecs = [];
  var face = st.face || 'run';
  var visitStart = 0;                     // rows recorded from here on are this visit's (Undo reaches only these)
  var TAGLEN = 6, NOTCHLEN = 2;

  /* ---- the ledger ---- */
  function hm(iso) { return String(iso).slice(11, 16); }
  function dom(iso) { return +String(iso).slice(8, 10); }
  function key(r) { return notch ? String(r.n) : r.tag; }
  function elsewhereOf(tag, notchKey) {
    // Where the farm holds this identity now, outside this litter: the ledger's lookup (select.findId).
    var hit = store.select.findId(store.derived, tag ? { tag: tag } : { notch: notchKey }, crate)[0];
    return hit ? hit.litter : '';
  }
  function pageRow(r) {
    var x = r.edits.length ? r.edits[r.edits.length - 1] : null, at = x ? x.at : r.addedAt, who = x ? x.who : r.addedBy;
    var o = { rowId: r.rowId, tag: r.tag, n: r.notch ? +String(r.notch).split('-').pop() : null, sex: r.sex, w: r.weight == null ? null : String(r.weight), who: who, t: hm(at), d: dom(at) };
    if (x) o.first = { t: hm(r.addedAt), who: r.addedBy, d: dom(r.addedAt) };
    if (r.status === 'dead') o.dead = { cause: r.cause, d: dom(r.deathAt) };
    if (r.status === 'withdrawn') o.gone = { t: hm(r.withdrawn.at), who: r.withdrawn.who };
    // the same tag on another crate, and a same-tag pair within this litter: the ledger's same-tag groups
    var also = r.alsoOn || [];
    if (r.tag && !notch) o.dup = (also.filter(function (x) { return x.litter !== crate; })[0] || {}).litter || '';
    o.pair = also.some(function (x) { return x.litter === crate; });
    return o;
  }
  function reload() {
    L = store.derived.litters[crate];
    var ledgerRows = L.identity.rows.filter(function (r) { return r.litter === crate && (r.status === 'alive' || r.status === 'dead' || r.status === 'withdrawn'); });
    rows = ledgerRows.map(pageRow);
    closed = null;
    if (L.identity.closed) {
      var ce = store.events.filter(function (e) { return e.type === 'identity' && e.op === 'close' && e.litter === crate; }).pop();
      closed = { t: hm(ce.at), who: ce.who, k: distinct().length };
    }
  }
  function loadWeights() { lwRecs = store.weights(crate).filter(function (x) { return x.at; }).map(function (x) { return { w: x.kg, day: x.day, d: dom(x.at), t: hm(x.at), who: x.who }; }); }
  function commit(e) { var r = store.commit(Object.assign({ type: 'identity', litter: crate }, e)); if (r.ok) reload(); return r; }
  function alive() { return L.alive; }

  /* ---- the run's draft: tag (or notch number), sex, weight; the host holds it, the DOM never does ---- */
  var run = { tag: { value: '', suggested: false, suggestion: '' }, sex: null, weight: '', active: 'tag', note: null, armed: '', armedAt: 0 };
  var drawer = st.drawer ? { w: st.drawer.w, active: false, boars: st.drawer.boars, gilts: st.drawer.gilts } : null;
  var drawerKept = st.lwDraft ? Object.assign({ active: false }, st.lwDraft) : null;   // Back keeps the drawer's draft on the device
  var confirm = !!st.confirm;
  var receipt = null, lastCommit = 0;

  /* ---- derived ---- */
  var current = function () { return rows.filter(function (r) { return !r.gone; }); };
  var living = function () { return current().filter(function (r) { return !r.dead; }); };
  // Distinct identities: a same-tag pair (two hands, one piglet, offline) counts once until Edit resolves it.
  var distinct = function () { var seen = {}; return living().filter(function (r) { var k = key(r); if (seen[k]) return false; seen[k] = 1; return true; }); };
  var pairs = function () { return L.identity.pairs; };
  var identified = function () { return Math.min(distinct().length, alive()); };
  var over = function () { return Math.max(0, distinct().length - alive()); };
  function idText(r) { return notch ? PP.t('pp.id.notch', { litter: F.notchLitter, n: r.n }) : r.tag; }
  function idOf(v) { return notch ? PP.t('pp.id.notch', { litter: F.notchLitter, n: +v }) : v; }
  function nextSuggestion() {
    var cur = current();
    if (notch) { var m = cur.reduce(function (s, r) { return Math.max(s, r.n); }, 0); return String(m + 1); }
    // The next tag follows the last one recorded here in sequence (I-6: last + 1); a tag that warned as a duplicate is an
    // outlier from someone else's bag, not the sequence. Tags already used anywhere are skipped.
    var seq = cur.filter(function (r) { return !r.dup && r.tag && r.tag.length === TAGLEN && living().filter(function (x) { return x.tag === r.tag; }).length < 2; });
    if (!seq.length) return '';
    var n = +seq[seq.length - 1].tag + 1, t;
    for (;;) { t = ('000000' + n).slice(-TAGLEN); if (!elsewhereOf(t) && !cur.some(function (r) { return r.tag === t; })) return t; n++; }
  }
  function freshPiglet() {
    var s = nextSuggestion();
    run.tag = { value: s, suggested: !!s, suggestion: s };
    run.sex = null; run.sexTouched = false; run.weight = ''; run.weightTouched = false; run.active = 'tag'; run.note = null; run.armed = ''; run.prefill = null;
  }
  function draftDirty() { return !!((run.tag.value && !run.tag.suggested) || run.sex || run.weight); }
  function find(v) {               // this litter's current row for a value: alive (caught again) or dead (a dead piglet here)
    if (!v) return null;
    var k = notch ? String(+v) : v;
    var d = distinct(), i;
    for (i = 0; i < d.length; i++) if (key(d[i]) === k) return { r: d[i], i: i };          // a living record wins
    for (i = 0; i < rows.length; i++) if (!rows[i].gone && rows[i].dead && key(rows[i]) === k) return { r: rows[i], i: -1 };
    return null;
  }
  function elsewhere(v) {
    if (!v) return '';
    if (notch) return elsewhereOf(null, F.notchLitter + '-' + (+v));
    return v.length === TAGLEN ? elsewhereOf(v) : '';
  }
  function fullTag(v) { return notch ? v.length >= NOTCHLEN : v.length >= TAGLEN; }

  /* ---- strings ---- */
  function esc(s) { return U.esc(s); }
  function span(id, args, cls, tone) { return U.span(id, args, { cls: cls, tone: tone }); }
  function button(cls, action, id, args, extra) {
    return '<button type="button" class="button ' + cls + '" data-ds="Button" data-action="' + action + '"' + (extra || '') +
      ' data-str="' + id + '"' + (args ? " data-args='" + esc(JSON.stringify(args)) + "'" : '') + '>' + esc(PP.t(id, args)) + '</button>';
  }
  var sexWord = function (s) { return PP.t('pp.common.sex.' + (s === 'b' ? 'boar' : 'gilt')); };
  var kg = function (w) { return PP.t('pp.common.kg', { w: w }); };
  function stamp(r) { return r.d === dom(NOW) ? PP.t('pp.common.stamp.today', { t: r.t, who: r.who }) : PP.t('pp.common.stamp.date', { date: PP.t('pp.common.date.m9', { d: r.d }), t: r.t, who: r.who }); }
  function shape(r) { return (r.sex ? 's' : '') + (r.w ? 'w' : '') || 'n'; }
  function lineArgs(r) { return { tag: idText(r), sex: r.sex ? sexWord(r.sex) : '', w: r.w || '' }; }
  function ago(r) {
    var p = r.t.split(':'), q = hm(NOW).split(':'), m = (+q[0] * 60 + +q[1]) - (+p[0] * 60 + +p[1]);
    if (r.d !== dom(NOW)) return PP.t('pp.common.date.m9', { d: r.d });
    return m >= 60 ? PP.t('time.hours_ago', { n: Math.floor(m / 60) }) : PP.t('pp.id.ago.min', { n: Math.max(1, m) });
  }

  /* ---- header: the litter, the farm's scheme, and the progress door (the fact line is the door to the table) ---- */
  function progressDoor() {
    var k = distinct().length, id, args, tone;
    if (keepers) { id = closed ? 'pp.id.prog.keep_done' : 'pp.id.prog.keep'; args = { k: closed ? closed.k : k, n: alive() }; }
    else if (over()) { id = 'pp.id.prog.over'; args = { k: k, n: alive() }; tone = 'amber'; }
    else { id = 'pp.id.prog.k_of_n'; args = { k: k, n: alive() }; }
    return '<button type="button" class="id-door" data-action="open-table" data-value="' + crate + '">' + span(id, args, '', tone) + ICON.icon('chevron') + '</button>';
  }
  function header(onRun) {
    var sch = store.config.identity, d = (notch ? 'pp.id.hdr.notch_all' : keepers ? 'pp.id.hdr.tag_keep' : 'pp.id.hdr.tag_all') + (L.dayAge < sch.day ? '_early' : '');
    // On the run the header is one line (crate · day, the progress door, scan) so the whole piglet fits 360 × 740;
    // the scheme is spoken by the readout label (ear tag · notch · keeper) and printed on the table face.
    var h = onRun
      ? UI.heading({ title: '', kind: 'page', level: 1, action: progressDoor(), strs: { title: 'pp.id.hdr.title_day' }, args: { title: { crate: crate, n: L.dayAge } } })
      : UI.heading({ title: '', kind: 'page', level: 1, description: '', strs: { title: 'pp.id.hdr.title', description: d }, args: { title: { crate: crate }, description: { n: L.dayAge, due: sch.day } } });
    var scan = onRun && !notch ? UI.iconButton({ action: 'scan', icon: ICON.icon('scan'), label: PP.t('act.scan'), className: 'room-filter-button' })
      .replace('aria-label=', 'data-str-attr="aria-label:act.scan" aria-label=') : '';
    return '<header class="utility-header">' + h + scan + '</header>';
  }

  /* ---- the sex field: Candidate:Radio (the shared sex words) ---- */
  function radio(sex) {
    var opt = function (v, label) {
      return '<button type="button" class="id-radio-opt" role="radio" aria-checked="' + (sex === v) + '" data-action="sex" data-value="' + v + '">' +
        '<span class="id-radio-ring" aria-hidden="true"></span>' + span(label) + '</button>';
    };
    return '<div class="id-radio" data-ds="Candidate:Radio" data-field="sex" role="radiogroup" aria-labelledby="id-sex-label">' +
      '<span class="id-radio-label" id="id-sex-label">' + span('pp.common.sex.label') + '<small>' + span('ds.field.optional') + '</small></span>' +
      '<span class="id-radio-opts">' + opt('b', 'pp.common.sex.boar_l') + opt('g', 'pp.common.sex.gilt_l') + '</span></div>';
  }
  var measureStrs = { optional: 'ds.field.optional', value: 'ds.field.figure', unit: 'ds.field.unit.kg', placeholder: 'ds.field.placeholder' };
  function weightField() {
    var tag = run.tag.value || run.tag.suggestion;
    var label = tag ? ['pp.id.weight_of', { tag: idOf(tag) }] : ['pp.id.weight', null];
    // Weight warnings speak in the pad's status line (the pad stays on weight), so the field never changes height.
    return UI.measure({ label: '', optional: 'Optional', value: run.weight, unit: 'kg', key: 'weight', controls: 'id-pad', active: run.active === 'weight',
      strs: Object.assign({ label: label[0] }, measureStrs), args: { label: label[1] } });
  }

  /* ---- what Record will do: warnings, the re-catch plan, the idle line ---- */
  function usual() { return USUAL[L.dayAge] || USUAL[3]; }
  function warnings() {            // soft warnings; a warned Record needs a second, deliberate tap
    var out = [], v = run.tag.value;
    if (!notch && v && !run.tag.suggested && v.length < TAGLEN) out.push({ k: 'short', id: 'ds.field.numpad.short', args: { k: v.length, n: TAGLEN }, field: 'tag' });
    var w = run.weight ? SentriUI.numpadCommit(run.weight, { decimals: 2 }) : null, u = usual();
    var hit = run.tag.suggested ? null : find(v);
    var recorded = !(hit && !hit.r.dead && hit.r.w);          // a re-catch keeps its posted weight: the draft's is not recorded
    if (w && recorded && (+w < u[0] || +w > u[1])) out.push({ k: 'weight', id: 'ds.field.numpad.weight_range', args: { min: u[0].toFixed(1), max: u[1].toFixed(1), d: L.dayAge }, field: 'weight' });
    return out;
  }
  function signature() { return [run.tag.value, run.sex, run.weight].join('|'); }
  function againPlan(hit) {        // a piglet caught again: posted facts stand, only missing ones are added
    var r = hit.r, parts = [], differs = false, w = run.weight ? SentriUI.numpadCommit(run.weight, { decimals: 2 }) : null;
    if (r.sex) {
      if (run.sex && run.sex !== r.sex) { parts.push(['pp.id.again.stays', { v: sexWord(r.sex) }]); differs = true; }
      else parts.push(['pp.id.again.kept', { v: sexWord(r.sex) }]);
    } else if (run.sex) parts.push(['pp.id.again.adds', { v: sexWord(run.sex) }]);
    if (r.w) {
      if (w && +w !== +r.w) { parts.push(['pp.id.again.stays', { v: kg(r.w) }]); differs = true; }
      else parts.push(['pp.id.again.kept', { v: kg(r.w) }]);
    } else if (w) parts.push(['pp.id.again.adds', { v: kg(w) }]);
    return { parts: parts, differs: differs, adds: parts.filter(function (p) { return p[0] === 'pp.id.again.adds'; }).length };
  }
  var joinParts = function (parts) { return parts.map(function (p) { return PP.t(p[0], p[1]); }).join(' · '); };
  function status() {              // one status line: the most urgent thing Record would say, else the last recorded piglet
    var v = run.tag.value, hit = run.tag.suggested ? null : find(v);
    if (run.note) return run.note;
    if (run.armed) {
      var ws = warnings();
      if (ws.length === 2) return { id: 'pp.id.hint.two', args: { a: PP.t(ws[0].id, ws[0].args), b: PP.t(ws[1].id, ws[1].args) }, tone: 'warn' };
      if (ws.length === 1) return { id: ws[0].id, args: ws[0].args, tone: 'warn' };
    }
    if (hit && hit.r.dead) return { id: 'pp.id.hint.dead_here', args: { tag: idText(hit.r) }, tone: 'warn' };
    if (hit) {
      var p = againPlan(hit);
      var s = { id: 'pp.id.hint.again', args: { tag: idText(hit.r), i: hit.i + 1, what: joinParts(p.parts) }, tone: 'warn' };
      if (p.differs) s.actions = [{ label: '', action: 'edit-row', value: key(hit.r), strs: { label: 'pp.id.ptr.edit_piglet' }, args: { label: { i: hit.i + 1 } } }];
      return s;
    }
    var where = elsewhere(v);
    if (where) return { id: notch ? 'pp.id.hint.dup_notch' : 'ds.field.numpad.duplicate', args: { tag: idOf(v), crate: where }, tone: 'warn' };
    if (v && !run.tag.suggested && fullTag(v)) return notch ? { id: 'pp.id.hint.notch_full', args: { n: NOTCHLEN } } : { id: 'ds.field.numpad.dead_full', args: { n: TAGLEN } };
    if (!keepers && distinct().length >= alive()) {
      return { id: 'pp.id.hint.all', args: { n: alive() }, actions: [{ label: '', action: 'set-count', strs: { label: 'pp.id.ptr.set_count' }, args: { label: { n: alive() } } }] };
    }
    var last = log[log.length - 1];
    if (last) {
      var r = last.r, base = last.again ? 'pp.id.last.again' : 'pp.id.last.t' + (r.sex ? 's' : '') + (r.w ? 'w' : '') + (r.dup ? '_dup' : '');
      var a = Object.assign(lineArgs(r), { i: last.again || 0, crate: r.dup || '' });
      var mine = log.length > visitStart && r.who === ME && !last.again && !r.gone && !draftDirty();   // Undo never overwrites a draft
      return { id: base, args: a, tone: r.dup ? 'warn' : '', actions: mine ? [{ label: '', action: 'undo', strs: { label: 'pp.id.ptr.undo' } }] : [] };
    }
    if (run.tag.suggested) return { id: notch ? 'pp.id.hint.next_notch' : 'ds.field.numpad.suggested' };
    return null;
  }

  /* ---- the docked run: Candidate:CompactRun (readout + keys-only Numpad with its status line) ---- */
  var padStrs = { digit: 'ds.field.figure', decimal: 'ds.field.decimal', back: 'ds.field.aria.backspace', pad: 'ds.field.aria.pad', recent: 'ds.field.aria.recent', value: 'ds.field.figure', placeholder: 'ds.field.placeholder' };
  function readoutLabel() {
    var hit = run.tag.suggested ? null : find(run.tag.value);
    var i = hit && !hit.r.dead ? hit.i + 1 : distinct().length + 1;
    if (notch) return ['pp.id.run.notch', { i: i, n: alive(), litter: F.notchLitter }];
    if (keepers) return ['pp.id.run.keeper', { i: i }];
    if (i > alive()) return ['pp.id.run.tag_open', { i: i }];
    return ['ds.field.numpad.tag_label', { i: i, n: alive() }];
  }
  function readout() {
    // The readout is the Numpad's own run markup (label + value box), taken from the card so nothing is hand-copied.
    var lab = readoutLabel();
    var html = UI.numpad({ id: 'id-readout-src', key: 'tag', label: '', value: run.tag.value, suggested: run.tag.suggested, maxLength: notch ? NOTCHLEN : TAGLEN,
      strs: Object.assign({ label: lab[0] }, padStrs), args: { label: lab[1] } });

  function pad() {

    } else {

  function primary() {
    var hit = run.tag.suggested ? null : find(run.tag.value);

    if (hit && !hit.r.dead) return ['pp.id.act.record_again', { i: hit.i + 1 }];

  }
  function runFace() {
    var p = primary();
    return '<div class="page-background"><section class="sheet" data-ds="Sheet" data-presentation="page"' + (drawer || confirm ? ' inert' : '') + '>' + header(true) +
      '<div class="id-run"><div class="id-run-fields">' + radio(run.sex) + weightField() + '</div>' +
      '<div class="id-compact" data-ds="Candidate:CompactRun">' + pad() + '</div></div>' +
      '<footer class="sheet-footer">' + button('secondary', 'close', 'act.close') + button('primary', 'record', p[0], p[1]) + '</footer></section></div>';
  }

  /* ---- the table face: the litter's identified piglets, viewable and editable (through S8's Edit) forever ---- */
  // Boars and gilts: the ledger's `sexCounts` (identified rows by sex, plus the saved counts for piglets not identified,
  // consumed by later rows of the same sex; an unsexed row leaves the split unresolved).
  function tally() {
    var S = L.sexCounts;
    return { b: S.boars, g: S.gilts, rb: S.sexedBoars, rg: S.sexedGilts, u: S.unsexed, cb: S.residualBoars, cg: S.residualGilts, rem: S.remaining, unresolved: S.unresolved };
  }
  function factsBlock() {
    var k = distinct().length, t = tally(), hide = over() ? 'pp.id.fact.over' : t.unresolved ? 'pp.id.fact.unresolved' : '';
    var idf = keepers && !closed ? { label: 'pp.id.fact.so_far', value: 'pp.id.fact.so_far_v', args: { k: k } }
      : { label: 'pp.id.fact.identified', value: 'pp.id.fact.k_of_n', args: { k: Math.min(k, alive()), n: alive() } };
    return UI.facts([
      { label: '', value: '', meta: t.u ? '' : undefined, strs: Object.assign({ label: idf.label, value: idf.value }, t.u ? { meta: 'pp.id.fact.unsexed' } : {}), args: { value: idf.args, meta: { n: t.u } } },
      // Over alive the records cannot all be piglets, so the sex split is not printed until Edit resolves them (never past Alive).
      hide ? { label: '', value: '', meta: '', strs: { label: 'pp.id.fact.boars', value: 'ds.field.placeholder', meta: hide } } :
      { label: '', value: '', strs: { label: 'pp.id.fact.boars', value: 'ds.field.figure' }, args: { value: { n: t.b } } },
      hide ? { label: '', value: '', meta: '', strs: { label: 'pp.id.fact.gilts', value: 'ds.field.placeholder', meta: hide } } :
      { label: '', value: '', strs: { label: 'pp.id.fact.gilts', value: 'ds.field.figure' }, args: { value: { n: t.g } } }
    ], { columns: 3 });
  }
  function overStrip() {             // records over alive, and any same-tag pair even when not over
    var o = over(), p = pairs();
    if (!o && !p) return '';
    var title = o ? [PP.one('pp.id.over.title', o), { k: o }] : ['pp.id.over.pair_title', { p: p }];
    return UI.rowGroup(UI.row({ title: '', description: '', trailing: span('pp.id.over.check', null, 'id-tone', 'amber'), action: 'open-over', value: crate,
      strs: { title: title[0], description: p ? 'pp.id.over.line_pair' : 'pp.id.over.line' },
      args: { title: title[1], description: { n: alive(), rows: living().length, p: p } } }));
  }
  function keepersBlock() {
    if (!keepers) return '';
    if (closed) {                  // the closing count and stamp, not a live count; Edit (S8) reopens it, stamped
      return UI.rowGroup(UI.row({ title: '', description: '', action: 'edit-done', value: crate, strs: { title: 'pp.id.done.title', description: 'pp.id.done.line' },
        args: { title: { k: closed.k }, description: { k: closed.k, stamp: stamp({ d: dom(NOW), t: closed.t, who: closed.who }), r: Math.max(0, alive() - closed.k) } } }));
    }

    return '<button type="button" class="pp-tool" data-ds="Candidate:Tool" data-action="close-set" data-str="pp.id.act.done" data-args=\'{"k":' + distinct().length + '}\'>' +
      esc(PP.t('pp.id.act.done', { k: distinct().length })) + '</button>';
  }
  function weighSection() {
    var today = lwRecs.filter(function (x) { return x.d === dom(NOW); })[0];
    var rowsHtml = lwRecs.slice().reverse().map(function (x) {
      return UI.row({ title: '', description: '', action: x.d === dom(NOW) ? 'open-weight' : 'edit-weight', value: String(x.day),
        strs: { title: 'pp.id.lw.rec', description: 'pp.id.lw.line' }, args: { title: { day: x.day }, description: { w: x.w, stamp: stamp(x) } } });
    }).join('');
    if (!today) {
      var tr = drawerKept && drawerDirty(drawerKept) ? span('status.unsaved', { n: 1 }, 'id-tone', 'green') : span('ds.field.optional');
      rowsHtml = UI.row({ title: '', trailing: tr, action: 'open-weight', value: String(L.dayAge), strs: { title: 'pp.id.lw.rec' }, args: { title: { day: L.dayAge } } }) + rowsHtml;
    }
    var h = UI.heading({ title: '', kind: 'section', level: 3, description: receipt ? '' : undefined,
      strs: Object.assign({ title: 'pp.id.sec.weigh' }, receipt ? { description: receipt[0] } : {}), args: receipt ? { description: receipt[1] } : undefined });
    return '<section class="id-group" role="status" aria-live="polite">' + h + UI.rowGroup(rowsHtml) + '</section>';
  }
  function tableRow(r) {
    var trail = r.dead ? span('pp.id.row.dead', { cause: PP.t('dead.' + r.dead.cause), date: PP.t('pp.common.date.m9', { d: r.dead.d }) }, 'id-tone', 'red')
      : !r.dead && (r.pair || (notch && living().filter(function (x) { return key(x) === key(r); }).length > 1)) ? span('pp.id.row.pair', null, 'id-tone', 'amber')
      : r.dup ? span('pp.id.row.dup', { crate: r.dup }, 'id-tone', 'amber') : '';
    return UI.row({ title: '', description: '', trailing: trail, action: 'edit-row', value: key(r),
      strs: { title: 'pp.id.row.id', description: 'pp.id.row.' + shape(r) },
      args: { title: { id: idText(r) }, description: { sex: r.sex ? sexWord(r.sex) : '', w: r.w || '', stamp: stamp(r) } } });
  }
  function rowsSection() {
    var cur = current();

    var edit = '<button type="button" data-action="open-edit" data-value="' + crate + '" data-str="act.edit">' + esc(PP.t('act.edit')) + '</button>';
    var h = UI.heading({ title: '', kind: 'section', level: 3, meta: '', action: edit,
      strs: { title: 'pp.id.sec.rows', meta: dead ? 'pp.id.sec.rows_meta_dead' : 'pp.id.sec.rows_meta' }, args: { meta: { n: cur.length, d: dead } } });

  }
  function tableFace() {
    var body = '<div class="id-body">' + factsBlock() + overStrip() + keepersBlock() + weighSection() + rowsSection() + '</div>';
    var p = draftDirty() ? ['pp.id.act.record_resume', { n: 1 }] : ['pp.id.act.record', null];
    // A closed candidate set takes no records until Edit reopens it.

    return '<div class="page-background"><section class="sheet" data-ds="Sheet" data-presentation="page"' + (drawer || confirm ? ' inert' : '') + '>' + header(false) +
      '<div class="sheet-body">' + body + '</div>' +
      '<footer class="sheet-footer">' + bar + '</footer></section></div>';
  }

  /* ---- the weigh-day drawer: today's litter weight + boar/gilt counts for piglets not identified. Staged: Back keeps, Clear discards, Save commits ---- */
  function drawerRange() { var u = usual(); return [+(u[0] * alive()).toFixed(1), +(u[1] * alive()).toFixed(1)]; }
  function drawerState(d) {
    var v = d.w, num = parseFloat(v);
    if (v === '' || d.active) return '';
    if (num > HARD_KG * alive()) return 'refused';
    var r = drawerRange();
    return num < r[0] || num > r[1] ? 'warn' : '';
  }
  function todayRec() { return lwRecs.filter(function (x) { return x.d === dom(NOW); })[0] || null; }
  function posted() { var t = todayRec(), c = tally(); return { w: t ? t.w : '', boars: c.cb, gilts: c.cg }; }
  function wChange(d) {            // the committed weight differs from today's posted one (1.4 = 1.40); clearing is not a change
    var w = d.w === '' ? null : SentriUI.numpadCommit(d.w, { decimals: 1 }), p = posted().w;
    return !!w && (!p || +w !== +p) ? w : null;
  }
  function countsChange(d) { var p = posted(); return d.boars !== p.boars || d.gilts !== p.gilts; }
  function drawerDirty(d) { return !!wChange(d) || countsChange(d); }
  function weightDrawer() {
    var rng = drawerRange(), s = drawerState(drawer), t = tally(), rem = t.rem;
    var o = { label: '', optional: 'Optional', value: drawer.w, unit: 'kg', key: 'lw', controls: 'id-lw-pad', active: drawer.active,
      strs: Object.assign({ label: 'pp.id.lw.row' }, measureStrs), args: {} };
    if (s === 'warn') { o.range = rng; o.hint = ''; o.strs.hint = 'ds.field.measure.range'; o.args.hint = { min: rng[0].toFixed(1), max: rng[1].toFixed(1), v: kg(drawer.w) }; }
    if (s === 'refused') { o.tone = 'refused'; o.hint = ''; o.strs.hint = 'ds.field.measure.refused'; o.args.hint = { max: HARD_KG * alive(), n: alive() }; }
    var cleared = drawer.w === '' && posted().w;       // removing a posted weight is a correction: Edit, not Save
    if (cleared && !drawer.active) { o.hint = ''; o.strs.hint = 'pp.id.lw.clear_edit'; o.args.hint = { w: posted().w }; }
    var body = UI.measure(o);
    if (rem > 0) {
      var step = function (k, label, desc, v, other, fromRows) {
        var cap = rem - other, ceil = drawer.ceil === k && v >= cap;
        return UI.stepper({ label: '', description: '', value: v, min: 0, max: cap, key: k, action: 'count', draft: v > (L.sexCounts.saved || { boars: 0, gilts: 0 })[k], hint: ceil ? '' : undefined,
          strs: Object.assign({ label: label, description: desc, value: 'ds.field.figure', decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase' },
            ceil ? { hint: 'pp.id.lw.ceiling' } : {}),
          args: { description: { t: v + fromRows, k: fromRows }, hint: { r: rem } } });
      };
      body += '<div class="id-group">' + UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.id.lw.counts' }, args: { title: { r: rem } } }) +
        step('boars', 'pp.id.lw.boars', 'pp.id.lw.boars_all', drawer.boars, drawer.gilts, t.rb) +
        step('gilts', 'pp.id.lw.gilts', 'pp.id.lw.gilts_all', drawer.gilts, drawer.boars, t.rg) + '</div>';
    }
    var dirty = drawerDirty(drawer);
    var clear = dirty ? '<button type="button" data-action="clear" data-str="act.clear">' + esc(PP.t('act.clear')) + '</button>' : '';
    var head = UI.heading({ title: '', kind: 'page', level: 2, description: '', action: clear,
      strs: { title: 'pp.id.sec.weigh', description: 'pp.id.lw.sub' }, args: { description: { n: alive(), d: L.dayAge } } });
    var padActs = cleared ? [{ label: '', action: 'edit-weight', value: String(L.dayAge), strs: { label: 'pp.id.lw.edit_ptr' }, args: { label: { w: posted().w } } }] : [];
    var dock = drawer.active ? '<div class="id-dock">' + UI.numpad({ id: 'id-lw-pad', key: 'lw', value: drawer.w, decimals: 1, intLength: 2, actions: padActs, strs: Object.assign({}, padStrs) }) + '</div>' : '';
    // Save is withheld (not greyed) while nothing changed or the value is refused; the reason sits beside the value.
    var save = dirty && s !== 'refused' ? button('primary', 'save', 'act.save') : '';
    return '<div class="scrim" data-ds="Sheet" data-action="back"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="long" data-sizing="content" role="dialog" aria-modal="true">' +
      '<header class="utility-header">' + head + '</header>' +
      '<div class="sheet-body"><div class="id-drawer-body">' + body + '</div></div>' + dock +

  }
  /* ---- closing the candidate set: a confirm step (stamped; Edit reopens it) ---- */

      args: { description: { k: k, r: r } } });
    return '<div class="scrim" data-ds="Sheet" data-action="confirm-back"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="long" role="dialog" aria-modal="true">' +
      '<header class="utility-header">' + head + '</header>' +
      '<div class="sheet-body"><div class="id-drawer-body">' + UI.facts([
        { label: '', value: '', strs: { label: 'pp.id.close.tagged', value: 'ds.field.figure' }, args: { value: { n: k } } },
        { label: '', value: '', strs: { label: 'pp.id.close.none', value: 'ds.field.figure' }, args: { value: { n: r } } }
      ], { columns: 2 }) + '<div class="id-group">' + UI.rowGroup(distinct().map(function (x) {
        return UI.row({ title: '', description: '', strs: { title: 'pp.id.row.id', description: 'pp.id.row.' + shape(x) },
          args: { title: { id: idText(x) }, description: { sex: x.sex ? sexWord(x.sex) : '', w: x.w || '', stamp: stamp(x) } } });
      }).join('')) + '</div></div></div>' +
      '<footer class="sheet-footer">' + button('secondary surface-back', 'confirm-back', 'act.back') + button('primary', 'confirm-close', 'pp.id.act.done', { k: k }) + '</footer></section>';
  }

  /* ---- render: patch the DOM in place so field roots, focus and live regions survive ---- */
  function morph(from, to) {
    if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to.cloneNode(true)); return; }
    if (from.nodeType === 3) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    if (from.nodeType !== 1) return;
    var i, a;
    for (i = from.attributes.length - 1; i >= 0; i--) { a = from.attributes[i].name; if (!to.hasAttribute(a)) from.removeAttribute(a); }
    for (i = 0; i < to.attributes.length; i++) { a = to.attributes[i]; if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value); }
    var fc = Array.prototype.slice.call(from.childNodes), tc = Array.prototype.slice.call(to.childNodes);
    for (i = 0; i < tc.length; i++) { if (fc[i]) morph(fc[i], tc[i]); else from.appendChild(tc[i].cloneNode(true)); }
    for (i = fc.length - 1; i >= tc.length; i--) from.removeChild(fc[i]);
  }
  function render() {
    var screen = document.getElementById('screen');
    var t = document.createElement('div');
    t.innerHTML = (face === 'run' ? runFace() : tableFace()) + (drawer ? weightDrawer() : '') + (confirm ? confirmDrawer() : '');
    PP.apply(t);
    morph(screen, (function () { var w = screen.cloneNode(false); while (t.firstChild) w.appendChild(t.firstChild); return w; })());
  }

  /* ---- keys, scans, Record ---- */
  function typeKey(k) {
    run.note = null; run.armed = '';
    if (run.active === 'weight') {
      var w = SentriUI.numpadInput({ value: run.weight }, k, { decimals: 2, intLength: 2 });
      run.weight = w.value; run.weightTouched = true;
      if (w.dead === 'empty') run.note = { id: 'ds.field.numpad.dead_empty' };
      else if (w.dead) run.note = { id: 'ds.field.numpad.dead_places', args: { n: 2 } };
      return;
    }
    var r = SentriUI.numpadInput(run.tag, k, { maxLength: notch ? NOTCHLEN : TAGLEN });
    run.tag = { value: r.value, suggested: r.suggested, suggestion: r.suggestion };
    if (r.dead === 'empty') run.note = { id: 'ds.field.numpad.dead_empty' };
    afterTag();
  }
  function afterTag() {             // a caught-again piglet shows what its record holds; the prefill follows the tag
    var hit = run.tag.suggested ? null : find(run.tag.value);
    var k = hit && !hit.r.dead ? key(hit.r) : null;
    if (run.prefill && run.prefill.k !== k) {      // the tag moved away (backspace, another scan): untouched prefilled facts go
      if (run.prefill.sex && !run.sexTouched) run.sex = null;
      if (run.prefill.w && !run.weightTouched) run.weight = '';
      run.prefill = null;
    }
    if (k && !run.prefill) {
      run.prefill = { k: k };
      if (!run.sexTouched && hit.r.sex) { run.sex = hit.r.sex; run.prefill.sex = true; }
      if (!run.weightTouched && hit.r.w) { run.weight = hit.r.w; run.prefill.w = true; }
    }
  }
  function scanTag(digits) {
    if (notch) return;
    var r = SentriUI.numpadScan(run.tag, digits, { maxLength: TAGLEN });
    run.active = 'tag'; run.note = null; run.armed = '';
    if (r.dead) { run.note = { id: 'ds.field.numpad.dead_scan', args: { n: TAGLEN } }; return; }
    run.tag = { value: r.value, suggested: false, suggestion: r.suggestion };
    afterTag();
  }
  function rowById(id) { return rows.filter(function (r) { return r.rowId === id; })[0]; }
  function record() {
    var now = Date.now();
    if (now - lastCommit < 600 || (run.armed && now - run.armedAt < 600)) return;   // repeat taps and the warning's first 600ms are ignored
    var raw = run.tag.value, v = notch ? (raw ? String(+raw) : '') : raw;
    // A row needs its identity: a tag on a tag farm, a notch number on a notch farm. Sex and weight never block.
    if (!v) { run.active = 'tag'; run.note = { id: notch ? 'pp.id.hint.no_notch' : 'pp.id.hint.no_tag', tone: 'warn' }; render(); return; }
    var ws = warnings();
    if (ws.length && run.armed !== signature()) {
      run.armed = signature(); run.armedAt = now; run.note = null;
      run.active = ws.some(function (x) { return x.field === 'weight'; }) ? 'weight' : 'tag';
      render(); return;
    }
    lastCommit = now; run.armed = ''; run.note = null;
    var w = run.weight ? SentriUI.numpadCommit(run.weight, { decimals: 2 }) : null;
    var hit = find(v);
    if (hit && !hit.r.dead) {
      // Caught again in this pass: one piglet, one row. Missing facts are added under this stamp; posted facts stand (Edit changes them).
      var p = againPlan(hit), r = hit.r, set = {};
      if (!r.sex && run.sex) set.sex = run.sex;
      if (!r.w && w) set.weight = +w;
      if (Object.keys(set).length) commit({ op: 'edit', rowId: r.rowId, set: set });
      log.push({ r: rowById(r.rowId), again: hit.i + 1 });
      var done = p.parts.map(function (x) { return [x[0] === 'pp.id.again.adds' ? 'pp.id.again.added' : x[0], x[1]]; });
      freshPiglet();
      run.note = { id: 'pp.id.hint.again_done', args: { i: hit.i + 1, what: p.adds ? joinParts(done) : PP.t('pp.id.again.nothing') } };
      if (p.differs) run.note.actions = [{ label: '', action: 'edit-row', value: key(r), strs: { label: 'pp.id.ptr.edit_piglet' }, args: { label: { i: hit.i + 1 } } }];
      render(); return;
    }
    var e = { op: 'add', rowId: crate + '-p' + Date.now().toString(36) };
    if (notch) e.notch = F.notchLitter + '-' + v; else e.tag = v;
    if (run.sex) e.sex = run.sex;
    if (w) e.weight = +w;
    var res = commit(e);
    // The ledger refuses a row past Alive from this phone: every alive piglet is identified (Set count if one more is here).
    if (!res.ok) { run.note = res.reason === 'more_rows_than_alive' ? { id: 'pp.id.hint.all', args: { n: alive() }, actions: [{ label: '', action: 'set-count', strs: { label: 'pp.id.ptr.set_count' }, args: { label: { n: alive() } } }] } : { id: 'pp.id.hint.refused', tone: 'warn' }; render(); return; }
    log.push({ r: rowById(res.event.rowId) });
    freshPiglet();
    render();
  }
  function undo() {                // the newest row of this visit, by this hand: withdrawn (stamped), back on the pad to fix
    var last = log[log.length - 1];
    if (!last || last.again || last.r.who !== ME || log.length <= visitStart || draftDirty()) return;
    var r = last.r;
    if (!commit({ op: 'withdraw', rowId: r.rowId }).ok) return;
    log.pop();
    run.tag = { value: notch ? String(r.n) : r.tag, suggested: false, suggestion: nextSuggestion() };
    run.sex = r.sex; run.sexTouched = true; run.weight = r.w || ''; run.weightTouched = true; run.active = 'tag'; run.armed = '';
    run.note = { id: 'pp.id.hint.undone', args: { tag: idText(r) } };
  }

  var scanner = SentriUI.numpadScanner({
    onKey: function (k) { if (store && face === 'run' && !drawer && !confirm) { typeKey(k); render(); } },
    onScan: function (d) { if (store && face === 'run' && !drawer && !confirm) { scanTag(d); render(); } }
  });
  document.addEventListener('keydown', function (ev) { if (store && face === 'run' && !drawer && !confirm && scanner.handle(ev)) ev.preventDefault(); });

  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action, v = b.dataset.value;
    if (a === 'numpad') {
      if (v === 'lw') drawer.w = SentriUI.numpadInput({ value: drawer.w }, b.dataset.key, { decimals: 1, intLength: 2 }).value;
      else typeKey(b.dataset.key);
      render();
    } else if (a === 'numpad-suggestion') { typeKey('suggestion'); render(); }
    else if (a === 'scan') { scanTag(st.scan || run.tag.suggestion || BAG[crate] || ''); render(); }
    else if (a === 'open-numpad') {
      if (v === 'lw') { if (!drawer.active) { drawer.active = true; render(); } return; }
      if (run.active !== 'weight') { run.active = 'weight'; run.note = null; render(); }
    }
    else if (a === 'to-tag') { run.active = 'tag'; render(); }
    else if (a === 'sex') {
      run.sexTouched = true; run.armed = ''; run.note = null;
      run.sex = run.sex === v ? null : v;             // optional: tapping the chosen one again clears it
      render();
    }
    else if (a === 'record') record();
    else if (a === 'undo') { undo(); render(); }
    else if (a === 'close-set') { if (!over() && !pairs()) { confirm = true; render(); } }
    else if (a === 'confirm-back') { confirm = false; render(); }
    else if (a === 'confirm-close') { if (commit({ op: 'close' }).ok) confirm = false; render(); }
    else if (a === 'open-table') { face = 'table'; receipt = null; render(); }
    else if (a === 'open-run') { if (keepers && closed) return; face = 'run'; if (!draftDirty()) freshPiglet(); render(); }   // an unfinished piglet resumes
    else if (a === 'open-weight') {
      var t = todayRec(), c = tally();              // opens clamped: counts already consumed by records are not offered again
      drawer = drawerKept || { w: t ? t.w : '', active: !t, boars: c.cb, gilts: c.cg }; render();
    }
    else if (a === 'count') {
      drawer.active = false;
      if (b.getAttribute('aria-disabled') === 'true') { drawer.ceil = +b.dataset.step > 0 ? v : ''; render(); return; }
      drawer.ceil = ''; drawer[v] += +b.dataset.step; render();
    }
    else if (a === 'back') { drawer.active = false; drawerKept = drawerDirty(drawer) ? drawer : null; drawer = null; render(); }
    else if (a === 'clear') { var tr = todayRec(), tc = tally(); drawer = { w: tr ? tr.w : '', active: false, boars: tc.cb, gilts: tc.cg }; drawerKept = null; render(); }
    else if (a === 'save') {
      drawer.active = false;
      if (drawerState(drawer) === 'refused' || !drawerDirty(drawer)) { render(); return; }
      // Only what changed is saved. One record per weigh day: a second weighing today replaces today's value
      // (the later stamp stands; the record keeps both).
      var w = wChange(drawer), cb = countsChange(drawer), wChanged = !!w, evs = [];
      if (wChanged) evs.push({ type: 'litter_weight', litter: crate, kg: w, day: L.dayAge });
      if (cb) evs.push({ type: 'sex_counts', litter: crate, boars: drawer.boars, gilts: drawer.gilts });
      var res = store.commitAll(evs);
      if (!res.ok) { render(); return; }
      reload(); loadWeights();
      var bg = { b: PP.tn('pp.id.n_boars', drawer.boars), g: PP.tn('pp.id.n_gilts', drawer.gilts) };
      receipt = wChanged && cb ? ['pp.id.rcpt.both', Object.assign({ w: w }, bg)] : wChanged ? ['pp.id.rcpt.weight', { w: w }] : ['pp.id.rcpt.counts', bg];
      drawer = null; drawerKept = null; render();
    }
    else if (a === 'close') { location.href = PP.href('litter.html', { state: 'litter', crate: crate, data: store.name !== 'base' ? store.name : '' }); }
    // Edit (ticket #12): a row opens its correction drawer; Edit and the closed set open the litter's one Edit screen.
    else if (a === 'edit-row' || a === 'open-edit' || a === 'edit-done') { location.href = PP.href('edit.html', { state: 'edit', crate: crate, row: a === 'edit-row' ? v : '', from: 'id', data: store.name }); }
    else document.documentElement.setAttribute('data-door', a + ':' + (v || ''));
  });

  /* ---- initial state ---- */
  PP.ready.then(function () {
    store = PP.open(st.data);
    crate = qs.get('crate') || st.l;
    if (qs.get('sow')) crate = store.crateOfSow(qs.get('sow')) || crate;
    F = store.sow(crate) || {};
    notch = store.config.identity.scheme === 'notch'; keepers = store.config.identity.who === 'candidates';
    NOW = store.today + 'T10:30';
    reload();
    loadWeights();
    // Every row already in, oldest first: the status line reads the newest; this visit starts after them.
    log = rows.filter(function (r) { return !r.gone; }).slice().sort(function (x, y) { return x.d - y.d || (x.t < y.t ? -1 : x.t > y.t ? 1 : 0); }).map(function (r) { return { r: r }; });
    visitStart = log.length;
    freshPiglet();
    if (st.tag) { run.tag = { value: st.tag, suggested: false, suggestion: run.tag.suggestion }; afterTag(); }
    if (st.scan) scanTag(st.scan);
    if (st.sex) { run.sex = st.sex; run.sexTouched = true; }
    if (st.weight) { run.weight = st.weight; run.weightTouched = true; }
    if (st.active) run.active = st.active;
    render();
    if (st.press === 'record') record();
    if (st.open === 'weight') { var t0 = todayRec(), c0 = tally(); drawer = { w: t0 ? t0.w : '', active: false, boars: c0.cb, gilts: c0.cg }; render(); }
    // Resuming another hand's litter: the status line says whose piglets are already in, until the first key.
    var lastRow = log.length ? log[log.length - 1].r : null;
    if (face === 'run' && !run.note && lastRow && lastRow.who !== ME && run.tag.suggested && !st.press) {
      run.note = { id: 'pp.id.hint.resume', args: { k: living().length, who: lastRow.who, when: ago(lastRow) } };
      render();
    }
  });
})();
</script>
</body>
