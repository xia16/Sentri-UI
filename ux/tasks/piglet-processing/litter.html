<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litter sheet</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<style>
/* Layout, tokens from tokens.css. Candidate compositions: TreatmentRow, StatusWord, Receipt, Radio, EvidenceRow. */
.lt-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.lt-phone .scrim { inset: 0; }
.lt-title { flex: 1; min-width: 0; }
.lt-mono { font-family: var(--font-mono); }
.lt-body { display: flex; flex-direction: column; gap: var(--space-section); }
.lt-body > * { margin: 0; }
.lt-group > * + * { margin-top: var(--space-heading); }
.lt-tools { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-footer-gap); }
.lt-drawer-body { display: flex; flex-direction: column; gap: var(--space-row-y); }
/* The identity header door (S10's) and the TreatmentRow's left door: a bare button around text + ›. */
.lt-door { display: inline-flex; align-items: center; gap: var(--space-key-gap); min-height: var(--touch-min); padding: 0; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-align: left; }
.lt-door svg { width: var(--glyph-key); height: var(--glyph-key); flex: none; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
/* Candidate:TreatmentRow — Row anatomy with two targets: the copy opens the dose, the button records it. */
.lt-tx .lt-door { flex: 1; min-width: 0; align-self: stretch; }
.lt-tx .lt-door .st-row-copy { flex: 1; min-width: 0; }
.st-row.lt-tx .st-row-copy strong { display: flex; align-items: center; gap: var(--space-key-gap); }
.lt-tx .button { flex: none; min-height: var(--touch-min); }
/* Candidate:EvidenceRow — a done Row whose evidence line wraps instead of truncating. */
.st-row.lt-rec .st-row-copy small { white-space: normal; }
/* Candidate:StatusWord — colour on the value inside a line; the word stays ink. */
.lt-tone[data-tone="red"] { color: var(--red); }
.lt-tone[data-tone="amber"] { color: var(--amber); }
.lt-tone[data-tone="green"] { color: var(--green); }
/* Candidate:Receipt — the receipt line is body text; its value carries the colour. */
.lt-receipt { display: flex; flex-wrap: wrap; column-gap: var(--status-dot); margin: 0; font-size: var(--type-row-title-size); line-height: 1.5; color: var(--ink); }
/* Candidate:Radio — the craft pass's visible radio: a ring, and an ink dot when chosen. */
.lt-radio { display: block; box-sizing: border-box; width: var(--glyph-pad); height: var(--glyph-pad); border: var(--caret-width) solid var(--control-border); border-radius: 50%; }
[aria-checked="true"] .lt-radio { border-color: var(--ink); background: var(--ink); box-shadow: inset 0 0 0 var(--caret-width) var(--paper); }
[aria-checked="true"] .st-choice-label { font-weight: 600; }
/* Button has no aria-disabled face; Save keeps its place and takes the disabled fill while it waits. */
.lt-phone .sheet-footer .button.primary[aria-disabled="true"] { background: var(--disabled-fill); border-color: var(--disabled-fill); color: var(--disabled-ink); }
</style>
</head>
<body>
<main class="inspection-phone lt-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  var UI = window.SentriUI, ICON = window.SentriIcons;
  var zh = PP.lang === 'zh';
  var ME = 'G.H';

  /* ---- fixtures: every number printed comes from here. Today is Sep 29. ----
     The farm's schedule (console): iron day 3 and iron day 14 are two doses; teeth, tail and
     coccidiosis close after day 7 (their last age-day); castration day 3. The console's current
     product + dose is snapshotted onto each record at commit and printed from the record. */
  var SCHEDULE = [
    { id: 'iron3', tx: 'iron', due: 3, product: 'iron' },
    { id: 'teeth', tx: 'teeth', due: 3, last: 7 },
    { id: 'tail', tx: 'tail', due: 3, last: 7 },
    { id: 'castrate', tx: 'castrate', due: 3, castrate: true },
    { id: 'cocci', tx: 'coccidiosis', due: 3, last: 7, product: 'cocci' },
    { id: 'iron14', tx: 'iron', due: 14, product: 'iron' }
  ];
  var LITTERS = {
    A02: { crate: 'A02', tag: '000231', parity: 3, day: 3, bornOn: 26, born: 13, alive: 12, dead: 1, idDone: 0 },
    A05: { crate: 'A05', tag: '000240', parity: 4, day: 3, bornOn: 26, born: 12, alive: 11, dead: 1, idDone: 0 },
    A07: { crate: 'A07', tag: '000245', parity: 2, day: 3, bornOn: 26, born: 9, alive: 8, dead: 1, idDone: 0 },
    B01: { crate: 'B01', tag: '000187', parity: 5, day: 5, bornOn: 24, born: 14, alive: 13, dead: 1, idDone: 13, weightMissing: true },
    B03: { crate: 'B03', tag: '000199', parity: 3, day: 7, bornOn: 22, born: 12, alive: 11, dead: 1, idDone: 11 },
    B04: { crate: 'B04', tag: '000254', parity: 2, day: 9, bornOn: 20, born: 12, alive: 10, dead: 2, idDone: 10 },
    C04: { crate: 'C04', tag: '000266', parity: 1, day: 2, bornOn: 27, born: 10, alive: 9, dead: 1 }
  };
  // A record: { dose, n, t, date (null = today), who, prod (snapshot key), visit (made on this phone this visit),
  //   deferred: {n, reason}, castr: {c, hernia, cryptorchid, deferred, kept, why, none}, collision }
  function R(dose, n, t, who, o) {
    var d = dose && SCHEDULE.filter(function (x) { return x.id === dose; })[0];
    return Object.assign({ dose: dose, n: n, t: t, who: who, date: null, prod: d && d.product }, o || {});
  }
  function C(c, o) { return Object.assign({ c: c, hernia: 0, cryptorchid: 0, deferred: 0, kept: 0, why: '' }, o || {}); }
  var V = { visit: true };
  var STATES = {
    'litter':         { l: 'A02', recs: [] },
    'litter-partial': { l: 'A02', recs: [R('teeth', 12, '08:40', 'L.M'), R('iron3', 12, '09:14', ME, V)], receipt: ['saved', 'iron3', 12] },
    'draft-waiting':  { l: 'A02', recs: [], drafts: { iron3: { dose: 'iron3', n: 10, reason: '' } } },
    'litter-short-count': { l: 'A02', recs: [], drawer: { dose: 'iron3', n: 10, reason: '' } },
    'litter-short-saved': { l: 'A02', recs: [R('iron3', 10, '09:14', ME, { visit: true, deferred: { n: 2, reason: 'weak' } })], receipt: ['deferred', 'iron3', 10, 2] },
    'castrate':       { l: 'A02', recs: [R('iron3', 12, '09:14', ME), R('teeth', 12, '09:15', ME), R('tail', 12, '09:16', ME)],
                        drawer: { dose: 'castrate', castr: C(3, { hernia: 1, deferred: 2, why: 'weak' }) } },
    'castrate-saved': { l: 'A02', recs: [R('iron3', 12, '09:14', ME), R('teeth', 12, '09:15', ME), R('tail', 12, '09:16', ME),
                        R('castrate', 3, '09:20', ME, { visit: true, castr: C(3, { hernia: 1, deferred: 2, why: 'weak' }) })], receipt: ['castr', 'castrate', 3, 3] },
    'castrate-catchup': { l: 'B03', recs: [R('iron3', 13, '07:50', 'L.M', { date: 27 }), R('teeth', 13, '07:50', 'L.M', { date: 27 }), R('tail', 13, '07:52', 'L.M', { date: 27 }),
                        R('cocci', 13, '07:55', 'L.M', { date: 27 }), R('castrate', 4, '08:02', 'L.M', { date: 27, castr: C(4, { cryptorchid: 1, deferred: 2, why: 'sick' }) })],
                        drawer: { dose: 'castrate', castr: C(1, { deferred: 1, why: 'sick' }) } },
    'castrate-none':  { l: 'A07', recs: [R('iron3', 8, '09:30', ME), R('castrate', 0, '09:31', ME, { visit: true, castr: C(0, { none: true }) })], receipt: ['castr_none', 'castrate'] },
    'done-by-other':  { l: 'A02', recs: [R('iron3', 12, '08:40', 'L.M')], receipt: ['already', 'iron3', 0, 0, '08:40', 'L.M'] },
    'stale-tap':      { l: 'A02', recs: [R('iron3', 10, '09:10', 'L.M', { deferred: { n: 2, reason: 'sick' } })], receipt: ['stale', 'iron3', 10, 2, '09:10', 'L.M'] },
    'early':          { l: 'C04', recs: [R('iron3', 9, '09:30', ME, V)], receipt: ['early', 'iron3', 9] },
    'late':           { l: 'B01', recs: [R('teeth', 13, '07:50', 'L.M', { date: 27 }), R('tail', 13, '07:52', 'L.M', { date: 27 })] },
    'missed':         { l: 'B04', recs: [R('iron3', 10, '08:05', ME, { date: 23, prod: 'iron_old' }), R('teeth', 10, '08:06', ME, { date: 23 }), R('tail', 10, '08:07', ME, { date: 23 }),
                        R('castrate', 5, '08:12', ME, { date: 23, castr: C(5, { hernia: 1 }) })] },
    'snapshot-kept':  { l: 'B04', recs: [R('iron3', 10, '08:05', ME, { date: 23, prod: 'iron_old' }), R('teeth', 10, '08:06', ME, { date: 23 }), R('tail', 10, '08:07', ME, { date: 23 }),
                        R('castrate', 5, '08:12', ME, { date: 23, castr: C(5, { hernia: 1 }) })], drawer: { dose: 'iron14', n: 10, reason: '' } },
    'double-flag':    { l: 'A05', recs: [R('teeth', 11, '08:40', 'L.M'), R('iron3', 11, '08:40', 'L.M', { collision: true }), R('iron3', 11, '08:52', ME, { collision: true })] },
    'all-done':       { l: 'A02', recs: [R('iron3', 12, '09:14', ME), R('teeth', 12, '09:15', ME), R('tail', 12, '09:16', ME),
                        R('castrate', 5, '09:20', ME, { castr: C(5, { hernia: 1 }) }), R('cocci', 12, '09:22', ME, V)], receipt: ['saved', 'cocci', 12] }
  };
  // The room list links litter.html?state=litter&crate=<code>: each crate opens its own face.
  var CRATE_STATE = { A02: 'litter', A05: 'double-flag', A07: 'castrate-none', B01: 'late', B03: 'castrate-catchup', B04: 'missed', C04: 'early' };
  var qs = new URLSearchParams(location.search);
  var name = STATES[PP.state] ? PP.state : 'litter';
  if (name === 'litter' && CRATE_STATE[qs.get('crate')]) name = CRATE_STATE[qs.get('crate')];
  var st = STATES[name];
  var L = Object.assign({}, LITTERS[st.l]);
  var recs = st.recs.map(function (r) { return JSON.parse(JSON.stringify(r)); });
  var receipt = st.receipt || null;
  var drawer = st.drawer ? JSON.parse(JSON.stringify(st.drawer)) : null;
  var drafts = st.drafts ? JSON.parse(JSON.stringify(st.drafts)) : {};   // Back keeps a drawer's draft on the device, per dose
  var clock = 60 * 9 + 23;             // the next record stamps 09:24, then onward (minutes)
  var lastCommit = 0, drawerClosedAt = 0, ceilTap = '';

  /* ---- the ledger for one dose ---- */
  function dose(id) { return SCHEDULE.filter(function (d) { return d.id === id; })[0]; }
  function recsOf(id) { return recs.filter(function (r) { return r.dose === id; }); }
  // Owed is a stored count per scheduled dose: every live piglet until a record; then each record
  // leaves only its deferred piglets (castration: its deferred males). Shown as min(owed, alive).
  function owedStored(d) {
    var o = d.castrate ? null : L.alive;
    recsOf(d.id).forEach(function (r) {
      if (r.castr) o = r.castr.deferred;
      else o = r.deferred ? r.deferred.n : Math.max(0, (o == null ? L.alive : o) - r.n);
    });
    return o;
  }
  function owed(d) {
    var o = owedStored(d);
    if (o == null) return { n: null };
    var last = recsOf(d.id).filter(function (r) { return r.deferred || (r.castr && r.castr.deferred); }).pop();
    var reason = last ? (last.deferred ? last.deferred.reason : last.castr.why) : '';
    return { n: Math.min(o, L.alive), reason: o ? reason : '' };
  }
  function isDone(d) { return owed(d).n === 0; }
  function status(d) {
    if (d.due > L.day) return 'later';
    if (d.last != null && L.day > d.last) return 'missed';
    if (L.day > d.due) return 'late';
    return 'due';
  }
  function recDay(r) { return r.date ? L.day - (29 - r.date) : L.day; }
  function visitRec(d) { return recsOf(d.id).filter(function (r) { return r.visit; }).pop(); }

  /* ---- strings ---- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function span(id, args, tone) {
    return '<span' + (tone ? ' class="lt-tone" data-ds="Candidate:StatusWord" data-tone="' + tone + '"' : '') + ' data-str="' + id + '"' +
      (args ? " data-args='" + esc(JSON.stringify(args)) + "'" : '') + '>' + esc(PP.t(id, args)) + '</span>';
  }
  var SEP = function () { return ' ' + span('pp.litter.sep') + ' '; };
  var one = function (base, n) { return base + (n === 1 && !zh ? '.one' : '.many'); };
  var pigs = function (n) { return PP.tn('pp.common.unit.piglet', n); };
  // Both iron doses carry their day everywhere (`Iron · day 3`, `Iron · day 14`).
  function title(d) { return d.tx === 'iron' ? ['pp.litter.tx_day', { tx: PP.t('pp.common.tx.iron'), d: d.due }] : ['pp.common.tx.' + d.tx, null]; }
  function titleText(d) { var t = title(d); return PP.t(t[0], t[1]); }
  function stamp(r) {
    return r.date ? PP.t('pp.litter.stamp.date', { d: r.date, t: r.t, who: r.who }) : PP.t('pp.litter.stamp.today', { t: r.t, who: r.who });
  }
  function reasonName(k) { return PP.t('pp.litter.why.' + k); }
  function castrLine(c) {
    if (c.none) return PP.t('pp.litter.castr.none_line');
    var not = [], k = 0;
    ['hernia', 'cryptorchid', 'deferred', 'kept'].forEach(function (x) { if (c[x]) { not.push([x, c[x]]); k += c[x]; } });
    var label = function (x) { return x === 'deferred' && c.why ? PP.t('pp.litter.castr.deferred_why', { reason: reasonName(c.why) }) : reasonName(x); };
    // One reason: `not castrated 1: hernia`; several: `not castrated 3: hernia 1, deferred (weak) 2`.
    not = not.length === 1 ? [label(not[0][0])] : not.map(function (p) { return PP.t('pp.litter.castr.part', { n: p[1], reason: label(p[0]) }); });
    return k ? PP.t('pp.litter.castr.line', { c: c.c, k: k, why: not.join(zh ? '，' : ', ') }) : PP.t('pp.litter.castr.line_all', { c: c.c });
  }
  // The record's own evidence, printed from the record (its product snapshot, never the console's current one).
  function evidence(r) {
    var prod = r.prod ? PP.t('pp.litter.product.' + r.prod) : '';
    if (r.castr) return ['pp.litter.done.castr', { stamp: stamp(r), what: castrLine(r.castr) }];
    if (r.deferred) return [prod ? 'pp.litter.done.deferred_prod' : 'pp.litter.done.deferred', { stamp: stamp(r), pigs: pigs(r.n), k: r.deferred.n, reason: reasonName(r.deferred.reason), prod: prod }];
    return [prod ? 'pp.litter.done.prod' : 'pp.litter.done', { stamp: stamp(r), pigs: pigs(r.n), prod: prod }];
  }
  function recTag(r) {
    var d = dose(r.dose);
    if (r.collision) return ['pp.litter.flag.double_short', null, 'amber'];
    if (d.last != null && recDay(r) > d.last) return ['pp.litter.tag.after', { d: d.last }, ''];
    if (recDay(r) < d.due) return ['pp.litter.tag.early', null, ''];
    if (recDay(r) > d.due) return ['pp.litter.tag.late', null, ''];
    return null;
  }
  function evidenceRow(r) {
    var t = title(dose(r.dose)), e = evidence(r), tag = recTag(r);
    var trail = tag ? (tag[2] ? span(tag[0], tag[1], tag[2]) : span(tag[0], tag[1])) : '';
    return UI.row({ title: '', description: '', trailing: trail, className: 'lt-rec', strs: { title: t[0], description: e[0] }, args: { title: t[1], description: e[1] } })
      .replace('data-ds="Row"', 'data-ds="Candidate:EvidenceRow"');
  }

  /* ---- header: S10's identity header, crate first (the first fact), the one door to the sow page ---- */
  function header() {
    var a = { crate: L.crate, tag: L.tag };
    return '<header class="utility-header"><div class="lt-title"><h3><button type="button" class="lt-door" data-action="open-sow" data-value="' + L.tag +
      '" data-str-attr="aria-label:pp.litter.hdr.sow_aria" data-args=\'' + JSON.stringify(a) + '\'>' + '<span class="lt-mono">' + span('pp.litter.hdr.door', a) + '</span>' + ICON.icon('chevron') + '</button></h3>' +
      '<p>' + span('pp.litter.hdr.parity', { n: L.parity }) + '</p></div></header>';
  }
  // The fact line is the door to the litter's record page (History is the chevron on the fact line); day-age beside it.
  function factLine() {
    return UI.rowGroup(UI.row({ title: '', description: '', action: 'open-record', value: L.crate,
      strs: { title: 'pp.litter.factline', description: 'pp.litter.factline.day' },
      args: { title: { born: L.born, alive: L.alive, dead: L.dead }, description: { n: L.day, d: L.bornOn } } }));
  }
  // Tools under the counter (farrowing's record): the two quick acts on the litter's numbers.
  function tools() {
    return '<div class="lt-tools">' +
      '<button type="button" class="button secondary" data-ds="Button" data-action="open-dead" data-value="' + L.crate + '" data-str="act.record_dead">' + esc(PP.t('act.record_dead')) + '</button>' +
      '<button type="button" class="button secondary" data-ds="Button" data-action="open-count" data-value="' + L.crate + '" data-str="pp.count.title">' + esc(PP.t('pp.count.title')) + '</button></div>';
  }

  /* ---- owed today ---- */
  function owedLine(d, o) {
    var s = status(d), parts = [];
    if (drafts[d.id]) return span('status.unsaved', { n: 1 }, 'green');
    if (s === 'due') parts.push(span('pp.litter.due', { d: d.due }));
    // Colour on the value, the word ink: `late 2 days`, `missed after day 7`.
    if (s === 'late') parts.push(span('pp.litter.tag.late') + ' ' + span(one('pp.litter.days', L.day - d.due), { k: L.day - d.due }, 'red'));
    if (s === 'missed') parts.push(span('pp.litter.missed_word') + ' ' + span('pp.litter.missed_day', { d: d.last }, 'red'));
    if (o.reason) parts.push(span(d.castrate ? one('pp.litter.owed_males_reason', o.n) : 'pp.litter.owed_reason', { n: o.n, reason: reasonName(o.reason) }));
    else if (o.n != null) parts.push(span('pp.litter.owed', { n: o.n }));
    return parts.join(SEP());
  }
  function txRow(d) {
    var o = owed(d), t = title(d);
    // Castration before its first record: males are unknown, so there is no one-tap; the whole row is the door and says so.
    if (o.n == null) {
      return '<button type="button" class="st-row lt-tx" data-ds="Candidate:TreatmentRow" data-action="open-dose" data-value="' + d.id + '"><span class="st-row-copy"><strong>' +
        span(t[0], t[1]) + '</strong><small>' + owedLine(d, o) + '</small></span><span class="st-row-trailing">' + span(drafts[d.id] ? 'pp.litter.act.resume' : 'pp.litter.castr.door') +
        '</span><span class="st-row-chevron">' + ICON.icon('chevron') + '</span></button>';
    }
    var door = '<button type="button" class="lt-door" data-action="open-dose" data-value="' + d.id + '"><span class="st-row-copy"><strong>' +
      span(t[0], t[1]) + ICON.icon('chevron') + '</strong><small>' + owedLine(d, o) + '</small></span></button>';
    // A waiting draft replaces the one-tap: no full-count commit competes with it.
    var btn = drafts[d.id]
      ? '<button type="button" class="button secondary" data-ds="Button" data-action="open-dose" data-value="' + d.id + '" data-str="pp.litter.act.resume">' + esc(PP.t('pp.litter.act.resume')) + '</button>'
      : '<button type="button" class="button secondary" data-ds="Button" data-action="record" data-value="' + d.id + '" data-n="' + o.n + '" data-str="' + one('pp.litter.act.record_n', o.n) + '" data-args=\'{"n":' + o.n + '}\'>' + esc(PP.t(one('pp.litter.act.record_n', o.n), { n: o.n })) + '</button>';
    return '<div class="st-row lt-tx" data-ds="Candidate:TreatmentRow">' + door + btn + '</div>';
  }
  // Nothing moves under the thumb: a dose recorded this visit keeps its place and turns into its stamp.
  function placeRow(d) {
    var r = visitRec(d);
    if (r && isDone(d)) return evidenceRow(r);
    return txRow(d);
  }
  function receiptLine() {
    if (!receipt) return '';
    var k = receipt[0], d = dose(receipt[1]), tx = titleText(d);
    tx = zh ? tx : tx.charAt(0).toLowerCase() + tx.slice(1);        // `Saved · iron · day 3 · 12 piglets`
    var pre, val, valTone = 'green', post = null;
    if (k === 'castr') { pre = ['pp.litter.rcpt.saved', { tx: tx }]; val = ['pp.litter.rcpt.castrated', { c: receipt[2] }]; post = ['pp.litter.rcpt.not_castrated', { k: receipt[3] }]; }
    else if (k === 'castr_all') { pre = ['pp.litter.rcpt.saved', { tx: tx }]; val = ['pp.litter.rcpt.castrated', { c: receipt[2] }]; }
    else if (k === 'castr_none') { pre = ['pp.litter.rcpt.saved', { tx: tx }]; val = ['pp.litter.castr.none_line', null]; }
    else if (k === 'already') { pre = ['pp.litter.rcpt.already', { tx: tx, t: receipt[4], who: receipt[5] }]; val = ['pp.litter.rcpt.nothing', null]; valTone = ''; }
    else if (k === 'stale') { pre = ['pp.litter.rcpt.stale', { tx: tx, t: receipt[4], who: receipt[5], m: receipt[2] }]; val = ['pp.litter.rcpt.now_owed', { n: receipt[3] }]; valTone = 'amber'; }
    else {
      pre = ['pp.litter.rcpt.saved', { tx: tx }]; val = [one('pp.common.unit.piglet', receipt[2]), { n: receipt[2] }];
      if (k === 'deferred') post = ['pp.litter.rcpt.deferred', { k: receipt[3] }];
      if (k === 'late') post = ['pp.litter.rcpt.late', null];
      if (k === 'early') post = ['pp.litter.rcpt.early', null];
    }
    return '<p class="lt-receipt" data-ds="Candidate:Receipt" role="status" aria-live="polite">' + span(pre[0], pre[1]) + ' ' + span(val[0], val[1], valTone || null) + (post ? ' ' + span(post[0], post[1]) : '') + '</p>';
  }
  function owedSection() {
    var today = SCHEDULE.filter(function (d) { return status(d) !== 'later'; });
    var shown = today.filter(function (d) { return !isDone(d) || visitRec(d); });
    var left = today.filter(function (d) { return !isDone(d); }).length;
    var h = UI.heading({ title: '', kind: 'section', level: 3, meta: left ? '' : undefined,
      strs: Object.assign({ title: 'pp.litter.section.owed' }, left ? { meta: 'pp.litter.owed.meta' } : {}),
      args: left ? { meta: { left: left, total: today.length } } : undefined });
    var rows = shown.map(placeRow).join('');
    if (!left) {
      var next = SCHEDULE.filter(function (d) { return status(d) === 'later' && !isDone(d); })[0];
      rows += UI.row({ title: '', description: next ? '' : undefined, strs: Object.assign({ title: 'pp.litter.owed.none' }, next ? { description: next.due - L.day === 1 ? 'pp.litter.next.tomorrow' : 'pp.litter.next.in' } : {}),
        args: next ? { description: { tx: zh ? titleText(next) : titleText(next).toLowerCase(), k: next.due - L.day } } : undefined });
    }
    return '<section class="lt-group" data-ds="Section">' + h + receiptLine() + UI.rowGroup(rows) + '</section>';
  }

  /* ---- recorded: one row per record, never merged; records made this visit settle here when the sheet is left ---- */
  function recordedSection() {
    var xs = recs.filter(function (r) { return !r.visit; });
    if (!xs.length) return '';
    var order = xs.slice().sort(function (a, b) { return (b.date || 99) - (a.date || 99) || (a.t < b.t ? 1 : -1); });
    var col = SCHEDULE.filter(function (d) { return recsOf(d.id).some(function (r) { return r.collision; }); });
    var edit = '<button type="button" data-action="open-edit" data-value="' + L.crate + '" data-str="act.edit">' + esc(PP.t('act.edit')) + '</button>';
    var h = UI.heading({ title: '', kind: 'section', level: 3, action: edit, description: col.length ? '' : undefined,
      strs: Object.assign({ title: 'pp.litter.section.recorded' }, col.length ? { description: 'pp.litter.flag.double' } : {}),
      args: col.length ? { description: { tx: titleText(col[0]) } } : undefined });
    return '<section class="lt-group" data-ds="Section">' + h + UI.rowGroup(order.map(evidenceRow).join('')) + '</section>';
  }

  /* ---- litter notes: hernia and cryptorchid from castration ---- */
  function notesSection() {
    var rows = [];
    recs.forEach(function (r) {
      if (!r.castr) return;
      ['hernia', 'cryptorchid'].forEach(function (x) {
        if (r.castr[x]) rows.push(UI.row({ title: '', description: '', strs: { title: 'pp.litter.reason.' + x, description: 'pp.litter.note.line' },
          args: { description: { pigs: pigs(r.castr[x]), stamp: stamp(r) } } }));
      });
    });
    if (!rows.length) return '';
    return '<section class="lt-group" data-ds="Section">' + UI.heading({ title: '', kind: 'section', level: 3, strs: { title: 'pp.litter.section.notes' } }) + UI.rowGroup(rows.join('')) + '</section>';
  }

  /* ---- later: future doses; early is deliberate (open, then Save) ---- */
  function laterSection() {
    var xs = SCHEDULE.filter(function (d) { return status(d) === 'later' && (!isDone(d) || visitRec(d)); });
    if (!xs.length) return '';
    var rows = xs.map(function (d) {
      if (visitRec(d) && isDone(d)) return evidenceRow(visitRec(d));
      var k = d.due - L.day, t = title(d);
      return UI.row({ title: '', description: '', action: 'open-dose', value: d.id,
        strs: { title: t[0], description: drafts[d.id] ? 'status.unsaved' : k === 1 ? 'pp.litter.later.tomorrow' : 'pp.litter.later.in' },
        args: { title: t[1], description: drafts[d.id] ? { n: 1 } : { d: d.due, k: k } } });
    });
    return '<section class="lt-group" data-ds="Section">' + UI.heading({ title: '', kind: 'section', level: 3, strs: { title: 'pp.litter.section.later' } }) + UI.rowGroup(rows.join('')) + '</section>';
  }

  /* ---- the other acts on this litter: S10's Record group (Record dead and Set count moved up to the tools) ---- */
  function recordGroup() {
    var r = function (action, t, desc, descArgs, trail) {
      return UI.row({ title: '', description: desc ? '' : undefined, trailing: trail ? '' : undefined, action: action, value: L.crate,
        strs: Object.assign({ title: t }, desc ? { description: desc } : {}, trail ? { trailing: trail } : {}), args: desc ? { description: descArgs } : undefined });
    };
    var rows = r('open-move', 'pp.move.title', 'pp.litter.desc.move');
    if (L.idDone != null) rows += r('open-identity', 'pp.litter.act.identity', 'pp.litter.id.line', { k: L.idDone, n: L.alive });
    if (L.weightMissing) rows += r('open-weight', 'pp.litter.act.weight', null, null, 'pp.litter.weight.optional');
    return '<section class="lt-group" data-ds="Section">' + UI.heading({ title: '', kind: 'group', level: 3, strs: { title: 'pp.litter.section.record' } }) + UI.rowGroup(rows) + '</section>';
  }
  function faceFooter() {
    return '<footer class="sheet-footer"><button type="button" class="button secondary" data-ds="Button" data-action="close" data-str="act.close">' + esc(PP.t('act.close')) + '</button></footer>';
  }

  /* ---- the dose drawer (staged: Back keeps the draft, Clear discards it, Save commits) ---- */
  function stepperRow(key, label, desc, descArgs, value, max, ceilId, ceilArgs) {
    var atCeil = ceilTap === key && max != null && value >= max;     // the host answers a tap on the grayed +, not every row at its cap
    return UI.stepper({ label: '', description: desc ? '' : undefined, value: value, min: 0, max: max, key: key, hint: atCeil ? '' : undefined,
      strs: Object.assign({ label: label, value: 'ds.field.figure', decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase' }, desc ? { description: desc } : {}, atCeil ? { hint: ceilId } : {}),
      args: Object.assign({}, desc ? { description: descArgs } : {}, atCeil ? { hint: ceilArgs } : {}) });
  }
  function radio(action, value, label, meta, on) {
    return '<button type="button" class="st-choice-row" data-ds="Candidate:Radio" role="radio" aria-checked="' + on + '" data-action="' + action + '" data-value="' + value + '">' +
      '<span class="st-choice-copy"><span class="st-choice-label">' + span(label) + '</span>' + (meta ? '<span class="st-choice-meta">' + span(meta) + '</span>' : '') + '</span>' +
      '<span class="st-choice-trail" aria-hidden="true"><span class="lt-radio"></span></span></button>';
  }
  function reasonGroup(rest, chosen, castr) {
    var lead = UI.heading({ title: '', kind: 'group', level: 5, strs: { title: 'pp.litter.reason.stays' } });
    return '<div role="radiogroup">' + UI.choiceGroup(['weak', 'sick'].map(function (k) { return radio('reason', k, 'pp.litter.reason.' + k, null, chosen === k); }),
      { title: '', lead: lead, strs: { title: castr ? 'pp.litter.castr.why' : one('pp.litter.rest.why', rest) }, args: { title: { n: rest } } }) + '</div>';
  }
  // What Save still waits for, said above the bar ('' when Save can commit).
  function waiting() {
    var d = dose(drawer.dose);
    if (d.castrate) {
      var c = drawer.castr, sum = c.c + c.hernia + c.cryptorchid + c.deferred + c.kept, o = owedStored(d);
      if (o != null && sum !== o) return [one('pp.litter.pointer.males', o - sum), { n: o - sum }];
      if (o == null && !sum && !c.none) return ['pp.litter.pointer.no_males', null];
      if (c.deferred && !c.why) return [one('pp.litter.pointer.reason', c.deferred), { n: c.deferred }];
      return null;
    }
    var rest = owed(d).n - drawer.n;
    if (rest > 0 && !drawer.reason) return [one('pp.litter.pointer.reason', rest), { n: rest }];
    return null;
  }
  function doseDrawer() {
    var d = dose(drawer.dose), s = status(d), t = title(d);
    var clear = dirty() ? '<button type="button" data-action="clear" data-str="act.clear">' + esc(PP.t('act.clear')) + '</button>' : '';
    var body = '', sub;
    if (d.castrate) {
      var c = drawer.castr, sum = c.c + c.hernia + c.cryptorchid + c.deferred + c.kept, o = owedStored(d);
      // Catch-up works on the outstanding males only: every stepper is capped at what is still owed.
      var total = o == null ? L.alive : o;
      var cap = function (x) { return total - sum + c[x]; };
      var ceil = o == null ? ['pp.litter.ceil.alive', { n: L.alive }] : [one('pp.litter.ceil.owed', o), { n: o }];
      sub = o == null ? [one('pp.litter.castr.males', sum), { n: sum }] : [one('pp.litter.castr.owed', o), { n: o }];
      body += stepperRow('c', 'pp.litter.castr.castrated', null, null, c.c, cap('c'), ceil[0], ceil[1]) +
        '<div class="lt-group">' + UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.litter.castr.not' } }) +
        stepperRow('hernia', 'pp.litter.reason.hernia', 'pp.litter.reason.leaves_note', null, c.hernia, cap('hernia'), ceil[0], ceil[1]) +
        stepperRow('cryptorchid', 'pp.litter.reason.cryptorchid', 'pp.litter.reason.leaves_note', null, c.cryptorchid, cap('cryptorchid'), ceil[0], ceil[1]) +
        stepperRow('deferred', 'pp.litter.reason.deferred', 'pp.litter.reason.stays_short', null, c.deferred, cap('deferred'), ceil[0], ceil[1]) +
        stepperRow('kept', 'pp.litter.reason.kept', 'pp.litter.reason.leaves', null, c.kept, cap('kept'), ceil[0], ceil[1]) + '</div>';
      if (c.deferred) body += reasonGroup(c.deferred, c.why, true);
      if (o == null) body += UI.chooserList(radio('no-males', 'none', 'pp.litter.castr.none', 'pp.litter.castr.none_meta', !!c.none), { tone: 'inset', ds: 'ChoiceList' });
    } else {
      var own = owed(d), max = own.n, rest = max - drawer.n;
      sub = d.product ? ['pp.litter.drawer.product', { prod: PP.t('pp.litter.product.' + d.product), n: max }] : ['pp.litter.drawer.owed', { n: max }];
      if (s !== 'due') body += UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'pp.litter.drawer.' + s }, args: { title: { d: s === 'missed' ? d.last : d.due } } });
      body += stepperRow('n', 'pp.litter.stepper.treated', 'pp.litter.stepper.of', { n: max }, drawer.n, max, one('pp.litter.ceil.owed', max), { n: max });
      if (rest > 0) body += reasonGroup(rest, drawer.reason);
    }
    var w = waiting();
    if (w) body += '<p class="lt-receipt" data-ds="Candidate:Receipt" role="status">' + span(w[0], w[1]) + '</p>';
    var head = UI.heading({ title: '', kind: 'page', level: 3, description: '', action: clear,
      strs: { title: t[0], description: sub[0] }, args: { title: t[1], description: sub[1] } });
    return '<div class="scrim" data-ds="Sheet" data-action="back"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="long" data-sizing="content" role="dialog" aria-modal="true">' +
      '<header class="utility-header">' + head + '</header>' +
      '<div class="sheet-body"><div class="lt-drawer-body">' + body + '</div></div>' +
      '<footer class="sheet-footer"><button type="button" class="button secondary" data-ds="Button" data-action="back" data-str="act.back">' + esc(PP.t('act.back')) + '</button>' +
      '<button type="button" class="button primary" data-ds="Button" data-action="save" data-str="act.save"' + (w ? ' aria-disabled="true"' : '') + '>' + esc(PP.t('act.save')) + '</button></footer></section>';
  }
  function freshDraft(d) {
    if (d.castrate) return { dose: d.id, castr: C(0) };
    return { dose: d.id, n: owed(d).n, reason: '' };
  }
  function dirty() { return JSON.stringify(freshDraft(dose(drawer.dose))) !== JSON.stringify(drawer); }

  /* ---- render: keeps scroll and focus ---- */
  function render() {
    var scr = document.getElementById('screen');
    var body = scr.querySelector('[data-presentation="page"] .sheet-body'), dbody = scr.querySelector('[data-st-context="drawer"] .sheet-body');
    var top = body ? body.scrollTop : 0, dtop = dbody ? dbody.scrollTop : 0;
    var f = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-action]');
    var fk = f ? [f.dataset.action, f.dataset.value || '', f.dataset.step || ''] : null;
    scr.innerHTML =
      '<section class="sheet" data-ds="Sheet" data-presentation="page"' + (drawer ? ' inert' : '') + '>' + header() +
      '<div class="sheet-body"><div class="lt-body">' + factLine() + tools() + owedSection() + recordedSection() + notesSection() + laterSection() + recordGroup() + '</div></div>' +
      faceFooter() + '</section>' + (drawer ? doseDrawer() : '');
    PP.apply(scr);
    var nb = scr.querySelector('[data-presentation="page"] .sheet-body'), nd = scr.querySelector('[data-st-context="drawer"] .sheet-body');
    if (nb) nb.scrollTop = top;
    if (nd) nd.scrollTop = dtop;
    if (fk) {
      var t = Array.prototype.filter.call(scr.querySelectorAll('[data-action]'), function (e) {
        return e.dataset.action === fk[0] && (e.dataset.value || '') === fk[1] && (e.dataset.step || '') === fk[2] && !e.closest('[inert]');
      })[0];
      if (t) t.focus({ preventScroll: true });
    }
  }
  function tick() { clock += 1; var h = Math.floor(clock / 60), m = clock % 60; return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
  function commit(d, n, extra) {
    var s = status(d);
    recs.push(R(d.id, n, tick(), ME, Object.assign({ visit: true }, extra)));
    lastCommit = Date.now();
    var c = extra && extra.castr;
    if (c && c.none) receipt = ['castr_none', d.id];
    else if (c) { var k = c.hernia + c.cryptorchid + c.deferred + c.kept; receipt = [k ? 'castr' : 'castr_all', d.id, c.c, k]; }
    else if (extra && extra.deferred) receipt = ['deferred', d.id, n, extra.deferred.n];
    else receipt = [s === 'later' ? 'early' : s === 'due' ? 'saved' : 'late', d.id, n];
  }
  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action, v = b.dataset.value, now = Date.now();
    if (a === 'record') {
      if (now - lastCommit < 600) return;                       // a repeat tap after a commit is ignored
      var d = dose(v), o = owed(d), label = +b.dataset.n;
      // The tap resolves against current owed: if another hand changed it, record nothing and say so.
      if (label !== o.n) {
        var other = recsOf(v).filter(function (r) { return r.who !== ME; }).pop();
        receipt = o.n ? ['stale', v, other ? other.n : 0, o.n, other ? other.t : '', other ? other.who : ''] : ['already', v, 0, 0, other ? other.t : '', other ? other.who : ''];
        render(); return;
      }
      if (!o.n) return;
      commit(d, o.n, d.castrate ? { castr: C(o.n) } : null);
      render();
    } else if (a === 'open-dose') {
      var dd = dose(v);
      if (isDone(dd)) return;
      ceilTap = ''; drawer = drafts[v] || freshDraft(dd); render();
    } else if (a === 'step') {
      if (b.getAttribute('aria-disabled') === 'true') { ceilTap = +b.dataset.step > 0 ? v : ''; render(); return; }
      ceilTap = '';
      var step = +b.dataset.step;
      if (drawer.castr) { drawer.castr[v] += step; drawer.castr.none = false; if (!drawer.castr.deferred) drawer.castr.why = ''; }
      else { drawer.n += step; if (drawer.n === owed(dose(drawer.dose)).n) drawer.reason = ''; }
      render();
    } else if (a === 'reason') { if (drawer.castr) drawer.castr.why = v; else drawer.reason = v; render(); }
    else if (a === 'no-males') { drawer.castr = C(0, { none: !drawer.castr.none }); render(); }
    else if (a === 'back') { drafts[drawer.dose] = drawer; if (!dirty()) delete drafts[drawer.dose]; drawer = null; drawerClosedAt = now; render(); }
    else if (a === 'clear') { var id = drawer.dose; delete drafts[id]; drawer = freshDraft(dose(id)); render(); }
    else if (a === 'save') {
      if (b.getAttribute('aria-disabled') === 'true' || now - lastCommit < 600) return;
      var sd = dose(drawer.dose);
      if (sd.castrate) commit(sd, drawer.castr.c, { castr: Object.assign({}, drawer.castr) });
      else {
        var rest = owed(sd).n - drawer.n;
        commit(sd, drawer.n, rest > 0 ? { deferred: { n: rest, reason: drawer.reason } } : null);
      }
      delete drafts[drawer.dose]; drawer = null; drawerClosedAt = now; render();
    } else if (a === 'close') {
      if (now - drawerClosedAt < 400) return;                    // a tap meant for the drawer's bar never closes the sheet
      document.documentElement.setAttribute('data-door', 'close:');
    } else if (a === 'open-record') {
      location.href = 'edit.html?state=record-page&crate=' + L.crate + (zh ? '&lang=zh' : '');
    } else document.documentElement.setAttribute('data-door', a + ':' + (v || ''));
  });
  PP.ready.then(render);
})();
</script>
</body>
</html>
