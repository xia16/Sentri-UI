<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litter sheet</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css. Cards (ADR 0002): Row `rowAction` (the treatment row), `row({ wrap, trail: 'edit' })`
   (the evidence row), ChoiceList `choiceRadios`, Button `waiting` + `buttonReason` + `guard`, Banner (the sow died). The
   header, tools and receipt come from the shell (shell-ui.js, shell.css). */
.lt-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.lt-phone .scrim { inset: 0; }
.lt-body { display: flex; flex-direction: column; gap: var(--space-section); }
.lt-body > * { margin: 0; }
.lt-drawer-body { display: flex; flex-direction: column; gap: var(--space-row-y); }
/* The receipt and the reason line sit in the bar above its buttons, so a record never reflows the row stack. */
.lt-bar { flex-wrap: wrap; row-gap: var(--space-row-y); }
.lt-bar > .pp-receipt { flex-basis: 100%; }
.lt-bar > .button { flex: 1; }
.lt-confirm { display: flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-footer-gap); }
</style>
</head>
<body>
<main class="inspection-phone lt-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, U = window.PPUI;
  var zh = PP.lang === 'zh';

  /* ---- states: a fixture variant (fixtures.js) + the crate + UI state. Every figure on the face is the ledger's
     (select.litter over the shared log); drafts are validated by the same replay `append` runs; Save and the
     one-tap commit through `append`. `visit`: the record this phone made this visit (it keeps its place).
     `pre`: records made at load (the moment after them), kept out of the tab's log like `tap`. ---- */
  var STATES = {
    'litter':             { data: 'base' },
    'litter-partial':     { data: 'a02-partial', crate: 'A02', visit: ['T-A02-visit'], receipt: 'saved' },
    'draft-waiting':      { data: 'base', crate: 'A02', drafts: { iron3: { kind: 'dose', dose: 'iron3', n: 10, reason: '', owed: 12 } } },
    'litter-short-count': { data: 'base', crate: 'A02', drawer: { dose: 'iron3', n: 10, reason: '' } },
    'litter-short-saved': { data: 'a02-short', crate: 'A02', visit: ['T-A02-visit'], receipt: 'saved' },
    'castrate':           { data: 'a02-castrate', crate: 'A02', drawer: { dose: 'castrate', castr: { castrated: 3, hernia: 1, cryptorchid: 0, kept: 0, deferred: 2, deferReason: 'weak' } } },
    'castrate-saved':     { data: 'a02-castrated', crate: 'A02', visit: ['T-A02-visit'], receipt: 'saved' },
    'castrate-catchup':   { data: 'base', crate: 'B03', drawer: { dose: 'castrate', castr: { castrated: 1, hernia: 0, cryptorchid: 0, kept: 0, deferred: 1, deferReason: 'sick' } } },
    'castrate-none':      { data: 'c05-no-males', crate: 'C05', visit: ['T-C05-visit'], receipt: 'saved' },
    'done-by-other':      { data: 'a02-by-other', crate: 'A02', tap: { dose: 'iron3', n: 12 } },
    'stale-tap':          { data: 'a02-stale', crate: 'A02', tap: { dose: 'iron3', n: 12 } },
    'early':              { data: 'c02-early', crate: 'C02', visit: ['T-C02-visit'], receipt: 'saved' },
    'late':               { data: 'base', crate: 'B01' },
    'missed':             { data: 'base', crate: 'B04' },
    'snapshot-kept':      { data: 'base', crate: 'B04', drawer: { dose: 'iron14' } },
    'double-flag':        { data: 'base', crate: 'A05' },
    'all-done':           { data: 'a02-all-done', crate: 'A02', visit: ['T-A02-visit'], receipt: 'saved' },
    // RULINGS round 3: after End no new marks — a mark done after End is evidence (kept, never counted); a mark withdrawn
    // after End reads not done · corrected after End
    'after-end':          { data: 'ended-after-end', crate: 'B01' },
    'corrected-after-end': { data: 'ended-correct', crate: 'B03' },
    // scenario round 1 (fix/r1-litter)
    'arrived-unknown':    { data: 'moved-unknown', crate: 'B02' },                                   // R1-2
    'arrived-resolve':    { data: 'moved-unknown', crate: 'B02', resolve: { dose: 'iron3', had: 1 } },  // R1-2
    'arrived-check':      { data: 'moved-unknown', crate: 'B02', resolve: { dose: 'tail', had: 1, rest: 'record' } },
    'range':              { data: 'move-doubt', crate: 'A07' },                                       // R1-3
    'range-check':        { data: 'move-doubt', crate: 'A07', range: { dose: 'iron3', still: 1 } },
    'arrivals-young':     { data: 'move-young', crate: 'D03' },                                       // R1-4
    'not-due':            { data: 'base', crate: 'A02', pre: [{ type: 'move', from: 'D06', to: 'A02', n: 2, answers: {} }] },
    'closed':             { data: 'emptied', crate: 'C05' },                                          // R1-19
    'orphan':             { data: 'base', crate: 'B01' },                                             // one sheet
    'orphan-unlocked':    { data: 'base', crate: 'D06' },
    'nurse':              { data: 'moved-orphan', crate: 'D02' },                                     // round 4
    'ended':              { data: 'ended', crate: 'B01' },                                            // R1-13
    'ended-review':       { data: 'ended', crate: 'A05' },
    'held':               { data: 'held-body', crate: 'A07' },                                        // R1-22
    'count-conflict':     { data: 'count-offline', crate: 'A07' },
    'double-answered':    { data: 'double-twice', crate: 'A05' },
    'identity-late':      { data: 'base', crate: 'C05' },                                             // R1-17
    'keepers-closed':     { data: 'keepers-closed', crate: 'A07' },
    'one-tap-saved':      { data: 'base', crate: 'A02', tap: { dose: 'iron3', n: 12 } },              // R1-25 Undo
    'no-males-confirm':   { data: 'a02-castrate', crate: 'A02', drawer: { dose: 'castrate', castr: { castrated: 3, hernia: 1, cryptorchid: 0, kept: 0, deferred: 0, deferReason: '' }, confirmNone: true } },
    'split-reasons':      { data: 'base', crate: 'A02', drawer: { dose: 'iron3', n: 10, reason: 'split', weak: 1 } },
    'all-deferred':       { data: 'base', crate: 'A02', drawer: { dose: 'iron3', n: 0, reason: 'weak' } },
    'all-deferred-saved': { data: 'base', crate: 'A02', pre: [{ type: 'treat', litter: 'A02', dose: 'iron3', n: 0, deferred: { n: 12, reason: 'weak' } }], preVisit: true },
    'corrected':          { data: 'a02-corrected', crate: 'A02' },                                    // R1-28
    // back from the dead drawer's Save: its receipt, handed over on this phone (pp-receipt:dead)
    'dead-saved':         { data: 'base', crate: 'A02', saved: 'dead', handoff: { parts: [{ id: 'receipt.saved' }, { id: 'ds.dead.receipt.line', args: { n: 1, cause: 'crushed' }, tone: 'green' }], litter: 'A02', from: 'A02' } },
    // drafts other pages keep on this phone, said on their doors
    'drafts-on-doors':    { data: 'base', crate: 'A02', kept: { dead: { pig: { tallies: { crushed: 2 }, picks: {}, miss: {}, photos: [], note: '', route: '' }, sow: null },
                            count: { observed: 10, rows: [], at: '2026-09-29T10:20', obsMs: 0, seen: [] }, id: { run: { tag: '004301', sex: 'g', weight: null } } } }
  };
  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'litter';
  var st = STATES[name];
  var store, CFG, SOW, TODAY, crate;
  var visit = {};                         // record ids this phone made this visit
  var receipt = null;                     // { kind, dose, rec, other, now, undo }
  var drawer = null;                      // the open drawer's draft: { kind: dose|resolve|range, key, dose, … }
  var drafts = {};                        // Back keeps a drawer's draft on the device, per drawer key
  var lastCommit = 0, drawerClosedAt = 0, drawerOpenedAt = 0, ceilTap = '';

  /* ---- the ledger ---- */
  function L() { return store.derived.litters[crate]; }
  function view(extra) { return store.select.litter(store.derived, crate, Object.assign({ stamp: { who: PP.me } }, extra || {})); }
  function doseCfg(id) { return CFG.doses.filter(function (d) { return d.id === id; })[0]; }
  function D(id) { return L().doses[id]; }
  function owedOf(id) { return D(id).owed; }                               // shown owed (null: castration before its first record)
  function isDone(id) { var x = D(id); return x.owed === 0 && x.unknownAfterMove === 0; }
  function recordOf(id) {
    var out = null;
    Object.keys(L().doses).forEach(function (k) { L().doses[k].records.forEach(function (r) { if (r.id === id) out = r; }); });
    return out;
  }
  function rawEvent(id) { return store.events.filter(function (e) { return e.id === id; })[0] || null; }
  function visitRec(id) { var rs = D(id).records.filter(function (r) { return visit[r.id]; }); return rs[rs.length - 1] || null; }
  function unknownGroups(id) { return (D(id).unknownGroups || []).filter(function (g) { return g.n > 0; }); }
  // The task this litter is in has ended (RULINGS round 3): nothing on it reads actionable (R1-13)
  function endedTask() { return (store.derived.tasks || []).filter(function (t) { return t.ended && t.litters.indexOf(crate) >= 0; })[0] || null; }
  function tagOf(rowId) { var r = (L().identity.rows || []).filter(function (x) { return x.rowId === rowId; })[0]; return r ? r.tag || r.notch : null; }

  /* ---- strings: a token part is a registered string (filled now and by PP.apply); tone colours the value ---- */
  function P(id, args, tone) { return { text: PP.t(id, args), tone: tone || undefined, strs: { text: id }, args: args ? { text: args } : undefined }; }
  var span = function (id, args, tone) { return U.span(id, args, { tone: tone }); };
  var one = PP.one;
  var pigs = function (n) { return PP.tn('pp.common.unit.piglet', n); };
  function btn(o) { return UI.button(Object.assign({ label: PP.t(o.id, o.args) }, o, { id: '', strs: { label: o.id }, args: o.args ? { label: o.args } : undefined })); }
  // Both iron doses carry their day everywhere (`Iron · day 3`, `Iron · day 14`).
  function title(id) { var d = doseCfg(id); return d.tx === 'iron' ? ['pp.litter.tx_day', { tx: PP.t('pp.common.tx.iron'), d: d.due }] : ['pp.common.tx.' + d.tx, null]; }
  function titleText(id) { var t = title(id); return PP.t(t[0], t[1]); }
  function titleTok(id) { var t = title(id); return [P(t[0], t[1])]; }
  function lower(s) { return zh ? s : s.charAt(0).toLowerCase() + s.slice(1); }
  function stampText(at, who) { return U.stamp(at, who, TODAY); }
  function reasonName(k) { return PP.t('pp.litter.why.' + k); }
  function castrLine(c) {
    var not = [], k = 0;
    ['hernia', 'cryptorchid', 'deferred', 'kept'].forEach(function (x) { if (c[x]) { not.push([x, c[x]]); k += c[x]; } });
    if (!c.castrated && !k) return PP.t('pp.litter.castr.none_line');
    var label = function (x) { return x === 'deferred' && c.deferReason ? PP.t('pp.litter.castr.deferred_why', { reason: reasonName(c.deferReason) }) : reasonName(x); };
    // One reason: `not castrated 1: hernia`; several: `not castrated 3: hernia 1, deferred (weak) 2`.
    not = not.length === 1 ? [label(not[0][0])] : not.map(function (p) { return PP.t('pp.litter.castr.part', { n: p[1], reason: label(p[0]) }); });
    return k ? PP.t('pp.litter.castr.line', { c: c.castrated, k: k, why: not.join(zh ? '，' : ', ') }) : PP.t('pp.litter.castr.line_all', { c: c.castrated });
  }
  // The deferral as the record wrote it: one reason, or split (`2 deferred: 1 weak, 1 sick`, N12 — the record's `deferBy`).
  function deferTok(r, tone) {
    var by = r.deferBy;
    if (by && by.weak && by.sick) return P('pp.litter.def.split', { k: r.deferred, w: by.weak, s: by.sick }, tone);
    return P('pp.common.mark.deferred', { k: r.deferred, reason: reasonName(r.deferReason || 'deferred') }, tone);
  }
  /* The record's own evidence line as tokens, printed from the record (its product snapshot, never the console's current
     one). A corrected record, or one recorded through a correction, prints its figures amber with what it was (R1-28). */
  function evidence(r) {
    var tone = r.corrected || r.viaCorrection ? 'amber' : null, out = [P(r.at && r.at.slice(0, 10) === TODAY.slice(0, 10) ? 'pp.common.stamp.today' : 'pp.common.stamp.date', { date: U.date(r.at), t: U.time(r.at), who: r.who })];
    if (r.castration) out.push(P('pp.litter.done.what', { what: castrLine(r.castration) }, tone));
    else if (r.target === 'unknown') out.push(P('pp.litter.done.arrived_n', { pigs: pigs(r.n) }, tone));
    else if (!r.n && r.deferred) out.push(P('pp.litter.done.none_treated', null, tone));   // 0 treated: the deferral is the record
    else out.push(P(one('pp.common.unit.piglet', r.n), { n: r.n }, tone));
    if (!r.castration && r.deferred && r.deferReason === 'not_done') out.push(P('pp.common.mark.not_done', { k: r.deferred }, tone));
    else if (!r.castration && r.deferred) out.push(deferTok(r, tone));
    if (!r.castration && r.product) out.push(P('pp.litter.product.' + r.product));
    if (r.corrected) {
      var ev = rawEvent(r.id), was = ev ? (ev.castration ? ev.castration.castrated : ev.n) : null, now = r.castration ? r.castration.castrated : r.n;
      out.push(was != null && was !== now ? P('pp.litter.rec.was', { n: was }, 'amber') : P('pp.litter.rec.corrected', null, 'amber'));
    }
    if (r.viaCorrection && r.from) out.push(P('pp.litter.rec.from', { code: r.from }, 'amber'));
    return out;
  }
  function collided(r) { return D(r.dose).possibleDoubleTreatment.some(function (p) { return p.indexOf(r.id) >= 0; }); }
  function twice(r) { return (D(r.dose).doubles || []).some(function (x) { return x.answer === 'twice' && x.records.indexOf(r.id) >= 0; }); }
  function recTag(r) {
    if (collided(r)) return P('pp.litter.flag.double_short', null, 'amber');
    if (twice(r)) return P('pp.litter.tag.twice', null, 'amber');
    if (r.timing === 'after_window') return P('pp.litter.tag.after', { d: doseCfg(r.dose).last });
    if (r.timing === 'early') return P('pp.litter.tag.early');
    if (r.timing === 'late') return P('pp.litter.tag.late');
    return null;
  }
  // A done row (Row, wrap): its tap opens Edit on this record (✎).
  function evidenceRow(r) {
    var tag = recTag(r), desc = evidence(r);
    if (tag) desc.push(tag);
    return UI.row({ title: titleTok(r.dose), description: desc, wrap: true, trail: 'edit', action: 'open-edit', value: r.id });
  }

  /* ---- header (shared): crate first, the door to the sow page ---- */
  function header() { return U.litterHeader({ crate: crate, sow: SOW.sow, parity: SOW.parity }); }
  /* The sow died (farrowing's danger band): her orphans keep their schedule on this one sheet (edge.html forwards here). */
  function orphanBanner() {
    var sd = L().sowDied;
    if (!sd) return '';
    var head = sd.cause ? ['pp.litter.orphan.head', { cause: PP.t('pp.edge.cause.' + sd.cause), stamp: stampText(sd.at, sd.who) }] : ['pp.litter.orphan.head_nocause', { stamp: stampText(sd.at, sd.who) }];
    // after End her orphans' schedule is over: the band states the fact only
    var cons = endedTask() ? null : L().endedBySowDeath ? ['pp.litter.orphan.unlocked', { n: L().born }] : [L().alive ? 'pp.litter.orphan.cons' : 'pp.litter.orphan.cons_empty', null];
    return UI.banner({ tone: 'danger', headline: '', consequence: '', strs: Object.assign({ headline: head[0] }, cons ? { consequence: cons[0] } : {}), args: { headline: head[1], consequence: cons && cons[1] } });
  }
  /* R1-10: the header balances — Born · Alive · Dead, and every other term of the identity when it is not zero (moved in,
     moved out, weaned, unexplained). The line is the door to the record page. A nurse sow's earlier litter has its own line. */
  function factLine() {
    var b = view().balance, born = new Date(L().birthDay * 86400000).toISOString().slice(0, 10), t = [];
    if (b.born || !b.earlier) t.push(P('pp.litter.bal.born', { n: b.born }));
    t.push(P('pp.litter.bal.alive', { n: b.alive }));
    t.push(P('pp.litter.bal.dead', { n: b.dead }));
    if (b.movedIn) t.push(P('pp.litter.bal.in', { n: b.movedIn }));
    if (b.movedOut) t.push(P('pp.litter.bal.out', { n: b.movedOut }));
    if (b.weaned) t.push(P('pp.litter.bal.weaned', { n: b.weaned }));
    if (b.loss) t.push(P('pp.litter.bal.loss', { n: b.loss }, 'red'));
    if (b.gain) t.push(P('pp.litter.bal.gain', { n: b.gain }, 'progress'));
    // a Row title joins its tokens with a space: the `·` between the terms is a registered string of its own
    t = t.reduce(function (acc, x, i) { return i ? acc.concat([P('pp.litter.sep'), x]) : [x]; }, []);
    var rows = UI.row({ title: t, description: [P('pp.litter.factline.day', { n: L().dayAge, date: U.date(born) })], wrap: true, action: 'open-record', value: crate });
    var n = view().nurse, e = view().earlier;
    if (n) rows += UI.row({ title: [P('pp.litter.nurse.title')], description: [P('pp.litter.nurse.from', { code: n.from, stamp: stampText(n.at, (L().moves.filter(function (m) { return m.id === n.since; })[0] || {}).who || '') })], wrap: true });
    if (e) rows += UI.row({ title: [P('pp.litter.nurse.earlier')], description: [P('pp.litter.bal.born', { n: e.born }), P('pp.litter.bal.dead', { n: e.dead }), P('pp.litter.bal.weaned', { n: e.weaned }), P('pp.common.unit.day', { n: e.dayAge })], wrap: true });
    return UI.rowGroup(rows);
  }

  /* ---- owed today ---- */
  // Which piglets owe (R1-4, R1-18): an age group's size, its crate and tags where the ledger knows them, and its own day.
  function whenTok(g) {
    if (g.status === 'later') return P(one('pp.litter.when.in', g.inDays), { n: g.inDays });
    if (g.status === 'late') return [P('pp.litter.tag.late'), P(one('pp.litter.days', g.lateBy), { k: g.lateBy }, 'red')];
    if (g.status === 'missed') return P('pp.litter.when.missed');
    return P('pp.litter.when.today');
  }
  function groupToks(g) {
    var tags = (g.rows || []).map(tagOf).filter(Boolean);
    var who = g.kind === 'own' ? P('pp.litter.grp.own', { k: g.n }) : tags.length && tags.length <= 3 ? P('pp.litter.grp.from_tags', { k: g.n, code: g.from, tags: tags.join(', ') }) : P('pp.litter.grp.from', { k: g.n, code: g.from });
    return [who, P('pp.litter.grp.day', { d: g.dayAge }), whenTok(g)];
  }
  // Groups of different ages each say their own day; arrivals of the litter's own age just say where they came from.
  function agesDiffer(gs) { return gs.some(function (g) { return g.dayAge !== gs[0].dayAge; }); }
  function hasDraft(id) { return !!(drafts[id] || drafts['range:' + id]); }
  function showGroups(o) { return agesDiffer(o.groups); }
  function arrivalToks(gs) {
    return gs.filter(function (g) { return g.kind !== 'own'; }).map(function (g) { return groupToks(g)[0]; });
  }
  function splitNow(o) { return !doseCfg(o.dose).castration && o.owed != null && o.owedNow < o.owed && o.owedNow > 0; }
  function owedToks(o) {
    var t = [], castrate = doseCfg(o.dose).castration;
    if (hasDraft(o.dose)) return [P('status.unsaved', { n: 1 }, 'green')];
    if (o.status === 'due' && !showGroups(o)) t.push(P('pp.litter.due', { d: o.due }));
    // Colour on the value, the word ink: `late 2 days`, `missed after day 7`.
    if (o.status === 'late' && !showGroups(o)) t.push([P('pp.litter.tag.late'), P(one('pp.litter.days', o.lateBy), { k: o.lateBy }, 'red')]);
    if (o.status === 'missed') t.push([P('pp.litter.missed_word'), P('pp.litter.missed_day', { d: o.missedAfter }, 'red')]);
    if (o.range) {
      // R1-3: after a Don't-know move out the source owes a range: no one-tap number, the worker checks on the pig
      t.push(P('pp.litter.range', { lo: o.range.lo, hi: o.range.hi, of: o.range.of }, 'amber'));
      o.range.doubt.forEach(function (x) { t.push(P('pp.litter.range.doubt', { n: x.n, to: x.to })); });
      return t;
    }
    if (o.owed && o.deferred && o.deferReason && o.deferReason !== 'not_due') t.push(P(castrate ? one('pp.litter.owed_males_reason', o.owed) : 'pp.litter.owed_reason', { n: o.owed, reason: reasonName(o.deferReason) }));
    else if (o.males === 'uncounted') t.push(P('pp.common.males_uncounted'));
    else if (splitNow(o)) t.push(P('pp.litter.owed_now', { n: o.owedNow, of: o.owed }));
    else if (o.owed != null) t.push(P(castrate ? one('pp.litter.castr.owed', o.owed) : 'pp.litter.owed', { n: o.owed }));
    if (showGroups(o)) o.groups.forEach(function (g) { t = t.concat(groupToks(g)); });
    else t = t.concat(arrivalToks(o.groups));
    return t;
  }
  function tapN(o) { return splitNow(o) ? o.owedNow : o.oneTap; }
  function txRow(o) {
    var n = tapN(o);
    // No one-tap: castration before its first record (males are unknown), a missed dose (recorded from the drawer, tagged
    // `after day N`), a range (R1-3: counted on the pig), or nothing owed now. The whole row is the door and says so.
    if (o.males === 'uncounted' || o.status === 'missed' || o.range || !n) {
      return UI.row({ title: titleTok(o.dose), description: owedToks(o), wrap: true, action: 'open-dose', value: o.dose,
        trailing: hasDraft(o.dose) ? { text: PP.t('pp.litter.act.resume'), strs: { text: 'pp.litter.act.resume' } } : '' });
    }
    // A waiting draft replaces the one-tap: no full-count commit competes with it.
    var act = hasDraft(o.dose) ? { label: PP.t('pp.litter.act.resume'), action: 'open-dose', value: o.dose, strs: { label: 'pp.litter.act.resume' } }

  }
  // R1-2, R1-18: arrivals whose dose is not known — `unknown — check spray mark` (invisible), `check on the pig` (visible) —
  // resolved here: Already had it · Record now · Leave owed.
  function unknownRows(id, o) {

  /* ---- the receipt: what the last record on this phone changed (or why nothing was recorded); in the bar, so the rows
     never reflow. A one-tap record offers Undo (a stamped withdrawal, the original kept). ---- */
  function receiptLine() {
    if (!receipt) return '';
    if (receipt.kind === 'correction') return U.receipt([{ id: 'pp.common.saved_correction' }]);   // back from Edit's Save (ticket #12)
    if (receipt.kind === 'handoff') return U.receipt(receipt.parts);                                // back from the dead drawer's Save
    var id = receipt.dose, tx = lower(titleText(id)), r = receipt.rec, k = receipt.kind, parts;

    else if (k === 'stale' && receipt.other) parts = [{ id: 'pp.litter.rcpt.stale', args: { tx: tx, t: U.time(receipt.other.at), who: receipt.other.who, m: receipt.other.n } }, { id: 'pp.litter.rcpt.now_owed', args: { n: receipt.now }, tone: 'amber' }];
    else if (k === 'stale') parts = [{ id: 'pp.litter.rcpt.changed', args: { tx: tx } }, { id: 'pp.litter.rcpt.now_owed', args: { n: receipt.now }, tone: 'amber' }];

      if (receipt.left) parts.push({ id: 'pp.litter.rcpt.left', args: { k: receipt.left }, tone: 'amber' });

    } else if (r.castration) {

  /* ---- later: future doses, each on the owing piglets' own day (R1-4: arrivals by their age); early is deliberate

  function laterItems() {

  /* ---- the Record group: Move, identity (keepers read `set closed` once closed — never "so far"), birth litter weight ---- */

  function recordGroup() {
    var idc = CFG.identity, id = view().identityDue, rows = UI.row({ title: '', description: '', action: 'open-move', value: crate, strs: { title: 'pp.move.title', description: 'pp.common.record.move_desc' } });

  /* ---- the drawers (staged: Back keeps the draft, Clear discards it, Save commits; Save waits with its reason) ---- */
  function stepperRow(key, label, desc, descArgs, value, max, ceilId, ceilArgs, min) {

      options: options.map(function (o) { return { value: o[0], label: PP.t(o[1], o[2]), meta: o[3] ? PP.t(o[3], o[4]) : '', strs: Object.assign({ label: o[1] }, o[3] ? { meta: o[3] } : {}), args: { label: o[2], meta: o[4] } }; }),

  // Untreated piglets: weak, sick, or some of each (N12: 1 weak, 1 sick).
  function reasonGroup(rest, chosen, castr) {

    } else if (a === 'close') {
      if (now - drawerClosedAt < 400) return;                    // a tap meant for the drawer's bar never closes the sheet
      nav('room.html', { state: 'room', unit: qs.get('unit') || (SOW.unit !== 7 ? SOW.unit : '') });
    } else if (a === 'open-review') { reviewDoor(v);
    } else if (a === 'open-dead') { nav('dead.html', { state: 'dead', crate: crate, unit: qs.get('unit') });
    } else if (a === 'open-count') { nav('count.html', { state: 'count', crate: crate, unit: qs.get('unit'), data: store.name });
    } else if (a === 'open-move') { nav('move.html', { state: 'move', crate: crate });
    } else if (a === 'open-identity') { nav('id.html', { state: 'id-table', crate: crate });
    } else if (a === 'open-weight') { nav('edge.html', { state: 'birth-weight-entry', crate: crate });
    } else if (a === 'open-record') { nav('edit.html', { state: 'record-page', crate: crate });
    } else if (a === 'open-edit') { nav('edit.html', Object.assign({ state: 'edit', crate: crate, from: 'litter' }, v && v !== crate ? { record: v } : {}));
    } else document.documentElement.setAttribute('data-door', a + ':' + (v || ''));
  });

  PP.ready.then(function () {
    PP.me = window.PPFixtures.ME;
    // a state that records at load (`pre`, a one-tap) shows the moment after, kept out of the tab's log
    store = PP.open(st.data, st.pre || st.tap ? { session: false } : null);
    CFG = store.config; TODAY = store.today;
    // The litter: ?crate=, or ?sow=, else the state's own.
    crate = qs.get('crate') || st.crate || 'A02';
    if (qs.get('sow')) crate = store.crateOfSow(qs.get('sow')) || crate;
    SOW = store.sow(crate) || { sow: '', parity: 0, unit: 7, weight: null };
    var Lx = L();
    // From the room (state=litter): a litter outside the task, or still farrowing, opens its own face. An orphaned litter
    // (its sow died, locked or ended by her death) is this sheet, with the band (one sheet, not two).
    if (name === 'litter' && Lx && !qs.get('stay')) {
      var edge = !Lx.recordable ? 'no-task' : Lx.phase === 'open' ? 'prelock' : '';
      if (edge) { location.replace(PP.href('edge.html', { state: edge, crate: crate, unit: qs.get('unit'), data: store.name !== 'base' ? store.name : '' })); return; }
    }
    try { drafts = JSON.parse(sessionStorage.getItem('pp-drafts:' + store.name + ':' + crate) || 'null') || {}; } catch (e) { drafts = {}; }
    if (st.drafts) drafts = JSON.parse(JSON.stringify(st.drafts));
    (st.pre || []).forEach(function (e) { var r = store.commit(e); if (r.ok && st.preVisit) { visit[r.event.id] = true; receipt = { kind: 'saved', dose: e.dose, rec: recordOf(r.event.id) }; } });
    (st.visit || []).forEach(function (id) { visit[id] = true; });
    if (st.receipt) { var r0 = recordOf(st.visit[0]); receipt = { kind: 'saved', dose: r0.dose, rec: r0 }; }
    if (qs.get('saved') === 'correction') receipt = { kind: 'correction' };
    // back from the dead drawer's Save (`saved=dead` | `saved=sow`): its receipt, handed over once and then dropped
    if (qs.get('saved') === 'dead' || qs.get('saved') === 'sow' || st.saved) {
      var hr = st.handoff || null;
      try { hr = hr || JSON.parse(sessionStorage.getItem('pp-receipt:dead') || 'null'); sessionStorage.removeItem('pp-receipt:dead'); } catch (e) {}
      if (hr && hr.parts && (hr.litter === crate || hr.from === crate)) receipt = { kind: 'handoff', parts: hr.parts };
    }
    if (st.kept) {
      try {
        sessionStorage.setItem(keptKey('dead'), JSON.stringify(st.kept.dead));
        sessionStorage.setItem(keptKey('count'), JSON.stringify(st.kept.count));
        sessionStorage.setItem(keptKey('id'), JSON.stringify(st.kept.id));
      } catch (e) {}
    }
    if (st.tap) tap(st.tap.dose, st.tap.n);
    if (st.drawer) {
      var dr = freshDraft(st.drawer.dose);
      ['n', 'reason', 'weak', 'confirmNone'].forEach(function (k) { if (st.drawer[k] != null) dr[k] = st.drawer[k]; });
      if (st.drawer.castr) dr.castr = Object.assign({}, ZERO, st.drawer.castr);
      openDrawer(dr);
    }
    if (st.resolve) {
      var g = unknownGroups(st.resolve.dose)[0];
      if (g) openDrawer(Object.assign(freshResolve(g.id + ':' + st.resolve.dose), { had: st.resolve.had || 0, rest: st.resolve.rest || '' }));
    }
    if (st.range) openDrawer(Object.assign(freshDraft(st.range.dose), { still: st.range.still, rest: st.range.rest || '' }));
    render();
  });
})();
