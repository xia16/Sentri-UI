<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge litters</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<style>
/* Layout only, tokens from tokens.css; one Candidate composition (the red band). */
.edge-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.edge-phone .scrim { inset: 0; }
.edge-title { flex: 1; min-width: 0; }
.edge-context { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.edge-door { display: inline-flex; align-items: center; gap: 4px; min-height: var(--touch-min); padding: 0; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; }
.edge-door svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.edge-body { display: flex; flex-direction: column; gap: var(--space-section); }
.edge-body > * { margin: 0; }
.edge-group > * + * { margin-top: var(--space-heading); }
.edge-mono { font-family: var(--font-mono); }
/* Candidate:DangerBand — farrowing's red warning band, on tokens only. */
.edge-band { padding: var(--space-panel); background: var(--red-wash); border: 1px solid var(--red); border-radius: var(--radius-inset); color: var(--red); font-size: 13px; font-weight: 500; }
.edge-drawer-body { display: flex; flex-direction: column; gap: var(--space-row-y); }
.edge-receipt { margin: 0; font-size: 11px; color: var(--muted); }
.edge-receipt[data-tone="warn"] { color: var(--amber); }
.edge-actions { display: flex; gap: var(--space-footer-gap); padding-top: var(--space-row-y); }
.edge-actions .button { flex: 1; }
.edge-pad { padding: 0 var(--space-gutter) var(--space-row-y); }
</style>
</head>
<body>
<main class="inspection-phone edge-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script>
(function () {
  var UI = window.SentriUI, ICON = window.SentriIcons;
  var zh = PP.lang === 'zh';
  var stamp = function (d, time, who) { return (zh ? '9月' + d + '日' : 'Sep ' + d) + ' · ' + time + ' · ' + who; };
  var A = { pad: 'ds.field.figure' };

  // Fixtures. Born = live-born + stillborn on every litter; every number printed comes from here.
  var FX = {
    'no-task':  { tag: '000391', pen: 'C07', parity: 2, day: 4, born: 11, alive: 10, dead: 1, still: 1, live: 10, record: true, noTask: true, weight: 'missing' },
    'orphan':   { tag: '000418', pen: 'B01', parity: 3, day: 3, born: 10, alive: 7, dead: 3, still: 1, live: 9, record: true, band: stamp(28, '06:20', 'L.M'), cause: true,
                  weight: '13.6', by: 'finish', at: stamp(26, '18:05', 'G.H'), owed: [['iron', 7, 3], ['tail', 7, 3]] },
    'orphan-unlocked': { tag: '000429', pen: 'B03', parity: 1, day: 1, born: 8, derived: true, alive: 6, dead: 2, still: 1, live: 7, record: true, band: stamp(28, '06:20', 'L.M'),
                  weight: 'missing', owed: [['tail', 6, 1]] },
    'prelock':  { tag: '000437', pen: 'B02', parity: 2, day: 0, alive: 9, dead: 1, prelock: true, owed: [['cord', 1, 0, 'late'], ['nasal', 9, 0]] },
    'weight':   { tag: '000462', pen: 'C03', parity: 4, day: 1, born: 13, alive: 12, dead: 1, still: 1, live: 12, record: true, weight: 'missing', late: { w: '14.8', at: stamp(29, '09:38', 'A.K') } }
  };
  var STATES = {
    'no-task': ['no-task'], 'orphan': ['orphan'], 'orphan-unlocked': ['orphan-unlocked'], 'prelock': ['prelock'],
    'birth-weight-missing': ['weight'], 'birth-weight-entry': ['weight', '', null, true], 'birth-weight-typed': ['weight', '16.4', null, true],
    'birth-weight-range': ['weight', '34.2', null, false], 'birth-weight-refused': ['weight', '99.9', null, true], 'birth-weight-set': ['weight', null, '16.4'],
    'birth-weight-conflict': ['weight', '16.4', null, false, { conflict: true }], 'birth-weight-deadtap': ['weight', '16.4', null, true, { dead: 'full' }],
    'birth-weight-saved': ['weight', null, '34.2', false, { saved: true }]
  };
  var name = STATES[PP.state] ? PP.state : 'no-task';
  var spec = STATES[name];
  var f = Object.assign({}, FX[spec[0]]);
  var weight = f.weight === 'missing' ? '' : f.weight;       // '' = missing
  var by = f.by || '', at = f.at || '';
  var drawer = spec[1] != null;                              // the birth-weight drawer is open
  var draft = spec[1] || '';                                 // typed string in the pad (the staged draft)
  var padOpen = !!spec[3];                                   // the docked Numpad is editing the Measure
  var padHint = '', padHintArgs = null;
  var opt = spec[4] || {};
  var conflict = !!opt.conflict;                             // Save found a weight that was set meanwhile
  var saved = null;                                          // receipt after Save
  if (opt.dead === 'full') { padHint = 'pp.edge.weight.dead_places'; }
  if (spec[2]) { weight = spec[2]; by = opt.saved ? 'here' : 'finish'; at = opt.saved ? stamp(29, '09:42', 'G.H') : stamp(28, '14:52', 'G.H'); }
  var usual = function (n) { return [(n * 0.8).toFixed(1), (n * 2.5).toFixed(1)]; };
  if (opt.saved) { var u0 = usual(f.live); saved = { w: weight, out: true, min: u0[0], max: u0[1] }; }

  function span(id, args, cls) {
    return '<span' + (cls ? ' class="' + cls + '"' : '') + ' data-str="' + id + '"' +
      (args ? " data-args='" + JSON.stringify(args).replace(/'/g, '&#39;') + "'" : '') + '></span>';
  }
  var pig = function (n) { return { id: 'pp.common.unit.piglet.' + (n === 1 && !zh ? 'one' : 'many'), args: { n: n } }; };
  function row(o) {
    var strs = { title: o.title }, args = { title: o.titleArgs };
    if (o.desc) { strs.description = o.desc; args.description = o.descArgs; }
    if (o.trail) { strs.trailing = o.trail; args.trailing = o.trailArgs; }
    return UI.row({ title: '', description: o.desc ? '' : undefined, trailing: o.trail ? '' : undefined, action: o.action, value: o.value, strs: strs, args: args });
  }
  function fact(label, n, meta, metaArgs) {
    var p = pig(n);
    return { label: '', value: '', strs: Object.assign({ label: label, value: p.id }, meta ? { meta: meta } : {}), args: Object.assign({ value: p.args }, meta ? { meta: metaArgs } : {}) };
  }
  function facts() {
    var items = [];
    if (f.born != null) items.push(fact('label.born', f.born, f.derived ? 'pp.edge.born.derived' : null));
    items.push(fact('label.alive', f.alive));
    items.push(fact('label.dead', f.dead, f.still ? 'pp.edge.dead.stillborn' : null, { n: f.still }));
    return UI.facts(items, { columns: items.length === 3 ? 3 : 2 });
  }
  function owed() {
    if (!f.owed) return '';
    return UI.rowGroup(f.owed.map(function (o) {
      // A mark records the heads counted at tap time; piglets born after it raise that dose's owed.
      return row({ action: 'record-treatment', value: o[0], title: 'pp.common.tx.' + o[0],
        desc: o[3] ? 'pp.edge.tx.desc_late.' + (o[1] === 1 && !zh ? 'one' : 'many') : 'pp.edge.tx.desc', descArgs: { n: o[1], d: o[2] } });
    }).join(''), { title: '', strs: { title: 'pp.edge.section.owed' } });
  }
  function recordGroup(withWhy) {
    return '<section class="edge-group" data-ds="Section">' +
      UI.heading({ title: '', description: withWhy ? '' : undefined, kind: 'group', level: 3,
        strs: Object.assign({ title: 'pp.edge.section.record' }, withWhy ? { description: 'pp.edge.notask.why' } : {}) }) +
      UI.rowGroup(
        row({ action: 'open-dead', value: 'dead', title: 'act.record_dead' }) +
        row({ action: 'open-count', value: 'count', title: 'pp.count.title' }) +
        row({ action: 'open-move', value: 'move', title: 'pp.move.title', desc: 'pp.edge.desc.move' })) + '</section>';
  }
  function weightRow() {
    if (!weight) return UI.rowGroup(row({ action: 'open-weight', value: 'weight', title: 'pp.edge.weight.title', trail: 'pp.edge.weight.optional' }));
    return UI.rowGroup(row({ action: 'open-farrowing-edit', value: 'birth-weight', title: 'pp.edge.weight.title',
      trail: 'pp.edge.weight.value', trailArgs: { w: weight },
      desc: by === 'finish' ? 'pp.edge.weight.by_finish' : 'pp.edge.weight.by_here', descArgs: { stamp: at } }));
  }
  function header() {
    var a = { pen: f.pen, tag: f.tag };
    return '<header class="utility-header"><div class="edge-title"><h3><button type="button" class="edge-door" data-action="open-sow" data-value="' + f.tag +
      '" data-str-attr="aria-label:pp.edge.hdr.sow_aria" data-args=\'' + JSON.stringify(a) + '\'>' + span('pp.edge.hdr.door', a, 'edge-mono') + ICON.icon('chevron') + '</button></h3>' +
      '<p class="edge-context">' + span('pp.edge.hdr.parity', { n: f.parity }) + span('pp.common.unit.day', { n: f.day }) + '</p></div></header>';
  }
  function body() {
    var out = [];
    if (f.band) out.push('<div class="edge-band" data-ds="Candidate:DangerBand" role="status">' + (f.cause
      ? span('pp.edge.orphan.band', { cause: PP.t('pp.edge.cause.prolapse'), stamp: f.band })
      : span('pp.edge.orphan.band_nocause', { stamp: f.band })) + '</div>');
    if (f.prelock) {
      out.push(UI.rowGroup(row({ action: 'open-farrowing', value: f.tag, title: 'pp.edge.prelock.door', desc: 'pp.edge.prelock.door_desc' })));
    }
    out.push(facts());
    if (f.record) out.push(recordGroup(!!f.noTask));
    out.push(owed());
    if (!f.prelock && f.live !== 0) out.push(weightRow());
    if (saved) out.push('<p class="edge-receipt" role="status"' + (saved.out ? ' data-tone="warn"' : '') + '>' + (saved.out
      ? span('pp.edge.weight.receipt_range', { w: saved.w, min: saved.min, max: saved.max }) : span('pp.edge.weight.receipt', { w: saved.w })) + '</p>');
    return out.join('');
  }
  function faceFooter() {
    return '<footer class="sheet-footer"><button type="button" class="button secondary" data-ds="Button" data-action="close" data-str="act.close"></button></footer>';
  }
  function drawerHtml() {
    var n = f.live;
    var min = (n * 0.8).toFixed(1), max = (n * 2.5).toFixed(1), hard = n * 5;          // usual 0.8-2.5 kg each; over 5 kg each is impossible
    var num = parseFloat(draft), has = !isNaN(num);
    var refused = has && num > hard, out = has && !refused && (num < +min || num > +max);
    var ms = { label: 'pp.edge.weight.label', optional: 'pp.edge.weight.optional', value: 'ds.field.figure', unit: 'ds.field.unit.kg', placeholder: 'ds.field.placeholder' };
    var margs = { value: { n: draft } }, hint = '';
    if (refused) { hint = ' '; ms.hint = 'ds.field.measure.refused'; margs.hint = { max: hard, n: n }; }
    else if (!padOpen && out) { hint = ' '; ms.hint = 'ds.field.measure.range'; margs.hint = { min: min, max: max, v: draft }; }
    var measure = UI.measure({ label: '', optional: '', value: draft, unit: 'kg', placeholder: '—', key: 'bw', active: padOpen, controls: 'bw-pad',
      tone: refused ? 'refused' : '', range: padOpen ? null : [+min, +max], hint: hint, strs: ms, args: margs });
    var cp = conflict ? '<div class="edge-conflict">' + UI.facts([{ label: '', value: '', meta: '', strs: { label: 'pp.edge.weight.conflict_label', value: 'pp.edge.weight.value', meta: 'pp.edge.data.stamp' },
        args: { value: { w: f.late.w }, meta: { stamp: f.late.at } } }], { columns: 1 }) +
      '<div class="edge-actions"><button type="button" class="button secondary" data-ds="Button" data-action="keep-theirs" data-str="pp.edge.weight.keep_theirs"></button>' +
      '<button type="button" class="button secondary" data-ds="Button" data-action="open-farrowing-edit" data-value="birth-weight" data-str="act.edit"></button></div></div>' : '';
    var pad = padOpen ? '<div class="edge-pad">' + UI.numpad({ decimals: 1, intLength: 2, value: draft, key: 'bw', id: 'bw-pad', hint: padHint ? ' ' : '',
      strs: Object.assign({ digit: 'ds.field.figure', decimal: 'ds.field.decimal', back: 'ds.field.aria.backspace', pad: 'ds.field.aria.pad' }, padHint ? { hint: padHint } : {}),
      args: { hint: padHintArgs } }) + '</div>' : '';
    var ok = has && num > 0 && !refused && !conflict;
    return '<div class="scrim"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="long" data-sizing="content" role="dialog" aria-modal="true">' +
      '<header class="utility-header"><div class="edge-title"><h3 data-str="pp.edge.weight.title"></h3><p>' + span('pp.edge.weight.pop', { n: n }) + '</p></div></header>' +
      '<div class="sheet-body"><div class="edge-drawer-body">' + measure + cp + '</div></div>' + pad +
      '<footer class="sheet-footer"><button type="button" class="button secondary" data-ds="Button" data-action="close-weight" data-str="act.back"></button>' +
      '<button type="button" class="button primary" data-ds="Button" data-action="save-weight" data-str="act.save"' + (ok ? '' : ' disabled') + '></button></footer></section>';
  }
  function render() {
    document.getElementById('screen').innerHTML =
      '<section class="sheet" data-ds="Sheet" data-presentation="page"' + (drawer ? ' inert' : '') + '>' + header() +
      '<div class="sheet-body"><div class="edge-body">' + body() + '</div></div>' + faceFooter() + '</section>' + (drawer ? drawerHtml() : '');
    PP.apply(document.getElementById('screen'));
  }
  function key(k) {
    var r = UI.numpadInput({ value: draft }, k, { decimals: 1, intLength: 2 });
    draft = r.value; padHint = ''; padHintArgs = null;
    if (r.dead === 'full') padHint = 'pp.edge.weight.dead_places';
    else if (r.dead === 'point') padHint = 'pp.edge.weight.dead_point';
    else if (r.dead === 'empty') padHint = 'ds.field.numpad.dead_empty';
  }
  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action;
    if (a === 'numpad') { key(b.dataset.key); render(); }   // floor-gray keys still answer through the reducer's dead reason
    else if (a === 'open-weight') { drawer = true; padOpen = !draft; render(); }
    else if (a === 'open-numpad') { if (!padOpen) { padOpen = true; padHint = ''; render(); } }   // tapping the active Measure does nothing
    else if (a === 'close-weight') { if (padOpen && draft) padOpen = false; else drawer = false; padHint = ''; render(); }   // Back closes the pad first; the draft is kept
    else if (a === 'save-weight') {
      var val = UI.numpadCommit(draft, { decimals: 1 });
      if (val == null || !(parseFloat(val) > 0) || parseFloat(val) > f.live * 5) return;
      if (f.late && !weight) { conflict = true; padOpen = false; render(); return; }        // only when missing: never overwrite a weight set meanwhile
      var u = usual(f.live);
      saved = { w: val, out: parseFloat(val) < +u[0] || parseFloat(val) > +u[1], min: u[0], max: u[1] };
      weight = val; by = 'here'; at = stamp(29, '09:42', 'G.H'); draft = ''; drawer = false; padOpen = false; render();
    } else if (a === 'keep-theirs') { weight = f.late.w; by = 'finish'; at = f.late.at; draft = ''; conflict = false; drawer = false; padOpen = false; render(); }
    else document.documentElement.setAttribute('data-door', a + ':' + (b.dataset.value || ''));
  });
  PP.ready.then(render);
})();
</script>
</body>
</html>
