<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge litters</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="shell.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css; one Candidate composition (the red band). The header, tools, Record group,
   weight row and receipt come from the shell (shell-ui.js, shell.css). */
.edge-phone { position: relative; max-width: 390px; height: 100vh; min-height: 640px; margin: 0 auto; overflow: hidden; background: var(--app-background); color: var(--ink); font-family: var(--font-sans); }
.edge-phone .scrim { inset: 0; }
.edge-body { display: flex; flex-direction: column; gap: var(--space-section); }
.edge-body > * { margin: 0; }
/* Candidate:DangerBand — farrowing's red warning band, on tokens only. */
.edge-band { padding: var(--space-panel); background: var(--red-wash); border: 1px solid var(--red); border-radius: var(--radius-inset); color: var(--red); font-size: 13px; font-weight: 500; }
.edge-drawer-body { display: flex; flex-direction: column; gap: var(--space-row-y); }
.edge-actions { display: flex; gap: var(--space-footer-gap); padding-top: var(--space-row-y); }
.edge-actions .button { flex: 1; }
.edge-pad { padding: 0 var(--space-gutter) var(--space-row-y); }
</style>
</head>
<body>
<main class="inspection-phone edge-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, U = window.PPUI;
  var zh = PP.lang === 'zh';

  // States: a crate of the shared fixture + UI state. Born, Alive, Dead, Owed, the sow's death and the birth litter weight
  // are the ledger's (select.litter; `farrowed` carries the weight set at Finish, `birth_weight` one recorded here, only
  // when missing; a concurrent second is kept as a conflict). [crate, typed draft, fixture variant, pad open, options]
  var STATES = {
    'no-task': ['E01'], 'orphan': ['B01'], 'orphan-unlocked': ['D06'], 'prelock': ['D01'],
    'birth-weight-missing': ['C02'], 'birth-weight-entry': ['C02', '', null, true], 'birth-weight-typed': ['C02', '16.4', null, true],
    'birth-weight-range': ['C02', '34.2', null, false], 'birth-weight-refused': ['C02', '99.9', null, true], 'birth-weight-set': ['C02', null, 'c02-weight-set'],
    // this phone's 16.4 synced after A.K had set 14.8 (farrowing's Edit, 09:38): the ledger keeps both, the first stands
    'birth-weight-conflict': ['C02', null, 'c02-weight-conflict'], 'birth-weight-deadtap': ['C02', '16.4', null, true, { dead: 'full' }],
    'birth-weight-saved': ['C02', null, 'c02-weight-saved', false, { saved: true }]
  };
  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'no-task';
  var spec = STATES[name];
  var store, crate, SOW, TODAY;
  var weight = null;                                         // the birth litter weight { kg, by, at, who } or null (missing)
  var drawer = spec[1] != null;                              // the birth-weight drawer is open
  var draft = spec[1] || '';                                 // typed string in the pad (the staged draft)
  var padOpen = !!spec[3];                                   // the docked Numpad is editing the Measure
  var padHint = '', padHintArgs = null;
  var opt = spec[4] || {};
  var conflict = null;                                       // this phone's weight, kept as a conflict with one set meanwhile
  var saved = null;                                          // receipt after Save
  if (opt.dead === 'full') { padHint = 'pp.edge.weight.dead_places'; }

  function L() { return store.derived.litters[crate]; }
  function view() { return store.select.litter(store.derived, crate); }
  // Live-born: Born less the born dead (stillborn, mummified) — the population the birth litter weight is taken of.
  function liveBorn() { var c = L().dead.byCause; return L().born - (c.stillborn || 0) - (c.mummified || 0); }
  var usual = function (n) { return [(n * 0.8).toFixed(1), (n * 2.5).toFixed(1)]; };
  function span(id, args, cls) { return U.span(id, args, { cls: cls }); }
  var pig = function (n) { return { id: PP.one('pp.common.unit.piglet', n), args: { n: n } }; };
  function row(o) {
    var strs = { title: o.title }, args = { title: o.titleArgs };
    if (o.desc) { strs.description = o.desc; args.description = o.descArgs; }
    if (o.trail) { strs.trailing = o.trail; args.trailing = o.trailArgs; }
    return UI.row({ title: '', description: o.desc ? '' : undefined, trailing: o.trail ? '' : undefined, action: o.action, value: o.value, strs: strs, args: args });
  }
  function fact(label, n, meta, metaArgs) {
    var p = pig(n);
    return { label: '', value: '', strs: Object.assign({ label: label, value: p.id }, meta ? { meta: meta } : {}), args: Object.assign({ value: p.args }, meta ? { meta: metaArgs } : {}) };
  }
  function facts() {
    var x = L(), items = [], still = x.dead.byCause.stillborn || 0;
    // Before the lock Born is not final: processing prints Alive and Dead only.
    if (x.phase === 'locked') items.push(fact('label.born', x.born, x.endedBySowDeath ? 'pp.edge.born.derived' : null));
    items.push(fact('label.alive', x.alive));
    items.push(fact('label.dead', x.dead.total, still ? 'pp.edge.dead.stillborn' : null, { n: still }));
    return UI.facts(items, { columns: items.length === 3 ? 3 : 2 });
  }
  function owed() {
    if (!L().recordable) return '';
    var xs = view().owed;
    if (!xs.length) return '';
    return UI.rowGroup(xs.map(function (o) {
      // A mark records the heads counted at tap time; piglets born after it raise that dose's owed.
      var after = o.owedFrom.filter(function (f) { return f.kind === 'born_after_mark'; })[0];
      var d = CFG().doses.filter(function (x) { return x.id === o.dose; })[0];
      var desc = after ? [PP.one('pp.edge.tx.desc_late', after.n), { n: after.n }] : o.owed == null ? ['pp.edge.tx.desc_due', { d: o.due }] : ['pp.edge.tx.desc', { n: o.owed, d: o.due }];
      return row({ action: 'record-treatment', value: o.dose, title: 'pp.common.tx.' + d.tx, desc: desc[0], descArgs: desc[1] });
    }).join(''), { title: '', strs: { title: 'pp.edge.section.owed' } });
  }
  function CFG() { return store.config; }
  function header() { return U.litterHeader({ crate: crate, sow: SOW.sow, parity: SOW.parity, day: L().dayAge }); }
  function band() {
    var sd = L().sowDied;
    if (!sd) return '';
    var st = U.stamp(sd.at, sd.who, '');
    return '<div class="edge-band" data-ds="Candidate:DangerBand" role="status">' + (sd.cause
      ? span('pp.edge.orphan.band', { cause: PP.t('pp.edge.cause.' + sd.cause), stamp: st })
      : span('pp.edge.orphan.band_nocause', { stamp: st })) + '</div>';
  }
  function body() {
    var out = [], x = L();
    out.push(band());
    if (x.phase === 'open') out.push(UI.rowGroup(row({ action: 'open-farrowing', value: SOW.sow, title: 'pp.edge.prelock.door', desc: 'pp.edge.prelock.door_desc' })));
    out.push(facts());
    if (x.phase === 'locked') {
      out.push(U.tools(crate));
      out.push(U.recordGroup({ crate: crate, why: x.recordable ? null : 'pp.edge.notask.why', today: TODAY }));
    }
    out.push(owed());
    if (x.phase === 'locked') out.push(UI.rowGroup(U.weightRow(weight, crate, TODAY)));
    if (saved) out.push(saved.out ? U.receipt([{ id: 'pp.edge.weight.receipt_range', args: { w: saved.w, min: saved.min, max: saved.max }, tone: 'amber' }])
      : U.receipt([{ id: 'pp.edge.weight.receipt', args: { w: saved.w } }]));
    return out.join('');
  }
  function faceFooter() {
    return '<footer class="sheet-footer"><button type="button" class="button secondary" data-ds="Button" data-action="close" data-str="act.close">' + U.esc(PP.t('act.close')) + '</button></footer>';
  }
  function drawerHtml() {
    var n = liveBorn();
    var min = (n * 0.8).toFixed(1), max = (n * 2.5).toFixed(1), hard = n * 5;          // usual 0.8-2.5 kg each; over 5 kg each is impossible
    var num = parseFloat(draft), has = !isNaN(num);
    var refused = has && num > hard, out = has && !refused && (num < +min || num > +max);
    var ms = { label: 'pp.edge.weight.label', optional: 'pp.common.weight.optional', value: 'ds.field.figure', unit: 'ds.field.unit.kg', placeholder: 'ds.field.placeholder' };
    var margs = { value: { n: draft } }, hint = '';
    if (refused) { hint = ' '; ms.hint = 'ds.field.measure.refused'; margs.hint = { max: hard, n: n }; }
    else if (!padOpen && out) { hint = ' '; ms.hint = 'ds.field.measure.range'; margs.hint = { min: min, max: max, v: draft }; }
    var measure = UI.measure({ label: '', optional: '', value: draft, unit: 'kg', placeholder: '—', key: 'bw', active: padOpen, controls: 'bw-pad',
      tone: refused ? 'refused' : '', range: padOpen ? null : [+min, +max], hint: hint, strs: ms, args: margs });
    var cp = conflict ? '<div class="edge-conflict">' + UI.facts([{ label: '', value: '', meta: '', strs: { label: 'pp.edge.weight.conflict_label', value: 'pp.common.kg', meta: 'pp.edge.data.stamp' },
        args: { value: { w: weight.kg }, meta: { stamp: U.stamp(weight.at, weight.who, TODAY) } } }], { columns: 1 }) +
      '<div class="edge-actions"><button type="button" class="button secondary" data-ds="Button" data-action="keep-theirs" data-str="pp.edge.weight.keep_theirs"></button>' +
      '<button type="button" class="button secondary" data-ds="Button" data-action="open-farrowing-edit" data-value="birth-weight" data-str="act.edit"></button></div></div>' : '';
    var pad = padOpen ? '<div class="edge-pad">' + UI.numpad({ decimals: 1, intLength: 2, value: draft, key: 'bw', id: 'bw-pad', hint: padHint ? ' ' : '',
      strs: Object.assign({ digit: 'ds.field.figure', decimal: 'ds.field.decimal', back: 'ds.field.aria.backspace', pad: 'ds.field.aria.pad' }, padHint ? { hint: padHint } : {}),
      args: { hint: padHintArgs } }) + '</div>' : '';
    var ok = has && num > 0 && !refused && !conflict;
    return '<div class="scrim"></div><section class="sheet" data-ds="Sheet" data-st-context="drawer" data-size="long" data-sizing="content" role="dialog" aria-modal="true">' +
      '<header class="utility-header"><div class="pp-hdr-title"><h3 data-str="pp.common.weight.title"></h3><p>' + span('pp.edge.weight.pop', { n: n }) + '</p></div></header>' +
      '<div class="sheet-body"><div class="edge-drawer-body">' + measure + cp + '</div></div>' + pad +
      '<footer class="sheet-footer"><button type="button" class="button secondary" data-ds="Button" data-action="close-weight" data-str="act.back"></button>' +
      '<button type="button" class="button primary" data-ds="Button" data-action="save-weight" data-str="act.save"' + (ok ? '' : ' disabled') + '></button></footer></section>';
  }
  function render() {
    document.getElementById('screen').innerHTML =
      '<section class="sheet" data-ds="Sheet" data-presentation="page"' + (drawer ? ' inert' : '') + '>' + header() +
      '<div class="sheet-body"><div class="edge-body">' + body() + '</div></div>' + faceFooter() + '</section>' + (drawer ? drawerHtml() : '');
    PP.apply(document.getElementById('screen'));
  }
  function key(k) {
    var r = UI.numpadInput({ value: draft }, k, { decimals: 1, intLength: 2 });
    draft = r.value; padHint = ''; padHintArgs = null;
    if (r.dead === 'full') padHint = 'pp.edge.weight.dead_places';
    else if (r.dead === 'point') padHint = 'pp.edge.weight.dead_point';
    else if (r.dead === 'empty') padHint = 'ds.field.numpad.dead_empty';
  }
  function nav(page, params) { location.href = PP.href(page, Object.assign({ data: store.name !== 'base' ? store.name : '' }, params)); }
  document.getElementById('screen').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action;
    if (a === 'numpad') { key(b.dataset.key); render(); }   // floor-gray keys still answer through the reducer's dead reason
    else if (a === 'open-weight') { drawer = true; padOpen = !draft; render(); }
    else if (a === 'open-numpad') { if (!padOpen) { padOpen = true; padHint = ''; render(); } }   // tapping the active Measure does nothing
    else if (a === 'close-weight') { if (padOpen && draft) padOpen = false; else drawer = false; padHint = ''; render(); }   // Back closes the pad first; the draft is kept
    else if (a === 'save-weight') {
      var val = UI.numpadCommit(draft, { decimals: 1 });
      if (val == null || !(parseFloat(val) > 0) || parseFloat(val) > liveBorn() * 5 || conflict) return;
      // only when missing: the ledger refuses a weight this phone saw set, and keeps one it could not have seen as a conflict
      var r = store.commit({ type: 'birth_weight', litter: crate, kg: val });
      if (!r.ok) { readWeight(); render(); return; }
      readWeight();
      if (conflict) { padOpen = false; render(); return; }
      var u = usual(liveBorn());
      saved = { w: val, out: parseFloat(val) < +u[0] || parseFloat(val) > +u[1], min: u[0], max: u[1] };
      draft = ''; drawer = false; padOpen = false; render();
    } else if (a === 'keep-theirs') {
      // keeping theirs withdraws this phone's weight: a stamped correction, the original kept
      if (conflict) store.commit({ type: 'correction', target: conflict.event, void: true });
      readWeight(); draft = ''; drawer = false; padOpen = false; render();
    }
    else if (a === 'close') nav('room.html', { state: 'room', unit: qs.get('unit') });
    else if (a === 'open-dead') nav('dead.html', { state: 'dead', crate: crate, unit: qs.get('unit') });
    else if (a === 'open-move') nav('move.html', { state: 'move', crate: crate });
    else if (a === 'record-treatment') nav('litter.html', { state: 'litter', crate: crate, stay: 1, unit: qs.get('unit') });
    else document.documentElement.setAttribute('data-door', a + ':' + (b.dataset.value || ''));
  });
  function readWeight() {
    weight = L().birthWeight;
    conflict = (L().birthWeightConflicts || []).filter(function (c) { return c.who === window.PPFixtures.ME; })[0] || null;
    if (conflict) { drawer = true; draft = conflict.kg; }
  }
  PP.ready.then(function () {
    store = PP.open(spec[2] || 'base');
    TODAY = store.today;
    crate = qs.get('crate') || spec[0];
    if (qs.get('sow')) crate = store.crateOfSow(qs.get('sow')) || crate;
    SOW = store.sow(crate) || { sow: '', parity: 0, weight: null };
    readWeight();
    if (opt.saved && weight) { var u0 = usual(liveBorn()); saved = { w: weight.kg, out: +weight.kg < +u0[0] || +weight.kg > +u0[1], min: u0[0], max: u0[1] }; }
    render();
  });
})();
</script>
</body>
</html>
