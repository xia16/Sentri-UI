<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record death</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="/ux/design-system/components/task-skeleton.css">
<script type="module" src="ledger.js"></script>
<script type="module" src="fixtures.js"></script>
<style>
/* Layout only, tokens from tokens.css. The page is the task skeleton (ADR 0003): TaskPhone, TaskSheet (grab, title,
   subtitle, ✕ or Clear, divider, body, footer with Back + Save), TaskGroup/TaskRow for crates, TaskDialog for one
   question. The body is cards: Segment, Stepper, ChoiceList, Row, Photos, Banner, Button's reason line. */
/* The room behind the drawer: the page the worker returns to, drawn by its own page (inert, never focusable). */
.dd-over { display: contents; }
.dd-behind { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--app-background); pointer-events: none; }
/* The sheet body is one column of sections, farrowing's rhythm. */
.dd-body { display: flex; flex-direction: column; gap: var(--space-heading); }
.dd-body > * { margin: 0; }
.dd-body > .st-segment { margin-bottom: 2px; }
.tk-sheet .tk-group-head { position: static; }
/* the photo viewer: one photo, full width (a stand-in frame: the prototype has no camera) */
.dd-photo { display: grid; place-items: center; width: 100%; aspect-ratio: 3 / 4; border-radius: var(--radius-inset); background: var(--well); color: var(--muted); font-family: var(--font-mono); font-size: var(--type-button-size); }
</style>
</head>
<body class="tk-stage">
<div id="screen"></div>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="/ux/design-system/components/task-skeleton.js"></script>
<script src="shell.js"></script>
<script src="shell-ui.js"></script>
<script>
(function () {
  var UI = window.SentriUI, U = window.PPUI, K = window.SentriTask;

  /* ---- The drawer forks on the litter's phase (open · locked), never on the task or the surface. Every figure is the
     ledger's (select.deathDraft over the shared fixture): causes by phase, the roster (alive and counted-missing tagged
     piglets), the cap, the from-the-missing range, why Save waits and Alive after. Save commits through append and returns
     to where the worker came from (`back`, else the litter drawer over the room) with the receipt; Back keeps the draft on
     this phone and returns the same way. Behind the drawer: the room, as its own page draws it. ---- */
  var SOW = { open: ['farrowing', 'prolapse', 'found', 'other'], locked: ['prolapse', 'found', 'other'] };
  var KEY = function (c) { return c.replace('-', '_'); };            // the ledger's `starve-out` is the registry's `starve_out`
  // state → crate, data, the draft shown (pig: tallies, picks {rowId: cause}, miss {rowId: yes|no}, k, photos n, note, route;
  // sow cause), kept (a draft restored from this phone), view (a photo open), found (the room's `Found a body`), sub (a
  // view inside the drawer: tagged · nb · held)
  var STATES = {
    'dead':                   { crate: 'A02' },
    'dead-tallied':           { crate: 'A02', pig: { tallies: { crushed: 1 } } },
    'dead-draft':             { crate: 'A02', kept: { pig: { tallies: { crushed: 1 } } } },
    'dead-draft-sow':         { crate: 'A02', kept: { sow: { cause: 'prolapse' } } },
    'dead-photos':            { crate: 'A02', pig: { tallies: { crushed: 1 }, photos: 2 } },
    'dead-photo-view':        { crate: 'A02', pig: { tallies: { crushed: 1 }, photos: 2 }, view: 2 },
    'dead-photo-deleted':     { crate: 'A02', pig: { tallies: { crushed: 1 }, photos: 2 }, deleteAt: 2 },
    'dead-other':             { crate: 'A02', pig: { tallies: { other: 1 } } },
    'dead-routed':            { crate: 'A02', pig: { tallies: { crushed: 1 }, route: 'D03' } },
    'dead-neighbours':        { crate: 'A02', data: 'explain', pig: { tallies: { crushed: 1 } } },
    'dead-neighbours-list':   { crate: 'A02', data: 'explain', pig: { tallies: { crushed: 1 } }, sub: 'nb' },
    'dead-found':             { unit: 7, data: 'explain', found: true },
    'dead-tagged':            { crate: 'B06' },
    'dead-tagged-list':       { crate: 'B06', sub: 'tagged' },
    'dead-tagged-picked':     { crate: 'B06', sub: 'tagged', pig: { tallies: { scours: 1 }, picks: { 'B06-r4': 'crushed', 'B06-r9': 'crushed' } } },
    'dead-tagged-nocause':    { crate: 'B06', sub: 'tagged', pig: { picks: { 'B06-r4': '' } } },
    'dead-tagged-second':     { crate: 'B06', sub: 'tagged', pig: { picks: { 'B06-r4': 'crushed', 'B06-r9': '' } } },
    'dead-tagged-missing':    { crate: 'B06', sub: 'tagged', data: 'explain', pig: { picks: { 'B06-r4': 'crushed' } } },
    'dead-tagged-missing-yes':{ crate: 'B06', sub: 'tagged', data: 'explain', pig: { picks: { 'B06-r4': 'crushed' }, miss: { 'B06-r4': 'yes' } } },
    'dead-tagged-named':      { crate: 'B06', sub: 'tagged', data: 'explain-named', pig: { picks: { 'B06-r4': 'crushed' } } },
    'dead-tagged-back':       { crate: 'B06', data: 'explain', pig: { picks: { 'B06-r4': 'crushed' }, miss: { 'B06-r4': 'yes' } } },
    'dead-open-loss':         { crate: 'D03', pig: { tallies: { crushed: 1 } } },
    'dead-open-loss-yes':     { crate: 'D03', pig: { tallies: { crushed: 1 }, k: 1 } },
    'dead-open-loss-no':      { crate: 'D03', pig: { tallies: { crushed: 1 }, k: 0 } },
    'dead-open-loss-split':   { crate: 'D03', pig: { tallies: { crushed: 2 }, k: 1 } },
    'dead-open-loss-floor':   { crate: 'D03', pig: { tallies: { crushed: 12 }, k: 2 } },
    'dead-held':              { crate: 'A07', data: 'held-body' },
    'dead-held-ask':          { crate: 'A07', data: 'held-body', sub: 'held' },
    'dead-sow':               { crate: 'A02', mode: 'sow', sow: { cause: 'prolapse' } },
    'dead-sow-other':         { crate: 'A02', mode: 'sow', sow: { cause: 'other' } },
    'dead-sow-recorded':      { crate: 'B01' },
    'farrowing-drawer':       { crate: 'D01', surface: 'farrowing' },
    'farrowing-drawer-draft': { crate: 'D01', surface: 'farrowing', pig: { tallies: { crushed: 1 } } },
    'farrowing-drawer-locked':{ crate: 'A07', surface: 'farrowing', pig: { tallies: { crushed: 1 } } }
  };
  var qs = PP.q;
  var name = STATES[PP.state] ? PP.state : 'dead';
  var spec = JSON.parse(JSON.stringify(STATES[name]));
  var store, crate, surface, S, photoSeq = 0;

  function emptyPig() { return { tallies: {}, picks: {}, miss: {}, k: null, photos: [], note: '', route: '' }; }
  function emptySow() { return { cause: '', note: '', photos: [] }; }
  function shots(n) { var out = []; for (var i = 0; i < (n || 0); i++) out.push({ id: 'ph-' + (++photoSeq) }); return out; }

  /* ---- the draft on this phone: key litter + mode (the piglet and the sow drafts are separate). Saved on every change
     (sessionStorage); a state that shows a draft holds it in memory only. The loss answer is never kept (re-asked). ---- */
  var mem = null;
  var DKEY = function () { return 'pp-dead-draft:' + store.name + ':' + crate; };
  function pigDirty(p) { p = p || S.pig; return Object.keys(p.tallies).some(function (c) { return p.tallies[c] > 0; }) || Object.keys(p.picks).length > 0 || p.photos.length > 0 || !!p.note; }
  function sowDirty(s) { s = s || S.sow; return !!s.cause || s.photos.length > 0; }
  function keep() {
    if (!crate) return;
    var pig = pigDirty() ? { tallies: S.pig.tallies, picks: S.pig.picks, miss: S.pig.miss, photos: S.pig.photos, note: S.pig.note, route: S.pig.route } : null;
    var d = pig || sowDirty() ? { pig: pig, sow: sowDirty() ? S.sow : null } : null;
    if (mem) { mem.d = d; return; }
    try { if (d) sessionStorage.setItem(DKEY(), JSON.stringify(d)); else sessionStorage.removeItem(DKEY()); } catch (e) {}
  }
  function kept() { if (mem) return mem.d; try { return JSON.parse(sessionStorage.getItem(DKEY()) || 'null'); } catch (e) { return null; } }

  /* ---- the ledger ---- */
  var tgt = function () { return S.pig.route || crate; };                  // the litter the body is recorded on
  function Lx() { return store.derived.litters[tgt()]; }
  function Hx() { return store.derived.litters[crate]; }                    // the litter the drawer was opened over
  var memo = { key: '', val: null };
  function fromLoss() { var o = {}; Object.keys(S.pig.miss).forEach(function (r) { if (S.pig.miss[r] === 'yes' && r in S.pig.picks) o[r] = true; }); return o; }
  function draft() {
    var t = {}; Object.keys(S.pig.tallies).forEach(function (c) { if (S.pig.tallies[c]) t[c] = S.pig.tallies[c]; });
    var dr = { tallies: t, picks: S.pig.picks, k: S.pig.k, fromLoss: fromLoss() }, key = tgt() + JSON.stringify(dr) + store.events.length;
    if (memo.key !== key) memo = { key: key, val: store.select.deathDraft(store.derived, tgt(), dr, { who: window.PPFixtures.ME }) };
    return memo.val;
  }
  var sum = function (o) { return Object.keys(o).reduce(function (t, k) { return t + (o[k] || 0); }, 0); };
  var locked = function () { return Lx().phase === 'locked'; };
  var causes = function () { return draft().causes.map(KEY); };
  var alive = function () { return Lx().alive; };
  var rows = function () { return Lx().identity.rows; };
  // the roster: alive tagged piglets and those a count named missing (a named missing piglet's body closes its own loss)
  var rosterOf = function () { var m = {}; draft().roster.forEach(function (r) { m[r.rowId] = r; }); return m; };
  var roster = function () { var m = rosterOf(); return rows().filter(function (r) { return m[r.rowId]; }).map(function (r) { return Object.assign({}, r, { status: m[r.rowId].status, canBeMissing: m[r.rowId].canBeMissing }); }); };
  var picks = function () { return Object.keys(S.pig.picks); };
  var bodies = function () { return sum(S.pig.tallies); };              // unidentified bodies only
  var pigN = function () { return bodies() + picks().length; };
  // picked alive tagged piglets that may be the one a count found missing: each is asked (R1-9)
  var askMiss = function () { var m = rosterOf(); return picks().filter(function (r) { return m[r] && m[r].canBeMissing; }); };
  function settleK() {                          // raising bodies raises k to its floor; the answer survives while valid
    var d = draft();
    if (!bodies()) { S.pig.k = null; return; }
    // routed to a neighbour's loss or found from the room: the bodies are that litter's missing, up to what is open
    if (S.presume && !S.kTouched && d.asksLoss) S.pig.k = d.kMax;
    if (d.kMin > 0) S.pig.k = Math.max(S.pig.k == null ? 0 : S.pig.k, d.kMin);
    if (S.pig.k != null) S.pig.k = Math.min(S.pig.k, d.kMax);
  }
  var modes = function () { return Lx().sowDied ? ['piglets'] : ['piglets', 'sow']; };
  var idLabel = function (p) { return p.tag ? { id: 'ds.dead.id.tag', args: { tag: p.tag } } : { id: 'ds.dead.id.notch', args: { notch: p.notch } }; };
  var rowOf = function (id) { return rows().filter(function (p) { return p.rowId === id; })[0]; };
  var idText = function (p) { var l = idLabel(p); return PP.t(l.id, l.args); };
  var pl = PP.one;
  function np(n) { return PP.tn('pp.common.unit.piglet', n); }
  function lossOfRow(id) { return Lx().unexplained.losses.filter(function (x) { return x.rows.indexOf(id) >= 0; })[0] || null; }
  function heldOpen() { return (Lx().held || []).filter(function (h) { return !h.resolved; }); }

  // Why Save waits, first missing step first (the drawer's own steps, then what append would refuse). Each reason names where to go.
  function why() {
    if (S.mode === 'sow') {
      if (pigN()) return { id: 'ds.dead.why.sow_pending', args: { n: pigN() }, to: 'mode-piglets' };
      if (!S.sow.cause) return { id: 'ds.dead.why.sow_cause', to: 'sow-causes' };
      return null;
    }
    var d = draft(), bare = picks().filter(function (r) { return !S.pig.picks[r]; });
    if (d.why === 'empty') return { id: 'ds.dead.why.empty', to: 'tallies', quiet: true };
    if (d.why === 'cause_one') return { id: 'ds.dead.why.cause_one', args: { id: idText(rowOf(bare[0])) }, to: 'pick-cause', sub: 'tagged' };
    if (d.why === 'cause_many') return { id: 'ds.dead.why.cause_many', args: { n: bare.length }, to: 'pick-cause', sub: 'tagged' };
    if (d.why === 'over_cap') return { id: 'ds.dead.hint.cap', args: { n: d.cap }, to: 'tallies' };
    if (d.why === 'missing') return { id: 'ds.dead.why.missing', to: 'loss' };
    var open = askMiss().filter(function (r) { return !S.pig.miss[r]; });
    if (open.length) return { id: 'pp.dead.why.row_missing', args: { id: idText(rowOf(open[0])) }, to: 'miss-' + open[0], sub: 'tagged' };
    if (d.why) return { id: 'ds.dead.why.check', to: 'tallies' };
    return null;
  }

  // ---- Helpers ------------------------------------------------------------------------------
  function span(id, args, cls) { return U.span(id, args, { cls: cls }); }
  var s = function (id, args) { return { text: PP.t(id, args), str: id, args: args }; };       // a skeleton text slot
  function textAct(action, id, args, value) { return UI.button({ label: PP.t(id, args), register: 'text', action: action, value: value || '', strs: { label: id }, args: args ? { label: args } : undefined }); }
  function btn(action, id, register, o) {
    o = o || {};
    return UI.button({ label: PP.t(id), register: register, action: action, value: o.value || '', waiting: !!o.waiting, describedby: o.describedby || '', strs: { label: id } });
  }
  function radios(action, key, options, selected, labelId, labelArgs) {
    return UI.choiceRadios({ label: '', layout: 'rows', action: action, key: key, selected: selected || '', id: 'dd-' + key.replace(/[^\w-]/g, ''),
      strs: labelId ? { label: labelId } : undefined, args: labelArgs ? { label: labelArgs } : undefined,
      options: options.map(function (o) { return { value: o.v, label: '', strs: { label: o.id }, args: o.args ? { label: o.args } : undefined }; }) });
  }
  // A door row (Row card): one title, at most one meta line, a chevron.
  function door(action, value, title, titleArgs, desc, descArgs, trailing) {
    var strs = { title: title }, args = { title: titleArgs };
    if (desc) { strs.description = desc; args.description = descArgs; }
    if (trailing) { strs.trailing = trailing; }
    return UI.row({ title: '', description: desc ? '' : undefined, trailing: trailing ? '' : undefined, action: action, value: value || '', strs: strs, args: args });
  }

  // ---- The room behind the drawer: the room page itself, inert (the drawer always leads; Back and Save leave the page) ----
  function behind() {
    var src = PP.href('room.html', { state: 'room', unit: S.unit !== 7 ? S.unit : '', data: store.name !== 'base' ? store.name : '' });
    return '<iframe class="dd-behind" src="' + U.esc(src) + '" title="" aria-hidden="true" tabindex="-1" inert></iframe>';
  }

  // ---- The drawer: piglets ------------------------------------------------------------------
  function tallyRow(c) {
    var d = S.pig.tallies[c] || 0, full = bodies() >= draft().cap;
    var cause = PP.t('ds.dead.cause.' + c);
    return UI.stepper({ label: '', value: d, min: 0, max: full ? d : null, key: c, action: 'dead-step',
      draft: d > 0, reserveHint: S.hint === c, hint: S.hint === c ? ' ' : '',
      strs: Object.assign({ label: 'ds.dead.cause.' + c, value: 'ds.field.figure', decrease: 'pp.dead.aria.less', increase: 'pp.dead.aria.more' },
        S.hint === c ? { hint: roster().length ? 'ds.dead.hint.cap_identified' : 'ds.dead.hint.cap' } : {}),
      args: { hint: { n: draft().cap }, decrease: { cause: cause }, increase: { cause: cause } } });
  }
  function lossStepper() {
    var d = draft();
    if (!d.asksLoss) return '';
    var m = d.openLoss, a = alive(), b = bodies(), k = S.pig.k, hint;
    if (!b) hint = { id: 'ds.dead.loss.open', args: { m: m } };
    else if (k == null) hint = { id: 'ds.dead.loss.ask' };
    else if (d.kMin > 0 && k === d.kMin) hint = { id: 'ds.dead.loss.atleast', args: { n: d.kMin } };
    else if (d.after) {
      var after = d.after.alive, left = d.after.openLoss;
      hint = a === after ? (left ? { id: 'ds.dead.loss.stay', args: { a: a, left: left } } : { id: 'ds.dead.loss.closed', args: { a: a } })
        : { id: 'ds.dead.loss.move', args: { a: a, b: after, left: left } };
    } else hint = { id: 'ds.dead.loss.ask' };
    // `None were missing` is an explicit answer (a text action), so the floor-gray minus keeps its one meaning.
    var none = b && k == null && !d.kMin ? [{ label: PP.t('ds.dead.loss.none'), action: 'loss-none', strs: { label: 'ds.dead.loss.none' } }] : [];
    return '<div data-target="loss">' + UI.stepper({ label: '', value: k || 0, min: k == null ? 0 : d.kMin, max: d.kMax, key: 'k', action: 'loss-step', hint: ' ', pointers: none,
      strs: { label: 'ds.dead.loss.label', value: 'ds.field.figure', hint: hint.id, decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase' },
      args: { label: { m: m }, hint: hint.args } }) + '</div>';
  }
  /* A body found outside its crate (R1-8): other litters in this room with a piglet missing. Tapping one records the
     draft there, from that litter's open loss (the app never pairs by itself: the worker says whose it is). */
  function neighbours() {
    if (surface !== 'processing' || !crate || !Hx() || Hx().phase !== 'locked') return [];
    var room = Hx().room, out = [], all = store.derived.litters;
    Object.keys(all).sort().forEach(function (id) {
      var L = all[id];
      if (id === crate || L.room !== room || L.phase !== 'locked' || !L.unexplained.openLoss) return;
      var d = store.select.deathDraft(store.derived, id, { tallies: { crushed: 1 } });
      if (!d.asksLoss) return;
      out.push({ id: id, m: d.openLoss - d.roster.filter(function (r) { return r.status === 'missing'; }).length, loss: d.losses[0] });
    });
    return out;
  }
  // One compact row, shown once a body is counted: routed (tap = record it here instead), one neighbour (tap = record it
  // there), or several (tap = the list, one level down).
  function neighbourRow() {
    if (S.pig.route) return '<div data-target="route">' + UI.rowGroup(door('route', crate, 'pp.dead.route.title', { code: tgt(), from: crate }, null, null, 'ds.c2.undo')) + '</div>';
    if (!bodies()) return '';
    var list = neighbours();
    if (!list.length) return '';
    if (list.length === 1) return UI.rowGroup(door('route', list[0].id, pl('pp.dead.nb.row', list[0].m), { code: list[0].id, m: list[0].m }));
    return UI.rowGroup(door('sub', 'nb', 'pp.dead.nb.title', null, pl('pp.dead.nb.some', list.length), { n: list.length }));
  }
  // The litter's tagged piglets (Q9: the shared picker shows them when there are any): one row here, the list one level down.
  function taggedRow() {
    var rs = roster();
    if (!rs.length) return '';
    var n = picks().length;
    return '<div data-target="tagged">' + UI.rowGroup(door('sub', 'tagged', 'ds.dead.identified', { n: rs.length }, n ? pl('pp.dead.tagged.picked', n) : null, { n: n })) + '</div>';
  }
  // The same body recorded twice (RULINGS round 3), shown where the next body is recorded (R1-22): one row, answered
  // in a dialog over the drawer.
  function heldRow() {
    return heldOpen().map(function (h) {
      return '<div data-target="held">' + UI.rowGroup(door('sub', 'held', 'pp.count.held.title', null, 'pp.count.held.row', { b: h.who, t: U.time(h.at) })) + '</div>';
    }).join('');
  }
  // Photos ride this Save: kept on the event, previewed and removable before Save (the viewer), shown in the record.
  function photoField(key, active) {
    var list = S[key].photos, del = S.deleted && S.deleted.key === key;
    var hint = del ? 'ds.c2.photos.deleted' : S.photoHint[key] || '';
    return UI.photos({ label: '', optional: '', key: key, id: 'dd-photos-' + key, active: active, items: list.map(function (p) { return { id: p.id }; }),
      count: list.length ? { text: '', strs: { text: 'ds.c2.photos.attached' }, args: { text: { n: list.length } } } : null, hint: hint ? ' ' : '',
      strs: Object.assign({ label: 'ds.dead.photos', optional: 'ds.field.optional', camera: 'ds.c2.aria.camera', thumb: 'ds.c2.aria.thumb', index: 'ds.c2.photos.index' }, hint ? { hint: hint } : {}),
      args: { hint: { n: 12 } } }) + (del ? textAct('photo-undo', 'ds.c2.undo', null, key) : '');
  }
  function noteField(key) {
    return UI.field({ label: span(key === 'pigNote' ? 'pp.dead.other_note' : 'ds.dead.sow.other_label'),
      control: '<input type="text" data-field="' + key + '" value="' + U.esc(key === 'pigNote' ? S.pig.note : S.sow.note) + '">', ds: 'Field' });
  }
  // Why Save waits: the footer's status line, directly above Back + Save (it is Save's description)
  function status() {
    var w = why(), show = w && (!w.quiet || S.why);
    return show ? { text: PP.t(w.id, w.args), str: w.id, args: w.args, id: 'dd-why' } : null;
  }
  function piglets() {
    var out = [heldRow(), '<div data-target="tallies">' + causes().map(tallyRow).join('') + lossStepper() + '</div>'];
    if (S.pig.tallies.other > 0 || picks().some(function (r) { return S.pig.picks[r] === 'other'; })) out.push(noteField('pigNote'));
    out.push(neighbourRow(), taggedRow(), photoField('pig', pigN() > 0));
    return out.join('');
  }
  function sowMode() {
    var phase = locked() ? 'locked' : 'open';
    var out = ['<div data-target="sow-causes">' + radios('sow-cause', 'sow-cause', SOW[phase].map(function (c) { return { v: c, id: 'ds.dead.sow.' + c }; }), S.sow.cause) + '</div>'];
    if (S.sow.cause === 'other') out.push(noteField('sowNote'));
    out.push(photoField('sow', !!S.sow.cause));
    var stay = surface === 'processing' ? 'pp.dead.sow.stay' : 'ds.dead.sow.stay_' + phase;
    out.push(UI.banner({ tone: 'danger', headline: '', consequence: '', live: true, id: 'dd-sow-warn', strs: { headline: 'ds.dead.sow.warn_' + phase, consequence: stay }, args: { consequence: { n: alive() } } }));
    return out.join('');
  }
  function footer(back) {
    var w = why(), gray = !!w, st = status();
    if (S.mode === 'sow') {
      // the hold's progress line is the same status slot (empty until a cue or a reason)
      return K.footer({ back: { action: 'back' }, status: st || { text: '', id: 'dd-why' }, hold: { label: s('act.save'), caption: s('pp.dead.hold'), action: 'hold-save', tone: 'primary', waiting: gray, describedby: gray ? 'dd-why' : '' } });
    }
    return K.footer({ back: { action: back || 'back' }, status: st, primary: { label: s('act.save'), action: 'save', waiting: gray } });
  }
  function head() {

    if (crate) S.unit = +(qs.get('unit') || store.derived.litters[crate].room || S.unit);
    if (spec.kept) { mem.d = { pig: spec.kept.pig || null, sow: spec.kept.sow || null }; }
    if (spec.pig) { S.pig = Object.assign(emptyPig(), spec.pig, { photos: shots(spec.pig.photos) }); if (spec.pig.k == null) S.pig.k = null; }
    if (spec.sow) S.sow = Object.assign(emptySow(), spec.sow);
    if (crate && !S.picking) {
      var k = spec.pig || spec.sow ? null : kept();
      if (k) restore(k);
      if (S.pig.route) S.presume = true;
      // the drawer opens in the mode holding the draft (piglets when both do)
      S.mode = spec.mode || (pigDirty() || !sowDirty() ? 'piglets' : 'sow');
      if (spec.pig && spec.pig.k != null) { S.pig.k = spec.pig.k; S.kTouched = true; } else settleK();
      if (spec.sub) S.sub = spec.sub;
    }
    if (spec.view) S.viewer = { key: 'pig', id: S.pig.photos[spec.view - 1].id };
    if (spec.deleteAt) { var it = S.pig.photos.splice(spec.deleteAt - 1, 1)[0]; S.deleted = { key: 'pig', item: it, at: spec.deleteAt - 1 }; }
    render();
    // the sow's Save is hold-to-commit (Button hold): the card owns the phases, caption and status line
    var holds = UI.holdBind(screen, { t: function (id) { return PP.t(id); },
      cues: { keep: 'pp.dead.hold.start', tap: 'pp.dead.hold.keep', released: 'pp.dead.hold.cancel', disarmed: 'pp.dead.hold.cancel', again: 'pp.dead.hold.armed', early: 'pp.dead.hold.armed' },
      onCommit: function (el) {
        // the hold completed: recheck what Save needs, then commit
        if (!saveSow()) { holds.settle(el, 'failed'); render(); return; }
        holds.settle(el, 'done'); leave('sow');
      } });
    UI.radioBind(screen, { onChange: function (field, value) {
      if (field === 'pick-cause') picks().forEach(function (r) { S.pig.picks[r] = value; });
      else if (field === 'sow-cause') S.sow.cause = value;
      else if (field === 'held') S.heldPick = value;
      else S.pig.miss[field] = value;
      keep(); render();
    } });
  });
})();
</script>
