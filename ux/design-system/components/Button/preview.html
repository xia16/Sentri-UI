<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button</title></head><body><main id="examples"></main><script>
(async()=>{
 if(!window.SentriUI){
  for(const href of ['../../tokens.css','../bundle.css']){const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.append(l);}
  await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='../bundle.js';s.onload=resolve;s.onerror=reject;document.head.append(s);});
 }
 const variants=["primary", "secondary", "text", "hold", "tool", "destructive"];
 for(const id of variants){
  const html=await fetch('variants/'+id+'.html').then(r=>r.text());
  const iframe=document.createElement('iframe');iframe.title='Button '+id;iframe.style.width='100%';iframe.style.border='0';
  const doc=new DOMParser().parseFromString(html,'text/html');
  const css=Array.from(document.querySelectorAll('link[rel="stylesheet"],style')).map(n=>n.tagName==='LINK'?'<link rel="stylesheet" href="'+n.href+'">':n.outerHTML).join('');
  doc.head.insertAdjacentHTML('beforeend',css+'<script src="'+new URL('../bundle.js',location.href).href+'"><'+'/script>');
  iframe.srcdoc=doc.documentElement.outerHTML;iframe.onload=()=>iframe.style.height=iframe.contentDocument.body.scrollHeight+'px';examples.append(iframe);
 }
})().catch(e=>{examples.textContent=e.message;console.error(e);});
</script></body></html>
