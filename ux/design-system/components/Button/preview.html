<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>html,body{margin:0;background:var(--app-background)}.pv{max-width:390px;padding:16px;display:flex;flex-direction:column;gap:12px;font-family:var(--font-sans);color:var(--ink)}.pv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="pv" data-st-context="page"><div id="p"></div><div class="pv-row" id="s"></div><div class="pv-row" id="t"></div><div id="h"></div></div>
<script>
const UI = window.SentriUI;
p.innerHTML = UI.button({ label: 'Record birth', register: 'primary' });
s.innerHTML = UI.button({ label: 'Show pigs', register: 'secondary' }) + UI.button({ label: 'Delete photo', register: 'danger' });
t.innerHTML = UI.button({ label: 'Clear', register: 'text' }) + UI.button({ label: 'Record death', register: 'tool' }) + UI.button({ label: 'Tag', register: 'tool' });
h.innerHTML = UI.holdButton({ label: 'Hold to end task', caption: 'Ends the task for every pen' });
UI.holdBind && UI.holdBind(document.body);
</script>
</body>
</html>
