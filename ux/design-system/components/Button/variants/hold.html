<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button · Hold</title><style>html,body{margin:0;color:var(--ink);font-family:var(--font-sans)}.example{}.example h2{font-size:var(--type-description-size);margin:0 0 var(--space-8)}.demo{display:flex;flex-direction:column;gap:var(--space-8);min-width:0}.demo>.button{width:100%}.demo>.st-button-reason{margin:0}</style></head><body>
<section class="example" data-state="Default"><h2>Default</h2><div class="demo"></div></section>
<section class="example" data-state="Pressed"><h2>Pressed</h2><div class="demo"></div></section>
<section class="example" data-state="Disabled"><h2>Disabled</h2><div class="demo"></div></section>
<section class="example" data-state="Long / Chinese"><h2>Long / Chinese</h2><div class="demo"></div></section>
<section class="example" data-state="Waiting"><h2>Waiting</h2><div class="demo"></div></section>
<section class="example" data-state="Loading"><h2>Loading</h2><div class="demo"></div></section>
<section class="example" data-state="Holding"><h2>Holding</h2><div class="demo"></div></section>
<section class="example" data-state="Armed"><h2>Armed</h2><div class="demo"></div></section>
<section class="example" data-state="Pending"><h2>Pending</h2><div class="demo"></div></section>
<section class="example" data-state="Done"><h2>Done</h2><div class="demo"></div></section>
<section class="example" data-state="Unknown"><h2>Unknown</h2><div class="demo"></div></section>
<section class="example" data-state="Failed"><h2>Failed</h2><div class="demo"></div></section>
<script>
(()=>{
const UI=window.SentriUI;
for(const el of document.querySelectorAll('[data-state]')){
 const state=el.dataset.state,id='reason-'+state.replace(/[^a-z]/gi,'');
 const label=state==='Long / Chinese'?'结束本批次所有栏位的仔猪处理任务并保留已有记录':"End task";
 let control;
 const phase=({Holding:'holding',Armed:'armed',Pending:'pending',Done:'done',Unknown:'unknown',Loading:'pending'})[state]||'idle';
 const caption=({Armed:'PRESS AGAIN TO END',Pending:'RECORDING',Done:'TASK ENDED',Unknown:'CHECK THE RECORD',Loading:'RECORDING'})[state]||'HOLD TO END';
 control=UI.holdButton({label,caption:state==='Long / Chinese'?'按住结束':caption,phase,tone:'danger',waiting:state==='Waiting'||state==='Disabled',id:'hold-'+id});
 if(state==='Holding')control=control.replace('data-phase="holding"','data-phase="holding" data-preview="still"');
 if(state==='Pressed')control=control.replace('<button','<button data-preview="'+state.toLowerCase()+'"');
 el.querySelector('.demo').innerHTML=control+(state==='Default'?UI.holdButton({label:'Finish farrowing',caption:'HOLD TO FINISH',tone:'primary'}):'');
}
UI.holdBind(document.body);
})();
</script>
</body></html>
