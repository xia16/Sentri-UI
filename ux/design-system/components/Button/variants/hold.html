<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button · Hold</title></head><body>
<section data-state="Default" data-bleed><h2>Default</h2><div class="demo"></div></section>
<section data-state="Pressed" data-bleed><h2>Pressed</h2><div class="demo"></div></section>
<section data-state="Disabled" data-bleed><h2>Disabled</h2><div class="demo"></div></section>
<section data-state="Waiting" data-bleed><h2>Waiting</h2><div class="demo"></div></section>
<section data-state="Longest label" data-bleed><h2>Longest label</h2><div class="demo"></div></section>
<section data-state="Longest label · 中文" data-bleed><h2>Longest label · 中文</h2><div class="demo"></div></section>
<section data-state="Holding" data-bleed><h2>Holding</h2><div class="demo"></div></section>
<section data-state="Armed" data-bleed><h2>Armed</h2><div class="demo"></div></section>
<section data-state="Pending" data-bleed><h2>Pending</h2><div class="demo"></div></section>
<section data-state="Done" data-bleed><h2>Done</h2><div class="demo"></div></section>
<section data-state="Unknown" data-bleed><h2>Unknown</h2><div class="demo"></div></section>
<section data-state="Failed" data-bleed><h2>Failed</h2><div class="demo"></div></section>
<script>
(()=>{
const UI=window.SentriUI;
const REASON={Disabled:'Choose the piglets first.',Waiting:'Choose the piglets first.',Pending:'Recording; wait for the result.',Failed:'Nothing was recorded. Check the connection, then try again.',Unknown:'Result unknown. Check the record before continuing.'};
const PH={Holding:'holding',Armed:'armed',Pending:'pending',Done:'done',Unknown:'unknown'};
const CAP={Armed:'PRESS AGAIN TO END',Pending:'RECORDING',Done:'TASK ENDED',Unknown:'CHECK THE RECORD','Longest label':'KEEP HOLDING TO LOCK','Longest label · 中文':'继续按住以结束任务'};
const LAB={'Longest label':'End processing in pen B4','Longest label · 中文':'结束B4栏的仔猪处理任务'};
for(const el of document.querySelectorAll('[data-state]')){
 const state=el.dataset.state,reason=REASON[state]||'';
 const hold={label:LAB[state]||'End task',caption:CAP[state]||'HOLD TO END',tone:'danger',phase:PH[state]||'idle',waiting:state==='Waiting'||state==='Disabled'};
 let html=UI.sheetFooter({back:{action:'back'},hold,status:reason?{text:reason,visible:true}:undefined});
 if(state==='Holding')html=html.replace('data-phase="holding"','data-phase="holding" data-preview="still"');
 if(state==='Pressed')html=html.replace(/<button(?![^]*<button)/,'<button data-preview="pressed"');
 el.querySelector('.demo').innerHTML=html;
}
UI.holdBind(document.body);
})();
</script>
</body></html>
