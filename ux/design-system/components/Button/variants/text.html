<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button · Text action</title></head><body>
<section data-state="Default" data-bleed><h2>Default</h2><div class="demo"></div></section>
<section data-state="Pressed" data-bleed><h2>Pressed</h2><div class="demo"></div></section>
<section data-state="Disabled" data-bleed><h2>Disabled</h2><div class="demo"></div></section>
<section data-state="Waiting" data-bleed><h2>Waiting</h2><div class="demo"></div></section>
<section data-state="Loading" data-bleed><h2>Loading</h2><div class="demo"></div></section>
<section data-state="Longest label" data-bleed><h2>Longest label</h2><div class="demo"></div></section>
<section data-state="Longest label · 中文" data-bleed><h2>Longest label · 中文</h2><div class="demo"></div></section>
<script>
(()=>{
const UI=window.SentriUI;
const REASON={Disabled:'Choose the piglets first.',Waiting:'Choose the piglets first.',Loading:'Recording; wait for the result.'};
const pressed=h=>h.replace(/<button(?![^]*<button)/,'<button data-preview="pressed"');
const LONG={'Longest label':'Clear all piglets','Longest label · 中文':'清除全部'};
for(const el of document.querySelectorAll('[data-state]')){
 const state=el.dataset.state,label=LONG[state]||'Clear',reason=REASON[state]||'';
 const spec={label,register:'text',action:'clear',waiting:state==='Waiting',disabled:state==='Disabled',busy:state==='Loading',describedby:reason?'why':''};
 let ctl=UI.button(spec);if(state==='Pressed')ctl=ctl.replace('<button','<button data-preview="pressed"');
 el.querySelector('.demo').innerHTML='<div class="screen">'+UI.sheet({variant:'page',title:'Give IDs',subtitle:'B4 · 4 without ID',aside:ctl,body:UI.panel(UI.row({title:'Piglet 1',description:'Day 2 · B4'}),{className:'st-row-group'})+(reason?UI.buttonReason({id:'why',text:reason}):''),footer:false})+'</div>';
}
UI.holdBind(document.body);
})();
</script>
</body></html>
