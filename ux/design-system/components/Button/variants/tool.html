<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button · Tool</title><style>.toolrow{display:flex;gap:var(--space-key-gap)}.toolrow>.button.tool{flex:1 1 0;min-width:var(--tap-min);padding:var(--space-8) var(--space-6)}</style></head><body>
<section data-state="Default"><h2>Default</h2><div class="demo"></div></section>
<section data-state="Pressed"><h2>Pressed</h2><div class="demo"></div></section>
<section data-state="Disabled"><h2>Disabled</h2><div class="demo"></div></section>
<section data-state="Waiting"><h2>Waiting</h2><div class="demo"></div></section>
<section data-state="Loading"><h2>Loading</h2><div class="demo"></div></section>
<section data-state="Longest label"><h2>Longest label</h2><div class="demo"></div></section>
<section data-state="Longest label · 中文"><h2>Longest label · 中文</h2><div class="demo"></div></section>
<script>
(()=>{
const UI=window.SentriUI;
const REASON={Disabled:'Choose the piglets first.',Waiting:'Choose the piglets first.',Loading:'Recording; wait for the result.'};
const pressed=h=>h.replace(/<button(?![^]*<button)/,'<button data-preview="pressed"');
const LONG={'Longest label':['Notch piglets','Record death','Tag breeders'],'Longest label · 中文':['打耳标','记录死亡','选种猪']};
for(const el of document.querySelectorAll('[data-state]')){
 const state=el.dataset.state,labels=LONG[state]||['Tag piglets','Record death','More actions'],reason=REASON[state]||'';
 const row=labels.map((l,i)=>UI.button({label:l,register:'tool',action:'tool-'+i,waiting:i===0&&state==='Waiting',disabled:i===0&&state==='Disabled',busy:i===0&&state==='Loading',describedby:i===0&&reason?'why':''})).join('');
 let html='<div class="toolrow">'+row+'</div>'+(reason?UI.buttonReason({id:'why',text:reason}):'');
 if(state==='Pressed')html=html.replace('<button','<button data-preview="pressed"');
 el.querySelector('.demo').innerHTML=html;
}
UI.holdBind(document.body);
})();
</script>
</body></html>
