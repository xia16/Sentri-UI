<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button · Tool</title><style>html,body{margin:0;background:var(--app-background);color:var(--ink);font-family:var(--font-sans)}.example{padding:var(--space-16);border-bottom:var(--border-width) solid var(--line)}.example h2{font-size:var(--type-description-size);margin:0 0 var(--space-8)}.demo{display:flex;flex-direction:column;gap:var(--space-8);min-width:0}.demo>.button{width:100%}.demo>.st-button-reason{margin:0}</style></head><body>
<section class="example" data-state="Default"><h2>Default</h2><div class="demo"></div></section>
<section class="example" data-state="Pressed"><h2>Pressed</h2><div class="demo"></div></section>
<section class="example" data-state="Disabled"><h2>Disabled</h2><div class="demo"></div></section>
<section class="example" data-state="Long / Chinese"><h2>Long / Chinese</h2><div class="demo"></div></section>
<section class="example" data-state="Waiting"><h2>Waiting</h2><div class="demo"></div></section>
<section class="example" data-state="Loading"><h2>Loading</h2><div class="demo"></div></section>
<script>
(()=>{
const UI=window.SentriUI;
for(const el of document.querySelectorAll('[data-state]')){
 const state=el.dataset.state,id='reason-'+state.replace(/[^a-z]/gi,'');
 const label=state==='Long / Chinese'?'记录这一栏今天已完成处理的十二头仔猪并保留记录':"Record death";
 const reason=state==='Loading'?'Recording; wait for the result.':state==='Failed'?'Nothing was recorded. Check the connection, then try again.':state==='Unknown'?'Result unknown. Check the record before continuing.':state==='Done'?'Task ended.':state==='Waiting'||state==='Disabled'?'Choose the piglets first.':'';
 let control;
 control=UI.button({label,register:'tool',waiting:state==='Waiting',disabled:state==='Disabled',busy:state==='Loading',reason});
 if(state==='Pressed')control=control.replace('<button','<button data-preview="'+state.toLowerCase()+'"');
 el.querySelector('.demo').innerHTML=control;
}
UI.holdBind(document.body);
})();
</script>
</body></html>
