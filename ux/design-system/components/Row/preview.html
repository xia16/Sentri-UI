<!-- @dsCard group="Lists" height=1100 -->
<div id="row-preview"></div>
<script>
(async()=>{const root=document.getElementById('row-preview');for(const id of ['navigation','animal','selectable','door-act','scope','summary-count','record']){const html=await fetch('variants/'+id+'.html').then(r=>r.text());const section=document.createElement('section');section.innerHTML=html;root.append(section);for(const old of section.querySelectorAll('script')){const script=document.createElement('script');script.textContent=old.textContent;old.replaceWith(script);}}})();
</script>
