<div data-state="Default" data-bleed id="door-act-state-0"></div>
<div data-state="Pressed" data-bleed id="door-act-state-1"></div>
<div data-state="Longest label · 中文" data-bleed id="door-act-state-3"></div>
<div data-state="Loading" data-bleed id="door-act-state-4"></div>
<div data-state="Error" data-bleed id="door-act-state-5"></div>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "door-act-state-0": () => SentriUI.rowAction({"title": "Iron and tail", "description": "12 owed", "action": "open", "value": "A02", "wrap": true, "attrs": {}, "act": {"label": "Record 12", "action": "record", "value": "A02", "busy": false}}),
  "door-act-state-1": () => SentriUI.rowAction({"title": "Iron and tail", "description": "12 owed", "action": "open", "value": "A02", "wrap": true, "attrs": {"data-preview": "pressed"}, "act": {"label": "Record 12", "action": "record", "value": "A02", "busy": false}}),
  "door-act-state-3": () => SentriUI.rowAction({"title": "核对今天待处理的母猪和仔猪记录", "description": "09:41 · 张伟 · 共3头待处理", "action": "open", "value": "A02", "wrap": true, "attrs": {}, "act": {"label": "记录12头", "action": "record", "value": "A02", "busy": false}}),
  "door-act-state-4": () => SentriUI.rowAction({"title": "Iron and tail", "description": "12 owed", "action": "open", "value": "A02", "wrap": true, "attrs": {}, "act": {"label": "Recording 12", "action": "record", "value": "A02", "busy": true}}),
  "door-act-state-5": () => SentriUI.rowAction({"title": "Iron and tail", "description": "Could not save. Retry recording.", "action": "open", "value": "A02", "wrap": true, "attrs": {}, "act": {"label": "Retry", "action": "record", "value": "A02", "busy": false}})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
