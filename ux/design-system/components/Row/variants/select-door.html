<div data-state="Default" id="sd-state-0"></div>
<div data-state="Pressed (door)" id="sd-state-1"></div>
<div data-state="Selected" id="sd-state-2"></div>
<div data-state="Selected + Pressed" id="sd-state-3"></div>
<div data-state="State on the right" id="sd-state-6"></div>
<div data-state="Group · pigs without ear tags" id="sd-state-7"></div>
<div data-state="No door" id="sd-state-5"></div>
<div data-state="Chinese" id="sd-state-4"></div>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present, each in its card (rowGroup), as the screens do.
// Calls copied from the live screens: Inspection's walk (tags, the group without ear tags), Farrowing's scan list (state).
var UI = window.SentriUI;
var TAGS = {"kind": "tags", "tags": [{"name": "Lame", "level": "watch"}, {"name": "Arthritis", "level": "ongoing"}]};
function pig(p) { return SentriUI.rowSelectDoor(Object.assign({"code": "000306", "description": "Gestation · 42d", "contextWidth": "112px", "right": TAGS, "action": "", "value": "000306", "openAction": "pig", "openValue": "000306", "inputAttrs": {"aria-label": "Select pig 000306"}}, p)); }
var RENDER = {
  "sd-state-0": () => pig({}),
  "sd-state-1": () => pig({"attrs": {"data-preview": "pressed"}}),
  "sd-state-2": () => pig({"checked": true}),
  "sd-state-3": () => pig({"checked": true, "attrs": {"data-preview": "pressed"}}),
  "sd-state-6": () => SentriUI.rowSelectDoor({"code": "000431", "description": "Parity 6", "right": {"kind": "state", "figure": "3 days", "word": "Overdue", "level": "act"}, "action": "room-scan-pick", "value": "000431", "openAction": "open", "openValue": "000431", "inputAttrs": {"aria-label": "Select 000431"}}),
  "sd-state-7": () => SentriUI.rowSelectDoor({"code": "14 pigs", "lead": "tag-off", "contextWidth": "112px", "right": {"kind": "tags", "tags": [{"name": "Cough", "level": "watch"}]}, "action": "", "value": "notags-C1", "openAction": "notags-count-open", "openValue": "C1", "label": "14 pigs without ear tags, pen C1", "inputAttrs": {"aria-label": "Select the pigs without ear tags in pen C1"}, "count": {"value": "14", "idle": true}}),
  "sd-state-5": () => SentriUI.rowSelect({"title": "Pen C1", "description": "3 pigs need a look", "value": "C1", "wrap": true, "checked": true}),
  "sd-state-4": () => pig({"description": "妊娠 · 42天", "right": {"kind": "tags", "tags": [{"name": "发烧", "level": "act"}, {"name": "跛行", "level": "watch"}]}})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = SentriUI.rowGroup(RENDER[t.id]());
});
UI.rowFitTags(document);
</script>
