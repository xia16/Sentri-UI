<div data-state="Default" data-bleed id="sd-state-0"></div>
<div data-state="Pressed (door)" data-bleed id="sd-state-1"></div>
<div data-state="Selected" data-bleed id="sd-state-2"></div>
<div data-state="Selected + Pressed" data-bleed id="sd-state-3"></div>
<div data-state="No door" data-bleed id="sd-state-5"></div>
<div data-state="Longest label · 中文" data-bleed id="sd-state-4"></div>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "sd-state-0": () => SentriUI.rowSelectDoor({"title": "000418", "description": "Sow · parity 3 · Pen A02", "value": "000418", "openAction": "pig", "openValue": "000418", "mono": true, "wrap": true}),
  "sd-state-1": () => SentriUI.rowSelectDoor({"title": "000418", "description": "Sow · parity 3 · Pen A02", "value": "000418", "openAction": "pig", "openValue": "000418", "mono": true, "wrap": true, "attrs": {"data-preview": "pressed"}}),
  "sd-state-2": () => SentriUI.rowSelectDoor({"title": "000418", "description": "Sow · parity 3 · Pen A02", "value": "000418", "openAction": "pig", "openValue": "000418", "mono": true, "wrap": true, "checked": true}),
  "sd-state-3": () => SentriUI.rowSelectDoor({"title": "000418", "description": "Sow · parity 3 · Pen A02", "value": "000418", "openAction": "pig", "openValue": "000418", "mono": true, "wrap": true, "checked": true, "attrs": {"data-preview": "pressed"}}),
  "sd-state-5": () => SentriUI.rowSelect({"title": "Pen C1", "description": "3 displayed pigs", "value": "C1", "wrap": true, "checked": true}),
  "sd-state-4": () => SentriUI.rowSelectDoor({"title": "核对今天待处理的母猪和仔猪记录", "description": "母猪 · 第3胎 · B4栏", "value": "000418", "openAction": "pig", "openValue": "000418", "mono": true, "wrap": true})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
