<div data-state="Default" id="tick-state-0"></div>
<div data-state="Ticked" id="tick-state-1"></div>
<div data-state="Ticked + count act" id="tick-state-4"></div>
<div data-state="Pressed" id="tick-state-2"></div>
<div data-state="Long label / Chinese" id="tick-state-3"></div>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "tick-state-0": () => SentriUI.row({"title": "Dock tail", "description": "Due today · 12 piglets", "action": "item", "trail": "none", "value": "tail", "wrap": true, "mark": "due", "attrs": {"aria-pressed": "false"}}),
  "tick-state-1": () => SentriUI.row({"title": "Dock tail", "description": "Due today · 12 piglets", "action": "item", "trail": "none", "value": "tail", "wrap": true, "mark": "ticked", "attrs": {"aria-pressed": "true", "data-ticked": ""}}),
  "tick-state-4": () => SentriUI.rowAction({"title": "Dock tail", "description": "Due today · 12 piglets", "action": "item", "value": "tail", "wrap": true, "mark": "ticked", "attrs": {"aria-pressed": "true", "data-ticked": ""}, "act": {"label": "2 piglets", "action": "count", "value": "tail", "busy": false}}),
  "tick-state-2": () => SentriUI.row({"title": "Dock tail", "description": "Due today · 12 piglets", "action": "item", "trail": "none", "value": "tail", "wrap": true, "mark": "due", "attrs": {"aria-pressed": "false", "data-preview": "pressed"}}),
  "tick-state-3": () => SentriUI.row({"title": "给仔猪断尾并记录处理结果", "description": "今天到期 · 12 头仔猪 · 长文字完整换行", "action": "item", "trail": "none", "value": "tail", "wrap": true, "mark": "due", "attrs": {"aria-pressed": "false"}})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
