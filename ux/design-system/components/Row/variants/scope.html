<div data-state="Default" data-bleed id="scope-state-0"></div>
<div data-state="Pressed" data-bleed id="scope-state-1"></div>
<div data-state="Longest label · 中文" data-bleed id="scope-state-3"></div>
<div data-state="Current" data-bleed id="scope-state-4"></div>
<div data-state="Disabled" data-bleed id="scope-state-5"></div>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "scope-state-0": () => SentriUI.row({"title": "Unit 6", "description": "8 pigs · 4 pens", "action": "open", "value": "A02", "variant": "scope", "wrap": true, "attrs": {}, "trailing": {"text": "2 tasks"}}),
  "scope-state-1": () => SentriUI.row({"title": "Unit 6", "description": "8 pigs · 4 pens", "action": "open", "value": "A02", "variant": "scope", "wrap": true, "attrs": {"data-preview": "pressed"}, "trailing": {"text": "2 tasks"}}),
  "scope-state-3": () => SentriUI.row({"title": "核对今天待处理的母猪和仔猪记录", "description": "09:41 · 张伟 · 共3头待处理", "action": "open", "value": "A02", "variant": "scope", "wrap": true, "attrs": {}, "trailing": {"text": "2项任务"}}),
  "scope-state-4": () => SentriUI.row({"title": "Unit 6", "description": "Current unit · 8 pigs · 4 pens", "action": "open", "value": "A02", "variant": "scope", "wrap": true, "attrs": {"aria-current": "location"}, "trailing": {"text": "2 tasks"}}),
  "scope-state-5": () => SentriUI.row({"title": "Unit 6", "description": "8 pigs · 4 pens", "action": "open", "value": "A02", "variant": "scope", "wrap": true, "attrs": {}, "trailing": {"text": "2 tasks"}, "disabled": true, "reason": "Unavailable — unit is closed"})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
