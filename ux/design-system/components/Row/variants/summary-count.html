<div data-state="Default" id="summary-count-state-0"></div>
<div data-state="Pressed" id="summary-count-state-1"></div>
<div data-state="Focus" id="summary-count-state-2"></div>
<div data-state="Long label / Chinese" id="summary-count-state-3"></div>
<div data-state="Empty" id="summary-count-state-4"></div>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "summary-count-state-0": () => SentriUI.row({"title": "Awaiting", "description": "Sows due today", "action": "open", "value": "A02", "variant": "summary-count", "wrap": true, "attrs": {}, "trailing": {"text": "3"}}),
  "summary-count-state-1": () => SentriUI.row({"title": "Awaiting", "description": "Sows due today", "action": "open", "value": "A02", "variant": "summary-count", "wrap": true, "attrs": {"data-preview": "pressed"}, "trailing": {"text": "3"}}),
  "summary-count-state-2": () => SentriUI.row({"title": "Awaiting", "description": "Sows due today", "action": "open", "value": "A02", "variant": "summary-count", "wrap": true, "attrs": {"data-preview": "focus"}, "trailing": {"text": "3"}}),
  "summary-count-state-3": () => SentriUI.row({"title": "检查待处理的母猪与仔猪记录", "description": "Sows due today", "action": "open", "value": "A02", "variant": "summary-count", "wrap": true, "attrs": {}, "trailing": {"text": "3"}}),
  "summary-count-state-4": () => SentriUI.row({"title": "Awaiting", "description": "No sows due today", "action": "", "value": "A02", "variant": "summary-count", "wrap": true, "attrs": {}, "trailing": {"text": "0"}})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
