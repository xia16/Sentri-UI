<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IconButton · bordered</title></head><body>
<section data-state="Default" data-bleed><h2>Default</h2><div class="demo"></div></section>
<section data-state="Pressed" data-bleed><h2>Pressed</h2><div class="demo"></div></section>
<section data-state="Disabled" data-bleed><h2>Disabled</h2><div class="demo"></div></section>
<section data-state="Longest label · 中文" data-bleed><h2>Longest label · 中文</h2><div class="demo"></div></section>
<section data-state="Selected" data-bleed><h2>Selected</h2><div class="demo"></div></section>
<section data-state="Badge" data-bleed><h2>Badge</h2><div class="demo"></div></section>
<script>
(()=>{
const UI=window.SentriUI;
for(const el of document.querySelectorAll('[data-state]')){
 const state=el.dataset.state;
 const label=state==='Longest label · 中文'?'关闭当前仔猪处理记录窗口':"Filter pigs";
 const ctl=UI.iconButton({variant:'bordered',icon:window.SentriIcons.icon('filter'),label:state==='Badge'?'Filter pigs, 2 applied':label,pressed:state==='Pressed',disabled:state==='Disabled',describedby:state==='Disabled'?'why':'',selected:state==='Selected'?true:null,badge:state==='Badge'?2:''});
 el.querySelector('.demo').innerHTML='<div class="screen">'+UI.sheet({variant:'page',title:'Pen B4',subtitle:'Sow 000254 · 11 piglets',aside:ctl,body:UI.panel(UI.row({title:'Litter',description:'11 alive · day 2'}),{className:'st-row-group'})+(state==='Disabled'?UI.buttonReason({id:'why',text:'This sheet is recording. Wait for the result.'}):''),footer:false})+'</div>';
}
})();
</script>
</body></html>
