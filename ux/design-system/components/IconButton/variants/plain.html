<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IconButton · Plain</title><style>html,body{margin:0;color:var(--ink);font-family:var(--font-sans)}.example{}.example h2{font-size:var(--type-description-size);margin:0 0 var(--space-8)}.demo{display:flex;flex-direction:column;gap:var(--space-8);min-width:0}.demo>.button{width:100%}.demo>.st-button-reason{margin:0}</style></head><body>
<section class="example" data-state="Default"><h2>Default</h2><div class="demo"></div></section>
<section class="example" data-state="Pressed"><h2>Pressed</h2><div class="demo"></div></section>
<section class="example" data-state="Disabled"><h2>Disabled</h2><div class="demo"></div></section>
<section class="example" data-state="Long / Chinese"><h2>Long / Chinese</h2><div class="demo"></div></section>
<section class="example" data-state="Selected"><h2>Selected</h2><div class="demo"></div></section>
<section class="example" data-state="Badge"><h2>Badge</h2><div class="demo"></div></section>
<script>
(()=>{
const UI=window.SentriUI;
for(const el of document.querySelectorAll('[data-state]')){
 const state=el.dataset.state;
 const label=state==='Long / Chinese'?'关闭当前仔猪处理记录窗口':state==='Selected'?'Remove breeder mark':state==='Badge'?'More actions, 2 available':'Close sheet';
 el.querySelector('.demo').innerHTML=UI.iconButton({variant:'plain',icon:window.SentriIcons.icon(state==='Selected'?'bookmark':state==='Badge'?'more':'close'),label,pressed:state==='Pressed',disabled:state==='Disabled',selected:state==='Selected'?true:null,badge:state==='Badge'?2:''});
}
})();
</script>
</body></html>
