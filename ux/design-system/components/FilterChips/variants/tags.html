<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "state-Default": () => SentriUI.filterChips({"items": [{"value": "0", "label": "All", "checked": true, "disabled": false}, {"value": "1", "label": "Iron", "count": 3, "checked": false, "disabled": false}, {"value": "2", "label": "Dock tail", "count": 4, "checked": false, "disabled": false}, {"value": "3", "label": "Castrate", "count": 5, "checked": false, "disabled": false}, {"value": "4", "label": "Coccidiosis", "count": 6, "checked": false, "disabled": false}, {"value": "5", "label": "Tag", "count": 7, "checked": false, "disabled": false}, {"value": "6", "label": "Weight", "count": 8, "checked": false, "disabled": false}], "label": "Jobs", "state": "Default", "reason": ""}),
  "state-Pressed": () => SentriUI.filterChips({"items": [{"value": "0", "label": "All", "checked": true, "disabled": false}, {"value": "1", "label": "Iron", "count": 3, "checked": false, "disabled": false}, {"value": "2", "label": "Dock tail", "count": 4, "checked": false, "disabled": false}, {"value": "3", "label": "Castrate", "count": 5, "checked": false, "disabled": false}, {"value": "4", "label": "Coccidiosis", "count": 6, "checked": false, "disabled": false}, {"value": "5", "label": "Tag", "count": 7, "checked": false, "disabled": false}, {"value": "6", "label": "Weight", "count": 8, "checked": false, "disabled": false}], "label": "Jobs", "state": "Pressed", "reason": ""}),

  "state-Disabled": () => SentriUI.filterChips({"items": [{"value": "0", "label": "All", "checked": true, "disabled": true}, {"value": "1", "label": "Iron", "count": 3, "checked": false, "disabled": true}, {"value": "2", "label": "Dock tail", "count": 4, "checked": false, "disabled": true}, {"value": "3", "label": "Castrate", "count": 5, "checked": false, "disabled": true}, {"value": "4", "label": "Coccidiosis", "count": 6, "checked": false, "disabled": true}, {"value": "5", "label": "Tag", "count": 7, "checked": false, "disabled": true}, {"value": "6", "label": "Weight", "count": 8, "checked": false, "disabled": true}], "label": "Jobs", "state": "Disabled", "reason": "Records are unavailable offline."}),
  "state-Focus": () => SentriUI.filterChips({"items": [{"value": "0", "label": "All", "checked": true, "disabled": false}, {"value": "1", "label": "Iron", "count": 3, "checked": false, "disabled": false}, {"value": "2", "label": "Dock tail", "count": 4, "checked": false, "disabled": false}, {"value": "3", "label": "Castrate", "count": 5, "checked": false, "disabled": false}, {"value": "4", "label": "Coccidiosis", "count": 6, "checked": false, "disabled": false}, {"value": "5", "label": "Tag", "count": 7, "checked": false, "disabled": false}, {"value": "6", "label": "Weight", "count": 8, "checked": false, "disabled": false}], "label": "Jobs", "state": "Focus", "reason": ""}),

};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
</body></html>
