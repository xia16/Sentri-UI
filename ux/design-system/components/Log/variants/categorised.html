<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log: categorised</title>
</head>
<body>
<!-- The day log with a kind word above each title; the kind filter sits above the panel. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Default" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Today', entries: [{ category: 'Health', title: 'Lameness noted', detail: 'Left hind · mild', at: '09:41', by: 'G.H' }, { category: 'Feed', title: 'Feed plan changed', at: '07:05', by: 'G.H' }] }, { label: 'Sep 10', entries: [{ category: 'Movement', title: 'Transferred in', detail: 'Unit 6 · B2 → Unit 7 · C1', at: '14:20', by: 'M.L' }] }], { kind: 'categorised' }));</script></div>
<div data-state="Corrected entry" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Today', entries: [{ category: 'Health', title: 'Care level: Treat', corrected: true, was: 'Was Monitor', at: '09:41', by: 'G.H' }] }], { kind: 'categorised' }));</script></div>
<div data-state="Filter matches nothing" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([], { kind: 'categorised', empty: 'No matching entries' }));</script></div>
<div data-state="Empty" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([], { kind: 'categorised', empty: 'No activity recorded yet' }));</script></div>
<div data-state="Chinese" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: '今天', entries: [{ category: '健康', title: '发现跛行', detail: '左后肢 · 轻度', at: '09:41', by: 'G.H' }] }], { kind: 'categorised' }));</script></div>
</body>
</html>
