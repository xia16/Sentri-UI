<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log: day</title>
</head>
<body>
<!-- History grouped by day, newest first: one entry per recorded act. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Default" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Today', entries: [{ title: 'Fostered 3 piglets', detail: 'B4 → B6', at: '06:40', by: 'G. Hansen' }, { title: 'Counts saved', at: '06:12', by: 'G.H' }] }, { label: 'Mon', entries: [{ title: 'Farrowing finished · born 14', at: '07:14', by: 'L.M' }] }, { label: 'Jul 8', entries: [{ title: 'Born 13', detail: '1 dead at birth' }] }]));</script></div>
<div data-state="One entry for a run of acts" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Thu', entries: [{ title: 'IDs given · 12', detail: '001201–001212', at: '10:11', by: 'G.H' }] }]));</script></div>
<div data-state="Corrected entry" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Today', entries: [{ title: 'Alive 9 → 8', corrected: true, was: 'Was 9 alive', at: '09:41', by: 'G.H' }, { title: 'Alive 9', at: '07:20', by: 'G.H' }] }]));</script></div>
<div data-state="With a photo" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Today', entries: [{ title: 'Piglet death recorded', detail: 'Crushed by sow · 1 piglet', at: '06:52', by: 'G.H', extraHtml: '<div class="photos"><span style="display:inline-block;width:var(--tap-min);height:var(--tap-min);border-radius:var(--radius-10);background:var(--well)"></span></div>' }] }]));</script></div>
<div data-state="Missing author is left out" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Earlier', entries: [{ title: 'Individual adjustment active', detail: 'Thin · mild · +10% · until resolved' }] }]));</script></div>
<div data-state="Empty" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([], { empty: 'No activity recorded yet' }));</script></div>
<div data-state="Long entry wraps" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: 'Today', entries: [{ title: 'Piglet count corrected · 11 → 9 · two found crushed under the sow in the night', detail: 'Reason entered by the worker on the walk', at: '06:40', by: 'G.H' }] }]));</script></div>
<div data-state="Chinese" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.log([{ label: '今天', entries: [{ title: '寄养 3 头仔猪', detail: 'B4 → B6', at: '06:40', by: 'G.H' }] }, { label: '周一', entries: [{ title: '分娩结束 · 出生 14 头', at: '07:14', by: 'L.M' }] }], { empty: '还没有记录' }));</script></div>
</body>
</html>
