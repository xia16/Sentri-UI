<!-- @dsCard group="Foundations" height=560 subtitle="All 52 glyphs from SentriIcons" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>html,body{margin:0;background:var(--app-background)}</style></head>
<body>
<div id="a" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px;padding:16px;background:var(--paper);font-family:var(--sans)"></div>
<script>
const UI = window.SentriUI, I = window.SentriIcons.icon;
a.innerHTML = Object.keys(window.SentriIcons.paths).map(n => '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;color:var(--ink)"><span style="display:block;width:22px;height:22px">' + I(n).replace('<svg', '<svg style="width:22px;height:22px;stroke-width:1.6"') + '</span><span style="font:400 10px/1.3 var(--mono);color:var(--muted)">' + n + '</span></div>').join('');
</script>
</body>
</html>
