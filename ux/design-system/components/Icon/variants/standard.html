<!doctype html><html lang="en"><meta charset="utf-8"><style>body{margin:0;font-family:var(--font-sans);color:var(--ink)}[data-state]{box-sizing:border-box;max-width:100%}.glyphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--back-width) + var(--space-24)),1fr));gap:var(--space-8)}.glyphs span{white-space:nowrap;display:flex;align-items:center;gap:var(--space-4);font-size:var(--font-size-12)}[data-st-context="drawer"]{background:var(--paper)}</style><body>
<div data-state="Default"></div>
<div data-state="Unknown"></div>
<script>document.querySelectorAll('[data-state]').forEach(el=>{const names=el.dataset.state==='Unknown'?['unknown-demo']:Object.keys(SentriIcons.paths);
el.innerHTML=(el.dataset.state==='Default'?'<p>'+Object.keys(SentriIcons.paths).length+' glyphs</p>':'')+'<div class="glyphs">'+names.map(name=>'<span>'+SentriIcons.icon(name)+'<span>'+name+'</span></span>').join('')+'</div>';});</script></body></html>
