<!-- @dsCard group="Structure" height=420 subtitle="page header · sheet header" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<style>
html,body{margin:0;background:var(--app-background)}
body{display:flex;flex-wrap:wrap;gap:var(--space-12);padding:var(--space-12);font-family:var(--font-sans);color:var(--ink)}
.ph{position:relative;flex:none;width:390px;height:190px;overflow:hidden;background:var(--app-background);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .bar{display:flex;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
</style></head>
<body>
<div class="ph" id="page"></div>
<div class="ph" id="sheet"></div>
<script>
/* The previews expect a host that preloads tokens.css, bundle.css and bundle.js (the atlas does). */
(function () {
  var UI = window.SentriUI;
  if (!UI) { document.body.textContent = 'Load tokens.css, bundle.css and bundle.js before this preview.'; return; }
  var row = UI.panel(UI.row({ title: 'Piglet 1', description: 'Day 2 · B4' }), { className: 'st-row-group' });
  document.getElementById('page').innerHTML = UI.sheet({ variant: 'page', bar: '<div class="bar" aria-hidden="true"><span>9:41</span></div>', title: 'Farrowing', back: { action: 'today', label: 'Back to Today' }, line: { text: [{ text: 'Last record ' }, { text: '08:41', strong: true }, { text: ' · G.H' }] }, body: row, footer: false });
  document.getElementById('sheet').innerHTML = UI.sheet({ title: 'Record dead', corner: { label: { text: 'Clear', str: 'act.clear' }, action: 'clear' }, size: 'short', body: row, footer: false });
})();
</script>
</body>
</html>
