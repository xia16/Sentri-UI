<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facts: two column</title>
</head>
<body>
<!-- Read-only label and value pairs in a panel, two to a row. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Default" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Boars · gilts', value: '6 · 6' }, { label: 'Litter weight', value: '24.6 kg' }, { label: 'Tagged', value: '0 of 12' }, { label: 'Breeders kept', value: '0' }]));</script></div>
<div data-state="With a trail" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Farrowed', value: '2 days ago', meta: 'Jul 8 · 07:14 · G.H' }, { label: 'Born alive', value: '11' }]));</script></div>
<div data-state="ID in mono" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Ear tag', value: '000254', mono: true }, { label: 'Pen', value: 'B4', mono: true }, { label: 'Parity', value: 4 }, { label: 'Semen batch', value: 'JY001', mono: true }]));</script></div>
<div data-state="Missing value" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Litter weight', value: null }, { label: 'Boars · gilts', value: null }, { label: 'Tagged', value: '0 of 12' }, { label: 'Breeders kept', value: '0' }]));</script></div>
<div data-state="Long value wraps" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Formula', value: 'Gestation 1 · restricted · two feeds a day' }, { label: 'Method', value: 'Station-fed' }]));</script></div>
<div data-state="Chinese" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: '公猪 · 母猪', value: '6 · 6' }, { label: '整窝体重', value: '24.6 公斤' }, { label: '已打耳标', value: '0/12' }, { label: '留种', value: '0' }]));</script></div>
</body>
</html>
