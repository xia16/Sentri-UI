<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facts: figures</title>
</head>
<body>
<!-- The two or three figures a sheet is about to commit, or a summary of counts: label over a large figure. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Default" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Born', value: 14 }, { label: 'Alive', value: 9 }, { label: 'Dead', value: 5 }], { variant: 'figures' }));</script></div>
<div data-state="Long label / long value" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Born alive', value: 12.4 }, { label: 'Not yet tagged', value: 128 }, { label: 'Weaned', value: '1,204' }], { variant: 'figures' }));</script></div>
<div data-state="Two figures" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Litters', value: 4 }, { label: 'Piglets', value: 46 }], { variant: 'figures' }));</script></div>
<div data-state="Three figures" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Born', value: 14 }, { label: 'Alive', value: 9 }, { label: 'Dead', value: 0 }], { variant: 'figures' }));</script></div>
</body>
</html>
