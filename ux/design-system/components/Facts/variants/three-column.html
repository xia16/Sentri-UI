<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Facts: three column</title>
</head>
<body>
<!-- Short numeric facts, three across: counts that fit in a few characters. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Default" data-bleed data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Alive litter', value: 11 }, { label: 'Identified', value: 8 }, { label: 'Without identity', value: 3 }], { columns: 3 }));</script></div>
<div data-state="Zero is not missing" data-bleed data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Alive litter', value: 11 }, { label: 'Identified', value: 0 }, { label: 'Without identity', value: null }], { columns: 3 }));</script></div>
<div data-state="Longest label" data-bleed data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: 'Alive litter', value: 11 }, { label: 'With an ID', value: 8 }, { label: 'Without an ID', value: 3 }], { columns: 3 }));</script></div>
<div data-state="Chinese" data-bleed data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.facts([{ label: '活仔', value: 11 }, { label: '已有身份', value: 8 }, { label: '没有身份', value: 3 }], { columns: 3 }));</script></div>
</body>
</html>
