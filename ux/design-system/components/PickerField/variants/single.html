<!doctype html><meta charset="utf-8">
<section data-state="Default"><h3>Default</h3><div id="state-Default"></div>

</section>
<section data-state="Pressed"><h3>Pressed</h3><div id="state-Pressed"></div>

</section>
<section data-state="Active"><h3>Active</h3><div id="state-Active"></div>

</section>
<section data-state="Disabled"><h3>Disabled</h3><div id="state-Disabled"></div>

</section>
<section data-state="Error"><h3>Error</h3><div id="state-Error"></div>

</section>
<section data-state="Loading"><h3>Loading</h3><div id="state-Loading"></div>

</section>
<section data-state="Empty"><h3>Empty</h3><div id="state-Empty"></div>

</section>
<section data-state="Long-label"><h3>Long-label</h3><div id="state-Long-label"></div>

</section>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "state-Default": () => UI.pickerField({"pressed": false, "disabled": false, "reason": "", "label": "Cause", "variant": "single", "selected": [], "value": "", "path": [], "active": false, "error": "", "loading": false}) + UI.pickerBody({"variant": "single", "items": [{"value": "a", "label": "Low appetite"}, {"value": "b", "label": "Fever"}, {"value": "c", "label": "Depression or lethargy"}, {"value": "d", "label": "Poor growth"}, {"value": "e", "label": "Pale mucous membranes"}], "selected": [], "path": [], "loading": false, "error": ""}) + UI.pickerFooter({"multi": false, "selected": []}),
  "state-Pressed": () => UI.pickerField({"pressed": true, "disabled": false, "reason": "", "label": "Cause", "variant": "single", "selected": [], "value": "", "path": [], "active": false, "error": "", "loading": false}),
  "state-Active": () => UI.pickerField({"pressed": false, "disabled": false, "reason": "", "label": "Cause", "variant": "single", "selected": ["a"], "value": "Low appetite", "path": [], "active": true, "error": "", "loading": false}) + UI.pickerBody({"variant": "single", "items": [{"value": "a", "label": "Low appetite"}, {"value": "b", "label": "Fever"}, {"value": "c", "label": "Depression or lethargy"}, {"value": "d", "label": "Poor growth"}, {"value": "e", "label": "Pale mucous membranes"}], "selected": ["a"], "path": [], "loading": false, "error": ""}) + UI.pickerFooter({"multi": false, "selected": ["a"]}),
  "state-Disabled": () => UI.pickerField({"pressed": false, "disabled": true, "reason": "Unavailable offline. Reconnect to select.", "label": "Cause", "variant": "single", "selected": [], "value": "", "path": [], "active": false, "error": "", "loading": false}),
  "state-Error": () => UI.pickerField({"pressed": false, "disabled": false, "reason": "", "label": "Cause", "variant": "single", "selected": [], "value": "", "path": [], "active": false, "error": "Select an available option to continue.", "loading": false}) + UI.pickerBody({"variant": "single", "items": [{"value": "a", "label": "Low appetite"}, {"value": "b", "label": "Fever"}, {"value": "c", "label": "Depression or lethargy"}, {"value": "d", "label": "Poor growth"}, {"value": "e", "label": "Pale mucous membranes"}], "selected": [], "path": [], "loading": false, "error": "Options could not load. Try again."}) + UI.pickerFooter({"multi": false, "selected": []}),
  "state-Loading": () => UI.pickerField({"pressed": false, "disabled": false, "reason": "", "label": "Cause", "variant": "single", "selected": [], "value": "", "path": [], "active": false, "error": "", "loading": true}) + UI.pickerBody({"variant": "single", "items": [{"value": "a", "label": "Low appetite"}, {"value": "b", "label": "Fever"}, {"value": "c", "label": "Depression or lethargy"}, {"value": "d", "label": "Poor growth"}, {"value": "e", "label": "Pale mucous membranes"}], "selected": [], "path": [], "loading": true, "error": ""}) + UI.pickerFooter({"multi": false, "selected": []}),
  "state-Empty": () => UI.pickerField({"pressed": false, "disabled": false, "reason": "", "label": "Cause", "variant": "single", "selected": [], "value": "", "path": [], "active": false, "error": "", "loading": false}) + UI.pickerBody({"variant": "single", "items": [], "selected": [], "path": [], "loading": false, "error": ""}) + UI.pickerFooter({"multi": false, "selected": []}),
  "state-Long-label": () => UI.pickerField({"pressed": false, "disabled": false, "reason": "", "label": "青霉素类抗菌药物 / 阿莫西林可溶性粉用于仔猪治疗的完整名称", "variant": "single", "selected": ["a"], "value": "青霉素类抗菌药物 / 阿莫西林可溶性粉用于仔猪治疗的完整名称", "path": [], "active": false, "error": "", "loading": false}) + UI.choiceGroup(UI.choiceRow({label:"青霉素类抗菌药物 / 阿莫西林可溶性粉用于仔猪治疗的完整名称",mode:"single",selected:true}))
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
