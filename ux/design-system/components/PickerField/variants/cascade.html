<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PickerField · cascade</title><style>
.ph{position:relative;width:390px;max-width:100%;height:720px;margin:0 auto;overflow:hidden;background:var(--app-background);border:1px solid var(--line);border-radius:var(--radius-device,28px);font-family:var(--font-sans);color:var(--ink)}
.ph-page{padding:0 var(--space-gutter)}
.ph-bar{display:flex;align-items:center;height:var(--statusbar-height);padding:0 var(--space-6);font:600 var(--font-size-13) var(--font-sans)}
.ph-form{display:flex;flex-direction:column;gap:var(--space-16)}
</style></head><body>
<div data-state="Default" id="state-Default"></div>
<div data-state="Pressed" id="state-Pressed"></div>
<div data-state="Open" id="state-Open"></div>
<div data-state="Level" id="state-Level"></div>
<div data-state="Active" id="state-Active"></div>
<div data-state="Disabled" id="state-Disabled"></div>
<div data-state="Error" id="state-Error"></div>
<div data-state="Loading" id="state-Loading"></div>
<div data-state="Empty" id="state-Empty"></div>
<div data-state="Long-label" id="state-Long-label"></div>
<script>
var UI = window.SentriUI;
/* The real container: a 390px phone; a picker or a form is a drawer over the pig's page (never a drawer on a drawer). */
function page(){return '<div class="ph-page"><div class="ph-bar" aria-hidden="true">9:41</div>'+UI.heading({title:'000267',kind:'page',description:'C1 \u00b7 Gestation \u00b7 42 days'})+UI.panel(UI.row({title:'Thin',description:'Day 12 \u00b7 monitor'}),{className:'st-row-group'})+'</div>';}
function phone(over){return '<div class="ph" data-st-context="page">'+page()+over+'</div>';}
function form(title,fields,ready){return phone(UI.sheet({title:title,subtitle:'000267 \u00b7 C1',size:'medium',body:'<div class="ph-form">'+fields+'</div>',footer:UI.sheetFooter({back:{action:'back'},primary:{label:'Save',action:'save',waiting:!ready}})}));}
function picker(o){var h=o.head||{title:o.title,up:null};return phone(UI.sheet({title:h.title,up:h.up,size:'long',sizing:h.rows?'hold':'content',holdRows:h.rows||0,body:o.html||UI.pickerBody(o.body),footer:o.footer||UI.pickerFooter(o.foot||{})}));}

var RENDER = {

  "state-Pressed": () => form("Record treatment",UI.pickerField({"label": "Medicine", "variant": "cascade", "pressed": true})),

  "state-Level": () => picker({head:UI.pickerHead({"items": [{"value": "Antibiotics", "label": "Antibiotics", "children": [{"value": "antibiotic-a", "label": "Antibiotic A", "meta": "Injectable solution"}, {"value": "antibiotic-b", "label": "Antibiotic B", "meta": "Oral solution"}]}, {"value": "Pain relief", "label": "Pain relief", "children": [{"value": "meloxicam", "label": "Meloxicam", "meta": "Injectable solution"}]}, {"value": "Parasite control", "label": "Parasite control", "children": [{"value": "ivermectin", "label": "Ivermectin", "meta": "Injectable solution"}]}, {"value": "Vaccines", "label": "Vaccines", "children": [{"value": "erysipelas", "label": "Erysipelas vaccine", "meta": "Injection"}]}], "path": ["Antibiotics"], "title": "Medicines", "rootLabel": "Medicines"}),body:{"variant": "cascade", "items": [{"value": "Antibiotics", "label": "Antibiotics", "children": [{"value": "antibiotic-a", "label": "Antibiotic A", "meta": "Injectable solution"}, {"value": "antibiotic-b", "label": "Antibiotic B", "meta": "Oral solution"}]}, {"value": "Pain relief", "label": "Pain relief", "children": [{"value": "meloxicam", "label": "Meloxicam", "meta": "Injectable solution"}]}, {"value": "Parasite control", "label": "Parasite control", "children": [{"value": "ivermectin", "label": "Ivermectin", "meta": "Injectable solution"}]}, {"value": "Vaccines", "label": "Vaccines", "children": [{"value": "erysipelas", "label": "Erysipelas vaccine", "meta": "Injection"}]}], "selected": ["antibiotic-a"], "path": ["Antibiotics"]},foot:{"multi": false, "selected": []}}),
  "state-Active": () => form("Record treatment",UI.pickerField({"label": "Medicine", "variant": "cascade", "value": "Antibiotic A", "path": ["Antibiotics", "Antibiotic A"]}),true),
  "state-Disabled": () => form("Record treatment",UI.pickerField({"label": "Medicine", "variant": "cascade", "disabled": true, "reason": "Unavailable offline. Reconnect to select."})),
  "state-Error": () => form("Record treatment",UI.pickerField({"label": "Medicine", "variant": "cascade", "error": "Select an available option to continue."})),
  "state-Loading": () => picker({head:UI.pickerHead({"items": [{"value": "Antibiotics", "label": "Antibiotics", "children": [{"value": "antibiotic-a", "label": "Antibiotic A", "meta": "Injectable solution"}, {"value": "antibiotic-b", "label": "Antibiotic B", "meta": "Oral solution"}]}, {"value": "Pain relief", "label": "Pain relief", "children": [{"value": "meloxicam", "label": "Meloxicam", "meta": "Injectable solution"}]}, {"value": "Parasite control", "label": "Parasite control", "children": [{"value": "ivermectin", "label": "Ivermectin", "meta": "Injectable solution"}]}, {"value": "Vaccines", "label": "Vaccines", "children": [{"value": "erysipelas", "label": "Erysipelas vaccine", "meta": "Injection"}]}], "path": [], "title": "Medicines", "rootLabel": "Medicines"}),body:{"variant": "cascade", "items": [{"value": "Antibiotics", "label": "Antibiotics", "children": [{"value": "antibiotic-a", "label": "Antibiotic A", "meta": "Injectable solution"}, {"value": "antibiotic-b", "label": "Antibiotic B", "meta": "Oral solution"}]}, {"value": "Pain relief", "label": "Pain relief", "children": [{"value": "meloxicam", "label": "Meloxicam", "meta": "Injectable solution"}]}, {"value": "Parasite control", "label": "Parasite control", "children": [{"value": "ivermectin", "label": "Ivermectin", "meta": "Injectable solution"}]}, {"value": "Vaccines", "label": "Vaccines", "children": [{"value": "erysipelas", "label": "Erysipelas vaccine", "meta": "Injection"}]}], "selected": [], "path": [], "loading": true},foot:{"multi": false, "selected": [], "waiting": false}}),
  "state-Empty": () => picker({head:UI.pickerHead({"items": [{"value": "Antibiotics", "label": "Antibiotics", "children": [{"value": "antibiotic-a", "label": "Antibiotic A", "meta": "Injectable solution"}, {"value": "antibiotic-b", "label": "Antibiotic B", "meta": "Oral solution"}]}, {"value": "Pain relief", "label": "Pain relief", "children": [{"value": "meloxicam", "label": "Meloxicam", "meta": "Injectable solution"}]}, {"value": "Parasite control", "label": "Parasite control", "children": [{"value": "ivermectin", "label": "Ivermectin", "meta": "Injectable solution"}]}, {"value": "Vaccines", "label": "Vaccines", "children": [{"value": "erysipelas", "label": "Erysipelas vaccine", "meta": "Injection"}]}], "path": [], "title": "Medicines", "rootLabel": "Medicines"}),body:{"variant": "cascade", "items": [{"value": "Antibiotics", "label": "Antibiotics", "children": [{"value": "antibiotic-a", "label": "Antibiotic A", "meta": "Injectable solution"}, {"value": "antibiotic-b", "label": "Antibiotic B", "meta": "Oral solution"}]}, {"value": "Pain relief", "label": "Pain relief", "children": [{"value": "meloxicam", "label": "Meloxicam", "meta": "Injectable solution"}]}, {"value": "Parasite control", "label": "Parasite control", "children": [{"value": "ivermectin", "label": "Ivermectin", "meta": "Injectable solution"}]}, {"value": "Vaccines", "label": "Vaccines", "children": [{"value": "erysipelas", "label": "Erysipelas vaccine", "meta": "Injection"}]}], "selected": [], "path": [], "query": "zz"},foot:{"multi": false, "selected": [], "waiting": false}}),
  "state-Long-label": () => picker({head:UI.pickerHead({"items": [{"value": "k", "label": "\u6297\u83cc\u836f", "children": [{"value": "x", "label": "\u963f\u83ab\u897f\u6797\u53ef\u6eb6\u6027\u7c89\uff08\u4ed4\u732a\u996e\u6c34\u7ed9\u836f\uff0c\u6bcf\u5347\u6c34 0.2 \u514b\uff09", "meta": "\u53e3\u670d\u6eb6\u6db2"}, {"value": "y", "label": "\u5934\u5b62\u567b\u544b\u94a0\u6ce8\u5c04\u6db2", "meta": "\u6ce8\u5c04\u6db2"}]}], "path": ["k"], "title": "Medicines", "rootLabel": "Medicines"}),body:{"variant": "cascade", "items": [{"value": "k", "label": "\u6297\u83cc\u836f", "children": [{"value": "x", "label": "\u963f\u83ab\u897f\u6797\u53ef\u6eb6\u6027\u7c89\uff08\u4ed4\u732a\u996e\u6c34\u7ed9\u836f\uff0c\u6bcf\u5347\u6c34 0.2 \u514b\uff09", "meta": "\u53e3\u670d\u6eb6\u6db2"}, {"value": "y", "label": "\u5934\u5b62\u567b\u544b\u94a0\u6ce8\u5c04\u6db2", "meta": "\u6ce8\u5c04\u6db2"}]}], "selected": [], "path": ["k"]},foot:{"multi": false, "selected": []}})
};
document.querySelectorAll('[data-state]').forEach(function (s) { if (RENDER[s.id]) s.innerHTML = RENDER[s.id](); });
</script></body></html>
