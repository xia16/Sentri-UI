<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidates 2</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="/ux/tasks/piglet-processing/shell.css">
<style>
/* layout only: the order of the states and the gaps between them */
.demo-card > * + * { margin-top: var(--space-section); }
.demo-state > * + * { margin-top: var(--space-row-y); }
.demo-bar { display: flex; flex-wrap: wrap; gap: var(--space-footer-gap); }
.demo-bar > .button.primary, .demo-bar > .button.danger { flex: 1; }
.demo-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-footer-gap); }
.demo-stack > * + * { margin-top: 8px; }
.demo-right { display: flex; justify-content: flex-end; gap: var(--space-footer-gap); }
</style>
</head>
<body>
<!-- Every state of the second design-system candidate batch (ADR 0002), en and zh (?lang=zh): Button registers,
     the waiting face and hold; ChoiceList radio; Status; Banner; Photos; the Row roots; Log's group line;
     Numpad compact. Sample litter: crate B04, 11 alive, day 3. Pressed is drawn with the data-preview hook. -->
<main class="phone inspection-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script>
(function () {
  var UI = window.SentriUI;
  var D = 'ds.c2.demo.';
  function st(title, body) { return '<div class="demo-state">' + UI.heading({ title: '', kind: 'group', level: 4, strs: { title: D + title } }) + body + '</div>'; }
  function card(title, states) { return '<section class="demo-card">' + UI.heading({ title: '', kind: 'section', level: 2, strs: { title: D + title } }) + states.join('') + '</section>'; }
  function p(id, args, tone, mono) { return { text: '', tone: tone, mono: mono, strs: { text: id }, args: args ? { text: args } : undefined }; }
  function b(o) { return UI.button(Object.assign({ label: '' }, o, { strs: { label: o.id }, args: o.args ? { label: o.args } : undefined })); }
  var back = function () { return b({ id: 'act.back', register: 'secondary', action: 'back', className: 'surface-back' }); };

  // ---- Button: the four registers, the waiting face, hold ----
  var bar = '<div class="demo-bar">' + back() + b({ id: 'act.save', register: 'primary', action: 'save' }) + '</div>';
  var tools = '<div class="demo-pair">' + b({ id: 'act.record_dead', register: 'tool', action: 'open-dead', value: 'tool-a' }) + b({ id: 'pp.count.title', register: 'tool', action: 'open-count', value: 'tool-b' }) + '</div>';
  var text = '<div class="demo-right">' + b({ id: 'act.clear', register: 'text', action: 'clear', value: 'text-a' }) + '</div>';
  function waiting(key) {
    return '<div class="demo-bar">' + UI.buttonReason({ id: 'why-' + key, text: '', strs: { text: D + 'reason_cause' } }) +
      back() + b({ id: 'act.save', register: 'primary', action: 'save', value: key, waiting: true, describedby: 'why-' + key }) + '</div>';
  }
  // A hold: its progress echoes in a status line above the bar, outside the thumb's footprint.
  function hold(o) {
    var line = 'line-' + o.val;
    return '<div class="demo-bar">' + UI.buttonReason({ id: line, text: '', strs: o.line ? { text: o.line } : undefined }) + back() +
      UI.holdButton({ label: '', caption: '', phase: o.phase || 'idle', value: o.val, tone: o.tone, waiting: o.waiting, describedby: o.waiting ? line : '', statusId: o.waiting ? '' : line,
        strs: { label: o.label || 'pp.end.act.end', caption: o.cap }, args: { label: o.labelArgs } }) + '</div>';
  }
  var button = card('button', [
    st('registers', '<div class="demo-stack">' + bar + tools + text + '</div>'),
    st('tool_states', '<div class="demo-pair">' + b({ id: 'act.record_dead', register: 'tool', action: 'open-dead', value: 'tool-pressed' }) + '</div>'),
    st('text_states', '<div class="demo-right">' + b({ id: 'act.clear', register: 'text', action: 'clear', value: 'text-pressed' }) + b({ id: 'act.clear', register: 'text', action: 'clear', value: 'text-waiting', waiting: true }) + '</div>'),
    st('waiting', waiting('w-quiet')),
    st('waiting_answered', waiting('w-answered')),
    st('hold_idle', hold({ val: 'h-idle', cap: 'pp.end.hold.caption' })),
    st('hold_holding', hold({ val: 'h-holding', phase: 'holding', cap: 'pp.end.hold.keep', line: 'pp.end.hold.keep' })),
    st('hold_armed', hold({ val: 'h-armed', phase: 'armed', cap: 'ds.c2.hold.again', line: 'ds.c2.hold.again' })),
    st('hold_pending', hold({ val: 'h-pending', phase: 'pending', cap: 'pp.end.hold.pending', line: 'pp.end.hold.pending' })),
    st('hold_unknown', hold({ val: 'h-unknown', phase: 'unknown', cap: 'ds.c2.hold.unknown', line: 'ds.c2.hold.unknown' })),
    st('hold_waiting', hold({ val: 'h-waiting', waiting: true, cap: 'pp.end.hold.caption', line: D + 'hold_reason' })),
    st('hold_primary', hold({ val: 'h-lock', tone: 'primary', cap: 'ds.c2.hold.lock', label: 'fr.act.lock', labelArgs: { n: 14 } }))
  ]);

  // ---- ChoiceList radio: 60px rows (whole row the target) and inline (the Stepper silhouette) ----
  var litters = [['A02', 11, 3], ['B04', 12, 3], ['C01', 9, 4]].map(function (r) {
    return { value: r[0], label: r[0], mono: true, meta: '', strs: { label: D + 'code', meta: D + 'litter_meta' }, args: { label: { code: r[0] }, meta: { n: r[1], d: r[2] } } };
  });
  var reasons = ['weak', 'sick', 'small'].map(function (k) { return { value: k, label: '', strs: { label: D + k } }; });
  function rows(opts, sel, key, title, optional) {
    return UI.choiceRadios({ label: '', optional: '', options: opts, selected: sel, action: 'choose', key: key,
      strs: Object.assign({ label: D + title, clear: 'act.clear' }, optional ? { optional: 'ds.field.optional' } : {}) });
  }
  function sex(sel, key) {
    return UI.panel(UI.choiceRadios({ layout: 'inline', label: '', optional: '', selected: sel, key: key, action: 'sex', strs: { label: D + 'sex', optional: 'ds.field.optional', clear: 'act.clear' },
      options: [{ value: 'b', label: '', strs: { label: D + 'boar' } }, { value: 'g', label: '', strs: { label: D + 'gilt' } }] }));
  }
  var radio = card('radio', [
    st('radio_none', rows(reasons, '', 'why', 'why', true)),
    st('radio_chosen', rows(litters, 'B04', 'which', 'which')),
    st('radio_clear', rows(reasons, 'sick', 'why-clear', 'why', true)),
    st('radio_pressed', rows(reasons, 'weak', 'why-pressed', 'why')),
    st('inline_empty', sex('', 'sex-empty')),
    st('inline_chosen', sex('g', 'sex-chosen')),
    st('inline_pressed', sex('g', 'sex-states'))
  ]);

  // ---- Status: words (a dot and a coloured word) and lines (colour on the value, the word ink) ----
  var words = '<div class="demo-bar">' + [['w_due', 'amber'], ['w_progress', 'progress'], ['w_done', 'green'], ['w_waiting', 'muted'], ['w_sow_died', 'red']].map(function (w) {
    return UI.status({ text: '', tone: w[1], strs: { text: D + w[0] } });
  }).join('') + '</div>';
  var lines = '<div class="demo-stack">' +
    UI.statusLine([p(D + 'saved'), [p(D + 'plus_visit', { n: 4 }, 'green')]], { sep: 'dot', live: true }) +
    UI.statusLine([[p(D + 'overdue'), p(D + 'days', { n: 3 }, 'red')]]) +
    UI.statusLine([p(D + 'parity', { n: 3 }), [p(D + 'owed'), p(D + 'n', { n: 4 }, 'amber')]], { sep: 'dot', mono: true }) + '</div>';
  var status = card('status', [st('words', words), st('lines', lines)]);

  // ---- Banner: danger above a hold, a terminal fact, the correction banner, Cleared · Undo ----
  var banner = card('banner', [
    st('danger', UI.banner({ tone: 'danger', headline: '', consequence: '', strs: { headline: 'ds.dead.sow.warn_open', consequence: D + 'sow_consequence' } }) +
      hold({ val: 'h-sow', cap: 'ds.dead.hold', label: 'act.save' })),
    st('terminal', UI.banner({ tone: 'danger', headline: '', consequence: '', strs: { headline: D + 'sow_died', consequence: D + 'sow_stamp' } })),
    st('correction', UI.banner({ tone: 'correction', headline: '', consequence: '', id: 'demo-edit',
      strs: { headline: D + 'correcting', consequence: D + 'logged_as' }, args: { consequence: { who: 'G.H' } },
      summary: [[p(D + 'stillborn', { a: 1 }), p(D + 'n', { n: 0 }, 'amber')], [p(D + 'alive_from', { a: 10 }), p(D + 'n', { n: 11 }, 'amber')]],
      actions: [{ label: '', action: 'clear', strs: { label: 'act.clear' } }] })),
    st('cleared_undo', UI.banner({ tone: 'correction', headline: '', consequence: '', id: 'demo-cleared',
      strs: { headline: D + 'correcting', consequence: D + 'logged_as' }, args: { consequence: { who: 'G.H' } },
      summary: [p(D + 'cleared')], actions: [{ label: '', action: 'undo-clear', strs: { label: 'ds.c2.undo' } }] }))
  ]);

  // ---- Photos: inactive → live, attached (one waiting to upload), full, camera denied ----
  var pstrs = { label: 'ds.c2.photos.label', optional: 'ds.field.optional', camera: 'ds.c2.aria.camera', thumb: 'ds.c2.aria.thumb', thumbPending: 'ds.c2.aria.thumb_pending', index: 'ds.c2.photos.index' };
  function ph(o, extra) { return UI.photos(Object.assign({ label: '', optional: '', key: o.key }, o, { strs: Object.assign({}, pstrs, extra && extra.strs), args: extra && extra.args })); }
  function items(n, pending) { var a = []; for (var i = 1; i <= n; i++) a.push({ id: 'p' + i, pending: i === pending }); return a; }
  var photos = card('photos', [
    st('photos_inactive', ph({ key: 'ph-inactive', active: false, hint: '' }, { strs: { hint: 'ds.c2.photos.inactive' } })),
    st('photos_empty', ph({ key: 'ph-empty' })),
    st('photos_some', ph({ key: 'ph-some', items: items(3, 3), count: [p('ds.c2.photos.attached', { n: 3 }), p('ds.c2.photos.waiting', { n: 1 }, 'amber')] })),
    st('photos_full', ph({ key: 'ph-full', items: items(12), count: p('ds.c2.photos.attached', { n: 12 }), hint: '' }, { strs: { hint: 'ds.c2.photos.full' }, args: { hint: { n: 12 } } })),
    st('photos_error', ph({ key: 'ph-denied', error: 'denied' })),
    st('photos_states', ph({ key: 'ph-states', items: items(2), count: p('ds.c2.photos.attached', { n: 2 }) }))
  ]);

  // ---- Row: row (code, token lines, one chip, trail), rowSelect, rowAction ----
  function codeArgs(code) { return { strs: { code: D + 'code' }, args: { code: { code: code } } }; }
  function lrow(code, o) { return UI.row(Object.assign({ title: '', code: '', action: 'open-litter', value: code, mono: true, wrap: true }, codeArgs(code), o)); }
  function srow(code, o) { return UI.rowSelect(Object.assign({ title: '', code: '', value: code, action: 'toggle', mono: true, wrap: true }, codeArgs(code), o)); }
  var litterRows = UI.rowGroup(
    lrow('A02', { title: [p(D + 'iron')], description: [p(D + 'hours', { n: 2 }), [p(D + 'owed'), p(D + 'n', { n: 4 }, 'amber')], p(D + 'parity', { n: 3 })] }) +
    lrow('B04', { title: [[p(D + 'overdue'), p(D + 'days', { n: 3 }, 'red')]], description: [p(D + 'fact_alive', { n: 7 }), p(D + 'parity', { n: 5 })], chip: { text: '', tone: 'red', strs: { text: D + 'w_sow_died' } } }) +
    lrow('C01', { title: [p(D + 'castrate')], description: [p(D + 'fact_alive', { n: 9 }), [p(D + 'owed'), p(D + 'n', { n: 5 }, 'amber')]], chip: { text: '', tone: 'amber', strs: { text: D + 'unlocked' } } }) +
    lrow('D06', { action: '', title: [p(D + 'all_done')], description: [p(D + 'fact_alive', { n: 12 })] }));
  var selectRows = UI.rowGroup(
    srow('A02', { checked: true, title: [p(D + 'iron')], description: [[p(D + 'owed'), p(D + 'n', { n: 4 }, 'amber')]] }) +
    srow('C01', { checked: false, title: [p(D + 'iron')], description: [[p(D + 'owed'), p(D + 'n', { n: 9 }, 'amber')]] }));
  function txRow(key, busy) {
    return UI.rowAction({ id: 'tx-' + key, title: '', description: '', action: 'open-dose', value: key, strs: { title: D + 'iron', description: D + 'owed_n' }, args: { description: { n: 12 } },
      act: { label: '', action: 'record', value: key, busy: busy, strs: { label: busy ? D + 'recording' : D + 'record_n' }, args: { label: { n: 12 } } } });
  }
  var doneRow = UI.row({ title: '', description: '', action: 'open-edit', value: 'iron-done', trail: 'edit', wrap: true, strs: { title: D + 'iron_done', description: D + 'evidence' } });
  var row = card('row', [
    st('row_litter', litterRows),
    st('row_select', selectRows),
    st('row_act', UI.rowGroup(txRow('iron') + txRow('iron-busy', true))),
    st('row_done', UI.rowGroup(doneRow)),
    st('row_states', UI.rowGroup(lrow('A05', { value: 'row-pressed', title: [p(D + 'iron')], description: [[p(D + 'owed'), p(D + 'n', { n: 2 }, 'amber')]] })))
  ]);

  // ---- Log: a line under the group label; Numpad compact ----
  var log = card('log', [UI.log([{ label: '', description: '', strs: { label: D + 'log_group', description: D + 'log_desc' },
    entries: [{ title: '', meta: '', strs: { title: D + 'log_entry', meta: D + 'log_meta' } }] }])]);
  var padStrs = { digit: 'ds.field.figure', decimal: 'ds.field.decimal', back: 'ds.field.aria.backspace', pad: 'ds.field.aria.pad', recent: 'ds.field.aria.recent', value: 'ds.field.figure', placeholder: 'ds.field.placeholder' };
  var numpad = card('numpad', [UI.numpad({ compact: true, label: '', value: '000258', suggested: true, maxLength: 6, key: 'tag-compact', hint: '',
    actions: [{ label: '', action: 'edit-piglet', strs: { label: 'pp.id.ptr.edit_piglet' }, args: { label: { i: 4 } } }],
    strs: Object.assign({ label: 'ds.field.numpad.tag_label', hint: D + 'last' }, padStrs), args: { label: { i: 5, n: 11 }, hint: { tag: '000257', w: '1.51' } } })]);

  var screen = document.getElementById('screen');
  screen.innerHTML = UI.heading({ title: '', kind: 'page', level: 1, strs: { title: D + 'title' } }) + button + radio + status + banner + photos + row + log + numpad;
  screen.className = 'demo-card';
  // Live regions mount empty and are filled after (here at once, so the still demo shows them).
  UI.liveFill(screen, { delay: 0 });
  // Pressed, a hold in progress and an answered tap are interaction states; the data-preview hook draws them still.
  function mark(sel, state) { var el = screen.querySelector(sel); if (el) el.setAttribute('data-preview', state); }
  mark('[data-value="tool-pressed"]', 'pressed');
  mark('[data-value="text-pressed"]', 'pressed');
  mark('[data-value="h-holding"]', 'still');
  mark('[data-field="why-pressed"][data-value="sick"]', 'pressed');
  mark('[data-field="sex-states"] [data-value="g"]', 'pressed');
  mark('[data-field="ph-states"] .st-photos-camera', 'pressed');
  mark('[data-value="row-pressed"]', 'pressed');
  var answered = document.getElementById('why-w-answered'); if (answered) answered.setAttribute('data-answer', '');
  // The live pieces: hold (press and hold, or press twice from the keyboard), the radio keys, the waiting guard.
  // Nothing is recorded; a hold settles as done and resets after a moment.
  var t = function (id) { return window.PP ? window.PP.t(id) : id; };
  var holds = UI.holdBind(screen, { t: t, cues: { keep: 'pp.end.hold.keep', tap: 'ds.dead.hold.keep', released: 'ds.dead.hold.cancel', again: 'ds.c2.hold.again', early: 'ds.c2.hold.again', pending: 'pp.end.hold.pending' },
    onCommit: function (el) { setTimeout(function () { holds.settle(el, 'failed'); }, 1200); } });
  UI.radioBind(screen, { onChange: function () {} });
  screen.addEventListener('click', function (ev) { var c = ev.target.closest('[data-action]'); if (c) UI.guard(c); });
})();
</script>
<script src="/ux/tasks/piglet-processing/shell.js"></script>
</body>
</html>
