<!-- @dsCard group="Fields" height=1000 subtitle="Candidate · − n + rows and the hero count" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>html,body{margin:0;background:var(--app-background)}</style></head>
<body>
<div class="inspection-phone" data-st-context="page" style="max-width:390px;padding:16px;background:var(--app-background);font-family:var(--sans);color:var(--ink)"><div id="rows"></div><div id="hero" style="margin-top:24px"></div><div id="floor" style="margin-top:24px"></div></div>
<script>
const UI = window.SentriUI;
// Rows among 11 alive: default, empty (0 · − floor-gray), pressed, focus, at the ceiling (host copy), corrected in Edit.
rows.innerHTML = UI.panel([
  UI.stepper({ label: 'Weak', description: 'among 11 alive', value: 1, max: 11, key: 'weak' }),
  UI.stepper({ label: 'Deformed', description: 'among 11 alive', value: 0, max: 10, key: 'deformed' }),
  UI.stepper({ label: 'Pressed +', value: 2, key: 'pressed' }),
  UI.stepper({ label: 'Focus on +', value: 2, key: 'focus' }),
  UI.stepper({ label: 'Weak', value: 11, max: 11, key: 'ceiling', hint: "Weak and deformed can't pass 11 alive" }),
  UI.stepper({ label: 'Alive · corrected', value: 10, changed: true, key: 'edit' }),
  UI.stepper({ label: 'Crushed · draft +1', value: 3, min: 2, draft: true, key: 'draft' })
].join(''));
hero.innerHTML = UI.stepper({ variant: 'hero', label: 'Alive', value: 9, min: 5, key: 'alive', hint: 'Saved · +4 this visit' });
floor.innerHTML = UI.stepper({ variant: 'hero', label: 'Alive', value: 9, min: 9, key: 'alive-floor', pointers: [
  { label: 'Found dead? Record dead', action: 'record-dead' },
  { label: 'Wrong count? Edit', action: 'edit' }
] });
document.querySelector('[data-value="pressed"][data-step="1"]').setAttribute('data-preview', 'pressed');
document.querySelector('[data-value="focus"][data-step="1"]').setAttribute('data-preview', 'focus');
</script>
</body>
</html>
