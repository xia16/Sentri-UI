<!doctype html><meta charset="utf-8">
<section data-state="Default"><h3>Default</h3><div id="state-Default"></div>

</section>
<section data-state="Pressed"><h3>Pressed</h3><div id="state-Pressed"></div>

</section>
<section data-state="Disabled"><h3>Disabled</h3><div id="state-Disabled"></div>

</section>
<section data-state="Focus" data-preview="focus"><h3>Focus</h3><div id="state-Focus"></div>

</section>
<section data-state="Loading"><h3>Loading</h3><div id="state-Loading"></div>

</section>
<section data-state="Empty"><h3>Empty</h3><div id="state-Empty"></div>

</section>
<section data-state="Long-label"><h3>Long-label</h3><div id="state-Long-label"></div>

</section>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "state-Default": () => UI.choiceGroup(UI.choiceRow({"pressed": false, "disabled": false, "reason": "", "label": "Amoxicillin", "mode": "navigate", "selected": false, "meta": "Antibiotics", "value": "a"}),{title:"Medicine",radio:false}),
  "state-Pressed": () => UI.choiceGroup(UI.choiceRow({"pressed": true, "disabled": false, "reason": "", "label": "Amoxicillin", "mode": "navigate", "selected": false, "meta": "Antibiotics", "value": "a"}),{title:"Medicine",radio:false}),
  "state-Disabled": () => UI.choiceGroup(UI.choiceRow({"pressed": false, "disabled": true, "reason": "Unavailable offline. Reconnect to select.", "label": "Amoxicillin", "mode": "navigate", "selected": false, "meta": "Antibiotics", "value": "a"}),{title:"Medicine",radio:false}),
  "state-Focus": () => UI.choiceGroup(UI.choiceRow({"pressed": false, "disabled": false, "reason": "", "label": "Amoxicillin", "mode": "navigate", "selected": false, "meta": "Antibiotics", "value": "a"}),{title:"Medicine",radio:false}),
  "state-Loading": () => UI.choiceEmpty("Loading options\u2026"),
  "state-Empty": () => UI.choiceEmpty("No options available."),
  "state-Long-label": () => UI.choiceGroup(UI.choiceRow({"pressed": false, "disabled": false, "reason": "", "label": "青霉素类抗菌药物 / 阿莫西林可溶性粉用于仔猪治疗的完整名称", "mode": "navigate", "selected": false, "meta": "Antibiotics", "value": "a"}),{title:"Medicine",radio:false})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
