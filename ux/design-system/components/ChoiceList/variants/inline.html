<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChoiceList · inline</title><style>
.ph{position:relative;width:390px;max-width:100%;height:720px;margin:0 auto;overflow:hidden;background:var(--app-background);border:1px solid var(--line);border-radius:var(--radius-device,28px);font-family:var(--font-sans);color:var(--ink)}
.ph-page{padding:0 var(--space-gutter)}
.ph-bar{display:flex;align-items:center;height:var(--statusbar-height);padding:0 var(--space-6);font:600 var(--font-size-13) var(--font-sans)}
.ph-form{display:flex;flex-direction:column;gap:var(--space-16)}
</style></head><body>
<div data-state="Default" id="state-Default"></div>
<div data-state="Pressed" id="state-Pressed"></div>
<div data-state="Selected" id="state-Selected"></div>
<div data-state="Disabled" id="state-Disabled"></div>
<div data-state="Loading" id="state-Loading"></div>
<div data-state="Empty" id="state-Empty"></div>
<div data-state="Long-label" id="state-Long-label"></div>
<script>
var UI = window.SentriUI;
/* The real container: a 390px phone; a picker or a form is a drawer over the pig's page (never a drawer on a drawer). */
function page(){return '<div class="ph-page"><div class="ph-bar" aria-hidden="true">9:41</div>'+UI.heading({title:'000267',kind:'page',description:'C1 \u00b7 Gestation \u00b7 42 days'})+UI.panel(UI.row({title:'Thin',description:'Day 12 \u00b7 monitor'}),{className:'st-row-group'})+'</div>';}
function phone(over){return '<div class="ph" data-st-context="page">'+page()+over+'</div>';}
function form(title,fields,ready){return phone(UI.sheet({title:title,subtitle:'000267 \u00b7 C1',size:'medium',body:'<div class="ph-form">'+fields+'</div>',footer:UI.sheetFooter({back:{action:'back'},primary:{label:'Save',action:'save',waiting:!ready}})}));}
function picker(o){var h=o.head||{title:o.title,up:null};return phone(UI.sheet({title:h.title,up:h.up,size:'long',body:o.html||UI.pickerBody(o.body),footer:o.footer||UI.pickerFooter(o.foot||{})}));}

var RENDER = {
  "state-Default": () => form('Record piglet',UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": ""})+UI.optionalRow({label:"Note",icon:window.SentriIcons.icon("plus"),action:"note"}),false),
  "state-Pressed": () => form('Record piglet',UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": "", "pressed": true})+UI.optionalRow({label:"Note",icon:window.SentriIcons.icon("plus"),action:"note"}),false),
  "state-Selected": () => form('Record piglet',UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": "a"})+UI.optionalRow({label:"Note",icon:window.SentriIcons.icon("plus"),action:"note"}),true),
  "state-Disabled": () => form('Record piglet',UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": "", "disabled": true, "reason": "Unavailable offline. Reconnect to select."})+UI.optionalRow({label:"Note",icon:window.SentriIcons.icon("plus"),action:"note"}),false),
  "state-Loading": () => form('Record piglet',UI.choiceEmpty("Loading options\u2026")+UI.optionalRow({label:"Note",icon:window.SentriIcons.icon("plus"),action:"note"}),false),
  "state-Empty": () => form('Record piglet',UI.choiceEmpty("No options available.")+UI.optionalRow({label:"Note",icon:window.SentriIcons.icon("plus"),action:"note"}),false),
  "state-Long-label": () => form('Record piglet',UI.choiceRadios({"label": "\u4ed4\u732a\u662f\u5426\u5df2\u7ecf\u5b8c\u6210\u5f53\u5929\u6240\u9700\u7684\u5904\u7406", "layout": "inline", "options": [{"value": "a", "label": "\u5c1a\u672a\u5904\u7406"}, {"value": "b", "label": "\u5df2\u7ecf\u5904\u7406"}], "selected": ""})+UI.optionalRow({label:"Note",icon:window.SentriIcons.icon("plus"),action:"note"}),false)
};
document.querySelectorAll('[data-state]').forEach(function (s) { if (RENDER[s.id]) s.innerHTML = RENDER[s.id](); });
</script></body></html>
