<!doctype html><meta charset="utf-8">
<section data-state="Default" data-bleed><h3>Default</h3><div id="state-Default"></div>

</section>
<section data-state="Pressed" data-bleed><h3>Pressed</h3><div id="state-Pressed"></div>

</section>
<section data-state="Selected" data-bleed><h3>Selected</h3><div id="state-Selected"></div>

</section>
<section data-state="Disabled" data-bleed><h3>Disabled</h3><div id="state-Disabled"></div>

</section>
<section data-state="Loading" data-bleed><h3>Loading</h3><div id="state-Loading"></div>

</section>
<section data-state="Empty" data-bleed><h3>Empty</h3><div id="state-Empty"></div>

</section>
<section data-state="Longest label · 中文" data-bleed><h3>Longest label · 中文</h3><div id="state-Long-label"></div>

</section>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "state-Default": () => UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": "", "className": "is-default"}) + UI.optionalRow({"label": "Sex", "open": true, "inline": UI.choiceRadios({"label": "Sex", "labelHidden": true, "layout": "inline", "options": [{"value": "a", "label": "Female"}, {"value": "b", "label": "Male"}], "selected": ""})}),
  "state-Pressed": () => UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": "", "pressed":true}),
  "state-Selected": () => UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": "a", "className": "is-selected"}),
  "state-Disabled": () => UI.choiceRadios({"label": "Outcome", "layout": "inline", "options": [{"value": "a", "label": "Kept"}, {"value": "b", "label": "Sold"}], "selected": "", "disabled":true,"reason":"Unavailable offline. Reconnect to select."}),
  "state-Loading": () => UI.choiceEmpty("Loading options\u2026"),
  "state-Empty": () => UI.choiceEmpty("No options available."),
  "state-Long-label": () => UI.choiceRadios({"label":"今天的处理", "layout":"inline", "options":[{"value":"a","label":"尚未处理"},{"value":"b","label":"已经处理"}]})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
