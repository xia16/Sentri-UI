<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChoiceList · multi</title><style>
.ph{position:relative;width:390px;max-width:100%;height:720px;margin:0 auto;overflow:hidden;background:var(--app-background);border:1px solid var(--line);border-radius:var(--radius-device,28px);font-family:var(--font-sans);color:var(--ink)}
.ph-page{padding:0 var(--space-gutter)}
.ph-bar{display:flex;align-items:center;height:var(--statusbar-height);padding:0 var(--space-6);font:600 var(--font-size-13) var(--font-sans)}
.ph-form{display:flex;flex-direction:column;gap:var(--space-16)}
</style></head><body>
<div data-state="Default" id="state-Default"></div>
<div data-state="Pressed" id="state-Pressed"></div>
<div data-state="Selected" id="state-Selected"></div>
<div data-state="Disabled" id="state-Disabled"></div>
<div data-state="Loading" id="state-Loading"></div>
<div data-state="Empty" id="state-Empty"></div>
<div data-state="Long-label" id="state-Long-label"></div>
<script>
var UI = window.SentriUI;
/* The real container: a 390px phone; a picker or a form is a drawer over the pig's page (never a drawer on a drawer). */
function page(){return '<div class="ph-page"><div class="ph-bar" aria-hidden="true">9:41</div>'+UI.heading({title:'000267',kind:'page',description:'C1 \u00b7 Gestation \u00b7 42 days'})+UI.panel(UI.row({title:'Thin',description:'Day 12 \u00b7 monitor'}),{className:'st-row-group'})+'</div>';}
function phone(over){return '<div class="ph" data-st-context="page">'+page()+over+'</div>';}
function form(title,fields,ready){return phone(UI.sheet({title:title,subtitle:'000267 \u00b7 C1',size:'medium',body:'<div class="ph-form">'+fields+'</div>',footer:UI.sheetFooter({back:{action:'back'},primary:{label:'Save',action:'save',waiting:!ready}})}));}
function picker(o){var h=o.head||{title:o.title,up:null};return phone(UI.sheet({title:h.title,up:h.up,size:'long',sizing:h.rows?'hold':'content',holdRows:h.rows||0,body:o.html||UI.pickerBody(o.body),footer:o.footer||UI.pickerFooter(o.foot||{})}));}

var RENDER = {
  "state-Default": () => phone(UI.sheet({title:"Respiratory diseases",up:{"label": "Diseases", "action": "up", "value": "1"},size:'long',body:UI.choiceGroup([UI.choiceRow({"label": "Porcine reproductive and respiratory syndrome", "mode": "multi", "value": "PRRS", "action": "choose", "selected": false}),UI.choiceRow({"label": "Swine influenza", "mode": "multi", "value": "flu", "action": "choose", "selected": false}),UI.choiceRow({"label": "Mycoplasma pneumonia", "mode": "multi", "value": "myco", "action": "choose", "selected": false}),UI.choiceRow({"label": "Actinobacillus pleuropneumonia", "mode": "multi", "value": "app", "action": "choose", "selected": false})]),footer:UI.pickerFooter({multi:true,selected:[]})})),
  "state-Pressed": () => phone(UI.sheet({title:"Respiratory diseases",up:{"label": "Diseases", "action": "up", "value": "1"},size:'long',body:UI.choiceGroup([UI.choiceRow({"label": "Porcine reproductive and respiratory syndrome", "mode": "multi", "value": "PRRS", "action": "choose", "selected": false}),UI.choiceRow({"label": "Swine influenza", "mode": "multi", "value": "flu", "action": "choose", "selected": false, "pressed": true}),UI.choiceRow({"label": "Mycoplasma pneumonia", "mode": "multi", "value": "myco", "action": "choose", "selected": false}),UI.choiceRow({"label": "Actinobacillus pleuropneumonia", "mode": "multi", "value": "app", "action": "choose", "selected": false})]),footer:UI.pickerFooter({multi:true,selected:[]})})),
  "state-Selected": () => phone(UI.sheet({title:"Respiratory diseases",up:{"label": "Diseases", "action": "up", "value": "1"},size:'long',body:UI.choiceGroup([UI.choiceRow({"label": "Porcine reproductive and respiratory syndrome", "mode": "multi", "value": "PRRS", "action": "choose", "selected": true}),UI.choiceRow({"label": "Swine influenza", "mode": "multi", "value": "flu", "action": "choose", "selected": false}),UI.choiceRow({"label": "Mycoplasma pneumonia", "mode": "multi", "value": "myco", "action": "choose", "selected": true}),UI.choiceRow({"label": "Actinobacillus pleuropneumonia", "mode": "multi", "value": "app", "action": "choose", "selected": false})]),footer:UI.pickerFooter({multi:true,selected:[0, 1]})})),
  "state-Disabled": () => phone(UI.sheet({title:"Respiratory diseases",up:{"label": "Diseases", "action": "up", "value": "1"},size:'long',body:UI.choiceGroup([UI.choiceRow({"label": "Porcine reproductive and respiratory syndrome", "mode": "multi", "value": "PRRS", "action": "choose", "selected": false}),UI.choiceRow({"label": "Swine influenza", "mode": "multi", "value": "flu", "action": "choose", "selected": false}),UI.choiceRow({"label": "Mycoplasma pneumonia", "mode": "multi", "value": "myco", "action": "choose", "selected": false}),UI.choiceRow({"label": "Actinobacillus pleuropneumonia", "mode": "multi", "value": "app", "action": "choose", "selected": false, "disabled": true, "reason": "Unavailable offline. Reconnect to select."})]),footer:UI.pickerFooter({multi:true,selected:[]})})),
  "state-Loading": () => phone(UI.sheet({title:"Respiratory diseases",up:{"label": "Diseases", "action": "up", "value": "1"},size:'long',body:UI.choiceEmpty("Loading options\u2026"),footer:UI.pickerFooter({multi:true,selected:[]})})),
  "state-Empty": () => phone(UI.sheet({title:"Respiratory diseases",up:{"label": "Diseases", "action": "up", "value": "1"},size:'long',body:UI.choiceEmpty("No options available."),footer:UI.pickerFooter({multi:true,selected:[]})})),
  "state-Long-label": () => phone(UI.sheet({title:"\u547c\u5438\u7cfb\u7edf\u75be\u75c5",up:{"label": "\u75be\u75c5", "action": "up", "value": "1"},size:'long',body:UI.choiceGroup([UI.choiceRow({"label": "\u732a\u7e41\u6b96\u4e0e\u547c\u5438\u7efc\u5408\u5f81\uff08\u84dd\u8033\u75c5\uff09\u4f34\u7ee7\u53d1\u7ec6\u83cc\u611f\u67d3", "mode": "multi", "value": "a", "action": "choose", "selected": true}),UI.choiceRow({"label": "\u732a\u6d41\u884c\u6027\u611f\u5192", "mode": "multi", "value": "b", "action": "choose", "selected": false}),UI.choiceRow({"label": "\u732a\u652f\u539f\u4f53\u80ba\u708e\uff08\u6c14\u5598\u75c5\uff09", "mode": "multi", "value": "c", "action": "choose", "selected": false})]),footer:UI.pickerFooter({multi:true,selected:[0]})}))
};
document.querySelectorAll('[data-state]').forEach(function (s) { if (RENDER[s.id]) s.innerHTML = RENDER[s.id](); });
</script></body></html>
