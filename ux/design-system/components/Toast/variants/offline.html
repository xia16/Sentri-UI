<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
/* The real container: the bottom of the walk list, two rows of pigs, the toast over the second as after a save, the dock under it. */
.ph{position:relative;height:262px;overflow:hidden;background:var(--app-background);border:1px solid var(--line);border-radius:0 0 var(--radius-device,28px) var(--radius-device,28px)}
.ph-list{margin:16px var(--space-gutter) 0;border-radius:var(--radius-panel);background:var(--paper,#fff);border:1px solid var(--line);overflow:hidden}
.ph-row{display:flex;flex-direction:column;justify-content:center;gap:4px;height:68px;padding:0 16px;box-sizing:border-box}
.ph-row+.ph-row{border-top:1px solid var(--line)}
.ph-row b{font:600 16px/1.2 var(--font-mono,ui-monospace,monospace);color:var(--ink)}
.ph-row i{font:400 13px/1.2 var(--font-sans);font-style:normal;color:var(--muted)}
.ph-dock{position:absolute;left:0;right:0;bottom:0;height:94px;display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:start;padding:14px var(--space-gutter) 0;box-sizing:border-box;border-top:1px solid var(--line);background:var(--app-background)}
.ph-dock span{height:56px;border-radius:16px;border:1px solid var(--line);background:var(--paper,#fff)}
</style></head><body>
<section data-state="Default · one pig" id="offline-0"></section>
<section data-state="Several pigs" id="offline-1"></section>
<section data-state="Long line wraps" id="offline-2"></section>
<section data-state="Chinese" id="offline-3"></section>
<section data-state="Chinese · several pigs" id="offline-4"></section>
<script>
const page='<div class="ph"><div class="ph-list"><div class="ph-row"><b>000254</b><i>Gestation · 40d</i></div><div class="ph-row"><b>000281</b><i>Gestation · 46d</i></div></div><div class="ph-dock"><span></span><span></span><span></span></div>';
const put=(id,html)=>document.querySelectorAll('[data-state]').forEach(el=>{if(el.id===id)el.innerHTML=page+html+'</div>'});
put('offline-0',SentriUI.toast('Saved on this phone',{detail:'Uploads when connected · 000267',tone:'offline'}));
put('offline-1',SentriUI.toast('Saved on this phone',{detail:'Uploads when connected · 12 pigs',tone:'offline'}));
put('offline-2',SentriUI.toast('Saved on this phone',{detail:'Uploads when connected · 000267, 000281 and 10 more pigs',tone:'offline'}));
put('offline-3',SentriUI.toast('已保存在本机',{detail:'联网后自动上传 · 000267',tone:'offline'}));
put('offline-4',SentriUI.toast('已保存在本机',{detail:'联网后自动上传 · 12 头猪',tone:'offline'}));
</script>
</body></html>
