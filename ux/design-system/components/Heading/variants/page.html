<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heading: page</title>
</head>
<body>
<!-- The title of a screen or sheet: title and one muted description line, nothing else. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Default" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Farrowing room 3', kind: 'page', level: 2 }));</script></div>
<div data-state="With description" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Farrowing room 3', kind: 'page', level: 2, description: '12 sows · 4 farrowed today' }));</script></div>
<div data-state="In a drawer" data-st-context="drawer" style="background:var(--paper);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Record a death', kind: 'page', level: 2, description: 'A02 · Sow 000245 · 12 alive' }));</script></div>
<div data-state="Long title wraps" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Farrowing room 3 · Unit 7 · North wing', kind: 'page', level: 2, description: 'Unit 7 · 12 sows' }));</script></div>
<div data-state="Chinese" data-st-context="page" style="background:var(--app-background);padding:var(--space-16);font-family:var(--font-sans);color:var(--ink)"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: '分娩舍 3 号', kind: 'page', level: 2, description: '12 头母猪 · 今天已产 4 头' }));</script></div>
</body>
</html>
