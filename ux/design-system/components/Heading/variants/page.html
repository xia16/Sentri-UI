<!-- The title of a screen or a sheet: the type alone, as the two headers draw it (.st-page-title in the page header, .sheet-title in the sheet header). Its place, Back, the corners and the header line belong to Header (../../Header/README.md). One line at 360 between the corners, about 20 English or 10 Chinese characters; copy is written to fit, never wrapped. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Page title"><h2 class="st-page-title">Farrowing room 3</h2></div>
<div data-state="Sheet title"><h2 class="sheet-title">Record dead</h2></div>
<div data-state="Longest title that fits at 360"><h2 class="sheet-title">Correct piglet count</h2></div>
<div data-state="Chinese"><h2 class="st-page-title">分娩舍 3 号</h2><h2 class="sheet-title" style="margin-top:var(--space-16)">记录死亡</h2></div>
