<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heading: section</title>
</head>
<body>
<!-- The title of one block, above its panel. The only kind with an icon, meta and an action. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Default" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Litter summary' }));</script></div>
<div data-state="With icon" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Litter summary', icon: SentriIcons.icon('record') }));</script></div>
<div data-state="With description" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Feeding', icon: SentriIcons.icon('feed'), description: 'Last changed 2 days ago · G.H' }));</script></div>
<div data-state="With meta" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Current tasks', icon: SentriIcons.icon('note'), meta: '3 tasks' }));</script></div>
<div data-state="With action" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Litter summary', icon: SentriIcons.icon('record'), action: { label: 'View log', action: 'history', ariaLabel: 'Open farrowing log' } }));</script></div>
<div data-state="Action pressed" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Litter summary', icon: SentriIcons.icon('record'), action: { label: 'View log', action: 'history' } }).replace('<button', '<button data-preview="pressed"'));</script></div>
<div data-state="Action focused" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Litter summary', icon: SentriIcons.icon('record'), action: { label: 'View log', action: 'history' } }).replace('<button', '<button data-preview="focus"'));</script></div>
<div data-state="Long title beside meta" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: 'Whole-task progress across both farrowing houses', icon: SentriIcons.icon('chart'), meta: '48 sows' }));</script></div>
<div data-state="Chinese" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.heading({ title: '窝摘要', icon: SentriIcons.icon('record'), description: '上次更改 2 天前 · G.H', action: { label: '查看记录', action: 'history' } }));</script></div>
</body>
</html>
