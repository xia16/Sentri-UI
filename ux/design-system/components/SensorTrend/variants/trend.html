<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SensorTrend: trend</title>
</head>
<body>
<!-- One sensor's reading, last reading time, chart, low and high, and the readings behind a disclosure. Each top-level element is one state; the atlas draws one cell per element. -->
<div data-state="Today" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.sensorTrend({name:'Temperature',value:'22.4',unit:'°C',updated:'09:40',period:{options:[['today','Today'],['week','7 days']],active:'today',action:'sensor-range',ariaLabel:'Chart period'},rows:[{time:'00:00',value:21.9},{time:'02:00',value:22.1},{time:'04:00',value:22.0},{time:'06:00',value:22.6},{time:'07:00',value:22.8},{time:'08:00',value:22.5},{time:'09:00',value:22.3},{time:'09:40',value:22.4}],pad:0.5,decimals:1,chartLabel:'Temperature sample trend. Minimum {min}, maximum {max} °C.',note:'Sample readings · connected'}));</script></div>
<div data-state="7 days" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.sensorTrend({name:'Temperature',value:'22.4',unit:'°C',updated:'09:40',period:{options:[['today','Today'],['week','7 days']],active:'week',action:'sensor-range',ariaLabel:'Chart period'},rows:[{time:'6d ago',value:21.8},{time:'5d ago',value:22.2},{time:'4d ago',value:22.8},{time:'3d ago',value:22.5},{time:'2d ago',value:22.1},{time:'Yesterday',value:22.6},{time:'Today',value:22.4}],pad:0.5,decimals:1,chartLabel:'Temperature sample trend. Minimum {min}, maximum {max} °C.',note:'Sample readings · connected'}));</script></div>
<div data-state="Offline" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.sensorTrend({name:'Temperature',value:'22.4',unit:'°C',updated:'09:40',period:{options:[['today','Today'],['week','7 days']],active:'today',action:'sensor-range',ariaLabel:'Chart period'},rows:[{time:'00:00',value:21.9},{time:'02:00',value:22.1},{time:'04:00',value:22.0},{time:'06:00',value:22.6},{time:'07:00',value:22.8},{time:'08:00',value:22.5},{time:'09:00',value:22.3},{time:'09:40',value:22.4}],pad:0.5,decimals:1,chartLabel:'Temperature sample trend. Minimum {min}, maximum {max} °C.',note:'Sample readings · offline, showing last available values'}));</script></div>
<div data-state="Ammonia (whole numbers)" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.sensorTrend({name:'Ammonia',value:'8',unit:'ppm NH₃',updated:'09:40',period:{options:[['today','Today'],['week','7 days']],active:'today',action:'sensor-range',ariaLabel:'Chart period'},rows:[{time:'00:00',value:7},{time:'04:00',value:8},{time:'08:00',value:9},{time:'09:40',value:8}],pad:1,decimals:0,chartLabel:'Ammonia sample trend. Minimum {min}, maximum {max} ppm NH₃.',note:'Sample readings · connected'}));</script></div>
<div data-state="No history" data-st-context="page"><script>document.currentScript.parentElement.insertAdjacentHTML('beforeend', SentriUI.sensorTrend({name:'Temperature',value:'22.4',unit:'°C',updated:'09:40',period:{options:[['today','Today'],['week','7 days']],active:'today',action:'sensor-range',ariaLabel:'Chart period'},rows:[],pad:0.5,decimals:1,chartLabel:'Temperature sample trend. Minimum {min}, maximum {max} °C.',note:''}));</script></div>
</body>
</html>
