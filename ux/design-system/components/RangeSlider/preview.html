<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../../system/sentri-icons.js"></script><script src="../bundle.js"></script><style>[data-example]{position:relative;min-height:90vh;isolation:isolate;padding:var(--space-16)}[data-example]>.sheet{position:relative;inset:auto;width:100%;max-height:none}</style><body><article data-example data-state="Default"></article><article data-example data-state="Pressed"></article><article data-example data-state="Focus"></article><article data-example data-state="At limits"></article><article data-example data-state="Disabled"></article><article data-example data-state="Error"></article><article data-example data-state="Long / Chinese"></article><script>document.querySelectorAll('[data-state]').forEach(el=>{const state=el.dataset.state,zh=state==='Long / Chinese';el.innerHTML=SentriUI.rangeSlider({min:-3,max:7,value:state==='At limits'?[-3,7]:[0,5],label:zh?'预计分娩日期范围（根据母猪档案中的预产期筛选）':'Due in',unit:zh?'天':'days',state,disabled:state==='Disabled',reason:state==='Disabled'?'Due dates unavailable': '',error:state==='Error'?'Due dates unavailable · refresh the list and try again':''});});</script></body></html>
