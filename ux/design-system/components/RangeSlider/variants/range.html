<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[data-example]{position:relative;min-height:90vh;isolation:isolate;padding:var(--space-16)}[data-example]>.sheet{position:relative;inset:auto;width:100%;max-height:none}</style><body><article data-example data-state="Default"></article><article data-example data-state="Pressed"></article><article data-example data-state="Focus"></article><article data-example data-state="At limits"></article><article data-example data-state="Disabled"></article><article data-example data-state="Error"></article><article data-example data-state="Long / Chinese"></article><script>const dueEn=n=>n===-7?'7+ days ago':n===7?'In 7+ days':n===0?'Today':n===-1?'Yesterday':n===1?'Tomorrow':n<0?(-n)+' days ago':'In '+n+' days';
const dueZh=n=>n===-7?'7天以上前':n===7?'7天及以后':n===0?'今天':n===-1?'昨天':n===1?'明天':n<0?(-n)+'天前':n+'天后';
document.querySelectorAll('[data-state]').forEach(el=>{const state=el.dataset.state,zh=state==='Long / Chinese';
el.innerHTML=SentriUI.rangeSlider({min:-7,max:7,value:state==='At limits'?[-7,7]:[-1,3],label:zh?'预计分娩日期（根据母猪档案中的预产期筛选）':'Due',key:'due',format:zh?dueZh:dueEn,state,disabled:state==='Disabled',reason:state==='Disabled'?'Due dates unavailable':'',error:state==='Error'?'Due dates unavailable · refresh the list and try again':''});});</script></body></html>
