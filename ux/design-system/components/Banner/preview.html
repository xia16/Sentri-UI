<!-- @dsCard group="Fields" height=640 subtitle="All variants and states" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"></head><body><main id="examples"></main><script>
(async()=>{for(const id of ["danger", "correction", "notice"]){const response=await fetch("variants/"+id+".html"); const doc=new DOMParser().parseFromString(await response.text(),"text/html");const box=document.createElement("div");box.innerHTML=doc.body.innerHTML;document.getElementById("examples").append(box);for(const script of box.querySelectorAll("script")){new Function(script.textContent)();script.remove();}}})();
</script></body></html>
