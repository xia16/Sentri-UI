<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<section data-state="Default" id="correction-0"></section>
<section data-state="Pressed" id="correction-1"></section>
<section data-state="Disabled" id="correction-3"></section>
<section data-state="Cleared" id="correction-4"></section>
<section data-state="Long label / Chinese" id="correction-5"></section>
<section data-state="Changed" id="correction-changed"></section>
<script>
const put=(id,html)=>document.querySelectorAll('[data-state]').forEach(el=>{if(el.id===id)el.innerHTML=html});
put("correction-0",SentriUI.banner({"tone": "correction", "headline": "Save your correction first", "consequence": "Review the changed figures before recording", "state": "Default", "id": "correction-0-banner", "door": {"action": "review", "label": "Review correction"}}));
put("correction-1",SentriUI.banner({"tone": "correction", "headline": "Save your correction first", "consequence": "Review the changed figures before recording", "state": "Pressed", "id": "correction-1-banner", "door": {"action": "review", "label": "Review correction"}}));
put("correction-3",SentriUI.banner({"tone": "correction", "headline": "Save your correction first", "consequence": "Review the changed figures before recording", "state": "Disabled", "id": "correction-3-banner", "door": {"action": "review", "label": "Review correction"}, "reason": "Waiting for the current review to finish"}));
put("correction-4",SentriUI.banner({"tone": "correction", "headline": "Correcting a past record", "consequence": "Undo is available for 5 seconds", "state": "Cleared", "id": "correction-4-banner", "door": null, "summary": "Cleared", "actions": [{"label": "Undo", "action": "undo-clear"}]}));
put("correction-5",SentriUI.banner({"tone": "correction", "headline": "请先保存您对之前分娩记录所作的更正然后检查所有修改内容", "consequence": "先检查更正记录 · 再重新记录", "state": "Long label / Chinese", "id": "correction-5-banner", "door": {"action": "review", "label": "Review correction"}}));
put('correction-changed',SentriUI.banner({tone:'correction',headline:'Correcting a past record',consequence:'Logged as G. Hansen',icon:'edit',summary:['Crushed 3 → 2','Alive 8 → 9'],actions:[{label:'Clear',action:'clear'}]}));
SentriUI.liveFill(document.body,{delay:0});
</script>
</body></html>
