<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
.tiles{display:grid;grid-template-columns:repeat(2,169px);gap:10px}
</style></head><body>
<section data-state="Due now"></section>
<section data-state="Overdue part"></section>
<section data-state="Nothing due now"></section>
<section data-state="Past its plan"></section>
<section data-state="All recorded"></section>
<section data-state="Last day"></section>
<section data-state="Pressed"></section>
<section data-state="Long label / Chinese"></section>
<script>
const T=SentriUI.taskTile;
const S={
  'Due now':[T({id:'r30',title:'Return heat',sub:'Batch 30',todo:{value:10,label:'to watch'},days:{day:3,total:7}}),T({id:'h34',title:'Heat check',sub:'Batch 34',todo:{value:20,label:'due now'},days:{day:2,total:3}})],
  'Overdue part':[T({id:'p31',title:'Pregnancy check',sub:'Batch 31',todo:{value:5,label:'now',also:{text:'2 overdue',tone:'act'}},days:{day:1,total:3}})],
  'Nothing due now':[T({id:'p32',title:'Pregnancy check',sub:'Batch 32',todo:{next:{value:8,label:'tomorrow'}},days:{day:1,total:2}}),T({id:'h35',title:'Heat check',sub:'Batch 35',todo:{none:'None now'},days:{day:1,total:3}})],
  'Past its plan':[T({id:'v21',title:'Vaccination',sub:'PRRS · Units 7, 8',todo:{value:6,label:'overdue',tone:'act'},days:{day:3,total:3,over:1},late:true})],
  'All recorded':[T({id:'p28',title:'Pregnancy check',sub:'Batch 28',todo:{done:'Ready to close'},days:{day:3,total:3}})],
  'Last day':[T({id:'w25',title:'Weaning',sub:'Batch 25',todo:{value:4,label:'pens ready'},days:{day:2,total:2,text:'Day 2 of 2 · last day'}})],
  'Pressed':[T({id:'f28',title:'Farrowing',sub:'Batch 28',todo:{value:2,label:'farrowing'},days:{day:2,total:7}}).replace('class="st-tile"','class="st-tile" style="background:var(--press)"')],
  'Long label / Chinese':[T({id:'pp27',title:'Processing',sub:'Batch 127',todo:{value:128,label:'litters due'},days:{day:3,total:14}}),T({id:'zh31',title:'妊娠检查',sub:'批次 31',todo:{value:5,label:'待检',also:{text:'2 头逾期',tone:'act'}},days:{day:1,total:3,text:'第 1 天，共 3 天'}})]
};
document.querySelectorAll('[data-state]').forEach(el=>{const t=S[el.dataset.state];if(t)el.innerHTML='<div class="tiles">'+t.join('')+'</div>';});
</script>
</body></html>
