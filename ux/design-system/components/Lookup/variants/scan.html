<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lookup · scan</title><style>
.ph{position:relative;height:var(--phone-height);max-width:var(--phone-width);margin:0 auto var(--space-16);overflow:hidden;background:var(--app-background);font-family:var(--font-sans);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .statusbar{display:flex;justify-content:space-between;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
</style></head><body>
<div class="ph" data-state="Nothing scanned · listening" data-demo="empty"></div>
<div class="ph" data-state="Reader not connected" data-demo="off"></div>
<div class="ph" data-state="Scanned · two units (Farrowing's sow rows)" data-demo="sows"></div>
<div class="ph" data-state="Scanned · condition tags (Inspection's roster rows)" data-demo="pigs"></div>
<div class="ph" data-state="A pig just scanned · arrival tint" data-demo="new"></div>
<div class="ph" data-state="Ticked · N selected and Actions" data-demo="ticked"></div>
<div class="ph" data-state="Stopped · list kept" data-demo="stopped"></div>
<div class="ph" data-state="Long tag · 12 digits" data-demo="long"></div>
<div class="ph" data-state="Chinese · ticked" data-demo="zh"></div>
<script>
// Calls copied from the live screens: Farrowing's Scan ear tags (sow rows), Inspection's (the walk's roster rows), Home's.
const UI=window.SentriUI;
const bar='<div class="statusbar" aria-hidden="true"><span>9:41</span></div>';
const sow=(code,context,figure,word,level,checked=false)=>UI.rowSelectDoor({code,description:context,right:{kind:'state',figure,word,level},checked,action:'pick',value:code,openAction:'open',openValue:code,attrs:{'data-scan-tag':code},inputAttrs:{'aria-label':'Select '+code}});
const pig=(code,stage,tags,checked=false)=>UI.rowSelectDoor({code,description:stage,contextWidth:'112px',right:{kind:'tags',tags},checked,action:'',value:code,openAction:'pig',openValue:code,attrs:{'data-scan-tag':code},inputAttrs:{'aria-label':'Select pig '+code}});
const SOWS=c=>[{title:'Unit 7',rows:[sow('000431','Pen B4 · Parity 6','3 days','Overdue','act',c),sow('000418','Pen B1 · 1h ago','9 alive · 5 dead','Farrowing','live',c)]},{title:'Unit 6',rows:[sow('004318','Pen A2 · Parity 4','Tomorrow','Due','soon')]}];
const PIGS=(t=[])=>[{title:'Unit 7',rows:[pig('000306','Gestation',[{name:'Fever',level:'act'},{name:'Appetite',level:'watch'}],t.includes('000306')),pig('000267','Gestation · 42d',[{name:'Thin',level:'watch'}],t.includes('000267')),pig('000254','Gestation · 40d',[],t.includes('000254'))]}];
const EN={selected:n=>n+' '+(n===1?'pig':'pigs')+' selected',empty:{text:'Each pig you scan appears here.',stoppedText:'Resume scanning to add pigs.'}};
const page=(o)=>UI.scanPage(Object.assign({title:'Scan ear tags',back:{action:'back'},selected:EN.selected,actions:{action:'actions',label:'Actions'},toggle:{action:'toggle'},empty:EN.empty,bar},o));
const R={
 empty:()=>page({groups:[]}),
 off:()=>page({connected:false,groups:[]}),
 sows:()=>page({groups:SOWS(false),selected:n=>n+' '+(n===1?'sow':'sows')+' selected'}),
 pigs:()=>page({groups:PIGS()}),
 new:()=>page({groups:PIGS()}),
 ticked:()=>page({groups:PIGS(['000267','000254']),picked:2}),
 stopped:()=>page({listening:false,groups:PIGS()}),
 long:()=>page({groups:[{title:'Unit 7',rows:[pig('276000144710','Gestation · 42d',[{name:'Lame',level:'watch'},{name:'Arthritis',level:'ongoing'}]),pig('276000144719','Gestation',[])]}]}),
 zh:()=>UI.scanPage({title:'扫描耳标',back:{action:'back',label:'返回'},groups:[{title:'7单元',rows:PIGS(['000267','000254'])[0].rows}],picked:2,selected:n=>'已选 '+n+' 头',actions:{action:'actions',label:'操作'},toggle:{action:'toggle',stop:'停止扫描',resume:'继续扫描'},bar})
};
document.querySelectorAll('[data-state]').forEach(el=>{
 el.innerHTML=R[el.dataset.demo]();
 if(el.dataset.demo==='new')UI.scanArrive(el,{fresh:{'000306':Infinity},last:''});
});
</script></body></html>
