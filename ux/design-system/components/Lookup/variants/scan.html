<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lookup · scan</title><style>
.ph{position:relative;height:var(--phone-height);max-width:var(--phone-width);margin:0 auto var(--space-16);overflow:hidden;background:var(--app-background);font-family:var(--font-sans);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .statusbar{display:flex;justify-content:space-between;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
</style></head><body>
<div class="ph" data-state="Nothing scanned · listening" data-demo="empty"></div>
<div class="ph" data-state="Reader not connected" data-demo="off"></div>
<div class="ph" data-state="Ticks · each read ticked (a multi-select place)" data-demo="ticks"></div>
<div class="ph" data-state="Its own actions · a multi-select task" data-demo="direct"></div>
<div class="ph" data-state="Opens · a single-action task lists nothing" data-demo="opens"></div>
<div class="ph" data-state="Stopped · list kept" data-demo="stopped"></div>
<div class="ph" data-state="Chinese · scanned" data-demo="zh"></div>
<script>
// Calls copied from the live screens: Farrowing's Scan ear tags (a single-action task: each read opens her), Inspection's (the walk's
// roster rows) and Home's (multi-select: each read arrives ticked, owner 2026-10-22).
// A row's ticked and Just scanned faces are Row · select + door's own states (Row/variants/select-door.html): here every row is at rest.
const UI=window.SentriUI;
const bar='<div class="statusbar" aria-hidden="true"><span>9:41</span></div>';
const pig=(code,stage,tags,checked=false)=>UI.rowSelectDoor({code,description:stage,contextWidth:'112px',right:{kind:'tags',tags},checked,action:'',value:code,openAction:'pig',openValue:code,attrs:{'data-scan-tag':code},inputAttrs:{'aria-label':'Select pig '+code}});
// One condition per pig: how a row folds several tags into "+N" is Row's (Row/variants/animal.html). The walk's own words, in English or in the registry's Chinese (Gestation 妊娠, Fever 发热, Appetite 食欲差, Thin 偏瘦).
const W={en:{unit:'Unit 7',stage:'Gestation',fever:'Fever',appetite:'Appetite',thin:'Thin'},zh:{unit:'7单元',stage:'妊娠',fever:'发热',appetite:'食欲差',thin:'偏瘦'}};
const PIGS=(t=[],lang='en')=>{const w=W[lang];return [{title:w.unit,rows:[pig('000306',w.stage,[{name:w.fever,level:'act'}],t.includes('000306')),pig('000267',w.stage+' · 42d',[{name:w.thin,level:'watch'}],t.includes('000267')),pig('000254',w.stage+' · 40d',[{name:w.appetite,level:'watch'}],t.includes('000254'))]}];};
const EN={selected:n=>n+' '+(n===1?'pig':'pigs')+' selected',empty:{text:'Each pig you scan is ticked here.',stoppedText:'Resume scanning to add pigs.'}};
const page=(o)=>UI.scanPage(Object.assign({title:'Scan ear tags',back:{action:'back'},selected:EN.selected,actions:{action:'actions',label:'Actions'},toggle:{action:'toggle'},empty:EN.empty,bar},o));
const R={
 empty:()=>page({groups:[]}),
 off:()=>page({connected:false,groups:[]}),
 ticks:()=>page({groups:PIGS(['000306','000267','000254']),picked:3}),
 // A multi-select task with two actions of its own shows them directly (the heat check, not designed yet: the shape only).
 direct:()=>page({groups:PIGS(['000306','000267']),picked:2,actions:[{label:'Signs',action:'signs'},{label:'Mark 2 in heat',action:'heat'}]}),
 opens:()=>page({read:'open',groups:[],empty:{text:'Each sow opens as soon as her tag is read.',stoppedText:'Resume scanning to open the next sow.'}}),
 stopped:()=>page({listening:false,groups:PIGS()}),
 zh:()=>UI.scanPage({title:'扫描耳标',back:{action:'back',label:'返回'},groups:PIGS([],'zh'),toggle:{action:'toggle',stop:'停止扫描',resume:'继续扫描'},bar})
};
document.querySelectorAll('[data-state]').forEach(el=>{
 el.innerHTML=R[el.dataset.demo]();
 UI.rowFitTags(el);   // as the walk does after it renders: tags that do not fit fold into "+N"
});
</script></body></html>
