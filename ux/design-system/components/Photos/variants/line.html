<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<section data-state="Default" id="line-0"></section>
<section data-state="One photo" id="line-2"></section>
<section data-state="Several photos" id="line-3"></section>
<section data-state="Adding" id="line-4"></section>
<section data-state="Uploading" id="line-5"></section>
<section data-state="Denied" id="line-6"></section>
<section data-state="Too large" id="line-7"></section>
<section data-state="Pressed" id="line-8"></section>
<section data-state="Disabled" id="line-10"></section>
<section data-state="Full" id="line-11"></section>
<section data-state="Cancelled" id="line-12"></section>
<section data-state="Longest label · 中文" id="line-13"></section>
<script>
const put=(id,html)=>document.querySelectorAll('[data-state]').forEach(el=>{if(el.id===id)el.innerHTML=html});
put("line-0",SentriUI.photos({"id": "line-0-photos", "key": "line-0"}));
put("line-2",SentriUI.photos({"id": "line-2-photos", "key": "line-2", "items": [{"id": "0", "pending": false}]}));
put("line-3",SentriUI.photos({"id": "line-3-photos", "key": "line-3", "items": [{"id": "0", "pending": false}, {"id": "1", "pending": false}, {"id": "2", "pending": false}]}));
put("line-4",SentriUI.photos({"id": "line-4-photos", "key": "line-4", "adding": true}));
put("line-5",SentriUI.photos({"id": "line-5-photos", "key": "line-5", "items": [{"id": "0", "pending": true}, {"id": "1", "pending": false}, {"id": "2", "pending": false}]}));
put("line-6",SentriUI.photos({"id": "line-6-photos", "key": "line-6", "error": "denied"}));
put("line-7",SentriUI.photos({"id": "line-7-photos", "key": "line-7", "error": "too-large"}));
put("line-8",SentriUI.photos({"id": "line-8-photos", "key": "line-8", "preview": "pressed"}));
put("line-10",SentriUI.photos({"id": "line-10-photos", "key": "line-10", "active": false, "disabledReason": "Choose a cause first · photos ride that record"}));
put("line-11",SentriUI.photos({"id": "line-11-photos", "key": "line-11", "items": [{"id": "0", "pending": false}, {"id": "1", "pending": false}, {"id": "2", "pending": false}, {"id": "3", "pending": false}, {"id": "4", "pending": false}, {"id": "5", "pending": false}, {"id": "6", "pending": false}, {"id": "7", "pending": false}, {"id": "8", "pending": false}, {"id": "9", "pending": false}, {"id": "10", "pending": false}, {"id": "11", "pending": false}]}));
put("line-12",SentriUI.photos({"id": "line-12-photos", "key": "line-12", "items": [{"id": "0", "pending": false}, {"id": "1", "pending": false}], "error": "cancelled"}));
put("line-13",SentriUI.photos({"id": "line-13-photos", "key": "line-13", "label": "本次分娩现场照片", "optional": "选填", "hint": "照片保存在此设备上 · 无网络连接 · 等待上传"}));
SentriUI.liveFill(document.body,{delay:0});
</script>
</body></html>
