<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<section data-state="Default" id="line-0"></section>
<section data-state="Empty" id="line-1"></section>

<script>
if(document.getElementById("line-0"))document.getElementById("line-0").innerHTML=SentriUI.photos({"id": "line-0-photos", "key": "line-0"});

if(document.getElementById("line-3"))document.getElementById("line-3").innerHTML=SentriUI.photos({"id": "line-3-photos", "key": "line-3", "items": [{"id": "0", "pending": false}, {"id": "1", "pending": false}, {"id": "2", "pending": false}]});

if(document.getElementById("line-6"))document.getElementById("line-6").innerHTML=SentriUI.photos({"id": "line-6-photos", "key": "line-6", "error": "denied"});
if(document.getElementById("line-7"))document.getElementById("line-7").innerHTML=SentriUI.photos({"id": "line-7-photos", "key": "line-7", "error": "too-large"});
if(document.getElementById("line-8"))document.getElementById("line-8").innerHTML=SentriUI.photos({"id": "line-8-photos", "key": "line-8", "preview": "pressed"});
if(document.getElementById("line-9"))document.getElementById("line-9").innerHTML=SentriUI.photos({"id": "line-9-photos", "key": "line-9", "preview": "focus"});

if(document.getElementById("line-13"))document.getElementById("line-13").innerHTML=SentriUI.photos({"id": "line-13-photos", "key": "line-13", "label": "为本次分娩事件附加现场照片以便之后检查记录", "optional": "选填", "hint": "照片保存在此设备上 · 无网络连接 · 等待上传"});
SentriUI.liveFill(document.body,{delay:0});

</body></html>
