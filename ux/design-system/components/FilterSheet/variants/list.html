<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[data-example]{position:relative;min-height:90vh;isolation:isolate;padding:var(--space-16)}[data-example]>.sheet{position:relative;inset:auto;width:100%;max-height:none}</style><body><article data-example data-state="Default" data-bleed></article><article data-example data-state="Active" data-bleed></article><article data-example data-state="Empty" data-bleed></article><article data-example data-state="Disabled" data-bleed></article><article data-example data-state="Error" data-bleed></article><article data-example data-state="Loading" data-bleed></article><article data-example data-state="Longest label · 中文" data-bleed></article><script>const dueEn=n=>n===-7?'7+ days ago':n===7?'In 7+ days':n===0?'Today':n===-1?'Yesterday':n===1?'Tomorrow':n<0?(-n)+' days ago':'In '+n+' days';
const dueZh=n=>n===-7?'7天以上前':n===7?'7天及以后':n===0?'今天':n===-1?'昨天':n===1?'明天':n<0?(-n)+'天前':n+'天后';
document.querySelectorAll('[data-state]').forEach(el=>{const state=el.dataset.state,zh=state==='Longest label · 中文',on=state==='Active';
const parity=zh?['不限','0','1','2–5','6以上']:['Any','0','1','2–5','6+'];
el.innerHTML=SentriUI.filterSheet({title:zh?'筛选当前单元的母猪列表':'Filter sows',subtitle:zh?'7号单元':'Unit 7',state,count:state==='Empty'||state==='Disabled'?0:on?5:12,noun:zh?'头母猪':'sows',emptyReason:zh?'没有符合条件的母猪':'No sows match',loading:state==='Loading',error:state==='Error'?(zh?'无法统计结果 · 请重试':'Results unavailable · try again'):'',disabled:state==='Disabled',reason:state==='Disabled'?'Syncing · filters return when it finishes':'',scrim:false,
labels:zh?{clear:'清除',back:'返回',counting:'正在统计结果…',show:(n,noun)=>'显示 '+n+' '+noun,showNone:'显示'+'母猪'}:{},
groups:[{content:SentriUI.rangeSlider({min:-7,max:7,value:on?[0,3]:[-7,7],label:zh?'预计分娩日期':'Due',key:'due',format:zh?dueZh:dueEn})},{label:zh?'胎次':'Parity',content:SentriUI.filterChips({label:zh?'胎次':'Parity',items:parity.map((v,i)=>({value:v,label:v,checked:on?i===3:i===0}))})}]});});</script></body></html>
