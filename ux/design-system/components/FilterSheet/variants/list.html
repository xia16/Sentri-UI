<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[data-example]{position:relative;min-height:90vh;isolation:isolate;padding:var(--space-16)}[data-example]>.sheet{position:relative;inset:auto;width:100%;max-height:none}</style><body><article data-example data-state="Default"></article><article data-example data-state="Pressed"></article><article data-example data-state="Active"></article><article data-example data-state="Empty"></article><article data-example data-state="Disabled"></article><article data-example data-state="Error"></article><article data-example data-state="Loading"></article><article data-example data-state="Long / Chinese"></article><script>document.querySelectorAll('[data-state]').forEach(el=>{const state=el.dataset.state,zh=state==='Long / Chinese';el.innerHTML=SentriUI.filterSheet({title:zh?'筛选当前单元的母猪列表':'Filter sows',state,count:['Empty','Disabled'].includes(state)?0:12,noun:zh?'头母猪':'sows',emptyReason:'No sows match',loading:state==='Loading',error:state==='Error'?'Results unavailable · try again':'',scrim:false,groups:[{content:SentriUI.rangeSlider({min:-3,max:7,value:state==='Active'?[0,3]:[0,5],label:zh?'预计分娩日期范围':'Due in',unit:zh?'天':'days',state})},{label:zh?'胎次':'Parity',content:SentriUI.filterChips({label:'Parity',state,items:['Any','1','2–5','6+'].map((v,i)=>({value:v,label:v,checked:state==='Active'?i===1:i===0}))})}]});});</script></body></html>
