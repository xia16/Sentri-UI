<!doctype html><html lang="en"><meta charset="utf-8"><style>body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--app-background)}[data-state]{box-sizing:border-box;max-width:100%;margin-bottom:var(--space-section)}.glyphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--back-width),1fr));gap:var(--space-8)}.glyphs span{display:flex;align-items:center;gap:var(--space-4);font-size:var(--font-size-12)}[data-st-context="drawer"]{background:var(--paper)}</style><body>
<div data-state="Default" data-bleed></div>
<div data-state="Pressed" data-bleed></div>
<div data-state="Active" data-bleed></div>
<div data-state="Empty" data-bleed></div>
<div data-state="Five categories" data-bleed></div>
<div data-state="Longest label · 中文" data-bleed></div>
<div data-state="Back pressed" data-bleed></div>
<div data-state="Scrolled" data-bleed></div>
<script>document.querySelectorAll('[data-state]').forEach(el=>{const state=el.dataset.state;
let categories=[{id:'health',label:'Health'},{id:'routine',label:'Routine'},{id:'production',label:'Production'}];
if(state==='Empty')categories=[];
if(state.includes('中文'))categories=[{id:'health',label:'健康护理记录'},{id:'routine',label:'日常工作'},{id:'production',label:'生产'}];
if(state==='Five categories'||state==='Scrolled')categories.push({id:'equipment',label:'Equipment'},{id:'records',label:'Records'});
el.innerHTML=SentriUI.categoryFooter({categories,active:state==='Active'?'routine':'health'});
if(state==='Back pressed')el.querySelector('.surface-back').dataset.preview='pressed';
if(state==='Scrolled')el.querySelector('.st-category-tabs').scrollLeft=el.querySelector('.st-category-tabs').scrollWidth;
if(state==='Pressed')el.querySelector('.st-category-tabs button').dataset.preview='pressed';});</script></body></html>
