<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task skeleton</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="/ux/design-system/components/task-skeleton.css">
<style>
/* Gallery layout only: each pair is farrowing's screen (a 390×844 capture) beside the same screen built from the parts. */
.tk-gallery { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-sans); }
.tk-gallery-head { padding: var(--space-section) var(--space-gutter) 0; max-width: 812px; margin: 0 auto; }
.tk-gallery-head h1 { margin: 0; font: 500 var(--type-page-title-size)/1.3 var(--font-sans); letter-spacing: -0.5px; }
.tk-gallery-head p { margin: 6px 0 0; font: var(--type-description-size)/1.6 var(--font-sans); color: var(--muted); }
.tk-pair { margin: var(--space-action-section) 0 0; }
.tk-pair > h2 { margin: 0 auto var(--space-heading); padding: 0 var(--space-gutter); max-width: 812px; font: 500 var(--type-section-title-size)/1.5 var(--font-sans); }
.tk-pair-grid { display: grid; gap: var(--space-section); }
.tk-pair-col > h3 { margin: 0 0 8px; padding: 0 var(--space-gutter); font: 500 var(--type-group-label-size)/1.5 var(--font-sans); color: var(--muted); }
.tk-pair-col > img { display: block; width: 100%; height: auto; }
/* Host layout of the demo's own screens: the stack gaps between the parts (farrowing's page body gap 18). */
.sheet[data-presentation="page"][data-view="foster"] .sheet-body > * + * { margin-top: 18px; }
.tk-demo-section { display: flex; flex-direction: column; gap: 10px; }
.sheet[data-presentation="page"][data-view="overview"] .sheet-body > * + * { margin-top: var(--space-section); }
.sheet[data-presentation="page"]:is([data-view="end"], [data-view="receipt"]) .sheet-body { display: flex; flex-direction: column; gap: 16px; }
.sheet[data-presentation="page"][data-view="care"] .sheet-body { display: flex; flex-direction: column; gap: var(--space-heading); }
.tk-demo-stack { display: flex; flex-direction: column; }
.tk-demo-stack > .st-segment { margin: 0 0 4px; }
.tk-demo-stack > .tk-warning { margin: 17px 0; }
.tk-demo-section > * { margin: 0; }
.sheet[data-view="count"] .sheet-body > * + * { margin-top: var(--space-heading); }
@media (min-width: 431px) {
  .tk-pair-grid { grid-template-columns: repeat(2, var(--phone-width)); justify-content: center; gap: var(--space-action-section); }
  .tk-pair-col > h3 { padding: 0; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="/ux/design-system/components/bundle.js"></script>
<script src="/ux/design-system/components/task-skeleton.js"></script>
<script>
(function () {
  'use strict';
  var K = window.SentriTask, UI = window.SentriUI;
  var q = new URLSearchParams(location.search), only = q.get('screen') || '';
  var s = function (str, text, args) { return { text: text, str: str, args: args }; };
  var n = function (v) { return s('tk.demo.n', String(v), { n: v }); };

  // ---- the room list (farrowing's "Room list" preset) ----
  function room(inert) {
    var r = function (o) { return K.row(o); };
    var groups = [
      K.group({ title: s('tk.demo.pen', 'B1', { pen: 'B1' }), meta: s('tk.demo.sows.one', '· 1 sow'), door: { action: 'pen', value: 'B1', label: s('tk.demo.pen.aria', 'Pen B1, view details', { pen: 'B1' }) },
        rows: r({ id: s('tk.demo.id', '000418', { id: '000418' }), chip: { text: 'Active', str: 'tk.demo.lens.active', tone: 'green' }, headline: s('tk.demo.alive_dead', '9 alive · 5 dead', { a: 9, d: 5 }), meta: s('tk.demo.meta.418', 'born 14 · 1h ago · G.H'), value: '000418' }) }),
      K.group({ title: s('tk.demo.pen', 'B2', { pen: 'B2' }), meta: s('tk.demo.sows.one', '· 1 sow'), door: { action: 'pen', value: 'B2', label: s('tk.demo.pen.aria', 'Pen B2, view details', { pen: 'B2' }) },
        rows: r({ id: s('tk.demo.id', '000392', { id: '000392' }), headline: s('tk.demo.due.tomorrow', 'Due tomorrow'), tone: 'forecast', meta: s('tk.demo.meta.392', 'parity 5 · 11 born last'), value: '000392' }) }),
      K.group({ title: s('tk.demo.pen', 'B3', { pen: 'B3' }), meta: s('tk.demo.sows.many', '· 2 sows', { n: 2 }), door: { action: 'pen', value: 'B3', label: s('tk.demo.pen.aria', 'Pen B3, view details', { pen: 'B3' }) },
        rows: [r({ id: s('tk.demo.id', '000406', { id: '000406' }), chip: { text: 'Done', str: 'tk.demo.lens.done' }, headline: s('tk.demo.alive_dead', '11 alive · 2 dead', { a: 11, d: 2 }), meta: s('tk.demo.meta.406', 'born 13 · final 05:58 · G.H'), trail: 'edit', value: '000406' }),
          r({ id: s('tk.demo.id', '000399', { id: '000399' }), chip: { text: 'Sow died', str: 'tk.demo.chip.died', tone: 'red' }, headline: s('tk.demo.alive_dead', '7 alive · 3 dead', { a: 7, d: 3 }), meta: s('tk.demo.meta.399', 'born 10 · yesterday · L.M'), value: '000399' })] }),
      K.group({ title: s('tk.demo.pen', 'B4', { pen: 'B4' }), meta: s('tk.demo.sows.many', '· 3 sows', { n: 3 }), door: { action: 'pen', value: 'B4', label: s('tk.demo.pen.aria', 'Pen B4, view details', { pen: 'B4' }) },
        rows: [r({ id: s('tk.demo.id', '000455', { id: '000455' }), headline: s('tk.demo.due.today', 'Due today'), meta: s('tk.demo.meta.455', 'parity 2 · 12 born last'), value: '000455' }),
          r({ id: s('tk.demo.id', '000431', { id: '000431' }), headline: [s('tk.demo.overdue', 'Overdue'), { sep: true }, { text: '3 days', str: 'tk.demo.days3', tone: 'red' }], meta: s('tk.demo.meta.431', 'parity 6 · 9 born last'), value: '000431' }),
          r({ id: s('tk.demo.id', '000467', { id: '000467' }), headline: s('tk.demo.due.in2', 'Due in 2 days'), tone: 'forecast', meta: s('tk.demo.meta.467', 'parity 5 · 10 born last'), value: '000467' })] })
    ];
    var body = K.latest({ lead: s('tk.demo.latest.lead', 'Last record'), value: s('tk.demo.latest.time', '08:41'), rest: s('tk.demo.latest.who', '· G. Hansen') }) +
      K.summary({
        unit: { icon: 'grid', heading: s('tk.demo.unit', 'Unit 7'), value: n(10), description: s('tk.demo.unit.desc', 'Live / litter'), support: s('tk.demo.unit.target', 'Target 12'), supportTone: 'amber' },
        task: { icon: 'record', heading: s('tk.demo.overview', 'Task overview'), count: n(7), of: s('tk.demo.of', '/ 18', { n: 18 }), description: s('tk.demo.farrowed', 'Farrowed'), scope: s('tk.demo.scope', '· all units'),
          segments: [{ tone: 'done', share: 7 / 18 * 100 }, { tone: 'active', share: 2 / 18 * 100 }, { tone: 'rest', share: 9 / 18 * 100 }], max: 18, now: 7,
          support: s('tk.demo.support', '2 active · 9 awaiting'), label: s('tk.demo.overview.aria', 'Task overview, all units, 7 of 18 farrowed'), action: 'task-overview' }
      }) +
      K.lens({ action: 'lens', filter: { action: 'filter', label: s('tk.demo.filter', 'Filter sows') }, tabs: [
        { text: s('tk.demo.lens.awaiting', 'Awaiting'), count: n(4), value: 'awaiting' },
        { text: s('tk.demo.lens.active', 'Active'), count: n(1), value: 'active' },
        { text: s('tk.demo.lens.done', 'Done'), count: n(2), value: 'done' },
        { text: s('tk.demo.lens.all', 'All'), count: n(7), value: 'all', pressed: true }] }) +
      K.list(groups);
    var tools = [{ icon: 'search', action: 'search', label: s('tk.demo.search', 'Search ear tag') }]; tools.label = s('tk.demo.tools', 'Farrowing tools');
    return K.screen({ inert: inert, label: s('tk.demo.room', 'Unit 7 farrowing sows'),
      header: K.header({ title: s('tk.demo.task', 'Farrowing'), back: { action: 'home' } }),
      body: body,
      dock: K.dock({ unit: { icon: 'grid', label: s('tk.demo.pen', 'B1', { pen: 'B1' }), caption: s('tk.demo.dock.goto', 'Go to pen'), action: 'go-pen', aria: s('tk.demo.dock.goto', 'Go to pen') }, primary: { icon: 'scan', label: s('act.scan', 'Scan ear tag'), action: 'scan' }, tools: tools }) });
  }

  // TaskStepper: the Stepper card in farrowing's face (row: outlined keys, 15px label, 18px mono value).
  function stepper(key, str, text, v, more) {
    return K.stepper(Object.assign({ label: text, value: v, key: key, action: 'step',
      strs: { label: str, value: 'tk.demo.n', decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase' } }, more || {}));
  }

  // ---- Finish farrowing: a drawer sized to its content, closed by a hold ----
  function finish(assist) {
    var facts = K.totals([{ label: s('tk.demo.born', 'Born'), value: n(14) }, { label: s('tk.demo.alive', 'Alive'), value: n(9) }, { label: s('tk.demo.dead', 'Dead'), value: n(5) }]);
    return K.drawer({ size: 'long', view: 'finish',
      title: s('tk.demo.finish', 'Finish farrowing'), subtitle: s('tk.demo.finish.sub', '000418 · B1 · Parity 3'),
      body: facts + stepper('weak', 'tk.demo.weak', 'Weak', 1) + stepper('deformed', 'tk.demo.deformed', 'Deformed', 1) +
        (assist ? K.radios({ layout: 'row', label: 'Assisted farrowing', optional: 'Optional', action: 'assisted', key: 'assisted', selected: 'yes', id: 'tk-demo-assisted',
          options: [{ value: 'no', label: 'No', strs: { label: 'tk.demo.assist.no' } }, { value: 'yes', label: 'Yes', strs: { label: 'tk.demo.assist.yes' } }],
          strs: { label: 'tk.demo.assist', optional: 'ds.field.optional', clear: 'act.clear' } }) : ''),
      footer: K.footer({ back: { action: 'back' }, hold: { label: s('tk.demo.finish', 'Finish farrowing'), caption: s('tk.demo.finish.hold', 'Hold to finish'), action: 'finish', tone: 'primary' } }) });
  }

  // ---- Dead: a drawer held at full height (its content grows as the worker taps) ----
  function dead() {
    var causes = [['stillborn', 'tk.demo.c.stillborn', 'Stillborn', 1], ['mummified', 'tk.demo.c.mummified', 'Mummified', 1], ['crushed', 'tk.demo.c.crushed', 'Crushed', 3],
      ['scours', 'tk.demo.c.scours', 'Scours', 0], ['starve', 'tk.demo.c.starve', 'Starve-out', 0], ['other', 'tk.demo.c.other', 'Other', 1]];
    return K.drawer({ size: 'long', height: 'full', view: 'dead',
      title: s('tk.demo.dead.title', 'Dead 6', { n: 6 }), subtitle: [s('tk.demo.dead.sub', 'Born dead or died'), { sep: true }, { text: '1 unsaved', str: 'tk.demo.dead.unsaved', tone: 'green' }],
      aside: UI.button({ label: 'Clear', register: 'text', action: 'clear', strs: { label: 'act.clear' } }),
      body: UI.segment({ action: 'dead-mode', active: 'piglets', ariaLabel: 'Who died', options: [['piglets', '', { strs: { label: 'tk.demo.piglets' } }], ['sow', '', { strs: { label: 'tk.demo.sow' } }]] }) +
        causes.map(function (c) { return stepper(c[0], c[1], c[2], c[3], c[0] === 'crushed' ? { draft: true, min: 2 } : { min: c[3] }); }).join('') +
        K.photos({ label: 'Photos', optional: 'Optional', key: 'photos', strs: { label: 'ds.c2.photos.label', optional: 'ds.field.optional', camera: 'ds.c2.aria.camera' } }),
      footer: K.footer({ back: { action: 'back' }, primary: { label: s('act.save', 'Save'), action: 'save' } }) });
  }

  // ---- Foster piglets: a page with the choice tiles, the other litter as door rows, a stepper on a well ----
  function foster() {
    var sows = [['000601', 'tk.demo.foster.s1'], ['000605', 'tk.demo.foster.s2']].map(function (x) {
      return K.door({ title: s('tk.demo.id', x[0], { id: x[0] }), description: s(x[1], ''), action: 'target', value: x[0] });
    }).join('');
    var body = K.choice({ action: 'direction', label: s('tk.demo.foster.dir', 'Direction'), options: [
        { value: 'out', icon: 'transfer', label: s('tk.demo.foster.send', 'Send piglets'), pressed: true },
        { value: 'in', icon: 'transfer', label: s('tk.demo.foster.receive', 'Receive piglets') }] }) +
      '<section class="tk-demo-section">' + UI.heading({ title: '', kind: 'section', level: 3, strs: { title: 'tk.demo.foster.other' } }) + sows + '</section>' +
      stepper('count', 'tk.demo.foster.number', 'Number of piglets', 1, { variant: 'hero', min: 1, hint: '', strs: { label: 'tk.demo.foster.number', value: 'tk.demo.n', decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase', hint: 'tk.demo.foster.rule' } });
    return K.page({ title: s('tk.demo.foster', 'Foster piglets'), description: s('tk.demo.foster.sub', 'B1 · sow 000418'), view: 'foster', body: body,
      footer: K.footer({ back: { action: 'back' }, primary: { label: s('tk.demo.foster.save', 'Send 1 piglet', { n: 1 }), action: 'save' } }) });
  }

  // ---- The count sheet: the hero on the green area; a status line above the footer with one text action ----
  function count() {
    return K.drawer({ size: 'long', view: 'count', title: s('tk.demo.id', '000418', { id: '000418' }), subtitle: s('tk.demo.count.sub', 'B1 / Parity 3 · Farrowing'),
      body: stepper('alive', 'tk.demo.alive', 'Alive', 9, { variant: 'hero', face: 'count', min: 5 }) +
        K.door({ title: s('tk.demo.count.log', 'Farrowing log'), description: s('tk.demo.count.log.sub', 'Born 14 · Dead 5'), action: 'log' }) +
        K.door({ title: s('tk.demo.care.title', 'Iron · day 3'), description: s('tk.demo.care.sub', '12 owed · due today'), action: 'open-dose', value: 'iron3', trail: '',
          act: { label: s('tk.demo.care.act', 'Record 12', { n: 12 }), action: 'record', value: 'iron3' } }),
      footer: K.footer({ back: { action: 'back' }, primary: { label: s('tk.demo.finish', 'Finish farrowing'), action: 'finish' },
        status: { text: 'Record says 10 · counted 9', str: 'tk.demo.count.status', id: 'tk-demo-count-status', tone: 'amber', visible: true,
          action: { label: s('tk.demo.count.right', '9 is right'), action: 'count-right' } } }) });
  }

  // ---- The record page ----
  function page() {
    var e = function (t, m, d) { var x = { title: '', meta: '', strs: { title: t, meta: m } }; if (d) { x.detail = ''; x.strs.detail = d; } return x; };
    var log = UI.log([
      { label: '', strs: { label: 'tk.demo.log.d1' }, entries: [e('tk.demo.log.e1', 'tk.demo.log.e1m')] },
      { label: '', strs: { label: 'tk.demo.log.d2' }, entries: [e('tk.demo.log.e2', 'tk.demo.log.e2m')] },
      { label: '', strs: { label: 'tk.demo.log.d3' }, entries: [e('tk.demo.log.e3', 'tk.demo.log.e3m'), e('tk.demo.log.e4', 'tk.demo.log.e4m', 'tk.demo.log.e4d')] }]);
    return K.page({ title: s('tk.demo.log', 'Farrowing log'), description: s('tk.demo.log.sub', 'B1 · 000418 · born 14 · 8 alive now'), body: log, footer: K.footer({ back: { action: 'back' } }) });
  }

  // ---- A dialog over a drawer ----
  function dialog() {
    var under = K.drawer({ size: 'long', height: 'full', title: s('tk.demo.edit', 'Edit record'), subtitle: s('tk.demo.edit.sub', '000418 · B1'),
      body: stepper('stillborn', 'tk.demo.c.stillborn', 'Stillborn', 1) + stepper('crushed', 'tk.demo.c.crushed', 'Crushed', 2),
      footer: K.footer({ back: { action: 'back' }, primary: { label: s('act.save', 'Save'), action: 'save' } }) });
    var what = UI.segment({ action: 'born-mode', active: 'more', ariaLabel: 'What changed', options: [['more', '', { strs: { label: 'tk.demo.born.more' } }], ['wrong', '', { strs: { label: 'tk.demo.born.wrong' } }]] }) +
      stepper('born-add', 'tk.demo.born.add', 'Additional born', 1);
    return '<div inert>' + under + '</div>' + K.dialog({ icon: 'edit', title: s('tk.demo.born.title', 'Born 14 · correct it'), description: s('tk.demo.born.desc', 'Choose what changed.'),
      body: what, footer: K.footer({ back: { action: 'back' }, primary: { label: s('tk.demo.apply', 'Apply'), action: 'apply' } }) });
  }

  // ---- The task overview page: the progress card; a waiting primary whose reason sits in the footer's status slot ----
  function overview() {
    var prog = K.progress({ title: s('tk.demo.progress.title', 'Whole-task progress'), meta: s('tk.demo.progress.meta', '18 sows', { n: 18 }),
      segments: [{ tone: 'done', share: 7 / 18 * 100 }, { tone: 'active', share: 2 / 18 * 100 }, { tone: 'rest', share: 9 / 18 * 100 }], max: 18, now: 7,
      barLabel: s('tk.demo.progress.aria', '7 of 18 farrowed'),
      counts: [{ value: n(7), label: s('tk.demo.farrowed', 'Farrowed'), tone: 'done' }, { value: n(2), label: s('tk.demo.lens.active', 'Active'), tone: 'active' },
        { value: n(9), label: s('tk.demo.lens.awaiting', 'Awaiting'), tone: 'rest' }] });
    var units = [['6', 4, 1, 3], ['7', 1, 1, 4], ['8', 2, 0, 2]];
    var tbl = K.table({ title: s('tk.demo.table.title', 'Choose a unit'), icon: 'grid', nameColumn: s('tk.demo.table.unit', 'Unit'),
      columns: [s('tk.demo.farrowed', 'Farrowed'), s('tk.demo.lens.active', 'Active'), s('tk.demo.lens.awaiting', 'Awaiting')],
      rows: units.map(function (u) { return { name: s('tk.demo.unit.n', 'Unit ' + u[0], { n: u[0] }), sub: u[0] === '7' ? s('tk.demo.table.current', 'Current unit') : '', current: u[0] === '7',
        values: [n(u[1]), n(u[2]), n(u[3])], action: 'unit', value: u[0], label: s('tk.demo.table.aria', 'Open unit ' + u[0], { n: u[0] }) }; }) });
    var met = K.metrics({ title: s('tk.demo.metrics.title', 'Performance metrics'), icon: 'chart', meta: s('tk.demo.metrics.meta', '7 finished litters', { n: 7 }),
      measures: [{ label: s('tk.demo.metrics.bal', 'Born alive / litter'), value: s('tk.demo.metrics.bal.v', '12.0'), sub: s('tk.demo.unit.target', 'Target 12') },
        { label: s('tk.demo.metrics.sb', 'Stillborn rate'), value: s('tk.demo.metrics.sb.v', '7.2'), unit: s('tk.demo.metrics.pct', '%'), sub: s('tk.demo.metrics.sb.sub', '7 stillborn / 97 born') }],
      totals: [{ label: s('tk.demo.born', 'Born'), value: n(97) }, { label: s('tk.demo.metrics.alive', 'Alive now'), value: n(59) }, { label: s('tk.demo.metrics.deaths', 'Piglet deaths'), value: n(38) }] });
    return K.page({ title: s('tk.demo.overview', 'Task overview'), description: s('tk.demo.overview.sub', 'Farrowing · All 3 units'), view: 'overview', body: prog + tbl + met,
      footer: K.footer({ back: { action: 'back' }, primary: { label: s('tk.demo.end_early', 'End task early'), action: 'end', register: 'end-early', waiting: true },
        status: { text: 'Save or clear the 2 drafts on this phone to end', str: 'ds.c2.demo.hold_reason', id: 'tk-demo-end-reason', tone: 'amber' } }) });
  }

  // ---- The sow died: flat radio rows, the photo line, the danger band; a waiting hold ----
  function sow() {
    var causes = [['farrowing', 'tk.demo.sow.c1', 'Farrowing'], ['prolapse', 'tk.demo.sow.c2', 'Prolapse'], ['found', 'tk.demo.sow.c3', 'Found dead'], ['other', 'tk.demo.sow.c4', 'Other']];
    var band = K.warning({ text: s('tk.demo.sow.warn', 'Save or clear the pending piglet deaths before ending.'),
      actions: UI.button({ label: 'Review piglet deaths', register: 'text', action: 'review', strs: { label: 'tk.demo.sow.review' } }) + '<strong data-str="tk.demo.sow.ends">Saving ends farrowing</strong>',
      detail: s('tk.demo.sow.detail', '9 alive stay under piglet care') });
    return K.drawer({ size: 'long', height: 'full', view: 'sow', title: s('tk.demo.sow.title', 'Sow died'), subtitle: s('tk.demo.sow.sub', 'Choose the cause'),
      aside: UI.button({ label: 'Clear', register: 'text', action: 'clear', strs: { label: 'act.clear' } }),
      body: '<div class="tk-demo-stack">' + UI.segment({ action: 'dead-mode', active: 'sow', ariaLabel: 'Who died', options: [['piglets', '', { strs: { label: 'tk.demo.piglets' } }], ['sow', '', { strs: { label: 'tk.demo.sow' } }]] }) +
        K.radios({ label: '', action: 'cause', key: 'cause', options: causes.map(function (c) { return { value: c[0], label: c[2], strs: { label: c[1] } }; }) }) +
        K.photos({ label: 'Photos', optional: 'Optional', key: 'photos', strs: { label: 'ds.c2.photos.label', optional: 'ds.field.optional', camera: 'ds.c2.aria.camera' } }) + band + '</div>',
      footer: K.footer({ back: { action: 'back' }, hold: { label: s('act.save', 'Save'), caption: s('tk.demo.sow.hold', 'HOLD TO SAVE'), action: 'save', tone: 'primary', waiting: true } }) });
  }

  // ---- The pen page: a section title with its icon over one card of icon doors; Back alone ----
  function pen() {
    var items = [['feed', 'feed', 'tk.demo.pen.feed'], ['fault', 'wrench', 'tk.demo.pen.fault'], ['note', 'record', 'tk.demo.pen.note'], ['log', 'clock', 'tk.demo.pen.log']].map(function (x) {
      return { title: s(x[2], ''), description: s(x[2] + '.sub', ''), icon: x[1], action: 'pen-' + x[0] };
    });
    return K.page({ title: s('tk.demo.pen.title', 'Pen B1'), description: s('tk.demo.pen.sub', '1 sow · Unit 7'), view: 'pen',
      body: K.doors({ card: true, title: s('tk.demo.pen.info', 'Pen information'), icon: 'grid', items: items }), footer: K.footer({ back: { action: 'back' } }) });
  }

  function perf(meta, bal, sb, sbSub, born, alive, deaths) {
    return K.metrics({ title: s('tk.demo.metrics.title', 'Performance metrics'), icon: 'chart', meta: meta,
      measures: [{ label: s('tk.demo.metrics.bal', 'Born alive / litter'), value: s('tk.demo.metrics.bal.v', bal), sub: s('tk.demo.unit.target', 'Target 12') },
        { label: s('tk.demo.metrics.sb', 'Stillborn rate'), value: s('tk.demo.metrics.sb.v', sb), unit: s('tk.demo.metrics.pct', '%'), sub: sbSub }],
      totals: [{ label: s('tk.demo.born', 'Born'), value: n(born) }, { label: s('tk.demo.metrics.alive', 'Alive now'), value: n(alive) }, { label: s('tk.demo.metrics.deaths', 'Piglet deaths'), value: n(deaths) }] });
  }
  // ---- End task early: the banner (icon, bold title, a door), metrics, an icon-headed outcomes section; the red hold ----
  function endEarly() {
    var banner = K.warning({ tone: 'amber', icon: 'alert', title: s('tk.demo.end.banner', '9 sows will be removed from this batch', { n: 9 }),
      text: s('tk.demo.end.banner.sub', 'These sows have not farrowed.'), door: { action: 'removed', label: s('tk.demo.end.banner', '9 sows will be removed from this batch', { n: 9 }) } });
    var outcomes = K.section({ title: s('tk.demo.end.outcomes', 'Task outcomes'), icon: 'record', meta: s('tk.demo.end.sows', '19 sows', { n: 19 }),
      items: [{ label: s('tk.demo.end.finished', 'Finished farrowing'), value: n(9) }, { label: s('tk.demo.end.awaiting', 'Awaiting farrowing'), value: n(9) }, { label: s('tk.demo.end.sowdeaths', 'Sow deaths'), value: n(1) }] });
    return K.page({ title: s('tk.demo.end_early', 'End task early'), description: s('tk.demo.overview.sub', 'Farrowing · All 3 units'), view: 'end',
      body: banner + perf(s('tk.demo.metrics.meta', '9 finished litters', { n: 9 }), '12.0', '7.2', s('tk.demo.end.sb.sub', '9 stillborn / 125 born'), 125, 77, 48) + outcomes,
      footer: K.footer({ back: { action: 'back' }, hold: { label: s('tk.demo.end_early', 'End task early'), caption: s('tk.demo.end.hold', 'HOLD TO END EARLY'), action: 'end', tone: 'danger' } }) });
  }
  // ---- The end receipt: the ✓ receipt row, then the task's figures; Back alone ----
  function endReceipt() {
    return K.page({ title: s('tk.demo.receipt.title', 'Task ended'), description: s('tk.demo.overview.sub', 'Farrowing · All 3 units'), view: 'receipt',
      body: K.receipt({ title: s('tk.demo.receipt.row', 'Farrowing task ended'), meta: s('tk.demo.receipt.meta', '30 Sept, 23:09 · G. Hansen') }) +
        perf(s('tk.demo.metrics.meta', '18 finished litters', { n: 18 }), '12.0', '3.9', s('tk.demo.receipt.sb.sub', '9 stillborn / 233 born'), 233, 185, 48),
      footer: K.footer({ back: { action: 'back' } }) });
  }
  // ---- Piglet processing care: day cards; a due row with its one-tap ----
  function care() {
    var d1 = K.day({ title: s('tk.demo.care.d1', 'Day 1', { n: 1 }), status: s('tk.demo.care.recorded', 'Recorded'), items: [
      { title: s('tk.demo.care.dry', 'Dry and warm'), meta: s('tk.demo.care.dry.m', 'Aug 26 · 07:18 · G. Hansen'), mark: 'done', action: 'item', value: 'dry' },
      { title: s('tk.demo.care.navel', 'Disinfect navel'), meta: s('tk.demo.care.navel.m', 'Aug 26 · 07:24 · G. Hansen'), mark: 'done', action: 'item', value: 'navel' }] });
    var d3 = K.day({ title: s('tk.demo.care.d1', 'Day 3', { n: 3 }), status: s('tk.demo.care.due', 'Due today'), items: [
      { title: s('tk.demo.care.iron', 'Iron supplement'), meta: s('tk.demo.care.due', 'Due today'), mark: 'due', action: 'item', value: 'iron',
        act: { label: s('tk.demo.care.act', 'Record 9', { n: 9 }), action: 'record', value: 'iron' } },
      { title: s('tk.demo.care.id', 'Ear tag, notch and weight'), meta: s('tk.demo.care.id.m', '3 identified · 6 without identity'), mark: 'due', action: 'item', value: 'id' }] });
    return K.page({ title: s('tk.demo.care.page', 'Piglet processing'), description: s('tk.demo.care.page.sub', 'B1 · sow 000418 · 8 alive'), view: 'care', body: d1 + d3,
      footer: K.footer({ back: { action: 'back' }, primary: { label: s('tk.demo.care.save', 'Save care updates'), action: 'save', waiting: true } }) });
  }

  var screens = {
    room: function () { return K.phone(room(false)); },
    sheet: function () { return K.phone(room(true) + finish()); },
    full: function () { return K.phone(room(true) + dead()); },
    page: function () { return K.phone(room(true) + page()); },
    dialog: function () { return K.phone(room(true) + dialog()); },
    overview: function () { return K.phone(room(true) + overview()); },
    foster: function () { return K.phone(room(true) + foster()); },
    count: function () { return K.phone(room(true) + count()); },
    sow: function () { return K.phone(room(true) + sow()); },
    pen: function () { return K.phone(room(true) + pen()); },
    assisted: function () { return K.phone(room(true) + finish(true)); },
    end: function () { return K.phone(room(true) + endEarly()); },
    receipt: function () { return K.phone(room(true) + endReceipt()); },
    care: function () { return K.phone(room(true) + care()); }
  };
  var refs = { room: 'room', sheet: 'finish', full: 'draft', page: 'history', dialog: 'born', overview: 'overview', foster: 'foster', count: 'count', sow: 'sow', pen: 'pen', assisted: 'assisted', end: 'end', receipt: 'receipt', care: 'care' };
  var el = document.getElementById('root');
  if (screens[only]) {
    // One screen, on the harness: framed 390×844 on a wide window, full-bleed on a phone.
    document.body.className = 'tk-stage';
    el.outerHTML = screens[only]();
  } else {
    document.body.className = 'tk-gallery';
    var h = function (tag, str, text) { return '<' + tag + ' data-str="' + str + '">' + text + '</' + tag + '>'; };
    el.outerHTML = '<header class="tk-gallery-head">' + h('h1', 'tk.demo.title', 'Task skeleton') + h('p', 'tk.demo.lead', '') + '</header>' +
      Object.keys(screens).map(function (k) {
        return '<section class="tk-pair">' + h('h2', 'tk.demo.pair.' + k, '') + '<div class="tk-pair-grid">' +
          '<div class="tk-pair-col">' + h('h3', 'tk.demo.col.ref', '') + '<img src="/ux/design-system/assets/task-skeleton/farrowing-' + refs[k] + '.png" width="390" height="844" alt=""></div>' +
          '<div class="tk-pair-col">' + h('h3', 'tk.demo.col.parts', '') + screens[k]() + '</div></div></section>';
      }).join('');
  }
  // Live: lens tabs toggle; the hold runs (nothing is recorded).
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('.tk-lens-tab');
    if (!b) return;
    b.parentNode.querySelectorAll('.tk-lens-tab').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
  var t = function (id) { return window.PP ? window.PP.t(id) : id; };
  var holds = K.holdBind(document.body, { t: t, onCommit: function (x) { setTimeout(function () { holds.settle(x, 'done'); }, 600); } });
})();
</script>
<script src="/ux/tasks/piglet-processing/shell.js"></script>
</body>
</html>
