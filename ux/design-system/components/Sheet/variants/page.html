<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheet · page</title><style>
.ph{position:relative;height:640px;max-width:390px;margin:0 auto;overflow:hidden;background:var(--app-background);font-family:var(--sans);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .bg{padding:0 var(--space-gutter)}
.ph .bar{display:flex;justify-content:space-between;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
.ph[data-pressed] .surface-back{background:var(--back-press)}
.ph[data-pressed] .sheet-up{background:var(--press)}
.ph[data-pressed] .sheet-footer .button.primary{filter:brightness(.96);transform:translateY(1px)}
.ph[data-pressed] .sheet-footer .surface-back:only-child{background:var(--ink)}
</style></head><body>
<div class="ph" data-state="Default" data-demo="page-default"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Pressed" data-demo="page-pressed" data-pressed=""><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Fact line (a task page)" data-demo="page-fact"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Waiting (stands alone)" data-demo="page-waiting"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Empty" data-demo="page-empty"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Long / Chinese" data-demo="page-zh"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Drawer over a page" data-demo="page-over"><div class="bg"></div><div class="over"></div></div>
<script>
const UI=window.SentriUI,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bg=()=>'<div class="bar" aria-hidden="true"><span>9:41</span></div>'+UI.heading({title:'Pen B4',kind:'page',description:'Sow 000254 \u00b7 11 piglets'})+UI.panel(UI.row({title:'Litter',description:'11 alive \u00b7 day 2'}),{className:'st-row-group'});
const bar='<div class="bar" aria-hidden="true"><span>9:41</span></div>';
const note=(l,v)=>UI.field({label:l,control:'<textarea rows="3" placeholder="'+esc(v||'')+'"></textarea>'});
const rows=(n,t)=>UI.panel(Array.from({length:n},(_,i)=>UI.row({title:(t||'Piglet')+' '+(i+1),description:'Day 2 \u00b7 B4',action:'x'})).join(''),{className:'st-row-group'});
const foot=(p,extra)=>UI.sheetFooter(Object.assign({back:{action:'back'},primary:{label:'Record death',action:'save'}},p||{}));
const pf=(x)=>UI.sheetFooter(Object.assign({back:false,primary:{label:'Record death',action:'save'}},x||{}));
const R={
"page-default":()=>UI.sheet({variant:'page',bar:bar,title:'Pen log',back:{action:'back'},body:rows(4,'Entry'),footer:false}),
"page-pressed":()=>UI.sheet({variant:'page',bar:bar,title:'Pen log',back:{action:'back'},body:rows(4,'Entry'),footer:false}),
"page-fact":()=>UI.sheet({variant:'page',bar:bar,title:'Farrowing',back:{action:'today',label:'Back to Today'},line:{text:[{text:'Last record '},{text:'08:41',strong:true},{text:' · G.H'}]},body:rows(3,'Sow'),footer:false}),
"page-waiting":()=>UI.sheet({variant:'page',bar:bar,title:'Move piglets',back:{action:'back'},body:rows(2,'Pen'),footer:pf({primary:{label:'Move 3',action:'save',waiting:true},status:{text:'Pick a pen first'}})}),
"page-empty":()=>UI.sheet({variant:'page',bar:bar,title:'Pen log',back:{action:'back'},body:'<p class="st-choice-empty">No activity recorded yet.</p>',footer:false}),
"page-zh":()=>UI.sheet({variant:'page',bar:bar,title:'猪只记录',back:{action:'back',label:'返回'},line:{text:[{text:'最近记录 '},{text:'08:41',strong:true},{text:' · G.H'}]},body:rows(3,'记录'),footer:false}),
"page-over":()=>UI.sheet({variant:'page',bar:bar,title:'Treatment',back:{action:'back'},body:rows(2),footer:pf({primary:{label:'Record treatment',action:'save'}})})+UI.sheet({title:'Medicine',size:'short',body:rows(2,'Medicine'),footer:UI.sheetFooter({back:{action:'back'}})})
};
document.querySelectorAll('[data-state]').forEach(el=>{const k=el.getAttribute('data-demo'),r=R[k];el.querySelector('.bg').innerHTML=bg();if(r)el.querySelector('.over').innerHTML=r();});
</script></body></html>
