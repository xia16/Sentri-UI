<!-- @dsCard group="Surfaces" height=700 subtitle="Drawer, page and dialog" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:var(--app-background)}
body{display:flex;flex-wrap:wrap;gap:var(--space-12);padding:var(--space-12);font-family:var(--sans);color:var(--ink)}
.ph{position:relative;flex:none;width:390px;height:640px;overflow:hidden;background:var(--app-background);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .bg{padding:var(--space-gutter)}
.ph .bar{display:flex;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
</style></head>
<body>
<div class="ph" id="drawer"><div class="bg"></div><div class="over"></div></div>
<div class="ph" id="page"><div class="over"></div></div>
<div class="ph" id="dialog"><div class="bg"></div><div class="over"></div></div>
<script>
const UI = window.SentriUI;
const bg = () => UI.heading({ title: 'Pen B4', kind: 'page', description: 'Sow 000254 · 11 piglets' }) + UI.panel(UI.row({ title: 'Litter', description: '11 alive · day 2' }), { className: 'st-row-group' });
const note = l => UI.field({ label: l, control: '<textarea rows="3"></textarea>' });
const rows = n => UI.panel(Array.from({ length: n }, (_, i) => UI.row({ title: 'Entry ' + (i + 1), description: 'Day 2 · B4', action: 'x' })).join(''), { className: 'st-row-group' });
const footer = UI.sheetFooter({ back: { action: 'back' }, primary: { label: 'Record death', action: 'save', waiting: true }, status: { text: 'Say how many died' } });
const set = (id, html, withBg) => { const el = document.getElementById(id); if (withBg) el.querySelector('.bg').innerHTML = bg(); el.querySelector('.over').innerHTML = html; };
set('drawer', UI.sheet({ title: 'Record a death', subtitle: 'B4 · 11 alive', size: 'short', body: note('Cause'), footer }), true);
set('page', UI.sheet({ variant: 'page', bar: '<div class="bar" aria-hidden="true">9:41</div>', title: 'Pen log', subtitle: 'B4 · Sow 000254', body: rows(4), footer: UI.sheetFooter({ back: { action: 'back' } }) }), false);
set('dialog', UI.sheet({ variant: 'dialog', title: 'End task early?', icon: 'alert', subtitle: 'Unfinished work stays incomplete. Records are kept.', body: '', footer: UI.sheetFooter({ back: { action: 'back' }, primary: { label: 'End task early', action: 'end', register: 'danger' } }) }), true);
</script>
</body>
</html>
