<!-- @dsCard group="Surfaces" height=470 subtitle="A short drawer over a page" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>html,body{margin:0;background:var(--app-background)}</style></head>
<body>
<div class="inspection-phone" data-st-context="page" style="position:relative;max-width:390px;height:460px;overflow:hidden;background:var(--app-background);font-family:var(--sans);color:var(--ink)">
<div id="page" style="padding:18px"></div>
<div class="scrim" style="inset:0"></div>
<section class="sheet" data-st-context="drawer" data-size="short" style="max-height:58%">
<header class="utility-header" style="padding:18px 18px 8px"><h3 style="margin:0">Record a death</h3></header>
<div class="sheet-body" style="padding:8px 18px 12px" id="body"></div>
<footer class="sheet-footer" style="padding:14px 18px 28px;gap:12px"><button type="button" class="button secondary">Close</button><button type="button" class="button primary">Record death</button></footer>
</section></div>
<script>
const UI = window.SentriUI, I = window.SentriIcons.icon;
page.innerHTML = UI.heading({ title: 'Pen B4', kind: 'page', description: 'Sow 000254 · 11 piglets' }) + UI.panel(UI.row({ title: 'Litter', description: '11 alive · day 2' }), { className: 'st-row-group' });
body.innerHTML = UI.pickerField({ label: 'Cause', placeholder: 'Select', key: 'cause' });
</script>
</body>
</html>
