<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field cards</title>
<link rel="stylesheet" href="/ux/design-system/tokens.css">
<link rel="stylesheet" href="/ux/design-system/components/bundle.css">
<link rel="stylesheet" href="/ux/tasks/piglet-processing/shell.css">
<style>
/* layout only: the order of the states and the gaps between them */
.demo-card > * + * { margin-top: var(--space-section); }
.demo-dock { display: flex; flex-direction: column; gap: var(--space-row-y); }
.demo-bar { display: flex; gap: var(--space-footer-gap); }
</style>
</head>
<body>
<!-- Every state of the three candidate field cards (Stepper, Measure, Numpad), en and zh (?lang=zh).
     Sample litter: crate B04, 11 alive, day 3. Pressed and focus are drawn with the cards' data-preview hook.
     The bars under the docked pads are the Button card. -->
<main class="phone inspection-phone" data-st-context="page">
  <div id="screen"></div>
</main>
<script src="/ux/design-system/components/bundle.js"></script>
<script>
(function () {
  var UI = window.SentriUI;
  var F = 'ds.field.figure';
  function st(title, body) { return '<div class="demo-state">' + UI.heading({ title: '', kind: 'group', level: 4, strs: { title: 'ds.field.demo.' + title } }) + body + '</div>'; }
  function card(title, states) { return '<section class="demo-card">' + UI.heading({ title: '', kind: 'section', level: 2, strs: { title: 'ds.field.demo.' + title } }) + states.join('') + '</section>'; }
  function bar(primaryId) {
    return '<div class="demo-bar">' +
      '<button type="button" class="button secondary surface-back" data-ds="Button" data-action="back"><span data-str="act.back">Back</span></button>' +
      '<button type="button" class="button primary" data-ds="Button" data-action="commit"><span data-str="' + primaryId + '"></span></button></div>';
  }
  var aria = { decrease: 'ds.field.aria.decrease', increase: 'ds.field.aria.increase' };
  function sstrs(extra) { return Object.assign({ value: F }, aria, extra || {}); }
  var among = { description: { n: 11 } };

  // Stepper — rows among 11 alive (weak + deformed can never pass alive), and the hero Alive count.
  var stepper = card('stepper', [
    st('default', UI.panel(
      UI.stepper({ label: 'Weak', description: 'among 11 alive', value: 1, max: 11, key: 'weak', strs: sstrs({ label: 'label.weak', description: 'ds.field.demo.of_alive' }), args: among }) +
      UI.stepper({ label: 'Deformed', description: 'among 11 alive', value: 0, max: 10, key: 'deformed', strs: sstrs({ label: 'label.deformed', description: 'ds.field.demo.of_alive' }), args: among })
    )),
    st('pressed', UI.panel(UI.stepper({ label: 'Weak', value: 2, key: 'weak-pressed', reserveHint: false, strs: sstrs({ label: 'label.weak' }) }))),
    st('focus', UI.panel(UI.stepper({ label: 'Weak', value: 2, key: 'weak-focus', reserveHint: false, strs: sstrs({ label: 'label.weak' }) }))),
    st('ceiling', UI.panel(UI.stepper({ label: 'Weak', description: 'among 11 alive', value: 11, max: 11, key: 'weak-ceiling', hint: "Weak and deformed can't pass 11 alive", strs: sstrs({ label: 'label.weak', description: 'ds.field.demo.of_alive', hint: 'ds.field.stepper.ceiling' }), args: { description: { n: 11 }, hint: { n: 11 } } }))),
    st('changed', UI.panel(UI.stepper({ label: 'Alive', value: 10, key: 'alive-edit', changed: true, reserveHint: false, strs: sstrs({ label: 'label.alive' }) }))),
    st('hero', UI.stepper({ variant: 'hero', label: 'Alive', value: 9, min: 5, key: 'alive', hint: 'Saved · +4 this visit', strs: sstrs({ label: 'label.alive', hint: 'fr.receipt.saved_plus' }), args: { hint: { n: 4 } } })),
    st('hero_floor', UI.stepper({ variant: 'hero', label: 'Alive', value: 9, min: 9, key: 'alive-floor', pointers: [
      { label: 'Found dead? Record dead', action: 'record-dead', strs: { label: 'fr.pointer.found_dead' } },
      { label: 'Wrong count? Edit', action: 'edit', strs: { label: 'pointer.wrong_count' } }
    ], strs: sstrs({ label: 'label.alive' }) }))
  ]);

  // Measure — litter weight of 11 piglets; usual 0.8–2.5 kg each → 8.8–27.5 kg (a soft warning, never a gate).
  function mstrs(extra) { return Object.assign({ label: 'ds.field.demo.litter_weight', optional: 'ds.field.optional', value: F, unit: 'ds.field.unit.kg', placeholder: 'ds.field.placeholder' }, extra || {}); }
  var range = [8.8, 27.5];
  function lw(o) { return UI.measure(Object.assign({ label: 'Litter weight', optional: 'Optional', unit: 'kg', range: range }, o, { strs: mstrs(o.strs) })); }
  var padStrs = { digit: F, decimal: 'ds.field.decimal', back: 'ds.field.aria.backspace', pad: 'ds.field.aria.pad' };
  var usual = function (v) { return { hint: 'Usual 8.8–27.5 kg · this is ' + v, strs: { hint: 'ds.field.measure.range' }, args: { hint: { min: '8.8', max: '27.5', v: v } } }; };
  var measure = card('measure', [
    st('default', lw({ value: '16.8', key: 'lw' })),
    st('empty', lw({ value: '', key: 'lw-empty' })),
    st('pressed', lw({ value: '16.8', key: 'lw-pressed' })),
    st('focus', lw({ value: '16.8', key: 'lw-focus' })),
    st('range_commit', lw({ value: '30.4', active: true, key: 'lw-typing' })),
    st('warn', lw(Object.assign({ value: '30.4', key: 'lw-warn' }, usual('30.4')))),
    st('refused', lw({ value: '304', tone: 'refused', key: 'lw-refused', hint: 'Not recorded · over 55 kg for 11 piglets', strs: { hint: 'ds.field.measure.refused' }, args: { hint: { max: 55, n: 11 } } })),
    st('changed', lw({ value: '16.2', changed: true, key: 'lw-edit', note: 'was 16.8 kg', strs: { note: 'ds.field.measure.was' }, args: { note: { v: '16.8' } } })),
    st('changed_warn', lw(Object.assign({ value: '29.0', changed: true, key: 'lw-edit-warn', note: 'was 16.8 kg' }, usual('29.0'), { strs: { hint: 'ds.field.measure.range', note: 'ds.field.measure.was' }, args: { hint: { min: '8.8', max: '27.5', v: '29.0' }, note: { v: '16.8' } } }))),
    st('docked', '<div class="demo-dock">' + lw({ value: '16.', active: true, key: 'lw-dock', controls: 'pad-lw-dock' }) +
      UI.numpad({ id: 'pad-lw-dock', decimals: 1, intLength: 2, value: '16.', key: 'lw-dock', strs: padStrs }) + bar('act.save') + '</div>')
  ]);

  // Numpad — the tag / weigh run on crate B04, piglet 5 of 11. Tags are 6 digits; weights take 2 decimals.
  function nstrs(extra) { return Object.assign({ value: F, placeholder: 'ds.field.placeholder', recent: 'ds.field.aria.recent' }, padStrs, extra || {}); }
  var recent = [['000257', '1.51'], ['000256', '1.38'], ['000255', '1.44']].map(function (r) {
    return { text: r[0] + ' · ' + r[1] + ' kg', strs: { text: 'ds.field.numpad.recent' }, args: { text: { tag: r[0], w: r[1] } } };
  });
  function tag(o) {
    return UI.numpad(Object.assign({ label: 'Piglet 5 of 11 · ear tag', maxLength: 6, key: 'tag', recent: recent }, o, {
      strs: nstrs(Object.assign({ label: 'ds.field.numpad.tag_label' }, o.strs)), args: Object.assign({ label: { i: 5, n: 11 } }, o.args)
    }));
  }
  var numpad = card('numpad', [
    st('default', tag({ value: '0002' })),
    st('empty', tag({ value: '', recent: [] })),
    st('suggested', tag({ value: '000258', suggested: true, hint: 'Next tag · Record to use', strs: { hint: 'ds.field.numpad.suggested' } })),
    st('suggested_edited', tag({ value: '00025' })),
    st('full', tag({ value: '000258' })),
    st('dead_tap', tag({ value: '000258', hint: 'Tag is 6 digits', strs: { hint: 'ds.field.numpad.dead_full' }, args: { hint: { n: 6 } } })),
    st('duplicate', tag({ value: '000254', tone: 'warn', hint: '000254 is already on crate B04 · records anyway', strs: { hint: 'ds.field.numpad.duplicate' }, args: { hint: { tag: '000254', crate: 'B04' } } })),
    st('short', tag({ value: '00025', tone: 'warn', hint: '5 of 6 digits', strs: { hint: 'ds.field.numpad.short' }, args: { hint: { k: 5, n: 6 } } })),
    st('weight_warn', UI.numpad({ label: 'Piglet 5 of 11 · weight', value: '0.62', unit: 'kg', decimals: 2, intLength: 2, tone: 'warn', key: 'weight', recent: recent, hint: 'Outside the usual 1.0–2.8 kg at day 3', strs: nstrs({ label: 'ds.field.numpad.weight_label', unit: 'ds.field.unit.kg', hint: 'ds.field.numpad.weight_range' }), args: { label: { i: 5, n: 11 }, hint: { min: '1.0', max: '2.8', d: 3 } } })),
    st('pressed', UI.numpad({ decimals: 1, value: '16', key: 'pad-pressed', strs: nstrs() })),
    st('focus', UI.numpad({ decimals: 1, value: '16', key: 'pad-focus', strs: nstrs() })),
    st('run', '<div class="demo-dock">' + tag({ value: '000258', suggested: true, key: 'tag-run', hint: 'Next tag · Record to use', strs: { hint: 'ds.field.numpad.suggested' } }) + bar('ds.field.demo.record_next') + '</div>')
  ]);

  var screen = document.getElementById('screen');
  screen.innerHTML = UI.heading({ title: '', kind: 'page', level: 1, strs: { title: 'ds.field.demo.title' } }) + stepper + measure + numpad;
  screen.className = 'demo-card';
  // Pressed and focus are interaction states; the cards' data-preview hook draws them still.
  function mark(sel, state) { var el = screen.querySelector(sel); if (el) el.setAttribute('data-preview', state); }
  mark('[data-value="weak-pressed"][data-step="1"]', 'pressed');
  mark('[data-value="weak-focus"][data-step="1"]', 'focus');
  mark('.st-measure-box[data-value="lw-pressed"]', 'pressed');
  mark('.st-measure-box[data-value="lw-focus"]', 'focus');
  mark('[data-value="pad-pressed"][data-key="7"]', 'pressed');
  mark('[data-value="pad-focus"][data-key="7"]', 'focus');
})();
</script>
<script src="/ux/tasks/piglet-processing/shell.js"></script>
</body>
</html>
