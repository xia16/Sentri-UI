<!doctype html><html lang="en"><head><meta charset="utf-8"></head><body>
<section data-state="Default"><h2>Default</h2><div id="state-Default"></div></section>
<section data-state="Pressed"><h2>Pressed</h2><div id="state-Pressed"></div></section>
<section data-state="Selected"><h2>Selected</h2><div id="state-Selected"></div></section>
<section data-state="Disabled"><h2>Disabled</h2><div id="state-Disabled"></div></section>
<section data-state="Longest label · 中文"><h2>Long-label</h2><div id="state-Long-label"></div></section>
<script>
// Each state renders in its own iframe in the atlas: draw only the states present.
var UI = window.SentriUI;
var RENDER = {
  "state-Default": () => SentriUI.segment({variant:'lens',options:[['today','Today'],['week','7 days']],active:'today',ariaLabel:'Lens',state:'Default',disabled:false,reason:''}),
  "state-Pressed": () => SentriUI.segment({variant:'lens',options:[['today','Today'],['week','7 days']],active:'today',ariaLabel:'Lens',state:'Pressed',disabled:false,reason:''}),
  "state-Selected": () => SentriUI.segment({variant:'lens',options:[['today','Today'],['week','7 days']],active:'week',ariaLabel:'Lens',state:'Selected',disabled:false,reason:''}),
  "state-Disabled": () => SentriUI.segment({variant:'lens',options:[['today','Today'],['week','7 days']],active:'today',ariaLabel:'Lens',state:'Disabled',disabled:true,reason:'Records are unavailable offline.'}),
  "state-Long-label": () => SentriUI.segment({variant:'lens',options:[['today','今天'],['7d','近7天']],active:'today',ariaLabel:'Lens',state:'Longest label · 中文',disabled:false,reason:''})
};
document.querySelectorAll('[data-state]').forEach(function (s) {
  var t = RENDER[s.id] ? s : s.querySelector('[id]');
  if (t && RENDER[t.id]) t.innerHTML = RENDER[t.id]();
});
</script>
</body></html>
