<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PenMap · map</title><style>
.ph{position:relative;height:var(--phone-height);max-width:var(--phone-width);margin:0 auto var(--space-16);overflow:hidden;background:var(--app-background);font-family:var(--font-sans);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .bg{padding:0 var(--space-gutter)}
.ph .bar{display:flex;justify-content:space-between;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
</style></head><body>
<div class="ph" data-state="Default · Unit 7, 4 × 6" data-demo="unit7"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Pressed" data-demo="pressed"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Hold to peek" data-demo="peek"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Hold to peek · a pen of 30, +N more" data-demo="peekmore"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Filtered · a pen the list hides is empty" data-demo="filtered"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Empty · no sows shown" data-demo="empty"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Long lane · 2 × 60, Whole room beside Back" data-demo="b60"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Long row · 2 × 100, the wider number column" data-demo="b100"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Long lane · 2 × 160" data-demo="b160"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Sideways scroll · 8 × 20, opens on E3" data-demo="b8"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Lanes of different lengths · A 6, B 6, C 4, D 2" data-demo="lengths"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Mixed lane · 10 group pens, then 12 stalls, by size" data-demo="mixed"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Mixed lanes · 3 gilt pens, a stall, a gilt pen" data-demo="mixed2"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Mixed lanes · A group pens then stalls, B stalls then crates" data-demo="asym"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Row at the far end · one pen across the room, C1" data-demo="endpen"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Row at the far end · the gestation barn, 24 stalls" data-demo="gestbarn"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Row by the door · 3 sick pens before the lanes" data-demo="doorrow"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Sketch room · sick pens, one large pen across the end" data-demo="sketch"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Pens on their own · an old drawn layout" data-demo="apart"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Doors · the main door on the left, a back door" data-demo="doors"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Lane A on the right as you walk in · the row counts from A" data-demo="mirror"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Long lane · 2 × 50 stalls" data-demo="stalls50"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Chinese · Unit 7" data-demo="zh7"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Chinese · 2 × 100" data-demo="zh100"><div class="bg"></div><div class="over"></div></div>
<script>
const UI=window.SentriUI;
const L=n=>[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].slice(0,n);
const EN={entrance:'Entrance',legend:{act:'need you',live:'farrowing'},labels:{}};
const ZH={entrance:'入口',legend:{act:'需处理',live:'分娩中'},labels:{map:'栏位',pen:c=>c+'栏',act:'需处理',live:'分娩中',plain:'有母猪',empty:'空栏',hidden:'没有符合条件的母猪'}};
const BARNS={
 unit7:{lanes:L(4),depth:6,pens:{B1:'live',B2:'plain',B3:'act',B4:'act',C5:'live',D3:'plain',A4:'plain',C2:'plain'},current:'B2'},
 filtered:{lanes:L(4),depth:6,pens:{B1:'hidden',B2:'hidden',B3:'act',B4:'act',C5:'hidden',D3:'plain',A4:'hidden',C2:'plain'},current:'B3'},
 empty:{lanes:L(4),depth:6,pens:{},current:'B2'},
 b60:{lanes:L(2),depth:60,pens:{A2:'live',B3:'act',B4:'plain',B5:'plain',A5:'plain',B6:'act',A22:'plain',B45:'act'},current:'B4'},
 b100:{lanes:L(2),depth:100,pens:{A3:'plain',A4:'plain',B4:'plain',B5:'live',A6:'act',A37:'plain',B82:'act'},current:'A4'},
 b160:{lanes:L(2),depth:160,pens:{A2:'plain',B2:'plain',A5:'act',B5:'live',B9:'plain',A90:'act',B133:'act',B159:'live'},current:'A5'},
 b8:{lanes:L(8),depth:20,pens:{B4:'live',G3:'act',C3:'plain',D3:'plain',H2:'plain',F9:'plain',G11:'live'},current:'E3'},
 /* rooms the farm layout describes (2026-11-02, rows and sizes 2026-11-03): runs of pen types (size in cm along the lane), rows across the room, pens on their own, doors, lane A on the right */
 lengths:{lanes:[{n:6},{n:6},{n:4},{n:2}],depth:6,pens:{A2:'plain',A5:'live',B1:'act',B6:'plain',C3:'plain',C4:'act',D1:'plain'},current:'B3'},
 mixed:{lanes:[{runs:[{n:10,type:'Group pen',size:483},{n:12,type:'Gestation stall',size:65}]},{runs:[{n:10,type:'Group pen',size:483},{n:12,type:'Gestation stall',size:65}]}],depth:22,pens:{A7:'plain',A8:'plain',A9:'act',A10:'plain',B8:'plain',B9:'plain',B10:'plain',A11:'plain',A12:'act',A13:'plain',A14:'plain',B11:'plain',B13:'plain',B14:'act'},words:{act:'need you'},current:'A1'},
 mixed2:{lanes:[{runs:[{n:3,type:'Gilt pen',size:300},{n:1,type:'Stall',size:65},{n:1,type:'Gilt pen',size:300}]},{runs:[{n:5,type:'Gilt pen',size:300}]}],depth:5,pens:{A1:'plain',A2:'act',A4:'plain',A5:'plain',B1:'plain',B3:'plain',B4:'act'},words:{act:'need you'},current:'A5'},
 asym:{lanes:[{runs:[{n:2,type:'Group pen',size:483},{n:3,type:'Gestation stall',size:65}]},{runs:[{n:2,type:'Gestation stall',size:65},{n:3,type:'Farrowing crate',size:180}]}],depth:5,pens:{A1:'plain',A3:'act',B2:'plain',B4:'live',B5:'plain'},words:{act:'need you'},current:'A1'},
 endpen:{lanes:[{n:6},{n:6}],depth:6,rows:[{letter:'C',runs:[{n:1,type:'Group pen',size:483}]}],pens:{A2:'plain',A4:'live',A6:'plain',B3:'act',B5:'plain',C1:'act'},current:'A4'},
 gestbarn:{lanes:[{runs:[{n:10,type:'Group pen',size:483}]},{runs:[{n:10,type:'Group pen',size:483}]}],depth:10,rows:[{letter:'C',runs:[{n:24,type:'Gestation stall',size:65}]}],pens:{A3:'plain',A7:'plain',A9:'act',A10:'plain',B6:'plain',B9:'plain',B10:'plain',C2:'plain',C3:'act',C5:'plain',C6:'plain',C9:'plain',C11:'act',C14:'plain',C18:'plain',C23:'plain'},words:{act:'need you'},current:'A1'},
 doorrow:{lanes:[{runs:[{n:4,type:'Weaner pen',size:545}]},{runs:[{n:4,type:'Weaner pen',size:545}]}],depth:4,rows:[{letter:'C',at:'door',runs:[{n:3,type:'Sick pen',size:250}]}],pens:{C2:'act',A1:'plain',A3:'plain',B2:'plain',B4:'act'},words:{act:'need you'},current:'A1'},
 sketch:{lanes:[{runs:[{n:2,type:'Sick pen',size:250}]},{runs:[{n:2,type:'Sick pen',size:250}]}],depth:2,rows:[{letter:'C',runs:[{n:1,type:'Sick pen, large',size:900}]}],pens:{A1:'act',B2:'plain',C1:'plain'},words:{act:'need you'},current:'A1'},
 apart:{lanes:[{n:3},{n:3}],depth:3,apart:[{code:'C1',row:2},{code:'D1'}],pens:{A1:'plain',A2:'act',B3:'plain',C1:'plain',D1:'act'},words:{act:'need you'},current:'A1'},
 doors:{lanes:[{n:4},{n:4}],depth:4,entranceAt:'left',backDoor:'Back door',pens:{A1:'plain',A3:'act',B2:'plain',B4:'plain'},words:{act:'need you'},current:'A1'},
 mirror:{lanes:[{n:4},{n:4}],depth:4,aSide:'right',rows:[{letter:'C',runs:[{n:3,type:'Sick pen'}]}],pens:{A1:'plain',A3:'act',B2:'plain',B4:'plain',C1:'plain'},words:{act:'need you'},current:'A1'},
 stalls50:{lanes:[{runs:[{n:50,type:'Gestation stall',size:65}]},{runs:[{n:50,type:'Gestation stall',size:65}]}],depth:50,pens:{A3:'plain',A4:'plain',A5:'act',B4:'plain',B6:'plain',A31:'act',B47:'plain'},words:{act:'need you'},current:'A4'}
};
const bg=()=>'<div class="bar" aria-hidden="true"><span>9:41</span></div>'+UI.heading({title:'Farrowing',kind:'page',description:'Last record 08:41 · G.H'})+UI.panel(UI.row({title:'Unit 7',description:'Task overview'}),{className:'st-row-group'});
const peekRows=[{code:'000418',right:{kind:'state',figure:'2 days',word:'Overdue',level:'act'}},{code:'000431',right:{kind:'state',figure:'Tomorrow',word:'Due',level:'soon'}}];
/* a pen with more animals than the card holds: the host's four most urgent rows, then how many more */
const moreRows=[...peekRows,{code:'000447',right:{kind:'state',figure:'In 3 days',word:'Due',level:'settled'}},{code:'000452',right:{kind:'state',figure:'In 4 days',word:'Due',level:'settled'}}];
const open=(name,lang,o)=>{
 const b=BARNS[name],t=lang==='zh'?ZH:EN;
 const peek=code=>UI.penPeek({title:code,meta:lang==='zh'?'2头母猪':'2 sows',rows:peekRows});
 const body=UI.penMap(Object.assign({},b,{action:'pick',key:'pm-'+name+lang,entrance:t.entrance,labels:t.labels,peek},o||{}));
 return UI.sheet({surface:'menu',size:'long',title:lang==='zh'?'栏位图':'Pen map',label:'Pen map',line:{key:UI.penMapKey({pens:b.pens,words:lang==='zh'?t.legend:b.words||t.legend})},body,footer:UI.penMapFooter({back:{action:'back',label:lang==='zh'?'返回':'Back'},depth:b.depth,label:lang==='zh'?'跳转栏位':'Jump to pens'})});
};
const R={
 unit7:()=>open('unit7','en'),
 pressed:()=>open('unit7','en'),
 peek:()=>open('unit7','en'),
 peekmore:()=>open('unit7','en'),
 filtered:()=>open('filtered','en'),
 empty:()=>open('empty','en'),
 b60:()=>open('b60','en'),b100:()=>open('b100','en'),b160:()=>open('b160','en'),b8:()=>open('b8','en'),
 lengths:()=>open('lengths','en'), mixed:()=>open('mixed','en'), mixed2:()=>open('mixed2','en'), asym:()=>open('asym','en'), endpen:()=>open('endpen','en'), gestbarn:()=>open('gestbarn','en'), doorrow:()=>open('doorrow','en'), sketch:()=>open('sketch','en'), apart:()=>open('apart','en'), doors:()=>open('doors','en'), mirror:()=>open('mirror','en'), stalls50:()=>open('stalls50','en'),
 zh7:()=>open('unit7','zh'),zh100:()=>open('b100','zh')
};
document.querySelectorAll('[data-state]').forEach(el=>{
 const k=el.getAttribute('data-demo');el.querySelector('.bg').innerHTML=bg();el.querySelector('.over').innerHTML=R[k]();
 if(k==='pressed')el.querySelector('.st-pen-tile[data-pen="B2"]').setAttribute('data-preview','pressed');
 if(k==='peek'){
  const card=el.querySelector('.st-pen-peek'),t=el.querySelector('.st-pen-tile[data-pen="B3"]');
  card.innerHTML=UI.penPeek({title:'B3',meta:'2 sows',rows:peekRows});card.dataset.at='bottom';card.hidden=false;
 }
 if(k==='peekmore'){
  const card=el.querySelector('.st-pen-peek');
  card.innerHTML=UI.penPeek({title:'B3',meta:'30 sows',rows:moreRows,more:'+26 more'});card.dataset.at='bottom';card.hidden=false;
 }
});
</script></body></html>
