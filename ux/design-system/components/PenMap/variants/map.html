<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PenMap · map</title><style>
.ph{position:relative;height:var(--phone-height);max-width:var(--phone-width);margin:0 auto var(--space-16);overflow:hidden;background:var(--app-background);font-family:var(--font-sans);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-device)}
.ph .bg{padding:0 var(--space-gutter)}
.ph .bar{display:flex;justify-content:space-between;align-items:center;height:var(--statusbar-height);padding:0 var(--space-24);font:700 var(--type-panel-title-size) var(--font-sans)}
</style></head><body>
<div class="ph" data-state="Default · Unit 7, 4 × 6" data-demo="unit7"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Pressed" data-demo="pressed"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Hold to peek" data-demo="peek"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Hold to peek · tags, a pen of 30 (Inspection)" data-demo="peektags"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Filtered · a pen the list hides is empty" data-demo="filtered"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Empty · no sows shown" data-demo="empty"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Range control · 2 × 60" data-demo="b60"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Long row · 2 × 100, the wider number column" data-demo="b100"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Long row · 2 × 160, eight ranges" data-demo="b160"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Sideways scroll · 8 × 20, opens on E3" data-demo="b8"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Chinese · Unit 7" data-demo="zh7"><div class="bg"></div><div class="over"></div></div>
<div class="ph" data-state="Chinese · 2 × 100" data-demo="zh100"><div class="bg"></div><div class="over"></div></div>
<script>
const UI=window.SentriUI;
const L=n=>[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].slice(0,n);
const EN={entrance:'Entrance',legend:{act:'need you',live:'farrowing'},labels:{}};
const ZH={entrance:'入口',legend:{act:'需处理',live:'分娩中'},labels:{map:'栏位',pen:c=>c+'栏',act:'需处理',live:'分娩中',plain:'有母猪',empty:'空栏',hidden:'没有符合条件的母猪'}};
const BARNS={
 unit7:{lanes:L(4),depth:6,pens:{B1:'live',B2:'plain',B3:'act',B4:'act',C5:'live',D3:'plain',A4:'plain',C2:'plain'},current:'B2'},
 filtered:{lanes:L(4),depth:6,pens:{B1:'hidden',B2:'hidden',B3:'act',B4:'act',C5:'hidden',D3:'plain',A4:'hidden',C2:'plain'},current:'B3'},
 empty:{lanes:L(4),depth:6,pens:{},current:'B2'},
 b60:{lanes:L(2),depth:60,pens:{A2:'live',B3:'act',B4:'plain',B5:'plain',A5:'plain',B6:'act',A22:'plain',B45:'act'},current:'B4'},
 b100:{lanes:L(2),depth:100,pens:{A3:'plain',A4:'plain',B4:'plain',B5:'live',A6:'act',A37:'plain',B82:'act'},current:'A4'},
 b160:{lanes:L(2),depth:160,pens:{A2:'plain',B2:'plain',A5:'act',B5:'live',B9:'plain',A90:'act',B133:'act',B159:'live'},current:'A5'},
 b8:{lanes:L(8),depth:20,pens:{B4:'live',G3:'act',C3:'plain',D3:'plain',H2:'plain',F9:'plain',G11:'live'},current:'E3'}
};
const bg=k=>'<div class="bar" aria-hidden="true"><span>9:41</span></div>'+(k==='peektags'?UI.heading({title:'Inspection',kind:'page',description:'Unit 7'}):UI.heading({title:'Farrowing',kind:'page',description:'Last record 08:41 · G.H'}))+UI.panel(UI.row({title:'Unit 7',description:'Task overview'}),{className:'st-row-group'});
const peekRows=[{code:'000418',right:{kind:'state',figure:'2 days',word:'Overdue',level:'act'}},{code:'000431',right:{kind:'state',figure:'Tomorrow',word:'Due',level:'soon'}}];
/* Inspection's peek: the walk's rows (ID over the stage line, condition tags), the most urgent first, four at most, then how many more */
const tagRows=[['000306','Gestation · 42d',[{name:'Fever',level:'act'},{name:'Appetite',icon:'trend-down',level:'watch'}]],['000267','Gestation · 42d',[{name:'Thin',level:'watch'}]],['000281','Gestation · 46d',[{name:'Arthritis',level:'ongoing'}]],['000254','Gestation · 40d',[]]].map(([code,description,tags])=>({code,description,contextWidth:'112px',right:{kind:'tags',tags}}));
const open=(name,lang,o)=>{
 const b=BARNS[name],t=lang==='zh'?ZH:EN;
 const peek=code=>UI.penPeek({title:code,meta:lang==='zh'?'2头母猪':'2 sows',rows:peekRows});
 const body=UI.penMap(Object.assign({},b,{action:'pick',key:'pm-'+name+lang,entrance:t.entrance,labels:t.labels,peek},o||{}));
 return UI.sheet({surface:'menu',size:'long',title:lang==='zh'?'栏位图':'Pen map',label:'Pen map',line:{key:UI.penMapKey({pens:b.pens,words:t.legend})},body,footer:UI.penMapFooter({back:{action:'back',label:lang==='zh'?'返回':'Back'},depth:b.depth,label:lang==='zh'?'跳转栏位':'Jump to pens'})});
};
const R={
 unit7:()=>open('unit7','en'),
 pressed:()=>open('unit7','en'),
 peek:()=>open('unit7','en'),
 peektags:()=>open('unit7','en',{pens:{C1:'plain',C2:'act',D4:'plain'},current:'C1'}),
 filtered:()=>open('filtered','en'),
 empty:()=>open('empty','en'),
 b60:()=>open('b60','en'),b100:()=>open('b100','en'),b160:()=>open('b160','en'),b8:()=>open('b8','en'),
 zh7:()=>open('unit7','zh'),zh100:()=>open('b100','zh')
};
document.querySelectorAll('[data-state]').forEach(el=>{
 const k=el.getAttribute('data-demo');el.querySelector('.bg').innerHTML=bg(k);el.querySelector('.over').innerHTML=R[k]();
 if(k==='pressed')el.querySelector('.st-pen-tile[data-pen="B2"]').setAttribute('data-preview','pressed');
 if(k==='peek'){
  const card=el.querySelector('.st-pen-peek'),t=el.querySelector('.st-pen-tile[data-pen="B3"]');
  card.innerHTML=UI.penPeek({title:'B3',meta:'2 sows',rows:peekRows});card.dataset.at='bottom';card.hidden=false;
 }
 if(k==='peektags'){
  const card=el.querySelector('.st-pen-peek');
  card.innerHTML=UI.penPeek({title:'C2',meta:'30 pigs',rows:tagRows,more:'+26 more'});card.dataset.at='bottom';card.hidden=false;UI.rowFitTags(card);
 }
});
</script></body></html>
