<script type="text/babel" src="screens/AnimalsScreen.jsx"></script>
<script type="text/babel">
function Frame({tab,children}){
  const {BottomNav}=window.SentriDesignSystem_44ba05;
  return <React.Fragment>
    <div>{children}</div>
    <BottomNav value={tab} onChange={()=>{}} items={[{value:'today',label:'Today',icon:'clipboard-list',badge:2},{value:'animals',label:'Animals',icon:'tag'}]}/>
  </React.Fragment>;
}
(function mount(n){
  if(!window.SentriDesignSystem_44ba05){
    if(n>50){['root-today','root-unit','root-animals'].forEach(id=>{document.getElementById(id).innerHTML='<div style="padding:24px;font:15px/1.45 sans-serif;color:#757067">Design-system bundle (_ds_bundle.js) not found — recompile the design system and reload.</div>';});return;}
    window.setTimeout(()=>mount(n+1),100);return;
  }
  ReactDOM.createRoot(document.getElementById('root-today')).render(<Frame tab="today"><TodayScreen mode="task" setMode={()=>{}} onOpenUnit={()=>{}}/></Frame>);
  ReactDOM.createRoot(document.getElementById('root-unit')).render(<Frame tab="today"><UnitScreen task="Pregnancy check" onBack={()=>{}} showToast={()=>{}}/></Frame>);
  ReactDOM.createRoot(document.getElementById('root-animals')).render(<Frame tab="animals"><AnimalsScreen/></Frame>);
})(0);
</script>
