<!-- @dsCard group="Colors" viewport="700x190" name="Work status" subtitle="The fixed 5-state vocabulary — never decorative" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head><body style="padding:16px 20px;background:var(--paper)">
<div style="display:flex;gap:10px;flex-wrap:wrap">
<span style="background:var(--status-overdue);color:var(--status-overdue-ink);font:var(--text-label);padding:6px 12px;border-radius:var(--radius-full)">Overdue</span>
<span style="background:var(--status-due);color:var(--status-due-ink);font:var(--text-label);padding:6px 12px;border-radius:var(--radius-full)">Due now</span>
<span style="background:var(--status-upcoming-bg);color:var(--status-upcoming-text);font:var(--text-label);padding:6px 12px;border-radius:var(--radius-full);border:1px solid var(--blue-100)">Upcoming</span>
<span style="background:var(--status-done-bg);color:var(--status-done-text);font:var(--text-label);padding:6px 12px;border-radius:var(--radius-full);border:1px solid var(--green-100)">Done</span>
<span style="background:var(--status-blocked-bg);color:var(--status-blocked-text);font:var(--text-label);padding:6px 12px;border-radius:var(--radius-full)">Blocked</span>
<span style="background:var(--paper);color:var(--ink-3);font:var(--text-label);padding:6px 12px;border-radius:var(--radius-full);border:1px dashed var(--neutral-300)">No status</span>
</div>
<div style="margin-top:14px;font:var(--text-caption);color:var(--ink-3);line-height:1.5">Overdue and due-now are filled (loudest). Upcoming and done are tinted. Missing information gets a dashed outline — never rendered as zero.<br>One accent rule: nothing else on a screen may be amber or red.</div>
</body></html>
