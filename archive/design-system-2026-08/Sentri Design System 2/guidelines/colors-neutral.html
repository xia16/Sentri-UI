<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;background:var(--paper)">
<div style="display:flex;height:110px">

<div style="flex:1;background:var(--neutral-50);padding:10px;font:var(--text-caption)">50 · app bg<br>#f5f6f3</div>
<div style="flex:1;background:var(--neutral-100);padding:10px;font:var(--text-caption)">100 · sunken<br>#edeeea</div>

<div style="flex:1;background:var(--neutral-400);color:#fff;padding:10px;font:var(--text-caption)">400 · disabled<br>#a0a49b</div>

<div style="padding:8px 12px;font:var(--text-caption);color:var(--ink-3)">Cool-neutral ramp. Cards are pure #fff on the near-white app background.</div>
</body></html>
